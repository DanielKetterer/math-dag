# Concept registry. Every node's `concept` and `facet` must appear here.
# Facets are the distinct meanings a concept carries. `core` is the default
# for concepts with a single meaning.

counting:
  name: Counting
  facets: [core]

number-line:
  name: The number line
  facets: [core]

partitioning:
  name: Partitioning into equal parts
  facets: [area, length, set]

multiplication:
  name: Multiplication
  facets: [equal-groups, array-area, scaling]

division:
  name: Division
  facets: [partitive, measurement, unknown-factor]

fraction:
  name: Fractions
  facets: [part-whole, measure, quotient, ratio, operator]

ratio:
  name: Ratio and rate
  facets: [composed-unit, multiplicative-comparison, unit-rate]

proportional-relationship:
  name: Proportional relationships
  facets: [core]

slope:
  name: Slope
  facets: [core]
