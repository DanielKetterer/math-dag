<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Math Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: graph-paper canvas on the left, a reading panel on the right; stacks on phones. */
:root {
  --paper: #f6f8fa;
  --grid: #e3e9ef;
  --surface: #ffffff;
  --ink: #1d2733;
  --ink-soft: #566476;
  --rule: #d5dde6;
  --accent: #2a5bd7;
  --accent-soft: #e4ecfd;
  --dispute: #c2621b;
  --dispute-soft: #fcefe3;
  --up: #2a5bd7;
  --down: #8a3fb8;
  --outside: #9aa6b4;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171e; --grid: #1c232d; --surface: #182029; --ink: #e3e9f0; --ink-soft: #9aa8b8;
    --rule: #2b3542; --accent: #7aa2ff; --accent-soft: #1d2a47; --dispute: #f0a25e; --dispute-soft: #3a2a1b;
    --up: #7aa2ff; --down: #c592ea; --outside: #5d6a79; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171e; --grid: #1c232d; --surface: #182029; --ink: #e3e9f0; --ink-soft: #9aa8b8;
  --rule: #2b3542; --accent: #7aa2ff; --accent-soft: #1d2a47; --dispute: #f0a25e; --dispute-soft: #3a2a1b;
  --up: #7aa2ff; --down: #c592ea; --outside: #5d6a79; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand .sub { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search input {
  width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--paper); color: var(--ink); font: inherit;
}
.search input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results {
  position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12);
  max-height: 320px; overflow-y: auto;
}
.results li { padding: 6px 8px; border-radius: 4px; cursor: pointer; display: grid; gap: 1px; }
.results li[aria-selected="true"], .results li:hover { background: var(--accent-soft); }
.results .rid { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--ink-soft); }
.controls select { font: inherit; font-size: 13px; padding: 3px 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
.controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
button.btn {
  font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
}
button.btn:hover { border-color: var(--accent); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
main.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); min-height: 0; }
.stage { position: relative; min-height: 0; min-width: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
#cy { position: absolute; inset: 0; }
.crumb {
  position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; font-size: 13px; max-width: calc(100% - 24px);
}
.crumb b { font-weight: 700; }
.legend {
  position: absolute; left: 12px; bottom: 12px; z-index: 5; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-soft); display: grid; gap: 6px; max-width: calc(100% - 24px);
}
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 3px; }
.line { display: inline-block; width: 24px; height: 0; border-top: 2px solid var(--ink-soft); vertical-align: middle; margin-right: 4px; }
.line.dash { border-top-style: dashed; border-color: var(--dispute); }
.line.dot { border-top-style: dotted; }
aside.panel { border-left: 1px solid var(--rule); background: var(--surface); overflow-y: auto; min-height: 0; min-width: 0; }
.panel-inner { padding: 18px; display: grid; gap: 16px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.2; text-wrap: balance; }
.mono { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-soft); white-space: nowrap; }
.chip.grade { color: var(--ink); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 4px; font-weight: 700; }
.panel p { margin: 0; }
ol.steps { margin: 0; padding-left: 20px; }
.assess { padding: 10px 12px; border: 1px dashed var(--rule); border-radius: 6px; font-style: italic; }
.route { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.route-head { padding: 8px 12px; background: var(--paper); font-size: 13px; display: grid; gap: 2px; }
.route-head b { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.edge { padding: 10px 12px; border-top: 1px solid var(--rule); display: grid; gap: 4px; font-size: 14px; }
.edge.disputed { background: var(--dispute-soft); }
.edge .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; justify-content: space-between; }
a.jump { color: var(--accent); text-decoration: none; font-weight: 700; cursor: pointer; }
a.jump:hover { text-decoration: underline; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-soft); white-space: nowrap; }
.pill.disputed { border-color: var(--dispute); color: var(--dispute); }
.why { color: var(--ink); }
.critic { font-size: 13px; color: var(--ink-soft); }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.empty { color: var(--ink-soft); }
.intro { display: grid; gap: 12px; }
.intro h2 { font-size: 24px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.stat .n { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .t { font-size: 12px; color: var(--ink-soft); }
@media (max-width: 760px) {
  .app { height: auto; }
  main.split { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 360px; }
  aside.panel { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>School Math Map</h1><span class="sub" id="sub"></span></div>
    <div class="search">
      <input id="q" type="search" placeholder="Find a skill: slope, unit fraction, 4.NF.B.3" autocomplete="off" aria-label="Find a skill" aria-controls="results">
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>
    <div class="controls">
      <label><input type="checkbox" id="t-disputed" checked> Disputed links</label>
      <label><input type="checkbox" id="t-outside"> Skills outside the slice</label>
      <label>Chain depth <select id="depth"><option value="1">1 step</option><option value="2" selected>2 steps</option><option value="3">3 steps</option><option value="99">all</option></select></label>
      <button class="btn" id="b-all" type="button">Whole map</button>
    </div>
  </header>
  <main class="split">
    <section class="stage" aria-label="Prerequisite graph">
      <div id="cy"></div>
      <div class="crumb" id="crumb" hidden></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel" aria-live="polite"><div class="panel-inner" id="panel"></div></aside>
  </main>
</div>

]}],"related":[],"root":"","outside":false},{"id":"addition.add-to.number-line","name":"Represent a whole-number sum on a number line","concept":"addition","facet":"add-to","level":2,"type":"representation","statement":"The sum a + b is shown on a number line by placing a length of b units end to end after the length from 0 to a; the endpoint is a + b.","procedure":["Mark the length from 0 to a.","From a, mark a further length of b units to the right, in one jump or in smaller jumps that total b.","Read the label at the endpoint; it is a + b."],"assess":"Show 38 + 25 on a number line and find the sum.","ccss":["2.MD.B.6"],"grade":2,"routes":[{"clause":"standard","note":"","edges":[{"node":"number-line.whole-number-lengths","relation":"representational","status":"proposed","task":false,"why":"Step 1 marks the length from 0 to a, which is the whole number a shown as a length on the line.","critic":"necessary","by":["P","Q"]},{"node":"measurement.length.no-gaps-overlaps","relation":"definitional","status":"proposed","task":false,"why":"Placing the length b end to end after the length a relies on lengths joining with no gaps and no overlaps.","critic":"necessary","by":["P"]},{"node":"addition.whole-number","relation":"definitional","status":"proposed","task":false,"why":"The model must represent the meaning of a + b as the total from joining a and b, and the endpoint is read as the sum.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"addition.application.add-to-story","name":"Solve add-to story problems with objects","concept":"addition","facet":"add-to","level":1,"type":"application","statement":"A story tells of a starting amount and an amount added to it and asks for the result; the learner acts the story out with objects or fingers and finds how many there are in all.","procedure":[],"assess":"'Mia has 2 stickers. Her friend gives her 3 more stickers. How many stickers does Mia have now?' (counters available). Credit 5.","ccss t":"Seeing two objects as alike or different is a basic perceptual judgment that needs no earlier skill in this map.","outside":false},{"id":"classifying.attribute.identify","name":"Name the attribute a group of objects shares","concept":"classifying","facet":"attribute","level":1,"type":"concept","statement":"Given a group of objects chosen because they share one attribute, such as color, shape, or size, name that attribute and add another object that has it.","procedure":[],"assess":"Show a red block, a red car, and a red crayon (each a different kind of object). 'How are these all alike? Find one more thing from this basket that belongs with them.' Credit 'they are red' and a red object added.","ccss":[],"grade":null,"routes":[{"clause":"standard","note":"","edges":[{"node":"classifying.alike","relation":"definitional","status":"proposed","task":false,"why":"Naming the attribute a group shares starts from seeing that the objects are alike, then saying in what way.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"classifying.sort.given-attribute","name":"Sort objects by a given attribute","concept":"classifying","facet":"attribute","level":1,"type":"procedure","statement":"Separate a collection into groups by a stated attribute, placing every object in the group that matches its value of that attribute and keeping to that one attribute throughout.","procedure":["Make one place for each value of the stated attribute (for example, one tray per color).","Take each object in turn and put it in the place for its value of that attribute.","Continue until every object is placed."],"assess":"Give the child a mixed pile of 12 buttons in three colors and two sizes. 'Sort these buttons by color.' Credit three groups, each a single color, containing every button, with sizes mixed within groups.","ccss":["K.MD.B.3"],"grade":0,"routes":[{"clause":"standard","note":"","edges":[{"node":"classifying.attribute.identify","relation":"definitional","status":"proposed","task":false,"why":"Sorting by a stated attribute such as color requires treating color as one attribute with separate values and ignoring the other attributes like size.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"comparing.count.by-counting","name":"Compare two sets by counting","concept":"comparing","facet":"count","level":1,"type":"procedure","statement":"Decide which of two collections has more objects, or whether they have the same number, by counting each collection and comparing the two counts; the one whose count comes later in the number sequence has more, whatever the size or spread of the objects.","procedure":["Count the first collection and remember its number.","Count the second collection and remember its number.","If the numbers are the same, the collections are equal; otherwise the collection whose number comes later in the count sequence has more."],"assess":"Show 6 small buttons and 4 large blocks, the blocks spread so their row is longer. 'Are there more buttons or more blocks? Count to find out.' Credit 'more buttons' supported by counts of 6 and 4.","ccss":["K.CC.C.6"],"grade":0,"routes":[{"clause":"via-successor","note":"","edges":[{"node":"counting.objects","relation":"procedural","status":"proposed","task":false,"why":"Steps one and two count each collection to get its number, and the test problem counts six buttons and four blocks.","critic":"necessary","by":["P","Q"]},{"node":"counting.sequence.recite","relation":"procedural","status":"proposed","task":false,"why":"Step three decides which number comes later in the count sequence, which requires knowing the order of the number words.","critic":"necessary","by":["P","Q"]},{"node":"counting.successor","relation":"definitional","status":"disputed","task":false,"why":"The collection with the later count has more only because each next number word names exactly one more than the word before it.","critic":"route-only: 'Later in  the first copy of the unit with one end of the object.","Place each next copy so it starts exactly where the previous one ends, in a straight line along the object, with no gap and no overlap.","Stop when a copy reaches the other end of the object.","Count the copies; that whole number is the length in that unit."],"assess":"Use copies of this paper clip to find how long the marker is, in paper clips.","ccss":["1.MD.A.2"],"grade":1,"routes":[{"clause":"standard","note":"","edges":[{"node":"measurement.length.no-gaps-overlaps","relation":"definitional","status":"proposed","task":false,"why":"Step 2 places each copy exactly where the previous one ends, with no gap and no overlap, which is the meaning of length.","critic":"necessary","by":["P","Q"]},{"node":"counting.objects","relation":"procedural","status":"proposed","task":false,"why":"Step 4 counts the copies to get the whole-number length.","critic":"necessary","by":["P","Q"]},{"node":"comparing.size.direct","relation":"definitional","status":"proposed","task":false,"why":"The unit is shorter than the object and the last copy reaches or overhangs the end, which is judged by direct comparison.","critic":"necessary","by":["Q"]}]}],"related":[],"root":"","outside":false},{"id":"measurement.length.no-gaps-overlaps","name":"Length as the number of units that span an object","concept":"measurement","facet":"length","level":1,"type":"concept","statement":"The length of an object in a given unit is the number of same-size copies of that unit that span it end to end with no gaps and no overlaps.","procedure":[],"assess":"Mia laid paper clips along a pencil with spaces between them and counted 5. Is the pencil 5 paper clips long? Why or why not?","ccss":["1.MD.A.2"],"grade":1,"routes":[{"clause":"standard","note":"","edges":[{"node":"counting.objects","relation":"definitional","status":"proposed","task":false,"why":"The length is the number of unit copies, which is found by counting them.","critic":"necessary","by":["P","Q"]},{"node":"comparing.size.direct","relation":"definitional","status":"proposed","task":false,"why":"Spanning the object end to end with same-size copies uses direct comparison of lengths to match endpoints and unit sizes.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.array-area.fraction-product.represent","name":"Represent a fraction product as a rectangular area","concept":"multiplication","facet":"array-area","level":2,"type":"representation","statement":"The product (a/b) x (c/d) is shown as the area of an a/b-by-c/d rectangle drawn inside a unit square whose sides are partitioned into b and d equal parts.","procedure":["Draw a unit square.","Partition one side into b equal parts and the other side into d equal parts, making b x d small rectangles.","Shade the rectangle that is a parts by c parts; it holds a x c small rectangles, so its area is (a x c)/(b x d)."],"assess":"Draw an area model for (2/3) x (3/4) and use it to name the product.","ccss":["5.NF.B.4.b"],"grade":5,"routes":[{"clause":"standard","note":"","edges":[{"node":"partitioning.equal-shares.area","relation":"procedural","status":"proposed","task":false,"why":"Step 2 partitions the sides of the unit square into b and d equal parts.","critic":"necessary","by":["P","Q"]},{"node":"fraction.non-unit.part-whole","relation":"procedural","status":"proposed","task":false,"why":"Step 3 shades a of the b parts along one side and c of the d parts along the other.","critic":"necessary","by":["P","Q"]},{"node":"area.rectangle.tiling","relation":"procedural","status":"proposed","task":false,"why":"Step 3 counts the a x c small rectangles in the shaded array, as rows times columns.","critic":"necessary","by":["P","Q"]},{"node":"fraction.unit.part-whole","relation":"definitional","status":"proposed","task":false,"why":"Each small rectangle is one of the b x d equal parts of the unit square, so its area is 1/(b x d).","critic":"necessary","by":["P","Q"]}]}],"related":[{"node":"fraction.multiplication.parts-of-partition.fraction","relation":"same_idea_different_form","note":"The target defines the product as the area of an a/b-by-c/d rectangle (array-area meaning); the parts-of-partition meaning is the operator version of the same product, not needed to draw the area model."}],"root":"","outside":false},{"id":"multiplication.array-area.fraction-sides.explain","name":"Explain why tiling and multiplying give the same area","concept":"multiplication","facet":"array-area","level":4,"type":"justification","statement":"With both sides written as p/n and q/n, tiling gives p x q squares of area 1/(n x n), an area of (p x q)/(n x n), which is exactly (p/n) x (q/n) by the product rule; so for any fractional side lengths the two methods agree.","procedure":[],"assess":"Explain why tiling a 2/3-by-4/5 rectangle with small squares gives the same area as computing (2/3) x (4/5), and why the same argument works for any fractional side lengths.","ccss":["5.NF.B.4.b"],"grade":5,"routes":[{"clause":"standard","note":"","edges":[{"node":"multiplication.array-area.fraction-sides.tiling","relation":"justificatory","status":"proposed","task":false,"why":"The explanation uses the tiling count of p x q squares each of area 1/(n x n).","critic":"necessary","by":["P","Q"]},{"node":"fraction.multiplication.product-rule","relation":"justificatory","status":"proposed","task":false,"why":"The explanation shows (p x q)/(n x n) is exactly (p/n) x (q/n) by the product rule.","critic":"necessary","by":["P","Q"]},{"node":"multiplication.array-area.fraction-sides.multiply","relation":"definitional","status":"proposed","task":false,"why":"The statement compares the tiling area with the area found by multiplying side lengths.","critic":"necessary","by":["P","Q"]},{"node":"fraction.equivalent.multiply-principle","relation":"justificatory","status":"proposed","task":false,"why":"The argument for any side lengths relies on rewriting both fractions over a common denominator n by the multiplication principle.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.array-area.fraction-sides.multiply","name":"Find the area of a fraction-sided rectangle by multiplying side lengths","concept":"multiplication","facet":"array-area","level":3,"type":"procedure","statement":"The area of a rectangle with side lengths a/b and c/d is found by computing (a/b) x (c/d) with the product rule.","procedure":["Multiply the two side lengths with the product rule (a x c)/(b x d).","Label the result in square units."],"assess":"Find the area of a rectangle that is 3/5 m by 2/3 m.","ccss":["5.NF.B.4.b"],"grade":5,"routes":[{"clause":"standard","note":"","edges":[{"node":"fraction.multiplication.symbolic","relation":"procedural","status":"proposed","task":false,"why":"Step 1 multiplies the two side lengths using the product rule on fractions.","critic":"necessary","by":["P","Q"]},{"node":"area.rectangle.tiling","relation":"definitional","status":"disputed","task":false,"why":"Step 2 labels the result in square units, using area as side length times side length.","critic":"undecided: The procedure labels area in square units using area as side times side, which needs the rectangle-area formula. It is not clear whether area.rectangle.tiling (counting unit squares) includes the multiplicative formula.","by":["P","Q"]},{"node":"area.rectangle.length-times-width","relation":"definitional","status":"disputed","task":false,"why":"The procedure labels area as side times side; unclear whether area.rectangle.tiling includes the multiplicative area formula.","critic":"missing prerequisite","by":[]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.array-area.fraction-sides.tiling","name":"Find the area of a fraction-sided rectangle by tiling with unit-fraction squares","concept":"multiplication","facet":"array-area","level":2,"type":"procedure","statement":"Find the area of a rectangle with fractional side lengths by rewriting both sides over a common denominator n, tiling the rectangle with squares of side 1/n, and counting squares, each of area 1/(n x n).","procedure":["Rewrite both side lengths over a common denominator n, as p/n and q/n.","Tile the rectangle with squares of side 1/n: p along one side and q along the other.","Note that n x n such squares fill a unit square, so each has area 1/(n x n).","Count the p x q squares; the area is (p x q)/(n x n) square units."],"assess":"A rectangle is 3/4 m by 1/2 m. Tile it with squares of side 1/4 m and find its area.","ccss":["5.NF.B.4.b"],"grade":5,"routes":[{"clause":"standard","note":"","edges":[{"node":"factors-multiples.whole-number","relation":"procedural","status":"disputed","task":false,"why":"Step 1 needs a common denominator n for the two side lengths, found as a common multiple of the denominators.","critic":"route-only: A common denominator for two side lengths can be taken to be the product of the denominators; factors and multiples are only needed for a smaller one.","by":["P","Q"]},{"node":"fraction.equivalent.multiply-principle.generate","relation":"procedural","status":"disputed","task":false,"why":"Step 1 rewrites each side length as an equivalent fraction p/n or q/n.","critic":"route-only: At level 2, the equivalent fractions can be produced with a model rather than the symbolic rule.","by":["P"]},{"node":"fraction.multiple-of-unit","relation":"procedural","status":"disputed","task":false,"why":"Step 2 uses that a side of length p/n is p copies of the unit fraction 1/n, so p squares fit along it.","critic":"route-only: That a side p/n holds p squares of side 1/n is one expression of p/n as p copies of 1/n; the same fact is available from other forms.","by":["P"]},{"node":"fraction.unit.part-whole","relation":"definitional","status":"proposed","task":false,"why":"Step 3 shows each small square is one of n x n equal parts of the unit square, so its area is 1/(n x n).","critic":"necessary","by":["P","Q"]},{"node":"area.rectangle.tiling","relation":"procedural","status":"proposed","task":false,"why":"Step 4 counts the p x q squares in the rectangle as rows times columns, as in finding area by tiling.","critic":"necessary","by":["P","Q"]},{"node":"fraction.equivalent.simple.generate","relation":"procedural","status":"disputed","task":false,"why":"Step 1 rewrites each side length as an equivalent fraction over n, such as 1/2 as 2/4.","critic":"route-only: Model-based generation covers only simple denominators; the symbolic rule is the alternative for general ones.","by":["Q"]},{"node":"fraction.non-unit.unit-sum","relation":"procedural","status":"disputed","task":false,"why":"Step 2 lays p squares along a side of length p/n, because p/n is a sum of p unit fractions 1/n.","critic":"route-only: The unit-sum form is one of several statements of the same fact: p/n is p copies of 1/n.","by":["Q"]},{"node":"fraction.non-unit.part-whole","relation":"definitional","status":"disputed","task":false,"why":"This is the direct source of 'p/n is p parts of size 1/n'; the proposed unit-multiple and unit-sum edges are alternative statements of the same fact.","critic":"missing prerequisite","by":[]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.equal-groups.expression-to-situation","name":"Match a multiplication expression to an equal-groups situation","concept":"multiplication","facet":"equal-groups","level":2,"type":"representation","statement":"Given a x b, identify or describe a situation with a groups of b objects each whose total the expression gives.","procedure":[],"assess":"Which story is about 4 x 6? (A) 4 bags with 6 apples in each bag. (B) 4 apples and 6 more apples. (C) 6 apples shared among 4 bags.","ccss":["3.OA.A.1"],"grade":3,"routes":[{"clause":"standard","note":"","edges":[{"node":"multiplication.equal-groups.meaning","relation":"definitional","status":"proposed","task":false,"why":"The learner must read a x b as a groups of b objects each in order to pick or invent the matching situation.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.equal-groups.make","name":"Make small groups of a given size","concept":"multiplication","facet":"equal-groups","level":1,"type":"procedure","statement":"From a set of objects, make groups that each contain the same given number of objects, one group at a time, until no full group can be made.","procedure":[],"assess":"'Put these blocks into towers of 3 blocks each' (12 blocks). Credit 4 towers, each of exactly 3.","ccss":[],"grade":null,"routes":[{"clause":"standard","note":"","edges":[{"node":"counting.produce-set","relation":"definitional","status":"proposed","task":false,"why":"Each group of the given size, such as three blocks per tower, is made by counting out exactly that many objects from the supply.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.equal-groups.meaning","name":"A product as a number of equal groups","concept":"multiplication","facet":"equal-groups","level":2,"type":"concept","statement":"For whole numbers a and b, a x b is the total number of objects in a groups with b objects in each group.","procedure":[],"assess":"In 5 x 7 = 35, counting objects in groups, what does the 5 stand for, what does the 7 stand for, and what does the 35 stand for?","ccss":["3.OA.A.1"],"grade":3,"routes":[{"clause":"standard","note":"","edges":[{"node":"counting.objects","relation":"definitional","status":"proposed","task":false,"why":"The product is a total number of objects, and a and b are counts of groups and of objects in each group.","critic":"necessary","by":["P","Q"]},{"node":"addition.whole-number","relation":"definitional","status":"proposed","task":false,"why":"The total of a groups with b objects each is found by joining the groups, which is a sum of a equal addends.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.equal-groups.situation-to-expression","name":"Model an equal-groups situation and write a multiplication expression","concept":"multiplication","facet":"equal-groups","level":2,"type":"representation","statement":"Represent an equal-groups situation with objects or a drawing and write it as a x b, where a is the number of groups and b is the number in each group.","procedure":[],"assess":"There are 7 boxes with 3 crayons in each box. Draw a picture and write a multiplication expression for the total number of crayons.","ccss":["3.OA.A.1"],"grade":3,"routes":[{"clause":"standard","note":"","edges":[{"node":"multiplication.equal-groups.meaning","relation":"representational","status":"proposed","task":false,"why":"Writing a x b for 7 boxes of 3 crayons requires knowing a is the number of groups and b the number in each group.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"multiplication.scaling.compare-without-computing","name":"Compare a product with a factor without multiplying","concept":"multiplication","facet":"scaling","level":3,"type":"procedure","statement":"Decide whether a product of positive numbers is greater than, equal to, or less than one factor by comparing the other factor with 1, without performing the multiplication.","procedure":["Pick the factor q to compare the product with; call the other factor f.","Compare f with 1.","Conclude: the product is greater than q if f > 1, equal to q if f = 1, and less than q if f < 1."],"assess":"Without multiplying, put these in order from least to greatest: 225, (9/10) x 225, (11/8) x 225.","ccss":["5.NF.B.5.a"],"grade":5,"routes":[{"clause":"standard","note":"","edges":[{"node":"fraction.compare.benchmark","relation":"procedural","status":"proposed","task":false,"why":"Step 2 compares the factor f with 1, which is comparing a fraction with a benchmark.","critic":"necessary","by":["P","Q"]},{"node":"multiplication.scaling.size-principle","rela y":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"ratio.conversion-factor","name":"A conversion factor is a ratio of equal measurements","concept":"ratio","facet":"unit-rate","level":3,"type":"concept","statement":"A conversion factor is a ratio of two equal measurements in different units, such as 12 in : 1 ft, so multiplying a measurement by (12 in)/(1 ft) changes its unit without changing its size.","procedure":[],"assess":"To change 5 ft to inches, should you multiply by (12 in)/(1 ft) or by (1 ft)/(12 in)? Why does the length stay the same?","ccss":["6.RP.A.3.d"],"grade":6,"routes":[{"clause":"standard","note":"","edges":[{"node":"ratio.composed-unit","relation":"definitional","status":"proposed","task":false,"why":"A conversion factor such as 12 in : 1 ft is a for-every relationship between two measurement units for the same length.","critic":"necessary","by":["P"]},{"node":"measurement.unit-conversion","relation":"definitional","status":"proposed","task":false,"why":"The two measurements in a conversion factor are equal amounts in different units, the equivalence 12 in = 1 ft used in unit conversion.","critic":"necessary","by":["P","Q"]},{"node":"multiplication.by-one","relation":"justificatory","status":"disputed","task":false,"why":"The length stays the same because the factor (12 in)/(1 ft) equals 1, and multiplying by 1 leaves a number unchanged.","critic":"route-only: Multiplying by a factor equal to 1 is the usual reason the size is unchanged; substituting equal measurements is the other.","by":["P","Q"]},{"node":"fraction.whole-number.as-fraction","relation":"justificatory","status":"disputed","task":false,"why":"The factor is a fraction with equal amounts on top and bottom, so it is a fraction form of the whole number 1.","critic":"route-only: Viewing the factor as a fraction form of 1 is one explanation of why size is unchanged; the other substitutes equal measurements.","by":["P"]},{"node":"ratio.unit-rate","relation":"representational vel":2,"type":"procedure","statement":"Compare ratios a:b and c:d by extending both tables to rows with the same value of the first quantity and comparing the values of the second quantity there.","procedure":["Make a table of equivalent ratios for each ratio.","Extend both tables until they share a value of the first quantity (a common multiple of a and c always works).","In those rows, the ratio with the larger second value has more of the second quantity per unit of the first."],"assess":"Mix A uses 3 cups of juice to 5 cups of water; Mix B uses 4 cups of juice to 7 cups of water. Use tables to decide which mix has more water for the same amount of juice.","ccss":["6.RP.A.3.a"],"grade":6,"routes":[{"clause":"standard","note":"","edges":[{"node":"ratio.table.make","relation":"procedural","status":"proposed","task":false,"why":"Making one table of equivalent ratios for each of the two ratios is the first step of the comparison.","critic":"necessary","by":["P","Q"]},{"node":"factors-multiples.whole-number","relation":"procedural","status":"proposed","task":false,"why":"A common multiple of the two first-quantity values guarantees that both tables reach a shared value of the first quantity.","critic":"necessary","by":["P","Q"]},{"node":"comparing.whole-numbers.symbols","relation":"procedural","status":"proposed","task":false,"why":"Deciding which ratio has more of the second quantity compares the two second-quantity values in the shared rows.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"ratio.table.make","name":"Make a table of equivalent ratios","concept":"ratio","facet":"composed-unit","level":2,"type":"procedure","statement":"From a ratio a:b, given directly or read from a description, build a table whose rows are pairs of whole-number values in equivalent ratios.","procedure":["Write the ratio a:b as the first row, one column per quantity.","For n = 2, 3, 4, ..., add the row (n x a) : (n x b)."],"assess":"A paint mix uses 2 cans of blue for every 3 cans of yellow. Make a table with four rows of equivalent ratios.","ccss":["6.RP.A.3.a"],"grade":6,"routes":[{"clause":"standard","note":"","edges":[{"node":"ratio.equivalent","relation":"definitional","status":"proposed","task":false,"why":"Each added row is a pair (n x a, n x b) that is an equivalent ratio of the first row, so the meaning of equivalent ratios defines the table.","critic":"necessary","by":["P","Q"]},{"node":"ratio.notation","relation":"procedural","status":"disputed","task":false,"why":"Writing the ratio a:b as the first row, with each quantity in its own column in the stated order, is the ratio notation.","critic":"route-only: Writing the first row from a ratio given as a:b uses the notation; if the ratio is given in words, the row is read from the for-every description.","by":["P","Q"]},{"node":"multiplication.facts.within-100","relation":"procedural","status":"proposed","task":false,"why":"Computing the products n x a and n x b for n = 2, 3, 4 uses single-digit multiplication facts.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"ratio.table.missing-value","name":"Find a missing value in a ratio table","concept":"ratio","facet":"composed-unit","level":2,"type":"procedure","statement":"Find a missing entry in a ratio table by multiplying both entries of a complete row by the same number, chosen to produce the known entry of the incomplete row.","procedure":["Pick a complete row (p, q) of the table.","In the incomplete row, take the known entry and divide it by the entry of the complete row in the same column; call the result n (n may be a fraction).","Multiply the other entry of the complete row by n to get the missing value."],"assess":"A ratio table has the row 4 : 6. Find the missing value in the row ? : 9.","ccss":["6.RP.A.3.a"],"grade":6,"routes":[{"clause":"standard","note":"","edges":[{"node":"ratio.equivalent","relation":"definitional","status":"proposed","task":false,"why":"Multiplying both entries of a complete row by the same number n gives an equivalent ratio, which is why the missing entry is correct.","critic":"necessary","by":["P","Q"]},{"node":"fraction.quotient.symbolic","relation":"procedural","status":"disputed","task":false,"why":"Dividing the known entry by the matching entry of the complete row gives n, which may be a fraction such as 9 divided by 6 equals 3/2.","critic":"route-only: The factor n as the fraction 9/6 = 3/2 is one representation; a decimal quotient 1.5 is the other.","by":["P","Q"]},{"node":"fraction.multiplication.symbolic","relation":"procedural","status":"disputed","task":false,"why":"Multiplying the other entry of the complete row by the fraction n, such as 4 x 3/2, is a fraction multiplication.","critic":"route-only: A fractional factor n is multiplied as a fraction; the alternative writes n as a decimal, or chooses a complete row so n is whole.","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"ratio.table.plot","name":"Plot the pairs of a ratio table on the coordinate plane","concept":"ratio","facet":"composed-unit","level":2,"type":"representation","statement":"Each row (x, y) of a ratio table is plotted as the point (x, y), with the first quantity on the horizontal axis and the second on the vertical axis.","procedure":["Label the horizontal axis with the first quantity and the vertical axis with the second.","For each row (x, y), plot the point x units right and y units up from the origin."],"assess":"Plot the pairs from this table of cups of rice to cups of water: 1:2, 2:4, 3:6, 4:8.","ccss":["6.RP.A.3.a"],"grade":6,"routes":[{"clause":"standard","note":"","edges":[{"node":"coordinate-plane.first-quadrant","relation":"procedural","status":"proposed","task":false,"why":"Plotting the point x units right and y units up from the origin is plotting a point in the first quadrant.","critic":"necessary","by":["P","Q"]}]}],"related":[],"root":"","outside":false},{"id":"ratio.tape-diagram","name":"Represent a ratio with a tape diagram","concept":"ratio","facet":"composed-unit","level":2,"type":"representation","statement":"A ratio a:b is drawn as two tapes made of a and b equal-size units; when a total or one quantity is known, dividing it by its number of units gives the unit size.","procedure":["Draw a tape of a equal units for the first quantity and a tape of b equal units for the second.","Mark the known amount on the units it covers (one tape, or both tapes for a total).","Divide the known amount by the number of units it covers to get the unit size.","Multiply the unit size by the number of units of the quantity asked for."],"assess":"The ratio of red to blue marbles is 3:5 and there are 40 marbles. Use a tape diagram to find how many are red.","ccss":["6.RP.A.3"],"grade":6,"routes":[{"clause":"standard","note":"","edges":[{"node":"ratio.composed-unit","relation":"representational","status":"proposed","task":false,"why":"The two tapes of a and b equal units draw the for-every relationship, with each unit standing for one share of the composite unit.","critic":"necessary","by":["P","Q"]},{"node":"division.partitive.meaning","relation":"definitional","status":"proposed","task":false,"why":"Dividing a known amount by its number of units to get the unit size is the sharing meaning of division, one equal share per unit.","critic":"necessary","by":["P","Q"]},{"node":"addition.whole-number","relation":"procedural","status":"proposed","task":false,"why":"When the known amount is a total, it covers both tapes, so the number of units covered is the sum a + b.","critic":"necessary","by":["P","Q"]},{"node":"division.multi-digit","relation":"procedural","status":"disputed","task":false,"why":"Dividing the known amount by the number of units it covers to get the unit size is a whole-number division of possibly large numbers.","critic":"undecided: The tape needs a whole-number quotient (known amount by number of units); the test uses 40 divided by 8, so the multi-digit algorithm is more than is required and no finer division node is indexed.","by":["P"]},{"node":"multiplication.equal-groups.meaning","relation":"procedural","status":"proposed","task":false,"why":"Step 4 multiplies the unit size by the number of units, which counts that many equal groups of the unit size.","critic":"necessary","by":["Q"]},{"node":"multiplication.facts.within-100","relation":"definitional","status":"disputed","task":false,"why":"Facts-level products and quotients suffice for the tape diagram; this is the finer prerequisite.","critic":"missing prerequisite","by":[]}]}],"related":[],"root":"","outside":false},{"id":"ratio.unit-rate.find","name":"Find a unit rate from a ratio of whole numbers","concept":"ratio","facet":"unit-rate","level":3,"type":"procedure","statement":"Find the unit rate of a ratio a:b, b not 0, by dividing a by b and naming the result in units of the first quantity per unit of the second.","procedure":["Identify the two quantities and which is 'per' which.","Divide the first quantity's value a by the second's value b.","Label the result as units of the first quantity per 1 unit of the second."],"assess":"A 12-pack of juice costs $9. Find the cost per can.","ccss":["6.RP.A.2"],"grade":6,"routes":[{"clause":"standard","note":"","edges":[{"node":"ratio.unit-rate","relation":"definitional","status":"proposed","task":false,"why":"The procedure computes the unit rate a/b, so the meaning of the unit rate as the first quantity per 1 unit of the second is used throughout.","critic":"necessary","by":["P","Q"]},{"node":"ratio.unit-rate.language","relation":"procedural","status":"proposed","task":false,"why":"Deciding which quantity is per which, and labeling the result as units per 1 unit, uses the per and for each rate language.","critic":"necessary","by":["P","Q"]},{"node":"decimal.operations","relation":"procedural","status":"disputed","task":false,"why":"Dividing the first value by the second often gives a decimal result, as <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("graph-data").textContent);
  const byId = new Map(DATA.nodes.map(n => [n.id, n]));
  const GRADE = ["#9b8bd6", "#f2c14e", "#d9c55a", "#a8cc6e", "#62b98a", "#36a3a0", "#3a86b0", "#4c63a8", "#5d4497", "#7a3a8c"];
  const GRADE_NAME = g => g === 0 ? "K" : g >= 9 ? "HS" : "Grade " + g;
  const SHAPE = { concept: "ellipse", procedure: "round-rectangle", representation: "diamond", fact: "tag",
                  justification: "hexagon", application: "round-pentagon", outside: "ellipse" };
  const TYPE_NAME = { concept: "concept", procedure: "procedure", representation: "representation",
                      fact: "fact", justification: "justification", application: "problem type" };

  // dependents and prerequisites, per edge
  const parents = new Map(), children = new Map();
  for (const n of DATA.nodes) { parents.set(n.id, []); children.set(n.id, []); }
  for (const e of DATA.edges) { parents.get(e.target).push(e); children.get(e.source).push(e); }

  const pilot = DATA.nodes.filter(n => !n.outside);
  const disputedCount = DATA.edges.filter(e => e.status === "disputed").length;
  document.getElementById("sub").textContent =
    `${pilot.length} skills · ${DATA.edges.length} links · equal shares to slope`;

  const state = { focus: null, selected: null, disputed: true, outside: false, depth: 2 };

  function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function styleSheet() {
    return [
      { selector: "node", style: {
        "shape": ele => SHAPE[ele.data("type")] || "ellipse",
        "background-color": ele => ele.data("outside") ? tok("--surface") : (ele.data("grade") == null ? tok("--outside") : GRADE[Math.min(ele.data("grade"), 9)]),
        "border-width": ele => ele.data("outside") ? 1.5 : 1, "border-color": ele => ele.data("outside") ? tok("--outside") : tok("--ink"),
        "border-style": ele => ele.data("outside") ? "dashed" : "solid",
        "width": 26, "height": 26, "label": "data(label)", "color": tok("--ink"),
        "font-family": "Atkinson Hyperlegible, Segoe UI, sans-serif", "font-size": 10,
        "text-wrap": "wrap", "text-max-width": 110, "text-valign": "bottom", "text-margin-y": 4,
        "text-background-color": tok("--paper"), "text-background-opacity": 0.85, "text-background-padding": 1,
        "min-zoomed-font-size": 7 } },
      { selector: "edge", style: {
        "width": 1.2, "curve-style": "bezier", "target-arrow-shape": "triangle", "arrow-scale": 0.8,
        "line-color": tok("--ink-soft"), "target-arrow-color": tok("--ink-soft"), "opacity": 0.55 } },
      { selector: "edge.disputed", style: { "line-style": "dashed", "line-color": tok("--dispute"), "target-arrow-color": tok("--dispute") } },
      { selector: "edge.task", style: { "line-style": "dotted" } },
      { selector: ".hidden", style: { "display": "none" } },
      { selector: ".faded", style: { "opacity": 0.12 } },
      { selector: "edge.hl", style: { "opacity": 1, "width": 2.2 } },
      { selector: "node.up", style: { "border-color": tok("--up"), "border-width": 3 } },
      { selector: "node.down", style: { "border-color": tok("--down"), "border-width": 3 } },
      { selector: "node.sel", style: { "border-color": tok("--accent"), "border-width": 5, "width": 34, "height": 34, "font-size": 12, "z-index": 10 } },
    ];
  }

  const elements = [];
  for (const n of DATA.nodes) elements.push({ group: "nodes", data: { id: n.id, label: n.name, grade: n.grade, type: n.type, outside: n.outside } });
  DATA.edges.forEach((e, i) => elements.push({ group: "edges", classes: [e.status === "disputed" ? "disputed" : "", e.task ? "task" : ""].join(" "),
    data: { id: "e" + i, source: e.source, target: e.target } }));

  const cy = cytoscape({ container: document.getElementById("cy"), elements, style: styleSheet(),
    wheelSensitivity: 0.25, minZoom: 0.08, maxZoom: 3 });
  const restyle = () => cy.style(styleSheet());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function edgeOn(e) { return state.disputed || e.status !== "disputed"; }
  function closure(start, dir, depth = 99) {
    const seen = new Set();
    let frontier = [start];
    for (let d = 0; d < depth && frontier.length; d++) {
      const next = [];
      for (const x of frontier) {
        for (const e of (dir === "up" ? parents.get(x) : children.get(x)) || []) {
          if (!edgeOn(e)) continue;
          const y = dir === "up" ? e.source : e.target;
          if (!state.outside && byId.get(y).outside) continue;
          if (!seen.has(y) && y !== start) { seen.add(y); next.push(y); }
        }
      }
      frontier = next;
    }
    return seen;
  }

  let up = new Set(), down = new Set(), upAll = 0, downAll = 0;
  function applyView(fit = true) {
    let visible;
    if (state.focus) {
      up = closure(state.focus, "up", state.depth); down = closure(state.focus, "down", state.depth);
      upAll = closure(state.focus, "up").size; downAll = closure(state.focus, "down").size;
      visible = new Set([state.focus, ...up, ...down]);
    } else {
      up = new Set(); down = new Set();
      visible = new Set(DATA.nodes.filter(n => state.outside || !n.outside).map(n => n.id));
    }
    cy.batch(() => {
      cy.elements().removeClass("hidden faded hl up down sel");
      cy.nodes().forEach(nd => { if (!visible.has(nd.id())) nd.addClass("hidden"); });
      cy.edges().forEach(ed => {
        const e = DATA.edges[+ed.id().slice(1)];
        if (!visible.has(e.source) || !visible.has(e.target) || !edgeOn(e)) ed.addClass("hidden");
      });
      if (state.focus) {
        up.forEach(id => cy.getElementById(id).addClass("up"));
        down.forEach(id => cy.getElementById(id).addClass("down"));
      }
    });
    const eles = cy.elements().not(".hidden");
    eles.layout({ name: "dagre", rankDir: "TB", nodeSep: 55, rankSep: 80, edgeSep: 8, ranker: "network-simplex",
      fit, padding: 70, animate: false }).run();
    if (state.selected) highlight(state.selected, false);
    renderCrumb();
  }

  function highlight(id, center = true) {
    cy.batch(() => {
      cy.elements().removeClass("faded hl sel");
      const nd = cy.getElementById(id);
      if (nd.empty() || nd.hasClass("hidden")) return;
      nd.addClass("sel");
      if (!state.focus) {
        const hood = nd.closedNeighborhood().not(".hidden");
        cy.elements().not(".hidden").not(hood).addClass("faded");
        nd.connectedEdges().not(".hidden").addClass("hl");
      }
    });
    if (center) {
      const nd = cy.getElementById(id);
      if (nd.nonempty() && !nd.hasClass("hidden")) cy.animate({ center: { eles: nd }, zoom: Math.max(cy.zoom(), 0.9) }, { duration: 250 });
    }
  }

  function select(id, opts = {}) {
    if (!byId.has(id)) return;
    state.selected = id;
    if (opts.focus) { state.focus = id; applyView(true); highlight(id, false); renderPanel(id); try { history.replaceState(null, "", "#" + id); } catch (e) {} return; }
    else {
      const nd = cy.getElementById(id);
      if (nd.hasClass("hidden")) { state.focus = id; applyView(true); }
    }
    highlight(id, !opts.focus);
    renderPanel(id);
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  function renderCrumb() {
    const el = document.getElementById("crumb");
    if (!state.focus) { el.hidden = true; return; }
    const n = byId.get(state.focus);
    el.hidden = false;
    el.innerHTML = "";
    const t = document.createElement("span");
    t.innerHTML = `Chain for <b></b>: <span style="color:var(--up)">${up.size} upstream</span> · <span style="color:var(--down)">${down.size} downstream</span>${state.depth < 99 ? ` <span style="color:var(--ink-soft)">(within ${state.depth} step${state.depth > 1 ? "s" : ""}; ${upAll} and ${downAll} in all)</span>` : ""}`;
    t.querySelector("b").textContent = n.name;
    const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "Whole map";
    b.onclick = showAll;
    el.append(t, b);
  }

  function showAll() { state.focus = null; applyView(true); if (state.selected) highlight(state.selected, true); }

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const jump = id => `<a class="jump" data-id="${esc(id)}" tabindex="0">${esc(byId.get(id) ? byId.get(id).name : id)}</a>`;

  function renderPanel(id) {
    const n = byId.get(id), p = document.getElementById("panel");
    const deps = (children.get(id) || []).map(e => e.target);
    const gradeChip = n.grade != null ? `<span class="chip grade"><span class="swatch" style="background:${GRADE[Math.min(n.grade, 9)]}"></span>${GRADE_NAME(n.grade)}</span>` : "";
    let html = `<div><h2>${esc(n.name)}</h2><div class="mono">${esc(n.id)}</div></div>`;
    if (n.outside) {
      html += `<div class="chips"><span class="chip">outside the slice</span></div><p>${esc(n.statement)}</p>
        <p class="empty">Not written yet. Other skills point to it as a prerequisite.</p>`;
    } else {
      html += `<div class="chips">${gradeChip}<span class="chip">level ${n.level}</span><span class="chip">${esc(TYPE_NAME[n.type] || n.type)}</span>
        <span class="chip">${esc(n.concept)} · ${esc(n.facet)}</span>${n.ccss.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
        <div><p class="label">What it is</p><p>${esc(n.statement)}</p></div>`;
      if (n.procedure.length) html += `<div><p class="label">Steps</p><ol class="steps">${n.procedure.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`;
      html += `<div><p class="label">Test problem</p><p class="assess">${esc(n.assess)}</p></div>`;
    }
    html += `<div><button class="btn primary" type="button" id="b-focus">Trace its chain</button></div>`;
    if (!n.outside) {
      html += `<div><p class="label">What it needs</p>`;
      if (!n.routes.length) html += `<p class="empty">Nothing in the map. ${esc(n.root)}</p>`;
      else {
        if (n.routes.length > 1) html += `<p class="critic" style="margin-bottom:8px">${n.routes.length} routes in. Any one route is enough.</p>`;
        html += `<div style="display:grid;gap:10px">` + n.routes.map((r, i) => `
          <div class="route"><div class="route-head"><span><b>${esc(r.clause)}</b>${n.routes.length > 1 ? ` · route ${i + 1}` : ""}</span>${r.note ? `<span>${esc(r.note)}</span>` : ""}</div>
          ${r.edges.map(e => `<div class="edge ${e.status === "disputed" ? "disputed" : ""}">
            <div class="top">${jump(e.node)}<span class="chips"><span class="pill">${esc(e.relation)}</span>${e.task ? `<span class="pill">test problem only</span>` : ""}<span class="pill ${e.status}">${esc(e.status)}</span></span></div>
            <div class="why">${esc(e.why)}</div>
            ${e.critic ? `<div class="critic">Critic: ${esc(e.critic)}</div>` : ""}</div>`).join("")}
          </div>`).join("") + `</div>`;
      }
      html += `</div>`;
    }
    html += `<div><p class="label">Needed by (${deps.length})</p>${deps.length ? `<ul class="plain">${deps.map(d => `<li>${jump(d)}</li>`).join("")}</ul>` : `<p class="empty">Nothing in the map depends on this yet.</p>`}</div>`;
    if (n.related.length) html += `<div><p class="label">Related, not prerequisite</p><ul class="plain">${n.related.map(r => `<li>${jump(r.node)} <span class="critic">(${esc(r.relation.replace(/_/g, " "))})</span></li>`).join("")}</ul></div>`;
    p.innerHTML = html;
    p.parentElement.scrollTop = 0;
    document.getElementById("b-focus").onclick = () => select(id, { focus: true });
  }

  function renderIntro() {
    const multi = pilot.filter(n => n.routes.length > 1).length;
    const roots = pilot.filter(n => !n.routes.length).length;
    document.getElementById("panel").innerHTML = `<div class="intro">
      <h2>How school math fits together</h2>
      <p>Each dot is one skill, from cutting a shape into equal shares (grade 1) to slope (grade 8). Arrows run from a prerequisite to the skill that needs it, so the map reads top to bottom.</p>
      <div class="stats">
        <div class="stat"><div class="n">${pilot.length}</div><div class="t">skills in the slice</div></div>
        <div class="stat"><div class="n">${DATA.edges.length}</div><div class="t">prerequisite links</div></div>
        <div class="stat"><div class="n">${multi}</div><div class="t">skills with more than one route in</div></div>
        <div class="stat"><div class="n">${disputedCount}</div><div class="t">links still disputed</div></div>
      </div>
      <p>Click a skill to read what it is, how it is tested, and exactly why it needs each prerequisite. <b>Trace its chain</b> shows everything upstream and downstream of it.</p>
      <p class="critic">Try: ${["fraction.unit.number-line", "fraction.division.symbolic", "slope.constant-on-line"].filter(i => byId.has(i)).map(jump).join(" · ") || jump(pilot[0].id)}</p>
    </div>`;
  }

  function renderLegend() {
    const grades = [...new Set(pilot.map(n => n.grade).filter(g => g != null))].sort((a, b) => a - b);
    const used = [...new Set(pilot.map(n => n.type))];
    const shapeGlyph = { concept: "●", procedure: "▢", representation: "◆", fact: "▶", justification: "⬢", application: "⬟" };
    document.getElementById("legend").innerHTML =
      `<div class="row">${grades.map(g => `<span><span class="swatch" style="background:${GRADE[Math.min(g, 9)]}"></span>${GRADE_NAME(g).replace("Grade ", "Gr ")}</span>`).join("")}</div>
       <div class="row">${used.map(t => `<span>${shapeGlyph[t] || "●"} ${TYPE_NAME[t] || t}</span>`).join("")}</div>
       <div class="row"><span><span class="line"></span>agreed</span><span><span class="line dash"></span>disputed</span><span><span class="line dot"></span>test problem only</span></div>`;
  }

  // events
  cy.on("tap", "node", ev => select(ev.target.id()));
  cy.on("dbltap", "node", ev => select(ev.target.id(), { focus: true }));
  cy.on("tap", ev => { if (ev.target === cy) { state.selected = null; cy.elements().removeClass("faded hl sel"); renderIntro(); } });
  document.getElementById("panel").addEventListener("click", ev => {
    const a = ev.target.closest("a.jump"); if (a) select(a.dataset.id);
  });
  document.getElementById("panel").addEventListener("keydown", ev => {
    const a = ev.target.closest("a.jump"); if (a && ev.key === "Enter") select(a.dataset.id);
  });
  document.getElementById("t-disputed").onchange = e => { state.disputed = e.target.checked; applyView(!state.focus ? true : true); };
  document.getElementById("t-outside").onchange = e => { state.outside = e.target.checked; applyView(true); };
  document.getElementById("b-all").onclick = showAll;
  document.getElementById("depth").onchange = e => { state.depth = +e.target.value; if (state.focus) applyView(true); };

  // search
  const q = document.getElementById("q"), res = document.getElementById("results");
  let hits = [], cursor = 0;
  function search(text) {
    const t = text.trim().toLowerCase();
    if (!t) { res.hidden = true; return; }
    const pool = DATA.nodes.filter(n => state.outside || !n.outside);
    hits = pool.map(n => {
      const hay = (n.name + " " + n.id + " " + n.ccss.join(" ") + " " + n.statement).toLowerCase();
      const score = n.name.toLowerCase().startsWith(t) ? 0 : n.name.toLowerCase().includes(t) ? 1 : n.ccss.some(c => c.toLowerCase().startsWith(t)) ? 1 : hay.includes(t) ? 2 : 9;
      return [score, n];
    }).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length).slice(0, 10).map(x => x[1]);
    cursor = 0; drawHits();
  }
  function drawHits() {
    res.innerHTML = hits.length ? hits.map((n, i) => `<li role="option" data-id="${esc(n.id)}" aria-selected="${i === cursor}"><span>${esc(n.name)}</span><span class="rid">${esc(n.id)}${n.ccss.length ? " · " + esc(n.ccss.join(", ")) : ""}</span></li>`).join("")
      : `<li class="empty">No skill matches. Try a word from its name or a standard code.</li>`;
    res.hidden = false;
  }
  q.addEventListener("input", () => search(q.value));
  q.addEventListener("keydown", ev => {
    if (res.hidden) return;
    if (ev.key === "ArrowDown") { cursor = Math.min(cursor + 1, hits.length - 1); drawHits(); ev.preventDefault(); }
    else if (ev.key === "ArrowUp") { cursor = Math.max(cursor - 1, 0); drawHits(); ev.preventDefault(); }
    else if (ev.key === "Enter" && hits[cursor]) { select(hits[cursor].id); res.hidden = true; q.blur(); }
    else if (ev.key === "Escape") res.hidden = true;
  });
  res.addEventListener("mousedown", ev => { const li = ev.target.closest("li[data-id]"); if (li) { ev.preventDefault(); select(li.dataset.id); res.hidden = true; } });
  q.addEventListener("blur", () => setTimeout(() => res.hidden = true, 120));

  renderLegend();
  applyView(true);
  const start = decodeURIComponent((location.hash || "").slice(1));
  if (byId.has(start)) select(start); else renderIntro();
})();
</script>
