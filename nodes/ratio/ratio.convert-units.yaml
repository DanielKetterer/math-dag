    points_to: procedure.2
    why: Choosing a factor with the current unit in the denominator and the next unit in the numerator
      uses what a conversion factor is.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.multiplication.symbolic
    relation: procedural
    points_to: procedure.3
