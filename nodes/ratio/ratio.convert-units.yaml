id: ratio.convert-units
concept: ratio
facet: unit-rate
level: 3
type: procedure
name: Convert measurement units with conversion factors
statement: Convert a measurement by multiplying it by one or more conversion factors, each written with
  the unit to remove in the denominator, and cancelling units like common factors.
procedure:
- Write the measurement with its unit.
- Multiply by a conversion factor whose denominator has the current unit and whose numerator has the next
  unit.
- Cancel the matching units and multiply the numbers.
- Repeat until the result is in the target unit.
assess: How many inches are in 2.5 yards? (1 yd = 3 ft, 1 ft = 12 in)
sources:
  ccss:
  - 6.RP.A.3.d
  learning_components:
  - 18baa937
