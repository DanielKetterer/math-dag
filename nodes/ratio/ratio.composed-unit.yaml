id: ratio.composed-unit
concept: ratio
facet: composed-unit
level: 2
type: concept
name: A ratio as 'for every a, there are b'
statement: A ratio relationship of a to b between two quantities means that for every a units of the first
  quantity there are b units of the second.
assess: The ratio of wings to beaks in the zoo bird house is 2:1. Describe what this means using 'for
  every'.
sources:
  ccss:
  - 6.RP.A.1
  learning_components:
  - '70393172'
requires:
- clause: standard
  all_of:
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: A ratio of a to b is a composite unit of a and b repeated, the way equal groups repeat the same
      number of objects.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: The statement and test problem are only the for-every pairing language (for every
        1 beak, 2 wings); the repeated composite unit (equal groups) is needed for extending ratios, which
        is later.'
    status: disputed
status: proposed
