id: ratio.composed-unit
concept: ratio
facet: composed-unit
level: 2
type: concept
name: A ratio as 'for every a, there are b'
statement: A ratio relationship of a to b between two quantities means that for every a units of the first
  quantity there are b units of the second.
assess: A picture shows 4 birds, each with 2 wings and 1 beak; no numbers or ratio notation are shown.
  'Describe how the number of wings and the number of beaks go together, using the words for every.' Credit
  'for every 2 wings there is 1 beak' or 'for every beak there are 2 wings'.
sources:
  ccss:
  - 6.RP.A.1
  learning_components:
  - '70393172'
requires:
- clause: standard
  all_of:
  - node: counting.unitize
    relation: definitional
    points_to: statement
    why: For every 2 wings there is 1 beak treats the 2 wings as one unit matched to each beak, so the
      learner must already count a group of objects as a single unit.
    evidence:
    - kind: review
      source: DK
      note: 'review-2026-10-19 add: Daniel, 2026-10-19 (after C66 left the node a root): the composed
        unit''s real prerequisite is unitizing, a new node written in the fixes run.'
    status: reviewed
  - node: counting.objects
    relation: definitional
    points_to: statement
    why: The relationship is stated in whole numbers of units, such as 2 wings and 1 beak, so the learner
      must know how many objects a counted whole number names.
    evidence:
    - kind: review
      source: DK
      note: 'review-2026-10-19 add: Daniel, 2026-10-19 (after C66 left the node a root).'
    status: reviewed
status: proposed
