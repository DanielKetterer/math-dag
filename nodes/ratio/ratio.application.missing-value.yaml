id: ratio.application.missing-value
concept: ratio
facet: composed-unit
level: 2
type: application
name: Solve ratio problems that give a ratio and one quantity
statement: A real-world or mathematical problem gives a ratio between two quantities and one value of
  one quantity; the learner uses ratio reasoning (table, tape diagram, double number line, or equation)
  to find the corresponding value.
assess: A recipe uses 3 cups of flour for every 2 eggs. How many cups of flour are needed for 10 eggs?
sources:
  ccss:
  - 6.RP.A.3
  learning_components:
  - c869a6c1
  - 5b9cd29a
requires:
- clause: via-make
  all_of:
  - node: ratio.composed-unit
    relation: definitional
    points_to: statement
    why: Interpreting a given ratio such as 3 cups of flour for every 2 eggs uses the for-every meaning
      of a ratio.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: ratio.equivalent
    relation: definitional
    points_to: statement
    why: Every method (table, tape, number line, equation) produces or uses equivalent ratios; none of
      the proposed edges states this directly.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: ratio.table.make
    relation: procedural
    points_to: statement
    why: The table route builds rows of equivalent ratios from the given ratio before looking for the
      known quantity.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Building a table of equivalent ratios is the table method, one of four. | other
        route: Double number line, tape diagram, or equation.'
    status: disputed
