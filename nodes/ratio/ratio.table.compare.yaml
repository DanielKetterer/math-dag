    relation: procedural
    points_to: procedure.1
    why: Making one table of equivalent ratios for each of the two ratios is the first step of the comparison.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiples.common-multiple
    relation: procedural
    points_to: procedure.2
    why: A common multiple of the two first-quantity values guarantees that both tables reach a shared
