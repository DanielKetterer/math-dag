id: ratio.double-number-line
concept: ratio
facet: composed-unit
level: 2
type: representation
name: Represent a ratio with a double number line
statement: A ratio relationship is drawn as two parallel number lines, one per quantity, with aligned
  tick marks at pairs of values in equivalent ratios, starting from 0 aligned with 0.
assess: A car travels 150 miles on 5 gallons. Use a double number line to find how far it travels on 2
  gallons.
sources:
  ccss:
  - 6.RP.A.3
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: ratio.equivalent
    relation: definitional
    points_to: statement
    why: The aligned tick marks mark pairs of values that are in equivalent ratios, which is what each
      pair on the lines shows.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: number-line.whole-number-lengths
    relation: representational
    points_to: statement
    why: Each of the two parallel lines is a number line with 0 at its start and values placed at their
      distances from 0.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.partial-quotients.one-digit-divisor
    relation: procedural
    points_to: assess
    why: Finding the distance for 2 gallons from 150 miles on 5 gallons means dividing 150 by 5 to mark
      1 gallon.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Dividing 150 by 5 to mark 1 gallon is demanded by the test problem; the representation
        itself is drawn with any marked pairs.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired division.multi-digit: 150 divided by 5 is a three-digit dividend
        over a one-digit divisor with no remainder.'
    status: proposed
status: proposed
