id: ratio.unit-rate
concept: ratio
facet: unit-rate
level: 3
type: concept
name: The unit rate a/b of a ratio a:b
statement: 'For a ratio a:b with b not 0, the unit rate is a/b: the amount of the first quantity for 1
  unit of the second.'
assess: The ratio of miles to hours for a trip is 150:4. What is the unit rate, and what does it mean?
sources:
  ccss:
  - 6.RP.A.2
  learning_components:
  - db4c25ad
requires:
- clause: via-equivalent
  all_of:
  - node: ratio.notation
    relation: representational
    points_to: assess
    why: The statement is about a ratio written a:b and gives the unit rate as the number a/b formed from
      its two terms.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement is about the number a/b; the colon notation matters only because
        the test problem is written 150:4.'
    status: proposed
  - node: decimal.division.by-whole.algorithm
    relation: procedural
    points_to: assess
    why: Finding the unit rate for 150:4 requires dividing 150 by 4 to get the decimal 37.5.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Dividing 150 by 4 to a decimal is demanded by the test problem; the rate can be
        left as 75/2.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.operations: 150 divided by 4 gives 37.5, a whole number divided
        by a one-digit number to a decimal. Claude: the source is symbolic (L3), so the skill is the 6.NS.B.3
        standard algorithm, a later-phase boundary id, not the L2 model node.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.division.algorithm: 150 divided by 4 = 37.5 divides by a
        whole number with a decimal quotient (task).'
    status: proposed
  - node: ratio.composed-unit
    relation: definitional
    points_to: statement
    why: The unit rate is the amount of the first quantity for 1 unit of the second, a for-every statement
      with the second quantity equal to 1.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: ratio.equivalent
    relation: definitional
    points_to: statement
    why: The unit rate is the equivalent ratio whose second quantity is exactly 1, so it is found by scaling
      a:b to (a/b):1.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The equivalent-ratio scaling to second term 1 is one derivation; sharing a equally
        among b is the other. | other route: Equal sharing of a among b units (fraction.quotient.equal-sharing,
        fraction.quotient.symbolic).'
    status: disputed
- clause: via-symbolic
  all_of:
  - node: ratio.notation
    relation: representational
    points_to: assess
    why: The statement is about a ratio written a:b and gives the unit rate as the number a/b formed from
      its two terms.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement is about the number a/b; the colon notation matters only because
        the test problem is written 150:4.'
    status: proposed
  - node: decimal.division.by-whole.algorithm
    relation: procedural
    points_to: assess
    why: Finding the unit rate for 150:4 requires dividing 150 by 4 to get the decimal 37.5.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Dividing 150 by 4 to a decimal is demanded by the test problem; the rate can be
        left as 75/2.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.operations: 150 divided by 4 gives 37.5, a whole number divided
        by a one-digit number to a decimal. Claude: the source is symbolic (L3), so the skill is the 6.NS.B.3
        standard algorithm, a later-phase boundary id, not the L2 model node.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.division.algorithm: 150 divided by 4 = 37.5 divides by a
        whole number with a decimal quotient (task).'
    status: proposed
  - node: ratio.composed-unit
    relation: definitional
    points_to: statement
    why: The unit rate is the amount of the first quantity for 1 unit of the second, a for-every statement
      with the second quantity equal to 1.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.quotient.symbolic
    relation: definitional
    points_to: statement
    why: The unit rate a/b is the quotient a divided by b written as a fraction, the amount of the first
      quantity for one unit.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: The number a/b as a divided by b is one way to get the amount per 1 unit; the
        other scales the ratio to a second term of 1. | other route: Scale a:b by 1/b to the equivalent
        ratio (a/b):1 (ratio.equivalent with fraction.multiple-of-unit).'
    status: disputed
status: proposed
