id: association.categorical.describe
concept: association
facet: categorical
level: 3
type: application
name: Use relative frequencies in a two-way table to describe an association
statement: Problems that give a two-way table of counts for two categorical variables and ask whether
  the data suggest an association, answered by comparing row (or column) relative frequencies and describing
  the association, if any, in context.
assess: Of 30 students with a curfew, 24 have chores and 6 do not. Of 10 students without a curfew, 3
  have chores and 7 do not. Is there evidence that students who have a curfew also tend to have chores?
  Support your answer with relative frequencies.
