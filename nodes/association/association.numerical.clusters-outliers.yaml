id: association.numerical.clusters-outliers
concept: association
facet: numerical
level: 2
type: concept
name: Clusters and outliers in a scatter plot
statement: In a scatter plot, a cluster is a group of points lying close together and separated from the
  other points by a gap, and an outlier is a point lying far from the overall pattern of the others.
assess: A scatter plot shows the points (1, 2), (2, 3), (3, 4), (4, 5), (8, 9), (9, 10), (10, 11), and
  (5, 15). Name the clusters and the outlier.
