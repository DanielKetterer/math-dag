id: association.numerical.direction
concept: association
facet: numerical
level: 2
type: concept
name: Positive, negative, and no association in a scatter plot
statement: Two quantities have a positive association when larger values of one tend to go with larger
  values of the other, a negative association when larger values of one tend to go with smaller values
  of the other, and no association when there is no such tendency; a tendency allows individual exceptions.
assess: In a scatter plot of hours of practice (x) and free throws missed (y) for 20 players, the points
  fall from the upper left to the lower right, though a few players who practiced more missed more than
  some who practiced less. Is the association positive, negative, or none? What does it say about practice
  and missed free throws?
