id: association.numerical.strength
concept: association
facet: numerical
level: 2
type: concept
name: Strong and weak linear association
statement: A linear association is strong when the points lie close to a line and weak when they are widely
  scattered about it; strength is separate from direction.
assess: Two scatter plots both show a positive linear association. In plot A every point is within 1 unit
  of a line through the data; in plot B many points are 10 or more units from any line through the data.
  Which shows the stronger association?
sources:
  ccss:
  - 8.SP.A.1
  learning_components:
  - bfb3223b
requires:
- clause: standard
  all_of:
  - node: association.numerical.form
    relation: definitional
    points_to: statement
    why: Strength is defined only for a linear association, whose points lie roughly along a straight
      line, so the statement uses that idea.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
related:
- node: association.numerical.direction
  relation: contrasts_with
  note: Direction and strength are independent attributes of an association; the statement says so, but
    judging closeness to a line does not need the direction concept.
status: proposed
