id: place-value.ten-more-less.explain
concept: place-value
facet: whole-number
level: 2
type: justification
name: Explain 10 more or 10 less with a model
statement: Finding 10 more or 10 less adds or removes one ten-rod (or moves one row on a hundred chart),
  so the tens change by one and the ones do not.
assess: Use base-ten blocks or a hundred chart to show why 10 more than 34 is 44.
