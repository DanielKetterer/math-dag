id: place-value.teen.equation
concept: place-value
facet: whole-number
level: 2
type: representation
name: Record a teen number as 10 plus ones with an equation
statement: A number from 11 to 19 shown as ten ones and some further ones is recorded by an equation that
  writes the number as 10 plus the further ones, for example 18 = 10 + 8.
assess: A full ten-frame and 3 more counters are shown, 13 counters in all. Write an equation that shows
  the ten and the extra ones making 13.
sources:
  ccss:
  - K.NBT.A.1
  learning_components:
  - b2046c2d
  - '17704693'
requires:
- clause: standard
  all_of:
  - node: place-value.teen.ten-and-ones
    relation: definitional
    points_to: statement
    why: The equation records the ten ones and the further ones that make up a teen number, as in 13 =
      10 + 3.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.notation.equation
    relation: representational
    points_to: statement
    why: The equation 13 = 10 + 3 is written with plus and equal signs in the same way as an addition
      equation for a joining.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: numeral.write
    relation: representational
    points_to: assess
    why: Writing 10 and 13 as numerals in the equation uses the skill of writing a numeral for a number.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.equal-sign.meaning
    relation: definitional
    points_to: statement
    why: 13 = 10 + 3 puts the total on the left of the equal sign, so the learner must read the sign as
      'same value', not 'the answer comes next'.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
