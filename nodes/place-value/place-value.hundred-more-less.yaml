id: place-value.hundred-more-less
concept: place-value
facet: whole-number
level: 3
type: procedure
name: Find 100 more or 100 less than a number mentally
statement: Adding or subtracting 100 to a number from 100 to 900 changes the hundreds by one and leaves
  the tens and ones unchanged.
procedure:
- Keep the tens and ones digits.
- Add one hundred or take away one hundred from the hundreds.
assess: 'Without counting or writing anything, say: 100 more than 472; 100 less than 608.'
