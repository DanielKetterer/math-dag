id: place-value.ten-more-less.three-digit
concept: place-value
facet: whole-number
level: 3
type: procedure
name: Find 10 more or 10 less than a three-digit number
statement: Adding or subtracting 10 to a three-digit number changes the tens by one and leaves the ones
  unchanged; when the tens digit is 9 (adding) or 0 (subtracting), the hundreds change by one as well
  (196 + 10 = 206, 305 - 10 = 295).
assess: 'Without counting by ones or writing anything, say: 10 more than 196; 10 less than 305; 10 more
  than 742.'
