id: place-value.decade.tens
concept: place-value
facet: whole-number
level: 2
type: concept
name: Decade numbers are a number of tens and no ones
statement: The numbers 10, 20, 30, ..., 90 are one, two, three, ..., nine tens and 0 ones; the first digit
  counts the tens.
assess: How many ten-rods make 70? How many single cubes are needed besides the rods?
sources:
  ccss:
  - 1.NBT.B.2.c
  learning_components:
  - 78e03758
requires:
- clause: via-decades
  all_of:
  - node: place-value.ten.unit
    relation: definitional
    points_to: statement
    why: Seventy is seven tens, each ten being one bundle of ten ones, with no single cubes left over.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: numeral.read
    relation: representational
    points_to: statement
    why: The statement says the first digit of the numerals 10 to 90 counts the tens, so those numerals
      must be read.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.skip.tens.decades
    relation: definitional
    points_to: statement
    why: Counting ten-rods by tens, ten, twenty, up to seventy, shows that 70 is seven tens with the matching
      decade word.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Skip counting by tens is one way to see that 70 is seven tens, but the quantity
        of rods can be found by counting the rods as units. | other route: Count the ten-rods as units
        (one ten, two tens, ... seven tens) using ten.unit, with the decade word ''seventy'' taken from
        reading the numeral.'
    status: disputed
status: proposed
