id: place-value.ten-more-less
concept: place-value
facet: whole-number
level: 3
type: procedure
name: Find 10 more or 10 less than a number mentally
statement: Adding or subtracting 10 changes the tens by one and leaves the ones unchanged; when the tens
  digit is 9 (adding) or 0 (subtracting), the hundreds change by one as well (196 + 10 = 206, 305 - 10
  = 295).
procedure:
- Keep the ones digit.
- Add one ten or take away one ten from the tens.
- If the tens become ten tens, write them as one more hundred and 0 tens; if there are no tens to take,
  take one hundred as ten tens first.
assess: 'Without counting by ones or writing anything, say: 10 more than 46; 10 less than 305.'
