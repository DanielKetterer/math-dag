id: place-value.ten-more-less
concept: place-value
facet: whole-number
level: 3
type: procedure
name: Find 10 more or 10 less than a two-digit number
statement: Adding or subtracting 10 to a two-digit number changes the tens digit by one and leaves the
  ones unchanged (46 + 10 = 56, 46 - 10 = 36).
procedure:
- Keep the ones digit.
- Add one ten or take away one ten from the tens.
- If the tens become ten tens, write them as one more hundred and 0 tens; if there are no tens to take,
  take one hundred as ten tens first.
assess: 'Without counting by ones or writing anything, say: 10 more than 46; 10 less than 73; 10 more
  than 80.'
