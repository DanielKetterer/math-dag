id: sampling.variability.meaning
concept: sampling
facet: core
level: 2
type: concept
name: Sample statistics estimate population statistics and vary from sample to sample
statement: A statistic computed from a sample, such as a sample mean or a sample proportion, estimates
  the matching population statistic but is usually not equal to it, and different samples of the same
  size usually give different values.
assess: The mean height of all 600 students in a school is 152 cm. Ana's random sample of 20 students
  has mean height 150 cm and Tom's random sample of 20 students has mean height 155 cm. Did either of
  them make a mistake? Explain.
sources:
