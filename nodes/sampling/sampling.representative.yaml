id: sampling.representative
concept: sampling
facet: core
level: 2
type: concept
name: A generalization from a sample needs a representative sample
statement: A conclusion about a population drawn from a sample is valid only if the sample is representative,
  meaning that for the characteristic studied the sample is like the population.
assess: To find out how much the students at a school like soccer, Ben surveys the members of the school
  soccer team. Can he use his results to describe all the students at the school? Why or why not?
