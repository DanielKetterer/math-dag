id: sampling.variability.simulate.categorical
concept: sampling
facet: core
level: 2
type: procedure
name: Gauge the error of a sample proportion from several samples
statement: Draw several random samples (or simulated samples) of the same size from the same population
  of categorical data, find the proportion in the category of interest in each, and use how far the sample
  proportions spread to judge how far an estimate from one sample might be from the population proportion.
procedure:
- Draw several random samples of the same size from the population, or simulate them.
- In each sample, find the fraction of members in the category of interest.
- Note the least and greatest sample proportions and how far apart they are.
- Use that spread to say about how far one sample proportion might be from the population proportion.
assess: Four random samples of 20 voters each were asked whether they will vote for Candidate A. The numbers
  saying yes were 11, 13, 9, and 12. About how far off might an estimate of Candidate A's share of all
  voters from one sample of 20 be?
