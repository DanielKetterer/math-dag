id: sampling.random.representative
concept: sampling
facet: core
level: 2
type: concept
name: Random sampling tends to produce representative samples
statement: Because no part of the population is favored, random sampling tends to produce representative
  samples and so supports valid conclusions about the population, although any single random sample can
  still differ from the population by chance.
assess: Kai says a random sample of 30 students is guaranteed to match the whole school exactly. Lia says
  random sampling only tends to give a sample like the school. Who is right, and why does choosing at
  random help?
