name: Population and sample
statement: The population is the whole group a statistical question is about; a sample is the part of
  the population from which data are actually collected, in order to learn about the population.
assess: To find out how many hours the 900 students at a school sleep on a school night, Mia asks 50 of
  them. What is the population? What is the sample?
