id: sampling.variability.simulate.numerical
concept: sampling
facet: core
level: 2
type: procedure
name: Gauge the error of a sample mean from several samples
statement: Draw several random samples (or simulated samples) of the same size from the same population
  of numerical data, compute the mean of each, and use how far the sample means spread to judge how far
  an estimate from one sample might be from the population mean.
procedure:
- Draw several random samples of the same size from the population, or simulate them.
- Compute the mean of each sample.
- Note the least and greatest sample means and how far apart they are.
- Use that spread to say about how far one sample mean might be from the population mean.
assess: Lin drew 4 random samples of 10 words each from a book. The sample mean word lengths were 4.1,
  4.8, 4.4, and 4.7 letters. About how far off might an estimate of the book's mean word length from one
  sample of 10 words be?
sources:
