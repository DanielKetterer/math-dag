id: linear-system.application.real-world.simple
concept: linear-system
facet: algebraic
level: 3
type: application
name: Solve real-world problems about when two constant-rate quantities are equal
statement: Solve real-world problems about two quantities that each start at a given value and change
  at a constant rate, finding when they are equal, by writing two equations of the form y = mx + b and
  solving the system, in problems whose answers are whole numbers.
assess: Plan A costs $20 plus $5 per month. Plan B costs $50 plus $2 per month. After how many months
  do the two plans cost the same, and what is that cost?
sources:
  ccss:
  - 8.EE.C.8.c
  learning_components:
  - 237c924f
requires:
- clause: via-set-expressions-equal
  all_of:
  - node: linear-function.model.construct
    relation: representational
    points_to: statement
    why: Each quantity with a starting value and constant rate is written as y = mx + b, which constructs
      its linear function.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: linear-system.solution.meaning
    relation: definitional
    points_to: statement
    why: The time at which the quantities are equal is the pair satisfying both equations at once, a solution
      of the system.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
