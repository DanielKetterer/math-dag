id: linear-system.solution.intersection
concept: linear-system
facet: graphical
level: 3
type: concept
name: Solutions of a system as the intersection points of the graphs
statement: The solutions of a system of two linear equations in two variables are exactly the points where
  their graphs intersect, because a point lies on both graphs exactly when its coordinates satisfy both
  equations.
assess: Point P lies on the graph of the first equation of a system but not on the graph of the second.
  Point Q is where the two graphs cross. Which point's coordinates solve the system, and why do the other
  point's coordinates not?
