id: linear-system.elimination
concept: linear-system
facet: algebraic
level: 3
type: procedure
name: Solve a system of two linear equations by elimination
statement: Solve a system of two linear equations by adding or subtracting the equations, after multiplying
  one or both by a number if needed, so that one variable is eliminated; then solve for the other variable
  and substitute back.
procedure:
- Multiply one or both equations by numbers so that one variable has equal or opposite coefficients.
- Subtract the equations if the coefficients are equal, or add them if they are opposite, to eliminate
  that variable.
- Solve the resulting one-variable equation.
- Substitute the value back to find the other variable.
assess: Solve the system 2x + 3y = 12 and 2x - y = 4 by elimination.
