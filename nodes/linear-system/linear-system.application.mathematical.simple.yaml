id: linear-system.application.mathematical.simple
concept: linear-system
facet: algebraic
level: 3
type: application
name: Find where two lines meet when each is given by its y-intercept and a slope or second point, with
  an integer meeting point
statement: Solve mathematical problems about two lines, each given by its y-intercept together with its
  slope or one other point, that meet at a point with integer coordinates, by writing both equations as
  y = mx + b and solving the system.
assess: Line A passes through (0, 1) and (2, 5). Line B passes through (0, 7) and (3, 4). At what point
  do the two lines meet?
sources:
  ccss:
  - 8.EE.C.8.c
  learning_components:
  - d77eb62e
