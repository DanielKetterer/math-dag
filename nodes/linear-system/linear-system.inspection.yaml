id: linear-system.inspection
concept: linear-system
facet: algebraic
level: 3
type: procedure
name: Tell by inspection how many solutions a simple system has
statement: 'For a system written as ax + by = c and dx + ey = f: if the left side of one equation is k
  times the left side of the other, the system has infinitely many solutions when the right sides are
  in the same ratio k and no solution when they are not; otherwise it has exactly one solution.'
procedure:
- Write both equations with the x and y terms on the left and the constant on the right.
- Check whether the left side of one equation is a number k times the left side of the other.
- 'If not, the system has exactly one solution. If so, compare the right sides: k times the other right
  side means infinitely many solutions, anything else means no solution.'
assess: 'Without solving, say how many solutions each system has: 3x + 2y = 5 and 3x + 2y = 6; x + y =
  4 and 2x + 2y = 8; x + y = 4 and x - y = 2.'
