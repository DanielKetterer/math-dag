id: linear-system.graph.read
concept: linear-system
facet: graphical
level: 2
type: procedure
name: Read the solution of a system from its drawn graphs
statement: When the graphs of the two equations of a system are drawn, the solution is the coordinate
  pair of the point where the lines cross.
procedure:
- Find the point where the two lines cross.
- Read its coordinates (x, y); that pair is the solution.
assess: The graphs of the two equations of a system are drawn on a coordinate grid and cross at a grid
  point (shown). What is the solution of the system?
