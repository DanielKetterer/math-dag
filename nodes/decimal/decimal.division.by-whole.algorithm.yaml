id: decimal.division.by-whole.algorithm
concept: decimal
facet: decimal-fraction
level: 3
type: procedure
name: Divide a decimal by a whole number with the standard algorithm
statement: Divide a decimal by a whole number with long division, placing the decimal point of the quotient
  directly above the decimal point of the dividend and writing zeros after the last digit of the dividend
  to keep dividing.
procedure:
- Set up long division with the decimal dividend and the whole-number divisor.
- Place the decimal point in the quotient directly above the decimal point of the dividend.
- Divide as with whole numbers, bringing down one digit at a time.
- If the digits of the dividend run out and the difference is not 0, write a 0 after the last digit of
  the dividend and keep dividing, until the difference is 0 or the quotient has the required number of
  places.
assess: 'Use the standard algorithm: 9.3 divided by 4.'
