id: decimal.multiplication.relate-written
concept: decimal
facet: decimal-fraction
level: 2
type: representation
name: Relate decimal multiplication models to the decimal-point rule
statement: In an area model, a tenth times a tenth is a hundredth, so a product of a factor in tenths
  and a factor in tenths is a whole number of hundredths; this matches the written method of multiplying
  as whole numbers and giving the product as many decimal places as the factors have together.
assess: An area model shows 1.2 x 0.3 = 0.36. Find 12 x 3, and use the model to explain why the written
  method places the decimal point two places from the right.
