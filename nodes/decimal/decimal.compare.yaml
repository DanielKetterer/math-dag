id: decimal.compare
concept: decimal
facet: decimal-fraction
level: 3
type: procedure
name: Compare two decimals to hundredths
statement: Compare two decimals to hundredths by rewriting each as a whole number of hundredths; the decimal
  with more hundredths is greater.
procedure:
- Write each decimal with two digits after the point, appending a 0 if it has only tenths.
- Rewrite each as a total number of hundredths (1.20 is 120 hundredths, 0.95 is 95 hundredths).
- Compare the two whole numbers; the larger count gives the larger decimal, and equal counts mean the
  decimals are equal.
assess: Which is greater, 0.5 or 0.45?
