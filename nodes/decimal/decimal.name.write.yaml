id: decimal.name.write
concept: decimal
facet: decimal-fraction
level: 3
type: representation
name: Write a decimal to thousandths from its number name
statement: Write the decimal for a number name to thousandths, placing the digits after the decimal point
  so that the last one falls in the named place, with zeros filling any places before it (forty-two and
  seven thousandths is 42.007).
procedure:
- Write the numeral for the whole-number part, or 0 if there is none, then a decimal point.
- Write the number said after and, with leading zeros so that it uses one digit for tenths, two for hundredths,
  or three for thousandths.
assess: Write the decimal for six and fifty-four thousandths.
