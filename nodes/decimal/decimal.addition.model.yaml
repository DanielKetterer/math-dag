id: decimal.addition.model
concept: decimal
facet: decimal-fraction
level: 2
type: procedure
name: Add decimals to hundredths with a place-value model
statement: Find a sum of decimals to hundredths with base-ten blocks or grids by joining like units (ones,
  tenths, hundredths) and trading 10 hundredths for 1 tenth and 10 tenths for 1 one where needed.
procedure:
- Show each addend as ones, tenths, and hundredths with blocks or grids.
- Put the like units together.
- If there are 10 or more hundredths, trade 10 hundredths for 1 tenth; then if there are 10 or more tenths,
  trade 10 tenths for 1 one.
- Count the ones, tenths, and hundredths to read the sum.
assess: Use base-ten blocks or hundredths grids to find 2.47 + 1.85.
