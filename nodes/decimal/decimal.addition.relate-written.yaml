id: decimal.addition.relate-written
concept: decimal
facet: decimal-fraction
level: 2
type: representation
name: Relate a decimal addition model to a written method
statement: Lining up the decimal points in a written decimal sum puts like units (ones, tenths, hundredths)
  in the same column, matching the joining of like units in the model; each trade of 10 units for 1 of
  the next place matches a carried 1.
assess: A grid model shows 2.47 + 1.85 with 12 hundredths traded for 1 tenth and 2 hundredths. Write the
  sum in columns, and say why the decimal points must line up and which mark records the trade.
