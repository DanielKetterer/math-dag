    relation: procedural
    points_to: procedure.3
    why: Step 3 subtracts each column from right to left and decomposes the next place when a digit is
      too small, as in the whole-number algorithm.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
