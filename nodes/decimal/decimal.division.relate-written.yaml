id: decimal.division.relate-written
concept: decimal
facet: decimal-fraction
level: 2
type: representation
name: Relate decimal division models to a written method
statement: Sharing a decimal in a model, trading leftover ones for tenths and leftover tenths for hundredths,
  matches written long division where the decimal point of the quotient is placed directly above the decimal
  point of the dividend and each leftover is brought down into the next smaller place.
assess: A block model shows 3.48 shared into 4 equal groups, with 3 ones traded for 30 tenths. Write 3.48
  divided by 4 as long division and point to where the model's trade appears and why the quotient's decimal
  point sits above the dividend's.
