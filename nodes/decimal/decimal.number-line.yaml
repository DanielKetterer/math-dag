id: decimal.number-line
concept: decimal
facet: measure
level: 2
type: representation
name: Locate tenths and hundredths decimals on the number line
statement: A decimal to tenths or hundredths is the point reached by partitioning each unit interval into
  10 or 100 equal lengths and counting that many tenths or hundredths from 0.
procedure:
- Partition the interval from 0 to 1 into 10 equal lengths (tenths), and each tenth into 10 equal lengths
  (hundredths) if needed.
- Count the decimal's number of tenths or hundredths from 0.
- Label the endpoint with the decimal.
assess: Locate 0.62 on a number line marked 0, 0.1, 0.2, ..., 1.
sources:
  ccss:
  - 4.NF.C.6
  learning_components:
  - dc34402c
