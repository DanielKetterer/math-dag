id: decimal.multiplication.algorithm
concept: decimal
facet: decimal-fraction
level: 3
type: procedure
name: Multiply multi-digit decimals with the standard algorithm
statement: Multiply two decimals by multiplying them as whole numbers, ignoring the decimal points, and
  then placing the decimal point so that the product has as many decimal places as the two factors have
  together.
procedure:
- Multiply the factors as whole numbers with the standard algorithm, ignoring the decimal points.
- Count the digits to the right of the decimal point in both factors together.
- From the right end of the whole-number product, count that many places to the left and place the decimal
  point there, writing zeros on the left if the product has too few digits.
assess: 'Use the standard algorithm: 3.06 x 0.24.'
