id: decimal.division.by-decimal.algorithm
concept: decimal
facet: decimal-fraction
level: 3
type: procedure
name: Divide by a decimal with the standard algorithm
statement: Divide a whole number or a decimal by a decimal by first multiplying the divisor and the dividend
  by the same power of 10, which makes the divisor a whole number and leaves the quotient unchanged, and
  then dividing by that whole number with long division.
procedure:
- Count the decimal places k in the divisor.
- Multiply the divisor and the dividend by 10^k by moving each decimal point k places to the right, writing
  zeros in the dividend if needed.
- Divide the new dividend by the new whole-number divisor with long division, placing the decimal point
  of the quotient above the new decimal point of the dividend.
assess: 'Use the standard algorithm: 7.38 divided by 0.6.'
