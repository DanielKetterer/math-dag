id: decimal.compare.justify
concept: decimal
facet: decimal-fraction
level: 2
type: justification
name: Justify a decimal comparison with a model
statement: A comparison of two decimals to hundredths is justified by a model of the same whole, such
  as a hundredths grid or number line, showing which decimal covers more of the whole.
assess: Use a hundredths grid to show why 0.5 > 0.45.
sources:
  ccss:
  - 4.NF.C.7
  learning_components:
  - 9bccf790
requires:
- clause: via-part-whole
  all_of:
  - node: decimal.hundredths.notation
    relation: representational
    points_to: statement
    why: The model must show the decimals read as numbers of tenths and hundredths of one whole.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.compare.same-whole
    relation: definitional
    points_to: statement
    why: The grid or number line must show both decimals on the same whole to compare them.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.tenths-to-hundredths
    relation: justificatory
    points_to: statement
    why: Showing 0.5 on a hundredths grid needs 5 tenths seen as 50 hundredths.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.compare.same-denominator
    relation: definitional
    points_to: statement
    why: Judging which decimal covers more of the grid is comparing counts of hundredths.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.non-unit.part-whole
    relation: representational
    points_to: statement
    why: A hundredths grid shows a decimal as a number of the 100 equal parts of one whole.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Seeing a decimal as a number of the 100 parts is the grid route; the number-line
        route counts hundredths along a line instead. | other route: Number line through decimal.number-line.'
    status: disputed
