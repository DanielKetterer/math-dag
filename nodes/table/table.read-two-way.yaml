id: table.read-two-way
concept: table
facet: two-way
level: 2
type: representation
name: Read an entry in a table of rows and columns
statement: Each entry of a table of rows and columns belongs to one row and one column; the entry for
  row a and column b is where that row and that column meet, and a whole row or column can be read in
  order.
assess: In this addition table, find the entry in the row for 3 and the column for 5. Then read aloud
  the row for 3.
sources:
  ccss:
  - 3.OA.D.9
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: numeral.read
    relation: procedural
    points_to: assess
    why: The test reads out an entry and the entries of a whole row, which are written numerals.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test reads out entries and a row; the idea of locating an entry by row
        and column does not require reading aloud.'
    status: proposed
related:
- node: multiplication.array.rows-columns
  relation: same_idea_different_form
  note: Rows and columns are met in arrays and in tables alike; a learner can meet them first in a table,
    so neither node needs the other.
status: proposed
