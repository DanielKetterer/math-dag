id: table.two-way.relative-frequency
concept: table
facet: two-way
level: 3
type: procedure
name: Find row or column relative frequencies in a two-way table
statement: A row relative frequency is a cell count divided by the total of its row, and a column relative
  frequency is a cell count divided by the total of its column; the row relative frequencies in any one
  row add to 1, as do the column relative frequencies in any one column.
procedure:
- Choose whether to compare rows or columns.
- For rows, divide each cell count by the total of its row; for columns, divide each cell count by the
  total of its column.
- Write each result as a fraction, decimal, or percent.
assess: 'A two-way table has rows ''curfew: yes'' (16 with chores, 4 without, total 20) and ''curfew:
  no'' (6 with chores, 14 without, total 20). Find the row relative frequencies for the row ''curfew:
  yes''.'
