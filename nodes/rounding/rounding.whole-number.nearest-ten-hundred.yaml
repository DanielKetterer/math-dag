id: rounding.whole-number.nearest-ten-hundred
concept: rounding
facet: whole-number
level: 2
type: procedure
name: Round a whole number to the nearest 10 or 100
statement: Rounding to the nearest 10 (or 100) gives the multiple of 10 (or 100) closest to the number;
  a number exactly halfway is rounded up.
procedure:
- Find the two multiples of 10 (or 100) that the number lies between, using place value or a number line.
- Find the halfway number between them.
- Choose the nearer multiple; if the number is at or past halfway, choose the greater one.
assess: Round 347 to the nearest 10 and to the nearest 100. Mark 347 and both multiples you chose on a
  number line.
