    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
related:
- node: fraction.multiplication.parts-of-partition.fraction
  relation: same_idea_different_form
  note: The target defines the product as the area of an a/b-by-c/d rectangle (array-area meaning); the
