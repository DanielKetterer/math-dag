id: multiplication.comparison.application.divide
concept: multiplication
facet: comparison
level: 2
type: application
name: Solve multiplicative comparison word problems by dividing
statement: A story gives the larger quantity in a multiplicative comparison and either the multiplier
  or the smaller quantity, and asks for the other; the learner finds it by division, using a drawing or
  an equation.
assess: A red hat costs $18 and a blue hat costs $6. How many times as much does the red hat cost as the
  blue hat?
sources:
  ccss:
  - 4.OA.A.2
  learning_components:
  - 81f35b63
requires:
- clause: standard
  all_of:
  - node: multiplication.comparison
    relation: definitional
    points_to: statement
    why: The story gives a larger quantity as a times as many as a smaller one, the comparison meaning
      of a product.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.measurement.meaning
    relation: definitional
    points_to: statement
    why: Finding how many times as much is the number of groups of the smaller quantity in the larger.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.partitive.meaning
    relation: definitional
    points_to: statement
    why: Finding the smaller quantity given the multiplier is the size of each of a equal groups.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
related:
- node: multiplication.comparison.statement-to-equation
  relation: common_path
  note: 'Common path, not required: route ''via-statement-to-equation'' needed everything another route
    needs and more, so it was removed.'
status: proposed
