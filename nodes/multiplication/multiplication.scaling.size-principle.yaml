id: multiplication.scaling.size-principle
concept: multiplication
facet: scaling
level: 3
type: concept
name: The scaling size principle
statement: For a positive number q and a positive factor f, q x f is greater than q when f > 1, equal
  to q when f = 1, and less than q when f < 1.
assess: 'True or false: (3/5) x 48 is greater than 48. True or false: (7/4) x 48 is greater than 48. Say
  which rule decides it.'
sources:
  ccss:
  - 5.NF.B.5.a
  learning_components:
  - 029248f4
requires:
- clause: standard
  all_of:
  - node: multiplication.scaling.resize
    relation: definitional
    points_to: statement
    why: The principle says whether resizing by factor f stretches or shrinks the quantity q.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A35 keep: Keep - The principle explicitly describes multiplication as resizing.'
    status: reviewed
  - node: fraction.compare.benchmark
    relation: definitional
    points_to: statement
    why: The three cases depend on comparing the factor f with the benchmark 1.
    evidence:
    - kind: content
