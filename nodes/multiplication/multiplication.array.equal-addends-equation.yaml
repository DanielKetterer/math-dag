id: multiplication.array.equal-addends-equation
concept: multiplication
facet: array-area
level: 2
type: representation
name: Write an array total as a sum of equal addends
statement: The total of a rectangular array is recorded as an equation with one equal addend for each
  row, such as 5 + 5 + 5 + 5 = 20 for 4 rows of 5.
assess: This array has 3 rows of 4 stars and 12 stars in all. Write an addition equation with one addend
  for each row.
sources:
  ccss:
  - 2.OA.C.4
  learning_components:
  - abdeadbc
requires:
- clause: standard
  all_of:
  - node: multiplication.array.rows-columns
    relation: definitional
    points_to: statement
    why: One addend for each row requires seeing the rows of the array and how many objects each holds.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.notation.equation
    relation: representational
    points_to: statement
    why: The record is an addition equation such as 5 + 5 + 5 + 5 = 20, in the notation of addition equations.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.objects
    relation: definitional
    points_to: statement
    why: The learner must count the objects in a row and the number of rows to know how many addends and
      what each addend is.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
