id: multiplication.commutative
concept: multiplication
facet: array-area
level: 3
type: concept
name: The commutative property of multiplication
statement: For any numbers a and b, a x b = b x a.
assess: Without computing either side, is 7 x 9 = 9 x 7 true? Which property tells you?
sources:
  ccss:
  - 3.OA.B.5
  learning_components:
  - a285646c
requires:
- clause: standard
  all_of:
  - node: multiplication.array.rows-columns
    relation: representational
    points_to: statement
    why: The property is shown by turning an array of a rows of b into b rows of a, so rows and columns
      of an array are used.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: The expressions a x b and b x a each mean a number of equal groups, which the property compares.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.equal-sign.meaning
    relation: definitional
    points_to: statement
    why: The statement is an equation a x b = b x a, so the learner must read it as two sides having the
      same value.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
