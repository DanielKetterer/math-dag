id: multiplication.scaling.explain-greater-than-one
concept: multiplication
facet: scaling
level: 4
type: justification
name: Explain why multiplying by a fraction greater than 1 makes a number larger
statement: For a positive number q and a fraction f > 1, write f = 1 + g with g > 0; then q x f = q +
  q x g, which is q plus a positive amount, so q x f > q. Multiplying by a whole number greater than 1
  is the familiar case.
assess: Explain why (5/4) x 12 is greater than 12, and why the same reasoning works for any fraction greater
  than 1.
sources:
  ccss:
  - 5.NF.B.5.b
  learning_components:
  - a60d004f
requires:
- clause: via-meaning
  all_of:
  - node: multiplication.properties
    relation: justificatory
    points_to: statement
    why: The step q x (1 + g) = q x 1 + q x g is the distributive property.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.by-one
    relation: justificatory
    points_to: statement
    why: The step q x 1 = q uses that multiplying by 1 leaves a number unchanged.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.addition.joining
    relation: justificatory
    points_to: statement
    why: Adding the positive amount q x g to q gives a total larger than q.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.mixed-number.meaning
    relation: definitional
    points_to: statement
    why: Writing f = 1 + g with g > 0 treats f as a whole number plus a fraction.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Writing f as a whole number plus a fraction is one way to obtain f = 1 + g. |
        other route: Decompose f = a/b as b/b + (a-b)/b (fraction.decompose.equation).'
    status: disputed
