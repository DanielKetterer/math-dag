id: multiplication.comparison.statement-to-equation
concept: multiplication
facet: comparison
level: 2
type: representation
name: Write a multiplicative comparison statement as a multiplication equation
statement: A verbal statement that one quantity is a times as many as another quantity b is written as
  the equation c = a x b, where c is the first quantity.
assess: 'Write an equation for: 24 is 3 times as many as 8.'
sources:
  ccss:
  - 4.OA.A.1
  learning_components:
  - 87c73c3b
requires:
- clause: standard
  all_of:
  - node: multiplication.comparison
    relation: definitional
    points_to: statement
    why: The statement is the reverse of reading an equation as a comparison, so the comparison meaning
      is used.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.equal-groups.situation-to-expression
    relation: representational
    points_to: statement
    why: Writing a x b from a times as many as b is writing a multiplication expression for a groups of
      b.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.equal-sign.meaning
    relation: representational
    points_to: statement
    why: The statement is written as an equation c = a x b whose two sides have the same value.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
