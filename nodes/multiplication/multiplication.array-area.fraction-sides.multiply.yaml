id: multiplication.array-area.fraction-sides.multiply
concept: multiplication
facet: array-area
level: 3
type: procedure
name: Find the area of a fraction-sided rectangle by multiplying side lengths
statement: The area of a rectangle with side lengths a/b and c/d is found by computing (a/b) x (c/d) with
  the product rule.
procedure:
- Multiply the two side lengths with the product rule (a x c)/(b x d).
- Label the result in square units.
assess: Find the area of a rectangle that is 3/5 m by 2/3 m.
