id: multiplication.area-model.by-one-digit.explain
concept: multiplication
facet: array-area
level: 2
type: justification
name: Explain multi-digit by one-digit multiplication with an area model
statement: A rectangle with side lengths n and a multi-digit number, with the long side split into its
  place-value parts, is cut into smaller rectangles whose areas are the partial products; the areas together
  make the whole area, so the partial products add to the product.
assess: Draw an area model for 4 x 2,365 and use it to explain why 4 x 2,365 = 8,000 + 1,200 + 240 + 20.
sources:
  ccss:
  - 4.NBT.B.5
  learning_components:
  - 095babd2
  - 30ca2946
