id: multiplication.distributive.factor-common
concept: multiplication
facet: core
level: 3
type: procedure
name: Write a sum of two whole numbers as a common factor times a sum
statement: Use the distributive property to rewrite a sum a + b of two whole numbers whose greatest common
  factor g is greater than 1 as g x (c + d), where a = g x c and b = g x d, so that c and d have no common
  factor greater than 1.
procedure:
- Find the greatest common factor g of a and b.
- Find c and d with a = g x c and b = g x d.
- Write a + b = g x c + g x d = g x (c + d).
assess: Write 36 + 8 as a whole number times a sum of two whole numbers that have no common factor greater
  than 1.
