id: multiplication.scaling.compare-without-computing
concept: multiplication
facet: scaling
level: 3
type: procedure
name: Compare a product with a factor without multiplying
statement: Decide whether a product of positive numbers is greater than, equal to, or less than one factor
  by comparing the other factor with 1, without performing the multiplication.
procedure:
- Pick the factor q to compare the product with; call the other factor f.
- Compare f with 1.
- 'Conclude: the product is greater than q if f > 1, equal to q if f = 1, and less than q if f < 1.'
assess: 'Without multiplying, put these in order from least to greatest: 225, (9/10) x 225, (11/8) x 225.'
sources:
  ccss:
  - 5.NF.B.5.a
  learning_components:
  - 029248f4
