id: multiplication.associative.strategy
concept: multiplication
facet: core
level: 3
type: procedure
name: Use the associative property to find a product of three factors
statement: Find a product of three factors by regrouping them so that an adjacent pair with a known or
  easy product, such as 10, is multiplied first.
procedure:
- Look for two adjacent factors whose product is known or easy.
- Regroup with parentheses around that pair.
- Multiply that pair, then multiply the result by the remaining factor.
assess: Find 7 x 5 x 2 by multiplying 5 x 2 first. Show the regrouping with parentheses.
sources:
