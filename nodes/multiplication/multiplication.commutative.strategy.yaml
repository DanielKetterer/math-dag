id: multiplication.commutative.strategy
concept: multiplication
facet: array-area
level: 3
type: procedure
name: Use the commutative property to find a product
statement: Find a product a x b by switching the order of the factors to b x a when that product is known
  or easier to find.
procedure:
- Switch the order of the two factors.
- Find the product with the factors switched, from a known fact or an easier count.
- Give that product as the answer to the original problem.
assess: You know 3 x 9 = 27. Use the commutative property to find 9 x 3, and say how you used it.
