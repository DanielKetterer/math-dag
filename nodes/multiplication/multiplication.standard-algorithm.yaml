id: multiplication.standard-algorithm
concept: multiplication
facet: base-ten
level: 3
type: procedure
name: Multiply multi-digit whole numbers with the standard algorithm
statement: Multiply multi-digit whole numbers by finding, for each digit of one factor, a shifted row
  that multiplies the other factor by that digit with carrying, and adding the rows.
procedure:
- Write one factor above the other with digits aligned on the right.
- Take the ones digit of the bottom factor. Multiply it by each digit of the top factor from right to
  left, adding any carried digit; write the ones digit of each result and carry its tens digit to the
  next product. Write the final carry at the left of the row.
- Repeat for each next digit of the bottom factor, starting its row one more place to the left (fill the
  places on the right with zeros).
- Add all the rows with the standard addition algorithm.
assess: Use the standard algorithm to find 3,407 x 286.
