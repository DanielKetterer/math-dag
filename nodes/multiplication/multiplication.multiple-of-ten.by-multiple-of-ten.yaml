id: multiplication.multiple-of-ten.by-multiple-of-ten
concept: multiplication
facet: base-ten
level: 3
type: procedure
name: Multiply a multiple of 10 by a multiple of 10
statement: 'A product of two multiples of 10 such as 30 x 40 equals (3 x 4) x (10 x 10), so it is that
  many hundreds: 30 x 40 = 12 hundreds = 1200.'
procedure:
- Write each factor as a one-digit number times 10 (30 = 3 x 10, 40 = 4 x 10).
- Multiply the one-digit numbers (3 x 4 = 12).
- Since 10 x 10 = 100, the product is that many hundreds (1200).
assess: Find 30 x 40 and 60 x 50 by multiplying the tens digits and naming the unit; do not use a written
  algorithm.
sources:
  ccss:
  - 4.NBT.B.5
  learning_components: []
