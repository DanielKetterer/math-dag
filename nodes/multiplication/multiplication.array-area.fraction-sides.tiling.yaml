id: multiplication.array-area.fraction-sides.tiling
concept: multiplication
facet: array-area
level: 2
type: procedure
name: Find the area of a fraction-sided rectangle by tiling with unit-fraction squares
statement: Find the area of a rectangle with fractional side lengths by rewriting both sides over a common
  denominator n, tiling the rectangle with squares of side 1/n, and counting squares, each of area 1/(n
  x n).
procedure:
- Rewrite both side lengths over a common denominator n, as p/n and q/n.
- 'Tile the rectangle with squares of side 1/n: p along one side and q along the other.'
- Note that n x n such squares fill a unit square, so each has area 1/(n x n).
- Count the p x q squares; the area is (p x q)/(n x n) square units.
assess: A rectangle is 3/4 m by 1/2 m. Tile it with squares of side 1/4 m and find its area.
sources:
  ccss:
  - 5.NF.B.4.b
  learning_components:
  - 3d4b5315
