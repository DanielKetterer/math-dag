id: multiplication.distributive.strategy
concept: multiplication
facet: array-area
level: 3
type: procedure
name: Find a product by breaking apart a factor
statement: Find a x b by writing b as a sum of two numbers whose products with a are known, multiplying
  a by each part, and adding the two products.
procedure:
- Write one factor b as a sum c + d of numbers whose products with a are known.
- Find a x c and a x d.
- Add the two products; the sum is a x b.
assess: You know 8 x 5 = 40 and 8 x 2 = 16. Use the distributive property to find 8 x 7, and show the
  break-apart.
