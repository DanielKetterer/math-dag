id: multiplication.by-multiple-of-ten
concept: multiplication
facet: base-ten
level: 3
type: procedure
name: Multiply a one-digit number by a multiple of 10, 100, or 1000
statement: 'Multiply a one-digit number by a one-digit multiple of a base-ten unit by multiplying the
  one-digit numbers and keeping the unit: 9 x 80 = 9 x 8 tens = 72 tens = 720.'
procedure:
- Write the multiple of 10, 100, or 1000 as a number of tens, hundreds, or thousands (80 = 8 tens).
- Multiply the two one-digit numbers (9 x 8 = 72).
- The product is that many of the same unit (72 tens = 720).
assess: Find 6 x 70 and 4 x 500 by counting tens or hundreds as units; do not use a written algorithm.
