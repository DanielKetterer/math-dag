id: multiplication.by-one
concept: multiplication
facet: core
level: 3
type: concept
name: Multiplying by 1 leaves a number unchanged
statement: For any number a, a x 1 = a and 1 x a = a.
assess: Without computing, what is 1 x 87? What is 3/5 x 1? Say what rule you used.
