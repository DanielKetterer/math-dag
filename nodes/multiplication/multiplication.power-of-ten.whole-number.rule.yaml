id: multiplication.power-of-ten.whole-number.rule
concept: multiplication
facet: base-ten
level: 3
type: concept
name: Multiplying a whole number by 10^k appends k zeros
statement: For a whole number n and a whole number k, n x 10^k is written as the digits of n followed
  by k zeros.
assess: Without a written algorithm, find 368 x 10^3 and 4,050 x 100.
