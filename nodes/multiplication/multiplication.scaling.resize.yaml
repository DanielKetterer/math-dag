id: multiplication.scaling.resize
concept: multiplication
facet: scaling
level: 2
type: concept
name: Multiplication as resizing
statement: 'Multiplying a quantity by a factor resizes the quantity: the product is the quantity stretched
  or shrunk by that factor.'
assess: A picture 6 inches wide is resized by a factor of 3/2. Is the new picture wider or narrower, and
  how wide is it?
sources:
  ccss:
  - 5.NF.B.5
  learning_components:
  - 18ed149f
requires:
- clause: standard
  all_of:
  - node: multiplication.comparison
    relation: definitional
    points_to: statement
    why: Stretching by a whole-number factor is the 'n times as much' comparison.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.multiplication.parts-of-partition.whole-number
    relation: definitional
    points_to: statement
    why: Resizing by a fraction factor such as 3/2 takes a parts of b equal parts of the quantity.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.compare.reasoning-size
    relation: procedural
    points_to: assess
    why: Deciding whether the picture is wider or narrower requires reasoning about whether 3/2 is more
      or less than 1.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: Deciding wider or narrower from 3/2 > 1 is demanded by the test problem; the concept
        (resizing stretches or shrinks) does not require comparing fractions, and the size principle is
        the L3 node for this.'
    status: proposed
status: proposed
