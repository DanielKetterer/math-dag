id: partitioning.equal-shares.area
concept: partitioning
facet: area
level: 1
type: procedure
name: Partition a circle or rectangle into equal shares
statement: Divide a circle or rectangle into n shares of the same size that together make up the whole
  with nothing left over (in grades 1-2, n is 2, 3, or 4).
procedure:
- Decide how many shares, n, are needed.
- For a rectangle, draw n - 1 straight lines across it, spaced so every strip has the same width.
- For a circle, draw n straight cuts from the center to the edge, spaced evenly around the center.
- Check that the shares are the same size and that together they make the whole.
assess: Draw lines to split this rectangle into 3 equal shares.
