id: partitioning.rectangle.rows-columns
concept: partitioning
facet: area
level: 1
type: procedure
name: Partition a rectangle into rows and columns of same-size squares
statement: Draw lines across and down a rectangle whose sides fit a whole number of square sides, so that
  it is split into rows and columns of same-size squares with no gaps or overlaps.
procedure:
- Draw lines across the rectangle, evenly spaced, to make the rows.
- Draw lines up and down, evenly spaced at the same spacing as the rows, to make the columns.
- Check that every part is a square and all the squares are the same size.
assess: This rectangle is as long as 4 of these small squares and as tall as 3 of them. Draw lines to
  split it into rows and columns of same-size squares.
sources:
  ccss:
