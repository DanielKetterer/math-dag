id: partitioning.equal-shares.different-shapes
concept: partitioning
facet: area
level: 1
type: concept
name: Equal shares need not have the same shape
statement: Shares of identical wholes are equal when they cover the same amount, even if they have different
  shapes.
assess: Two identical squares are each cut in half, one along a diagonal into triangles and one straight
  down the middle into rectangles. Is a triangle half the same amount as a rectangle half?
sources:
  ccss:
  - 2.G.A.3
  learning_components:
  - 0b131675
requires:
