id: partitioning.equal-area.any-shape
concept: partitioning
facet: area
level: 2
type: procedure
name: Partition a shape into parts with equal area
statement: Partition a shape into n parts that have the same area, checking equality by area (for example
  by counting unit squares) rather than by shape. The steps below work for any rectangle and any n; other
  shapes are split into pieces whose areas are then checked to be equal.
procedure:
- For a rectangle, partition one side into n equal lengths.
- Through each mark, draw a line parallel to the adjacent side, making n strips.
- Confirm the strips have equal area (same length and width, or the same number of unit squares).
assess: This 6-by-2 rectangle is drawn on a grid. Partition it into 6 parts with equal area and show how
  you know the areas are equal.
