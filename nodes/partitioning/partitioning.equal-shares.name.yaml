id: partitioning.equal-shares.name
concept: partitioning
facet: area
level: 1
type: representation
name: Name equal shares as halves, thirds, and fourths
statement: One of 2 equal shares of a whole is called a half of it, one of 3 equal shares a third of it,
  and one of 4 equal shares a fourth (or quarter) of it; the names apply only when the shares are equal.
assess: This circle is cut into 4 equal shares and one share is shaded. What word names the shaded share?
