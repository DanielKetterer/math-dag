id: linear-function.line.graph
concept: linear-function
facet: line
level: 3
type: procedure
name: Graph a linear function from its equation y = mx + b
statement: Graph y = mx + b by plotting two points whose coordinates satisfy the equation and drawing
  the straight line through them.
procedure:
- Plot the point (0, b).
- Substitute another value of x into the equation to find a second point, and plot it.
- Draw the straight line through the two points.
assess: Graph y = -2x + 3.
sources:
  ccss:
  - 8.F.A.3
  learning_components: []
