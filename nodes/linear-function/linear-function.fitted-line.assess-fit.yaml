id: linear-function.fitted-line.assess-fit
concept: linear-function
facet: fitted-line
level: 2
type: concept
name: Judge the fit of a line by the closeness of the points to it
statement: A line fits a data set well when the data points lie close to it, with no long run of points
  all on one side; the farther the points lie from the line, the worse the fit.
assess: Two lines are drawn on the same scatter plot. Line A passes above all but one of the points, some
  by as much as 4 units. Line B passes through the middle of the points, with about half above and half
  below, each within 1 unit of it. Which line fits the data better? Explain using the distances of the
  points from the lines.
