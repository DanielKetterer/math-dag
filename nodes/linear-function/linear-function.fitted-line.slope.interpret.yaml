id: linear-function.fitted-line.slope.interpret
concept: linear-function
facet: fitted-line
level: 3
type: concept
name: Interpret the slope of a line fitted to data
statement: The slope of a line fitted to bivariate data is the predicted change in the second quantity
  for each increase of one unit in the first, in units of the second per unit of the first; it describes
  the trend of the data, not the exact change for every individual.
assess: A line fitted to data on hours of sunlight per day (x) and mature plant height in cm (y) is y
  = 1.5x + 10. What does the slope 1.5 mean in this context?
sources:
