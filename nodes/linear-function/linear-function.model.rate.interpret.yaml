id: linear-function.model.rate.interpret
concept: linear-function
facet: model
level: 3
type: concept
name: Interpret the rate of change in context
statement: The rate of change m of a linear model is the amount the output changes, in its units, for
  each 1-unit increase in the input.
assess: The cost of a taxi ride is C = 2.5d + 3, where d is miles. What does 2.5 mean in this situation?
sources:
  ccss:
  - 8.F.B.4
  learning_components:
  - b2a9431b
requires:
- clause: via-write
  all_of:
  - node: ratio.unit-rate
    relation: definitional
    points_to: statement
    why: The rate of change is the change in output for 1 unit of input, which is a unit rate of output
      per input.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.meaning
    relation: representational
    points_to: statement
    why: The learner reads m as the coefficient of the variable in a formula such as C = 2.5d + 3.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired expressions.variables: Reading 2.5 in C = 2.5d + 3 as the amount
        per mile uses that d stands for a number of miles; the word coefficient is not needed.'
    status: proposed
  - node: linear-function.line.y-mx-plus-b.write
    relation: representational
    points_to: statement
    why: The model is written y = mx + b and m is read as the coefficient of x in that equation.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Reading m as the coefficient of x in y = mx + b is one way to meet the rate in
        a formula; the other is as the per-unit amount from a proportional equation. | other route: Read
        the coefficient as the unit rate from y = kx (proportional-relationship.constant.equation, ratio.unit-rate).'
    status: disputed
- clause: critic-route-1
  note: Rate as coefficient of the input variable in a proportional equation, extended to adding a constant
  all_of:
  - node: ratio.unit-rate
    relation: definitional
    points_to: statement
    why: The rate of change is the change in output for 1 unit of input, which is a unit rate of output
      per input.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.meaning
    relation: representational
    points_to: statement
    why: The learner reads m as the coefficient of the variable in a formula such as C = 2.5d + 3.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired expressions.variables: Reading 2.5 in C = 2.5d + 3 as the amount
        per mile uses that d stands for a number of miles; the word coefficient is not needed.'
    status: proposed
  - node: proportional-relationship.constant.equation
    relation: definitional
    points_to: statement
    why: 'Alternative route proposed by the critic: Rate as coefficient of the input variable in a proportional
      equation, extended to adding a constant'
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing route
    status: disputed
status: proposed
