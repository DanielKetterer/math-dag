id: linear-function.fitted-line.intercept.interpret
concept: linear-function
facet: fitted-line
level: 3
type: concept
name: Interpret the intercept of a line fitted to data
statement: The vertical intercept of a line fitted to bivariate data is the value of the second quantity
  that the model predicts when the first quantity is 0; the prediction may be meaningless when 0 lies
  far outside the data.
assess: A line fitted to data on hours of sunlight per day (x) and mature plant height in cm (y) is y
  = 1.5x + 10. What does the intercept 10 mean in this context?
