id: linear-function.fitted-line.solve-for-input
concept: linear-function
facet: fitted-line
level: 3
type: application
name: Find the input a fitted line associates with a given output
statement: Problems that give the equation of a line fitted to bivariate data and a value of the second
  quantity, and ask for the value of the first quantity that the model associates with it, found by solving
  the equation for the first quantity.
assess: A line fitted to data on hours of sunlight per day (x) and mature plant height in cm (y) is y
  = 1.5x + 10. According to the model, about how many hours of sunlight a day go with a mature height
  of 25 cm?
sources:
  ccss:
  - 8.SP.A.3
  learning_components:
  - 31ebd1b1
requires:
- clause: standard
  all_of:
  - node: equation.two-step.px-plus-q.solve
    relation: procedural
    points_to: statement
    why: The statement finds the first quantity by solving the equation for it, and the test problem solves
      1.5x + 10 = 25.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: linear-function.fitted-line.meaning
    relation: definitional
    points_to: statement
    why: The input the model associates with an output is a value read from a line that summarizes the
      trend, not an exact value.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: relationship.dependent-independent.meaning
    relation: definitional
    points_to: statement
    why: The statement gives the second quantity and asks for the first, so the learner must know which
      variable is which.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
