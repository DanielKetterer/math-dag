id: linear-function.fitted-line.meaning
concept: linear-function
facet: fitted-line
level: 2
type: concept
name: A straight line can model bivariate data with a linear association
statement: When a scatter plot shows a linear association, a straight line can model the relationship
  between the two quantities by summarizing their trend; the data points need not lie on the line.
assess: A scatter plot of arm span against height for 25 students shows a strong positive linear association,
  but no straight line passes through all the points. Tom says this means a straight line cannot be used
  to model the data. Is he right? Explain.
