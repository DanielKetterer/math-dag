id: linear-function.nonlinear.example
concept: linear-function
facet: line
level: 3
type: procedure
name: Give an example of a function that is not linear
statement: Produce a function that is not linear and show that it is not linear by exhibiting three of
  its points that do not lie on one line.
procedure:
- Choose a rule whose output does not change by equal amounts for equal changes in input, such as squaring
  the input.
- Compute three points of the rule.
- Show that the rates of change between two pairs of these points differ, so the points are not on one
  line.
assess: Give a rule for a function that is not linear, and use three of its points to show that it is
  not linear.
