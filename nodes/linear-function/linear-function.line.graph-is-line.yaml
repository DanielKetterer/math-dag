      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: functions.graph.meaning
    relation: definitional
    points_to: statement
    why: The graph of a function is the set of its input-output points, which is the object the statement
      says is a line.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
