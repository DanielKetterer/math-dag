id: linear-function.nonlinear.identify
concept: linear-function
facet: line
level: 3
type: procedure
name: Show from its values that a function is not linear
statement: A function is not linear if the rate of change, the change in output divided by the change
  in input, differs between two pairs of its points; if the rate is the same for every pair of listed
  points, those points lie on one line.
procedure:
- Take pairs of points from the table or rule.
- Compute the rate of change for each pair.
- If two rates differ, the function is not linear.
assess: The area of a square is A = s^2. Use the side lengths s = 1, 2 and 3 to decide whether A is a
  linear function of s.
