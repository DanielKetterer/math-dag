id: linear-function.model.construct
concept: linear-function
facet: model
level: 3
type: representation
name: Construct a linear function to model a relationship
statement: A linear relationship between two quantities is modeled by y = mx + b, where m is the rate
  of change of y per unit of x and b is the value of y when x = 0.
procedure:
- Name the input variable x and output variable y with their units.
- Find the rate of change m.
- Find the initial value b.
- Write y = mx + b.
assess: A plumber charges $40 for a visit plus $25 per hour. Write a function for the total cost C in
  terms of hours h.
sources:
  ccss:
  - 8.F.B.4
  learning_components:
  - dab9e9b0
requires:
- clause: standard
  all_of:
  - node: functions.definition
    relation: definitional
    points_to: statement
    why: A linear model assigns one output y to each input x, which is the function idea the statement
      uses.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: Step 1 names input and output quantities, but it is unclear whether the formal
        function definition (rather than informal dependence) is needed.'
    status: disputed
  - node: linear-function.line.y-mx-plus-b.write
    relation: representational
    points_to: statement
    why: The model is written in the form y = mx + b, the same equation form used for a line.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Building y = mx + b straight from a context (rate times input plus initial value)
        does not need the line-geometry derivation.'
    status: disputed
  - node: expressions.variables
    relation: procedural
    points_to: procedure.1
    why: Naming input and output variables with units and writing the final equation uses variables in
