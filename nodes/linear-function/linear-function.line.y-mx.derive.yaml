id: linear-function.line.y-mx.derive
concept: linear-function
facet: line
level: 4
type: justification
name: Derive y = mx for a line through the origin
statement: For any point (x, y) other than the origin on a non-vertical line through the origin with slope
  m, the slope from (0, 0) to (x, y) is y/x = m, so y = mx; the origin also satisfies y = mx.
assess: A line through the origin has slope 3. Explain why every point (x, y) on it satisfies y = 3x.
sources:
  ccss:
  - 8.EE.B.6
  learning_components: []
