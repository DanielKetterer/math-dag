id: fraction.multiply-whole.symbolic
concept: fraction
facet: measure
level: 3
type: procedure
name: Multiply a fraction by a whole number symbolically
statement: Compute n x (a/b) by multiplying the whole number by the numerator and keeping the denominator.
procedure:
- Multiply the whole number n by the numerator a.
- Write the product over the denominator b.
assess: Compute 7 x (3/8).
