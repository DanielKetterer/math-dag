id: fraction.addition.like-denominators
concept: fraction
facet: measure
level: 3
type: procedure
name: Add fractions with like denominators symbolically
statement: For fractions with the same denominator, a/b + c/b = (a + c)/b.
procedure:
- Check that the denominators are the same.
- Add the numerators.
- Write the sum over the common denominator.
assess: Compute 5/12 + 9/12.
sources:
  ccss:
