id: fraction.addition.like-denominators
concept: fraction
facet: measure
level: 3
type: procedure
name: Add fractions with like denominators symbolically
statement: For fractions with the same denominator, a/b + c/b = (a + c)/b.
procedure:
- Check that the denominators are the same.
- Add the numerators.
- Write the sum over the common denominator.
assess: Compute 5/12 + 9/12.
sources:
  ccss:
  - 4.NF.B.3.a
  - 4.NF.B.3.d
  learning_components: []
requires:
- clause: via-model
  all_of:
  - node: addition.within-20.fluency
    relation: procedural
    points_to: procedure.2
    why: Step 2 adds the two numerators as whole numbers, possibly with several digits.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A3 keep: Keep - The procedure adds the whole-number numerators.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired addition.whole-number: 5/12 + 9/12 needs 5 + 9 = 14, a sum of two
        one-digit numbers over 10.'
    status: reviewed
  - node: fraction.addition.like-denominators.model
    relation: representational
    points_to: statement
    why: The symbolic rule a/b + c/b = (a + c)/b records the result that the length model of adding like
      parts produces.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: A level 3 rule need not be derived from the length model; the model is one source
        for it. | other route: Derive or learn the rule from the unit-sum meaning (a/b is a copies of
        1/b, so a copies plus c copies is a + c copies) or by direct instruction of the rule with a check
        that denominators match, via fraction.non-unit.unit-sum and fraction.addition.joining.'
    - kind: review
      source: DK
      note: 'D85 keep: Route-only - The symbolic addition rule can be taught directly or from the unit-sum
        meaning, without requiring the model procedure.'
    status: reviewed
- clause: critic-route-1
