id: fraction.between-whole-numbers
concept: fraction
facet: measure
level: 3
type: procedure
name: Find the two whole numbers a fraction lies between
statement: For a fraction a/b, divide a by b with remainder to get quotient q and remainder r; if r =
  0 then a/b equals the whole number q, otherwise a/b lies strictly between q and q + 1.
procedure:
- Divide a by b to get a whole-number quotient q and remainder r.
- If r = 0, a/b equals the whole number q.
- Otherwise, a/b lies between the whole numbers q and q + 1.
assess: Between which two whole numbers does 47/6 lie?
sources:
  ccss:
  - 5.NF.B.3
  learning_components:
  - 677ac9ea
requires:
- clause: via-multiple-of-unit
  all_of:
  - node: division.multi-digit
    relation: procedural
    points_to: procedure.1
    why: Step 1 divides a by b with a remainder to get the quotient q and remainder r.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.whole-number.as-fraction
    relation: procedural
    points_to: procedure.2
    why: Step 2 concludes that a/b equals the whole number q when r = 0, which treats q as a fraction
      with denominator 1.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.non-unit.number-line
    relation: definitional
    points_to: statement
    why: '''Lies between two whole numbers'' is a statement of position or order; no proposed edge supplies
      the ordering of a fraction relative to whole numbers (e318 is only a justification).'
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: fraction.multiple-of-unit
    relation: definitional
    points_to: statement
    why: The fraction a/b is a copies of 1/b, and every b copies make one whole, which is why a/b contains
      q whole numbers.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: The multiple-of-unit reading (every b copies of 1/b make a whole) is one way
        to see why q wholes fit; it is not the only one. | other route: Mixed number as a whole number
        plus a fraction (fraction.mixed-number.meaning).'
    status: disputed
