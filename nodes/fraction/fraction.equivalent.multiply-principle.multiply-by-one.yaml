id: fraction.equivalent.multiply-principle.multiply-by-one
concept: fraction
facet: operator
level: 4
type: justification
name: Relate a/b = (n x a)/(n x b) to multiplying by 1
statement: Since (n x a)/(n x b) = (n/n) x (a/b) and n/n = 1, the equivalence principle a/b = (n x a)/(n
  x b) says that multiplying a/b by 1 does not change it.
assess: Explain how the equation 2/3 = (5 x 2)/(5 x 3) is an example of multiplying 2/3 by 1.
