id: fraction.multiply-whole.model
concept: fraction
facet: measure
level: 2
type: procedure
name: Multiply a fraction by a whole number using unit fractions
statement: Find n x (a/b) with a model by rewriting it as (n x a) x (1/b) and counting the copies of 1/b,
  giving (n x a)/b.
procedure:
- Show a/b as a copies of 1/b, and draw n such groups.
- Count all the copies of 1/b in the n groups.
- Write the product as that count over b.
assess: Use a fraction model to find 4 x (2/3).
