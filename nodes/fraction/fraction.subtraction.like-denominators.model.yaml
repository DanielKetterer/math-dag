      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Removing c lengths can be done by crossing out parts of a strip; jumping back
        on a number line is one representation. | other route: Fraction strips with c parts crossed out,
        using fraction.subtraction.separating and fraction.non-unit.part-whole.'
    status: disputed
