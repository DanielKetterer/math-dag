    - kind: content
      source: critic-sonnet
      note: 'route-only: The statement allows fraction strips or a number line; a lengths of 1/b can be
        shown on a strip. | other route: Show a/b as shaded parts of a fraction strip, using fraction.non-unit.part-whole,
        and cross out c parts.'
    status: disputed
  - node: subtraction.take-away.number-line
    relation: representational
    points_to: procedure.2
    why: Step 2 removes c lengths by jumping back on the line, as in representing a whole-number difference
      on a number line.
    evidence:
