      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A25 keep: Keep - The specified benchmark test compares whole-number quantities.'
    status: reviewed
  - node: fraction.as-number
