id: fraction.compare.benchmark
concept: fraction
facet: measure
level: 3
type: procedure
name: Compare fractions using a benchmark fraction
statement: Compare two fractions by comparing each to a benchmark such as 1/2 or 1; this decides the comparison
  only when the two fractions fall on opposite sides of the benchmark.
procedure:
- Choose a benchmark, 1/2 or 1.
- Compare each fraction to the benchmark (a/b is greater than 1/2 exactly when 2 x a is greater than b,
  and greater than 1 exactly when a is greater than b).
- If one fraction is above the benchmark and the other below, the one above is greater; otherwise this
  method does not decide, and another method is needed.
assess: Use 1/2 to decide which is greater, 3/8 or 4/7.
sources:
  ccss:
  - 4.NF.A.2
  learning_components: []
