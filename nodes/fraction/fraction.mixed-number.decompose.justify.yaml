id: fraction.mixed-number.decompose.justify
concept: fraction
facet: measure
level: 2
type: justification
name: Justify a mixed-number decomposition with a model
statement: An equation decomposing n a/b into a sum of fractions with denominator b is justified by a
  model showing that the parts on the right, put together, make exactly n wholes and a more parts of size
  1/b.
assess: Use a drawing to show why 2 1/3 = 4/3 + 3/3.
