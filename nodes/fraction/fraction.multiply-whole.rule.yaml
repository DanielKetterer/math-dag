id: fraction.multiply-whole.rule
concept: fraction
facet: measure
level: 3
type: concept
name: The rule n x (a/b) = (n x a)/b
statement: For any whole number n and fraction a/b, n x (a/b) = (n x a)/b.
assess: 'True or false: 4 x (3/5) = 12/20. True or false: 4 x (3/5) = 12/5. Say which rule decides it.'
sources:
  ccss:
  - 4.NF.B.4.b
  learning_components: []
requires:
- clause: via-as-unit-multiple
  all_of:
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: Every route reads n x (a/b) as n equal groups of a/b; none of the proposed edges supplies the
      meaning of this product.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'D102 keep: Keep/add as one route - Understanding multiplication as equal groups directly
        explains the left-hand product nx(a/b).'
    status: reviewed
  - node: fraction.multiply-whole.as-unit-multiple
    relation: justificatory
    points_to: statement
    why: The rule is explained by rewriting n x (a/b) as (n x a) x (1/b) and reading that as (n x a)/b.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: The unit-multiple rewriting is one explanation of the rule; repeated addition
        of a/b gives the same result without it. | other route: Repeated addition of a/b with the like-denominator
        rule, via fraction.addition.like-denominators.'
    - kind: review
      source: DK
      note: 'D100 keep: Route-only - Repeated addition of fractions can derive the multiplication rule
        without the unit-multiple concept.'
    status: reviewed
- clause: via-multiple-of-unit
  all_of:
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: Every route reads n x (a/b) as n equal groups of a/b; none of the proposed edges supplies the
      meaning of this product.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'D102 keep: Keep/add as one route - Understanding multiplication as equal groups directly
        explains the left-hand product nx(a/b).'
    status: reviewed
  - node: fraction.multiple-of-unit
    relation: definitional
    points_to: statement
    why: Both sides of the rule are rewritten using a/b = a x (1/b), including (n x a)/b = (n x a) x (1/b).
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The rule can be reached by repeated addition of like fractions rather than through
        unit fractions. | other route: n x (a/b) as n equal groups, i.e. a/b added n times, then (a +
        ... + a)/b = (n x a)/b by fraction.addition.like-denominators and multiplication.equal-groups.meaning.'
    - kind: review
      source: DK
      note: 'D101 keep: Route-only - Repeated addition with like denominators provides an alternative
        route to the same rule.'
    status: reviewed
- clause: critic-route-1
  note: Repeated addition of a/b n times with the like-denominator rule.
  all_of:
  - node: multiplication.equal-groups.meaning
    relation: definitional
