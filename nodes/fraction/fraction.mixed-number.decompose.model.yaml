id: fraction.mixed-number.decompose.model
concept: fraction
facet: measure
level: 2
type: procedure
name: Decompose a mixed number into a sum of same-denominator fractions with a model
statement: Using a model of n a/b in which each whole is b parts of size 1/b, split all the parts into
  groups in more than one way; each grouping is a sum of fractions with denominator b.
procedure:
- Show n a/b on a model, with each of the n wholes partitioned into b parts of size 1/b, plus a more parts.
- Separate all n x b + a parts into two or more groups.
- Name each group as (number of parts in the group)/b.
- Regroup the parts differently to get another decomposition.
assess: Shade 1 3/4 on fraction strips of fourths, then group the shaded fourths to show two different
  ways to break 1 3/4 into a sum of fourths.
