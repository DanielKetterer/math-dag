id: fraction.estimate.benchmark.difference
concept: fraction
facet: measure
level: 2
type: procedure
name: Estimate a fraction difference with benchmarks and judge reasonableness
statement: Estimate a difference of fractions by replacing each fraction with a nearby benchmark (0, 1/2,
  1, or a whole number), and use the estimate to judge whether a computed difference is reasonable.
procedure:
- 'Replace each fraction with its nearest benchmark: 0, 1/2, 1, or a whole number.'
- Subtract the benchmarks to get an estimate of the difference.
- Call a computed difference unreasonable if it is far from the estimate or is larger than the first fraction.
assess: Jo says 11/12 - 3/8 = 8/4. Use benchmark fractions to decide whether this is reasonable.
sources:
