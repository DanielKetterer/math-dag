id: fraction.application.multiplication-in-context.equation
concept: fraction
facet: operator
level: 3
type: application
name: Solve real-world fraction multiplication problems with an equation
statement: A real-world problem asks for a fraction or mixed-number multiple of a quantity; the learner
  writes a multiplication equation and solves it symbolically.
assess: A recipe uses 2 1/4 cups of flour. How much flour is needed for 1 1/2 batches? Write an equation
  and solve it.
sources:
  ccss:
  - 5.NF.B.6
  learning_components:
  - 354638aa
  - ea894526
requires:
- clause: via-fraction
  all_of:
  - node: fraction.multiplication.symbolic
    relation: procedural
    points_to: statement
    why: The learner solves the equation symbolically by multiplying numerators and denominators.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.mixed-number.multiplication
    relation: procedural
    points_to: statement
    why: The statement allows mixed-number multiples, such as 1 1/2 batches of 2 1/4 cups.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A2 keep: Keep - The stated assessment includes mixed-number multiplication.'
    status: reviewed
  - node: fraction.multiplication.parts-of-partition.fraction
    relation: definitional
    points_to: statement
    why: The phrase a fraction of a quantity must be recognized as multiplication by that fraction to
      write the equation.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Recognizing ''a fraction of a quantity'' as multiplication is one way to see
        the operation; stories phrased as a number of batches are read through scaling. | other route:
        Multiplication as resizing (multiplication.scaling.resize) for ''batches'' and ''times as much''
        wordings.'
    status: disputed
status: proposed
