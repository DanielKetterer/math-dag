id: fraction.multiplication.product-rule
concept: fraction
facet: operator
level: 3
type: concept
name: The product rule (a/b) x (c/d) = (a x c)/(b x d)
statement: For any fractions a/b and c/d, (a/b) x (c/d) = (a x c)/(b x d), where a whole number q is written
  as q/1.
assess: 'True or false: (2/3) x (4/5) = 8/15. True or false: (2/3) x (4/5) = 6/8. Say which rule decides
  it.'
sources:
  ccss:
  - 5.NF.B.4
  - 5.NF.B.4.a
  learning_components:
  - 4aeee2dd
requires:
- clause: standard
  all_of:
  - node: fraction.whole-number.as-fraction
    relation: definitional
    points_to: statement
    why: The statement writes a whole number q as q/1 so that the rule also covers whole-number factors.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.multiplication.parts-of-partition.fraction
    relation: definitional
    points_to: statement
    why: The product (a/b) x (c/d) is first defined as a parts of c/d split into b equal parts, which
      the rule then computes.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Some meaning of the left side (a/b) x (c/d) is needed; the part-of-a-partition
        meaning is one option.'
    status: disputed
- clause: area-model
  all_of:
  - node: fraction.whole-number.as-fraction
    relation: definitional
    points_to: statement
    why: The statement writes a whole number q as q/1 so that the rule also covers whole-number factors.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.array-area.fraction-product.represent
    relation: justificatory
    points_to: statement
    why: The area model shows the product as a x c small rectangles, each 1/(b x d) of the unit square,
      which is the rule.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The area model gives a meaning and a derivation of the rule, but the operator
        meaning can serve instead.'
    status: disputed
status: proposed
