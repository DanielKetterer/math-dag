    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired subtraction.whole-number: 11/10 - 4/10 needs 11 - 4, a difference
        crossing 10.'
    status: proposed
  - node: fraction.subtraction.like-denominators.model
