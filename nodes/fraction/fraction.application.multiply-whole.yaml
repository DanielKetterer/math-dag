name: Solve word problems multiplying a fraction by a whole number
statement: A story problem gives a number of equal groups, each a fractional amount; the learner finds
  the total as whole number x fraction.
assess: Each of 5 people at a party will eat 3/8 of a pound of roast beef. How many pounds of roast beef
  are needed?
