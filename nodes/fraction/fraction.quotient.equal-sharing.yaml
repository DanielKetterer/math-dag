id: fraction.quotient.equal-sharing
concept: fraction
facet: quotient
level: 2
type: concept
name: A fraction as the share when a wholes are shared among b
statement: When a equal wholes are shared equally among b people, each person's share is a/b of one whole.
assess: 3 pizzas are shared equally among 4 people. Use a drawing to show how much pizza each person gets.
sources:
