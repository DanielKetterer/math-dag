    relation: definitional
    points_to: statement
    why: The statement defines each person's share as the size of one equal share when a wholes are shared
      among b.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.non-unit.part-whole
    relation: definitional
    points_to: statement
    why: Each share is a parts of size 1/b, which is a non-unit fraction a/b of one whole.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
