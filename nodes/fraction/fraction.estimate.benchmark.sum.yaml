id: fraction.estimate.benchmark.sum
concept: fraction
facet: measure
level: 2
type: procedure
name: Estimate a fraction sum with benchmarks and judge reasonableness
statement: Estimate a sum of fractions by replacing each addend with a nearby benchmark (0, 1/2, 1, or
  a whole number), and use the estimate to judge whether a computed sum is reasonable.
procedure:
- 'Replace each addend with its nearest benchmark: 0, 1/2, 1, or a whole number.'
- Add the benchmarks to get an estimate of the sum.
- Call a computed sum unreasonable if it is far from the estimate or is smaller than one of the addends.
assess: Without computing exactly, decide whether 2/5 + 1/2 = 3/7 can be correct, and explain using benchmark
  fractions.
