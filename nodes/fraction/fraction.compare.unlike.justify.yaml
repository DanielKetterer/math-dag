id: fraction.compare.unlike.justify
concept: fraction
facet: part-whole
level: 2
type: justification
name: Justify a comparison of fractions with unlike numerators and denominators
statement: A comparison of two fractions with different numerators and different denominators is justified
  by a model of the same whole in which both fractions are shown with parts of a common size, so the numbers
  of parts can be compared.
assess: Use a fraction model to show why 2/3 > 3/5.
sources:
  ccss:
  - 4.NF.A.2
  learning_components:
  - 1995cc98
  - '67628647'
requires:
- clause: standard
  all_of:
  - node: fraction.compare.same-whole
    relation: definitional
    points_to: statement
    why: The model must show both fractions as parts of one and the same whole or the comparison has no
      meaning.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.equivalent.same-size
    relation: definitional
    points_to: statement
    why: Showing both fractions with parts of a common size means replacing each by an equivalent amount
      of the same whole.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.equivalent.simple.generate
    relation: representational
    points_to: statement
    why: Building the model with parts of a common size requires subdividing the parts of each fraction
      to generate equivalent fractions in the model.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.compare.same-denominator
    relation: definitional
    points_to: statement
    why: Once both fractions are shown in parts of a common size, the numbers of parts are compared as
      with a shared denominator.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
related:
- node: fraction.compare.same-numerator
  relation: common_path
  note: 'Common path, not required: route ''critic-route-1'' needed everything another route needs and
    more, so it was removed.'
- node: partitioning.equal-shares.more-shares-smaller
  relation: common_path
  note: 'Common path, not required: route ''critic-route-1'' needed everything another route needs and
    more, so it was removed.'
status: proposed
