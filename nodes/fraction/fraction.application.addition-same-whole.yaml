id: fraction.application.addition-same-whole
concept: fraction
facet: part-whole
level: 3
type: application
name: Solve word problems adding fractions of the same whole
statement: A story combines two fractional amounts of the same whole, possibly with unlike denominators;
  the learner represents it with an equation or model and finds the total.
assess: Maria walked 2/3 mile to the park and then 3/4 mile to the store. How far did she walk in all?
sources:
  ccss:
  - 5.NF.A.2
  learning_components:
  - 4b749054
requires:
- clause: standard
  all_of:
  - node: fraction.addition.unlike-denominators
    relation: definitional
    points_to: statement
    why: The statement says the amounts may have unlike denominators, and the total is found by adding
      them with this procedure.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.addition.joining
    relation: definitional
    points_to: statement
    why: The story combines two fractional amounts of the same whole, which is the joining meaning of
      addition.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
related:
- node: fraction.compare.same-whole
  relation: same_idea_different_form
  note: The same-whole condition is already part of the joining meaning (parts of the same whole) and
    is supplied by the story; the comparison form of the idea is not a separate requirement for addition.
status: proposed
