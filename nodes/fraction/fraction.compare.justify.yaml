      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.compare.same-numerator
    relation: justificatory
    points_to: statement
    why: The argument about part size when the part counts match is the justification of the same-numerator
      comparison.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.compare.same-whole
    relation: definitional
    points_to: statement
    why: A drawing comparing two fractions is valid only if both models use wholes of the same size, as
