id: fraction.addition.joining
concept: fraction
facet: part-whole
level: 2
type: concept
name: Adding fractions as joining parts of the same whole
statement: Adding two fractions means joining their parts into one amount, where both fractions refer
  to the same whole.
assess: Using one bar as the whole, draw what 2/5 + 1/5 means and say what the sum counts.
