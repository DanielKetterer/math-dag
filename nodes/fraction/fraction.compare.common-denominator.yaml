id: fraction.compare.common-denominator
concept: fraction
facet: measure
level: 3
type: procedure
name: Compare fractions by rewriting over a common denominator
statement: Compare two fractions by rewriting both over a common denominator with the multiplication principle;
  the fraction with the greater rewritten numerator is greater.
procedure:
- Find a common multiple of the two denominators (the product of the denominators always works).
- Rewrite each fraction over that denominator by multiplying its numerator and denominator by the same
  whole number.
- Compare the rewritten numerators; the larger numerator gives the larger fraction, and equal numerators
  mean the fractions are equal.
assess: Which is greater, 5/6 or 7/9? Show your work.
