id: fraction.application.multiplication-in-context.model
concept: fraction
facet: operator
level: 2
type: application
name: Solve real-world fraction multiplication problems with a visual model
statement: A real-world problem asks for a fraction of a fractional or mixed-number quantity; the learner
  represents it with a visual fraction model and reads the answer from the model.
assess: A garden is 3/4 of an acre. 2/3 of the garden is planted with corn. Draw a model to find how many
  acres are planted with corn.
sources:
  ccss:
  - 5.NF.B.6
  learning_components:
  - 46d4232e
requires:
- clause: standard
  all_of:
  - node: fraction.multiplication.parts-of-partition.fraction
    relation: definitional
    points_to: statement
    why: Finding a fraction of a fractional quantity in a model means taking a parts of the quantity split
      into b equal parts.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.mixed-number.meaning
    relation: definitional
    points_to: statement
    why: The statement allows a mixed-number quantity, which is a whole number plus a fraction in the
      model.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.array-area.fraction-product.represent
    relation: representational
    points_to: statement
    why: The visual model for the product is the area model of a fraction times a fraction.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The area model is one visual model for a product of fractions; a partitioned
        bar or number-line model of a parts of c/d split into b equal parts also works.'
    status: disputed
status: proposed
