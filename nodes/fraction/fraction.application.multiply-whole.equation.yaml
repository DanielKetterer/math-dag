id: fraction.application.multiply-whole.equation
concept: fraction
facet: measure
level: 3
type: representation
name: Write an equation for a fraction-times-whole-number word problem
statement: A story problem about n equal groups of a/b is represented by the equation n x (a/b) = t, where
  t is the unknown total.
assess: 'Write an equation (do not solve) for: each of 4 bags holds 2/3 of a pound of rice; how many pounds
  of rice are there in all?'
sources:
