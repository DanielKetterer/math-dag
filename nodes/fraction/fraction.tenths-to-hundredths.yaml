id: fraction.tenths-to-hundredths
concept: fraction
facet: measure
level: 3
type: procedure
name: Rewrite tenths as hundredths
statement: A fraction with denominator 10 is rewritten with denominator 100 by multiplying numerator and
  denominator by 10, so a/10 = (10 x a)/100.
procedure:
- Multiply the numerator by 10.
- Multiply the denominator 10 by 10 to get 100.
- Write the result over 100.
assess: Write 7/10 as a fraction with denominator 100.
