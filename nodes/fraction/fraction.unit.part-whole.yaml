id: fraction.unit.part-whole
concept: fraction
facet: part-whole
level: 2
type: concept
name: Unit fraction as one of b equal parts of a whole
statement: 1/b names the quantity formed by one part when a whole is partitioned into b equal parts.
assess: This rectangle is split into 6 equal parts and one is shaded. What fraction of the rectangle is
  shaded?
sources:
  ccss:
  - 3.NF.A.1
  - 3.G.A.2
  learning_components:
  - 188fe970
  - 1b707b1d
requires:
- clause: standard
  all_of:
  - node: partitioning.equal-shares.area
    relation: definitional
    points_to: statement
    why: The whole is partitioned into b equal parts, which is the equal-shares partition of a circle
      or rectangle.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.objects
    relation: definitional
    points_to: statement
    why: The denominator b is found by counting the equal parts (the test item has 6 parts); no route
      reads b without counting or an equivalent.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
related:
- node: partitioning.equal-shares.name
  relation: specializes
  note: The half/third/fourth names are the special cases b = 2, 3, 4 of the unit-fraction name 1/b. A
    learner can meet 1/b directly from equal partitions without the vocabulary words.
status: proposed
