id: fraction.decompose.justify
concept: fraction
facet: measure
level: 2
type: justification
name: Justify a fraction decomposition with a model
statement: An equation decomposing a/b into a sum of fractions with denominator b is justified by a model
  showing that the parts on the right, put together, are exactly the a parts of size 1/b.
assess: Use a drawing to show why 5/6 = 2/6 + 2/6 + 1/6.
