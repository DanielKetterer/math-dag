name: Record a fraction decomposition as an equation
statement: A decomposition of a/b into groups of parts of size 1/b is recorded as an equation a/b = c/b
  + d/b + ..., where the numerators on the right add to a.
assess: A model shows 7/5 split into a group of 3 fifths and a group of 4 fifths. Write the equation.
