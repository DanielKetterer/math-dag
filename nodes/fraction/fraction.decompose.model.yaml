id: fraction.decompose.model
concept: fraction
facet: measure
level: 2
type: procedure
name: Decompose a fraction into a sum of same-denominator fractions with a model
statement: Using a model of a/b as a parts of size 1/b, including when a is greater than b, split the
  a parts into groups in more than one way; each grouping is a sum of fractions with denominator b.
procedure:
- Show a/b on a model as a parts of size 1/b.
- Separate the a parts into two or more groups.
- Name each group as (number of parts in the group)/b.
- Regroup the parts differently to get another decomposition.
assess: Shade 7/5 on fraction strips of fifths, then group the shaded fifths to show two different ways
  to break 7/5 into a sum of fifths.
