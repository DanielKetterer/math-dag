id: fraction.compare.common-numerator
concept: fraction
facet: part-whole
level: 3
type: procedure
name: Compare fractions by rewriting with a common numerator
statement: Compare two fractions with nonzero numerators by rewriting both with a common numerator; the
  fraction with the smaller rewritten denominator is greater.
procedure:
- Find a common multiple of the two numerators (the product of the numerators always works).
- Rewrite each fraction with that numerator by multiplying its numerator and denominator by the same whole
  number.
- Compare the rewritten denominators; the smaller denominator gives the larger fraction, and equal denominators
  mean the fractions are equal.
assess: Which is greater, 2/3 or 3/5? Compare them by making the numerators the same.
