id: fraction.equivalent.multiply-principle
concept: fraction
facet: measure
level: 3
type: concept
name: The multiplication principle for equivalent fractions
statement: For any fraction a/b and any whole number n greater than 0, a/b = (n x a)/(n x b).
assess: 'True or false: 3/5 = 12/20. True or false: 3/5 = 5/7. Say which rule decides it.'
sources:
  ccss:
  - 4.NF.A.1
  learning_components:
  - 5f61cb2a
  - c3b684c1
requires:
- clause: standard
  all_of:
  - node: fraction.equivalent.same-point
    relation: definitional
    points_to: statement
    why: The rule asserts that a/b and (n x a)/(n x b) name the same point, which is what equivalence
      means on the line.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.equivalent.simple.generate
    relation: representational
    points_to: statement
    why: The rule is the general symbolic form of the pattern seen when splitting every part in a model
      into equal smaller parts.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: The symbolic pattern can be noticed from several number-line examples (2/3 and
        4/6, 1/2 and 3/6, ...) where a finer partition keeps the same point, which fraction.equivalent.same-point
        already supplies.'
    status: disputed
  - node: multiplication.facts.within-100
    relation: procedural
    points_to: assess
    why: Checking that 12/20 equals 3/5 requires multiplying 3 and 5 by 4 using single-digit facts.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test items (3 x 4, 5 x 4, etc.) need recalled products; the principle
        itself holds for any whole number n.'
    status: proposed
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: The products n x a and n x b are totals of n equal groups of a parts and of b parts.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: At level 3 the learner needs to understand what n x a means, but the equal-groups
        reading is not the only way: the product as an array (rows by columns) gives the same understanding.'
    status: disputed
- clause: critic-route-1
  note: Understand n x a and n x b through the array (rows by columns) meaning of multiplication instead
    of equal groups.
  all_of:
  - node: fraction.equivalent.same-point
