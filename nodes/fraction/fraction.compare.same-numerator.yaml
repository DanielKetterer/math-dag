id: fraction.compare.same-numerator
concept: fraction
facet: part-whole
level: 2
type: procedure
name: Compare fractions with the same numerator
statement: 'When two fractions have the same numerator, there are the same number of parts, so the fraction
  whose parts are larger (smaller denominator) is greater.

  '
assess: Which is greater, 2/3 or 2/5? Explain.
