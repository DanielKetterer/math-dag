id: subtraction.notation.equation
concept: subtraction
facet: operation
level: 2
type: representation
name: Write a subtraction equation for a taking-away situation
statement: The equation a - b = c records that taking an amount b away from an amount a leaves the amount
  c.
assess: 'Write an equation for: 7 apples were on a plate, 3 were eaten, and 4 are left.'
sources:
  ccss:
  - K.OA.A.1
  learning_components:
  - 3ecee76a
requires:
- clause: standard
  all_of:
  - node: subtraction.notation.expression
    relation: representational
    points_to: statement
    why: The equation a - b = c extends the expression a - b by recording the amount left after b is taken
      from a.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.take-away.describe
    relation: definitional
    points_to: statement
    why: The result c is the amount named as how many are left after the taking-away action.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: numeral.write
    relation: representational
    points_to: statement
    why: The equation also records the amount left c as a written numeral after the equal sign.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
