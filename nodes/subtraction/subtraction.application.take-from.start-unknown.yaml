id: subtraction.application.take-from.start-unknown
concept: subtraction
facet: take-away
level: 2
type: application
name: Solve take-from story problems with the start unknown
statement: A story gives how many were taken away and how many are left, and asks how many there were
  at the start; the answer is the amount left joined with the amount taken.
assess: Some children were at the park. 4 children went home. Now 9 children are at the park. How many
  children were at the park at first? Use objects, a drawing, or an equation.
sources:
  ccss:
  - 1.OA.A.1
  - 2.OA.A.1
  learning_components:
  - 17aaf480
  - fe904c98
  - c1129849
  - ecfbb806
requires:
- clause: equation
  all_of:
  - node: subtraction.application.take-from-story
    relation: definitional
    points_to: statement
    why: The story is a take-from situation that the learner already solves with objects when the result
      is unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.unknown.subtraction
    relation: procedural
    points_to: statement
    why: The answer is the amount left joined with the amount taken, which is the unknown minuend in a
      subtraction equation.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Solving the unknown-minuend equation is needed only on the equation route.'
    status: disputed
  - node: equation.situation.one-step
    relation: representational
    points_to: statement
    why: The learner writes ? - 4 = 9 with a symbol in the start position.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Writing the equation is needed only on the equation route.'
    status: disputed
- clause: via-meaning
  all_of:
  - node: subtraction.application.take-from-story
    relation: definitional
    points_to: statement
    why: The story is a take-from situation that the learner already solves with objects when the result
      is unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.unknown-addend.meaning
    relation: justificatory
    points_to: statement
    why: The start is the number that, with 4 taken, leaves 9, so it is 4 + 9 joined together.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Reasoning that the start is 4 + 9 uses the unknown-addend meaning; the task allows
        joining objects instead. | other route: Objects route: join left and taken with objects and count
        on (addition.count-on).'
    status: disputed
- clause: via-count-on
  all_of:
  - node: subtraction.application.take-from-story
    relation: definitional
    points_to: statement
    why: The story is a take-from situation that the learner already solves with objects when the result
      is unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.count-on
    relation: procedural
    points_to: statement
    why: With objects, the amount left and the amount taken are put together and counted on to find the
      start.
