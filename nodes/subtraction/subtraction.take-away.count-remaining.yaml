id: subtraction.take-away.count-remaining
concept: subtraction
facet: take-away
level: 1
type: procedure
name: Take objects away and count what is left
statement: Find how many remain when some objects are removed from a set by removing them and counting
  the objects left.
procedure:
- Make the starting set with objects.
- Remove the number of objects to be taken away.
- Count the objects that remain; the last number word said is the answer.
assess: Put 5 crackers on a plate. Take 2 away and set them out of reach. 'How many crackers are left
  on the plate?' Credit 3 found by counting the plate.
