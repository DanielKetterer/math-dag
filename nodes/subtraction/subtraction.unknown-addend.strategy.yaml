    relation: procedural
    points_to: procedure.1
    why: Step 1 rewrites a - b = ? as b + ? = a, which is exactly the rewrite of a subtraction as an unknown-addend
      addition.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.unknown.addition
    relation: procedural
    points_to: procedure.2
    why: Step 2 finds the missing addend in b + ? = a, which is finding the unknown in an addition equation.
    evidence:
    - kind: content
