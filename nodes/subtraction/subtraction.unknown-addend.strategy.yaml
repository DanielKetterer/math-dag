id: subtraction.unknown-addend.strategy
concept: subtraction
facet: unknown-addend
level: 3
type: procedure
name: Subtract by finding the missing addend
statement: To find a - b, find the number c with b + c = a, using a known addition fact or by counting
  up from b to a; c is the difference.
procedure:
- Rewrite a - b = ? as b + ? = a.
- Find the missing addend from a known addition fact, or count up from b to a and track how many were
  counted.
- The missing addend is a - b.
assess: Find 13 - 9 by thinking of 9 + ? = 13. Tell the addition fact you used.
