      algorithm.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.base-ten.decompose-unit
    relation: definitional
    points_to: statement
    why: The test differences 73 - 48 and 90 - 36 have too few ones in the first number, so a ten must
      be decomposed into ten ones.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Counting up by the related addition (named in the statement) finds 73 - 48 without
        decomposing a ten. | other route: Count up from the subtrahend to the minuend by the related addition
        (48 to 50 to 70 to 73), adding the jumps.'
    status: disputed
- clause: critic-route-1
  note: Count up from the subtrahend to the minuend by the related addition and add the jumps.
