        a difference by any method.'
    - kind: review
      source: DK
      note: 'C65, D81 set_routes: Daniel: no unconditional verbal edge; taking away and counting the rest,
        counting back, or related addition each find the difference.'
    status: reviewed
- clause: via-related-addition
  all_of:
  - node: subtraction.unknown-addend.strategy
    relation: procedural
    points_to: statement
    why: Finding the missing addend in b + ? = a finds a - b, one route.
