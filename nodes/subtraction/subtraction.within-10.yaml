id: subtraction.within-10
concept: subtraction
facet: operation
level: 1
type: procedure
name: Find a difference within 10
statement: 'Find a - b for whole numbers with b no greater than a and a at most 10, by any reliable method:
  taking objects away and counting the rest, counting back, counting up, or a known fact.'
assess: What is 9 - 4? Show or tell how you know.
sources:
  ccss:
  - K.OA.A.2
  learning_components:
  - 5c48ad41
requires:
- clause: via-take-away
  all_of:
  - node: subtraction.take-away.count-remaining
    relation: procedural
    points_to: statement
    why: Removing b objects from a and counting those left finds the difference, one route.
    evidence:
    - kind: review
      source: DK
      note: 'C65, D81 add: Daniel: methods named as routes to a difference within 10.'
    - kind: review
      source: DK
      note: 'C65, D81 set_routes: Daniel: no unconditional verbal edge; taking away and counting the rest,
        counting back, or related addition each find the difference.'
    status: reviewed
  - node: subtraction.notation.expression
    relation: representational
    points_to: assess
    why: The test problem is written as 9 - 4, so the learner must read the subtraction expression with
      its minus sign.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem is written with a minus sign; the statement just asks for
        a difference by any method.'
    - kind: review
      source: DK
      note: 'C65, D81 set_routes: Daniel: no unconditional verbal edge; taking away and counting the rest,
        counting back, or related addition each find the difference.'
    status: reviewed
  - node: counting.objects
    relation: procedural
    points_to: statement
    why: Every method named, from taking objects away to counting back, finds the result by counting what
      remains.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'C65, D81 set_routes: Daniel: no unconditional verbal edge; taking away and counting the rest,
        counting back, or related addition each find the difference.'
    status: reviewed
- clause: via-count-back
  all_of:
  - node: subtraction.count-back
    relation: procedural
    points_to: statement
    why: Counting back b from a finds the difference, one route.
    evidence:
    - kind: review
      source: DK
      note: 'C65, D81 add: Daniel: methods named as routes to a difference within 10.'
    - kind: review
      source: DK
      note: 'C65, D81 set_routes: Daniel: no unconditional verbal edge; taking away and counting the rest,
        counting back, or related addition each find the difference.'
    status: reviewed
  - node: subtraction.notation.expression
