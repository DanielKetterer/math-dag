id: subtraction.unknown-addend.rewrite
concept: subtraction
facet: unknown-addend
level: 2
type: representation
name: Rewrite a subtraction as an addition with an unknown addend
statement: The subtraction a - b = ? is rewritten as the addition b + ? = a, with the unknown in the addend
  position.
assess: Write an addition equation with a box for the missing number that has the same answer as 15 -
  7 = ?. Do not solve it.
