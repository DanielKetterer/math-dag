id: subtraction.tens-minus-tens.relate-written
concept: subtraction
facet: take-away
level: 2
type: representation
name: Match a subtraction of tens done with a model to a written record
statement: Each step of a subtraction of tens done with ten-rods or a drawing corresponds to a step of
  a written record, such as an equation in tens.
assess: Mia took 3 ten-rods away from 8 ten-rods. Which written line matches what she did?  (a) 80 - 30
  = 50  (b) 80 - 3 = 77  (c) 8 + 3 = 11
