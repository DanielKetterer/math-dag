id: subtraction.take-away.number-line
concept: subtraction
facet: take-away
level: 2
type: representation
name: Represent a whole-number difference by jumping back on a number line
statement: For whole numbers with b no greater than a, the difference a - b is shown by starting at a
  and moving b units to the left; the point reached is a - b.
procedure:
- Locate a on the number line.
- From a, mark a length of b units to the left, in one jump or in smaller jumps that total b.
- Read the label at the endpoint; it is a - b.
assess: Show 62 - 17 on a number line by jumping back from 62, and find the difference.
