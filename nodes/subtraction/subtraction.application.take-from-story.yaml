id: subtraction.application.take-from-story
concept: subtraction
facet: take-away
level: 1
type: application
name: Solve take-from story problems with objects
statement: A story tells of a starting amount and an amount taken from it and asks how many are left;
  the learner acts the story out with objects or fingers and finds the result.
assess: '''There are 5 ducks in the pond. 2 ducks fly away. How many ducks are still in the pond?'' (counters
  available). Credit 3.'
sources:
  ccss:
  - K.OA.A.2
  learning_components: []
  prek:
  - elof.p-math-6
requires:
- clause: standard
  all_of:
  - node: subtraction.take-away.count-remaining
    relation: definitional
    points_to: statement
    why: Acting the story out with objects means removing the amount taken from the starting amount and
      counting what is left.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A31 keep: Kept after review discussion 2026-10-19 (Daniel accepted the pushback): the node
        is acting out with objects; recalled facts are a different node. | Daniel: REJECT as universal;
        retain as a route: Removing objects and counting what remains is one way to solve a take-from
        story, not the only way.'
    status: reviewed
  - node: counting.produce-set
    relation: definitional
    points_to: statement
    why: The story gives the amounts as numbers (5 ducks, 2 fly away), so the learner must build a set
      of 5 and remove exactly 2.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'D73 keep: KEEP as a task-/route-scoped edge: The object-modeling route may require constructing
        a starting set of five and removing two, but a solver using fingers or known facts need not perform
        the separate count-out procedure.'
    status: reviewed
status: proposed
