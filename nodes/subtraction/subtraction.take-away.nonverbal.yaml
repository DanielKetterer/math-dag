id: subtraction.take-away.nonverbal
concept: subtraction
facet: take-away
level: 1
type: procedure
name: Take away from a very small hidden set without words
statement: After a set of two or three objects is hidden and one or two are removed from it, make a set
  that matches the number left, without naming any number.
assess: Show 3 balls, put them in an opaque box, then take 1 out while the child watches. 'Make your pile
  match how many are in the box now.' Credit a pile of 2, whether or not any number word is said.
