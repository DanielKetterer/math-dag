id: subtraction.base-ten.explain
concept: subtraction
facet: base-ten
level: 4
type: justification
name: Explain a place-value subtraction strategy with properties
statement: 'Taking away a number in place-value parts gives the correct difference because taking away
  b + c is the same as taking away b and then c: a - (b + c) = (a - b) - c.'
assess: Explain why 724 - 358 = ((724 - 300) - 50) - 8.
