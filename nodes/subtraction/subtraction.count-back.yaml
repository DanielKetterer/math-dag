id: subtraction.count-back
concept: subtraction
facet: take-away
level: 2
type: procedure
name: Subtract by counting back
statement: To find a - b, start from a and say the next b number words backward, keeping track of how
  many have been said; the last word said is a - b (the starting word a is not counted).
procedure:
- Start at the number a.
- Say the number one less and track it as 1 counted back; continue, tracking 2, 3, and so on.
- Stop when b words have been counted back; the last word said is the difference.
assess: Find 12 - 3 by counting back from 12.
sources:
