id: subtraction.tens-minus-tens.related-addition
concept: subtraction
facet: unknown-addend
level: 3
type: procedure
name: Subtract a multiple of 10 by finding the missing ten addend
statement: To find a - b for multiples of 10, find the multiple of 10 that added to b makes a, for example
  from a known fact in tens.
procedure:
- Rewrite a - b = ? as b + ? = a.
- Find the missing multiple of 10, using the matching one-digit fact in tens (5 + 3 = 8, so 50 + 30 =
  80).
- The missing addend is the difference.
assess: Find 80 - 50 by thinking of 50 + ? = 80. Tell the fact you used.
