id: subtraction.base-ten.add-up
concept: subtraction
facet: comparison
level: 3
type: procedure
name: Subtract within 1000 by adding up from the subtrahend
statement: Find a - b, without blocks or drawings, as the missing addend in b + ? = a by adding up from
  b to a in place-value jumps (to the next ten, the next hundred, then on to a) and totaling the jumps.
procedure:
- Start at the subtrahend b.
- Add on to reach the next ten, then the next hundred, then hundreds and tens and ones until you reach
  a.
- Add all the amounts you added on; the total is a - b.
assess: Without blocks or drawings, find 603 - 278 by adding up from 278 to 603 and totaling the jumps.
