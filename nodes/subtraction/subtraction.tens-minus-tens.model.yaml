id: subtraction.tens-minus-tens.model
concept: subtraction
facet: take-away
level: 2
type: procedure
name: Subtract a multiple of 10 from a multiple of 10 with a base-ten model
statement: To subtract one multiple of 10 from another (each from 10 to 90, the difference 0 or more)
  with ten-rods or a drawing, take away that many tens; the tens left give the difference.
procedure:
- Show the first number as ten-rods.
- Take away as many ten-rods as the second number has tens.
- Count the ten-rods left and name the number they show.
assess: Use ten-rods or a drawing of tens to find 80 - 50.
