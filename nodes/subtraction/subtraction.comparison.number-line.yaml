id: subtraction.comparison.number-line
concept: subtraction
facet: comparison
level: 2
type: representation
name: Represent a whole-number difference as a distance on a number line
statement: For whole numbers with b no greater than a, the difference a - b is the length of the segment
  from b to a on the number line.
procedure:
- Locate b and a on the number line.
- Measure the length from b up to a, in one jump or in smaller jumps (for example to the next ten, then
  by tens).
- The total length of the jumps is a - b.
assess: Use a number line to find how far it is from 48 to 73, and write the subtraction it shows.
