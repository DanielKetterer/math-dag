      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.unknown.subtraction
    relation: procedural
    points_to: statement
    why: The answer is the start minus what is left, which is the unknown subtrahend in a subtraction
