id: subtraction.application.take-from.change-unknown
concept: subtraction
facet: take-away
level: 2
type: application
name: Solve take-from story problems with the change unknown
statement: A story gives a starting amount and the amount left after some were taken away, and asks how
  many were taken; the answer is the start minus what is left.
assess: There were 14 cookies on a plate. Some were eaten. Now there are 6 cookies. How many were eaten?
  Use objects, a drawing, or an equation.
sources:
  ccss:
  - 1.OA.A.1
  - 2.OA.A.1
  learning_components:
