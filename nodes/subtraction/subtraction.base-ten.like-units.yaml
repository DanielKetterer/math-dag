      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.within-10.fluency
    relation: definitional
    points_to: assess
    why: In the test problem 586 - 30 the learner must find 8 tens minus 3 tens, a single-digit difference
      of units.
    scope: task
