id: subtraction.base-ten.like-units
concept: subtraction
facet: base-ten
level: 2
type: concept
name: Subtract like base-ten units
statement: Subtracting numbers written in base ten means subtracting hundreds from hundreds, tens from
  tens, and ones from ones; units of different sizes are never subtracted from each other directly.
assess: Kai says 586 - 30 = 286 because 5 - 3 = 2. Is he right? Use hundreds, tens, and ones to say what
  586 - 30 is.
