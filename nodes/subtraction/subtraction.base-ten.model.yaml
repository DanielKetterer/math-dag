id: subtraction.base-ten.model
concept: subtraction
facet: base-ten
level: 2
type: procedure
name: Subtract within 1000 with base-ten models
statement: Find a difference within 1000 with base-ten blocks or a drawing by taking away like units,
  trading 1 ten for 10 ones or 1 hundred for 10 tens where needed.
procedure:
- Show the minuend with hundreds, tens, and ones (blocks or a drawing).
- For each place, starting with the ones, if there are fewer units than must be taken away, trade 1 unit
  of the next larger place for 10 of this unit; if that place is empty, first trade a hundred for 10 tens.
- Take away the ones, tens, and hundreds of the subtrahend.
- Count the hundreds, tens, and ones left to read the difference.
assess: Use base-ten blocks or a drawing to find 503 - 268.
