id: subtraction.base-ten.decompose-unit
concept: subtraction
facet: base-ten
level: 2
type: concept
name: Decompose a ten or a hundred when subtracting
statement: When a place has too few units to subtract from, 1 unit of the next larger place can be traded
  for 10 units of this place without changing the number.
assess: You have 4 tens and 2 ones and must take away 7 ones. Trade 1 ten. How many tens and ones do you
  have now, and is it the same number?
sources:
  ccss:
