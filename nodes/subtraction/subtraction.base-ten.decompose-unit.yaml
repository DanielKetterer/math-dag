    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: place-value.hundred.unit
    relation: definitional
    points_to: statement
    why: The statement also trades 1 hundred for 10 tens, which is the meaning of a hundred as ten tens.
    evidence:
    - kind: content
      source: pass-P
