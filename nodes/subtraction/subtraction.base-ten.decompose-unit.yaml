  learning_components:
  - 961d4025
requires:
- clause: standard
  all_of:
  - node: place-value.ten.unit
    relation: definitional
    points_to: statement
    why: The statement trades 1 ten for 10 ones, which is the meaning of a ten as a bundle of ten ones.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
