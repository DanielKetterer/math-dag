    relation: procedural
    points_to: statement
    why: Each pair of values from the table, such as (1, 25), is plotted as one point on the coordinate
      grid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: relationship.dependent-independent.meaning
    relation: definitional
    points_to: statement
    why: The statement puts the independent variable on the horizontal axis and the dependent variable
      on the vertical axis.
    evidence:
