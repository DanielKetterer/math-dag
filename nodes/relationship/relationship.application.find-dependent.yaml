      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.evaluate
    relation: procedural
    points_to: statement
    why: Finding the dependent value for a given independent value is evaluating the equation's expression
      at that value.
