id: relationship.equation.write.additive
concept: relationship
facet: dependent-independent
level: 3
type: representation
name: Write y = x + c for two quantities that differ by a fixed amount
statement: When a dependent quantity is always a fixed amount c more than, or less than, an independent
  quantity, write the equation y = x + c, or y = x - c, with the dependent variable alone on one side.
assess: Maya is always 3 years older than her brother. Write an equation for Maya's age m in terms of
  her brother's age b.
sources:
  ccss:
  - 6.EE.C.9
  learning_components:
  - cc56ee36
requires:
- clause: standard
  all_of:
  - node: relationship.dependent-independent.meaning
    relation: definitional
    points_to: statement
    why: The equation puts the dependent variable alone on one side, so the learner must tell which quantity
      is determined by the other.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.write-for-situation
    relation: representational
    points_to: statement
    why: Writing the side x + c or x - c is writing an expression with a letter for a quantity, such as
      b + 3 for Maya's age.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
