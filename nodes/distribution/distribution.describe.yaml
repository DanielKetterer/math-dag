id: distribution.describe
concept: distribution
facet: core
level: 2
type: concept
name: Describe a distribution by its center, spread, and shape
statement: The values of a numerical data set collected to answer a statistical question form a distribution,
  described informally by where its values center, how far they spread, and its overall shape.
assess: 'A dot plot shows the number of books each of 13 students read last month: 1 dot above 1, 3 dots
  above 2, 5 dots above 3, 3 dots above 4, and 1 dot above 5. Describe where the data center, how far
  they spread, and the overall shape.'
sources:
  ccss:
  - 6.SP.A.2
  learning_components:
  - ee7501cd
requires:
- clause: standard
  all_of:
  - node: data.dot-plot.read
    relation: representational
    points_to: assess
    why: The test problem gives the data as a dot plot, so the learner reads the dots as values before
      describing center, spread, and shape.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem hands over the data as a dot plot; describing center, spread
        and shape can equally start from a histogram or an ordered list of values.'
    status: proposed
status: proposed
