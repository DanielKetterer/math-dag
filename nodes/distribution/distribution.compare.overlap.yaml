id: distribution.compare.overlap
concept: distribution
facet: core
level: 2
type: concept
name: Judge the visual overlap of two distributions with similar variability
statement: For two numerical distributions with similar variability shown on the same scale, the less
  their plots overlap, the larger the difference between their centers is compared with their spread;
  distributions that barely overlap are clearly separated.
assess: Four dot plots share one scale and have about the same spread. Plot A runs from 150 to 170 and
  plot B from 152 to 172. Plot C runs from 150 to 170 and plot D from 175 to 195. Which pair of plots
  overlaps more? In which pair are the two groups clearly separated?
