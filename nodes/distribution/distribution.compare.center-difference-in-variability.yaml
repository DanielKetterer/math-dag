id: distribution.compare.center-difference-in-variability
concept: distribution
facet: core
level: 3
type: procedure
name: Express the difference between two centers as a multiple of a measure of variability
statement: For two numerical distributions with similar variability, the difference between their centers
  is measured in units of that variability by dividing the difference by the common measure of variability
  (such as the MAD).
procedure:
- Subtract the smaller center from the larger center.
- Divide the difference by the common measure of variability.
- Report the result as the number of measures of variability that separate the centers.
assess: The mean height of the basketball team is 190 cm and the mean height of the soccer team is 180
  cm. The MAD of each team's heights is 5 cm. The difference between the means is how many MADs?
