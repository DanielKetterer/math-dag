id: distribution.shape.symmetric-skewed
concept: distribution
facet: core
level: 2
type: concept
name: Symmetric and skewed distributions
statement: A distribution is symmetric when its two sides about the center are close to mirror images,
  skewed right when its values trail off in a long tail toward larger values, and skewed left when they
  trail off in a long tail toward smaller values.
assess: 'Three dot plots use a scale from 0 to 10. Plot A has most dots at 1 to 3 and a few stretching
  out to 9. Plot B has most dots at 7 to 9 and a few stretching down to 1. Plot C has its dots piled around
  5 and falling off equally on both sides. Name the shape of each: symmetric, skewed left, or skewed right.'
