id: distribution.pattern-deviations
concept: distribution
facet: core
level: 2
type: concept
name: Describe the overall pattern and striking deviations in context
statement: Summarizing a numerical data set includes describing its overall pattern (where most values
  lie, clusters, gaps) and any values that depart strikingly from that pattern, with a possible reason
  for the departure drawn from how and where the data were gathered.
assess: 'Minutes that 10 students spent on homework last night: 25, 30, 30, 35, 35, 35, 40, 40, 45, 150.
  Describe the overall pattern, name the value that departs from it, and give a reason from the situation
  that could explain it.'
