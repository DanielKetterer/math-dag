id: comparing.size.order
concept: comparing
facet: length
level: 1
type: procedure
name: Order several objects by length
statement: Put three to five objects in order from shortest to longest by comparing their lengths, so
  each object is longer than the one before it.
assess: Give the child 5 straws of clearly different lengths in a mixed pile. 'Put these in order from
  the shortest to the longest.' Credit a correct order.
