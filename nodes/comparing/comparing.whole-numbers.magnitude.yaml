id: comparing.whole-numbers.magnitude
concept: comparing
facet: whole-number
level: 3
type: procedure
name: Decide which of two two-digit numbers is greater
statement: Of two two-digit numbers, the one with more tens is greater; if the tens are equal, the one
  with more ones is greater.
procedure:
- If one numeral has more digits, it names the greater number.
- Otherwise, compare the digits place by place from the left.
- At the first place where the digits differ, the number with the greater digit is greater; if no place
  differs, the numbers are equal.
assess: Which is greater, 47 or 52? Which is greater, 38 or 35? Say which digits decide it.
