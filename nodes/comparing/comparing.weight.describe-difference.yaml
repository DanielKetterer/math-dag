id: comparing.weight.describe-difference
concept: comparing
facet: weight
level: 1
type: representation
name: Describe a direct weight comparison with weight words
statement: After two objects are compared directly by weight, the result is stated with the comparison
  words heavier or lighter rather than a general word such as bigger.
assess: A pan balance holds a book on one side and a box of crayons on the other, and the book side is
  lower. Tell how the weights compare, using a word that is about weight.
