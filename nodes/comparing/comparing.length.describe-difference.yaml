id: comparing.length.describe-difference
concept: comparing
facet: length
level: 1
type: representation
name: Describe a direct length comparison with length words
statement: After two objects are compared directly by length or height, the result is stated with the
  comparison words for that attribute (longer or shorter, taller or shorter) rather than a general word
  such as bigger.
assess: Two children stand back to back and one is clearly taller. Tell how their heights compare, using
  a word that is about height.
