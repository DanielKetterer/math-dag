id: comparing.whole-numbers.numerals-within-10
concept: comparing
facet: whole-number
level: 2
type: procedure
name: Compare two numerals from 1 to 10
statement: Of two written numerals from 1 to 10, the one that comes later in the counting sequence names
  the greater number.
assess: 'Shown only the written numerals 9 and 6, with no objects: which number is greater?'
sources:
  ccss:
  - K.CC.C.7
  learning_components:
  - 96c682e0
requires:
- clause: standard
  all_of:
  - node: numeral.read
    relation: representational
    points_to: statement
    why: The two written numerals 9 and 6 are given with no objects, so each must be read as its number.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.successor
    relation: definitional
    points_to: statement
    why: The later number in the counting sequence is greater because each next number word is one more
      than the one before.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: comparing.more-than
    relation: definitional
    points_to: statement
    why: Greater means a greater number or more, which is the meaning of more in a comparison of numbers.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.sequence.recite
    relation: definitional
    points_to: statement
    why: The comparison uses which number word comes later in the counting sequence.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
