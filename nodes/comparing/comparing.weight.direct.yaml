id: comparing.weight.direct
concept: comparing
facet: weight
level: 1
type: procedure
name: Compare two weights directly
statement: Decide which of two objects is heavier, or that they weigh the same, by holding one in each
  hand or placing them in the two pans of a balance; the side that goes down holds the heavier object.
assess: Give the child a small, heavy stone and a large, light sponge and a pan balance. 'Which one is
  heavier? Show me how you know.' Credit the stone, shown with the balance or by hefting.
sources:
  ccss:
  - K.MD.A.2
  learning_components: []
  prek:
  - elof.p-math-8
requires:
- clause: standard
  all_of:
  - node: measurement.weight.attribute
    relation: definitional
    points_to: statement
    why: The learner must treat weight as a separate attribute of an object, apart from its size, to say
      the small stone is heavier than the large sponge.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'necessary: Substantively right: the stone versus sponge test requires weight as an attribute
        separate from size. But ''measurement.weight.attribute'' does not appear in index.txt; the node
        must be created or the edge repointed.'
    status: proposed
status: proposed
