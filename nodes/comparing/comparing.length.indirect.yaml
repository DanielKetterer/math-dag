id: comparing.length.indirect
concept: comparing
facet: length
level: 1
type: procedure
name: Compare two lengths indirectly using a third object
statement: Two lengths that cannot be placed side by side are compared by matching a third object, such
  as a string, to one of them and then comparing that third object with the other; whichever is longer
  than the matched string is the longer.
procedure:
- Lay a string or strip along the first object and mark or cut it at the first object's length.
- Place the marked string along the second object, with one end lined up.
- If the second object extends past the mark, it is longer than the first; if it stops short, it is shorter;
  if it ends at the mark, they are the same length.
assess: The door and the bookshelf cannot be moved next to each other. Use this piece of string to find
  out which is wider.
