id: comparing.count.small-equal
concept: comparing
facet: count
level: 1
type: concept
name: Recognize two small sets as the same number
statement: Recognize that two collections of one to four objects have the same number, or that one has
  more, by looking, even when the two collections are made of different kinds of objects.
assess: Show 3 toy cars and 3 buttons, arranged differently. 'Do these have the same number, or does one
  have more?' Then show 3 cars and 4 buttons. Credit 'same' for the first pair and 'the buttons' for the
  second.
sources:
  ccss: []
  learning_components: []
  prek:
  - cs.compare.nonverbal-similar
  - cs.compare.nonverbal-dissimilar
requires:
- clause: via-nonverbal
  all_of:
  - node: subitizing.nonverbal
    relation: definitional
    points_to: statement
    why: Judging that three cars and three buttons are the same number requires apprehending each small
      set's exact quantity directly without words, even when the objects differ.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The wordless apprehension of an exact small quantity is one way to judge sameness
        by looking. | other route: Subitize and name each set (subitizing.perceptual), then compare the
        two names (''three'' and ''three'').'
    status: disputed
- clause: critic-route-1
  note: Subitize and name each set, then compare the names.
  all_of:
  - node: subitizing.perceptual
    relation: definitional
    points_to: statement
    why: 'Alternative route proposed by the critic: Subitize and name each set, then compare the names.'
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing route
    status: disputed
status: proposed
