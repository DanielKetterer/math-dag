id: pythagorean-theorem.converse.explain
concept: pythagorean-theorem
facet: length
level: 4
type: justification
name: Explain a proof of the converse of the Pythagorean theorem
statement: Given a triangle with sides a, b, and c and a^2 + b^2 = c^2, build a right triangle with legs
  a and b; by the Pythagorean theorem its hypotenuse is c, so the two triangles have the same three side
  lengths, they are congruent, and the angle opposite c in the given triangle is a right angle.
assess: Triangle ABC has AC = 5, BC = 12, and AB = 13, so AC^2 + BC^2 = AB^2. Explain, by comparing it
  with a right triangle whose legs are 5 and 12, why angle C must be a right angle.
sources:
  ccss:
  - 8.G.B.6
  learning_components:
  - 54ee8a5e
requires:
