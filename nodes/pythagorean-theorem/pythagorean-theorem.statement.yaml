      note: necessary
    status: proposed
  - node: pythagorean-theorem.squares-on-sides
    relation: representational
    points_to: statement
    why: The equation a^2 + b^2 = c^2 writes the area fact about squares on the legs and hypotenuse in
      symbols for side lengths.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The equation can be reached without the area picture, by checking a^2 + b^2 =
        c^2 numerically on right triangles with given or measured side lengths (3-4-5, 5-12-13). The squares-on-sides
        fact is one way to give the equation meaning, not th | other route: Numerical investigation: square
        the two shorter sides and the longest side of several right triangles with given lengths, add,
        and observe a^2 + b^2 = c^2 each time.'
    status: disputed
