    relation: definitional
    points_to: statement
    why: The statement is about a right triangle, its legs, and the hypotenuse opposite the right angle.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: exponent.whole-number-power.meaning
    relation: representational
    points_to: statement
    why: The notation a^2, b^2 and c^2 means each length times itself.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.meaning
    relation: definitional
