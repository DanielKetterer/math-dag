id: pythagorean-theorem.converse
concept: pythagorean-theorem
facet: length
level: 3
type: concept
name: The converse of the Pythagorean theorem
statement: If the side lengths a, b, and c of a triangle satisfy a^2 + b^2 = c^2, the triangle is a right
  triangle with its right angle opposite the side of length c.
assess: A triangle has side lengths a, b, and c with a^2 + b^2 = c^2. What can you conclude about the
  angle opposite the side of length c?
sources:
  ccss:
  - 8.G.B.6
  learning_components:
  - 54ee8a5e
