id: triangle.conditions.classify
concept: triangle
facet: determination
level: 2
type: procedure
name: Decide whether three measures give one triangle, more than one, or none
statement: Given three measures of sides or angles, decide whether they determine exactly one triangle,
  more than one triangle, or no triangle.
procedure:
- 'Name which kind of condition the three measures are: three sides, two sides and the angle between them,
  two sides and an angle not between them, two angles and the side between them, or three angles.'
- 'Check whether the measures can fit any triangle: the two shorter sides must add to more than the longest,
  and the angles must add to less than 180 degrees, or to exactly 180 degrees when all three are angles.'
- If they fit, decide from the kind of condition whether only one triangle fits, or try to draw a second,
  different triangle that also meets them.
assess: 'For each set, say whether it gives exactly one triangle, more than one, or none: (a) sides of
  4 cm, 5 cm and 10 cm; (b) angles of 30, 60 and 90 degrees; (c) sides of 6 cm and 8 cm with a 50-degree
  angle between them.'
