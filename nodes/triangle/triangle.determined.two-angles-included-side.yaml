id: triangle.determined.two-angles-included-side
concept: triangle
facet: determination
level: 2
type: concept
name: Two angles and the side between them determine a unique triangle
statement: Two angle measures whose sum is less than 180 degrees, and the length of the side between those
  two angles, determine exactly one triangle.
assess: Ana and Ben each draw a triangle with a 5 cm side that has a 40-degree angle at one end and a
  60-degree angle at the other. Must their triangles be identical? Explain.
sources:
