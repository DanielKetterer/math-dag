id: height.base-height
concept: height
facet: core
level: 2
type: concept
name: Base and height of a triangle or parallelogram
statement: Once a side is chosen as the base, the height is the length of a segment perpendicular to the
  line containing the base, running from that line to the opposite vertex of a triangle or to the opposite
  side of a parallelogram. The height may lie outside the figure.
assess: 'In the obtuse triangle shown, the base is the 6 cm side. Two segments are drawn from the top
  vertex: the 5 cm side of the triangle, and a 4 cm dashed segment that meets the extended base line at
  a right angle outside the triangle. Which length is the height for this base?'
sources:
  ccss:
  - 6.G.A.1
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: perpendicular.meaning
    relation: definitional
    points_to: statement
    why: The height is defined as a segment perpendicular to the line that contains the base.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: line.meaning
    relation: definitional
    points_to: statement
    why: The base is extended into a whole line, and the height may meet that line outside the figure.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.polygon.name-by-sides
    relation: definitional
    points_to: statement
    why: The height is defined for a triangle, which must be recognized by its three sides and vertices.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.quadrilateral.parallel-sides.define
    relation: definitional
    points_to: statement
    why: The height is also defined for a parallelogram, which is identified by its two pairs of parallel
      sides.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: segment.meaning
    relation: definitional
    points_to: statement
    why: The height is a segment with one endpoint on the base line and the other at the opposite vertex
      or side.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
