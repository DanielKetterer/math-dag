id: coordinate-plane.ordered-pair.meaning
concept: coordinate-plane
facet: location
level: 2
type: concept
name: The two coordinates as distances from the origin
statement: In an ordered pair (a, b), the first number a tells how far to travel from the origin in the
  direction of the x-axis, and the second number b tells how far to travel in the direction of the y-axis;
  so (a, b) and (b, a) are different points unless a = b.
assess: Without plotting, describe how to travel from the origin to (2, 6) and how to travel from the
  origin to (6, 2). Are they the same point?
