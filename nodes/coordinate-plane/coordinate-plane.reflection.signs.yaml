      note: 'route-only: The concept needs to see where (a, b), (a, -b) and (-a, b) sit; that can come
        from plotting them, or from reading the coordinates of a plotted point and its mirror image and
        noticing which sign changes. | other route: Read the coordinates of a point and its mirror image
        on a grid (coordinate-plane.four-quadrants.read) and notice which sign changes, with no plotting.'
    status: disputed
