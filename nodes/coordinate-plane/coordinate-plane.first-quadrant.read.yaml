id: coordinate-plane.first-quadrant.read
concept: coordinate-plane
facet: location
level: 2
type: procedure
name: Read the coordinates of a point in the first quadrant
statement: Give the ordered pair of whole-number coordinates of a point plotted on a first-quadrant coordinate
  grid.
procedure:
- From the point, follow the grid line parallel to the y-axis to the x-axis; the number there is the x-coordinate.
- From the point, follow the grid line parallel to the x-axis to the y-axis; the number there is the y-coordinate.
- Write the pair as (x-coordinate, y-coordinate).
assess: Write the ordered pair for each of the unlabeled plotted points A and B on this grid; A lies on
  the y-axis.
