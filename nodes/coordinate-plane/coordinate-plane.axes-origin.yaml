id: coordinate-plane.axes-origin
concept: coordinate-plane
facet: location
level: 2
type: concept
name: Axes and origin of a coordinate plane
statement: A coordinate plane is made from two perpendicular number lines, the axes (the x-axis and the
  y-axis), placed so they cross at 0 on each; the crossing point is the origin, with coordinates (0, 0).
assess: On this grid with both axes drawn and numbered, mark the origin and write its coordinates.
