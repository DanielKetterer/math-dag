id: coordinate-plane.application.real-world.four-quadrants
concept: coordinate-plane
facet: location
level: 2
type: application
name: Locate places on a map grid with signed coordinates
statement: A real-world problem gives places on a map grid as ordered pairs of either sign, with the origin
  at a landmark and east and north positive; plot them and say where one place is relative to the landmark
  or to another place.
assess: On a town map, the school is at the origin, east and north are positive, and each unit is one
  block. The library is at (-3, 2) and the park is at (4, -1). Plot both, and say which of them is southeast
  of the school.
