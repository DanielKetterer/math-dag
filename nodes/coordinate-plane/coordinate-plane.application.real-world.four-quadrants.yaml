      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.signed.meaning
    relation: definitional
    points_to: statement
    why: With east and north positive, a negative coordinate means west or south of the landmark, which
      is the opposite-direction meaning of negative numbers.
