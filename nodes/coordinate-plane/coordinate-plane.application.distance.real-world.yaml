id: coordinate-plane.application.distance.real-world
concept: coordinate-plane
facet: location
level: 3
type: application
name: Find the distance between two places on a coordinate map that share a coordinate
statement: A real-world problem places two locations on a coordinate map with the same first coordinate
  or the same second coordinate, in any quadrants; the learner finds the distance between them along the
  grid line.
assess: On a town map with a coordinate grid measured in blocks, the library is at (-4, 3) and the school
  is at (5, 3). How many blocks apart are they along the street that joins them?
sources:
  ccss:
  - 6.G.A.3
  learning_components:
  - d07119b2
requires:
- clause: via-same-sign
  all_of:
  - node: coordinate-plane.application.real-world.four-quadrants
    relation: definitional
    points_to: statement
    why: Places on the town map are located by signed coordinates on the map grid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: coordinate-plane.segment-length.same-sign
    relation: procedural
    points_to: statement
    why: Places in one quadrant that share a coordinate are separated by the difference of absolute values.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Places in one quadrant that share a coordinate are separated by the difference
        of absolute values, one of two case rules. | other route: Take the absolute value of the difference
        of the differing coordinates, whatever their signs (absolute-value.distance.between-numbers),
        with no split into cases.'
    status: disputed
- clause: via-opposite-sign
  all_of:
  - node: coordinate-plane.application.real-world.four-quadrants
    relation: definitional
    points_to: statement
    why: Places on the town map are located by signed coordinates on the map grid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: coordinate-plane.segment-length.opposite-sign
    relation: procedural
    points_to: statement
    why: Places in different quadrants that share a coordinate are separated by the sum of absolute values.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Places in different quadrants that share a coordinate are separated by the sum
        of absolute values, one of two case rules. | other route: Take the absolute value of the difference
        of the differing coordinates, whatever their signs (absolute-value.distance.between-numbers),
        with no split into cases.'
    status: disputed
- clause: critic-route-1
  note: 'Single-rule route: the distance is the absolute value of the difference of the differing coordinates'
