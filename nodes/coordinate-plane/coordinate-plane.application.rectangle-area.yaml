id: coordinate-plane.application.rectangle-area
concept: coordinate-plane
facet: location
level: 3
type: application
name: Find the area of a rectangle with sides parallel to the axes from its vertices
statement: A mathematical problem gives the vertices of a rectangle with sides parallel to the axes, in
  any quadrants; the learner finds its area from the coordinates.
assess: A rectangle has vertices (-2, 3), (4, 3), (4, -1) and (-2, -1). Find its area.
sources:
  ccss:
  - 6.G.A.3
  learning_components:
  - fcb8e3dc
requires:
- clause: via-same-sign
  all_of:
  - node: area.rectangle.length-times-width
    relation: procedural
    points_to: statement
    why: The area is the product of the rectangle's length and width found from the coordinates.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.facts.within-100
    relation: procedural
    points_to: assess
    why: The side lengths 6 and 4 give a single-digit product.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem''s 6 x 4 is a single-digit product.'
    status: proposed
  - node: coordinate-plane.segment-length.same-sign
    relation: procedural
    points_to: statement
    why: Sides whose differing coordinates share a sign are measured by the difference of absolute values.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Sides with differing coordinates of one sign are measured by the difference of
        absolute values, one of two case rules. | other route: Measure each side as the absolute value
        of the difference of the differing coordinates, whatever their signs (absolute-value.distance.between-numbers),
        with no split into cases.'
    status: disputed
- clause: via-opposite-sign
  all_of:
  - node: area.rectangle.length-times-width
    relation: procedural
    points_to: statement
    why: The area is the product of the rectangle's length and width found from the coordinates.
    evidence:
