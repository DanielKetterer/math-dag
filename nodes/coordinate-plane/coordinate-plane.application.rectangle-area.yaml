    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.facts.within-100
    relation: procedural
    points_to: assess
    why: The side lengths 6 and 4 give a single-digit product.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem''s 6 x 4 is a single-digit product.'
    status: proposed
  - node: coordinate-plane.segment-length.opposite-sign
    relation: procedural
    points_to: statement
    why: Sides whose differing coordinates have opposite signs are measured by the sum of absolute values.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Sides that cross an axis are measured by the sum of absolute values, one of two
        case rules. | other route: Measure each side as the absolute value of the difference of the differing
        coordinates, whatever their signs (absolute-value.distance.between-numbers), with no split into
        cases.'
    status: disputed
