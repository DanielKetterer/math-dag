id: coordinate-plane.application.interpret
concept: coordinate-plane
facet: graph
level: 2
type: application
name: Interpret coordinate values in context
statement: Say what each coordinate of a plotted point means in the situation the graph represents.
assess: A graph shows hours worked on the x-axis and dollars earned on the y-axis. The point (3, 24) is
  plotted. What do the 3 and the 24 tell you?
sources:
  ccss:
  - 5.G.A.2
  learning_components:
  - d2cd8103
requires:
- clause: standard
  all_of:
  - node: coordinate-plane.ordered-pair.meaning
    relation: definitional
    points_to: statement
    why: Saying what each coordinate means uses the first number as the x distance and the second as the
      y distance.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: coordinate-plane.application.real-world
    relation: definitional
    points_to: statement
    why: Saying what a coordinate means in a situation requires seeing each axis as standing for a quantity
      of the situation, which is the graph-facet idea developed in the real-world graphing node; ordered-pair.meaning
      only gives distances along axes. Moderate confidence.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
