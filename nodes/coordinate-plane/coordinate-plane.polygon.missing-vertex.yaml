  relation: common_path
  note: 'Common path, not required: route ''via-plot'' needed everything another route needs and more,
    so it was removed.'
- node: coordinate-plane.four-quadrants.read
  relation: common_path
  note: 'Common path, not required: route ''via-read'' needed everything another route needs and more,
    so it was removed.'
