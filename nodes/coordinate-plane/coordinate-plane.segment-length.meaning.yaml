id: coordinate-plane.segment-length.meaning
concept: coordinate-plane
facet: location
level: 2
type: concept
name: The length of a horizontal or vertical segment from coordinates
statement: Two points with the same first coordinate lie on one vertical line, and the length of the segment
  joining them is the distance between their second coordinates; two points with the same second coordinate
  lie on one horizontal line, and the length is the distance between their first coordinates.
assess: Segment PQ joins P(3, -2) and Q(3, 5). Is PQ horizontal or vertical, and which coordinates of
  P and Q do you compare to find its length?
sources:
  ccss:
  - 6.G.A.3
  learning_components:
