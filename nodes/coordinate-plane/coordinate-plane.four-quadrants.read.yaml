id: coordinate-plane.four-quadrants.read
concept: coordinate-plane
facet: location
level: 2
type: procedure
name: Read the integer coordinates of a point in any quadrant
statement: 'Find the integer coordinates of a plotted point in any quadrant: the first coordinate is its
  signed horizontal position, negative to the left of the y-axis, and the second is its signed vertical
  position, negative below the x-axis.'
procedure:
- From the point, go straight up or down to the x-axis and read the number there; it is negative if the
  point is left of the y-axis.
- From the point, go straight left or right to the y-axis and read the number there; it is negative if
  the point is below the x-axis.
- Write the two numbers as an ordered pair (first, second).
assess: Write the ordered pair for each of the four labeled points on this grid, one in each quadrant.
