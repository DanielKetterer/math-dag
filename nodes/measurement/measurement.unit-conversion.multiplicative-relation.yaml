id: measurement.unit-conversion.multiplicative-relation
concept: measurement
facet: unit-conversion
level: 2
type: concept
name: A measurement in a smaller unit is k times its number in the larger unit
statement: If 1 larger unit equals k smaller units, then the number of smaller units in any measurement
  is k times the number of larger units, because each larger unit is replaced by k smaller ones.
assess: 1 ft is 12 times as long as 1 in. A snake is 4 ft long. Without finding its length in inches,
  is that number more or less than 4, and how many times as large is it?
