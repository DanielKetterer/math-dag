id: measurement.mass.gram-kilogram-unit
concept: measurement
facet: mass
level: 2
type: concept
name: The gram and the kilogram as units of mass
statement: The gram and the kilogram are standard units of mass, a kilogram being much heavier than a
  gram; the mass of an object in grams or kilograms is the number of those unit masses that balance it
  on a pan balance.
assess: A bag of rice balances 2 one-kilogram masses on a pan balance. What is the mass of the bag? Is
  1 gram heavier or lighter than 1 kilogram?
sources:
  ccss:
