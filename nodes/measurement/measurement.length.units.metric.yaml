id: measurement.length.units.metric
concept: measurement
facet: length
level: 3
type: fact
name: Relative sizes of metric length units
statement: Know that 1 km = 1000 m and 1 m = 100 cm, so a kilometer is 1000 times as long as a meter and
  a meter is 100 times as long as a centimeter.
assess: 'Without computing: how many meters are in 1 kilometer? How many centimeters are in 1 meter? Which
  is longer, 1 m or 1 cm?'
