level: 2
type: application
name: Solve one-step multiplication word problems with masses or volumes
statement: A one-step story gives a number of equal masses or equal liquid volumes in the same unit and
  asks for the total; the learner multiplies and gives the answer in that unit.
assess: Each bag of rice has a mass of 4 kilograms. What is the mass of 6 bags?
