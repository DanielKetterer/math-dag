      source: critic-sonnet
      note: necessary
    status: proposed
  - node: measurement.unit-conversion.to-larger.decimal
    relation: procedural
    points_to: statement
    why: Converting 3750 m to kilometers in the test problem gives the decimal 3.75 km.
    evidence:
