id: measurement.length.ruler
concept: measurement
facet: length
level: 2
type: procedure
name: Measure a length in standard units with a ruler or other tool
statement: Measure a length in inches, feet, centimeters or meters by lining up the 0 mark of a ruler,
  yardstick, meter stick or tape with one end of the object and reading the whole-unit mark nearest the
  other end, reported with the unit.
procedure:
- Choose the unit and a tool marked in that unit.
- Line up the 0 mark of the tool with one end of the object, keeping the tool straight along the object.
- Find the whole-unit mark nearest the other end of the object.
- Report that number with the unit name.
assess: Use your centimeter ruler to measure this pencil, drawn at actual size, to the nearest centimeter.
