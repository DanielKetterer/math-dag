id: measurement.time.tell-nearest-minute
concept: measurement
facet: time
level: 2
type: representation
name: Tell and write time to the nearest minute
statement: Read the time shown on an analog clock to the nearest minute, using the hour hand for the hour
  and the minute marks passed by the minute hand for the minutes, and write it as hours:minutes.
assess: The hour hand is between 4 and 5 and the minute hand points to the second mark after the 7. What
  time does the clock show?
sources:
  ccss:
  - 3.MD.A.1
  learning_components:
  - befd3355
requires:
- clause: via-fives
  all_of:
  - node: time.analog.five-minutes
    relation: definitional
    points_to: statement
    why: The hour hand and minute hand are read first to the nearest five minutes, and single minute marks
      are counted from there.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A30 keep: Daniel: the nearest minute can be read by counting single minute marks; the five-minute
        reading is a shortcut. Applied in set_routes (via fives, via ones).'
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
  - node: time.digital.write
    relation: representational
    points_to: statement
    why: The reading is recorded in the hours:minutes form, with the minutes written as two digits.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
  - node: addition.within-100
    relation: procedural
    points_to: statement
    why: The minutes are the count at the last five-minute mark plus the extra minute marks passed, such
      as 35 + 2.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
  - node: time.analog.hour
    relation: definitional
    points_to: statement
    why: The statement reads the hour from the hour hand; this is read directly, not only through the
      five-minute node.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
- clause: via-ones
  all_of:
  - node: counting.objects
    relation: procedural
    points_to: statement
    why: Counting the single minute marks from 12 to the minute hand gives the minutes, one route.
    evidence:
    - kind: review
      source: DK
      note: 'A30 add: Daniel A30: counting single minute marks is a route.'
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
  - node: counting.sequence.to-100
    relation: procedural
    points_to: statement
    why: Counting up to 59 minute marks says the number words past 20, one route.
    evidence:
    - kind: review
      source: DK
      note: 'A30 add: Daniel A30: counting single minute marks is a route.'
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
  - node: time.digital.write
    relation: representational
    points_to: statement
    why: The reading is recorded in the hours:minutes form, with the minutes written as two digits.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
  - node: time.analog.hour
    relation: definitional
    points_to: statement
    why: The statement reads the hour from the hour hand; this is read directly, not only through the
      five-minute node.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'A30 set_routes: Daniel: the five-minute reading is a shortcut; single minute marks can be
        counted from 12.'
    status: reviewed
status: proposed
