id: measurement.mass-volume.application.division
concept: measurement
facet: measured-quantity
level: 2
type: application
name: Solve one-step division word problems with masses or volumes
statement: A one-step story splits a mass or liquid volume in one unit into equal shares or equal-size
  portions; the learner divides and gives the answer in the right unit or count.
assess: 24 liters of juice are poured equally into 6 jugs. How many liters of juice are in each jug?
sources:
  ccss:
  - 3.MD.A.2
  learning_components:
  - e6c20427
requires:
- clause: standard
  all_of:
  - node: division.application.partitive
    relation: definitional
    points_to: statement
    why: The statement covers splitting a mass or volume into equal shares and asking the size of each
      share.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.application.measurement
    relation: definitional
    points_to: statement
    why: The statement also covers splitting into equal-size portions and asking how many portions, the
      grouping structure.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.facts.within-100
    relation: procedural
    points_to: statement
    why: The learner divides the total measure by the number of shares or by the size of a portion, such
      as 24 divided by 6.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
