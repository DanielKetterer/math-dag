id: measurement.length.estimate
concept: measurement
facet: length
level: 2
type: procedure
name: Estimate a length in a standard unit
statement: Estimate a length in inches, feet, centimeters or meters by picturing copies of a benchmark
  for the unit laid end to end along the object and giving the whole number of units that would fit.
procedure:
- Recall a benchmark for the named unit.
- Picture copies of the benchmark laid end to end along the object, with no gaps or overlaps.
- Give the number of copies that would fit as the estimate, with the unit.
assess: Without measuring, about how many inches long is this new crayon? (A new crayon is a little over
  3 inches long; any estimate from 2 to 5 inches is accepted.)
