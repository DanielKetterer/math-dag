id: measurement.time.elapsed.within-hour
concept: measurement
facet: time
level: 2
type: procedure
name: Find elapsed minutes between two times in the same hour
statement: The time interval between two clock times in the same hour is the number of minutes from the
  start time to the end time.
procedure:
- Find the minutes of the start time and of the end time.
- Find how many minutes it takes to go from the start minutes to the end minutes.
assess: One clock shows 2:15 and a later clock shows 2:52. How many minutes pass from the first time to
  the second?
sources:
  ccss:
  - 3.MD.A.1
  learning_components:
  - 3c3c56d8
