id: measurement.length.difference
concept: measurement
facet: length
level: 2
type: procedure
name: Measure to find how much longer one object is than another
statement: How much longer one object is than another is the difference of their lengths measured in the
  same standard unit, stated in that unit.
procedure:
- Measure both objects in the same standard unit.
- Find the difference of the two lengths.
- State the difference with the unit.
assess: A blue strip and a red strip lie along an inch ruler, both starting at 0. The blue strip ends
  at 6 and the red strip ends at 9. How many inches longer is the red strip than the blue strip?
sources:
  ccss:
  - 2.MD.A.4
  learning_components:
  - 19ea874e
  - f81bec09
requires:
- clause: via-difference-unknown
  all_of:
  - node: measurement.length.ruler
    relation: procedural
    points_to: procedure.1
    why: Step 1 measures both objects in the same standard unit, which is the ruler procedure applied
      twice.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.within-10
    relation: procedural
    points_to: assess
    why: Step 2 finds the difference of the two measured lengths, for example 9 minus 6 in the test problem.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement and procedure say only ''find the difference'' with no number range;
