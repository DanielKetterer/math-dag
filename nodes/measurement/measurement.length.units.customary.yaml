    relation: definitional
    points_to: statement
    why: The statement says a foot is 12 times as long as an inch, which is a multiplicative comparison
      of two lengths.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: measurement.length.attribute
    relation: definitional
    points_to: statement
    why: The assess asks 'which is longer'; length as an attribute is the needed base.
    evidence:
