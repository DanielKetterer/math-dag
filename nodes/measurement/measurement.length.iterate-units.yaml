id: measurement.length.iterate-units
concept: measurement
facet: length
level: 1
type: procedure
name: Measure length by laying units end to end
statement: Measure an object's length by laying same-size copies of a shorter unit end to end along it
  and counting them. At this level objects are chosen to be a whole number of units long; if the last
  copy overhangs the end, the length lies between two whole numbers of units.
procedure:
- Line up one end of the first copy of the unit with one end of the object.
- Place each next copy so it starts exactly where the previous one ends, in a straight line along the
  object, with no gap and no overlap.
- Stop when a copy reaches the other end of the object.
- Count the copies; that whole number is the length in that unit.
assess: Use copies of this paper clip to find how long the marker is, in paper clips.
sources:
