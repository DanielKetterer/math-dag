    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: operations.application.multistep
    relation: definitional
    points_to: statement
    why: The statement asks for two-step word problems, so combining two sequential steps in a story must
      be understood.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
