id: measurement.length.attribute
concept: measurement
facet: length
level: 1
type: concept
name: Length as an attribute of an object
statement: Length is the attribute of an object that tells how long, tall, or far it is from end to end,
  separate from its other attributes such as weight or color.
assess: Show a long thin ribbon and a short heavy block. 'Which one is longer? Which one is heavier?'
  Credit the ribbon as longer and the block as heavier, showing the two attributes are kept separate.
sources:
  ccss:
  - K.MD.A.1
  learning_components: []
  prek:
  - cs.length.quantity-recognizer
requires: []
root_reason: Every proposed prerequisite was removed by the critic; check this node.
related:
- node: classifying.attribute.identify
  relation: generalizes
  note: Attending to one attribute among several is the general case of which length is an instance. A
    child can separate length from weight through experience with long and short things without a general
    attribute-naming skill.
status: proposed
