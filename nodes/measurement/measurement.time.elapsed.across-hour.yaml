id: measurement.time.elapsed.across-hour
concept: measurement
facet: time
level: 2
type: procedure
name: Find elapsed minutes across the start of an hour
statement: The interval from a time in one hour to a time in the next hour, at most 60 minutes, is the
  minutes from the start time up to the hour plus the minutes past the hour at the end time, because an
  hour has 60 minutes.
procedure:
- Find the minutes from the start time up to the next hour.
- Find the minutes from the hour to the end time.
- Add the two numbers of minutes.
assess: One clock shows 3:45 and a later clock shows 4:10. How many minutes pass from the first time to
  the second?
sources:
  ccss:
  - 3.MD.A.1
  learning_components:
  - 3c3c56d8
requires:
