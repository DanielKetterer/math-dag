id: measurement.length.unit-benchmarks
concept: measurement
facet: length
level: 2
type: concept
name: Know benchmark sizes of standard length units
statement: 'Each standard length unit has a familiar benchmark of about its size: an inch is about the
  length of a thumb joint, a foot about the length of a sheet of paper, a centimeter about the width of
  a fingertip, a meter about the length of a long step or a baseball bat.'
assess: 'Which is about 1 meter long: a pencil, a baseball bat, or a school bus?'
sources:
  ccss:
  - 2.MD.A.3
  learning_components:
  - 5cfd8c36
requires:
- clause: via-ruler
  all_of:
  - node: measurement.length.ruler
    relation: definitional
    points_to: statement
    why: Each benchmark is an everyday thing compared with the length of an inch, foot, centimeter or
      meter, units the learner knows from marked rulers and tapes.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The benchmark idea needs a sense of how long a standard unit is, but a ruler
        is only one way to meet an inch, centimeter or meter. | other route: Meet each standard unit as
        a physical unit object (an inch tile, a centimeter cube, a meter stick used as a single unit)
        laid end to end beside objects and body parts, using measurement.length.iterate-units, with no
        ruler reading.'
    status: disputed
- clause: critic-route-1
  note: Learn each standard unit as a physical unit object (an inch tile, a centimeter cube, a meter stick
    treated as one unit) and compare everyday things with it, without reading a ruler.
  all_of:
  - node: measurement.length.iterate-units
    relation: definitional
    points_to: statement
    why: 'Alternative route proposed by the critic: Learn each standard unit as a physical unit object
      (an inch tile, a centimeter cube, a meter stick treated as one unit) and compare everyday things
      with it, without reading a ruler.'
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing route
    status: disputed
status: proposed
