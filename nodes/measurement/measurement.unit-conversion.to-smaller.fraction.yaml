id: measurement.unit-conversion.to-smaller.fraction
concept: measurement
facet: unit-conversion
level: 3
type: procedure
name: Convert a fractional measurement to a smaller unit
statement: A measurement of a/b larger units, with 1 larger unit = k smaller units, equals (a/b) x k smaller
  units.
procedure:
- Find k, the number of smaller units in 1 larger unit.
- Multiply the fraction a/b by k.
- Label the product with the smaller unit.
assess: How many minutes are in 3/4 of an hour? (1 hr = 60 min)
