id: measurement.length.no-gaps-overlaps
concept: measurement
facet: length
level: 1
type: concept
name: Length as the number of units that span an object
statement: The length of an object in a given unit is the number of same-size copies of that unit that
  span it end to end with no gaps and no overlaps.
assess: Mia laid paper clips along a pencil with spaces between them and counted 5. Is the pencil 5 paper
  clips long? Why or why not?
