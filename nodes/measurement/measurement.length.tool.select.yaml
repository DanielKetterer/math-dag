id: measurement.length.tool.select
concept: measurement
facet: length
level: 2
type: concept
name: Choose a suitable tool for measuring a length
statement: 'A measuring tool suits a length when it is long enough to span much of it and can follow its
  shape: a ruler for short straight lengths, a yardstick or meter stick for longer straight lengths, a
  measuring tape for very long or curved lengths.'
assess: 'Which tool would you use to measure the distance around a pumpkin: a 12-inch ruler, a meter stick,
  or a measuring tape? Why?'
sources:
  ccss:
  - 2.MD.A.1
  learning_components:
  - bf50bd46
requires:
- clause: standard
  all_of:
  - node: measurement.length.ruler
    relation: definitional
    points_to: statement
    why: The choice among ruler, yardstick, meter stick and tape assumes the learner has used these tools
      to measure; no other node introduces them. Treat as a likely direct prerequisite pending the author's
      intent.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
