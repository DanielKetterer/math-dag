id: measurement.attributes.several
concept: measurement
facet: core
level: 1
type: concept
name: One object has several measurable attributes
statement: A single object has several different measurable attributes, such as length, height, weight
  and how much it holds, and each one can be described separately with its own words.
assess: Look at this water bottle. Name two different things about it that could be measured, and give
  a describing word for each.
