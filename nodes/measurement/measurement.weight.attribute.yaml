name: Weight as an attribute of an object, separate from its size
statement: Weight is how heavy an object is, felt by holding it or shown on a balance; it is a different
  attribute from size, so a bigger object is not necessarily heavier.
assess: Hold a large beach ball in one hand and a small rock in the other. Sam says the beach ball is
  heavier because it is bigger. Is Sam right?
