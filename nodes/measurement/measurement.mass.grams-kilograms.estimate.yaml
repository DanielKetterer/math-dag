id: measurement.mass.grams-kilograms.estimate
concept: measurement
facet: mass
level: 2
type: procedure
name: Estimate mass in grams or kilograms
statement: Estimate the mass of an object in grams or kilograms by comparing it with known benchmarks,
  such as a paper clip of about 1 gram or a 1-liter bottle of water of about 1 kilogram.
assess: 'A 1-liter bottle of water has a mass of about 1 kilogram. Which is the best estimate for the
  mass of a bicycle: 1 kg, 12 kg, or 120 kg?'
