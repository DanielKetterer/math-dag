id: division.partial-quotients.two-digit-divisor
concept: division
facet: measurement
level: 3
type: procedure
name: Divide by a two-digit number with partial quotients
statement: Find the whole-number quotient (and remainder, if any) of a dividend of up to four digits by
  a two-digit divisor by partial quotients, estimating each multiple of the divisor to subtract and choosing
  a smaller one when the estimate is more than the amount left.
procedure:
- Start with the dividend as the amount left.
- Estimate a multiple of the divisor not more than the amount left, by rounding the divisor (36 is about
  40) or using a known product such as 100 x 36 or 10 x 36.
- Multiply to find that multiple exactly; if it is more than the amount left, choose a smaller one.
- Subtract it and record the partial quotient.
- Repeat until the amount left is less than the divisor; add the partial quotients for the quotient, and
  the amount left is the remainder.
assess: Find 7,452 divided by 36 by partial quotients, subtracting multiples of 36.
