id: division.remainder.meaning
concept: division
facet: measurement
level: 2
type: concept
name: A remainder is what is left after making as many whole groups as possible
statement: When a whole number of objects is put into as many groups of a given size as possible, the
  objects left over are the remainder; the remainder is always less than the group size, since otherwise
  one more group could be made.
assess: 17 cubes are put into towers of 5 cubes. How many full towers are made, and how many cubes are
  left over? Could 6 cubes be left over? Why or why not?
