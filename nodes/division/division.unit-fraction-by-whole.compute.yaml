id: division.unit-fraction-by-whole.compute
concept: division
facet: unknown-factor
level: 3
type: procedure
name: Divide a unit fraction by a whole number
statement: Compute (1/b) divided by a whole number n greater than 0 by multiplying the denominator b by
  n.
procedure:
- Multiply the denominator b by the divisor n.
- Write the quotient as 1/(b x n).
assess: Compute 1/4 divided by 3.
