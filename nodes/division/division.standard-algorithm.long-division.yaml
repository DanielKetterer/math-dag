id: division.standard-algorithm.long-division
concept: division
facet: base-ten
level: 3
type: procedure
name: Divide multi-digit whole numbers with the standard algorithm
statement: Divide a multi-digit whole number by a whole number of one or more digits (not greater than
  the dividend) with the standard long-division algorithm, working from the greatest place of the dividend,
  to get the whole-number quotient and remainder.
procedure:
- Take the fewest leading digits of the dividend that form a number at least as large as the divisor;
  this is the current number.
- Find the greatest digit q (0 to 9) with q x divisor at most the current number, and write q in the quotient
  above the last digit used.
- Subtract q x divisor from the current number.
- If digits of the dividend remain, bring down the next one to the right of the difference to form the
  new current number, and return to step 2.
- When no digits remain, the last difference is the remainder.
assess: Use the standard algorithm to divide 9,374 by 26. Give the quotient and the remainder.
