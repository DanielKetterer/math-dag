id: division.whole-by-unit-fraction.explain
concept: division
facet: unknown-factor
level: 4
type: justification
name: Explain n divided by 1/b = n x b with multiplication
statement: n divided by 1/b is the number that multiplied by 1/b gives n; since (n x b) x (1/b) = (n x
  b)/b = n, the quotient is n x b for every n and b.
assess: Use multiplication to explain why 4 divided by 1/5 = 20, and say why the same argument works for
  any whole number and unit fraction.
sources:
  ccss:
  - 5.NF.B.7.b
  learning_components: []
requires:
