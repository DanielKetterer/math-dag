    why: The explanation reads n divided by 1/b as the number that multiplied by 1/b gives n.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.multiply-whole.rule
    relation: justificatory
    points_to: statement
    why: The step (n x b) x (1/b) = (n x b)/b uses the rule for multiplying a fraction by a whole number.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: For a unit fraction the step (n x b) x (1/b) = (n x b)/b is the definition of
        (n x b)/b as n x b copies of 1/b; the general rule is more than required. | other route: Fraction
        as a whole-number multiple of a unit fraction (fraction.multiple-of-unit).'
    status: disputed
