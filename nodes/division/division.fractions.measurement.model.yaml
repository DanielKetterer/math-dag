id: division.fractions.measurement.model
concept: division
facet: measurement
level: 2
type: procedure
name: Divide fractions with a visual fraction model
statement: Find a/b divided by c/d by cutting the whole into b x d equal parts, so both fractions are
  counted in the same parts, and finding how many groups the size of c/d fit in a/b.
procedure:
- Draw a whole and partition it into b x d equal parts.
- Shade a/b of the whole; it covers a x d of the parts. Mark c/d; it covers c x b of the parts.
- Count how many full groups of c x b parts fit in the a x d shaded parts.
- If r parts are left over, they make r/(c x b) of a group.
- The quotient is the number of full groups plus r/(c x b).
assess: Use a visual fraction model to find (3/4) divided by (1/6).
sources:
  ccss:
  - 6.NS.A.1
  learning_components: []
requires:
- clause: via-generate
  all_of:
  - node: division.fractions.measurement
    relation: definitional
    points_to: statement
    why: The model carries out the grouping meaning of the quotient, counting how many groups of c/d fit
      in a/b and treating the leftover as part of a group.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.facts.within-100
    relation: procedural
    points_to: procedure.3
    why: Step 3 counts how many groups of c x b parts fit in a x d parts, a single-digit division such
      as 18 divided by 4 in the test, which division facts within 100 cover.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'undecided: The step needs a whole-number quotient with remainder, but with the small counts
        in a drawn model (18 parts in groups of 4) the multi-digit division algorithm is more than is
        required and no finer division node is indexed.'
    - kind: review
      source: DK
      note: 'C64 replace: No to multi-digit division - The target may require basic division skills, but
        the proposed prerequisite is too broad.'
    status: reviewed
