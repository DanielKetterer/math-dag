    status: proposed
  - node: division.whole-by-unit-fraction.interpret
    relation: definitional
    points_to: statement
    why: How many groups of c/d make a/b generalizes how many parts of size 1/b fit in a whole number,
      the measurement meaning met first with a unit fraction.
    evidence:
    - kind: review
      source: DK
      note: 'E107 route: Generalize from dividing a whole number by a unit fraction (Daniel E107, route-only).'
    status: reviewed
related:
- node: division.whole-by-unit-fraction.interpret
  relation: generalizes
  note: Dividing a whole number by a unit fraction is the special case that this node generalizes; a learner
    with the grouping meaning and fractions-as-parts can interpret 2/3 divided by 3/4 without it.
status: proposed
