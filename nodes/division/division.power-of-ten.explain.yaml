id: division.power-of-ten.explain
concept: division
facet: base-ten
level: 4
type: justification
name: Explain why dividing by 10^k moves the decimal point k places left
statement: Each place is worth 1/10 of the place to its left, so dividing by 10 makes every digit worth
  1/10 as much, which moves it one place right relative to the decimal point; doing this k times moves
  every digit k places right, so the point appears k places to the left.
assess: Explain, using place value, why 52.7 divided by 100 = 0.527.
