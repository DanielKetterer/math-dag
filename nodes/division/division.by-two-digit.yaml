id: division.by-two-digit
concept: division
facet: base-ten
level: 3
type: procedure
name: Divide by a two-digit number, no remainder
statement: Find the whole-number quotient of a dividend of up to four digits by a two-digit divisor that
  divides it exactly, by any reliable method; partial quotients, an area model with numbers, and the standard
  algorithm all meet it.
assess: Find 7,452 divided by 36 and 96 divided by 12. Use any method.
sources:
  ccss:
  - 5.NBT.B.6
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: multiplication.by-one-digit
    relation: procedural
    points_to: statement
    why: Any method forms multiples of the two-digit divisor, such as 36 x 7, and compares them with the
      dividend.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: place-value.factor-of-ten
    relation: procedural
    points_to: statement
    why: Quotients of up to three digits need multiples of the divisor times tens and hundreds, found
      by place value.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.multi-digit
    relation: procedural
    points_to: statement
    why: Each method subtracts multiples of the divisor from a dividend of up to four digits, which exceeds
      subtracting within 1000.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: The id subtraction.multi-digit is not in the index; the computation (subtracting
        multiples of the divisor from a four-digit dividend) clearly needs multi-digit subtraction, but
        subtraction.standard-algorithm is a method and subtraction.with'
    status: disputed
  - node: division.unknown-factor.meaning
    relation: definitional
    points_to: statement
    why: With division.by-one-digit a scaffold, the meaning of a quotient as the factor that multiplies
      the divisor to the dividend is the direct base for finding multiples of the divisor.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
