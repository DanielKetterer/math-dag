id: division.unit-fraction-by-whole.interpret
concept: division
facet: partitive
level: 2
type: concept
name: (1/b) divided by n as sharing 1/b into n equal parts
statement: (1/b) divided by n is the size of each part when 1/b is partitioned into n equal parts; splitting
  each of the whole's b parts into n makes b x n equal parts, so each share is 1/(b x n) of the whole.
assess: Draw a fraction model to show 1/3 divided by 4, and tell a story the division could describe.
