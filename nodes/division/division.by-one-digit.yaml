id: division.by-one-digit
concept: division
facet: base-ten
level: 3
type: procedure
name: Divide by a one-digit number, no remainder
statement: Find the whole-number quotient of a dividend of up to four digits by a one-digit divisor that
  divides it exactly, by any reliable method; partial quotients, an area model with numbers, and the standard
  algorithm all meet it.
assess: Find 852 divided by 6 and 96 divided by 4. Use any method.
sources:
  ccss:
  - 4.NBT.B.6
  learning_components:
  - d5bcfb8d
  - f6809045
requires:
- clause: via-meaning
  all_of:
  - node: division.facts.within-100
    relation: procedural
    points_to: statement
    why: Every method finds each partial or digit-by-digit quotient from a division fact, as with 36 divided
      by 6 inside 852 divided by 6.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.by-multiple-of-ten
    relation: procedural
    points_to: statement
    why: Partial quotients and the area model remove multiples of the divisor times tens or hundreds,
      as with 6 x 100 and 6 x 40.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.within-1000
    relation: procedural
    points_to: assess
    why: The test items remove partial products from the dividend, such as 852 - 600, which is a subtraction
      within 1000.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test items subtract partial products from the dividend (852 - 600); a
        guess-and-check route through multiplying up to the dividend avoids subtraction.'
    status: proposed
  - node: place-value.expanded-form.multi-digit
    relation: definitional
    points_to: statement
    why: The dividend of up to four digits is split into place-value parts such as hundreds and tens that
      are divided in turn.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.unknown-factor.meaning
    relation: definitional
    points_to: statement
    why: The statement requires a divisor that divides the dividend exactly, meaning the quotient is the
      whole number that multiplies the divisor to give the dividend.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Division can be met through the quotient as a number of equal groups or as an
        equal share, not only as an unknown factor. | other route: Meaning of the quotient as the number
        of equal groups (division.measurement.meaning), or as the size of an equal share (division.partitive.meaning),
        with the same facts and place-value steps.'
    status: disputed
