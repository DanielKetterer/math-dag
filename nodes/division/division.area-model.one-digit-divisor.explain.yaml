id: division.area-model.one-digit-divisor.explain
concept: division
facet: unknown-factor
level: 2
type: justification
name: Explain division by a one-digit number with an area model
statement: Dividing n by a one-digit d is finding the unknown side of a rectangle with area n and one
  side d; cutting the area into parts that are each a multiple of d gives side pieces (the partial quotients)
  that add to the unknown side, and any area too small to make another full strip of width d is the remainder.
assess: Draw an area model with one side 6 and area 852, and use it to explain why 852 divided by 6 =
  100 + 40 + 2.
sources:
  ccss:
  - 4.NBT.B.6
  learning_components:
  - 6e0b8067
  - 9d81bd35
  - d98ddefd
