id: division.application.partitive
concept: division
facet: partitive
level: 2
type: application
name: Solve one-step sharing division word problems within 100
statement: A story gives a total within 100 shared equally among a given number of groups (including the
  rows of an array); the learner finds the size of each group, using a drawing or an equation.
assess: 28 stickers are shared equally among 4 friends. How many stickers does each friend get?
