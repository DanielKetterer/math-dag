id: division.unknown-dividend-divisor.solve
concept: division
facet: unknown-factor
level: 3
type: procedure
name: Find an unknown dividend or divisor in a division equation
statement: In a division equation c divided by a = b with whole numbers and a nonzero quotient, an unknown
  dividend is the product a x b, and an unknown divisor is the unknown factor in ? x b = c.
procedure:
- Rewrite the division equation c divided by a = b as the multiplication equation a x b = c, keeping the
  symbol for the unknown.
- If the dividend c is unknown, multiply a x b.
- If the divisor a is unknown, find the number that times b gives c.
- Check by putting the number found into the division equation.
assess: 'Find the number that makes each equation true: ? divided by 3 = 5, and 48 divided by ? = 6.'
