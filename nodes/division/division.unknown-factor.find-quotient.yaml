id: division.unknown-factor.find-quotient
concept: division
facet: unknown-factor
level: 3
type: procedure
name: Find a quotient by finding an unknown factor
statement: Find a divided by b by finding the unknown factor in b x ? = a. This gives a whole-number quotient
  only when b is not 0 and a is a multiple of b; otherwise skip-counting by b passes a without landing
  on it.
procedure:
- Rewrite a divided by b = ? as b x ? = a.
- Find the whole number that makes b x ? = a true, by recalling a multiplication fact or by skip-counting
  by b from 0 until reaching a and counting the skips.
- That number is the quotient.
assess: Find 56 divided by 8 by thinking of a multiplication fact. Write the fact you used.
