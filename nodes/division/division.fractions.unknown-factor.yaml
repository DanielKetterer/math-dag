id: division.fractions.unknown-factor
concept: division
facet: unknown-factor
level: 3
type: concept
name: Fraction division as finding the unknown factor
statement: For fractions a/b and c/d with c not 0, a/b divided by c/d is the number q for which (c/d)
  x q = a/b.
assess: Write the multiplication equation with an unknown that matches (2/3) divided by (3/4) = ?. Then
  decide whether 8/9 is the answer by using that equation.
sources:
  ccss:
  - 6.NS.A.1
  learning_components: []
requires:
- clause: via-fraction
  all_of:
  - node: division.unknown-factor.meaning
    relation: definitional
    points_to: statement
    why: The statement defines the quotient as the factor that completes a multiplication equation, exactly
      the whole-number unknown-factor meaning of division.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.multiplication.symbolic
    relation: procedural
    points_to: assess
    why: Deciding whether 8/9 is the answer requires computing the product (3/4) x (8/9) and comparing
      it with 2/3.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Computing (3/4) x (8/9) is needed to decide whether 8/9 is the answer in the test
        problem, not to state what the quotient is.'
    status: proposed
  - node: division.unknown-factor.rewrite
    relation: procedural
    points_to: assess
    why: The test problem asks the learner to rewrite (2/3) divided by (3/4) as a multiplication equation
      with an unknown factor.
    scope: task
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Rewriting the specific division as a multiplication with an unknown is the test
        problem''s task; the statement defines the quotient, which e459 covers.'
    status: proposed
  - node: fraction.multiplication.parts-of-partition.fraction
    relation: definitional
    points_to: statement
    why: The equation (c/d) x q = a/b multiplies a fraction by a fraction q, read as c parts of q split
      into d equal parts.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The equation (c/d) x q needs some meaning for a fraction times a fraction; the
        partition reading is one. | other route: Meaning of the fraction product through the product rule
        or an area model (fraction.multiplication.product-rule, multiplication.array-area.fraction-product.represent).'
    status: disputed
- clause: critic-route-1
  note: Meaning of fraction x fraction via the symbolic product rule or area model rather than the partition
    reading
