id: division.whole-by-unit-fraction.compute
concept: division
facet: unknown-factor
level: 3
type: procedure
name: Divide a whole number by a unit fraction
statement: Compute a whole number n divided by a unit fraction 1/b by multiplying n by b.
procedure:
- Multiply the whole number n by the denominator b of the unit fraction.
- Write n x b as the quotient.
assess: Compute 6 divided by 1/3.
