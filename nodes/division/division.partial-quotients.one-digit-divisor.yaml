id: division.partial-quotients.one-digit-divisor
concept: division
facet: measurement
level: 3
type: procedure
name: Divide by a one-digit number with partial quotients, no remainder
statement: Find the whole-number quotient of a dividend of up to four digits by a one-digit divisor, when
  it divides exactly, by repeatedly subtracting easy multiples of the divisor (such as 100 or 10 times
  it) and adding up how many divisors were subtracted.
procedure:
- Start with the dividend as the amount left.
- Choose a multiple of the divisor, such as divisor x 100, divisor x 10, or divisor x a one-digit number,
  that is not more than the amount left.
- Subtract it from the amount left and record the number of divisors used (100, 10, ...) as a partial
  quotient.
- Repeat until the amount left is 0.
- Add the partial quotients; the sum is the quotient.
assess: 'Find 852 divided by 6 by partial quotients: subtract multiples of 6 such as 100 x 6 and 10 x
  6, then add the partial quotients.'
