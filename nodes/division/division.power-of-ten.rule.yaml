  - node: place-value.ten-times-right.decimal
    relation: definitional
    points_to: statement
    why: The statement moves the decimal point of a decimal, which relies on decimal places being related
      by factors of ten.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.power-of-ten.decimal.rule
    relation: definitional
    points_to: statement
    why: Dividing by 10^k undoes multiplying by 10^k, so the right-moving point rule gives the left-moving
      one.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Deriving the left-moving rule by undoing the right-moving one is one route.'
    status: disputed
  - node: division.unknown-factor.meaning
    relation: definitional
    points_to: statement
    why: Finding 52.7 divided by 100 as the number that times 100 gives 52.7 uses a quotient as an unknown
      factor.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Reading division by 10^k as finding the number that times 10^k gives the dividend
        is the ''undo multiplication'' route.'
    status: disputed
status: proposed
