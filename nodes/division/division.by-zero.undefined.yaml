id: division.by-zero.undefined
concept: division
facet: unknown-factor
level: 3
type: concept
name: Division by zero is undefined
statement: 'c divided by 0 has no value: for c not 0, no number times 0 gives c, and for c = 0, every
  number times 0 gives 0, so no single number is the quotient.'
assess: Ella says 6 divided by 0 = 0. Write 6 divided by 0 = ? as a multiplication with an unknown factor
  and explain why no number works.
