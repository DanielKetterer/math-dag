id: division.unknown-factor.equation-from-story
concept: division
facet: unknown-factor
level: 2
type: representation
name: Write a division word problem as a multiplication equation with an unknown factor
statement: A sharing or grouping word problem is represented by a multiplication equation in which a symbol
  stands for the unknown factor, such as 4 x ? = 28 for 28 children seated 4 to a table.
assess: 28 children sit at tables with 4 children at each table. Write a multiplication equation with
  a box for the number of tables. Do not solve it.
