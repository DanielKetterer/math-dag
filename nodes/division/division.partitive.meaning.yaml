id: division.partitive.meaning
concept: division
facet: partitive
level: 2
type: concept
name: A quotient as the size of each equal share
statement: When a objects are partitioned equally into b groups, the quotient a divided by b is the number
  of objects in each group.
assess: 24 stickers are shared equally among 6 children, and 24 divided by 6 is 4. What does the 4 tell
  you?
sources:
  ccss:
  - 3.OA.A.2
  learning_components:
  - fabd7cd3
  - ab83adaa
requires:
- clause: standard
  all_of:
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: The b groups made by sharing are equal groups, so the quotient is the group size that makes b
      equal groups total a.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The partitive meaning can be learned from dealing out objects one at a time into
        b groups (sharing), which uses counting and the idea of equal groups and no multiplication.'
    status: disputed
  - node: counting.objects
    relation: definitional
    points_to: statement
    why: The quotient is a count of the objects in each group, found by counting the objects shared out.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
