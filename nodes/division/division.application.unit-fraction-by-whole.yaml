id: division.application.unit-fraction-by-whole
concept: division
facet: partitive
level: 3
type: application
name: Solve real-world problems dividing a unit fraction by a whole number
statement: A real-world problem shares a unit-fraction amount equally among a whole number of people or
  groups; the learner represents it with a model or equation and finds each share.
assess: Two painters share 1/4 gallon of paint equally. How much paint does each painter get?
sources:
  ccss:
  - 5.NF.B.7.c
  learning_components:
  - b21ec473
requires:
- clause: via-interpret
  all_of:
  - node: division.unit-fraction-by-whole.interpret
    relation: representational
    points_to: statement
    why: The learner represents the sharing with a fraction model and reads each share from the model.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The model route (draw and read the share) is sufficient under the statement''s
        ''model or equation''. | other route: Write the equation (division.unit-fraction-by-whole.equation)
        and compute with division.unit-fraction-by-whole.compute.'
    status: disputed
- clause: equation
  all_of:
  - node: division.unit-fraction-by-whole.equation
    relation: representational
    points_to: statement
    why: The learner represents the story with the equation (1/b) divided by n = ?.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The equation is required only on the equation route; the model route needs no
        equation.'
    status: disputed
  - node: division.unit-fraction-by-whole.compute
    relation: procedural
    points_to: statement
    why: The learner finds each share by multiplying the denominator by the number of sharers.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The statement allows ''a model or equation''; the equation route needs this procedure,
        the model route reads the share from the drawing.'
    status: disputed
status: proposed
