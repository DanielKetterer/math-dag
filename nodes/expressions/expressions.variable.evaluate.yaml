id: expressions.variable.evaluate
concept: expressions
facet: algebraic
level: 3
type: procedure
name: Evaluate an expression at given values of its variables
statement: Find the value of an expression at given values of its variables by replacing each letter with
  its value and evaluating in the conventional order.
procedure:
- Replace each letter with its given value, writing out any multiplication the notation hides (4a with
  a = 5 becomes 4 x 5).
- Evaluate the resulting numerical expression in the conventional order.
assess: Evaluate 4a + 3b when a = 5 and b = 2.
