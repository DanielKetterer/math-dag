id: expressions.order-of-operations
concept: expressions
facet: numerical
level: 3
type: concept
name: The conventional order of operations
statement: When an expression has no parentheses to say otherwise, multiplication and division are done
  before addition and subtraction, and operations of the same kind are done from left to right.
assess: Find 3 + 4 x 2 and 20 - 12 divided by 4 + 1.
sources:
  ccss:
  - 3.OA.D.8
  learning_components: []
  other:
  - CCSS 3.OA.D.8 footnote on the conventional order
requires:
- clause: standard
  all_of:
  - node: expressions.parentheses
    relation: definitional
    points_to: statement
    why: The convention applies when there are no parentheses to say otherwise, so the learner must know
      that parentheses force a part to be done first.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.facts.within-100
    relation: procedural
    points_to: assess
    why: The test evaluates 4 x 2, a product of one-digit numbers.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
