id: expressions.equivalent.test-properties
concept: expressions
facet: algebraic
level: 3
type: procedure
name: Decide whether expressions are equivalent using properties
statement: Decide whether two expressions are equivalent by using properties of operations to rewrite
  one into the other, or both into the same form.
procedure:
- Expand products and combine like terms in each expression.
- Compare the two resulting forms term by term.
assess: Use properties of operations to decide whether 3(x + 4) + 2x and 5x + 12 are equivalent.
