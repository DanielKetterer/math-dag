id: expressions.numerical.fractions-decimals.evaluate
concept: expressions
facet: numerical
level: 3
type: procedure
name: Evaluate a numerical expression with fractions or decimals
statement: Evaluate a numerical expression with two or more operations, possibly including whole-number
  exponents, whose numbers are nonnegative fractions or decimals, in the conventional order of operations.
procedure:
- Evaluate inside grouping symbols, innermost first.
- Evaluate powers.
- Multiply and divide from left to right.
- Add and subtract from left to right.
assess: Evaluate 1/2 + 3 x (1/2)^2.
