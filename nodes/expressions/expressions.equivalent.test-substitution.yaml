id: expressions.equivalent.test-substitution
concept: expressions
facet: algebraic
level: 3
type: procedure
name: Show two expressions are not equivalent by substitution
statement: Show that two expressions are not equivalent by finding a value of the variable at which they
  have different values; agreement at the values tried does not by itself show that they are equivalent.
procedure:
- Choose a value for the variable and evaluate both expressions.
- If the values differ, the expressions are not equivalent.
- If they agree, try another value, or use properties of operations to decide.
assess: Substitute x = 0, 1 and 2 into 2(x + 3) and 2x + 3. Are the two expressions equivalent?
