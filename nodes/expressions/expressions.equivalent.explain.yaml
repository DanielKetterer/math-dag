id: expressions.equivalent.explain
concept: expressions
facet: algebraic
level: 4
type: justification
name: Explain whether two expressions are equivalent
statement: An argument that two expressions are equivalent rewrites one into the other with properties
  of operations, which hold for every value of the variable; an argument that they are not gives one value
  at which they differ.
assess: Explain why y + y + y and 3y are equivalent, and why y + 3 and 3y are not.
sources:
  ccss:
  - 6.EE.A.4
  learning_components:
  - 5ccfcd23
requires:
- clause: standard
  all_of:
  - node: expressions.equivalent.meaning
    relation: definitional
    points_to: statement
    why: The argument must show equal values for every number, or one value where they differ, which is
      the meaning of equivalent.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.equivalent.test-properties
    relation: procedural
    points_to: statement
    why: The argument for equivalence rewrites one expression into the other with properties of operations,
      as in y + y + y = 3y.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
