id: expressions.product.regroup-factors
concept: expressions
facet: algebraic
level: 3
type: procedure
name: Reorder and regroup the factors of a product
statement: Generate an expression equivalent to a product by writing its factors in a different order
  or grouping them differently, using the commutative and associative properties of multiplication, so
  that the number factors can be multiplied together.
procedure:
- Write the number factors next to each other.
- Group the number factors with parentheses and multiply them.
assess: Rewrite 4 x (y x 5) as a single number times y.
