      note: 'task-only: Only the test problem asks for y + y + y as a single term, which reads three equal
        addends as three groups of y; the procedure itself (add coefficients, counting x as 1x) does not
        use equal groups.'
    status: proposed
  - node: expressions.notation.implicit-multiplication
    relation: definitional
    points_to: statement
    why: The statement and test read terms such as 2.5x, 4x as a number times a letter (the coefficient
