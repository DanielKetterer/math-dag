id: expressions.sum.rearrange-terms
concept: expressions
facet: algebraic
level: 3
type: procedure
name: Reorder and regroup the terms of a sum
statement: Generate an expression equivalent to a sum by writing its terms in a different order or grouping
  them differently, using the commutative and associative properties of addition.
procedure:
- Write the terms in the new order.
- Group the terms to be combined with parentheses.
assess: Rewrite 3 + x + 7 as x plus a single number.
sources:
  ccss:
  - 6.EE.A.3
  learning_components:
