  - a629106a
requires:
- clause: standard
  all_of:
  - node: addition.commutative
    relation: procedural
    points_to: procedure.1
    why: Step 1 writes the terms in a new order, which is allowed because the order of addends does not
      change the sum.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.associative.strategy
    relation: procedural
    points_to: procedure.2
    why: Step 2 groups the terms differently, which relies on choosing which two numbers to add first.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.meaning
    relation: definitional
    points_to: statement
    why: The properties apply to a sum with a letter because the letter stands for a number.
