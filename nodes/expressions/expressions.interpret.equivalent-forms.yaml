id: expressions.interpret.equivalent-forms
concept: expressions
facet: algebraic
level: 3
type: concept
name: Read what an equivalent form says about the quantities in a problem
statement: Equivalent expressions for the same quantity in a problem show different relationships among
  the quantities; a form such as 1.05a shows the quantity as a multiple of a, while a + 0.05a shows it
  as a plus a part of a.
assess: A new price is written two ways, a + 0.05a and 1.05a, where a is the original price. What does
  the form 1.05a tell you about how the new price compares with the original price?
sources:
  ccss:
  - 7.EE.A.2
  learning_components:
  - 75924fc9
requires:
- clause: standard
  all_of:
  - node: expressions.equivalent.meaning
    relation: definitional
    points_to: statement
    why: The statement treats a + 0.05a and 1.05a as two expressions for the same quantity, which is what
      equivalent means.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.situation-from-expression
    relation: representational
    points_to: statement
    why: Reading what a form says about the quantities is describing the situation that an expression
      with a letter represents.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: Connecting parts of an expression to quantities in a situation is core to the
        target, but the source asks the learner to generate a situation, which may be stronger than interpreting
        a given one.'
    status: disputed
  - node: multiplication.comparison.vs-additive
    relation: definitional
    points_to: statement
    why: The statement contrasts the multiplicative form 1.05a with the additive form a + 0.05a; telling
      multiplicative from additive relations may be the direct idea (uncertain).
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
