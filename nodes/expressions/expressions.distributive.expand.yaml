id: expressions.distributive.expand
concept: expressions
facet: algebraic
level: 3
type: procedure
name: Expand a(b + c) with a variable using the distributive property
statement: Rewrite a nonnegative number times a sum or difference that contains a variable, a(b + c) or
  a(b - c), as ab + ac or ab - ac, using the distributive property.
procedure:
- Multiply the outside factor by each term inside the parentheses.
- Write the products joined by the sign that joined the terms.
assess: Rewrite 3(2 + x) without parentheses.
