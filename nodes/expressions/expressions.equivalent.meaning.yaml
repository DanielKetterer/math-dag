id: expressions.equivalent.meaning
concept: expressions
facet: algebraic
level: 3
type: concept
name: Equivalent expressions
statement: Two expressions are equivalent when they have the same value for every number substituted for
  the variable; having the same value for one number is not enough.
assess: When x = 2, both 2x and x + 2 equal 4. What does each equal when x = 5? Are 2x and x + 2 equivalent?
sources:
  ccss:
  - 6.EE.A.4
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: expressions.variable.evaluate
    relation: definitional
    points_to: statement
    why: Equivalence is defined by comparing the values of two expressions after a number is substituted
      for the variable, which is evaluating each one.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
