    status: proposed
  - node: expressions.variable.unknown-vs-varying
    relation: definitional
    points_to: statement
    why: '''Every number substituted for the variable'' treats the letter as standing for any number in
      a set, not one fixed unknown.'
    evidence:
    - kind: content
