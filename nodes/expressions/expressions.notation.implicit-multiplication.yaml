id: expressions.notation.implicit-multiplication
concept: expressions
facet: algebraic
level: 3
type: representation
name: A number next to a letter or parenthesis means multiply
statement: 'A number written directly before a letter or a parenthesis means multiplication: 4y means
  4 x y, and 5(2 + n) means 5 x (2 + n).'
assess: Rewrite 4y and 5(2 + n) with the multiplication sign x shown.
