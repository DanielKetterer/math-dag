id: expressions.parts.single-entity
concept: expressions
facet: algebraic
level: 3
type: concept
name: View part of an expression as a single quantity
statement: A part of an expression, such as (8 + 7) in 2(8 + 7), can be treated as one quantity (here,
  one factor) while also being a sum of terms.
assess: Describe 2(8 + 7) as a product of two factors. Then describe its second factor as a sum of two
  terms.
sources:
  ccss:
  - 6.EE.A.2.b
  learning_components:
  - 1ca4a9fc
