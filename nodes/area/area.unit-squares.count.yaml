id: area.unit-squares.count
concept: area
facet: unit-squares
level: 2
type: procedure
name: Measure area by counting unit squares
statement: Find the area of a figure drawn on a grid of unit squares (square cm, square m, square in,
  square ft, or an improvised square unit) by counting the squares inside it, and name the unit.
assess: This L-shaped figure is drawn on a grid of square centimeters. What is its area?
sources:
  ccss:
  - 3.MD.C.6
  learning_components:
  - '20767411'
requires:
- clause: standard
  all_of:
  - node: area.covering.meaning
    relation: definitional
    points_to: statement
    why: Counting the squares inside the figure gives its area because the figure is covered by those
      squares.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: area.unit-square
    relation: definitional
    points_to: statement
    why: The answer names the unit of the squares, such as square centimeters or square feet.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.objects
    relation: procedural
    points_to: statement
    why: The learner counts the unit squares inside an irregular figure such as an L shape to find how
      many.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
