id: area.polygon.decompose
concept: area
facet: additive
level: 2
type: procedure
name: Find the area of a polygon by decomposing it into triangles and rectangles
statement: The area of a polygon is the sum of the areas of non-overlapping triangles and rectangles that
  together make it up.
procedure:
- Cut the polygon into non-overlapping triangles and rectangles whose bases and heights are given or can
  be found from the given lengths.
- Find the area of each piece.
- Add the areas of the pieces.
assess: A trapezoid has parallel sides of 4 cm and 10 cm, a height of 3 cm, and two equal slanted sides
  (picture). Cut it into a rectangle and two triangles, and find its area.
sources:
  ccss:
  - 6.G.A.1
  - 7.G.B.6
  learning_components:
  - 5a75b6d4
  - 0d09acef
  - 370f42c5
