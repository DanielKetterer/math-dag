id: area.polygon.subtract
concept: area
facet: additive
level: 2
type: procedure
name: Find the area of a figure by subtracting the pieces outside it from a larger figure
statement: The area of a figure equals the area of a larger figure that contains it minus the areas of
  the non-overlapping pieces of the larger figure that lie outside it.
procedure:
- Enclose the figure in a larger figure whose area can be found, usually a rectangle.
- Find the area of each piece of the larger figure that lies outside the given figure.
- Subtract the sum of those areas from the area of the larger figure.
assess: A triangle drawn on grid paper fits exactly inside a 6-by-5 rectangle. The three pieces of the
  rectangle outside the triangle are right triangles with legs 6 and 2, 4 and 3, and 2 and 5. Find the
  area of the triangle by subtracting.
sources:
  ccss:
  - 6.G.A.1
  - 7.G.B.6
  learning_components:
