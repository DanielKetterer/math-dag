id: area.triangle.right.half-rectangle
concept: area
facet: additive
level: 2
type: procedure
name: Find the area of a right triangle as half of a rectangle
statement: A right triangle is half of the rectangle whose sides are its two legs, so its area is half
  of that rectangle's area.
procedure:
- Draw the rectangle that has the two legs of the right triangle as two of its sides.
- Note that the hypotenuse is a diagonal that cuts the rectangle into two copies of the triangle.
- Find the area of the rectangle and take half of it.
assess: A right triangle has legs of 6 cm and 4 cm. Draw the rectangle it is half of and use it to find
  the area of the triangle.
sources:
  ccss:
  - 6.G.A.1
  learning_components:
  - c2509042
