id: area.rectangle.tiles-along-side
concept: area
facet: unit-squares
level: 2
type: concept
name: The number of tiles along a side equals the side length
statement: When a rectangle is tiled with unit squares, the number of squares along a side equals the
  length of that side in units, since each square spans 1 unit of it.
assess: A rectangle has a side 6 cm long. It is tiled with 1 cm square tiles. How many tiles touch that
  side, and why?
sources:
  ccss:
  - 3.MD.C.6
  learning_components:
  - f538df9a
requires:
- clause: via-rows-columns
  all_of:
  - node: area.unit-square
    relation: justificatory
    points_to: statement
    why: Each tile spans 1 unit of the side because each unit square has side length 1 unit.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: measurement.length.no-gaps-overlaps
    relation: justificatory
    points_to: statement
    why: The tiles along a side are units laid end to end with no gaps or overlaps, so their count is
      the side length.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: partitioning.rectangle.rows-columns
    relation: definitional
