id: area.parallelogram.rearrange
concept: area
facet: additive
level: 2
type: procedure
name: Find the area of a parallelogram by rearranging it into a rectangle
statement: Cutting a parallelogram along a segment perpendicular to the base, from the base to the opposite
  side, and sliding the cut-off piece to the other end makes a rectangle with the same base and height,
  so the parallelogram has the area of that rectangle. Such a cut always exists when a longer side is
  used as the base.
procedure:
- Use a longer side as the base.
- Cut along a segment from a vertex of the opposite side, perpendicular to the base, down to the base.
- Move the cut-off right triangle to the other end so that its slanted side meets the other slanted side.
- Find the area of the resulting rectangle, whose sides are the base and the height.
assess: A parallelogram drawn on grid paper has a base of 7 units, a slanted side of 5 units and a height
  of 4 units. Cut it and rearrange the pieces into a rectangle, and find its area.
sources:
  ccss:
  - 6.G.A.1
  learning_components:
  - 0d09acef
