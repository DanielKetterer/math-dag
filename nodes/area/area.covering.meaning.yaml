id: area.covering.meaning
concept: area
facet: unit-squares
level: 2
type: concept
name: Area as the number of unit squares that cover a figure
statement: A plane figure that can be covered by n unit squares with no gaps and no overlaps has an area
  of n square units.
assess: Jo covered a shape with square tiles but left gaps between some of the tiles, then counted 10
  tiles. Is the area of the shape 10 square units? Explain.
