id: area.rectilinear.application
concept: area
facet: additive
level: 2
type: application
name: Solve real-world area problems about rectilinear figures
statement: A real-world story describes a rectilinear surface, such as a room or garden, with whole-number
  side lengths and asks for its area; the learner decomposes it into non-overlapping rectangles and adds
  their areas.
assess: A room's floor plan is an L shape with sides 10, 4, 6, 5, 4, and 9 feet going around it. How many
  square feet of carpet cover the whole floor?
