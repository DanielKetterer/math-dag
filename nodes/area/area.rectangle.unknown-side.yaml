    status: proposed
related:
- node: multiplication.unknown-factor.solve
  relation: same_idea_different_form
  note: Solving 12 x ? = 96 is another way to find the same unknown as dividing 96 by 12; the procedure's
    step 2 specifies dividing, so the unknown-factor solving skill is not additionally required.
status: proposed
