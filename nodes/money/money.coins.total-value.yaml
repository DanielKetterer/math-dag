id: money.coins.total-value
concept: money
facet: core
level: 2
type: procedure
name: Find the total value of a collection of coins
statement: The total value of a collection of coins, less than 100 cents, is the sum of the values of
  its coins, found most easily by counting on from the coins of greatest value.
procedure:
- Sort the coins by kind, from greatest value to least.
- 'Start at the value of the first coin and count on by each coin''s value: by 25s for quarters, 10s for
  dimes, 5s for nickels, 1s for pennies.'
- The last number said is the total in cents.
assess: What is the total value of 1 quarter, 2 dimes, 1 nickel and 3 pennies?
sources:
