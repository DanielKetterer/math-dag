id: similarity.triangle.angle-angle
concept: similarity
facet: transformation
level: 3
type: concept
name: The angle-angle criterion for similar triangles
statement: If two angles of one triangle have the same measures as two angles of another triangle, the
  two triangles are similar.
assess: Triangle ABC has angles of 40 degrees and 75 degrees. Triangle DEF is larger and also has angles
  of 40 degrees and 75 degrees. Triangle GHI has one angle of 40 degrees; its other angles are not given.
  Which of DEF and GHI must be similar to ABC?
sources:
