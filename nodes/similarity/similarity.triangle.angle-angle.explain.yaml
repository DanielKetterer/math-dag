id: similarity.triangle.angle-angle.explain
concept: similarity
facet: transformation
level: 4
type: justification
name: Explain informally why two pairs of equal angles make triangles similar
statement: If angle A = angle D and angle B = angle E in triangles ABC and DEF, dilating ABC with scale
  factor DE/AB gives a triangle whose side matching AB is as long as DE and whose angles are unchanged;
  rigid motions then place that side on DE with the third vertex on the same side as F, and because the
  rays from D and E at the matching angles meet only at F, the image lands exactly on DEF, so the triangles
  are similar.
assess: Triangles ABC and DEF have angle A = angle D and angle B = angle E. Explain, using a dilation
  and rigid motions, why the triangles must be similar.
sources:
  ccss:
  - 8.G.A.5
  learning_components:
  - 6f4e508f
requires:
- clause: standard
  all_of:
  - node: similarity.transformation.meaning
    relation: justificatory
    points_to: statement
    why: The explanation ends by showing a dilation followed by rigid motions lands exactly on DEF, which
      is what similar means.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: transformation.dilation.scale-lengths
