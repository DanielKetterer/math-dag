id: similarity.triangle.angle-angle.decide
concept: similarity
facet: transformation
level: 3
type: procedure
name: Decide from angle measures whether two triangles are similar
statement: Decide whether two triangles are similar from given angle measures by finding any missing third
  angle with the angle sum and checking for two pairs of equal angles.
procedure:
- For each triangle with only two angles given, find the third angle by subtracting their sum from 180
  degrees.
- Compare the angle measures of the two triangles.
- If two angles of one triangle equal two angles of the other, the triangles are similar; otherwise they
  are not.
assess: Triangle ABC has angles of 50 degrees and 60 degrees. Triangle DEF has angles of 60 degrees and
  70 degrees. Are the two triangles similar?
