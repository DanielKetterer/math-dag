id: counting.number-word.thousand-million
concept: counting
facet: core
level: 2
type: concept
name: The period names thousand and million
statement: 'In the name of a large whole number, the words thousand and million name periods: the number
  said before thousand counts thousands, and the number said before million counts millions.'
assess: In the number name six million, two hundred thousand, fifteen, which number counts the millions
  and which counts the thousands?
sources:
  ccss:
  - 4.NBT.A.2
  learning_components: []
