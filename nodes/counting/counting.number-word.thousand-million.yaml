- clause: standard
  all_of:
  - node: counting.number-word.thousand
    relation: definitional
    points_to: statement
    why: The word thousand names a period, so the number one thousand and its word must already be known.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.sequence.within-1000
    relation: definitional
    points_to: statement
    why: The numbers said before thousand or million are number names below one thousand, which this node
      builds.
    evidence:
