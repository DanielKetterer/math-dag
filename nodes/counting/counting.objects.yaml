id: counting.objects
concept: counting
facet: core
level: 1
type: procedure
name: Count a collection of objects
statement: >
  Saying the number words in order while touching each object exactly once,
  the last number word said tells how many objects are in the collection.
procedure:
  - Say the number words in order, one per object.
  - Touch or point to each object exactly once.
  - Report the last number word as the size of the collection.
assess: "How many counters are on the table? (7 counters, scattered)"
sources:
  ccss: [K.CC.B.4, K.CC.B.5]
requires: []
root_reason: >
  Counting objects is where this map starts. Earlier number sense
  (subitizing, comparing collections by sight) is out of scope for now.
status: proposed
