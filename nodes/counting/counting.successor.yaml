id: counting.successor
concept: counting
facet: core
level: 1
type: concept
name: Each next number word is one more
statement: Each number word in the count sequence names a quantity exactly one greater than the word before
  it, so adding one object to a collection of n objects makes its number the word after n.
assess: Count 8 marbles together with the child, then drop them into an opaque cup. Drop in one more while
  the child watches. 'How many marbles are in the cup now?' Credit 'nine' without emptying the cup to
  recount.
sources:
  ccss:
