id: counting.sequence.backward
concept: counting
facet: sequence
level: 1
type: fact
name: Count backward by ones
statement: Say the number words in reverse order by ones, from a given starting number down to one, with
  none skipped or repeated.
assess: '''Start at eight and count backward all the way to one.'' Credit ''eight, seven, six, five, four,
  three, two, one'' with no word skipped.'
