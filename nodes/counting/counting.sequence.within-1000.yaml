id: counting.sequence.within-1000
concept: counting
facet: sequence
level: 1
type: procedure
name: Count forward by ones within 1000, across hundreds
statement: Count forward by ones from any number to any number within 1000, continuing correctly across
  decades and hundreds (ninety-nine, one hundred, one hundred one; three hundred ninety-nine, four hundred).
procedure:
- Say the starting number.
- For each next number, keep the hundreds name and say the next tens-and-ones name.
- After a number ending in ninety-nine, say the next hundred (for example, four hundred), then continue
  with one, two, and so on after the hundred.
assess: Count aloud by ones from 296 to 305.
