id: counting.skip.tens.from-any
concept: counting
facet: sequence
level: 1
type: procedure
name: Count forward by tens from any number within 120
statement: Count forward by tens from any starting number up to 120, so that the ones stay the same and
  the tens increase by one each step (24, 34, 44, ..., 94, 104).
procedure:
- Say the starting number.
- Say the number with the same ones and one more ten.
- Repeat until the stopping number.
assess: Count aloud by tens starting at 24 and stopping at 114.
sources:
