id: counting.one-to-one
concept: counting
facet: core
level: 1
type: procedure
name: Say one number word for each object in a count
statement: While counting a collection, pair each object with exactly one number word, so that every object
  is tagged once and no object is skipped or tagged twice.
procedure:
- Point to or move one object that has not been counted, and say one number word with it.
- Set that object apart, or keep track of it, as counted.
- Repeat until no uncounted objects remain.
assess: '''Count these buttons, touching each one as you count'' (9 buttons scattered on the table). Credit
  if every button receives exactly one word and none is skipped or counted twice, whether or not the words
  are in the conventional order.'
sources:
  ccss:
  - K.CC.B.4.a
  learning_components: []
  prek:
  - cs.counting.corresponder
  - cp.gg.one-one
requires: []
root_reason: The assessment credits tagging each object exactly once with any number words, whether or
  not they are in conventional order, so neither the word sequence nor any quantity idea is required.
status: proposed
