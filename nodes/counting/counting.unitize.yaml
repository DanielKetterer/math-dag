id: counting.unitize
concept: counting
facet: core
level: 1
type: concept
name: Count a group of objects as one unit
statement: A group of objects, such as a pair of socks or a bundle of ten sticks, can be counted as one
  unit, so that the count tells how many groups there are rather than how many objects.
assess: Show 4 pairs of socks, each pair clipped together. 'How many socks are there? How many pairs of
  socks are there?' Credit 8 socks and 4 pairs.
