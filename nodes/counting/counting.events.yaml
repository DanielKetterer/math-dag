id: counting.events
concept: counting
facet: core
level: 1
type: procedure
name: Count sounds or actions
statement: Count a sequence of sounds or actions that are never present all at once, such as claps or
  jumps, by saying one number word with each as it happens, and tell how many there were.
assess: '''Listen and count my claps.'' Clap 6 times out of the child''s sight. ''How many claps?'' Credit
  6.'
sources:
  ccss: []
  learning_components: []
  prek:
  - cp.gg.abstraction
requires:
- clause: standard
  all_of:
  - node: counting.sequence.recite
    relation: definitional
    points_to: statement
    why: Each clap or jump is paired with the next number word in order, so the learner must produce the
      sequence while the events occur.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A13 keep: KEEP: Counting sounds or actions requires producing successive number words as
        the events occur.'
    status: reviewed
  - node: counting.one-to-one
    relation: definitional
    points_to: statement
    why: The statement requires saying one number word with each event as it happens, which is one-word-per-item
      tagging applied to actions instead of objects.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A16 keep: Kept after review discussion 2026-10-19 (Daniel accepted the pushback): the events
        node''s own statement pairs one number word with each event; kept on the existing tagging node
        rather than a near-duplicate events-tagging node. | Daniel: REJECT as a direct prerequisite: Counting
        events uses one-to-one correspondence, but prior mastery of counting objects is not necessarily
        required; model the shared principle separately.'
    status: reviewed
  - node: counting.cardinal.last-word
    relation: definitional
    points_to: statement
    why: Telling how many claps there were means reporting the last word said as the total, even though
      the claps are no longer present.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A37 keep: KEEP: To tell how many sounds or actions occurred, the learner must understand
        that the final count word gives the total.'
    status: reviewed
status: proposed
