id: counting.cardinal.order-irrelevance
concept: counting
facet: core
level: 1
type: concept
name: A count does not depend on order or arrangement
statement: The number of objects in a collection is the same whatever order the objects are counted in
  and however they are rearranged, provided none are added or removed.
assess: The child counts 7 bears in a row and says 'seven'. While the child watches, push the bears into
  a scattered pile, point to one in the middle, and ask, 'If you count them starting with this one, how
  many will you get?' Credit 'seven' without recounting.
sources:
  ccss:
  - K.CC.B.4.b
  learning_components: []
  prek:
  - cp.gg.order-irrelevance
requires:
- clause: standard
  all_of:
  - node: counting.objects
    relation: definitional
    points_to: statement
    why: The number claimed to stay the same under reordering is the number found by counting the collection,
      and the test starts from a completed count.
