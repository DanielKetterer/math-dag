id: counting.cardinal.order-irrelevance
concept: counting
facet: core
level: 1
type: concept
name: A count does not depend on the order of counting
statement: The number of objects in a collection is the same whatever order the objects are counted in,
  provided none are added or removed.
assess: The child counts 7 bears in a row from left to right and says 'seven'. Without moving any bear,
  point to the bear at the right end and ask, 'If you count starting with this one, how many will you
  get?' Credit 'seven' without recounting.
sources:
  ccss:
  - K.CC.B.4.b
  learning_components: []
  prek:
  - cp.gg.order-irrelevance
requires:
- clause: standard
  all_of:
  - node: counting.objects
    relation: definitional
    points_to: statement
    why: The number claimed to stay the same under reordering is the number found by counting the collection,
      and the test starts from a completed count.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A35 keep: Kept after review discussion 2026-10-19 (Daniel accepted the pushback): order irrelevance
        is a claim about counting and cannot be held without it. The node bundles order irrelevance with
        number conservation under rearrangement and is to be split; conservation can be grounded by matching.
        | Daniel: REJECT as a concept-level edge; task-scope it if needed: The assessment involves a prior
        count, but order irrelevance can be taught using a collection with its total already known.'
    status: reviewed
status: proposed
