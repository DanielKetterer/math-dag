id: center.mean-median.outlier-effect
concept: center
facet: core
level: 2
type: concept
name: An extreme value pulls the mean but barely moves the median
statement: Changing one value to an extreme value pulls the mean toward it, because every value enters
  the sum, but changes the median little or not at all, because the median depends only on the middle
  position of the ordered values.
assess: The data set 2, 3, 4, 5, 6 has mean 4 and median 4. If the 6 is replaced by 56, which changes
  a lot, the mean or the median? Explain without computing.
