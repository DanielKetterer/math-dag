id: center.meaning
concept: center
facet: core
level: 2
type: concept
name: A measure of center summarizes a data set with one number
statement: A measure of center is a single number that summarizes all the values of a numerical data set
  as one typical value.
assess: 'Test scores: 70, 75, 80, 80, 95. Lee says ''a typical score is about 80.'' Kim says ''the scores
  go from 70 to 95.'' Raj says ''the scores are spread over 25 points.'' Whose statement gives a measure
  of center? Why are the other two not measures of center?'
