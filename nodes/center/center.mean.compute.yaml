    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: data.observations.count
    relation: procedural
    points_to: procedure.2
    why: Step 2 counts the number of values in the data set, counting a repeated value each time it occurs,
      which is the number of observations.
