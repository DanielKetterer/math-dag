id: volume.prism.layers.explain
concept: volume
facet: unit-cubes
level: 2
type: justification
name: Explain why packing, l x w x h, and B x h give the same volume
statement: A right rectangular prism with whole-number edges l, w, h packed with unit cubes has h layers,
  and each layer is an l by w array of l x w cubes, which is also the base area in square units; so counting
  the cubes, l x w x h, and the base area times h give the same number.
assess: This box is packed with unit cubes, 4 by 3 on the bottom and 5 layers high. Explain why counting
  all the cubes, computing 4 x 3 x 5, and multiplying the area of the base by the height all give the
  same volume.
sources:
  ccss:
  - 5.MD.C.5.a
  learning_components:
  - 3d028b96
