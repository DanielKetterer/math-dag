    why: The formula is written with the letters B and h in an expression.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: volume.packing
    relation: definitional
