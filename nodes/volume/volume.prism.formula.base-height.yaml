    why: The formula gives the volume as the number of cubes that pack the prism.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: area.rectangle.length-times-width
    relation: definitional
    points_to: statement
    why: The base B is the area of a rectangle in square units, found as length times width.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Needed only when B is obtained as l x w from the prism''s edges; via the layers
