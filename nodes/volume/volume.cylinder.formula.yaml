id: volume.cylinder.formula
concept: volume
facet: unit-cubes
level: 3
type: concept
name: The volume formula for a cylinder
statement: The volume of a cylinder with base radius r and height h is V = pi x r^2 x h, the area of its
  circular base times its height.
assess: 'Which expression gives the volume of a cylinder with radius 3 cm and height 10 cm: pi x 3^2 x
  10; 2 x pi x 3 x 10; pi x 3 x 10^2?'
sources:
  ccss:
  - 8.G.C.9
  learning_components:
  - ba4daaa8
