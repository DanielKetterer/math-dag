id: volume.prism.fraction-edges.lwh.apply
concept: volume
facet: multiplicative
level: 3
type: procedure
name: Find the volume of a fraction-edged rectangular prism with V = l x w x h
statement: The volume of a right rectangular prism with fractional edge lengths is the product of its
  length, width and height.
procedure:
- Identify the length, width and height.
- Multiply the three lengths.
- Write the result in cubic units.
assess: Find the volume of a right rectangular prism that is 1/2 m long, 3/4 m wide and 2 m tall.
