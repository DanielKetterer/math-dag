id: volume.prism.fraction-edges.base-height.apply
concept: volume
facet: multiplicative
level: 3
type: procedure
name: Find the volume of a fraction-edged rectangular prism with V = B x h
statement: The volume of a right rectangular prism with fractional edge lengths is the area of its base
  times its height.
procedure:
- Find or read the area B of the base.
- Multiply B by the height h.
assess: A right rectangular prism has a base with area 5/2 square ft and a height of 3/4 ft. Find its
  volume.
