id: volume.application.prism.fraction-edges.base-height
concept: volume
facet: multiplicative
level: 3
type: application
name: Solve real-world problems about the volume of a box from a fractional base area and height
statement: A real-world problem gives the area of the base of a box-shaped object and its height, at least
  one of them a fraction; the learner finds its volume.
assess: The bottom of a fish tank has an area of 3/2 square ft. Water fills the tank to a depth of 2/3
  ft. How many cubic feet of water are in the tank?
