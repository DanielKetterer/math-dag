id: volume.sphere.formula
concept: volume
facet: unit-cubes
level: 3
type: concept
name: The volume formula for a sphere
statement: The volume of a sphere with radius r is V = (4/3) x pi x r^3.
assess: 'Which expression gives the volume of a sphere with radius 3 cm: (4/3) x pi x 3^3; (4/3) x pi
  x 3^2; 4 x pi x 3^2?'
sources:
  ccss:
  - 8.G.C.9
  learning_components:
  - 8e127d06
requires:
- clause: standard
  all_of:
  - node: exponent.whole-number-power.meaning
    relation: representational
    points_to: statement
    why: The term r^3 in the formula means the radius used as a factor three times.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: circle.center-radius
    relation: definitional
    points_to: statement
    why: The formula is written with the radius r of the sphere, measured from its center.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: circle.pi.ratio
    relation: definitional
    points_to: statement
    why: The formula contains the constant pi, the ratio of circumference to diameter.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.name.solids
    relation: definitional
    points_to: statement
