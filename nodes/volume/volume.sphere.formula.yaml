      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.meaning
    relation: representational
    points_to: statement
    why: The letter r stands for the radius of the sphere.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.as-number
    relation: definitional
    points_to: statement
    why: The coefficient 4/3 is a fraction used as a number that multiplies pi x r^3.
    evidence:
