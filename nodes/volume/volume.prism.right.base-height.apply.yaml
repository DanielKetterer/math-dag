      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: area.triangle.formula.apply
    relation: procedural
    points_to: procedure.1
    why: Finding the area B of a triangular base uses the triangle area formula.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
