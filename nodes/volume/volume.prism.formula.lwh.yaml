id: volume.prism.formula.lwh
concept: volume
facet: unit-cubes
level: 3
type: concept
name: The volume formula V = l x w x h
statement: A right rectangular prism with whole-number edge lengths l, w, and h in one unit has volume
  V = l x w x h cubic units.
assess: 'A box is 5 units long, 2 units wide, and 3 units tall. Which expression gives its volume in cubic
  units: 5 + 2 + 3, 5 x 2 x 3, or 2 x 5 + 2 x 2 + 2 x 3?'
sources:
