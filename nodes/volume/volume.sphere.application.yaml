  all_of:
  - node: volume.sphere.compute
    relation: procedural
    points_to: statement
    why: The problem finds a volume from a radius or diameter with V = (4/3) x pi x r^3.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.numerical.fractions-decimals.evaluate
    relation: procedural
    points_to: statement
    why: The 3.14 value of pi makes the volume computation a product or quotient of decimals.
    evidence:
    - kind: content
      source: pass-P
