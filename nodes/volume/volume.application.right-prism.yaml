id: volume.application.right-prism
concept: volume
facet: multiplicative
level: 3
type: application
name: Solve real-world problems about the volume of an object shaped like a non-rectangular right prism
statement: A real-world problem describes an object shaped like a right prism whose base is a triangle
  or another polygon, with the lengths needed, and asks how much space it holds or takes up; the learner
  finds its volume.
assess: A tent is a triangular prism 3 m long. Each triangular end has a base of 4 m and a height of 2
  m. How many cubic meters of space are inside the tent?
sources:
