id: volume.composite.two-prisms
concept: volume
facet: unit-cubes
level: 3
type: procedure
name: Find the volume of a solid made of two rectangular prisms
statement: Find the volume of a solid composed of two non-overlapping right rectangular prisms by splitting
  it into the two prisms, finding each volume, and adding.
procedure:
- Split the solid into two right rectangular prisms that do not overlap.
- Find the edge lengths of each prism, subtracting given lengths where an edge is not labeled.
- Find the volume of each prism.
- Add the two volumes.
assess: 'A solid is 4 cm deep. Its front face is an L shape 10 cm wide and 8 cm tall overall: the bottom
  part is 3 cm tall across the full width, and the upright part on the left is 3 cm wide. Find the volume
  of the solid.'
