id: volume.application.composite.right-prisms
concept: volume
facet: additive
level: 3
type: application
name: Solve real-world problems about the volume of an object made of right prisms
statement: A real-world problem describes an object made of right prisms, at least one with a non-rectangular
  base, with the lengths needed, and asks how much space it holds or takes up; the learner finds its volume.
assess: A shed is a box 4 m long, 3 m wide and 2 m tall with a roof shaped like a triangular prism on
  top. The roof is 4 m long and its triangular ends have a base of 3 m and a height of 1 m. What is the
  total volume of the shed?
