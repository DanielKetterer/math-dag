id: volume.cone.formula
concept: volume
facet: unit-cubes
level: 3
type: concept
name: The volume formula for a cone
statement: The volume of a cone with base radius r and height h is V = (1/3) x pi x r^2 x h, one third
  of the volume of the cylinder with the same base and height.
assess: A cylinder and a cone have the same radius and the same height. The cylinder holds 30 cubic cm.
  How much does the cone hold?
sources:
  ccss:
  - 8.G.C.9
  learning_components:
  - 74823f49
