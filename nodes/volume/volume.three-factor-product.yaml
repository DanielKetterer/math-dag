id: volume.three-factor-product
concept: volume
facet: unit-cubes
level: 2
type: representation
name: Represent a product of three whole numbers as the volume of a prism
statement: A product a x b x c of whole numbers is represented by a right rectangular prism of unit cubes
  with edge lengths a, b, and c, whose number of cubes is the product.
assess: Draw a rectangular prism of unit cubes whose number of cubes is 3 x 2 x 4, and label its three
  edge lengths.
sources:
  ccss:
  - 5.MD.C.5.a
  learning_components:
  - 2a6c578b
requires:
- clause: standard
  all_of:
  - node: multiplication.array-area.whole-number-product.represent
    relation: representational
    points_to: statement
    why: The bottom layer of the prism is an array of a by b cubes, which represents the product a x b
      as a rectangle.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: The prism stacks c equal layers of a x b cubes, which is the product as a number of equal groups.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: volume.packing
    relation: definitional
    points_to: statement
    why: The statement says the number of unit cubes in the prism is the product, which is its volume
      in cubic units.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
