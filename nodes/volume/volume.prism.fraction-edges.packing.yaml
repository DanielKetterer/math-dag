id: volume.prism.fraction-edges.packing
concept: volume
facet: unit-cubes
level: 2
type: procedure
name: Find the volume of a fraction-edged rectangular prism by packing it with unit-fraction cubes
statement: A right rectangular prism whose edge lengths are multiples of 1/n unit is packed exactly by
  cubes of edge 1/n; its volume is the number of those cubes times 1/(n x n x n) cubic unit.
procedure:
- Choose a unit fraction 1/n such that each edge length is a whole number of 1/n lengths.
- Count the cubes of edge 1/n along each edge and multiply the three counts to get the number of cubes
  that pack the prism.
- Multiply the number of cubes by the volume of one cube, 1/(n x n x n) cubic unit.
assess: A box is 3/2 units long, 1 unit wide, and 1/2 unit tall. It is packed exactly with cubes of edge
  1/2 unit, as shown. Use the packing to find the volume of the box in cubic units.
sources:
