      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test gives vertices as coordinates; the procedure and statement work
        on any two congruent figures.'
    status: proposed
  - node: angle.measure.degrees
    relation: definitional
