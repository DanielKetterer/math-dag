      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test finds the translation by subtracting coordinates (9 - 1, 4 - 1);
        subtraction.within-20 would cover the numbers used.'
    status: proposed
  - node: coordinate-plane.first-quadrant.plot
    relation: procedural
    points_to: assess
    why: The test gives the six vertices as coordinates on a grid, and the learner must locate them to
      see how the two triangles sit.
    scope: task
    evidence:
