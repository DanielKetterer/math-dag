      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: coordinate.ordered-pair.notation
    relation: representational
    points_to: assess
    why: The test gives the vertices as ordered pairs, and the solver must read them to find the translation
      and the line of reflection.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test gives vertices as ordered pairs; the procedure and statement do
        not use coordinates.'
    status: proposed
  - node: subtraction.within-100
    relation: procedural
