id: circle.area.derive-from-circumference
concept: circle
facet: measure
level: 4
type: justification
name: Derive the area of a circle from its circumference by rearranging sectors
statement: A circle cut into many equal sectors, arranged alternately point up and point down, is close
  to a parallelogram whose base is half the circumference and whose height is the radius, and closer the
  more sectors are used; so the area is (1/2) x C x r, which is (1/2) x 2 x pi x r x r = pi x r^2.
assess: A circle of radius r is cut into 16 equal sectors, which are rearranged as in the picture. Use
  the picture to explain why the area of the circle is half its circumference times its radius, and why
  that equals pi x r^2.
sources:
  ccss:
  - 7.G.B.4
  learning_components:
  - b220156e
requires:
