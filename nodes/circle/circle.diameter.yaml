      source: critic-sonnet
      note: necessary
    status: proposed
  - node: segment.meaning
    relation: definitional
    points_to: statement
    why: A diameter is a segment with two endpoints, and both endpoints lie on the circle.
    evidence:
    - kind: content
      source: pass-P
