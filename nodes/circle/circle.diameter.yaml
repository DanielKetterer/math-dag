id: circle.diameter
concept: circle
facet: figure
level: 2
type: concept
name: A diameter of a circle
statement: A diameter of a circle is a segment that passes through the center and has both endpoints on
  the circle; its length is twice the radius.
assess: In the picture, segment AB has both endpoints on the circle but misses the center, and segment
  CD passes through the center with both endpoints on the circle. Which is a diameter? The radius is 3
  cm; how long is it?
sources:
