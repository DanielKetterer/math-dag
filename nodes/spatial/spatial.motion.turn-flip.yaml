id: spatial.motion.turn-flip
concept: spatial
facet: motion
level: 1
type: procedure
name: Turn or flip a shape to make it fit
statement: Make a shape fit an outline or match another shape by turning it, sliding it, or flipping it
  over, choosing which motion is needed.
assess: Show an outline of a right triangle with its right angle at the lower left. Hand the child a matching
  triangle with its right angle at the upper right. 'Make your triangle fit exactly inside the outline.'
  Credit a fit made by turning the triangle.
