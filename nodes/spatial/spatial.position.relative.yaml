id: spatial.position.relative
concept: spatial
facet: position-object
level: 1
type: representation
name: Use position words for where an object is
statement: Position words such as in, on, under, above, below, in front of, behind, beside, and next to
  describe where one object is relative to another, and the learner can both place an object as told and
  say where an object is.
assess: '''Put the bear behind the box.'' Then place the ball under the table and ask, ''Where is the
  ball?'' Credit the bear placed behind the box and ''under the table''.'
sources:
  ccss:
  - K.G.A.1
  learning_components: []
  prek:
  - elof.p-math-10
requires: []
root_reason: Position words such as in, on, under and behind are learned from direct experience with objects
  in space, so no earlier skill in this map is required.
status: proposed
