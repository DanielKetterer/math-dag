id: spatial.position.body
concept: spatial
facet: position-body
level: 1
type: concept
name: Follow directions for moving one's own body
statement: Direction words such as up, down, forward, backward, and around describe the position or movement
  of one's own body, so a learner can carry out a spoken direction that uses them.
assess: '''Take two steps forward. Now put your hands up. Now take one step backward.'' Credit each movement
  made in the stated direction.'
