    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired subtraction.whole-number: The difference 50 - 40 is 5 tens - 4 tens,
        within 10.'
    status: disputed
  - node: fraction.quotient.symbolic
    relation: representational
    points_to: statement
    why: The ratio (new - original)/original is a quotient written as a fraction of the change over the
      original amount.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Writing the change over the original as a quotient fraction is one route; scaling
        to 100 or decimal division are the others. | other route: Scale to second term 100 (ratio.equivalent)
        or divide as decimals (decimal.operations).'
    status: disputed
status: proposed
