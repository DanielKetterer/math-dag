id: percent.application.percent-change
concept: percent
facet: rate-per-100
level: 3
type: application
name: Find a percent increase or decrease
statement: A problem gives an original and a new amount; the learner finds the percent change as (new
  - original)/original x 100, always relative to the original amount.
assess: A price drops from $50 to $40. What is the percent decrease?
sources:
  ccss:
  - 7.RP.A.3
  learning_components:
  - 892d2a63
  - 93360b70
requires:
- clause: via-equivalent
  all_of:
  - node: percent.rate-per-100
    relation: definitional
    points_to: statement
    why: Multiplying the relative change by 100 expresses it as parts per 100, which is the meaning of
      a percent.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.within-10.fluency
    relation: definitional
    points_to: statement
    why: The difference new - original is the first computation.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired subtraction.whole-number: The difference 50 - 40 is 5 tens - 4 tens,
        within 10.'
    status: disputed
  - node: ratio.equivalent
    relation: definitional
    points_to: statement
    why: The change-to-original ratio is scaled to an equivalent ratio with 100 as the second term to
      read the percent.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Scaling change:original to ?:100 is one route; the quotient-then-multiply formula
        is the other. | other route: Compute the quotient (new - original)/original and multiply by 100
        (fraction.quotient.symbolic, decimal.operations).'
    status: disputed
- clause: via-operations
  all_of:
  - node: percent.rate-per-100
    relation: definitional
    points_to: statement
    why: Multiplying the relative change by 100 expresses it as parts per 100, which is the meaning of
      a percent.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.within-10.fluency
    relation: definitional
    points_to: statement
    why: The difference new - original is the first computation.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired subtraction.whole-number: The difference 50 - 40 is 5 tens - 4 tens,
        within 10.'
    status: disputed
  - node: decimal.division.by-whole.algorithm
    relation: procedural
    points_to: statement
    why: Computing new - original and dividing by the original, as in 10 divided by 50 equals 0.2, uses
      decimal arithmetic.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Dividing 10 by 50 to 0.2 is one route; the other scales change:original to an
        equivalent ratio with 100 as the second term. | other route: Scale the ratio change:original to
        a ratio with second term 100 (ratio.equivalent).'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.operations: 10 divided by 50 gives the decimal 0.2 and then
        0.2 x 100 is a decimal times a whole number. Claude: the source is symbolic (L3), so the skill
        is the 6.NS.B.3 standard algorithm, a later-phase boundary id, not the L2 model node.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.division.algorithm: The divisor is a whole number with a
        decimal quotient (10 divided by 50, 9 divided by 12); no decimal divisor occurs.'
    status: disputed
  - node: decimal.multiplication.algorithm
    relation: procedural
    points_to: statement
    why: Computing new - original and dividing by the original, as in 10 divided by 50 equals 0.2, uses
      decimal arithmetic.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Dividing 10 by 50 to 0.2 is one route; the other scales change:original to an
        equivalent ratio with 100 as the second term. | other route: Scale the ratio change:original to
        a ratio with second term 100 (ratio.equivalent).'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.operations: 10 divided by 50 gives the decimal 0.2 and then
        0.2 x 100 is a decimal times a whole number. Claude: the source is symbolic (L3), so the skill
        is the 6.NS.B.3 standard algorithm, a later-phase boundary id, not the L2 model node.'
    status: disputed
  - node: rational-number.subtraction.integers
    relation: definitional
    points_to: statement
    why: The formula (new - original)/original gives a negative number for a decrease, so signed subtraction
      and division are used.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Signed values appear only if a decrease is recorded as negative; the magnitude
        of the change with the word increase or decrease avoids negatives. | other route: Compute the
        difference as a positive amount and label it increase or decrease (subtraction.whole-number).'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired rational-numbers.operations: 40 - 50 = -10 is an integer difference;
        -10 divided by 50 = -0.2 is a signed quotient that is not an integer.'
    status: disputed
  - node: rational-number.division.rationals
    relation: definitional
    points_to: statement
    why: The formula (new - original)/original gives a negative number for a decrease, so signed subtraction
      and division are used.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Signed values appear only if a decrease is recorded as negative; the magnitude
        of the change with the word increase or decrease avoids negatives. | other route: Compute the
        difference as a positive amount and label it increase or decrease (subtraction.whole-number).'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired rational-numbers.operations: 40 - 50 = -10 is an integer difference;
        -10 divided by 50 = -0.2 is a signed quotient that is not an integer.'
    status: disputed
