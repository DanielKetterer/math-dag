id: percent.application.increase-amount
concept: percent
facet: rate-per-100
level: 3
type: application
name: Find a total after adding a percent of a base (markup, tax, tip)
statement: A problem adds one or more percents of a base amount to it, such as a markup, sales tax, or
  tip; the learner finds each percent of the base and the resulting total.
assess: A meal costs $40. Sales tax is 6% and the tip is 18%, both of the $40. What is the total?
sources:
  ccss:
