id: inequality.solution.meaning
concept: inequality
facet: open-sentence
level: 3
type: concept
name: A solution of an inequality
statement: A solution of an inequality with a variable is a value of the variable that makes the inequality
  true; an inequality can have more than one solution.
assess: x + 1 > 5 is true when x = 6 and when x = 9, and false when x = 3. Which of 3, 6 and 9 are solutions
  of x + 1 > 5?
