  learning_components:
  - facf8a39
requires:
- clause: standard
  all_of:
  - node: inequality.solution.meaning
    relation: definitional
    points_to: statement
    why: The open circle at c records that c itself is not a solution of x > c or x < c, while points
      on the ray are solutions.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.fraction-decimal.number-line
    relation: procedural
    points_to: procedure.1
    why: Step 1 locates c, such as -1.5, on the number line, which can mean placing a negative decimal
      or fraction.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
