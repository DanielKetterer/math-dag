  - node: rational-number.order.number-line
    relation: procedural
    points_to: procedure.2
    why: Step 2 chooses the ray direction from the symbol, since x > c lies to the right of c and x <
      c to the left.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
