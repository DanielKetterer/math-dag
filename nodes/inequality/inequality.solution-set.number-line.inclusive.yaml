id: inequality.solution-set.number-line.inclusive
concept: inequality
facet: open-sentence
level: 3
type: representation
name: Graph the solutions of x >= c or x <= c on a number line
statement: The solutions of x >= c or x <= c, for a rational number c, are shown on a number line by a
  filled circle at c, which is a solution, and a ray from c to the right for x >= c or to the left for
  x <= c.
procedure:
- Locate c on the number line and draw a filled circle there.
- Draw a ray from c to the right for x >= c, or to the left for x <= c.
assess: Show all solutions of x >= 2.5 on a number line.
sources:
  ccss:
  - 7.EE.B.4.b
  learning_components:
  - 47e19034
requires:
- clause: standard
  all_of:
  - node: rational-number.fraction-decimal.number-line
    relation: procedural
    points_to: procedure.1
    why: Step 1 locates c, such as 2.5, on the number line, which can mean placing a decimal or fraction.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.order.number-line
    relation: procedural
    points_to: procedure.2
    why: Step 2 chooses the ray direction from the symbol, since x >= c lies to the right of c and x <=
      c to the left.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: inequality.symbols.inclusive
    relation: definitional
    points_to: statement
    why: The filled circle at c shows that c is a solution, which is the meaning of the symbols >= and
      <=.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: ray.meaning
    relation: representational
    points_to: statement
    why: The statement shows the solutions as a ray from c, a part of a line starting at c and going on
      without end one way.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: inequality.simple.infinitely-many-solutions
    relation: representational
    points_to: statement
    why: A ray shows the solutions because every number on one side of c, not only whole numbers, is a
      solution.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
