id: inequality.simple.write-constraint
concept: inequality
facet: open-sentence
level: 3
type: representation
name: Write x > c or x < c for a condition stated in words
statement: Write an inequality x > c or x < c that states a condition given in words, such as 'more than
  c' or 'less than c', on a quantity x.
assess: To ride a roller coaster, a rider must be taller than 52 inches. Write an inequality for the height
  h, in inches, of a rider who may ride.
