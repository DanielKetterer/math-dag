    why: On the arithmetic route the halfway number is the smaller number plus half the distance (200
      and 300 give 250).
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: division.partitive.meaning
    relation: definitional
    points_to: statement
    why: Half of the distance is the size of each share when the distance is shared into two equal parts.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Half of the distance as a share size is the arithmetic route. | other route:
        Partition the segment between the two numbers on the number line into two equal lengths and read
        the point reached (partitioning.segment.equal-lengths).'
    status: disputed
