id: number.halfway-between
concept: number-line
facet: core
level: 2
type: concept
name: The number halfway between two numbers
statement: 'The number halfway between two numbers is the point of the number line at the same distance
  from both: the smaller number plus half of the distance from it to the larger.'
assess: What number is halfway between 40 and 50? Between 200 and 300? Between 4 and 6?
sources:
  ccss:
  - 3.NBT.A.1
  learning_components: []
requires:
- clause: via-number-line
  all_of:
  - node: division.by-one-digit
    relation: procedural
    points_to: assess
    why: The test problem needs half of 10, half of 100 and half of 2, which are divisions by 2.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test numbers need halving by arithmetic; the idea can be met by splitting
        the segment between the numbers into two equal lengths.'
    status: proposed
  - node: number-line.whole-number-lengths
    relation: representational
    points_to: statement
    why: The halfway number is a point of the number line, which shows whole numbers as lengths from 0.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.within-1000
    relation: definitional
    points_to: statement
    why: On the arithmetic route the halfway number is the smaller number plus half the distance (200
      and 300 give 250).
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: subtraction.comparison.number-line
    relation: definitional
    points_to: statement
    why: The distance from the smaller to the larger number on the number line is their difference, and
      halfway is half of it.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Finding the distance as a difference is part of the arithmetic route. | other
        route: Partition the segment between the two numbers on the number line into two equal lengths
        without computing the difference.'
    status: disputed
- clause: via-meaning
  all_of:
