id: shapes.attribute.equal-sides
concept: shapes
facet: properties
level: 1
type: concept
name: Notice whether a shape's sides are equal in length
statement: Some shapes have all their sides the same length (a square) and some do not (a long rectangle);
  whether the sides are equal is an attribute of the shape, found by comparing side lengths.
assess: Here are a square, a long thin rectangle, and a triangle with one long side. Which shape has all
  its sides the same length?
