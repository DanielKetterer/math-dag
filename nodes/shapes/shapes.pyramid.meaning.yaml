id: shapes.pyramid.meaning
concept: shapes
facet: properties
level: 2
type: concept
name: A pyramid
statement: A pyramid is a solid with one polygon base and one triangular face on each side of the base,
  all the triangles meeting at a single point, the apex.
assess: Pictures show (a) a solid with a square base and four triangles meeting at a point, (b) a solid
  with two parallel triangles joined by three rectangles, (c) a cone, (d) a solid made of four triangles.
  Which are pyramids?
