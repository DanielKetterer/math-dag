id: shapes.prism.right.meaning
concept: shapes
facet: properties
level: 2
type: concept
name: A right prism
statement: A right prism is a solid with two congruent, parallel polygon bases joined by rectangular faces
  that are perpendicular to the bases; the distance between the bases is its height.
assess: Pictures show (a) a box, (b) a solid with two parallel triangles joined by three rectangles perpendicular
  to them, (c) a solid with a square base and four triangles meeting at a point, (d) a solid with two
  parallel squares joined by four leaning parallelograms. Which are right prisms?
sources:
  ccss:
  - 6.G.A.4
  - 7.G.B.6
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: shapes.solid.parts
    relation: definitional
    points_to: statement
    why: A prism is described by its faces and bases, which are the flat surfaces of a solid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.polygon.name-by-sides
    relation: definitional
    points_to: statement
    why: The bases are polygons, such as triangles and quadrilaterals, named by their number of sides.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.rectangle.define
    relation: definitional
    points_to: statement
    why: The side faces must be rectangles, with four right angles, to tell right prisms from leaning
      ones.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: perpendicular.meaning
    relation: definitional
    points_to: statement
    why: The rectangular faces are perpendicular to the bases, meeting them at right angles.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: parallel.meaning
    relation: definitional
    points_to: statement
    why: The two bases lie in parallel positions and never meet, however far they are extended.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.compare.same-different
    relation: definitional
    points_to: statement
    why: The two bases must be the same shape and size, which is found by comparing the whole shapes.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
