id: shapes.sides.count
concept: shapes
facet: properties
level: 1
type: concept
name: Identify and count the sides of a shape
statement: A side of a polygon is one of the straight segments that form its boundary, so the sides can
  be pointed to one by one and counted.
assess: Show a hexagon. 'Run your finger along each side of this shape. How many sides does it have?'
  Credit 6 with each side traced once.
sources:
  ccss:
  - K.G.B.4
  learning_components: []
  prek:
  - cs.shapes.side-recognizer
requires:
- clause: standard
  all_of:
  - node: counting.objects
    relation: definitional
    points_to: statement
    why: The sides are pointed to one at a time and counted, so the learner counts a set of segments by
      tagging each once and giving the last word.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A11 keep: KEEP: Counting sides requires enumerating the sides as a collection, one at a time.'
    status: reviewed
status: proposed
