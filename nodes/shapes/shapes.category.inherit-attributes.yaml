id: shapes.category.inherit-attributes
concept: shapes
facet: category
level: 3
type: concept
name: Attributes of a category belong to all its subcategories
statement: If every shape in a category has an attribute, then every shape in each subcategory of that
  category has the attribute too.
assess: All parallelograms have diagonals that cut each other in half. Every rhombus is a parallelogram.
  Without measuring, must the diagonals of every rhombus cut each other in half? Explain using the categories.
