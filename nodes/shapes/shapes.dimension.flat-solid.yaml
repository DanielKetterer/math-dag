id: shapes.dimension.flat-solid
concept: shapes
facet: core
level: 1
type: concept
name: Tell flat shapes from solid shapes
statement: A two-dimensional shape is flat, lying in a plane like a drawing on paper; a three-dimensional
  shape is solid, with thickness in every direction like a ball or a box.
assess: 'Sort these into flat and solid: a triangle drawn on paper, a ball, a square drawn on paper, a
  cereal box, a soup can, a circle drawn on paper.'
sources:
  ccss:
  - K.G.A.3
  learning_components:
  - dc883171
  - 9eae2bea
requires: []
root_reason: Telling a drawing on paper from a ball or box is a perceptual distinction made by handling
  objects and needs no earlier skill in the map.
status: proposed
