id: shapes.decompose.simple
concept: shapes
facet: composition
level: 1
type: procedure
name: Take a shape apart into smaller shapes
statement: Show how a shape can be made of smaller shapes by covering it with smaller pieces or naming
  the smaller shapes it splits into, when the shape gives clear clues such as a drawn line or an obvious
  split.
assess: Show a square with one diagonal drawn. 'This square is made of two smaller shapes. What shapes
  are they? Show me with your blocks.' Credit 'two triangles' shown with two triangle pieces covering
  the square.
sources:
  ccss: []
  learning_components: []
  prek:
  - cs.compshape.pre-decomposer
  - cs.compshape.simple-decomposer
requires:
- clause: via-fill-outline
  all_of:
  - node: shapes.compose.fill-outline
    relation: procedural
    points_to: statement
    why: Covering a shape with smaller pieces along a drawn line is filling an outline whose inner pieces
      are marked.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Covering a shape along drawn lines is one of the two ways the statement allows.
        | other route: Name the smaller shapes from the drawn line without covering, which needs recognizing
        them (shapes.recognize).'
    status: disputed
- clause: via-recognize
  all_of:
  - node: shapes.recognize
    relation: definitional
    points_to: statement
    why: Naming the smaller shapes, such as two triangles in a square cut on its diagonal, requires recognizing
      a shape in an unusual size or turn.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Recognizing the pieces is needed for the naming route only. | other route: Cover
        the shape with smaller pieces (shapes.compose.fill-outline) and show it, with no naming of the
        parts.'
    status: disputed
status: proposed
