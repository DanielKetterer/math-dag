id: shapes.name.real-objects
concept: shapes
facet: core
level: 1
type: representation
name: Name the shape of an everyday object
statement: Name the shape an everyday object has, ignoring its material, color and small details, using
  a solid name for its form (a can is a cylinder) or a flat shape name for a face or outline (the front
  of a door is a rectangle).
assess: 'Point to each object and name its shape: a ball, a soup can, the front of a door, a party hat,
  a block.'
sources:
  ccss:
  - K.G.A.1
  learning_components:
  - 3938ec14
requires:
- clause: standard
  all_of:
  - node: shapes.name.solids
    relation: definitional
    points_to: statement
    why: The statement names the solid form of an object, such as calling a can a cylinder or a ball a
      sphere, using the solid names.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.name.any-orientation
    relation: definitional
    points_to: statement
    why: The statement names the flat shape of a face or outline, such as the front of a door as a rectangle,
      using the flat shape names.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.dimension.flat-solid
    relation: definitional
    points_to: statement
    why: Choosing a solid name for the whole form but a flat name for a face requires telling the solid
      from the flat shape on it.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
