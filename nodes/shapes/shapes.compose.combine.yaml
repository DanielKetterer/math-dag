id: shapes.compose.combine
concept: shapes
facet: composition
level: 1
type: procedure
name: Put shapes together to make a larger shape
statement: Put two or more shapes together, edge to edge without gaps or overlaps, to make a larger shape
  or region whose inside lines are not drawn.
assess: Give the child pattern blocks and an outline of a large hexagon with no inside lines. 'Fill this
  shape with blocks.' Credit the outline filled with no gaps or overlaps, for example by two trapezoids
  or six triangles.
sources:
  ccss:
  - K.G.B.6
  learning_components: []
  prek:
  - cs.compshape.picture-maker
  - cs.compshape.shape-composer
  - elof.p-math-9
requires:
- clause: standard
  all_of:
  - node: shapes.compose.fill-outline
    relation: procedural
    points_to: statement
    why: Combining shapes to fill an outline uses the same choosing and placing of pieces as the puzzle
      with every piece drawn, with the dividing lines removed.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: spatial.motion.turn-flip
    relation: procedural
    points_to: assess
    why: The test fills the hexagon outline with pattern blocks, and pieces must be turned or flipped
      until they sit edge to edge without gaps or overlaps.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
