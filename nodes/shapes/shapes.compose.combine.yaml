id: shapes.compose.combine
concept: shapes
facet: composition
level: 1
type: procedure
name: Put shapes together to make a larger shape
statement: Put two or more shapes together, edge to edge without gaps or overlaps, to make a larger shape
  or region whose inside lines are not drawn.
assess: Give the child pattern blocks and an outline of a large hexagon with no inside lines. 'Fill this
  shape with blocks.' Credit the outline filled with no gaps or overlaps, for example by two trapezoids
  or six triangles.
sources:
  ccss:
  - K.G.B.6
  learning_components: []
  prek:
  - cs.compshape.picture-maker
  - cs.compshape.shape-composer
  - elof.p-math-9
requires:
- clause: standard
  all_of:
  - node: spatial.motion.turn-flip
    relation: procedural
    points_to: assess
    why: The test fills the hexagon outline with pattern blocks, and pieces must be turned or flipped
      until they sit edge to edge without gaps or overlaps.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A28 keep: KEEP, task-scoped: Turning pieces may be necessary for the particular hexagon puzzle,
        but it should not become a universal prerequisite for shape composition.'
    status: reviewed
related:
- node: shapes.compose.fill-outline
  relation: common_path
  note: 'Common path, not required (A34): REJECT as universal; retain as a route: Filling an outlined
    puzzle is a useful precursor, but shapes can also be composed by exploring how pieces fit together
    without internal guide lines.'
status: proposed
