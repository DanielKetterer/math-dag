id: shapes.compose.from-sides
concept: shapes
facet: composition
level: 1
type: procedure
name: Build a shape from sticks for its sides
statement: Build a model of a named shape by laying straight pieces such as sticks end to end as its sides,
  so that the pieces meet at the corners and the figure looks like the goal shape.
assess: Give the child 6 craft sticks. 'Make a triangle with these sticks.' Credit a closed figure of
  three sticks meeting end to end.
sources:
  ccss:
  - K.G.B.5
  learning_components: []
  prek:
  - cs.shapes.constructor-looks-like
  - elof.p-math-9
requires:
- clause: standard
  all_of:
  - node: shapes.sides.count
    relation: definitional
    points_to: statement
    why: Each stick stands for one side of the shape, so the learner must know a shape's sides are straight
      segments and how many it has.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.name.prototype
    relation: definitional
    points_to: statement
    why: The learner must know what a triangle, square or circle looks like to judge that the built figure
      looks like the named goal shape.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: comparing.size.direct
    relation: definitional
    points_to: statement
    why: If squares and rectangles are in scope, sticks must be chosen to be equal or paired lengths;
      the triangle test does not need it.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
