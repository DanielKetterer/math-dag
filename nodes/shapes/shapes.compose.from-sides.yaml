id: shapes.compose.from-sides
concept: shapes
facet: composition
level: 1
type: procedure
name: Build a shape from sticks for its sides
statement: Build a model of a named shape by laying straight pieces such as sticks end to end as its sides,
  so that the pieces meet at the corners and the figure looks like the goal shape.
assess: Give the child 6 craft sticks. 'Make a triangle with these sticks.' Credit a closed figure of
  three sticks meeting end to end.
sources:
  ccss:
  - K.G.B.5
  learning_components: []
  prek:
  - cs.shapes.constructor-looks-like
  - elof.p-math-9
requires:
- clause: standard
  all_of:
  - node: shapes.name.receptive
    relation: definitional
    points_to: statement
    why: The test says 'Make a triangle', so the learner must know which figure the word triangle names,
      at least receptively, to aim the build at that shape.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A25 replace: REJECT: A child can construct a requested shape using a model or receptive understanding
        of its name without first being able to name typical circles, squares, and triangles.'
    status: reviewed
status: proposed
