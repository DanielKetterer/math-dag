id: shapes.closed-boundary
concept: shapes
facet: properties
level: 1
type: concept
name: A shape's boundary closes with no gaps
statement: A flat shape such as a triangle or a square is bounded by a line that goes all the way around
  and meets itself; a figure whose boundary has a gap is not that shape.
assess: 'Show 6 drawings of fences: three closed triangles and squares, and the same three figures each
  with a small gap in one side or corner. ''Which fences have no gap, so the sheep inside cannot get out?''
  Credit all and only the three closed figures.'
