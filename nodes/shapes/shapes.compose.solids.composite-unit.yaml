id: shapes.compose.solids.composite-unit
concept: shapes
facet: composition
level: 1
type: procedure
name: Use a composite solid as a unit to make a new solid
statement: Build a composite solid, then treat it as a single piece and join copies of it to make a new,
  larger solid.
procedure:
- Join solids face to face to make a composite solid.
- Keep the composite together so it acts as one piece.
- Join copies of the composite face to face to make the new solid.
assess: Stack two cubes to make a tower. Now use two of those towers to build a box that is 2 cubes tall
  and 2 cubes long.
