id: shapes.quadrilateral.subcategories-included
concept: shapes
facet: category
level: 2
type: concept
name: Rhombuses, rectangles, and squares are quadrilaterals
statement: Rhombuses, rectangles, and squares are all quadrilaterals, because each is a closed figure
  with four straight sides; a shape keeps its more specific name and also belongs to the category quadrilateral.
assess: Is a square a quadrilateral? Is a rhombus? Is a rectangle? Name the attribute that decides it.
sources:
  ccss:
  - 3.G.A.1
  learning_components:
  - 1bc66a86
  - 99b171db
  - c683d6c7
requires:
- clause: standard
  all_of:
  - node: shapes.rectangle.define
    relation: definitional
    points_to: statement
    why: The statement applies the definition of a rectangle to show it is a closed figure with four straight
      sides.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.rhombus.define
    relation: definitional
    points_to: statement
    why: The statement applies the definition of a rhombus to show it is a closed figure with four straight
      sides.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.name.any-orientation
    relation: definitional
    points_to: statement
    why: The statement says squares are quadrilaterals, so the learner must know which figures, in any
      orientation, are called squares.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A25 replace: Daniel: a learner can establish that squares are quadrilaterals by counting
        four sides without the full definition of a square. Claude: the node still has to know which figures
        are called squares, so the edge points at naming them.'
    status: reviewed
  - node: shapes.quadrilateral.recognize
    relation: definitional
    points_to: statement
    why: The attribute that decides membership is exactly four straight sides, which defines a quadrilateral
      of any shape.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.category.defined-by-attribute
    relation: definitional
    points_to: statement
    why: A shape that has the category attribute belongs to the category while keeping its own more specific
      name.
    evidence:
    - kind: content
      source: pass-P
