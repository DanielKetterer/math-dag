    relation: procedural
    points_to: procedure.1
    why: Step 1 places as many dots as the stated number, which is counting out a set of a given size.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.closed-boundary
    relation: procedural
    points_to: procedure.3
    why: Step 3 joins the last dot to the first so that the shape is closed.
    evidence:
