name: Pick out the shape that is named
statement: When the name circle, square, or triangle is said, pick out a typical example of that shape
  from a set of shapes.
assess: Lay out a typical circle, square, triangle, and rectangle, each resting on a side. 'Show me the
  triangle.' Repeat for the circle and the square. Credit the correct shape each time.
