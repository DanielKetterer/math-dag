id: shapes.compare.by-attributes
concept: shapes
facet: properties
level: 1
type: procedure
name: Compare two flat shapes by their parts and attributes
statement: Say how two flat shapes are alike and how they differ by their parts (number of sides and corners)
  and attributes (equal sides, straight or curved sides), not by size or orientation.
procedure:
- Count the sides and the corners of each shape.
- Check other attributes of each shape, such as whether its sides are equal and whether they are straight
  or curved.
- Name the parts and attributes the two shapes share and those they do not, ignoring size and orientation.
assess: Here are a large square and a small rectangle lying on its long side. Tell one way they are alike
  and one way they are different, without talking about size.
