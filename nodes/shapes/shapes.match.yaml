id: shapes.match
concept: shapes
facet: core
level: 1
type: concept
name: Match shapes that are the same shape
statement: Pick, from several shapes, the one that is the same shape as a given shape, including when
  the two differ in size or orientation.
assess: 'Show a small triangle pointing up. From a tray holding a large triangle turned on its side, a
  large square, a small circle, and a rectangle: ''Find the one that is the same shape as this one.''
  Credit the turned large triangle.'
sources:
  ccss: []
  learning_components: []
  prek:
  - cs.shapes.matcher
  - cs.shapes.matcher-more
requires: []
root_reason: Picking the shape that is the same as a given shape, despite size or orientation, rests on
  visual perception of form and needs no earlier skill in this map.
related:
- node: classifying.alike
  relation: generalizes
  note: Judging two things alike in some respect is the general ability; identity and shape matching are
    earlier-appearing special cases and do not require a general classification skill.
status: proposed
