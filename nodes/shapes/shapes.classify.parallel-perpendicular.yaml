id: shapes.classify.parallel-perpendicular
concept: shapes
facet: properties
level: 2
type: procedure
name: Sort figures by parallel or perpendicular sides
statement: Sort two-dimensional figures by whether they have at least one pair of parallel sides, or by
  whether they have at least one pair of perpendicular sides.
procedure:
- For each figure, check each pair of sides for the named relationship.
- Put the figures with at least one such pair in one group and the figures with none in the other.
assess: 'Sort these six figures into two groups: those with at least one pair of perpendicular sides and
  those with none.'
sources:
