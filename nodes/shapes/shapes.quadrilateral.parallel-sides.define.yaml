id: shapes.quadrilateral.parallel-sides.define
concept: shapes
facet: properties
level: 2
type: concept
name: Trapezoids and parallelograms by pairs of parallel sides
statement: A trapezoid is a quadrilateral with at least one pair of parallel sides; a parallelogram is
  a quadrilateral with two pairs of parallel sides.
assess: Quadrilateral A has exactly one pair of parallel sides, B has two pairs, and C has none. Which
  of A, B, and C are trapezoids? Which are parallelograms?
