id: shapes.quadrilateral.draw-other
concept: shapes
facet: properties
level: 2
type: procedure
name: Draw a quadrilateral that is not a rhombus, rectangle, or square
statement: Draw a quadrilateral whose sides are not all the same length and whose angles are not all right
  angles, so it fits none of the definitions of rhombus, rectangle, or square.
procedure:
- Draw four straight sides that close into a figure.
- Make at least two of the sides different in length, so it is not a rhombus or a square.
- Make at least one angle that is not a right angle, so it is not a rectangle or a square.
- Check the figure against each of the three definitions.
assess: Draw a quadrilateral that is not a rhombus, not a rectangle, and not a square. Say why it is none
  of them.
sources:
  ccss:
  - 3.G.A.1
  learning_components:
  - 0547ded3
requires:
- clause: standard
  all_of:
  - node: shapes.draw.specified-attributes
    relation: procedural
    points_to: procedure.1
    why: Step 1 requires drawing a closed shape with four straight sides, a shape with a given number
      of sides.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.rhombus.define
    relation: procedural
    points_to: procedure.2
    why: Step 2 makes two sides unequal so that the figure fails the equal-sides condition of a rhombus.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
