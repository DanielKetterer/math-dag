id: shapes.compose.composite-unit
concept: shapes
facet: composition
level: 1
type: procedure
name: Use a composite flat shape as a unit to make a new shape
statement: Make a composite shape from flat shapes, then treat the composite as a single piece and put
  copies of it together to make a new, larger shape.
procedure:
- Put flat shapes together, full sides touching, to make a composite shape.
- Keep the composite together (or trace it) so it acts as one piece.
- Put copies of the composite together, full sides touching, to make the new shape.
assess: Put two triangles together to make a square. Now use four of those two-triangle squares to make
  a bigger square.
