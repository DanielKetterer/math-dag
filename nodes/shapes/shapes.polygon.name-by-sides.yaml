id: shapes.polygon.name-by-sides
concept: shapes
facet: properties
level: 2
type: representation
name: Name a polygon as a triangle, quadrilateral, pentagon or hexagon
statement: A closed figure with straight sides is a triangle, quadrilateral, pentagon or hexagon according
  to whether it has 3, 4, 5 or 6 sides, whatever its side lengths, corners or orientation.
assess: 'Name each shape as a triangle, quadrilateral, pentagon or hexagon: an arrowhead shape with 4
  sides, a house shape with 5 sides, a hexagon with unequal sides, a tilted triangle with all sides different,
  a long thin rectangle.'
