name: Color, size and orientation do not decide a shape's name
statement: Color, overall size, orientation and material are not defining attributes; changing them never
  changes which kind of shape a figure is.
assess: Mia says this big triangle is not a triangle because it is upside down and very big. Is she right?
  Why?
