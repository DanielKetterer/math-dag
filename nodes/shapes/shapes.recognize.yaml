id: shapes.recognize
concept: shapes
facet: core
level: 1
type: concept
name: Recognize a shape whatever its size or orientation
statement: Recognize every example of a familiar shape class, such as triangles, squares, rectangles,
  and circles, as that shape, whatever its size, orientation, or proportions, and reject figures that
  only resemble it.
assess: On a sheet with 12 figures (long thin triangles, a triangle standing on a vertex, a tilted square,
  an oval, a triangle with a curved side, an open three-sided figure), 'Color every triangle.' Credit
  all and only the true triangles colored.
sources:
  ccss:
  - K.G.A.2
  learning_components: []
  prek:
  - elof.p-math-9
  - cs.shapes.recognizer-cst
  - cs.shapes.recognizer-rectangles
  - cs.shapes.recognizer
requires:
- clause: standard
  all_of:
  - node: shapes.name.receptive
    relation: definitional
    points_to: statement
    why: The test asks the child to color every triangle, which needs the word triangle understood receptively,
      not spoken, so receptive shape names replace the spoken-naming node.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A39 replace: REJECT as universal: Knowing names for typical shapes does not guarantee recognition
        of rotated or atypical examples; varied labelled examples and non-examples provide another route.'
    status: reviewed
  - node: shapes.closed-boundary
    relation: definitional
    points_to: statement
    why: Rejecting the open three-sided figure requires the notion of a closed figure, which shapes.sides.count
      (straight segments) does not cover.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'D51 require: Required on every route (Daniel, 2026-10-19): refusing the open three-sided
        figure is knowing that a shape''s boundary closes, whatever the route. | Daniel: KEEP; add shapes.closed-boundary:
        The assessment includes an open three-sided figure, and counting straight sides alone does not
        establish that a shape boundary is closed.'
    status: reviewed
related:
- node: shapes.match
  relation: common_path
  note: 'Common path, not required (A17): REJECT as universal; retain as a route: Matching figures is
    useful, but children can learn shape classes across orientations from varied examples and non-examples.'
- node: shapes.sides.count
  relation: common_path
  note: 'Common path, not required: route ''via-count'' needed everything another route needs and more,
    so it was removed.'
status: proposed
