id: cardinality.conservation
concept: cardinality
facet: core
level: 1
type: concept
name: Spreading out or pushing together does not change how many
statement: Moving the objects of a collection closer together or farther apart, without adding or removing
  any, does not change how many objects there are.
assess: Lay out two rows of 6 counters, matched one to one, and the child agrees the rows have the same
  number. While the child watches, spread one row out so it is longer. 'Does one row have more now, or
  do they have the same number?' Credit 'the same', given without counting.
sources:
  ccss: []
  learning_components: []
  other:
  - 'Review item A35 (pre-K, 2026-10-19): split from counting.cardinal.order-irrelevance'
  - Piaget's number conservation task
requires:
- clause: by-matching
  all_of:
  - node: comparing.count.matching
    relation: definitional
    points_to: assess
    why: The test starts from two rows matched one to one, and the child must see that matching shows
      the same number.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Matching only sets up the starting agreement that the rows are equal. The idea
        that moving objects without adding or removing leaves the number unchanged does not need matching,
        and the starting equality could be set up by counting.'
    - kind: review
      source: DK
      note: 'A2, A9, D27, D28 set_routes: The test needs the initial equality of the rows; matching, counting
        each row, or seeing two small equal sets each gives it (Daniel D27, D28: task routes). ''More''
        as number stays task-scoped on every route (A9).'
    status: reviewed
  - node: comparing.more-than
    relation: definitional
    points_to: assess
    why: The test question asks whether one row has more now, so the child must take 'more' to mean number,
      not length.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: The word ''more'' appears in the test question, but the conservation idea is about
        how many, not the meaning of ''more''; the question could be asked as ''same number or different
        number?''.'
    - kind: review
      source: DK
      note: 'A2, A9, D27, D28 set_routes: The test needs the initial equality of the rows; matching, counting
        each row, or seeing two small equal sets each gives it (Daniel D27, D28: task routes). ''More''
        as number stays task-scoped on every route (A9).'
    status: reviewed
