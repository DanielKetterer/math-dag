- node: counting.cardinal.order-irrelevance
  relation: same_idea_different_form
  note: Order and arrangement irrelevance of a count is essentially the same invariance as conservation,
    seen from the counting side. Neither is a prerequisite of the other; conservation is assessed here
    without counting.
