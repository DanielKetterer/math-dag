      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.subtraction.like-denominators
    relation: procedural
    points_to: statement
    why: Subtracting fractional measurements read from one scale is subtracting fractions with like denominators.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.subtraction.comparison
    relation: definitional
    points_to: assess
    why: The test problem asks how much longer the longest insect is than the shortest, a comparison subtraction.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem''s ''how much longer'' framing is a comparison subtraction;
        the statement just says subtract measurements, covered by like-denominator subtraction.'
    status: proposed
  - node: data.line-plot.make
    relation: definitional
