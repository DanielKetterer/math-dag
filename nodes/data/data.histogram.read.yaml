id: data.histogram.read
concept: data
facet: histogram
level: 2
type: representation
name: Read interval counts from a histogram
statement: Each bar of a histogram gives how many data values lie in its interval; a histogram does not
  show the individual values, so exact values cannot be read from it.
assess: A histogram of ages has a bar of height 3 over 10 to under 20, a bar of height 5 over 20 to under
  30, and a bar of height 2 over 30 to under 40. How many people are 20 to under 30 years old? Can you
  tell from the histogram how many people are exactly 25?
