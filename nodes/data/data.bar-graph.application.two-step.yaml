    relation: procedural
    points_to: statement
    why: The second step compares one total with another category, which is the one-step how-many-more
      comparison from the graph.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.within-100
    relation: procedural
    points_to: statement
    why: The first step combines two category values from the graph, such as 25 plus 15.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
