id: data.dot-plot.read
concept: data
facet: line-plot
level: 2
type: representation
name: Read the data set from a dot plot
statement: A dot plot (line plot) shows a numerical data set on a number line with one dot above a value
  for each time the value occurs, so the full list of values can be read back from it.
assess: A dot plot on a number line from 0 to 6 has 2 dots above 1, 1 dot above 3, and 3 dots above 4.
  List every value in the data set.
