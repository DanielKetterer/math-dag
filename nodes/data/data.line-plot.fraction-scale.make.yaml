id: data.line-plot.fraction-scale.make
concept: data
facet: line-plot
level: 2
type: representation
name: Make a line plot of measurements in halves, fourths, and eighths
statement: A data set of measurements in halves, fourths, or eighths of a unit is shown by marking a number
  line in the finest of those parts and placing one X above the point for each measurement.
procedure:
- Draw a number line from at or below the least value to at or above the greatest value.
- Partition each whole unit into the finest part used in the data (halves, fourths, or eighths) and label
  the marks.
- Place one X above the mark for each measurement, stacking Xs for repeated values.
assess: 'Make a line plot of these pencil lengths, in inches: 5 1/2, 5 3/4, 6, 5 3/4, 5 1/8, 6 1/4, 5
  1/2.'
