id: data.bar-graph.put-together
concept: data
facet: categorical
level: 2
type: application
name: Solve put-together problems using a bar graph
statement: A one-step put-together problem asks for the combined count of categories shown in a bar graph
  with a single-unit scale; the learner reads the needed counts and finds the total.
assess: A bar graph with a scale by ones shows Red 7, Blue 5 and Green 9. How many children chose red
  or blue?
