id: data.table-graph.read-values
concept: data
facet: paired-values
level: 2
type: representation
name: Read paired values from a table or a graph
statement: When pairs of values of two quantities are shown, the value of the second quantity that goes
  with a given value of the first is read in the same row of a table, or at the point of the graph above
  that value on the horizontal axis.
assess: A table shows hours 1, 2, 3, 4 and miles 6, 12, 18, 24. How many miles go with 3 hours? On a graph
  of the same pairs, what is the y-value of the point above x = 4?
sources:
