id: data.observations.count
concept: data
facet: measurement
level: 2
type: concept
name: The number of observations in a data set
statement: The number of observations in a data set is the number of values recorded, one for each individual
  measured, so a value that occurs several times is counted each time it occurs.
assess: 'Students reported how many pets they own: 0, 1, 0, 2, 0, 1, 5, 0, 1. Ana says there are 4 observations
  because there are 4 different values. How many observations are there, and what does each one record?'
