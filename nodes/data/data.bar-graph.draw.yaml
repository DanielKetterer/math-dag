id: data.bar-graph.draw
concept: data
facet: categorical
level: 2
type: representation
name: Draw a bar graph with a single-unit scale
statement: 'A data set with up to four categories is shown as a bar graph on a scale marked in ones from
  0: one labeled bar for each category, starting at 0 and ending level with the scale number equal to
  that category''s count, with a title.'
assess: 'On this grid with a scale from 0 to 10 marked by ones, draw a bar graph of this pet data: Cats
  3, Dogs 5, Fish 2, Birds 4.'
