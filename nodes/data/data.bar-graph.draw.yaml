    relation: representational
    points_to: statement
    why: The scale in ones from 0 is a number line of lengths from 0, and each bar ends level with the
      scale number equal to its count.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: data.bar-graph.read
    relation: representational
    points_to: statement
    why: A bar must end level with the scale number equal to the count, which is the same reading convention
      used to read bars.
    evidence:
