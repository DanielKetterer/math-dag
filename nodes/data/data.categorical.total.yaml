id: data.categorical.total
concept: data
facet: categorical
level: 2
type: application
name: Find the total number of data points in a chart
statement: A question asks how many data points there are in all in a data set with up to three categories;
  the answer combines the counts of all the categories.
assess: A chart shows that 4 children chose apple, 2 chose banana and 6 chose grape. How many children
  answered in all?
