id: data.line-plot.fractional.make
concept: data
facet: line-plot
level: 2
type: representation
name: Make a line plot of measurements in halves and fourths
statement: 'Show a set of measurements as a line plot: a number line whose scale is marked in whole numbers,
  halves, or fourths, with one mark (such as an X) above the scale for each measurement.'
procedure:
- Choose a scale unit (whole, half, or fourth) that every measurement lands on.
- Draw a number line covering the smallest to the largest measurement, marked in that unit.
- Put one X above the matching point for each measurement.
assess: 'Pencil lengths in inches: 2 1/4, 2 1/2, 2 1/2, 3, 2 3/4, 2 1/2, 2 1/4, 3. Make a line plot of
  these lengths with the scale marked in fourths of an inch.'
