id: data.categorical.organize
concept: data
facet: categorical
level: 2
type: representation
name: Organize data with up to three categories in a chart
statement: A list of data points falling into up to three categories is recorded in a tally chart or table
  with one row for each category, one mark for each data point in its category's row, and the count for
  each category.
assess: 'Children named their favorite fruit: apple, banana, apple, grape, apple, banana, grape, apple.
  Make a tally chart with one row for each fruit.'
sources:
  ccss:
  - 1.MD.C.4
  learning_components:
  - 8676d43c
requires:
- clause: standard
  all_of:
  - node: classifying.sort.given-attribute
    relation: procedural
    points_to: statement
    why: Each data point is placed in the row for its category, such as apple or banana, by the attribute
      it has.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: numeral.informal-record
    relation: representational
    points_to: statement
    why: A tally chart records each data point as one mark in its category's row, a mark standing for
      one object.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: data.categorical.count-each
    relation: procedural
    points_to: statement
    why: The chart ends with the count for each category, found by counting the marks in each row.
    evidence:
    - kind: content
      source: pass-P
