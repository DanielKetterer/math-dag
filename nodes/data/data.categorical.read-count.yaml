id: data.categorical.read-count
concept: data
facet: categorical
level: 2
type: representation
name: Read the count of a category from a chart or picture graph
statement: The number of data points in one category is read from a tally chart, table, or picture graph
  with one mark or picture per data point.
assess: A tally chart shows Apple with 4 tallies, Banana with 2 tallies and Grape with 6 tallies. How
  many children chose grape?
