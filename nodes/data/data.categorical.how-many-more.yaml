id: data.categorical.how-many-more
concept: data
facet: categorical
level: 2
type: application
name: Find how many more or fewer are in one category than another
statement: A question asks how many more or how many fewer data points one category has than another,
  in a data set with up to three categories; the answer is the difference of the two category counts.
assess: A chart shows that 4 children chose apple, 2 chose banana and 6 chose grape. How many more children
  chose grape than banana?
