id: number-composition.make-ten.find
concept: number-composition
facet: part-whole
level: 1
type: procedure
name: Find the number that makes 10 with a given number
statement: For a number n from 1 to 9, the partner that makes 10 is the number of objects that must be
  added to n objects to have 10, shown for example by the empty spaces of a ten frame.
procedure:
- Show n objects, for example in a ten frame.
- Add objects one at a time, or look at the empty spaces, until there are 10.
- The number of objects added is the partner of n.
assess: This ten frame has 6 dots. How many more dots are needed to make 10?
