id: number-composition.part-whole.inexact
concept: number-composition
facet: part-whole
level: 1
type: concept
name: A whole is more than either of its parts
statement: When two nonempty sets are put together, the combined set has more objects than either set
  alone, and splitting a set gives parts that each have fewer objects than the whole.
assess: 'Show a group of 4 red blocks and a group of 3 blue blocks, then push them together. Point to
  the red group in a separate identical picture: ''Are there more blocks all together, or more red blocks?''
  Credit ''more all together'' without the child needing to give either number.'
sources:
  ccss: []
  learning_components: []
  prek:
  - cs.compose.pre-part-whole
  - cs.compose.inexact-part-whole
requires:
- clause: via-perceptual
  all_of:
  - node: quantity.more-than
    relation: definitional
    points_to: statement
    why: The target states the whole has more than a part, which presupposes the notion of more.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: comparing.count.perceptual
    relation: definitional
    points_to: statement
    why: The claim that the combined set has more than either part uses the idea of one collection having
      more than another.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: The node needs the notion of ''has more'', not the perceptual skill, which only
        works when one set is about twice the other; the test sets (7 and 4) are not. | other route: Ground
        ''has more'' by matching, counting, or direct containment reasoning instead.'
    status: disputed
- clause: via-matching
  all_of:
  - node: quantity.more-than
    relation: definitional
    points_to: statement
    why: The target states the whole has more than a part, which presupposes the notion of more.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: comparing.count.matching
    relation: justificatory
    points_to: statement
    why: The whole has more than a part because the part pairs off with some of the whole, leaving the
      other part unpaired.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: This is a justification of why the whole exceeds the part; the target is a level
        1 concept and does not require it. Matching is one way of grounding ''has more''. | other route:
        Containment reasoning (the whole includes the part and more), or grounding ''more'' by counting
        or perceptual comparison.'
    status: disputed
status: proposed
