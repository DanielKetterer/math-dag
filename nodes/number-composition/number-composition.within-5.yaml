id: number-composition.within-5
concept: number-composition
facet: part-whole
level: 1
type: fact
name: Know the parts of numbers within 5
statement: For any whole number up to 5, quickly name the missing part when the whole and one part are
  known, or the whole when both parts are known, without counting.
assess: Show 5 counters, then hide some under a cup so 2 remain visible. 'There were 5. How many are hiding
  under the cup?' Credit 3 given quickly without lifting the cup.
sources:
  ccss:
  - K.OA.A.3
  - K.OA.A.5
  learning_components: []
  prek:
  - cs.compose.composer-4-5
requires:
- clause: via-count-all
  all_of:
  - node: number-composition.part-whole.inexact
    relation: definitional
    points_to: statement
    why: Naming a missing part or the whole depends on seeing a number as a whole made of parts, each
      smaller than the whole.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A22 keep: KEEP, conceptually: Whole-part understanding is a sound basis for number composition,
        although known number bonds and visual patterns may provide alternative routes to particular facts.'
    status: reviewed
  - node: counting.cardinal.last-word
    relation: definitional
    points_to: statement
    why: The numbers two, three and five must each name an exact quantity before a learner can know which
      two quantities make five.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.add-to.count-all
    relation: definitional
    points_to: statement
    why: The whole of two known parts is the total of the two joined sets, which the join-and-count procedure
      finds.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Joining and counting is one way a learner comes to know the whole of two parts;
        the target is a no-counting fact. | other route: Learn the pairs by seeing small sets as arrangements
        of parts (finger, dice or dot patterns; subitizing.conceptual).'
    - kind: review
      source: DK
      note: 'D62 keep: REJECT as mandatory; retain as a route: Joining and counting all can teach number
        bonds, but the target asks for quick facts without counting and can be reached through structured
        patterns or memorized combinations.'
    status: reviewed
- clause: via-count-remaining
  all_of:
