    status: proposed
  - node: subtraction.take-away.count-remaining
    relation: definitional
    points_to: statement
    why: The missing part when the whole and one part are known is the amount left after removing that
      part.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Taking away and counting what is left is one way the missing part is found; the
        node is two facts (whole from parts, part from whole), and each can be reached another way. |
        other route: Find the missing part by thinking ''what joins with 2 to make 5'' via join-and-count-all
        (addition.add-to.count-all), or by pattern recognition of parts.'
    - kind: review
      source: DK
      note: 'D63 keep: REJECT as mandatory; retain as a route: Taking away and counting what remains can
        reveal a missing part, but reasoning about what completes a whole and recognizing number bonds
        are alternatives.'
    status: reviewed
