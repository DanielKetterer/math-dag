id: perpendicular.meaning
concept: perpendicular
facet: core
level: 2
type: concept
name: Perpendicular lines meet at right angles
statement: Two lines are perpendicular when they meet to form right angles; two segments or sides are
  perpendicular when the lines they lie on are perpendicular.
assess: In this trapezoid with two right angles, name every pair of sides that are perpendicular.
