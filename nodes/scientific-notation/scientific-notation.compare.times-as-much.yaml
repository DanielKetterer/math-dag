id: scientific-notation.compare.times-as-much
concept: scientific-notation
facet: core
level: 3
type: procedure
name: Find how many times as large one number written with a power of 10 is as another
statement: For positive numbers a x 10^m and b x 10^n, the first is (a divided by b) x 10^(m - n) times
  as large as the second.
procedure:
- 'Divide the leading factors: a divided by b.'
- 'Subtract the exponents: m - n.'
- Write the result as (a divided by b) x 10^(m - n) and state it as a number of times.
assess: How many times as large is 6 x 10^4 as 2 x 10^-3?
