id: scientific-notation.subtract.different-exponents
concept: scientific-notation
facet: core
level: 3
type: procedure
name: Subtract numbers in scientific notation with different powers of 10
statement: To subtract two numbers in scientific notation with different powers of 10, rewrite one so
  both have the same power of 10, then subtract the leading factors.
procedure:
- Rewrite the number with the smaller exponent to have the larger exponent, moving its decimal point one
  place left for each 1 added to the exponent.
- Subtract the leading factors and keep the common power of 10.
- If needed, rewrite the result in scientific notation.
assess: Find 7.2 x 10^-3 - 5 x 10^-4. Give the answer in scientific notation.
