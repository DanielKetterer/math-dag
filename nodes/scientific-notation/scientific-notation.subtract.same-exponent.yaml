id: scientific-notation.subtract.same-exponent
concept: scientific-notation
facet: core
level: 3
type: procedure
name: Subtract numbers in scientific notation with the same power of 10
statement: '(a x 10^n) - (b x 10^n) = (a - b) x 10^n: subtract the leading factors and keep the power
  of 10.'
procedure:
- Subtract the leading factors.
- Keep the common power of 10.
- If the new leading factor is less than 1, rewrite the result in scientific notation.
assess: Find 8.6 x 10^-4 - 2.3 x 10^-4. Give the answer in scientific notation.
