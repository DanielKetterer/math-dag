id: scientific-notation.units.choose
concept: scientific-notation
facet: core
level: 3
type: procedure
name: Choose a unit of suitable size for a very large or very small measurement
statement: Given a very large or very small measurement in scientific notation and a set of metric units,
  choose the unit that makes its measure a number from 1 to 1000, and rewrite the measurement in that
  unit using powers of 10.
procedure:
- Write the size of each offered unit as a power of 10 times the given unit.
- For each unit, divide the measurement by that power of 10 and find the unit that gives a number from
  1 to 1000.
- Write the measurement in that unit.
assess: 'The Atlantic seafloor widens by about 2.5 x 10^-5 kilometers each year. Which unit makes this
  rate a number from 1 to 1000: kilometers, meters, or millimeters per year? Give the rate in that unit.'
sources:
  ccss:
  - 8.EE.A.4
  learning_components:
  - dc8db438
