id: scientific-notation.estimate.small
concept: scientific-notation
facet: core
level: 3
type: procedure
name: Estimate a small number as a single digit times a power of 10
statement: Estimate a positive number less than 1 as d x 10^n, with d a single digit from 1 to 9 and n
  a negative integer, by rounding the number to the place of its first nonzero digit.
procedure:
- Round the number to the place of its first nonzero digit.
- Take that digit as d; if it is in the k-th decimal place, n = -k.
- Write d x 10^n.
assess: Estimate 0.000062 as a single digit times a power of 10.
