id: scientific-notation.from-decimal.large
concept: scientific-notation
facet: core
level: 3
type: representation
name: Write a number of 10 or more in scientific notation
statement: Write a number of 10 or more as a x 10^n, with a at least 1 and less than 10 and n a positive
  integer, by placing the decimal point just after the first nonzero digit and taking n as the number
  of places the point moved left.
procedure:
- Place the decimal point just after the first nonzero digit; the number formed is a.
- Count the places the decimal point moved to the left; that count is n.
- Write a x 10^n, dropping trailing zeros after the decimal point of a.
assess: Write 52,000,000 in scientific notation.
