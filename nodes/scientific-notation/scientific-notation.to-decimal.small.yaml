id: scientific-notation.to-decimal.small
concept: scientific-notation
facet: core
level: 3
type: representation
name: Write a number in scientific notation with a negative exponent as a decimal
statement: Write a x 10^-k, with k a positive whole number, as a decimal by moving the decimal point of
  a k places to the left, writing zeros in any empty places.
procedure:
- Move the decimal point of a k places to the left.
- Write a zero in each place passed that has no digit, and a 0 before the decimal point.
assess: Write 4.1 x 10^-3 as a decimal.
sources:
