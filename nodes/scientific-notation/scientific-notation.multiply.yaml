id: scientific-notation.multiply
concept: scientific-notation
facet: core
level: 3
type: procedure
name: Multiply numbers in scientific notation
statement: '(a x 10^m) x (b x 10^n) = (a x b) x 10^(m+n): multiply the leading factors and add the exponents.'
procedure:
- Multiply the leading factors.
- Add the exponents.
- If the new leading factor is 10 or more, rewrite the result in scientific notation.
assess: Find (2 x 10^3) x (4 x 10^-5). Give the answer in scientific notation.
