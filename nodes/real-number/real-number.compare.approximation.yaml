id: real-number.compare.approximation
concept: real-number
facet: decimal-expansion
level: 3
type: procedure
name: Compare irrational numbers with decimal bounds
statement: Compare two numbers, at least one irrational, by bounding each between decimals with more and
  more places until the two bounding intervals do not overlap; the number in the higher interval is greater.
procedure:
- Bound each number between two consecutive tenths.
- If the two intervals overlap, bound each between consecutive hundredths, and so on, until they do not
  overlap.
- The number whose interval lies to the right is the greater.
assess: Which is greater, sqrt(10) or pi? Use decimal bounds for each to decide.
sources:
