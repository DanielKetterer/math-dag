id: real-number.approximate.truncate
concept: real-number
facet: decimal-expansion
level: 3
type: procedure
name: Bound a number between truncations of its decimal expansion
statement: If t is the decimal expansion of a positive number x cut off after n decimal places, then t
  <= x <= t + 1/10^n, which bounds x between two decimals with n places.
procedure:
- Cut off the decimal expansion of x after n decimal places to get t.
- Add 1 in the last place kept to get t + 1/10^n.
- State that x lies between t and t + 1/10^n.
assess: pi = 3.14159... Between which two consecutive hundredths does pi lie?
