id: patterns.rule.unstated-features
concept: patterns
facet: rule
level: 2
type: concept
name: Identify a feature of a pattern not stated in its rule
statement: The terms produced by a rule can show regularities the rule does not state, such as alternating
  between odd and even, and such a feature can be noticed and explained from the rule.
assess: 'Start at 1 and use the rule "add 3": 1, 4, 7, 10, 13, ... What do you notice about odd and even
  numbers in this list? Explain why it will keep happening.'
sources:
  ccss:
  - 4.OA.C.5
  learning_components:
  - d76ac695
