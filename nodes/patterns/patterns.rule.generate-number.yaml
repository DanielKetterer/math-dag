id: patterns.rule.generate-number
concept: patterns
facet: rule
level: 2
type: procedure
name: Generate a number pattern from a given rule
statement: Given a starting number and a rule such as "add 3" or "multiply by 2", produce the terms of
  the sequence by applying the rule to each term to get the next.
procedure:
- Write the starting number as the first term.
- Apply the rule to the last term written to get the next term.
- Repeat until the asked-for number of terms is written.
assess: Start at 4 and use the rule "add 5". Write the first six terms.
sources:
