    relation: definitional
    points_to: statement
    why: 'The learner must read a two-way table: an entry is the sum of its row and column labels, and
      rows, columns and diagonals are lines of entries. data.graphs.read may or may not cover this.'
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
