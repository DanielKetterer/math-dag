id: patterns.numerical.relationship
concept: patterns
facet: numerical
level: 3
type: concept
name: Identify a relationship between corresponding terms
statement: Corresponding terms of two patterns can stand in a fixed relationship, such as each term of
  one being a fixed multiple of, or a fixed amount more than, the corresponding term of the other.
assess: Pattern A is 0, 3, 6, 9, 12 and Pattern B is 0, 6, 12, 18, 24. What is true of each B term compared
  with the A term in the same position?
