id: patterns.numerical.relationship.explain
concept: patterns
facet: numerical
level: 4
type: justification
name: Explain a relationship between corresponding terms from the rules
statement: 'A relationship between corresponding terms follows from the rules: if both patterns start
  at 0 and one adds a and the other adds n x a, then after k steps the terms are k x a and k x (n x a),
  so the second is always n times the first.'
assess: Pattern A starts at 0 and adds 3; Pattern B starts at 0 and adds 6. Explain why every B term is
  twice the A term in the same position, using the rules rather than the listed terms.
