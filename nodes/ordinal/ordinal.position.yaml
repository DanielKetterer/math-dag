id: ordinal.position
concept: ordinal
facet: core
level: 1
type: concept
name: Name a position in a line with ordinal words
statement: In a line of objects with a stated starting end, the ordinal words first, second, third, and
  so on through tenth name each object's position counting from that end.
assess: Line up 8 toy animals facing a toy barn. 'Which animal is fifth in line to go into the barn?'
  Then 'What place in line is the pig?' Credit the correct animal and the correct ordinal word.
sources:
  ccss: []
  learning_components: []
  prek:
  - cs.compare.ordinal-counter
requires:
- clause: standard
  all_of:
  - node: counting.sequence.recite
    relation: definitional
    points_to: statement
    why: The ordinal words first through tenth follow the count sequence, and finding the fifth animal
      means counting up to five in order.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A29 keep: Kept after review discussion 2026-10-19 (Daniel accepted the pushback): the ordinal
        words fifth to tenth are built from the counting words and finding the fifth counts to five (item
        36); reciting is not sufficient, but it is necessary. | Daniel: REJECT: Reciting cardinal number
        words is not the same as knowing ordinal words such as first and fifth; those labels need their
        own representation.'
    status: reviewed
  - node: counting.one-to-one
    relation: definitional
    points_to: statement
    why: Naming an object's place means counting from the stated end and pairing exactly one word with
      each animal passed, such as the pig.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A36 keep: KEEP: Finding an ordinal position by counting along a line requires tracking one
        number word per object passed.'
    status: reviewed
status: proposed
