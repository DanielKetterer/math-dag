id: operations.application.reasonableness
concept: operations
facet: whole-number
level: 2
type: justification
name: Judge whether the answer to a multi-step word problem is reasonable by estimating
statement: An answer to a multi-step whole-number word problem is judged reasonable or not by estimating
  the answer with rounded numbers or mental computation and comparing.
assess: Lee says 4 boxes of 198 nails, minus 305 nails used, leaves 1,097 nails. Without computing exactly,
  use rounding to decide whether his answer is reasonable, and explain.
