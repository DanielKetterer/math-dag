id: operations.application.multistep.equation
concept: operations
facet: whole-number
level: 3
type: representation
name: Represent a multi-step word problem with an equation using a letter for the unknown
statement: A multi-step story problem with whole numbers is written as one equation in which a letter
  stands for the unknown quantity and the operations appear in the order the story requires.
assess: Mia buys 3 packs of 12 cards and gives away 9 cards. Write one equation, using the letter c for
  the number of cards she has left. Do not solve it.
