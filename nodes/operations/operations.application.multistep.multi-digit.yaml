id: operations.application.multistep.multi-digit
concept: operations
facet: whole-number
level: 2
type: application
name: Solve multistep story problems with multi-digit numbers
statement: A story problem needs two or more steps, each an addition, subtraction, multiplication or division
  of whole numbers, with multi-digit numbers (products and dividends beyond the facts) and a whole-number
  answer with no remainder; the learner chooses and carries out the steps.
assess: A school buys 4 boxes of 125 pencils and gives out 290 of them. How many pencils are left?
