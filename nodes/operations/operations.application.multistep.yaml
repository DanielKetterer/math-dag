id: operations.application.multistep
concept: operations
facet: whole-number
level: 2
type: application
name: Solve two-step story problems with the four operations
statement: A story problem needs two steps, each an addition or subtraction within 1000 or a multiplication
  or division within 100 of whole numbers, and has a whole-number answer; the learner chooses and carries
  out the steps.
assess: A class has 3 tables with 6 students at each. Then 5 more students join the class. How many students
  are in the class now?
sources:
  ccss:
  - 3.OA.D.8
  learning_components:
  - 2aecfdc6
requires:
- clause: standard
  all_of:
  - node: multiplication.application.equal-groups
    relation: definitional
    points_to: statement
    why: A step in the story can be an equal-groups multiplication, and the learner chooses and solves
      it.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.application.partitive
    relation: definitional
    points_to: statement
    why: A step in the story can be a sharing division, which the learner must recognize and carry out.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.application.measurement
    relation: definitional
    points_to: statement
    why: A step in the story can be a grouping division, which the learner must recognize and carry out.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.within-1000
    relation: procedural
    points_to: assess
    why: A step may subtract within 1000, by any method.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem (subtracting 290) needs a three-digit subtraction strategy.'
    - kind: review
      source: DK
      note: 'F97 replace: Range split (F97, RULES 2.4, Daniel 2026-10-20): the node was narrowed to its
        lower range; the upper range is a new node in pilot/run/p2/skeletons/F.yaml.'
    status: reviewed
  - node: addition.within-1000
    relation: procedural
    points_to: statement
    why: A step may add within 1000, by any method.
    evidence:
    - kind: review
      source: DK
      note: 'F97 add: Range split (F97, RULES 2.4, Daniel 2026-10-20): the node was narrowed to its lower
        range; the upper range is a new node in pilot/run/p2/skeletons/F.yaml.'
    status: reviewed
  - node: multiplication.facts.within-100
    relation: procedural
    points_to: statement
    why: A step may multiply within 100, which is a product of single-digit factors.
    evidence:
