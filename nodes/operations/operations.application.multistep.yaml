      source: DK
      note: 'F97 add: Range split (F97, RULES 2.4, Daniel 2026-10-20): the node was narrowed to its lower
        range; the upper range is a new node in pilot/run/p2/skeletons/F.yaml.'
    status: reviewed
  - node: division.facts.within-100
