id: exponent.whole-number.product-rule
concept: exponent
facet: whole-number-power
level: 3
type: concept
name: 'Product of powers with the same base: a^m x a^n = a^(m+n)'
statement: 'For any number a and any positive whole numbers m and n, a^m x a^n = a^(m+n): multiplying
  powers of the same base adds the exponents.'
assess: 'Without computing any power, decide whether each is true: 5^3 x 5^4 = 5^7; 5^3 x 5^4 = 5^12;
  5^3 x 5^4 = 25^7.'
sources:
  ccss:
  - 8.EE.A.1
  learning_components: []
