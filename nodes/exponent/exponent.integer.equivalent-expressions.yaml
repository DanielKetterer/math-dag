id: exponent.integer.equivalent-expressions
concept: exponent
facet: integer-power
level: 3
type: procedure
name: Rewrite a numerical expression with integer exponents using the exponent properties
statement: Rewrite a numerical expression made of products, quotients and powers of powers with integer
  exponents as an equivalent single power, or as a fraction without exponents, by applying the exponent
  properties.
procedure:
- Combine powers with the same base into one power, using the product, quotient and power-of-a-power rules.
- Combine powers with the same exponent into one power of a product or quotient where that helps.
- 'Rewrite any negative exponent as a reciprocal: a^(-n) = 1/a^n.'
- If a value is asked for, evaluate the remaining whole-number power.
assess: Write 3^2 x 3^-5 as a fraction with no exponents.
