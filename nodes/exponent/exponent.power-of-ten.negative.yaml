      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.signed.meaning
    relation: definitional
    points_to: statement
    why: The exponent -n is a negative number; on the place-value route the learner must read -n as a
      negative integer without going through exponent.negative.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: division.power-of-ten.rule
    relation: representational
    points_to: statement
    why: dividing 1 by 10^n moves the decimal point n places left, putting the digit 1 in the n-th place
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Reading 1/10^n as a decimal by dividing 1 by 10^n is one way to place the digit
        1; the place-value definition of the n-th decimal place gives the same result. | other route:
        Use place value: the n-th place after the decimal point has value 1/10^n (place-value.ten-times-right.decimal),
        so 1/10^n is the decimal with a 1 in that place.'
    status: disputed
