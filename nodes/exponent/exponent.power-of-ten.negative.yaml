      note: necessary
    status: proposed
  - node: rational-number.signed.meaning
    relation: definitional
    points_to: statement
    why: The exponent -n is a negative number; on the place-value route the learner must read -n as a
      negative integer without going through exponent.negative.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: place-value.ten-times-right.decimal
    relation: definitional
    points_to: statement
    why: The n-th place after the decimal point has value 1/10^n, since each place is a tenth of the one
      to its left.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Place value of the n-th decimal place fixes the decimal for 1/10^n; the division
        route reaches the same decimal by moving the point. | other route: Division route: exponent.negative
        gives 10^-n = 1/10^n and division.power-of-ten.rule moves the point n places left from 1.'
    status: disputed
- clause: via-rule
  all_of:
  - node: exponent.power-of-ten.notation
    relation: representational
    points_to: statement
    why: The denominator 10^n is a 1 followed by n zeros, which fixes the n-th decimal place.
    evidence:
    - kind: content
