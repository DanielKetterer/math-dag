id: exponent.integer.properties
concept: exponent
facet: integer-power
level: 3
type: concept
name: The exponent properties hold for all integer exponents
statement: With a^0 = 1 and a^(-n) = 1/a^n, the rules a^m x a^n = a^(m+n), a^m divided by a^n = a^(m -
  n), (a^m)^n = a^(m x n), (a x b)^n = a^n x b^n and (a/b)^n = a^n/b^n hold for all integers m and n,
  with nonzero bases.
assess: 'Without computing any power, decide whether each is true: 5^-2 x 5^6 = 5^4; 4^3 divided by 4^7
  = 4^-4; (2^-3)^2 = 2^-1; 6^4 divided by 6^4 = 6^0.'
sources:
  ccss:
  - 8.EE.A.1
  learning_components: []
