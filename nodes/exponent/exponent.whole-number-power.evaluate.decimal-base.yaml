id: exponent.whole-number-power.evaluate.decimal-base
concept: exponent
facet: whole-number-power
level: 3
type: procedure
name: Evaluate a power of a decimal
statement: Find the value of d^b, for a decimal d and a whole-number exponent b of at least 1, by multiplying
  b factors of d.
procedure:
- Write d^b as a product of b factors of d.
- Multiply the decimals.
assess: Evaluate (0.2)^3.
sources:
