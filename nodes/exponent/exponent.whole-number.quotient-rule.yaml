id: exponent.whole-number.quotient-rule
concept: exponent
facet: whole-number-power
level: 3
type: concept
name: 'Quotient of powers with the same base: a^m divided by a^n = a^(m - n)'
statement: 'For any nonzero number a and positive whole numbers m and n with m greater than n, a^m divided
  by a^n = a^(m - n): dividing powers of the same base subtracts the exponents.'
assess: 'Without computing any power, decide whether each is true: 7^6 divided by 7^2 = 7^4; 7^6 divided
  by 7^2 = 7^3; 7^6 divided by 7^2 = 1^4.'
sources:
  ccss:
  - 8.EE.A.1
  learning_components: []
requires:
- clause: via-product-rule
  all_of:
  - node: expressions.variable.meaning
    relation: definitional
    points_to: statement
    why: The rule is stated with letters, each standing for any number or any whole number.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.within-10
    relation: procedural
    points_to: assess
    why: The test problems need the difference 6 - 2 to tell 7^4 apart from 7^3 and 1^4.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement subtracts general whole-number exponents; only the test problem
        needs the specific difference 6 - 2 within 10.'
    status: proposed
  - node: exponent.whole-number-power.meaning
    relation: definitional
    points_to: statement
    why: a^m and a^n expand into m and n equal factors of a, which can be written out in full.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: exponent.whole-number.product-rule
    relation: justificatory
    points_to: statement
    why: Since a^(m - n) x a^n = a^m by the product rule, a^(m - n) is the quotient of a^m by a^n.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Only the unknown-factor route needs the product rule (a^(m-n) x a^n = a^m); expanding
        into factors and cancelling reaches the quotient rule from the power meaning alone. | other route:
        Expand a^m and a^n into m and n factors, write the quotient as a fraction and cancel n factors
        (fraction.quotient.symbolic, fraction.equivalent.multiply-principle).'
    status: disputed
