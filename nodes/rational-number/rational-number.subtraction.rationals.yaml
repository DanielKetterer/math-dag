id: rational-number.subtraction.rationals
concept: rational-number
facet: core
level: 3
type: procedure
name: Subtract two signed fractions or decimals
statement: Subtract one rational number given as a signed fraction or decimal from another by rewriting
  the subtraction as adding the opposite and adding the two numbers.
procedure:
- Rewrite p - q as p + (-q).
- Add p and -q by the sign rules for adding signed fractions or decimals.
assess: Compute -1.2 - 3.5 and 1/4 - (-2/3).
