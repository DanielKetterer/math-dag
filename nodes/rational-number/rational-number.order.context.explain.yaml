id: rational-number.order.context.explain
concept: rational-number
facet: core
level: 2
type: justification
name: Explain an inequality between signed quantities in context
statement: Explain why an inequality between two signed quantities is true by saying what it means for
  the quantities in their context, such as warmer, higher, or owing less.
assess: Two account balances are -20 dollars and -5 dollars. Explain, in terms of money owed, why -20
  < -5.
