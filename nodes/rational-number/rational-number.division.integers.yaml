id: rational-number.division.integers
concept: rational-number
facet: core
level: 3
type: procedure
name: Divide an integer by an integer that divides it evenly
statement: Divide an integer by a nonzero integer that divides it evenly by dividing their absolute values
  and giving the quotient the sign from the sign rule.
procedure:
- If the dividend is 0, the quotient is 0.
- Divide the absolute value of the dividend by the absolute value of the divisor.
- Make the quotient positive if the two numbers have the same sign and negative if they have opposite
  signs.
assess: Compute -42 divided by 6, -36 divided by (-4), and 0 divided by (-5).
