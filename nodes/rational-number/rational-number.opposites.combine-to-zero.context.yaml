name: Opposite quantities combine to make 0
statement: In a real-world situation, a quantity combined with an opposite quantity of the same size gives
  0, such as a gain of 6 points followed by a loss of 6 points.
assess: 'Which situation ends with a total change of 0: (a) a deposit of 20 dollars, then a withdrawal
  of 20 dollars; (b) a deposit of 20 dollars, then another deposit of 20 dollars; (c) a rise of 5 degrees,
  then a fall of 3 degrees?'
