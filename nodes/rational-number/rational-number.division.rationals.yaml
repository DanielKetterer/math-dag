id: rational-number.division.rationals
concept: rational-number
facet: core
level: 3
type: procedure
name: Divide signed fractions or decimals
statement: Divide a rational number by a nonzero rational number, given as signed fractions or decimals,
  by dividing their absolute values as fractions or decimals and giving the quotient the sign from the
  sign rule.
procedure:
- If the dividend is 0, the quotient is 0.
- Divide the absolute value of the dividend by the absolute value of the divisor as fractions or decimals.
- Make the quotient positive if the two numbers have the same sign and negative if they have opposite
  signs.
assess: Compute -1.8 divided by 0.3 and (-2/3) divided by (-4/5).
