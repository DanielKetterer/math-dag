id: rational-number.division.sign-rule
concept: rational-number
facet: core
level: 3
type: concept
name: The sign rule for dividing signed numbers
statement: The quotient of two nonzero rational numbers is positive when they have the same sign and negative
  when they have opposite signs, and its absolute value is the quotient of their absolute values.
assess: 'Without computing the values, give the sign of each quotient: (-48) divided by 6; (-2.4) divided
  by (-0.8); (5/6) divided by (-3).'
sources:
  ccss:
  - 7.NS.A.2.b
  learning_components:
  - 9dd24851
requires:
- clause: standard
  all_of:
  - node: absolute-value.distance.rational
    relation: definitional
    points_to: statement
    why: The rule states that the absolute value of the quotient is the quotient of the absolute values
      of the two numbers.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.multiplication.sign-rule
    relation: justificatory
    points_to: statement
    why: The sign of the quotient is the sign that makes quotient times divisor equal the dividend under
      the multiplication sign rule.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.unknown-factor.meaning
    relation: definitional
    points_to: statement
    why: A quotient is the factor that multiplies the divisor to give the dividend, which links the division
      signs to the multiplication signs.
    evidence:
