id: rational-number.application.multiplication
concept: rational-number
facet: change
level: 3
type: application
name: Solve real-world problems that multiply a signed change per unit
statement: A real-world problem gives a constant signed change per unit, such as per day or per hour,
  and a number of units, and asks for the total change, found by multiplying.
assess: A stock's price changed by -1.25 dollars each day for 4 days. What was the total change in price?
sources:
  ccss:
  - 7.NS.A.3
  learning_components:
  - 29a9858d
requires:
- clause: standard
  all_of:
  - node: rational-number.multiplication.rationals
    relation: procedural
    points_to: statement
    why: The total change is found by multiplying a signed change per unit by a number of units, such
      as -1.25 by 4.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.equal-groups.meaning
    relation: definitional
    points_to: statement
    why: The total is the change per unit repeated for each unit, which is the equal-groups meaning of
      a product.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.negative-as-decrease
    relation: representational
    points_to: statement
    why: The change per unit is signed, so a drop in price per day must be written as a negative number.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
