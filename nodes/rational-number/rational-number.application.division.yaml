id: rational-number.application.division
concept: rational-number
facet: change
level: 3
type: application
name: Solve real-world problems that share a signed change equally
statement: A real-world problem gives a total signed change spread equally over a number of steps or units
  and asks for the change per step, found by dividing.
assess: A diver descended from the surface to -22.5 m in 5 equal stages. What was the change in elevation
  for each stage?
sources:
  ccss:
  - 7.NS.A.3
  learning_components:
  - d28fda5e
requires:
- clause: standard
  all_of:
  - node: rational-number.division.rationals
    relation: procedural
    points_to: statement
    why: The change per step is found by dividing a total signed change by a number of steps, such as
      -22.5 by 5.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: division.partitive.meaning
    relation: definitional
    points_to: statement
    why: The total is spread equally over the steps, which is the sharing meaning of a quotient.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.negative-as-decrease
    relation: representational
    points_to: statement
    why: The total change is signed, so a descent in elevation must be written and read as a negative
      number.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
