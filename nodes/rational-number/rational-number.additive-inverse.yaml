    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: The idea a + (-a) = 0 does not need negative fractions or decimals; only the test
        pairs (-4.5, -3/4) do. What they need is recognizing -a as the opposite of a, not locating a point
        on a number line.'
    status: proposed
  - node: rational-number.opposites.combine-to-zero.context
    relation: justificatory
    points_to: statement
    why: A gain and a loss of the same size combining to 0 is the situation that a + (-a) = 0 describes.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: A gain and an equal loss combining to 0 is one way to give a + (-a) = 0 its meaning;
        the number-line move is the other.'
    status: disputed
  - node: rational-number.signed.represent-context
    relation: representational
    points_to: statement
    why: Writing the gain as a and the loss as -a turns the situation into the equation a + (-a) = 0.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Writing a gain as a and the loss as -a is the step that turns the context into
        the equation on the context route only; the number-line route does not use it.'
    status: disputed
status: proposed
