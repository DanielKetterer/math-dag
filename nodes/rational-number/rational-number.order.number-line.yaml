id: rational-number.order.number-line
concept: rational-number
facet: core
level: 2
type: concept
name: An inequality as relative position on the number line
statement: For two numbers a and b, a > b says that a is located to the right of b on a number line oriented
  from left to right, and a < b says that a is located to the left of b.
assess: Ana says that -3 > -7 means -3 is to the left of -7 on a number line oriented from left to right.
  Is she right? Explain using the positions of the two points.
