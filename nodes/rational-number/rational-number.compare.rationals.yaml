id: rational-number.compare.rationals
concept: rational-number
facet: core
level: 3
type: procedure
name: Decide which of two signed fractions or decimals is greater
statement: 'Decide which of two rational numbers given as fractions or decimals is greater without a number
  line: negative < 0 < positive, and of two negative numbers the one closer to 0, whose opposite is smaller,
  is greater.'
procedure:
- If the numbers have different signs, or one is 0, the order is negative < 0 < positive.
- If both are positive, compare them as fractions or decimals.
- If both are negative, compare their opposites as fractions or decimals; the negative number whose opposite
  is smaller is the greater.
assess: 'Which is greater in each pair: -4.5 or -4.05; -2/3 or -3/4?'
sources:
  ccss:
  - 6.NS.C.7
  learning_components: []
