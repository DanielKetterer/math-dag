id: rational-number.division.context.describe
concept: rational-number
facet: change
level: 2
type: representation
name: Describe a real-world situation for a quotient of signed numbers
statement: Describe a real-world situation that a given quotient of rational numbers represents, giving
  the dividend and the divisor a meaning in the situation.
assess: Describe a real-world situation that the quotient (-7.5) divided by 3 could represent.
sources:
  ccss:
  - 7.NS.A.2.b
  learning_components:
  - 177feacf
requires:
- clause: standard
  all_of:
  - node: division.partitive.meaning
    relation: definitional
    points_to: statement
    why: The situation must show (-7.5) divided by 3 as -7.5 shared equally among 3, which is the sharing
      meaning of a quotient.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.signed.meaning
    relation: definitional
    points_to: statement
    why: The dividend -7.5 needs a meaning in the situation, so the writer must know what a negative quantity
      describes.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
related:
- node: division.measurement.meaning
  relation: contrasts_with
  note: The test quotient (-7.5) divided by 3 is a sharing situation; a negative total cannot be split
    into groups of size 3. The grouping meaning is the other meaning of division, not needed here.
status: proposed
