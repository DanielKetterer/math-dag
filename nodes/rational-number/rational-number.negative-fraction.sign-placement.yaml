id: rational-number.negative-fraction.sign-placement
concept: rational-number
facet: core
level: 3
type: concept
name: Where the negative sign of a fraction can go
statement: For integers p and q with q not 0, -(p/q) = (-p)/q = p/(-q).
assess: 'Which of these equal -(3/4): (-3)/4; 3/(-4); (-3)/(-4)?'
sources:
  ccss:
  - 7.NS.A.2.b
  learning_components:
  - 9dd24851
requires:
- clause: standard
  all_of:
  - node: rational-number.integer-quotient
    relation: definitional
    points_to: statement
    why: The fractions p/q, (-p)/q and p/(-q) have integer numerators and denominators, so each is a quotient
      of integers.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.division.sign-rule
    relation: justificatory
    points_to: statement
    why: Moving the negative sign between numerator, denominator and front uses the sign of a quotient
      of a negative by a positive and a positive by a negative.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.opposite.number-line
    relation: definitional
    points_to: statement
    why: The expression -(p/q) is the opposite of a fraction, so the meaning of the opposite of a number
      is used.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
