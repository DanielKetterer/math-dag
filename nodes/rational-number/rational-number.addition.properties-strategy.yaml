id: rational-number.addition.properties-strategy
concept: rational-number
facet: core
level: 3
type: procedure
name: Add signed numbers by reordering and regrouping
statement: Add several rational numbers by using the commutative and associative properties of addition
  to reorder and regroup them so that opposites, or addends with an easy sum, are combined first.
procedure:
- Look for addends that are opposites or whose sum is easy, such as a whole number.
- Use the commutative and associative properties to move those addends next to each other and group them.
- Add each group, then add the results.
assess: Compute -3.7 + 8 + 3.7 by first reordering and grouping the addends. Show the rewritten sum.
