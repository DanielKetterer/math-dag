id: rational-number.compute.mixed-forms
concept: rational-number
facet: core
level: 3
type: procedure
name: Compute with rational numbers given in different forms
statement: Compute with rational numbers given in different forms (whole numbers, fractions, mixed numbers,
  decimals) by first writing them all in one form, chosen to make the computation easy.
procedure:
- Choose one form, fraction or decimal, that makes the computation easy.
- Rewrite each number in that form.
- Compute.
assess: Compute 3/4 - 1.5 + 2 1/4.
sources:
  ccss:
  - 7.EE.B.3
  learning_components:
  - 35c2f57a
requires:
- clause: via-to-fraction
  all_of:
  - node: rational-number.addition.rationals
    relation: procedural
    points_to: assess
    why: Step 3 adds the numbers once they are in one form, as in the sum in 3/4 - 1.5 + 2 1/4.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement says only ''compute''; the test problem adds, and which operation
        applies depends on the problem.'
    status: proposed
  - node: rational-number.subtraction.rationals
    relation: procedural
    points_to: assess
    why: Step 3 subtracts the numbers once they are in one form, as in 3/4 - 1.5.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement says only ''compute''; the test problem subtracts (3/4 - 1.5), and
        which operation applies depends on the problem.'
    status: proposed
  - node: rational-number.multiplication.rationals
    relation: procedural
    points_to: procedure.3
    why: Step 3 multiplies signed fractions or decimals once they are in one form.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: The statement says only ''compute'' and the test problem does not multiply.'
    status: disputed
  - node: rational-number.division.rationals
    relation: procedural
    points_to: procedure.3
    why: Step 3 divides signed fractions or decimals once they are in one form.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: The statement says only ''compute'' and the test problem does not divide.'
    status: disputed
  - node: decimal.thousandths.notation
    relation: procedural
    points_to: procedure.2
    why: Step 2 rewrites a decimal as a fraction when fraction form is chosen, which reads the decimal
      as tenths, hundredths or thousandths.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: Thousandths are beyond the test problem (1.5 is tenths) and the statement does
        not bound the decimals; if fraction form is chosen it is needed only for decimals with three places.'
    status: disputed
  - node: decimal.tenths.notation
    relation: definitional
    points_to: statement
    why: Test decimal 1.5 is tenths; reading it as 15/10 is needed on the fraction route.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: fraction.mixed-number.meaning
    relation: definitional
    points_to: statement
    why: On the decimal route a mixed number is written as its whole part plus the decimal of its fraction.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: fraction.mixed-number.to-fraction
    relation: procedural
    points_to: procedure.2
    why: Step 2 rewrites a mixed number such as 2 1/4 as a fraction when fraction form is chosen.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Needed only when fraction form is chosen to rewrite a mixed number as a fraction.
        | other route: Choose decimal form: write the whole part plus the decimal of the fraction (2 +
        0.25), using fraction.mixed-number.meaning and long division.'
    status: disputed
