id: rational-number.decimal-expansion.terminate-or-repeat.explain
concept: rational-number
facet: decimal-expansion
level: 4
type: justification
name: Explain why the decimal of a fraction terminates or repeats
statement: In the long division of a whole number a by a positive whole number b, every remainder is one
  of 0, 1, ..., b - 1, and once the digits of a are used up each step depends only on the remainder; so
  within b such steps either a remainder is 0 and the decimal terminates, or a remainder recurs and from
  then on the digits repeat.
assess: When you divide 1 by 7 with long division, explain why some remainder must recur within 7 steps
  after the decimal point, and why the digits of the quotient repeat from then on.
