id: rational-number.subtraction.properties-strategy
concept: rational-number
facet: core
level: 3
type: procedure
name: Subtract signed numbers by rewriting as addition and regrouping
statement: Compute an expression that subtracts rational numbers by rewriting each subtraction as adding
  the opposite, then reordering and regrouping the addends with the commutative and associative properties
  of addition.
procedure:
- Rewrite each p - q as p + (-q).
- Use the commutative and associative properties to move opposites, or addends with an easy sum, next
  to each other and group them.
- Add each group, then add the results.
assess: Compute -4.5 - 7 - (-4.5) by rewriting the subtractions as additions and regrouping. Show the
  rewritten sum.
