id: rational-number.multiplication.properties-strategy
concept: rational-number
facet: core
level: 3
type: procedure
name: Multiply signed numbers by reordering, regrouping or distributing
statement: Multiply rational numbers by using the commutative and associative properties to reorder and
  regroup factors, or the distributive property to split a factor into a sum, so that the products are
  easy.
procedure:
- Look for factors whose product is easy, such as -4 and 25, or a factor that splits into a sum with easy
  products.
- Use the commutative and associative properties to group those factors, or the distributive property
  to split the factor and multiply each part.
- Compute each group or part, then combine the results.
assess: Compute -4 x 2.7 x (-25) by first reordering and grouping the factors. Show the rewritten product.
