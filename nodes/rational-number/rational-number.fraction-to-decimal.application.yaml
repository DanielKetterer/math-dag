id: rational-number.fraction-to-decimal.application
concept: rational-number
facet: decimal-expansion
level: 3
type: application
name: Compare a fractional quantity with a decimal one by long division
statement: A real-world problem gives one quantity as a fraction and another of the same kind as a decimal
  and asks which is greater; convert the fraction to a decimal by long division and compare.
assess: Runner A ran 5/8 mile and runner B ran 0.6 mile. Use long division to write 5/8 as a decimal,
  and say who ran farther.
