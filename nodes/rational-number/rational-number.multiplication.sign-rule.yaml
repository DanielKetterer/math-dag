id: rational-number.multiplication.sign-rule
concept: rational-number
facet: core
level: 3
type: concept
name: The sign rule for multiplying signed numbers
statement: The product of two nonzero rational numbers is positive when they have the same sign and negative
  when they have opposite signs, and its absolute value is the product of their absolute values.
assess: 'Without computing the values, give the sign of each product: (-3.1) x 4.7; (-2/5) x (-8); 0.5
  x 12.'
sources:
