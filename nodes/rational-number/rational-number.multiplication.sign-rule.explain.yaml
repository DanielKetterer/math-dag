id: rational-number.multiplication.sign-rule.explain
concept: rational-number
facet: core
level: 4
type: justification
name: Explain with the distributive property why (-1) x (-1) = 1
statement: If multiplication of signed numbers keeps the distributive property, then 0 = (-1) x (1 + (-1))
  = (-1) x 1 + (-1) x (-1) = -1 + (-1) x (-1), so (-1) x (-1) must be the additive inverse of -1, which
  is 1.
assess: Use 0 = (-1) x (1 + (-1)) and the distributive property to explain why (-1) x (-1) must equal
  1.
