id: rational-number.fraction-to-decimal.long-division
concept: rational-number
facet: decimal-expansion
level: 3
type: procedure
name: Convert a fraction to a decimal with long division
statement: Write a fraction a/b of whole numbers as a decimal by dividing a by b with long division, writing
  zeros after the decimal point of a, until a remainder of 0 ends the decimal or a remainder recurs, after
  which the digits repeat.
procedure:
- Write a with a decimal point and zeros after it, and set up a divided by b.
- Divide with long division, placing the decimal point of the quotient above that of a.
- 'If a remainder is 0, stop: the decimal terminates.'
- 'If a remainder appears that has appeared before, stop: the quotient digits from where that remainder
  first appeared repeat forever; record the repeating block.'
assess: Use long division to write 5/12 as a decimal.
