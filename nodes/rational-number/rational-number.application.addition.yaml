id: rational-number.application.addition
concept: rational-number
facet: change
level: 3
type: application
name: Solve real-world problems that add a signed change to a signed value
statement: A real-world problem gives a signed starting value and a signed change, such as an elevation
  and a rise or fall, and asks for the result, found by adding the two signed numbers.
assess: A submarine is at -45.5 m. It rises 18.25 m. What is its new elevation?
sources:
  ccss:
  - 7.NS.A.3
  learning_components:
  - 1bff6614
requires:
- clause: standard
  all_of:
  - node: rational-number.addition.rationals
    relation: procedural
    points_to: statement
    why: The result is found by adding a signed starting value and a signed change, such as -45.5 and
      18.25.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.negative-as-decrease
    relation: representational
    points_to: statement
    why: The change is given as a rise or fall, so the learner must write a fall as a negative number
      and a rise as a positive one.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.signed.represent-context
    relation: representational
    points_to: statement
    why: A rise or fall in the story must be written as a positive or negative change before it is added.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
