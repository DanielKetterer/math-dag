id: rational-number.order.context.write
concept: rational-number
facet: core
level: 2
type: representation
name: Write an inequality comparing two signed quantities in context
statement: Write an inequality with > or < between two signed numbers that stand for quantities in a real-world
  context, such as -3 degrees C > -7 degrees C to record that -3 degrees C is warmer.
assess: One town is at an elevation of -12 m and another at -5 m. Write an inequality with these two numbers
  that says the second town is higher.
sources:
  ccss:
  - 6.NS.C.7.b
  learning_components:
  - 0a31d080
requires:
- clause: standard
  all_of:
  - node: rational-number.order.number-line
    relation: definitional
    points_to: statement
    why: Choosing > or < between two signed numbers uses the meaning of an inequality as relative position,
      where higher is greater.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: comparing.whole-numbers.symbols
    relation: representational
    points_to: statement
    why: The statement records the comparison with the symbol > or <, as first learned for whole numbers.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.signed.meaning
    relation: definitional
    points_to: statement
    why: To write the right inequality the learner must read -12 m and -5 m as quantities in opposite
      directions from 0 (below sea level), so that higher means greater.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
