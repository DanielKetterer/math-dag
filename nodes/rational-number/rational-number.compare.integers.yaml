id: rational-number.compare.integers
concept: rational-number
facet: core
level: 3
type: procedure
name: Decide which of two integers is greater
statement: 'Decide which of two integers is greater without a number line: a positive integer is greater
  than 0, 0 is greater than a negative integer, and of two negative integers the one closer to 0 is greater.'
procedure:
- If the integers have different signs, or one is 0, the order is negative < 0 < positive.
- If both are positive, compare them as whole numbers.
- If both are negative, compare their opposites; the negative integer whose opposite is smaller is the
  greater.
assess: 'Which is greater in each pair: -14 or -9; -6 or 0?'
