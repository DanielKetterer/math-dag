  all_of:
  - node: rational-number.negative-meaning
    relation: representational
    points_to: statement
    why: The statement writes a decrease with a negative number, so the learner must already know a negative
      number as the opposite of a positive amount.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: The prerequisite id rational-number.negative-meaning is not in the index or boundary
        list, so it cannot be checked. Whether the learner needs a prior concept of negative numbers or
        whether this node is where signed change is first introduce'
    status: disputed
  - node: subtraction.whole-number
    relation: definitional
    points_to: statement
