id: rational-number.negative-as-decrease
concept: rational-number
facet: change
level: 2
type: representation
name: A decrease as a negative number
statement: A decrease in a quantity is written as a negative number whose size is the amount of the decrease,
  and an increase as a positive number.
assess: The water in a tank goes down by 15 liters. Write the change in the amount of water as a signed
  number. Credit -15.
sources:
  ccss:
  - 6.NS.C.5
  learning_components: []
  other:
