id: rational-number.addition.integers
concept: rational-number
facet: core
level: 3
type: procedure
name: Add two integers
statement: 'Add two integers by the sign rules: with the same sign, add the absolute values and keep the
  sign; with opposite signs, subtract the smaller absolute value from the larger and take the sign of
  the addend with the larger absolute value.'
procedure:
- If one addend is 0, the sum is the other addend.
- If the addends have the same sign, add their absolute values and give the sum that sign.
- If they have opposite signs, subtract the smaller absolute value from the larger and give the result
  the sign of the addend with the larger absolute value; if the absolute values are equal, the sum is
  0.
assess: Compute -9 + 4, -6 + (-8), and 7 + (-7).
sources:
  ccss:
  - 7.NS.A.1
  learning_components: []
requires:
- clause: via-number-line
  all_of:
  - node: rational-number.signed.meaning
    relation: definitional
    points_to: statement
    why: The sign rules refer to whether each addend is positive or negative, so the meaning of the sign
      of an integer is used throughout.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: absolute-value.distance.integer
    relation: procedural
    points_to: procedure.2
    why: Steps 2 and 3 add or subtract the absolute values of the addends, which are the distances of
