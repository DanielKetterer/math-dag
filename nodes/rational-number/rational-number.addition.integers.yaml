    status: proposed
  - node: rational-number.addition.number-line
    relation: definitional
    points_to: statement
    why: The sign rules compute the sum of signed numbers, which is defined as a move along the number
      line.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The sign rules are a symbolic procedure; the number-line move is one way to give
        a sum of signed numbers its meaning. Credit/debt contexts or counters with zero pairs give the
        same meaning without a number line. | other route: Give signed sums meaning through gains and
        losses in context (negative-as-decrease, signed.meaning) or counters, then apply the sign rules.'
    status: disputed
