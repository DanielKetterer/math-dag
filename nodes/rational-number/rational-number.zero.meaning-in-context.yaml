id: rational-number.zero.meaning-in-context
concept: rational-number
facet: core
level: 2
type: concept
name: The meaning of 0 in a signed-number context
statement: In a context described with positive and negative numbers, 0 stands for the reference value
  from which both directions are measured, such as sea level, a balance of no money, or the freezing point
  of water on the Celsius scale.
assess: Heights are written relative to sea level, as +200 m for a hilltop and -30 m for a valley floor.
  What does an elevation of 0 m mean in this situation?
