id: rational-number.division.properties-strategy
concept: rational-number
facet: core
level: 3
type: procedure
name: Divide signed numbers by rewriting as multiplication and regrouping
statement: Compute an expression that divides rational numbers by rewriting each division as multiplying
  by the reciprocal of the divisor, then reordering and regrouping the factors with the commutative and
  associative properties.
procedure:
- Rewrite each p divided by q, with q not 0, as p x (1/q), using the reciprocal of q.
- Use the commutative and associative properties to group factors whose product is easy.
- Multiply each group, then multiply the results.
assess: Compute [(-18) divided by (2/3)] x (1/9) by rewriting the division as a multiplication and regrouping.
  Show the rewritten product.
