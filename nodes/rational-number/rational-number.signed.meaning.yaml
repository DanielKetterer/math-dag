id: rational-number.signed.meaning
concept: rational-number
facet: core
level: 2
type: concept
name: Positive and negative numbers describe opposite directions from 0
statement: 'Positive and negative numbers are used together for quantities measured in opposite directions
  from a reference value of 0: amounts in one direction are positive and amounts in the opposite direction
  are negative.'
assess: 'Which pairs could be written as +40 and -40: a deposit of 40 dollars and a withdrawal of 40 dollars;
  40 m above sea level and 40 m below sea level; 40 apples and 40 oranges? Explain.'
