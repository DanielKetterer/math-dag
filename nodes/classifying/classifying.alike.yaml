id: classifying.alike
concept: classifying
facet: core
level: 1
type: concept
name: See two objects as alike or different
statement: Judge whether two objects are the same kind of thing or alike in some way, and group objects
  that are alike.
assess: Show a toy car, a second toy car of a different color, and a spoon. 'Which two go together? Why?'
  Credit the two cars, with any reason that names how they are alike.
