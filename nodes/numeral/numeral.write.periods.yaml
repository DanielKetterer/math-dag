    relation: procedural
    points_to: procedure.1
    why: The number said before thousand and the three-digit part after it are each written as a numeral
      up to 999.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.number-word.thousand-million
    relation: definitional
