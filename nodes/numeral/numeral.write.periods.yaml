id: numeral.write.periods
concept: numeral
facet: core
level: 3
type: representation
name: Write multi-digit numerals up to 1,000,000 from number names
statement: Write the numeral for a number name up to 1,000,000, writing the thousands part and then exactly
  three digits for the part after the word thousand, filling empty places with 0 (forty thousand six is
  40,006).
procedure:
- Write the numeral for the number said before the word thousand.
- Write the numeral for the number said after thousand as exactly three digits, using leading zeros if
  needed.
- Join the two parts, separated by a comma.
assess: Write the numeral for two hundred eight thousand forty.
sources:
