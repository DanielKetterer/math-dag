id: numeral.informal-record
concept: numeral
facet: informal-mark
level: 2
type: representation
name: Record how many with marks or drawings
statement: Record the number of objects in a set by making one mark, tally, or drawing for each object,
  so the record can later be used to tell how many there were.
assess: '''Make marks on this paper to remember how many cars are in the box'' (5 cars). Remove the box.
  ''Use your paper to tell me how many cars there were.'' Credit 5 marks and the answer 5.'
