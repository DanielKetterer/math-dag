id: numeral.digit-formation
concept: numeral
facet: core
level: 1
type: procedure
name: Form the digits 0 to 9
statement: Write each of the digits 0 through 9 so that it is recognizable and not reversed.
assess: Show a card with the digits 0 to 9. 'Copy each number onto your paper.' Credit all ten digits
  legible and none reversed.
sources:
  ccss:
  - K.CC.A.3
  learning_components: []
  other:
  - 'Review item D74 (pre-K, 2026-10-19): forming digits is a motor skill separate from knowing which
    numeral names a number'
requires: []
root_reason: Copying the digits 0 to 9 from a card is a motor skill that needs no number knowledge, so
  nothing earlier in the map is required.
status: proposed
