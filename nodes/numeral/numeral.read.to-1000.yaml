id: numeral.read.to-1000
concept: numeral
facet: core
level: 2
type: representation
name: Read numerals up to 1000
statement: 'Give the number name, spoken or written in words, for a numeral up to 1000: name the hundreds,
  then the tens-and-ones name, saying nothing for a place whose digit is 0.'
procedure:
- If there are three digits, say the first digit followed by hundred.
- Say the name of the two-digit number formed by the last two digits, or of the last digit if the tens
  digit is 0, or nothing if both are 0.
assess: 'Read these numerals aloud: 406, 117, 860.'
