id: numeral.write
concept: numeral
facet: core
level: 2
type: representation
name: Write a numeral for a spoken number
statement: Write the conventional numeral for a number word that is spoken, with digits correctly formed
  and not reversed.
assess: '''Write the number seven.'' Then ''Write the number three.'' Credit a recognizable, unreversed
  7 and 3.'
sources:
  ccss:
  - K.CC.A.3
  learning_components: []
  prek:
  - elof.p-math-5
requires:
- clause: standard
  all_of:
  - node: numeral.digit-formation
    relation: definitional
    points_to: assess
    why: Forming unreversed digits is a motor skill separate from knowing which numeral stands for a word.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'D74 task: KEEP, task-scoped: Correct, unreversed digit formation is required by the writing
        assessment, but should be distinguished from knowing which numeral represents the spoken number.'
    status: reviewed
    scope: task
related:
- node: numeral.read
  relation: same_idea_different_form
  note: Writing a numeral for a spoken number and reading a numeral are the two directions of one word-symbol
    association. Production can be learned (by tracing and copying) without ever being tested on recognition,
    so neither strictly requires the other.
status: proposed
