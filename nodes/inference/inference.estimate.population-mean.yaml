id: inference.estimate.population-mean
concept: inference
facet: estimate
level: 3
type: application
name: Estimate a population mean from a random sample
statement: When the data come from a random sample, the sample mean is used as an estimate of the unknown
  mean of the population.
assess: A random sample of 5 words from a book has word lengths 3, 5, 4, 6, and 7 letters. Estimate the
  mean word length of all the words in the book.
sources:
  ccss:
  - 7.SP.A.2
  learning_components:
  - c5ae0dd5
requires:
- clause: standard
  all_of:
  - node: sampling.variability.meaning
    relation: definitional
    points_to: statement
    why: Using the sample mean as an estimate of the unknown population mean applies the idea that a sample
      statistic estimates the matching population statistic.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: center.mean.compute
    relation: procedural
    points_to: assess
    why: The test problem finds the sample mean of the five word lengths 3, 5, 4, 6, and 7 before using
      it as the estimate.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: sampling.random.meaning
    relation: definitional
    points_to: statement
    why: The statement applies only when the data come from a random sample, so the learner must know
      what makes a sample random.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
