id: variability.quartiles.find
concept: variability
facet: iqr
level: 3
type: procedure
name: Find the quartiles of a numerical data set
statement: The lower quartile is the median of the lower half of the ordered data and the upper quartile
  is the median of the upper half, where the halves are the values before and after the median's position
  in the ordered list (the median itself is left out of both halves when the number of values is odd).
procedure:
- List the values in order and find the median.
- Form the lower half from the values before the median's position, leaving out the median itself when
  the number of values is odd.
- Form the upper half from the values after the median's position in the same way.
- The lower quartile is the median of the lower half; the upper quartile is the median of the upper half.
assess: Find the lower quartile and the upper quartile of 1, 3, 5, 6, 8, 9, 11, 13, 14.
sources:
  ccss:
  - 6.SP.B.4
  - 6.SP.B.5.c
  learning_components:
  - 3280abf4
requires:
- clause: standard
  all_of:
  - node: center.median.find
    relation: definitional
    points_to: statement
    why: Each quartile is defined as the median of a half of the ordered data, and step 1 finds the median
      of the whole set to split it.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
