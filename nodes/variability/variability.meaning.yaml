id: variability.meaning
concept: variability
facet: core
level: 2
type: concept
name: A measure of variation describes spread with one number
statement: A measure of variation is a single number that describes how much the values of a numerical
  data set differ from one another; it is 0 when all the values are equal and larger when the values are
  more spread out.
assess: Data set A is 5, 5, 5, 5. Data set B is 1, 3, 7, 9. Both have a typical value of 5. Which data
  set should have the larger measure of variation? What should the measure of variation of A be?
