id: variability.mad.interpret
concept: variability
facet: mad
level: 2
type: concept
name: Interpret the mean absolute deviation
statement: 'The MAD of a data set is the typical distance of its values from the mean, in the units of
  the data: a small MAD means the values lie close to the mean and a larger MAD means they lie farther
  from it.'
assess: Class A's reading times have mean 30 minutes and MAD 2 minutes. Class B's have mean 30 minutes
  and MAD 9 minutes. What do the two MADs tell you about the reading times in each class?
