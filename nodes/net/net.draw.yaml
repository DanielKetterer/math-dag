id: net.draw
concept: net
facet: core
level: 2
type: representation
name: Draw a net of a prism or pyramid made of rectangles and triangles
statement: A net of a right prism or a pyramid is drawn by laying out each of its rectangular and triangular
  faces, with its dimensions, so that faces that meet along an edge in the solid share that edge in the
  net wherever the net is joined.
procedure:
- List the faces of the solid and the dimensions of each.
- Draw one face, usually a base.
- Draw each face that meets it along an edge against that edge, and continue until every face is drawn
  once.
- Check that the net would fold into the solid with no gaps or overlaps, and label the edge lengths.
assess: Draw and label a net of a square pyramid whose base edges are 4 cm and whose triangular faces
  each have a height of 3 cm.
