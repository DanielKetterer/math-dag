id: equation.linear.rational-coefficients
concept: equation
facet: linear-one-variable
level: 3
type: procedure
name: Solve a linear equation with fraction or decimal coefficients by operating on them directly
statement: Solve a linear equation whose coefficients and constants are fractions or decimals, with the
  variable on both sides, by applying the same operations to both sides and computing with the fractions
  or decimals as they are.
procedure:
- Subtract one variable term from both sides, combining the fractional or decimal coefficients of x.
- Add or subtract the constant on the variable side from both sides.
- Divide both sides by the coefficient of x.
assess: Solve (2/3)x - 1 = (1/6)x + 2 without first clearing the fractions.
