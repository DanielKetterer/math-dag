id: equation.situation.one-step
concept: equation
facet: relational
level: 2
type: representation
name: Write an equation with a symbol for the unknown for a one-step story
statement: A one-step addition or subtraction story is represented by one equation that relates its three
  quantities, with a symbol such as ? or a box standing for the unknown quantity in its position.
assess: Write an equation, using a box for the unknown, for this story. Do not solve it. Some birds were
  on a wire. 5 more landed. Then there were 13 birds.
sources:
  ccss:
  - 2.OA.A.1
  - 1.OA.A.1
  learning_components:
  - 62f8e446
  - 9410f088
  - 219ac1be
requires:
- clause: standard
  all_of:
  - node: equation.unknown.addition
    relation: representational
    points_to: statement
    why: The equation puts a box for the unknown in its position among three quantities related by addition.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.unknown.subtraction
    relation: representational
