id: equation.true-false
concept: equation
facet: relational
level: 2
type: procedure
name: Decide whether an addition or subtraction equation is true
statement: An equation built from whole numbers, sums, and differences is true when the two sides have
  the same value and false otherwise.
procedure:
- Find the value of the left side.
- Find the value of the right side.
- The equation is true if the two values are equal, and false if they are not.
assess: 'True or false: 6 = 6;  7 = 8 - 1;  5 + 2 = 2 + 5;  4 + 1 = 5 + 2;  9 - 3 = 4 + 2.'
