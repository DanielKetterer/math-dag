id: equation.situation.two-step
concept: equation
facet: relational
level: 2
type: representation
name: Write equations with a symbol for the unknown for a two-step story
statement: A two-step addition or subtraction story is represented by equations (one per step, or one
  with two operations) in which a symbol stands for each unknown quantity.
assess: Write equations, using boxes for unknowns, for this story. Do not solve them. A bus had 23 people.
  At the first stop 8 got off. At the second stop 15 got on. How many people are on the bus now?
