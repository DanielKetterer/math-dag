id: equation.one-step.addition.solve
concept: equation
facet: open-sentence
level: 3
type: procedure
name: Solve x + p = q with nonnegative rational numbers
statement: Solve an equation x + p = q, where p and q are nonnegative whole numbers, fractions or decimals
  with q at least p, by subtracting p from both sides, so that x = q - p.
procedure:
- Subtract p from both sides of the equation.
- Compute q - p; the result is the value of x.
assess: Solve x + 2/3 = 7/6.
