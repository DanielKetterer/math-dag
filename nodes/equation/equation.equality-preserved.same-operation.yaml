id: equation.equality-preserved.same-operation
concept: equation
facet: relational
level: 3
type: concept
name: Doing the same operation to both sides keeps an equation's solutions
statement: Adding the same number to both sides of an equation, subtracting the same number from both
  sides, or multiplying or dividing both sides by the same nonzero number gives an equation with exactly
  the same solutions.
assess: 'Which of these equations have exactly the same solutions as n + 5 = 12: n + 5 - 5 = 12 - 5; n
  + 5 - 5 = 12; 3 x (n + 5) = 3 x 12; 0 x (n + 5) = 0 x 12?'
sources:
  ccss:
  - 6.EE.B.7
  learning_components: []
