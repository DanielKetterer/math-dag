id: equation.solution.check-substitution
concept: equation
facet: open-sentence
level: 3
type: procedure
name: Check by substitution which numbers solve an equation
statement: Decide which numbers in a given set, if any, make an equation true by substituting each for
  the variable and checking whether the two sides have the same value.
procedure:
- Substitute a number from the set for the variable.
- Evaluate each side.
- If the sides are equal, the number is a solution; repeat for each number in the set.
assess: Which numbers in the set {2, 3, 5} make 2x + 1 = 7 true?
