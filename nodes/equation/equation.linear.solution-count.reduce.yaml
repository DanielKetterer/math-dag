id: equation.linear.solution-count.reduce
concept: equation
facet: linear-one-variable
level: 3
type: procedure
name: Find the number of solutions by transforming to x = a, a = a, or a = b
statement: Transform a linear equation in one variable into simpler equivalent equations until x = a (exactly
  one solution), a = a (infinitely many solutions), or a = b with a and b different numbers (no solution)
  results.
procedure:
- Expand products and collect like terms on each side.
- Subtract a variable term from both sides so that at most one side has the variable.
- If the variable is gone, the equation reads a = a (infinitely many solutions) or a = b with a not equal
  to b (no solution).
- Otherwise isolate the variable to reach x = a (one solution).
assess: How many solutions does 3(x + 2) = 3x + 5 have? Show the simplest equivalent equation you reach.
