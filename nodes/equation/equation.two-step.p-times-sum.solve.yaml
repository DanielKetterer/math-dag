id: equation.two-step.p-times-sum.solve
concept: equation
facet: open-sentence
level: 3
type: procedure
name: Solve p(x + q) = r
statement: Solve an equation p(x + q) = r, where p, q and r are rational numbers and p is not 0, by dividing
  both sides by p and then subtracting q from both sides.
procedure:
- Divide both sides by p, giving x + q = r divided by p.
- Subtract q from both sides, giving x = (r divided by p) - q.
assess: Solve -2(x - 3) = 10.
