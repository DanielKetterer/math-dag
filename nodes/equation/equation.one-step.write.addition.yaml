id: equation.one-step.write.addition
concept: equation
facet: open-sentence
level: 3
type: representation
name: Write x + p = q for a word problem
statement: For a problem stated in words in which an unknown nonnegative quantity and a known nonnegative
  rational amount p together make a known amount q, write the equation x + p = q, saying what x stands
  for.
assess: After Ana poured 1.25 liters of water into a jug, the jug held 3 liters. Write an equation for
  the amount of water w, in liters, that was in the jug at first.
