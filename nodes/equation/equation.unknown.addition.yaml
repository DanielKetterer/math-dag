id: equation.unknown.addition
concept: equation
facet: relational
level: 2
type: procedure
name: Find the unknown in an addition equation
statement: In an equation relating three whole numbers by addition (a + b = c, written either way round),
  the unknown may be either addend or the sum; it is the number that makes the equation true.
procedure:
- If the sum is unknown, add the two addends.
- If an addend is unknown, find the number that added to the known addend makes the sum, by counting up
  or a known fact.
- Check that the number makes the two sides equal.
assess: 'Find the number that makes each equation true: 8 + ? = 11;  ? + 5 = 12;  14 = 6 + ?;  6 + 6 =
  ?.'
