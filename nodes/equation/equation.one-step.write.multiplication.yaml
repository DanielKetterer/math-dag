id: equation.one-step.write.multiplication
concept: equation
facet: open-sentence
level: 3
type: representation
name: Write px = q for a word problem
statement: For a problem stated in words in which a known positive rational number p times an unknown
  nonnegative quantity gives a known amount q (p may be a fraction, as in 'p of the quantity'), write
  the equation px = q, saying what x stands for.
assess: Three-fourths of a bag of rice weighs 6 pounds. Write an equation for the weight b, in pounds,
  of the full bag.
