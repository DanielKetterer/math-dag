id: equation.one-step.addition.application
concept: equation
facet: open-sentence
level: 3
type: application
name: Solve real-world problems with an equation x + p = q
statement: Solve a real-world problem in which an unknown nonnegative quantity plus a known nonnegative
  rational amount p gives a known amount q, by writing x + p = q and solving it.
assess: A plant grew 2 3/4 inches this month and is now 10 1/2 inches tall. Write an equation and solve
  it to find how tall the plant was at the start of the month.
sources:
  ccss:
  - 6.EE.B.7
  learning_components:
  - cd69a8c5
requires:
- clause: standard
  all_of:
  - node: equation.one-step.write.addition
    relation: representational
    points_to: statement
    why: The statement solves a problem by writing x + p = q first, which is writing the equation for
      the story.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.one-step.addition.solve
    relation: procedural
    points_to: statement
    why: The statement then solves x + p = q, which is the solving procedure for that equation.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.mixed-number.subtraction.unlike-denominators
    relation: procedural
    points_to: assess
    why: The test problem solves with 10 1/2 - 2 3/4, a subtraction of mixed numbers with unlike denominators.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem needs 10 1/2 - 2 3/4 with mixed numbers; the statement''s
        rational amounts are covered by solving x + p = q and need not be mixed numbers.'
    status: proposed
status: proposed
