id: slope.constant-on-line.explain
concept: slope
facet: core
level: 4
type: justification
name: Explain with similar triangles why slope is constant on a line
statement: For two pairs of distinct points on a non-vertical line, the right triangles formed by each
  pair's horizontal and vertical changes are similar, so the ratios of vertical to horizontal change are
  equal.
assess: Use similar triangles to explain why the slope between any two distinct points on a non-vertical
  line is the same.
