id: slope.unit-rate
concept: slope
facet: core
level: 3
type: concept
name: The slope of a proportional graph is the unit rate
statement: The slope of the graph of a proportional relationship y = kx equals its unit rate k.
assess: The graph of cost against pounds is a line through (0, 0) and (4, 10). Find its slope and say
  what it means as a rate.
