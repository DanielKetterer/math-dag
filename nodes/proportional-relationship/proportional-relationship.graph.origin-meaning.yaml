name: Explain what (0, 0) on a proportional graph means
statement: The point (0, 0) on the graph of a proportional relationship means that zero units of the first
  quantity correspond to zero units of the second.
assess: The graph of cost against pounds of grapes is a line through (0, 0) and (4, 10). Explain what
  (0, 0) means in this situation.
