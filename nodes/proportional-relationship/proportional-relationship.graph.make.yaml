id: proportional-relationship.graph.make
concept: proportional-relationship
facet: core
level: 3
type: representation
name: Graph a proportional relationship
statement: The graph of a proportional relationship y = kx is the line through the origin and the point
  (1, k).
procedure:
- Plot (0, 0).
- Plot (x, k x x) for one convenient x not 0.
- Draw the line through the two points (only the part where both quantities make sense, if the situation
  restricts them).
assess: Graph y = 2.5x for x from 0 to 4.
sources:
  ccss:
  - 8.EE.B.5
  learning_components:
  - 0edaa02c
requires:
- clause: via-unit-rate-point
  all_of:
  - node: proportional-relationship.test.graph
    relation: definitional
    points_to: statement
    why: The statement says the graph is a line through the origin, which is what a graph of a proportional
      relationship looks like.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: coordinate-plane.first-quadrant.plot
    relation: procedural
    points_to: procedure.2
    why: Plotting (0, 0) and the point (x, k x x) and drawing the line through them is done in the first
      quadrant.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired coordinate-plane.first-quadrant: The step plots (0, 0) and (x, kx).'
    status: proposed
  - node: expressions.variable.evaluate
    relation: procedural
    points_to: procedure.2
    why: Computing the second point (x, k x x) evaluates the expression kx at a chosen value of x.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired expressions.variables: The step evaluates the expression at a given
        value (x = 0, or a chosen x).'
    status: proposed
  - node: decimal.multiplication.algorithm
    relation: procedural
    points_to: assess
    why: Graphing y = 2.5x requires computing a point such as (2, 5) by multiplying a decimal slope by
      x.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Multiplying 2.5 by x is demanded by the test problem y = 2.5x.'
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired decimal.operations: Plotting (2, 5) for y = 2.5x multiplies the decimal
        2.5 by the whole number 2. Claude: the source is symbolic (L3), so the skill is the 6.NS.B.3 standard
        algorithm, a later-phase boundary id, not the L2 model node.'
    status: proposed
  - node: proportional-relationship.graph.unit-rate-point
    relation: definitional
    points_to: statement
    why: The statement uses the point (1, k) on the line, whose meaning is 1 unit of x corresponding to
      k units of y.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The point (1, k) can be justified by its meaning, or simply obtained by evaluating
        y = kx at x = 1. | other route: Evaluate kx at x = 1 (expressions.variables).'
    status: disputed
