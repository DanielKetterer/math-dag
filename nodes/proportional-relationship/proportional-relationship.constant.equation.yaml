  all_of:
  - node: proportional-relationship.constant
    relation: definitional
    points_to: statement
    why: The coefficient read from the equation is the constant of proportionality defined as the common
      value of y/x.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.one-step.multiplication.solve
    relation: procedural
    points_to: assess
    why: Rewriting 2y = 7x as y = (7/2)x isolates y by dividing both sides by 2, a one-step equation move.
    scope: task
    evidence:
