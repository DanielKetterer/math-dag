id: proportional-relationship.constant
concept: proportional-relationship
facet: core
level: 3
type: concept
name: The constant of proportionality
statement: In a proportional relationship between x and y, the common value k of y/x is the constant of
  proportionality; it is the unit rate, the amount of y for 1 unit of x.
assess: For a proportional relationship, 5 pounds of apples cost $7.50. What is the constant of proportionality
  for cost per pound, and what does it mean?
sources:
  ccss:
  - 7.RP.A.2.b
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: proportional-relationship.definition
    relation: definitional
    points_to: statement
    why: The constant k is the common value of y/x that the definition says every pair of the relationship
      shares.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: ratio.unit-rate
    relation: definitional
    points_to: statement
    why: The statement says k is the unit rate, the amount of y for 1 unit of x, which is the unit-rate
      concept.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: ratio.unit-rate.find
    relation: procedural
    points_to: assess
    why: The apples problem requires dividing 7.50 by 5 to get the cost per pound and naming it with its
      units.
    scope: task
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Dividing 7.50 by 5 is needed by the apples problem, not to know what the constant
        of proportionality is.'
    status: proposed
status: proposed
