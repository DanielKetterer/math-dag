id: proportional-relationship.test.graph
concept: proportional-relationship
facet: core
level: 2
type: procedure
name: Decide from a graph whether a relationship is proportional
statement: A graph shows a proportional relationship exactly when its points lie on a single straight
  line that passes through the origin.
procedure:
- Check whether all plotted points lie on one straight line.
- Check whether that line passes through (0, 0).
- The relationship is proportional exactly when both checks hold.
assess: Graph A is a line through (0, 1) and (2, 5). Graph B is a line through (0, 0) and (3, 4). Which
  shows a proportional relationship?
sources:
  ccss:
  - 7.RP.A.2.a
  learning_components:
  - e979a208
requires:
- clause: via-definition
  all_of:
  - node: coordinate-plane.first-quadrant.read
    relation: procedural
    points_to: procedure.2
    why: Checking whether the line passes through (0, 0) requires reading coordinates of points in the
      plane.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: content
      source: retarget-sonnet
      note: 're-pointed from retired coordinate-plane.first-quadrant: Checking the line through (0, 0)
        means reading coordinates.'
    status: proposed
  - node: proportional-relationship.definition
    relation: definitional
    points_to: statement
    why: 'The graph test restates the definition: constant y/x for x not 0 and y = 0 at x = 0 appear as
      a line through the origin.'
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The graph criterion can be reached from plotted pairs of equivalent ratios without
        the level 3 quotient definition. | other route: Plot pairs of equivalent ratios and see them lie
        on a line through the origin (ratio.equivalent, ratio.table.plot).'
    status: disputed
- clause: via-plot
  all_of:
