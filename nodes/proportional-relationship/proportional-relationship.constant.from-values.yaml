id: proportional-relationship.constant.from-values
concept: proportional-relationship
facet: core
level: 3
type: procedure
name: Find the constant of proportionality from a table or description
statement: Given a proportional relationship as a table or a verbal description of corresponding values,
  k is the y-value divided by the x-value for any pair with x not 0.
procedure:
- Decide which quantity is y and which is x (y per x).
- Take any pair of corresponding values with x not 0.
- Compute k = y/x.
assess: 8 movie tickets cost $30, and cost is proportional to the number of tickets. Find the constant
  of proportionality for cost per ticket.
