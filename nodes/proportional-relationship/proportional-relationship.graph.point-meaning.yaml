id: proportional-relationship.graph.point-meaning
concept: proportional-relationship
facet: core
level: 2
type: justification
name: Explain what a point (x, y) on a proportional graph means
statement: A point (x, y) on the graph of a proportional relationship means that x units of the first
  quantity correspond to y units of the second in the situation.
assess: A graph of a cyclist's distance d (miles) against time t (hours) is a line through (0, 0) and
  (3, 36). Explain what the point (3, 36) means.
sources:
  ccss:
  - 7.RP.A.2.d
  learning_components:
  - 7829e94a
requires:
- clause: standard
  all_of:
  - node: ratio.table.plot
    relation: representational
    points_to: statement
    why: A plotted point stands for one ordered pair of corresponding quantities, the reverse of plotting
      a row of a ratio table.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Plotting table rows is one way to learn that a point is a pair of corresponding
        quantities; reading coordinates on a graph is the other.'
    status: disputed
  - node: coordinate-plane.first-quadrant
    relation: definitional
    points_to: statement
    why: A point (x, y) as an ordered pair of coordinates is the object being interpreted.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
