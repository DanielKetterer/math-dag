id: proportional-relationship.equation.write
concept: proportional-relationship
facet: core
level: 3
type: representation
name: Represent a proportional relationship with y = kx
statement: A proportional relationship with constant of proportionality k is represented by the equation
  y = kx, with the variables naming the two quantities.
procedure:
- Name the variables for the two quantities, y for the one expressed per unit of the other.
- Find the constant of proportionality k.
- Write y = kx.
assess: Total cost t is proportional to the number n of notebooks bought at $2.25 each. Write an equation
  for t in terms of n.
sources:
  ccss:
  - 7.RP.A.2
  - 7.RP.A.2.c
  learning_components:
  - 0070d7c9
  - 91a4d15a
requires:
- clause: standard
  all_of:
  - node: proportional-relationship.constant
    relation: definitional
    points_to: statement
    why: The equation y = kx has the constant of proportionality k as its coefficient, so the meaning
      of k is used in the statement.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variables
    relation: procedural
    points_to: procedure.1
    why: Naming a variable for each quantity and writing the product kx uses writing expressions with
      variables.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: proportional-relationship.constant.from-values
    relation: procedural
    points_to: procedure.2
    why: Finding k from a table or description, such as $2.25 per notebook, is the second step of the
      procedure.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Finding k from a table or description is one source of k; the constant may instead
        come from a graph, a diagram, or be stated.'
    status: disputed
status: proposed
