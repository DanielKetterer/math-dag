id: surface-area.prism.from-dimensions
concept: surface-area
facet: core
level: 3
type: procedure
name: Find the surface area of a right prism from its base and height
statement: The surface area of a right prism is the sum of the areas of its two congruent bases and of
  its rectangular side faces; each side face has one side of the base as one dimension and the prism's
  height as the other.
procedure:
- Find the area of the base and double it.
- For each side of the base, multiply its length by the height of the prism.
- Add the doubled base area and all the side-face areas.
assess: A right prism is 10 cm long. Its bases are right triangles with sides 3 cm, 4 cm and 5 cm. Find
  its surface area.
sources:
  ccss:
  - 7.G.B.6
  learning_components:
  - 22098a76
