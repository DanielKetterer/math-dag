id: surface-area.rectangular-prism.from-dimensions
concept: surface-area
facet: core
level: 3
type: procedure
name: Find the surface area of a rectangular prism from its length, width and height
statement: A right rectangular prism has three pairs of identical faces, l by w, l by h and w by h, so
  its surface area is twice the sum of lw, lh and wh.
procedure:
- Find the areas l x w, l x h and w x h of three faces that meet at one corner.
- Add the three areas.
- Double the sum.
assess: Without drawing a net, find the surface area of a right rectangular prism that is 5 cm long, 3
  cm wide and 2 cm tall.
