      source: critic-sonnet
      note: 'task-only: Only the test problem has the tent''s triangular end with a slanted side of 5
        ft beside the height of 4 ft that must be chosen.'
    status: proposed
  - node: shapes.prism.right.meaning
    relation: definitional
