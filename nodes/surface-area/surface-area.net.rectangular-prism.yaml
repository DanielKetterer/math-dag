id: surface-area.net.rectangular-prism
concept: surface-area
facet: core
level: 2
type: procedure
name: Find the surface area of a rectangular prism from its net
statement: The surface area of a right rectangular prism is the sum of the areas of the six rectangles
  in its net.
procedure:
- Find the area of each rectangle in the net.
- Add the six areas.
assess: 'A net of a box is made of six labeled rectangles: two are 5 cm by 3 cm, two are 5 cm by 2 cm,
  and two are 3 cm by 2 cm. Find the surface area of the box.'
