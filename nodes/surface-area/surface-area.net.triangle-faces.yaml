id: surface-area.net.triangle-faces
concept: surface-area
facet: core
level: 2
type: procedure
name: Find the surface area of a solid with triangular faces from its net
statement: The surface area of a solid whose net is made of rectangles and triangles, such as a triangular
  prism or a pyramid, is the sum of the areas of the rectangles and triangles in its net.
procedure:
- Find the area of each rectangle in the net.
- Find the area of each triangle in the net from its base and height.
- Add all the areas.
assess: A net of a square pyramid has a square base 4 cm on a side and four triangles, each with base
  4 cm and height 3 cm. Find the surface area of the pyramid.
sources:
  ccss:
  - 6.G.A.4
  learning_components:
  - eed1bb5e
  - 20ceb752
