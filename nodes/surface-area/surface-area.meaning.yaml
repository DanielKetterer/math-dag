id: surface-area.meaning
concept: surface-area
facet: core
level: 2
type: concept
name: Surface area as the total area of all faces
statement: The surface area of a solid with flat faces is the sum of the areas of all of its faces, measured
  in square units.
assess: 'Which tells the surface area of a closed box: (a) the area of its bottom, (b) the total area
  of all six of its faces, (c) the number of unit cubes that fill it, (d) the sum of its edge lengths?'
sources:
  ccss:
  - 6.G.A.4
  learning_components: []
