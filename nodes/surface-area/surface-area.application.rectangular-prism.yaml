id: surface-area.application.rectangular-prism
concept: surface-area
facet: core
level: 3
type: application
name: Solve real-world problems about the surface area of a box
statement: A real-world problem describes a closed box-shaped object by its length, width and height and
  asks how much material covers it; the learner finds its surface area.
assess: A gift box is 6 in long, 4 in wide and 2 in tall. How many square inches of paper cover it exactly,
  with no overlap?
