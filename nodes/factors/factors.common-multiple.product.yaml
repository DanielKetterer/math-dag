id: factors.common-multiple.product
concept: factors
facet: core
level: 3
type: concept
name: The product of two whole numbers is a common multiple
statement: For nonzero whole numbers a and b, the product a x b is a common multiple of a and b, though
  it need not be the least one.
assess: Without listing multiples, give a common multiple of 7 and 9, and explain how you know it is a
  multiple of each.
sources:
  ccss:
  - 6.NS.B.4
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: factors.common-multiple.meaning
    relation: definitional
    points_to: statement
    why: The statement claims a x b is a common multiple of a and b, which is a multiple of each of the
      two numbers.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: factors.multiple-of-each-factor
    relation: justificatory
    points_to: statement
    why: A x b has a and b as factors, and a whole number is a multiple of each of its factors, which
      shows a x b is a multiple of both.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.facts.within-100
    relation: procedural
    points_to: assess
    why: The test problem asks for a common multiple of 7 and 9, found as the product 7 x 9.
    scope: task
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement is for any nonzero whole numbers a and b; only the test problem
        needs the product 7 x 9.'
    status: proposed
status: proposed
