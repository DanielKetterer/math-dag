id: factors.multiple-of-each-factor
concept: factors
facet: core
level: 3
type: concept
name: A whole number is a multiple of each of its factors
statement: 'If d is a factor of n, then n is a multiple of d: n = d x k for a whole number k, so n is
  in the list d, 2 x d, 3 x d, ...'
assess: 6 is a factor of 42. Is 42 a multiple of 6? Explain using the factor pair.
