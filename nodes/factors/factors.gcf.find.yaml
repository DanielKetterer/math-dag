id: factors.gcf.find
concept: factors
facet: core
level: 3
type: procedure
name: Find the greatest common factor of two whole numbers
statement: The greatest common factor of two whole numbers up to 100 is the largest of their common factors;
  find it by listing the factors of each number and choosing the largest number on both lists.
procedure:
- List all factors of the first number from its factor pairs.
- List all factors of the second number the same way.
- Choose the largest number that appears on both lists.
assess: Find the greatest common factor of 36 and 48.
