id: factors.factor-pairs.find-all
concept: factors
facet: core
level: 3
type: procedure
name: Find all factor pairs of a whole number within 100
statement: List every factor pair of a whole number n from 1 to 100 by testing each whole number d from
  1 upward as a factor, stopping once d x d is greater than n, because in every pair the smaller factor
  d has d x d no greater than n.
procedure:
- Start with 1 x n.
- For each next whole number d, decide whether n divided by d is a whole number; if it is, record d x
  (n divided by d).
- Stop as soon as d x d is greater than n; any further pair would repeat one already recorded.
assess: Find all the factor pairs of 48.
