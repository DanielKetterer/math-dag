id: factors.lcm.find
concept: factors
facet: core
level: 3
type: procedure
name: Find the least common multiple of two whole numbers
statement: The least common multiple of two nonzero whole numbers up to 12 is the smallest nonzero common
  multiple; find it by listing the multiples of the greater number in order until one is also a multiple
  of the smaller number.
procedure:
- 'List the multiples of the greater number in order: 1 times it, 2 times it, 3 times it, and so on.'
- For each one, decide whether it is a multiple of the smaller number.
- The first one that is a multiple of the smaller number is the least common multiple.
assess: Find the least common multiple of 6 and 8.
