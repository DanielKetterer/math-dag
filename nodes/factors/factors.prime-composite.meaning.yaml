id: factors.prime-composite.meaning
concept: factors
facet: core
level: 3
type: concept
name: Prime and composite numbers
statement: A whole number greater than 1 is prime if its only factors are 1 and itself, and composite
  if it has a factor other than 1 and itself; 1 is neither prime nor composite.
assess: 13 has the factor pairs 1 x 13 only. 15 has the factor pairs 1 x 15 and 3 x 5. Which is prime
  and which is composite? Is 1 prime?
