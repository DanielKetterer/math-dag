id: parity.even-odd.pairing
concept: parity
facet: pairing
level: 1
type: concept
name: Even and odd as pairing with none or one left over
statement: A collection has an even number of objects when its objects can be put into pairs with none
  left over, and an odd number when one object is left over.
assess: Here are 13 counters. Put them in pairs. Is 13 even or odd? How do you know?
sources:
  ccss:
  - 2.OA.C.3
  learning_components:
  - 80e6e23a
  - 85cc2d51
requires: []
root_reason: Putting objects into pairs and seeing whether one is left over is itself the primitive act;
  no earlier skill in the map is required to pair concrete counters, and the number 13 is given in the
  test problem.
status: proposed
