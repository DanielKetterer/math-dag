id: cross-section.prism.parallel-to-base
concept: cross-section
facet: core
level: 2
type: concept
name: Slicing a rectangular prism parallel to its base
statement: A plane parallel to a base of a right rectangular prism slices it in a rectangle of the same
  size and shape as the base.
assess: A box 6 cm long, 4 cm wide and 10 cm tall is sliced halfway up by a plane parallel to its base.
  Describe the cross-section and give its dimensions.
sources:
  ccss:
  - 7.G.A.3
  learning_components:
  - feecfb2f
  - 851942b6
requires:
- clause: standard
  all_of:
  - node: cross-section.meaning
    relation: definitional
    points_to: statement
    why: The result is described as the cross-section, the flat figure where the plane meets the solid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.prism.right.meaning
    relation: definitional
    points_to: statement
    why: The solid being sliced is a right rectangular prism, with a base and faces at right angles to
      it.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: parallel.meaning
    relation: definitional
    points_to: statement
    why: The statement names the slicing plane as parallel to the base, so it never meets the base.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.compare.same-different
    relation: definitional
    points_to: statement
    why: The cross-section is said to be the same size and shape as the base, which means comparing whole
      shapes.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.name.prototype.rectangle-hexagon
    relation: definitional
    points_to: statement
    why: Naming the cross-section as a rectangle is all the statement uses.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: parallel.planes
    relation: definitional
    points_to: statement
    why: parallel.meaning covers lines; the statement needs a plane parallel to a plane, which the index
      does not name.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
