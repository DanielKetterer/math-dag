id: cross-section.pyramid.parallel-to-base
concept: cross-section
facet: core
level: 2
type: concept
name: Slicing a rectangular pyramid parallel to its base
statement: A plane parallel to the base of a right rectangular pyramid, between the base and the apex,
  slices it in a rectangle with the same shape as the base and a smaller size, smaller the nearer the
  plane is to the apex.
assess: A pyramid has a square base 6 cm on a side. It is sliced by a plane parallel to the base, part
  way up. What shape is the cross-section, and is it larger or smaller than the base?
sources:
  ccss:
  - 7.G.A.3
  learning_components:
  - feecfb2f
  - 851942b6
requires:
- clause: standard
  all_of:
  - node: cross-section.meaning
    relation: definitional
    points_to: statement
    why: The result is described as the cross-section, the flat figure where the plane meets the solid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.pyramid.meaning
    relation: definitional
    points_to: statement
    why: The solid being sliced is a right rectangular pyramid, with a rectangular base and an apex.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: parallel.meaning
    relation: definitional
    points_to: statement
    why: The statement names the slicing plane as parallel to the base, so it never meets the base.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.match
    relation: definitional
    points_to: statement
    why: The cross-section is said to have the same shape as the base but a smaller size, an informal
      idea of same shape.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: The statement needs same shape, smaller size in the informal sense of scaled copies;
        it is not clear whether shapes.match covers that or only matching the same kind of shape.'
    status: disputed
  - node: shapes.name.prototype.rectangle-hexagon
    relation: definitional
    points_to: statement
    why: Naming the cross-section as a rectangle is all the statement uses.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: parallel.planes
    relation: definitional
    points_to: statement
    why: parallel.meaning covers lines; the statement needs a plane parallel to a plane, which the index
      does not name.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
