      source: critic-sonnet
      note: missing prerequisite
    status: disputed
  - node: perpendicular.planes
    relation: definitional
    points_to: statement
    why: perpendicular.meaning covers lines; the statement needs a plane perpendicular to a plane, which
      the index does not name.
    evidence:
