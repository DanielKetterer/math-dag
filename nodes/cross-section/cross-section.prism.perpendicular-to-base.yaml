id: cross-section.prism.perpendicular-to-base
concept: cross-section
facet: core
level: 2
type: concept
name: Slicing a rectangular prism perpendicular to its base
statement: A plane perpendicular to a base of a right rectangular prism, crossing the base, slices it
  in a rectangle whose height is the prism's height and whose width is the length of the cut across the
  base.
assess: A box has a 6 cm by 8 cm base and is 5 cm tall. A plane perpendicular to the base slices it along
  a diagonal of the base, which is 10 cm long. Describe the cross-section and give its dimensions.
sources:
  ccss:
  - 7.G.A.3
  learning_components:
  - feecfb2f
  - 08434f52
  - 4fa7e2b4
  - 851942b6
requires:
- clause: standard
  all_of:
  - node: cross-section.meaning
    relation: definitional
    points_to: statement
    why: The result is described as the cross-section, the flat figure where the plane meets the solid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.prism.right.meaning
    relation: definitional
    points_to: statement
    why: The solid being sliced is a right rectangular prism, with a base and faces at right angles to
      it.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: perpendicular.meaning
    relation: definitional
    points_to: statement
    why: The statement names the slicing plane as perpendicular to the base, meeting it at right angles.
    evidence:
