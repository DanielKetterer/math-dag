id: cross-section.pyramid.perpendicular-to-base
concept: cross-section
facet: core
level: 2
type: concept
name: Slicing a rectangular pyramid perpendicular to its base
statement: A plane perpendicular to the base of a right rectangular pyramid and parallel to one side of
  the base slices it in a triangle when the plane passes through the apex, and in a trapezoid when it
  does not.
assess: A right rectangular pyramid is sliced by a plane perpendicular to its base and parallel to one
  side of the base. What shape is the cross-section if the plane passes through the apex? If it misses
  the apex?
sources:
  ccss:
  - 7.G.A.3
  learning_components:
  - feecfb2f
  - 08434f52
  - 4fa7e2b4
  - 851942b6
requires:
- clause: standard
  all_of:
  - node: cross-section.meaning
    relation: definitional
    points_to: statement
    why: The result is described as the cross-section, the flat figure where the plane meets the solid.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.pyramid.meaning
    relation: definitional
    points_to: statement
    why: The solid being sliced is a right rectangular pyramid, with a rectangular base and an apex.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: perpendicular.meaning
    relation: definitional
    points_to: statement
    why: The statement names the slicing plane as perpendicular to the base, meeting it at right angles.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: parallel.meaning
    relation: definitional
    points_to: statement
    why: The slicing plane is also parallel to one side of the base, so it never meets that side's line.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.polygon.name-by-sides
    relation: definitional
    points_to: statement
    why: The cross-section through the apex is named as a triangle by its three sides.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.quadrilateral.parallel-sides.define
    relation: definitional
    points_to: statement
    why: The cross-section that misses the apex is named as a trapezoid, a quadrilateral with a pair of
      parallel sides.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: perpendicular.planes
    relation: definitional
    points_to: statement
    why: The statement needs a plane perpendicular to a plane and parallel to a line; the index names
      only parallel and perpendicular lines.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    status: disputed
status: proposed
