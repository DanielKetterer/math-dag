id: cross-section.prism.oblique
concept: cross-section
facet: core
level: 2
type: concept
name: Slicing a rectangular prism at a slant
statement: A plane that is neither parallel nor perpendicular to the base of a right rectangular prism
  can slice it in a triangle, a quadrilateral, a pentagon or a hexagon, according to how many faces it
  crosses.
assess: A slanted plane cuts off one corner of a box, crossing only the three faces that meet at that
  corner. What shape is the cross-section?
sources:
  ccss:
  - 7.G.A.3
  learning_components:
  - 4c290798
requires:
- clause: standard
  all_of:
  - node: cross-section.side-per-face
    relation: justificatory
    points_to: statement
    why: The number of sides of the cross-section equals the number of faces the slanted plane crosses.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.prism.right.meaning
    relation: definitional
    points_to: statement
    why: The solid being sliced is a right rectangular prism, with a base and faces at right angles to
      it.
    evidence:
