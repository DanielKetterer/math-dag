id: transformation.reflection.parallel-to-axis.coordinates
concept: transformation
facet: coordinate
level: 2
type: procedure
name: Find the coordinates of the image of a polygon reflected across a line x = h or y = k
statement: Find the coordinates of the image of a polygon reflected across a vertical line x = h or a
  horizontal line y = k by moving each vertex to the point the same distance from the line on the other
  side, keeping the other coordinate.
procedure:
- For each vertex, find its horizontal distance to the line x = h, or its vertical distance to the line
  y = k.
- Move the same distance past the line on the other side, keeping the other coordinate the same, and record
  the image vertex.
- Join the image vertices in the same order.
assess: Triangle ABC has vertices A(1, 1), B(3, 1), and C(1, 4). Give the coordinates of the vertices
  of its image after a reflection across the line x = 5.
sources:
  ccss:
  - 8.G.A.3
  learning_components:
  - 6827617f
requires:
