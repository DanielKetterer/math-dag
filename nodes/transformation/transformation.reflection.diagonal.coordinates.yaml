id: transformation.reflection.diagonal.coordinates
concept: transformation
facet: coordinate
level: 3
type: procedure
name: Find the coordinates of the image of a polygon reflected across y = x or y = -x
statement: Find the coordinates of the image of a polygon reflected across the line y = x with the rule
  (x, y) -> (y, x), or across the line y = -x with the rule (x, y) -> (-y, -x).
procedure:
- For a reflection across y = x, swap the two coordinates of each vertex.
- For a reflection across y = -x, swap the two coordinates of each vertex and change the sign of both.
- Join the image vertices in the same order.
assess: Triangle ABC has vertices A(1, 2), B(1, 5), and C(3, 2). Give the coordinates of the vertices
  of its image after a reflection across the line y = -x.
