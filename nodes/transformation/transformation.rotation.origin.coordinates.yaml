id: transformation.rotation.origin.coordinates
concept: transformation
facet: coordinate
level: 3
type: procedure
name: Find the coordinates of the image of a polygon rotated about the origin by a multiple of 90 degrees
statement: Find the coordinates of the image of a polygon rotated about the origin by a multiple of 90
  degrees with the rules (x, y) -> (-y, x) for 90 degrees counterclockwise, (x, y) -> (-x, -y) for 180
  degrees, and (x, y) -> (y, -x) for 90 degrees clockwise.
procedure:
- 'Choose the rule for the angle and direction: 90 degrees counterclockwise (the same as 270 degrees clockwise)
  is (x, y) -> (-y, x); 180 degrees is (x, y) -> (-x, -y); 90 degrees clockwise (the same as 270 degrees
  counterclockwise) is (x, y) -> (y, -x).'
- Apply the rule to each vertex.
- Join the image vertices in the same order.
assess: Triangle ABC has vertices A(1, 1), B(4, 1), and C(1, 3). Give the coordinates of the vertices
  of its image after a rotation of 90 degrees counterclockwise about the origin.
