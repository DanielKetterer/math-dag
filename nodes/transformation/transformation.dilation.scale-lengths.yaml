id: transformation.dilation.scale-lengths
concept: transformation
facet: geometric
level: 3
type: concept
name: A dilation multiplies every length by the scale factor
statement: A dilation with scale factor k multiplies every length in a figure by k, so it enlarges the
  figure when k > 1 and reduces it when k < 1; when k is not 1 it changes lengths, so it is not a rigid
  motion.
assess: A dilation has scale factor 1/2. A segment in the figure is 4 cm long. How long is the image of
  the segment, and is this dilation a rigid motion?
sources:
  ccss:
  - 8.G.A.3
  learning_components:
  - e8c6b8a4
requires:
- clause: standard
  all_of:
  - node: transformation.dilation.meaning
    relation: definitional
    points_to: statement
    why: The statement extends the dilation definition, which scales distances from the center, to every
      length in a figure.
    evidence:
    - kind: content
