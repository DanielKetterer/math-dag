    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.scaling.size-principle
    relation: definitional
    points_to: statement
    why: The statement says a factor above 1 enlarges and a factor below 1 reduces, which is the scaling
      size principle.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
