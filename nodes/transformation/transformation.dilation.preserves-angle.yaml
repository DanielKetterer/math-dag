id: transformation.dilation.preserves-angle
concept: transformation
facet: geometric
level: 3
type: concept
name: A dilation keeps angle measures the same
statement: A dilation takes every angle to an angle of the same measure, so the image of a figure has
  the same angle measures as the figure.
assess: Triangle ABC has angles of 30, 60, and 90 degrees. It is dilated with scale factor 3. Without
  measuring, what are the angle measures of the image triangle?
