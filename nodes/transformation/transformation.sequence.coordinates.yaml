id: transformation.sequence.coordinates
concept: transformation
facet: coordinate
level: 2
type: procedure
name: Find the coordinates of the image of a polygon after a sequence of rigid motions
statement: Find the coordinates of the image of a polygon after a sequence of translations, reflections,
  and rotations by applying each motion, in the given order, to the image produced by the one before.
procedure:
- Apply the first motion to each vertex and record the image vertices.
- Apply the next motion to those image vertices, not to the original figure.
- Repeat until every motion in the sequence has been applied; the last set of vertices is the final image.
assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 4). It is reflected across the x-axis, and
  the image is then translated 3 units left. Give the coordinates of the vertices of the final image.
