id: transformation.reflection.axis.coordinates.image
concept: transformation
facet: coordinate
level: 2
type: procedure
name: Find the coordinates of the image of a polygon reflected across an axis
statement: Find the coordinates of the image of a polygon reflected across the x-axis or the y-axis by
  moving each vertex to the point the same distance from the axis on the other side.
procedure:
- For each vertex, find its distance from the axis of reflection.
- Locate the point the same distance from the axis on the other side, on the line through the vertex perpendicular
  to the axis, and record its coordinates.
- Join the image vertices in the same order.
assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 5). Give the coordinates of the vertices
  of its image after a reflection across the x-axis.
