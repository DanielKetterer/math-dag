id: transformation.rigid-motion.preserves-length.verify
concept: transformation
facet: geometric
level: 2
type: justification
name: Verify experimentally that rigid motions keep lengths
statement: Moving a tracing of a segment by translations, reflections, and rotations, and comparing each
  image with the original, shows experimentally that the image is always a segment of the same length.
assess: Trace segment AB on transparent paper. Translate the tracing, then reflect it, then rotate it,
  comparing the image with segment AB after each move. What do you find about the image, and how does
  the tracing show it?
sources:
  ccss:
