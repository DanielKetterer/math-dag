id: transformation.rigid-motion.preserves-parallel
concept: transformation
facet: geometric
level: 3
type: concept
name: Rigid motions take parallel lines to parallel lines
statement: A translation, reflection, or rotation, or any sequence of them, takes two parallel lines to
  two parallel lines and two lines that meet to two lines that meet.
assess: Lines m and n are parallel; lines p and q meet at a point. All four lines are rotated 50 degrees
  about a point, and the images are then reflected across a line. Without drawing, which pair of final
  image lines is parallel?
