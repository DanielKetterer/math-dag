id: root.cube.perfect-cube.evaluate
concept: root
facet: cube
level: 3
type: procedure
name: Evaluate the cube root of a perfect cube up to 1000
statement: 'For a perfect cube p from 1 to 1000, find the cube root of p: the whole number from 1 to 10
  whose cube is p.'
procedure:
- Recall a cube equal to p, or locate p between two known cubes and try the whole numbers between their
  roots.
- Check by cubing that the number found gives p.
assess: Find the cube root of 343 and the cube root of 1000.
