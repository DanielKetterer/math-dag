id: absolute-value.vs-order.context
concept: absolute-value
facet: magnitude
level: 2
type: application
name: Tell order statements from size statements about signed quantities in context
statement: A real-world problem states the order of a negative quantity, such as an account balance less
  than -30 dollars, and asks what it says about the quantity's size, here a debt greater than 30 dollars.
assess: Maya's account balance is less than -30 dollars. Is her debt more than or less than 30 dollars?
  Explain.
