id: absolute-value.distance.application
concept: absolute-value
facet: distance
level: 3
type: application
name: Solve real-world problems about how far apart two signed values are
statement: A real-world problem gives two signed values of the same kind, such as two elevations, temperatures
  or balances, and asks how far apart they are, answered by the absolute value of their difference.
assess: A plane flies at 850 m above sea level and a submarine is at -125 m. How far apart vertically
  are they?
sources:
  ccss:
  - 7.NS.A.1.c
  learning_components:
  - '34863269'
requires:
- clause: standard
  all_of:
  - node: absolute-value.distance.between-numbers
    relation: definitional
    points_to: statement
    why: The problem is answered by the absolute value of the difference of the two values, which is the
      distance rule.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: rational-number.subtraction.integers
    relation: procedural
    points_to: statement
    why: The answer needs the difference of 850 and -125, a subtraction of a negative integer from a positive
      one.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
