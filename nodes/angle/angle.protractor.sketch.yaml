      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: angle.meaning
    relation: definitional
    points_to: statement
    why: The procedure draws an angle from a vertex and two rays, so an angle as two rays from a common
      endpoint is used.
    evidence:
