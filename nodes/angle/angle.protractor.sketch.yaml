id: angle.protractor.sketch
concept: angle
facet: measure
level: 2
type: procedure
name: Draw an angle of a given measure with a protractor
statement: Draw an angle of a given whole-number degree measure by drawing one ray, placing a protractor
  with its center on the endpoint and 0 on the ray, marking the given measure on that scale, and drawing
  the second ray through the mark.
procedure:
- Draw a ray to be one side of the angle.
- Place the protractor's center on the ray's endpoint with the 0 mark of one scale on the ray.
- Mark a point at the given number of degrees on that same scale.
- Draw a ray from the endpoint through the mark.
assess: Use a protractor to draw an angle of 70 degrees.
sources:
  ccss:
  - 4.MD.C.6
  learning_components:
  - a25d6fc5
requires:
- clause: via-measure
  all_of:
  - node: angle.measure.degrees
    relation: definitional
    points_to: statement
    why: The given measure in degrees is marked on the scale, so degrees as a count of one-degree angles
      is used.
    evidence:
