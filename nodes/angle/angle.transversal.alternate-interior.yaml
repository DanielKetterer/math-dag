id: angle.transversal.alternate-interior
concept: angle
facet: measure
level: 3
type: concept
name: Alternate interior angles at parallel lines cut by a transversal are equal
statement: When a transversal crosses two parallel lines, alternate interior angles, the angles between
  the two lines on opposite sides of the transversal, have equal measures.
assess: Line t crosses lines m and n. Angle 3 is between m and n, left of t, at the crossing with m; angle
  6 is between m and n, right of t, at the crossing with n; angle 3 measures 110 degrees. In diagram 1,
  m and n are parallel; in diagram 2, they are not. In which diagram must angle 6 measure 110 degrees?
