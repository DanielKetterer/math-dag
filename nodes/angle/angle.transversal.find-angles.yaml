      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: angle.straight-line.sum-180
    relation: procedural
    points_to: procedure.2
    why: Step 2 gives each angle next to the given one on a line the supplement of it, since adjacent
