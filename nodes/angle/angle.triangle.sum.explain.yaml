id: angle.triangle.sum.explain
concept: angle
facet: measure
level: 4
type: justification
name: Explain with a parallel line why the angles of a triangle add to 180 degrees
statement: The line through one vertex parallel to the opposite side makes two angles at that vertex that
  are alternate interior angles with the other two angles of the triangle; these two angles and the triangle's
  angle at that vertex form a straight angle, so the three angles of the triangle add to 180 degrees.
assess: Triangle ABC is drawn with the line through C parallel to AB. Use this line to explain why angle
  A + angle B + angle C = 180 degrees for every triangle.
