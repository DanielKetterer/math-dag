id: angle.one-degree
concept: angle
facet: measure
level: 2
type: concept
name: The one-degree angle
statement: A one-degree angle is an angle that turns through 1/360 of a circle, so 360 one-degree angles
  fill a full turn.
assess: What fraction of a full circle does a one-degree angle turn through? How many one-degree angles
  fit around a full circle?
