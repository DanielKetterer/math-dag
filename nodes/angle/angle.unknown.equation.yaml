id: angle.unknown.equation
concept: angle
facet: measure
level: 2
type: representation
name: Write an equation for an unknown angle on a diagram
statement: An unknown angle in a decomposed angle on a diagram is represented by an addition or subtraction
  equation that uses a symbol for the unknown measure.
assess: On this diagram, angle PQR is marked 120 degrees. Ray QS splits it, and angle PQS is marked 50
  degrees; angle SQR is unknown. Write an equation with a symbol for the measure of angle SQR. Do not
  solve it.
