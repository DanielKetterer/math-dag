id: angle.triangle.exterior
concept: angle
facet: measure
level: 3
type: concept
name: An exterior angle of a triangle equals the sum of the two remote interior angles
statement: An exterior angle of a triangle, formed by one side and the extension of an adjacent side,
  has a measure equal to the sum of the two interior angles that are not next to it.
assess: 'In triangle ABC, side BC is extended past C to point D. Which is always true: angle ACD = angle
  A + angle B; angle ACD = 180 degrees - angle A; angle ACD = angle B + angle ACB?'
sources:
  ccss:
  - 8.G.A.5
  learning_components:
  - b9325562
