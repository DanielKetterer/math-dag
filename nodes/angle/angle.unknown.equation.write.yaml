id: angle.unknown.equation.write
concept: angle
facet: measure
level: 3
type: representation
name: Write an equation for an unknown angle from an angle relationship
statement: 'When angle measures in a figure are given as expressions in an unknown, an angle relationship
  gives an equation: the measures of supplementary angles, or of adjacent angles along a straight line,
  add to 180; of complementary angles add to 90; vertical angles are equal.'
assess: Angles ABD and DBC are adjacent, and A, B and C lie on a straight line. Angle ABD measures 2x
  degrees and angle DBC measures (x + 30) degrees. Write an equation for x. Do not solve it.
sources:
  ccss:
  - 7.G.B.5
  learning_components:
  - 779be2f1
requires:
- clause: standard
  all_of:
  - node: angle.straight-line.sum-180
    relation: definitional
    points_to: statement
    why: Adjacent angles along a straight line give an equation whose sides add to 180.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: angle.supplementary
    relation: definitional
    points_to: statement
    why: Supplementary angles give an equation whose measures add to 180.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: angle.complementary
    relation: definitional
    points_to: statement
    why: Complementary angles give an equation whose measures add to 90.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: angle.vertical.equal
    relation: definitional
    points_to: statement
    why: Vertical angles give an equation that sets the two measures equal.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: angle.unknown.equation
    relation: representational
    points_to: statement
    why: Writing an equation with an unknown for an angle on a diagram is extended here to measures given
      as expressions.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.variable.meaning
    relation: representational
    points_to: statement
    why: The angle measures are given with a letter that stands for an unknown number.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.equal-sign.meaning
    relation: definitional
    points_to: statement
    why: The relationship is written as an equation, which says both sides have the same value.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: expressions.notation.implicit-multiplication
    relation: representational
    points_to: assess
    why: The measure 2x in the test problem is a number next to a letter, which means multiply.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement does not commit to a product such as 2x; only the test problem has
        the measure 2x, which must be read as 2 times x.'
    status: proposed
status: proposed
