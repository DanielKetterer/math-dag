id: angle.draw-by-type
concept: angle
facet: figure
level: 2
type: procedure
name: Draw a right, acute, or obtuse angle
statement: Draw an angle of a named type by drawing two rays from a common endpoint and checking the opening
  against a square corner.
procedure:
- Draw a ray.
- Place a square corner at the ray's endpoint with one edge along the ray.
- For a right angle, draw the second ray along the other edge of the square corner.
- For an acute angle, draw the second ray from the endpoint inside the square corner.
- For an obtuse angle, draw the second ray from the endpoint between the other edge of the square corner
  and the extension of the first ray backward through its endpoint.
assess: Draw an obtuse angle with its vertex at point P.
