id: angle.additive
concept: angle
facet: measure
level: 2
type: concept
name: Angle measure is additive
statement: When an angle is split into non-overlapping angles that share its vertex, the measure of the
  whole angle is the sum of the measures of the parts.
assess: Ray BD lies inside angle ABC and splits it into angle ABD, which measures 30 degrees, and angle
  DBC, which measures 45 degrees. Without measuring, what is the measure of angle ABC?
