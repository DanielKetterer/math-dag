id: angle.measure.circle-fraction
concept: angle
facet: measure
level: 2
type: concept
name: Angle measure as the fraction of a circle between the rays
statement: An angle is measured by the fraction of a circle, centered at the vertex, that lies between
  its two rays; the measure does not depend on the size of the circle or the lengths of the rays.
assess: Two angles are drawn, one with long rays and a large circle centered at its vertex, one with short
  rays and a small circle. In each, the rays cut off 1/8 of the circle. Are the two angles the same size?
  Why?
sources:
