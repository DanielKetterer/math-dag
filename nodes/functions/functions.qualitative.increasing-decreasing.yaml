id: functions.qualitative.increasing-decreasing
concept: functions
facet: covariation
level: 2
type: representation
name: Describe where a graphed relationship is increasing, decreasing, or constant
statement: From a graph relating two quantities, describe the intervals of the input over which the output
  increases, decreases, or stays the same as the input increases.
assess: The graph shown gives the height of a hot-air balloon over 60 minutes. Describe in words when
  the height increases, stays the same, and decreases.
sources:
  ccss:
  - 8.F.B.5
  learning_components:
  - 13cc406a
requires:
- clause: standard
  all_of:
  - node: coordinate-plane.application.interpret
    relation: representational
    points_to: statement
    why: The graph relates two quantities, so each point must be read as a pair of values in the situation,
      such as a time and a height.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: data.table-graph.read-values
    relation: representational
    points_to: statement
    why: Describing a graph means reading output values at inputs along the horizontal axis and seeing
      how they change.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: relationship.dependent-independent.meaning
    relation: definitional
    points_to: statement
    why: Output and input are the dependent and independent quantities, with the input on the horizontal
      axis.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
