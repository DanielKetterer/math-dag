id: functions.qualitative.linear-nonlinear
concept: functions
facet: covariation
level: 2
type: representation
name: Tell from a graph where a relationship changes at a constant or a changing rate
statement: From a graph relating two quantities, tell the intervals where the relationship is linear (the
  graph is straight, so the output changes at a constant rate) and where it is nonlinear (the graph curves,
  so the rate changes).
assess: The graph shown gives the distance a car has traveled over 10 minutes. Over which interval does
  the car travel at a constant speed, and over which is its speed changing?
