id: functions.identify.table
concept: functions
facet: rule
level: 3
type: procedure
name: Decide from a table of pairs whether a relationship is a function
statement: A table or list of input-output pairs fits a function exactly when no input is paired with
  two different outputs; the same output may appear for different inputs.
procedure:
- Look for any input that appears more than once.
- If a repeated input has two different outputs, the relationship is not a function; otherwise the listed
  pairs fit a function.
assess: 'Does each table show y as a function of x? Table 1: (1, 3), (2, 5), (1, 4). Table 2: (1, 3),
  (2, 3), (3, 3).'
