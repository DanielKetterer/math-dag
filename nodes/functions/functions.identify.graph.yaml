id: functions.identify.graph
concept: functions
facet: graph
level: 3
type: procedure
name: Decide from a graph whether y is a function of x
statement: A graph in the coordinate plane shows y as a function of x exactly when no vertical line meets
  it in more than one point, since two points on one vertical line are one input with two outputs.
procedure:
- Picture vertical lines placed across the whole graph.
- If some vertical line meets the graph in two or more points, y is not a function of x; otherwise it
  is.
assess: 'Which of these graphs show y as a function of x: a circle; a V shape opening upward; a vertical
  line; a horizontal line?'
