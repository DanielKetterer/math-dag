id: addition.notation.equation
concept: addition
facet: operation
level: 2
type: representation
name: Write an addition equation for a joining situation
statement: The equation a + b = c records that joining an amount b to an amount a makes the amount c.
assess: 'Write an equation for: 4 ducks were in a pond, 2 more came, and now there are 6 ducks.'
sources:
  ccss:
  - K.OA.A.1
  learning_components:
  - 2ad5b1aa
requires:
- clause: standard
  all_of:
  - node: addition.notation.expression
    relation: representational
    points_to: statement
    why: The equation a + b = c extends the expression a + b by recording the amount made when b joins
      a.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: addition.add-to.describe
    relation: definitional
    points_to: statement
    why: The result c is the amount named as how many there are now after the joining action.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: numeral.write
    relation: representational
    points_to: statement
    why: The equation also records the total c as a written numeral after the equal sign.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
