id: addition.near-doubles
concept: addition
facet: operation
level: 3
type: procedure
name: Add by using a known double
statement: 'When two addends are close, rewrite the sum as the double of the smaller addend plus the difference
  between them: a + (a + d) = (a + a) + d.'
procedure:
- Identify the smaller addend a and how much larger the other addend is, d.
- Recall the double a + a.
- Add d to the double.
assess: Find 6 + 7 by using 6 + 6. Show the steps.
sources:
  ccss:
  - 1.OA.C.6
  learning_components:
  - 690addcb
