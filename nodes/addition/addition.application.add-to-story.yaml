id: addition.application.add-to-story
concept: addition
facet: add-to
level: 1
type: application
name: Solve add-to story problems with objects
statement: A story tells of a starting amount and an amount added to it and asks for the result; the learner
  acts the story out with objects or fingers and finds how many there are in all.
assess: '''Mia has 2 stickers. Her friend gives her 3 more stickers. How many stickers does Mia have now?''
  (counters available). Credit 5.'
sources:
  ccss:
  - K.OA.A.2
  learning_components: []
  prek:
  - elof.p-math-6
requires:
- clause: standard
  all_of:
  - node: addition.add-to.count-all
    relation: definitional
    points_to: statement
    why: Acting the story out with objects to find how many in all is joining the starting amount and
      the added amount and counting everything.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'A14 keep: Kept after review discussion 2026-10-19 (Daniel accepted the pushback): the node
        is acting out with objects or fingers; recalled facts and counting on are different nodes (RULES
        3.1). | Daniel: REJECT as universal; retain as a route: Joining sets and counting all is one way
        to solve an add-to story, but counting on or recalling a known fact can also work.'
    status: reviewed
  - node: counting.produce-set
    relation: definitional
    points_to: statement
    why: The story gives the amounts as numbers (2 stickers, 3 more), so the learner must build sets of
      those sizes.
    evidence:
    - kind: content
      source: critic-sonnet
      note: missing prerequisite
    - kind: review
      source: DK
      note: 'D78 keep: KEEP as a task-/route-scoped edge: Constructing sets from the story''s numbers
        is a natural object-modeling route, but prebuilt sets, fingers, or known facts can bypass it.'
    status: reviewed
status: proposed
