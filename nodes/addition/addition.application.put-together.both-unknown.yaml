id: addition.application.put-together.both-unknown
concept: addition
facet: put-together
level: 1
type: application
name: Solve put-together story problems with both parts unknown
statement: A story gives only the total of two kinds and asks how many of each there could be; any split
  of the total into two parts is an answer, and there are several.
assess: Grandma has 6 flowers. Some are red and some are yellow. How many red and how many yellow could
  there be? Use objects or a drawing to find two different answers.
