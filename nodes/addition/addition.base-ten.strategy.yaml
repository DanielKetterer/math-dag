level: 3
type: procedure
name: Add within 1000 by partial sums, without a model
statement: Add two to four numbers within 1000, without blocks or drawings, by adding the hundreds, the
  tens, and the ones separately and then combining the partial sums.
procedure:
- Split each addend into hundreds, tens, and ones.
- Add all the hundreds, add all the tens, and add all the ones.
- Add the partial sums.
assess: 'Without blocks or drawings, find 367 + 258 by partial sums: add the hundreds, the tens, and the
  ones, then combine.'
