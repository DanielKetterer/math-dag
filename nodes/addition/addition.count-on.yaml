id: addition.count-on
concept: addition
facet: add-to
level: 2
type: procedure
name: Add by counting on
statement: To find a + b, start from the number a without recounting it and say the next b number words,
  keeping track of how many have been said; the last word said is a + b.
procedure:
- Say the first addend a.
- Say the next number word and track it as 1 counted on; continue, tracking 2, 3, and so on.
- Stop when b words have been counted on; the last word said is the sum.
assess: Find 8 + 3 by counting on from 8. Do not count out 8 first.
sources:
  ccss:
  - 1.OA.C.5
  learning_components:
  - 60239d6d
requires:
