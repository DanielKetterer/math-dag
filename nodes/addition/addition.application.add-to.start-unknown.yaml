id: addition.application.add-to.start-unknown
concept: addition
facet: add-to
level: 2
type: application
name: Solve add-to story problems with the start unknown
statement: A story gives how many were added and the final amount, and asks how many there were at the
  start; the answer is the number that, with the added amount joined to it, makes the final amount.
assess: Some birds were on a wire. 5 more birds landed. Then there were 13 birds. How many birds were
  on the wire at first? Use objects, a drawing, or an equation.
sources:
  ccss:
  - 1.OA.A.1
  - 2.OA.A.1
  learning_components:
  - fe904c98
  - 17aaf480
  - c1129849
  - ecfbb806
requires:
- clause: equation
  all_of:
  - node: addition.application.add-to-story
    relation: definitional
    points_to: statement
    why: The story is an add-to situation that the learner already solves with objects when the result
      is unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.unknown.addition
    relation: procedural
    points_to: statement
    why: The answer is the number that makes the final amount when the added amount joins it, which is
      the unknown first addend.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Solving the unknown-addend equation is needed only on the equation route.'
    status: disputed
  - node: equation.situation.one-step
    relation: representational
    points_to: statement
    why: The learner writes ? + 5 = 13 with a symbol in the start position.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Writing the equation is needed only on the equation route.'
    status: disputed
- clause: via-meaning
  all_of:
  - node: addition.application.add-to-story
    relation: definitional
    points_to: statement
    why: The story is an add-to situation that the learner already solves with objects when the result
      is unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.unknown-addend.meaning
    relation: justificatory
    points_to: statement
    why: The start is the number that with the added 5 makes 13, so it is 13 - 5.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Reasoning that the start is 13 - 5 needs the unknown-addend meaning and a subtraction
        method; the task allows objects or drawings instead. | other route: Objects route using subtraction.take-away.count-remaining.'
    status: disputed
- clause: via-count-remaining
  all_of:
  - node: addition.application.add-to-story
    relation: definitional
    points_to: statement
    why: The story is an add-to situation that the learner already solves with objects when the result
      is unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.take-away.count-remaining
    relation: procedural
    points_to: statement
    why: With objects, make the final amount, take away the part that joined, and count what is left.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Taking away the part that joined with objects is one way to find the start. |
        other route: Equation route: equation.situation.one-step and equation.unknown.addition.'
    status: disputed
status: proposed
