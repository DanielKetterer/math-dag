id: addition.base-ten.explain
concept: addition
facet: base-ten
level: 4
type: justification
name: Explain a place-value addition strategy with properties
statement: Adding by place value gives the correct sum because splitting the addends into place-value
  parts and regrouping those parts uses only the commutative and associative properties of addition, which
  never change a sum.
assess: Explain why 47 + 38 = (40 + 30) + (7 + 8), naming the property of addition used at each step.
