id: addition.two-digit.like-units
concept: addition
facet: base-ten
level: 2
type: concept
name: Add tens to tens and ones to ones
statement: When adding with a two-digit number, the total number of tens is the sum of the tens of the
  addends and the total number of ones is the sum of their ones; tens are never added to ones.
assess: Use base-ten blocks for 42 + 35. How many tens are there in all? How many ones?
sources:
  ccss:
