  all_of:
  - node: place-value.two-digit.tens-ones
    relation: definitional
    points_to: statement
    why: The statement treats a two-digit number as a number of tens and a number of ones that are added
      separately.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
