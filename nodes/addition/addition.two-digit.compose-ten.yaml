id: addition.two-digit.compose-ten
concept: addition
facet: base-ten
level: 2
type: concept
name: Compose a ten when the ones total 10 or more
statement: When the ones in a sum total 10 or more, ten of those ones are regrouped as one ten, so the
  sum has one more ten and 10 fewer ones; the value is unchanged.
assess: Blocks for 38 + 5 show 3 tens and 13 ones. Trade 10 ones for 1 ten. How many tens and how many
  ones are there now?
