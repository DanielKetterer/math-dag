id: addition.base-ten.compose-unit
concept: addition
facet: base-ten
level: 2
type: concept
name: Compose a ten or a hundred when adding
statement: Ten ones make one ten and ten tens make one hundred, so when the units of one place total 10
  or more, 10 of them can be traded for 1 unit of the next larger place without changing the number.
assess: After joining blocks you have 5 tens and 13 ones. Trade so that no place has 10 or more units.
  How many tens and ones do you have, and is it the same number?
