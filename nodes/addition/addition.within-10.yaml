id: addition.within-10
concept: addition
facet: operation
level: 1
type: procedure
name: Find a sum within 10
statement: 'Find the sum of two whole numbers whose total is at most 10, by any reliable method: joining
  objects, fingers or a drawing and counting, counting on, or a known fact.'
assess: What is 4 + 3? Show or tell how you know.
sources:
  ccss:
  - K.OA.A.2
  learning_components:
  - 10c58598
requires:
- clause: via-count-all
  all_of:
  - node: addition.add-to.count-all
    relation: procedural
    points_to: statement
    why: Joining two sets of objects and counting them all finds the sum, one route.
    evidence:
    - kind: review
      source: DK
      note: 'C64, D74 add: Daniel: methods named as routes to a sum within 10.'
    - kind: review
      source: DK
      note: 'C64, D74 set_routes: Daniel: no unconditional verbal edge; count all, fingers, or count on
        each find the sum. Recall is not a route: fluency needs this node.'
    status: reviewed
  - node: addition.notation.expression
    relation: representational
    points_to: assess
    why: The test problem is written as 4 + 3, so the learner must read the addition expression with its
      plus sign.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: Only the test problem is written with a plus sign; the statement just asks for
        the sum of two numbers by any method.'
    - kind: review
      source: DK
      note: 'C64, D74 set_routes: Daniel: no unconditional verbal edge; count all, fingers, or count on
        each find the sum. Recall is not a route: fluency needs this node.'
    status: reviewed
  - node: counting.objects
    relation: procedural
    points_to: statement
    why: Every method named, from joining objects to counting on, finds the result by counting a collection
      to find how many.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    - kind: review
      source: DK
      note: 'C64, D74 set_routes: Daniel: no unconditional verbal edge; count all, fingers, or count on
        each find the sum. Recall is not a route: fluency needs this node.'
    status: reviewed
- clause: via-fingers
