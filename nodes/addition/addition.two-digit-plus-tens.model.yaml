id: addition.two-digit-plus-tens.model
concept: addition
facet: operation
level: 2
type: procedure
name: Add a multiple of 10 to a two-digit number with a base-ten model
statement: To add a multiple of 10 to a two-digit number with base-ten blocks or a drawing, join the tens
  to the tens; the ones do not change. The sum is within 100.
procedure:
- Show the two-digit number as tens and ones.
- Add the tens of the multiple of 10 to the tens.
- Read the new number of tens and the unchanged ones.
assess: Use base-ten blocks or a drawing of tens and ones to find 46 + 30.
