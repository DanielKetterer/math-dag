id: addition.two-digit-plus-one-digit.model
concept: addition
facet: operation
level: 2
type: procedure
name: Add a one-digit number to a two-digit number with a base-ten model
statement: To add a one-digit number to a two-digit number with base-ten blocks or a drawing, join ones
  to ones; if there are 10 or more ones, trade ten ones for a ten. The sum is within 100.
procedure:
- Show the two-digit number as tens and ones, and the one-digit number as ones.
- Join the ones.
- If there are 10 or more ones, trade ten of them for one ten.
- Read the number of tens and ones.
assess: Use base-ten blocks or a drawing of tens and ones to find 38 + 5.
