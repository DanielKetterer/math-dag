id: addition.two-digit-plus-tens.split-tens
concept: addition
facet: operation
level: 3
type: procedure
name: Add a multiple of 10 by splitting off the ones
statement: 'Write the two-digit number as its tens plus its ones, add the multiple of 10 to the tens,
  then add back the ones: (t + u) + m = (t + m) + u, which holds by the commutative and associative properties.'
procedure:
- Write the two-digit number as tens plus ones (46 = 40 + 6).
- Add the multiple of 10 to the tens (40 + 30 = 70).
- Add the ones back on (70 + 6 = 76).
assess: Find 46 + 30 without blocks by splitting 46 into tens and ones. Show the split.
