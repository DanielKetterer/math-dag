id: addition.application.put-together.addend-unknown
concept: addition
facet: put-together
level: 2
type: application
name: Solve put-together/take-apart story problems with one part unknown
statement: A story gives a total made of two kinds and the size of one part, with no action, and asks
  for the other part; the answer is the total minus the known part.
assess: There are 15 balls in a box. 8 are red and the rest are blue. How many are blue? Use objects,
  a drawing, or an equation.
sources:
  ccss:
  - 1.OA.A.1
  - 2.OA.A.1
  learning_components:
  - 17aaf480
  - fe904c98
  - c1129849
  - ecfbb806
requires:
- clause: via-meaning
  all_of:
  - node: addition.application.put-together.total-unknown
    relation: definitional
    points_to: statement
    why: The story is a put-together situation with two parts and a total, solved before when the total
      was the unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.unknown-addend.meaning
    relation: justificatory
    points_to: statement
    why: The other part is the total minus the known part because the known part plus the other part makes
      the total.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: 'route-only: Reasoning ''total minus known part'' uses the unknown-addend meaning; the task
        allows objects instead. | other route: Objects route using subtraction.take-away.count-remaining.'
    status: disputed
- clause: equation
  all_of:
  - node: addition.application.put-together.total-unknown
    relation: definitional
    points_to: statement
    why: The story is a put-together situation with two parts and a total, solved before when the total
      was the unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: equation.unknown.addition
    relation: procedural
    points_to: assess
    why: Finding the number of blue balls is finding the addend that makes 15 with 8 in an addition equation.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Solving the unknown-addend equation is needed only on the equation route.'
    status: disputed
  - node: equation.situation.one-step
    relation: representational
    points_to: statement
    why: The learner writes 8 + ? = 15 with a symbol in the position of the unknown part.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Writing the equation is needed only on the equation route.'
    status: disputed
- clause: via-count-remaining
  all_of:
  - node: addition.application.put-together.total-unknown
    relation: definitional
    points_to: statement
    why: The story is a put-together situation with two parts and a total, solved before when the total
      was the unknown.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: subtraction.take-away.count-remaining
    relation: procedural
    points_to: statement
    why: With objects, set aside the known part of the total and count what is left as the other part.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: Setting aside the known part with objects is one way to find the other part.
        | other route: Equation route: equation.situation.one-step and equation.unknown.addition.'
    status: disputed
status: proposed
