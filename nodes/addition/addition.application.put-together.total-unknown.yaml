id: addition.application.put-together.total-unknown
concept: addition
facet: put-together
level: 1
type: application
name: Solve put-together story problems with the total unknown
statement: A story gives two parts that are together at once, with no joining action, and asks for the
  total; the learner finds it with objects or a drawing.
assess: There are 3 red apples and 4 green apples in a bowl. How many apples are in the bowl? Use counters
  or a drawing.
sources:
  ccss:
  - K.OA.A.2
  - 1.OA.A.1
  learning_components:
  - f22b9881
  - eb90163e
  - fe904c98
requires:
- clause: standard
  all_of:
  - node: addition.add-to.count-all
    relation: procedural
    points_to: assess
    why: Finding the total of the red and green apples means putting the two groups together and counting
      all of them.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.produce-set
    relation: procedural
    points_to: assess
    why: Showing each part with counters or a drawing means counting out a set of the given number for
      each part.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
status: proposed
