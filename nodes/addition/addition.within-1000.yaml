id: addition.within-1000
concept: addition
facet: operation
level: 3
type: procedure
name: Add within 1000
statement: Find the sum of two whole numbers when the sum is at most 1000, accurately and without objects,
  by any reliable method; a place-value strategy and the standard algorithm both meet it.
assess: Find 367 + 258 and 499 + 306. Use any method.
