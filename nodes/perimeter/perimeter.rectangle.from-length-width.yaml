id: perimeter.rectangle.from-length-width
concept: perimeter
facet: core
level: 3
type: procedure
name: Find the perimeter of a rectangle from its length and width
statement: Because opposite sides of a rectangle are equal, its perimeter is the sum of two lengths and
  two widths, so it can be found when only the length and width are given.
assess: A rectangle is 9 cm long and 4 cm wide, and only those two sides are labeled. What is its perimeter?
sources:
