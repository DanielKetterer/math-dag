id: perimeter.missing-side
concept: perimeter
facet: core
level: 3
type: procedure
name: Find an unknown side length from the perimeter
statement: When the perimeter of a polygon and all but one of its side lengths are known, the unknown
  side is the perimeter minus the sum of the known sides.
assess: A quadrilateral has a perimeter of 30 cm. Three of its sides are 8 cm, 6 cm, and 9 cm. How long
  is the fourth side?
sources:
  ccss:
  - 3.MD.D.8
  learning_components:
  - ede10534
