id: perimeter.rectangle.formula
concept: perimeter
facet: core
level: 3
type: concept
name: The perimeter formula for a rectangle
statement: A rectangle with length l and width w has perimeter P = 2 x l + 2 x w, because its opposite
  sides are equal, so it has two sides of each length.
assess: 'A rectangle has length l and width w. Which expression gives its perimeter: l x w, l + w, 2 x
  l + 2 x w, or 4 x l?'
sources:
  ccss:
  - 4.MD.A.3
  learning_components:
  - 1a91a235
requires:
- clause: via-from-length-width
  all_of:
  - node: perimeter.meaning
    relation: definitional
    points_to: statement
    why: The formula gives the length around the rectangle, so perimeter as the distance around a figure
      is used.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: shapes.rectangle.opposite-sides-equal
    relation: justificatory
    points_to: statement
    why: The because-clause says opposite sides of a rectangle are equal, so there are two sides of each
      length.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: multiplication.equal-groups.meaning
    relation: representational
    points_to: statement
    why: The term 2 x l writes two equal sides of length l as two equal groups.
    evidence:
    - kind: content
      source: pass-P
