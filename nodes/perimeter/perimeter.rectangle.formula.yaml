      note: necessary
    status: proposed
  - node: perimeter.rectangle.from-length-width
    relation: definitional
    points_to: statement
    why: The formula 2 x l + 2 x w generalizes adding the four side lengths of a rectangle found from
      its length and width.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'route-only: The formula generalizes adding l, w, l, w, but the same formula can be reached
        from summing the sides of any polygon plus opposite sides being equal. | other route: Start from
        perimeter.polygon.from-sides (add all side lengths) and shapes.rectangle.opposite-sides-equal,
        then write the sum as 2 x l + 2 x w.'
    status: disputed
