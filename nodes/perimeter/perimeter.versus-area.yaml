id: perimeter.versus-area
concept: perimeter
facet: core
level: 2
type: concept
name: Tell perimeter from area
statement: Perimeter measures the length of a figure's boundary in length units; area measures how many
  unit squares cover it, in square units. They are different measures of the same figure.
assess: A rectangle drawn on a grid is 5 units long and 3 units wide. One of the numbers 15 and 16 is
  its area and the other is its perimeter. Which is which, and what is the unit of each?
sources:
  ccss:
  - 3.MD.D.8
  learning_components:
  - 1a101be5
  - bce565cf
requires:
