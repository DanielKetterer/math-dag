id: time.analog.five-minutes
concept: time
facet: clock
level: 2
type: procedure
name: Tell time to the nearest five minutes on an analog clock
statement: 'Read an analog clock to the nearest five minutes: the hour is the number the hour hand has
  most recently passed, and the minutes past the hour are found by counting by fives from 12 to the number
  nearest the minute hand.'
procedure:
- Find the number the hour hand has most recently passed; that is the hour.
- Find the number nearest the minute hand.
- Count by fives from 12 around to that number to get the minutes past the hour.
- Say or write the hour and the minutes.
assess: On this clock the long hand points to 7 and the short hand is a little past 4. What time is it?
