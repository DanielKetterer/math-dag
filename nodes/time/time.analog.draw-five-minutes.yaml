id: time.analog.draw-five-minutes
concept: time
facet: clock
level: 2
type: procedure
name: Show a time to five minutes on an analog clock
statement: A time h:mm, with mm a multiple of 5, is shown on an analog clock face by drawing the minute
  hand to the number reached by counting by fives from 12 to mm, and the hour hand between h and the next
  number, closer to h when mm is small and closer to the next number when mm is large.
procedure:
- Count by fives from 12 until reaching mm; draw the minute hand to that number.
- Draw the hour hand between h and the next number, positioned as far along as the minute hand is around
  the clock.
assess: Draw the hands on this blank clock face to show 7:20.
sources:
