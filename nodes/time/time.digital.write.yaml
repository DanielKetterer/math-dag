id: time.digital.write
concept: time
facet: clock
level: 2
type: representation
name: Write a time described in words as a digital time
statement: A time given in words is written as h:mm, with the hour before the colon and the minutes past
  the hour as two digits after it, so o'clock is written :00 and half past is written :30.
assess: Write 'twenty-five minutes past six' the way a digital clock shows it.
