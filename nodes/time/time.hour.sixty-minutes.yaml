id: time.hour.sixty-minutes
concept: time
facet: clock
level: 2
type: concept
name: An hour is 60 minutes
statement: In one hour the minute hand goes once around the clock, passing 60 minute marks, so an hour
  is 60 minutes; the minutes past an hour run from 0 to 59, and at 60 minutes the next hour begins.
assess: A clock shows 7:59. What time does it show one minute later? How many minutes are in one hour?
