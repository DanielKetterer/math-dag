id: time.am-pm
concept: time
facet: day
level: 2
type: concept
name: a.m. and p.m. name the two halves of a day
statement: a.m. names the times from midnight up to noon and p.m. names the times from noon up to midnight,
  so each clock reading happens twice a day and a.m. or p.m. tells which.
assess: School starts at 8:00 in the morning. Is that 8:00 a.m. or 8:00 p.m.?
sources:
