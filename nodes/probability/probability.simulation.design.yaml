id: probability.simulation.design
concept: probability
facet: relative-frequency
level: 2
type: procedure
name: Design a simulation for a compound event
statement: A simulation for a compound event uses a random device whose outcomes have the same probabilities
  as each stage of the real process, and states what one trial is and how to tell from a trial whether
  the event occurred.
procedure:
- Choose a random device, such as random digits, a spinner, or a number cube, and assign its outcomes
  so that each stage's outcomes have the right probabilities.
- Define one trial as the sequence of draws that plays out the whole compound process once.
- State the rule that decides from a trial's draws whether the event occurred.
assess: 40% of blood donors have type A blood. Design a simulation with random digits 0 to 9 for finding
  donors one at a time until one has type A blood. Say which digits stand for type A, what one trial is,
  and how to tell whether a trial needed at least 4 donors.
sources:
