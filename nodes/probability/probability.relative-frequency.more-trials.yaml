id: probability.relative-frequency.more-trials
concept: probability
facet: relative-frequency
level: 2
type: concept
name: More trials give a more reliable probability estimate
statement: As the number of trials of a chance process grows, the relative frequency of an event tends
  to get closer to its probability; with few trials it can be far from the probability.
assess: Ana tossed a paper cup 10 times and Ben tossed the same cup 500 times, each to estimate the probability
  that it lands on its side. Their estimates differ. Whose estimate is more likely to be close to the
  actual probability, and why?
