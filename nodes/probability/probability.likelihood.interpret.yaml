id: probability.likelihood.interpret
concept: probability
facet: likelihood
level: 2
type: concept
name: Interpret a probability as unlikely, neither, or likely
statement: A probability near 0 describes an unlikely event, a probability around 1/2 an event that is
  neither unlikely nor likely, and a probability near 1 a likely event; of two events, the one with the
  larger probability is the more likely.
assess: The probability of rain tomorrow is 0.9, the probability of snow is 0.05, and the probability
  a tossed coin lands heads is 1/2. Describe each event as unlikely, neither unlikely nor likely, or likely.
  Which of the three is most likely?
sources:
  ccss:
  - 7.SP.C.5
  learning_components:
  - f9c7d91a
