    relation: definitional
    points_to: statement
    why: The statement reads a probability as a number on the 0 to 1 scale of likelihood, with 0 impossible
      and 1 certain.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: decimal.compare
    relation: procedural
    points_to: assess
    why: The test problem gives 0.9 and 0.05 and asks which event is most likely, which compares these
      two decimals.
    scope: task
