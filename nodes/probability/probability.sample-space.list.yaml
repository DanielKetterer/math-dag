id: probability.sample-space.list
concept: probability
facet: equally-likely
level: 2
type: representation
name: Represent the sample space of a compound event with an organized list
statement: The sample space of a compound event is the set of all possible combinations of outcomes of
  its stages; an organized list records every combination once by fixing the outcome of the first stage
  and running through all outcomes of the later stages before changing it.
assess: A spinner with equal sections labeled 1, 2, and 3 is spun twice. Make an organized list of all
  possible outcomes.
sources:
