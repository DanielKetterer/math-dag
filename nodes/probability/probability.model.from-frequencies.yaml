id: probability.model.from-frequencies
concept: probability
facet: relative-frequency
level: 2
type: procedure
name: Develop a probability model from observed frequencies
statement: A probability model, which need not be uniform, is developed from data on a chance process
  by assigning each outcome its observed relative frequency; comparing these values shows whether the
  outcomes appear equally likely.
procedure:
- Record how many times each outcome occurred in many trials.
- Divide each count by the total number of trials to get each outcome's relative frequency.
- Assign each outcome its relative frequency as its approximate probability.
- Compare the probabilities to judge whether the outcomes appear equally likely.
assess: A paper cup was tossed 100 times. It landed on its side 70 times, open end up 20 times, and open
  end down 10 times. Give an approximate probability for each outcome. Do the three outcomes appear equally
  likely?
