related:
- node: probability.model.uniform.event
  relation: generalizes
  note: The target generalizes the uniform rule (k outcomes of probability 1/n sum to k/n) and mentions
    the count-over-total rule only to contrast it; the sum rule is not learned from the uniform rule alone
    and does not need it.
