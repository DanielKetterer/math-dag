    relation: definitional
    points_to: statement
    why: The model assigns each outcome a probability, a number from 0 to 1 that says how likely that
      outcome is.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.unit.part-whole
    relation: representational
    points_to: statement
    why: The probability assigned to each of n equally likely outcomes is written as the unit fraction
      1/n, one of n equal parts.
    evidence:
