id: probability.model.uniform.develop
concept: probability
facet: equally-likely
level: 2
type: concept
name: Develop a uniform probability model
statement: When the outcomes of a chance process are equally likely, a uniform probability model lists
  all n possible outcomes and assigns each one the probability 1/n.
assess: Spinner 1 has 5 equal sections labeled A, B, C, D, E. List the outcomes of one spin and give the
  probability of each. Spinner 2 has 3 sections, one of which is half of the circle. Would a uniform model
  fit spinner 2? Why or why not?
sources:
