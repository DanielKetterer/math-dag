id: probability.model.uniform.event
concept: probability
facet: equally-likely
level: 3
type: procedure
name: Find the probability of an event in a uniform model
statement: In a uniform probability model, the probability of an event is the number of outcomes in the
  event divided by the total number of outcomes.
procedure:
- Count the total number of equally likely outcomes.
- Count the outcomes that make up the event.
- Divide the number of outcomes in the event by the total number of outcomes.
assess: A student is selected at random from a class of 12 girls and 13 boys. What is the probability
  that a girl is selected?
sources:
  ccss:
  - 7.SP.C.7.a
  learning_components:
  - f578a7d0
