    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: counting.objects
    relation: procedural
    points_to: procedure.1
    why: Counting the total number of equally likely outcomes, and the outcomes in the event, is counting
