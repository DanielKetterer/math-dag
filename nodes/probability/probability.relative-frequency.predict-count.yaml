id: probability.relative-frequency.predict-count
concept: probability
facet: relative-frequency
level: 3
type: procedure
name: Predict about how often an event will occur from its probability
statement: If an event has probability p, then in n trials it is expected to occur about p x n times,
  and the actual number will usually be close to p x n but not exactly equal to it.
assess: The probability of rolling a 3 or a 6 on a number cube is 1/3. In 600 rolls, about how many times
  would you expect a 3 or a 6? Would you expect exactly that many?
sources:
  ccss:
  - 7.SP.C.6
  learning_components:
  - 0abcb12c
requires:
- clause: standard
  all_of:
  - node: probability.relative-frequency.estimate
    relation: definitional
    points_to: statement
    why: Expecting about p x n occurrences uses the relative frequency, count over n, being close to the
      probability p but not equal to it.
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: necessary
    status: proposed
  - node: fraction.multiply-whole.symbolic
    relation: procedural
    points_to: assess
    why: Finding p x n for a fractional probability such as 1/3 and n = 600 multiplies a fraction by a
      whole number.
    scope: task
    evidence:
    - kind: content
      source: pass-P
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'task-only: The statement is for any p; only the test problem uses a fractional p (1/3) times
        600. A decimal p would use decimal multiplication instead, so the fraction method is not required
        by the idea.'
    status: proposed
  - node: probability.relative-frequency.more-trials
    relation: definitional
    points_to: statement
    why: The claim that the actual number is usually close to p x n but not exactly equal rests on relative
      frequency varying around the probability.
    evidence:
    - kind: content
      source: pass-Q
    - kind: content
      source: critic-sonnet
      note: 'undecided: The ''usually close but not exactly equal'' clause could be taught from variation
        between repeated runs of the same n, without comparing few and many trials; or it could be taught
        as the more-trials idea itself.'
    status: disputed
status: proposed
