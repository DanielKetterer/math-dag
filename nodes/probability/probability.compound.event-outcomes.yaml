id: probability.compound.event-outcomes
concept: probability
facet: equally-likely
level: 2
type: procedure
name: Identify the outcomes that make up a compound event
statement: For a compound event described in everyday language, the outcomes that make it up are exactly
  the outcomes in the sample space for which the description is true.
procedure:
- Write or read the full sample space.
- Check each outcome against the description of the event.
- List the outcomes for which the description is true.
assess: Two number cubes are rolled. The sample space is the 36 ordered pairs (first cube, second cube),
  shown in a 6-by-6 table. List all the outcomes that make up the event 'at least one cube shows a 6'.
