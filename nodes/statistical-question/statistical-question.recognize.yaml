id: statistical-question.recognize
concept: statistical-question
facet: core
level: 2
type: concept
name: Recognize a statistical question
statement: A statistical question is one answered by collecting data that are expected to vary, with an
  answer that describes that variation; a question with one fixed answer is not statistical, even when
  it is about a group.
assess: Which of these are statistical questions? (a) How tall is the classroom door? (b) How many hours
  did each student in this class sleep last night? (c) How many students are in this class? (d) How old
  are the students in this school?
sources:
  ccss:
  - 6.SP.A.1
  learning_components:
  - 3fd3c652
requires: []
root_reason: Telling a question answered by varying data from a question with one fixed answer uses only
  everyday asking and answering about groups; no earlier skill in the map supplies it.
status: proposed
