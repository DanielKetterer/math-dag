# Clements and Sarama learning trajectories (Building Blocks / [LT]2).
#
# Secondary source used: Ontario Teachers' Federation reproduction of the
# trajectory tables, https://www.otffeo.on.ca/en/wp-content/uploads/sites/2/2017/05/Learning_trajectories_math.pdf
# Cross-check: Building Blocks handout (counting only, no ages),
# https://oldsite.earlychildhoodwebinars.com/wp-content/uploads/2013/11/Building-Blocks-Learning-Trajectories-handout-Clements-Sarama.pdf
# Retrieved: 2026-10-17
#
# Provenance: the Building Blocks developmental-levels document, the authors'
# own publication (McGraw-Hill), hosted by the Ontario Teachers' Federation; a
# copy is in sources/Learning_trajectories_math.pdf. Level names are as printed;
# `does` is a PARAPHRASE produced through the fetch tool. Ages are the
# document's approximate starting ages. Five load-bearing levels were
# spot-checked against the [LT]2 site export (sources/LT2.pdf) on 2026-10-17
# and match; [LT]2 is newer and fuller and is the first reference for writers.
# Naming differences in [LT]2: "Conceptual Subitizer to 5" (here "5+"),
# "Early Comparer of Dissimilar Items" (here "Nonverbal Comparer").
#
# Extraction scope: every level whose age starts at 6 or younger.
#
# band tags (added here, not the source's):
#   toddler   starts before 3
#   preschool starts at 3 or 4
#   k-overlap starts at 5 (Kindergarten age; Common Core K covers much of it)
#   beyond    starts at 6 or later
#
# Known artifacts in the reproduction: "Mental Number Line to 10" and "Serial
# Orderer to 6" appear twice (ages 5 and 6), and "Serial Orderer to 6" appears
# in both comparing and measuring. Kept as printed and flagged.
#
# How this source is used (design call, see VETTING.md): trajectory order is a
# typical developmental order. It goes into pathways/, where it can refute an
# edge. It does not confirm prerequisites.

source: clements-sarama
title: Clements and Sarama learning trajectories (Building Blocks developmental levels)
url: https://www.otffeo.on.ca/en/wp-content/uploads/sites/2/2017/05/Learning_trajectories_math.pdf
retrieved: 2026-10-17
provenance: authors-publication
does_kind: paraphrase

trajectories:
  counting:
    - {id: cs.counting.pre-counter, level: "Pre-Counter", age: "1-2", band: toddler, does: "Says some number words without meaning, skipping numbers."}
    - {id: cs.counting.chanter, level: "Chanter", age: "1-2", band: toddler, does: "Sing-songs number words without meaning."}
    - {id: cs.counting.reciter, level: "Reciter", age: "2", band: toddler, does: "Says number words as separate words, not reliably in order."}
    - {id: cs.counting.reciter-10, level: "Reciter (10)", age: "3", band: preschool, does: "Recites to 10, with some matching of words to objects but losing track."}
    - {id: cs.counting.corresponder, level: "Corresponder", age: "3", band: preschool, does: "Matches one count word to each object in a small line; recounts when asked how many."}
    - {id: cs.counting.counter-small, level: "Counter (Small Numbers)", age: "4", band: preschool, does: "Counts to 5 accurately and answers how many with the last word."}
    - {id: cs.counting.producer-small, level: "Producer - Counter To (Small Numbers)", age: "4", band: preschool, does: "Gives a set of up to 5 objects when asked for that number."}
    - {id: cs.counting.counter-10, level: "Counter (10)", age: "4-5", band: preschool, does: "Counts structured arrangements to 10; finds neighbor numbers only by counting from 1."}
    - {id: cs.counting.counter-producer-10plus, level: "Counter and Producer - Counter to (10+)", age: "5-6", band: k-overlap, does: "Counts and produces collections to 10 then to 30, keeping track of unorganized objects; spots counting errors."}
    - {id: cs.counting.backward-from-10, level: "Counter Backward from 10", age: "5-6", band: k-overlap, does: "Counts backward from 10."}
    - {id: cs.counting.counter-from-n, level: "Counter from N (N+1, N-1)", age: "6-7", band: beyond, does: "Counts on from numbers other than 1; names the number just before or after."}
    - {id: cs.counting.skip-10s, level: "Skip Counter by 10s to 100", age: "6-7", band: beyond, does: "Counts by tens to 100."}
    - {id: cs.counting.counter-100, level: "Counter to 100", age: "6-7", band: beyond, does: "Counts by ones to 100 across decade transitions."}
    - {id: cs.counting.on-using-patterns, level: "Counter On Using Patterns", age: "6-7", band: beyond, does: "Keeps track of a count-on with a pattern such as tapping."}
    - {id: cs.counting.skip-counter, level: "Skip Counter", age: "6-7", band: beyond, does: "Counts by 5s and 2s with understanding."}
    - {id: cs.counting.imagined-items, level: "Counter of Imagined Items", age: "6-7", band: beyond, does: "Counts hidden or imagined objects mentally."}
    - {id: cs.counting.on-keeping-track, level: "Counter On Keeping Track", age: "6-7", band: beyond, does: "Counts on 1 to 4 more from a given number, tracking the added count numerically."}
    - {id: cs.counting.quantitative-units, level: "Counter of Quantitative Units", age: "6-7", band: beyond, does: "Counts whole units in sets that mix wholes and parts."}
    - {id: cs.counting.counter-200, level: "Counter to 200", age: "6-7", band: beyond, does: "Counts past 200 using ones, tens, and hundreds patterns."}

  comparing-ordering-numbers:
    - {id: cs.compare.object, level: "Object", age: "2", band: toddler, does: "Pairs objects one-to-one with only an intuitive sense of equivalence."}
    - {id: cs.compare.perceptual, level: "Perceptual Comparer", age: "2", band: toddler, does: "Tells which of two very different-sized collections has more."}
    - {id: cs.compare.first-second-ordinal, level: "First-Second Ordinal Counter", age: "2-3", band: toddler, does: "Identifies the first and often the second item in a sequence."}
    - {id: cs.compare.nonverbal-similar, level: "Nonverbal Comparer of Similar Items", age: "3", band: preschool, does: "Recognizes equal small arrangements (1-4 items) as equal."}
    - {id: cs.compare.nonverbal-dissimilar, level: "Nonverbal Comparer of Dissimilar Items", age: "3", band: preschool, does: "Matches small equal collections made of different kinds of items."}
    - {id: cs.compare.matching, level: "Matching Comparer", age: "4", band: preschool, does: "Compares groups of 1-6 by one-to-one matching."}
    - {id: cs.compare.knows-to-count, level: "Knows-to-Count Comparer", age: "4", band: preschool, does: "Starts counting collections to compare them, not always accurately."}
    - {id: cs.compare.counting-same-size, level: "Counting Comparer (Same Size)", age: "4", band: preschool, does: "Compares small collections of same-size objects by counting."}
    - {id: cs.compare.counting-5, level: "Counting Comparer (5)", age: "5", band: k-overlap, does: "Compares by counting even with different-sized objects; finds how many more or fewer."}
    - {id: cs.compare.ordinal-counter, level: "Ordinal Counter", age: "5", band: k-overlap, does: "Uses ordinal numbers first through tenth."}
    - {id: cs.compare.counting-comparer, level: "Counting Comparer", age: "5", band: k-overlap, does: "Compares by counting even when the larger collection has smaller objects."}
    - {id: cs.compare.mental-number-line-10, level: "Mental Number Line to 10", age: "5 (also listed at 6)", band: k-overlap, flag: duplicate-in-reproduction, does: "Judges which of two numbers is closer to a target, or relative size, without objects."}
    - {id: cs.compare.serial-orderer-6, level: "Serial Orderer to 6", age: "5 (also listed at 6)", band: k-overlap, flag: duplicate-in-reproduction, does: "Orders lengths or collections marked in units from 1 to 6."}
    - {id: cs.compare.counting-10, level: "Counting Comparer (10)", age: "6", band: beyond, does: "Compares sets to 10 by counting, even with differently sized objects."}

  recognizing-number-subitizing:
    - {id: cs.subitize.small-collection-namer, level: "Small Collection Namer", age: "2", band: toddler, does: "Names groups of one or two, sometimes three."}
    - {id: cs.subitize.nonverbal, level: "Nonverbal Subitizer", age: "3", band: preschool, does: "After a brief glimpse of 1-4 items, makes a matching group without naming the number."}
    - {id: cs.subitize.maker-small, level: "Maker of Small Collections", age: "3", band: preschool, does: "Makes a nonverbal collection of up to 5 that matches another."}
    - {id: cs.subitize.perceptual-4, level: "Perceptual Subitizer to 4", age: "4", band: preschool, does: "Instantly names a briefly shown collection of up to 4."}
    - {id: cs.subitize.perceptual-5, level: "Perceptual Subitizer to 5", age: "5", band: k-overlap, does: "Instantly names a briefly shown collection of up to 5."}
    - {id: cs.subitize.conceptual-5plus, level: "Conceptual Subitizer to 5+", age: "5", band: k-overlap, does: "Names briefly shown arrangements to 5 by seeing their parts."}
    - {id: cs.subitize.conceptual-10, level: "Conceptual Subitizer to 10", age: "5", band: k-overlap, does: "Names most briefly shown arrangements to 10 by grouping."}
    - {id: cs.subitize.conceptual-20, level: "Conceptual Subitizer to 20", age: "6", band: beyond, does: "Names briefly shown structured arrangements to 20 by grouping."}

  composing-number:
    - {id: cs.compose.pre-part-whole, level: "Pre-Part-Whole Recognizer", age: "4", band: preschool, does: "Recognizes parts and wholes nonverbally, but the count of the whole is wrong."}
    - {id: cs.compose.inexact-part-whole, level: "Inexact Part-Whole Recognizer", age: "5", band: k-overlap, does: "Knows the whole is bigger than its parts, not by exactly how much."}
    - {id: cs.compose.composer-4-5, level: "Composer to 4, then 5", age: "5", band: k-overlap, does: "Quickly names the missing part or whole within 5."}
    - {id: cs.compose.composer-7, level: "Composer to 7", age: "6", band: beyond, does: "Knows combinations to 7; doubles to 10."}
    - {id: cs.compose.composer-10, level: "Composer to 10", age: "6", band: beyond, does: "Knows combinations to 10; doubles to 20."}

  adding-subtracting:
    - {id: cs.addsub.pre, level: "Pre +/-", age: "1", band: toddler, does: "Shows no sign of adding or subtracting."}
    - {id: cs.addsub.nonverbal, level: "Nonverbal +/-", age: "3", band: preschool, does: "Adds and subtracts very small sets nonverbally."}
    - {id: cs.addsub.small-number, level: "Small Number +/-", age: "4", band: preschool, does: "Finds sums for small joining problems by counting all with objects."}
    - {id: cs.addsub.find-result, level: "Find Result +/-", age: "5", band: k-overlap, does: "Solves joining and part-part-whole problems by modeling and counting all."}
    - {id: cs.addsub.find-change, level: "Find Change +/-", age: "5", band: k-overlap, does: "Finds a missing addend by adding objects; compares by matching."}
    - {id: cs.addsub.make-it-n, level: "Make It N +/-", age: "5", band: k-overlap, does: "Counts on from a given number to reach a target without starting at 1."}
    - {id: cs.addsub.counting-strategies, level: "Counting Strategies +/-", age: "6", band: beyond, does: "Solves join, part-whole, missing-addend, and compare problems by counting on or finger patterns."}
    - {id: cs.addsub.part-whole, level: "Part-Whole +/-", age: "6", band: beyond, does: "Uses flexible strategies and some derived facts; finds unknown starts by trial and error."}
    - {id: cs.addsub.numbers-in-numbers, level: "Numbers-in-Numbers +/-", age: "6", band: beyond, does: "Sees a number as part of a whole; solves unknown-start problems by counting."}

  multiplying-dividing:
    - {id: cs.muldiv.dumper, level: "Nonquantitative Sharer (Dumper)", age: "2", band: toddler, does: "Shares by giving some blocks to each person, unevenly."}
    - {id: cs.muldiv.beginning-grouper, level: "Beginning Grouper and Distributive Sharer", age: "3", band: preschool, does: "Makes small groups and deals out shares, usually between two people."}
    - {id: cs.muldiv.grouper-sharer, level: "Grouper and Distributive Sharer", age: "4", band: preschool, does: "Deals out equal shares to two or more people from small sets."}
    - {id: cs.muldiv.concrete-modeler, level: "Concrete Modeler x/div", age: "5", band: k-overlap, does: "Multiplies small numbers by making and counting groups; shares up to 20 objects informally."}
    - {id: cs.muldiv.parts-wholes, level: "Parts and Wholes x/div", age: "6", band: beyond, does: "Understands that more sharers means fewer objects per person."}

  measuring-length:
    - {id: cs.length.quantity-recognizer, level: "Length Quantity Recognizer", age: "3", band: preschool, does: "Recognizes length as an attribute."}
    - {id: cs.length.direct-comparer, level: "Length Direct Comparer", age: "4", band: preschool, does: "Lines up two objects to see which is longer or whether they are equal."}
    - {id: cs.length.indirect-comparer, level: "Indirect Length Comparer", age: "5", band: k-overlap, does: "Compares two lengths using a third object; may measure by counting without equal units."}
    - {id: cs.length.serial-orderer-6, level: "Serial Orderer to 6", age: "5", band: k-overlap, flag: also-listed-under-comparing, does: "Orders lengths marked in units from 1 to 6."}
    - {id: cs.length.end-to-end, level: "End-to-End Length Measurer", age: "6", band: beyond, does: "Lays units end to end, not necessarily equal units."}

  recognizing-shapes:
    - {id: cs.shapes.matcher, level: "Shape Matcher", age: "2", band: toddler, does: "Matches basic shapes of the same size and orientation, then different sizes and orientations."}
    - {id: cs.shapes.prototype, level: "Shape Prototype Recognizer and Identifier", age: "3", band: preschool, does: "Names prototypical circles and squares, sometimes triangles."}
    - {id: cs.shapes.matcher-more, level: "Shape Matcher - More Shapes", age: "3", band: preschool, does: "Matches a wider variety of shapes, first at the same size and orientation."}
    - {id: cs.shapes.recognizer-cst, level: "Shape Recognizer - Circles, Squares, and Triangles", age: "4", band: preschool, does: "Recognizes some non-prototypical squares and triangles."}
    - {id: cs.shapes.constructor-looks-like, level: "Constructor of Shapes from Parts - Looks Like", age: "4", band: preschool, does: "Builds a shape that looks like a goal shape."}
    - {id: cs.shapes.recognizer-rectangles, level: "Shape Recognizer - All Rectangles", age: "5", band: k-overlap, does: "Recognizes rectangles of many sizes and orientations."}
    - {id: cs.shapes.side-recognizer, level: "Side Recognizer", age: "5", band: k-overlap, does: "Identifies sides as distinct parts and counts them."}
    - {id: cs.shapes.angle-recognizer, level: "Angle Recognizer", age: "5", band: k-overlap, does: "Identifies angles as separate parts and counts them."}
    - {id: cs.shapes.recognizer, level: "Shape Recognizer", age: "5", band: k-overlap, does: "Recognizes most basic shapes and prototypical examples of others."}
    - {id: cs.shapes.identifier, level: "Shape Identifier", age: "6", band: beyond, does: "Names most common shapes including rhombi; distinguishes rectangles from parallelograms."}
    - {id: cs.shapes.angle-matcher, level: "Angle Matcher", age: "6", band: beyond, does: "Matches angles concretely by overlaying them."}

  composing-shapes:
    - {id: cs.compshape.pre-composer, level: "Pre-Composer", age: "2", band: toddler, does: "Handles shapes individually; cannot combine them."}
    - {id: cs.compshape.pre-decomposer, level: "Pre-DeComposer", age: "3", band: preschool, does: "Decomposes shapes only by trial and error."}
    - {id: cs.compshape.piece-assembler, level: "Piece Assembler", age: "4", band: preschool, does: "Makes pictures where each shape has a role and shapes touch; fills simple puzzles by trial and error."}
    - {id: cs.compshape.picture-maker, level: "Picture Maker", age: "5", band: k-overlap, does: "Puts several shapes together for one part of a picture, by trial and error."}
    - {id: cs.compshape.simple-decomposer, level: "Simple Decomposer", age: "5", band: k-overlap, does: "Takes apart simple shapes that have obvious clues."}
    - {id: cs.compshape.shape-composer, level: "Shape Composer", age: "5", band: k-overlap, does: "Composes shapes with anticipation, using angles, side lengths, turns, and flips."}
    - {id: cs.compshape.substitution, level: "Substitution Composer", age: "6", band: beyond, does: "Substitutes groups of shapes for other shapes to fill a frame in different ways."}
    - {id: cs.compshape.decomposer-help, level: "Shape Decomposer (with Help)", age: "6", band: beyond, does: "Decomposes shapes using imagery the task suggests."}

  comparing-shapes:
    - {id: cs.cmpshape.same-thing, level: "Same Thing Comparer", age: "3", band: preschool, does: "Says two real-world objects are the same or different."}
    - {id: cs.cmpshape.similar, level: "Similar Comparer", age: "4", band: preschool, does: "Judges shapes the same if they look more alike than different."}
    - {id: cs.cmpshape.part, level: "Part Comparer", age: "4", band: preschool, does: "Says shapes are the same after matching one side of each."}
    - {id: cs.cmpshape.some-attributes, level: "Some Attributes Comparer", age: "4", band: preschool, does: "Compares only part of the shapes, for example by overlaying top halves."}
    - {id: cs.cmpshape.most-attributes, level: "Most Attributes Comparer", age: "5", band: k-overlap, does: "Compares whole shapes but may ignore some spatial relationships."}

  spatial-sense-motions:
    - {id: cs.spatial.simple-turner, level: "Simple Turner", age: "4", band: preschool, does: "Mentally turns an object for easy tasks such as a 90-degree turn."}
    - {id: cs.spatial.beginning-motions, level: "Beginning Slider, Flipper, Turner", age: "5", band: k-overlap, does: "Uses the right motion but not always the right direction or amount."}
    - {id: cs.spatial.motions, level: "Slider, Flipper, Turner", age: "6", band: beyond, does: "Performs slides and flips, mostly horizontal and vertical, with manipulatives."}

  patterning:
    - {id: cs.pattern.pre-patterner, level: "Pre-Patterner", age: "2", band: toddler, does: "Does not recognize patterns."}
    - {id: cs.pattern.recognizer, level: "Pattern Recognizer", age: "3", band: preschool, does: "Recognizes a simple repeating pattern."}
    - {id: cs.pattern.fixer, level: "Pattern Fixer", age: "3-4", band: preschool, does: "Fills in a missing element of a pattern."}
    - {id: cs.pattern.duplicator-ab, level: "Pattern Duplicator AB", age: "4", band: preschool, does: "Duplicates an ABAB pattern next to the model."}
    - {id: cs.pattern.extender-ab, level: "Pattern Extender AB", age: "4", band: preschool, does: "Extends AB repeating patterns."}
    - {id: cs.pattern.duplicator, level: "Pattern Duplicator", age: "4", band: preschool, does: "Duplicates simple patterns in a different location."}
    - {id: cs.pattern.extender, level: "Pattern Extender", age: "5", band: k-overlap, does: "Extends simple patterns such as ABB."}

  classifying-data:
    - {id: cs.classify.similarity, level: "Similarity Recognizer", age: "2", band: toddler, does: "Sees two or more objects as similar."}
    - {id: cs.classify.informal-sorter, level: "Informal Sorter", age: "2", band: toddler, does: "Groups alike objects but switches criteria."}
    - {id: cs.classify.attribute-identifier, level: "Attribute Identifier", age: "3", band: preschool, does: "Names an attribute and groups objects sharing it; cannot re-sort by a new rule."}
    - {id: cs.classify.attribute-sorter, level: "Attribute Sorter", age: "4", band: preschool, does: "Sorts by a given attribute but may switch attributes mid-sort."}
    - {id: cs.classify.consistent, level: "Consistent Sorter", age: "5", band: k-overlap, does: "Sorts consistently by a given attribute."}
    - {id: cs.classify.exhaustive, level: "Exhaustive Sorter", age: "6", band: beyond, does: "Sorts consistently and exhaustively; uses some and all meaningfully."}
    - {id: cs.classify.multiple-attribute, level: "Multiple Attribute Sorter", age: "6", band: beyond, does: "Sorts exhaustively by one attribute, then re-sorts by another."}
