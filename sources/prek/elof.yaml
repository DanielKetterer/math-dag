# Head Start Early Learning Outcomes Framework (ELOF), Mathematics Development,
# preschoolers (36-60 months).
#
# Source page: https://headstart.gov/school-readiness/article/math-preschool
# Full framework PDF: https://www.govinfo.gov/content/pkg/GOVPUB-HE23_1100-PURL-gpo65456/pdf/GOVPUB-HE23_1100-PURL-gpo65456.pdf
# Retrieved: 2026-10-17
#
# Provenance: primary (federal framework, public domain).
# Text kinds: goal statements are verbatim. Progressions are PARAPHRASES produced
# through the fetch tool, not the framework's own wording. Check them against the
# PDF before a node cites one as wording; they are fine as content.
#
# Age bands are the framework's: 36-48 months, 48-60 months, and the indicator
# column "by 60 months".
#
# Coverage note: the ELOF math domain has no sorting/classifying goal for
# preschoolers. Sorting appears elsewhere in Head Start materials; the
# Clements-Sarama classifying trajectory is the source for it here.

source: elof
title: Head Start ELOF, Mathematics Development, Preschoolers
url: https://headstart.gov/school-readiness/article/math-preschool
retrieved: 2026-10-17
provenance: primary

items:
  # ---------- Counting and Cardinality ----------
  - id: elof.p-math-1
    subdomain: counting-and-cardinality
    goal: "Child knows number names and the count sequence."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "Says some number words in order up to 10, understanding they are separate words."}
      - {band: "48-60", text: "Says more number words in sequence."}
      - {band: "by-60", text: "Counts aloud or signs to at least 20 by ones."}
    progression_kind: paraphrase

  - id: elof.p-math-2
    subdomain: counting-and-cardinality
    goal: "Child recognizes the number of objects in a small set."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "Begins to recognize small groups without counting (subitizing)."}
      - {band: "48-60", text: "Quickly recognizes the number of objects in a small set."}
      - {band: "by-60", text: "Instantly recognizes up to five objects without counting and names the number."}
    progression_kind: paraphrase

  - id: elof.p-math-3
    subdomain: counting-and-cardinality
    goal: "Child understands the relationship between numbers and quantities."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "Begins to match counting words to objects in small lines, and to see that the last number counted gives the total."}
      - {band: "48-60", text: "Understands that number words refer to quantity; matches counting to objects up to 10 and beyond."}
      - {band: "by-60", text: "Counts objects to about 10 and answers how many; accurately counts up to five scattered objects; knows the last number said is the total."}
    progression_kind: paraphrase

  - id: elof.p-math-4
    subdomain: counting-and-cardinality
    goal: "Child compares numbers."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "With adult help, counts and compares small groups of similarly sized objects."}
      - {band: "48-60", text: "Compares amounts even when the objects differ in size; uses order and position words."}
      - {band: "by-60", text: "Tells whether one group has more, fewer, or the same as another for up to five objects; uses ordinal numbers first through tenth."}
    progression_kind: paraphrase

  - id: elof.p-math-5
    subdomain: counting-and-cardinality
    goal: "Child associates a quantity with written numerals up to 5 and begins to write numbers."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "Begins to understand that written numerals represent quantities; uses drawings or informal symbols."}
      - {band: "48-60", text: "Understands written numbers stand for quantities; uses tallies; with support writes some numerals up to 10."}
      - {band: "by-60", text: "Matches 0-5 objects to written numerals; with support recognizes and writes some numerals up to 10."}
    progression_kind: paraphrase

  # ---------- Operations and Algebraic Thinking ----------
  - id: elof.p-math-6
    subdomain: operations-and-algebraic-thinking
    goal: "Child understands addition as adding to and understands subtraction as taking away from."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "With adult support, adds and subtracts very small collections of objects."}
      - {band: "48-60", text: "Solves addition by joining and subtraction by separating, using objects and fingers."}
      - {band: "by-60", text: "Shows addition and subtraction in several ways; solves word problems; adds or subtracts up to five; begins counting on from the larger number with adult help."}
    progression_kind: paraphrase

  - id: elof.p-math-7
    subdomain: operations-and-algebraic-thinking
    goal: "Child understands simple patterns."
    text_kind: verbatim
    scope_flag: patterning (see VETTING.md, open question 3)
    progression:
      - {band: "36-48", text: "Recognizes simple patterns; with help completes them and repeats ABAB patterns."}
      - {band: "48-60", text: "Creates, identifies, extends, and copies simple repeating patterns with objects, numbers, sounds, and movements."}
      - {band: "by-60", text: "Fills in missing elements, copies patterns in new locations, extends patterns, identifies the repeating unit."}
    progression_kind: paraphrase

  # ---------- Measurement ----------
  - id: elof.p-math-8
    subdomain: measurement
    goal: "Child measures objects by their various attributes using standard and non-standard measurement. Uses differences in attributes to make comparisons."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "With adult support, begins to understand that attributes such as height can be compared."}
      - {band: "48-60", text: "With some support, uses measurable attributes to compare objects as same/different and more/less."}
      - {band: "by-60", text: "Measures with the same unit; orders up to five objects by an attribute such as height or weight; uses comparative words such as shortest and heaviest."}
    progression_kind: paraphrase

  # ---------- Geometry and Spatial Sense ----------
  - id: elof.p-math-9
    subdomain: geometry-and-spatial-sense
    goal: "Child identifies, describes, compares, and composes shapes."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "Names typical circles and squares, sometimes triangles; with help matches shapes of different sizes and orientations."}
      - {band: "48-60", text: "Compares more shapes of varied sizes and orientations; begins to identify sides and angles."}
      - {band: "by-60", text: "Names and describes shapes by sides and angles; identifies basic shapes regardless of size or orientation; sorts 2D and 3D shapes; builds shapes from parts."}
    progression_kind: paraphrase

  - id: elof.p-math-10
    subdomain: geometry-and-spatial-sense
    goal: "Child explores the positions of objects in space."
    text_kind: verbatim
    progression:
      - {band: "36-48", text: "Begins to understand spatial words; with help follows directions about own body position."}
      - {band: "48-60", text: "Increasingly understands spatial words and follows directions about own position."}
      - {band: "by-60", text: "Understands and uses words for direction, order, and position (up/down, in front/behind); follows directions such as move forward."}
    progression_kind: paraphrase
