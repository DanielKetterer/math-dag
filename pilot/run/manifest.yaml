# Run manifest: one entry per unit of work.
#
# A unit is one strand through one stage (research, writer, proposer-a,
# proposer-b, critic, merge). It is the smallest piece of work worth keeping on
# its own: if an agent dies, at most one unit is lost, and a restart redoes
# only that unit.
#
# Rules:
# - Only tools/run_state.py marks a unit done, and only when its validator
#   passes. An agent saying "finished" does not count.
# - Commit and push after every unit marked done. The commit message names the
#   unit and its token cost.
# - `tokens` is subagent tokens for that unit (0 for script or inline work).
#   The running total is computed by run_state.py, never typed by hand.
# - Agents append to their output file every ~10 nodes, so a dead agent leaves
#   a partial file. A restart continues from the last id in that file.
#
# Status values: pending | running | done | failed
# (run_state.py also reports `partial` when an output file exists but the unit
# is not done.)
#
# Usage:
#   python3 tools/run_state.py                 # status, running total, what can run next
#   python3 tools/run_state.py --mark UNIT done --tokens N --commit SHA
#   python3 tools/run_state.py --mark UNIT running

run: prek + fixes + big run phases 1-2
description: Pre-K floor of the map, from developmental sources; then the fixes run
  (12 nodes the pilot and pre-K reviews found missing, 2026-10-19).

# One strand (Daniel, 2026-10-17). The layer is about 38 nodes, inside the
# 30-60 batch size, and its prerequisites cross every topic line (comparing by
# counting needs cardinality, join-and-count needs counting), so every proposer
# must see the whole floor. Six strands would have paid the agent start-up cost
# 24 times and hidden cross-topic edges from the proposers.
strands:
  prek: counting sequence, one-to-one, small-number meanings, cardinality, producing sets, numerals; subitizing; comparing collections, ordinal words; joining and separating, composing number, fair sharing; length and other attributes, direct comparison, ordering by size; shape recognition, comparing and composing shapes, position words, motions; sorting by attribute; plus the K split of counting.objects. Patterning excluded (Daniel).

units:
  # ---------- research (inline, no subagents) ----------
  - id: prek.research.elof
    stage: research
    output: sources/prek/elof.yaml
    validate: source
    status: done
    tokens: 0
    commit: 3c60ee4
  - id: prek.research.clements-sarama
    stage: research
    output: sources/prek/clements_sarama.yaml
    validate: source
    status: done
    tokens: 0
    commit: 3c60ee4
  - id: prek.research.counting-principles
    stage: research
    output: sources/prek/counting_principles.yaml
    validate: source
    status: done
    tokens: 0
    commit: 3c60ee4
  - id: prek.research.vetting
    stage: review
    output: sources/prek/VETTING.md
    validate: exists
    status: done        # done when Daniel has answered the open questions
    tokens: 0

  # ---------- one strand: writer, two proposers, critic ----------
  # The writer waits on Daniel's vetting. Proposers wait on the writer. The
  # critic waits on both proposers.
  - {id: prek.writer, stage: writer, strand: prek, after: [prek.research.vetting], output: pilot/run/prek/prek.nodes.yaml, validate: writer, status: done, tokens: 157661, commit: e108677, usage_pct_week: 2, usage_note: "Daniel reading; includes Claude setup for the unit"}
  - {id: prek.proposer-a, stage: proposer-a, strand: prek, after: [prek.writer], output: pilot/run/prek/passes/P-prek.json, validate: proposer, status: done, tokens: 117278, commit: cac280f}
  - {id: prek.proposer-b, stage: proposer-b, strand: prek, after: [prek.writer], output: pilot/run/prek/passes/Q-prek.json, validate: proposer, status: done, tokens: 112638, commit: c0e094c}
  - {id: prek.critic, stage: critic, strand: prek, after: [prek.proposer-a, prek.proposer-b], output: pilot/run/prek/critic/verdicts-prek.json, validate: critic, status: done, tokens: 131643, usage_pct_week: 3, usage_note: "Daniel reading; covers proposer A, proposer B, critic, and merge together"}

