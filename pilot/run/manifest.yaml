# Run manifest: one entry per unit of work.
#
# A unit is one strand through one stage (research, writer, proposer-a,
# proposer-b, critic, merge). It is the smallest piece of work worth keeping on
# its own: if an agent dies, at most one unit is lost, and a restart redoes
# only that unit.
#
# Rules:
# - Only tools/run_state.py marks a unit done, and only when its validator
#   passes. An agent saying "finished" does not count.
# - Commit and push after every unit marked done. The commit message names the
#   unit and its token cost.
# - `tokens` is subagent tokens for that unit (0 for script or inline work).
#   The running total is computed by run_state.py, never typed by hand.
# - Agents append to their output file every ~10 nodes, so a dead agent leaves
#   a partial file. A restart continues from the last id in that file.
#
# Status values: pending | running | done | failed
# (run_state.py also reports `partial` when an output file exists but the unit
# is not done.)
#
# Usage:
#   python3 tools/run_state.py                 # status, running total, what can run next
#   python3 tools/run_state.py --mark UNIT done --tokens N --commit SHA
#   python3 tools/run_state.py --mark UNIT running

run: prek + fixes + big run phase 1
description: Pre-K floor of the map, from developmental sources; then the fixes run
  (12 nodes the pilot and pre-K reviews found missing, 2026-10-19).

# One strand (Daniel, 2026-10-17). The layer is about 38 nodes, inside the
# 30-60 batch size, and its prerequisites cross every topic line (comparing by
# counting needs cardinality, join-and-count needs counting), so every proposer
# must see the whole floor. Six strands would have paid the agent start-up cost
# 24 times and hidden cross-topic edges from the proposers.
strands:
  prek: counting sequence, one-to-one, small-number meanings, cardinality, producing sets, numerals; subitizing; comparing collections, ordinal words; joining and separating, composing number, fair sharing; length and other attributes, direct comparison, ordering by size; shape recognition, comparing and composing shapes, position words, motions; sorting by attribute; plus the K split of counting.objects. Patterning excluded (Daniel).

units:
  # ---------- research (inline, no subagents) ----------
  - id: prek.research.elof
    stage: research
    output: sources/prek/elof.yaml
    validate: source
    status: done
    tokens: 0
    commit: 3c60ee4
  - id: prek.research.clements-sarama
    stage: research
    output: sources/prek/clements_sarama.yaml
    validate: source
    status: done
    tokens: 0
    commit: 3c60ee4
  - id: prek.research.counting-principles
    stage: research
    output: sources/prek/counting_principles.yaml
    validate: source
    status: done
    tokens: 0
    commit: 3c60ee4
  - id: prek.research.vetting
    stage: review
    output: sources/prek/VETTING.md
    validate: exists
    status: done        # done when Daniel has answered the open questions
    tokens: 0

  # ---------- one strand: writer, two proposers, critic ----------
  # The writer waits on Daniel's vetting. Proposers wait on the writer. The
  # critic waits on both proposers.
  - {id: prek.writer, stage: writer, strand: prek, after: [prek.research.vetting], output: pilot/run/prek/prek.nodes.yaml, validate: writer, status: done, tokens: 157661, commit: e108677, usage_pct_week: 2, usage_note: "Daniel reading; includes Claude setup for the unit"}
  - {id: prek.proposer-a, stage: proposer-a, strand: prek, after: [prek.writer], output: pilot/run/prek/passes/P-prek.json, validate: proposer, status: done, tokens: 117278, commit: cac280f}
  - {id: prek.proposer-b, stage: proposer-b, strand: prek, after: [prek.writer], output: pilot/run/prek/passes/Q-prek.json, validate: proposer, status: done, tokens: 112638, commit: c0e094c}
  - {id: prek.critic, stage: critic, strand: prek, after: [prek.proposer-a, prek.proposer-b], output: pilot/run/prek/critic/verdicts-prek.json, validate: critic, status: done, tokens: 131643, usage_pct_week: 3, usage_note: "Daniel reading; covers proposer A, proposer B, critic, and merge together"}

  # ---------- merge (script, no subagents) ----------
  - id: prek.merge
    stage: merge
    after: [prek.critic]
    output: pilot/run/prek/merge_report.md
    validate: check
    status: done
    tokens: 0

  # ---------- fixes run (2026-10-19) ----------
  # One batch of 12 nodes the reviews found missing, written in the main session
  # (no subagent tokens). Proposers and critic run on this batch only.
  - {id: fixes.writer, stage: writer, strand: fixes, after: [prek.merge], output: pilot/run/fixes/batches/fixes.yaml, validate: writer, status: done, tokens: 0, commit: 555b0ea}
  - {id: fixes.proposer-a, stage: proposer-a, strand: fixes, after: [fixes.writer], output: pilot/run/fixes/passes/P-fixes.json, validate: proposer, status: done, tokens: 98236, commit: 22ba64c}
  - {id: fixes.proposer-b, stage: proposer-b, strand: fixes, after: [fixes.writer], output: pilot/run/fixes/passes/Q-fixes.json, validate: proposer, status: done, tokens: 93950, commit: c92695a}
  - {id: fixes.critic, stage: critic, strand: fixes, after: [fixes.proposer-a, fixes.proposer-b], output: pilot/run/fixes/critic/verdicts-fixes.json, validate: critic, status: done, tokens: 98545, commit: 2be64cf}
  - {id: fixes.merge, stage: merge, strand: fixes, after: [fixes.critic], output: pilot/run/fixes/merge_report.md, validate: check, status: done, tokens: 0, commit: 647b474}

  # ---------- big run, phase 1 (2026-10-19): K-5 number and operations ----------
  # Strands from tools/build_phase.py (PHASES["p1"]). Writers run in parallel;
  # then a script pass (ids, merge candidates, retired ids, index); then two
  # proposers per strand and one critic per strand, all on the full index.
  - {id: p1.N1.writer, stage: writer, strand: N1, after: [fixes.merge], input: pilot/run/p1/input/N1.json, output: pilot/run/p1/skeletons/N1.yaml, validate: writer-lc, status: done, tokens: 109385, commit: pending}
  - {id: p1.N2.writer, stage: writer, strand: N2, after: [fixes.merge], input: pilot/run/p1/input/N2.json, output: pilot/run/p1/skeletons/N2.yaml, validate: writer-lc, status: done, tokens: 112856, commit: pending}
  - {id: p1.N3.writer, stage: writer, strand: N3, after: [fixes.merge], input: pilot/run/p1/input/N3.json, output: pilot/run/p1/skeletons/N3.yaml, validate: writer-lc, status: done, tokens: 109085, commit: pending}
  - {id: p1.N4.writer, stage: writer, strand: N4, after: [fixes.merge], input: pilot/run/p1/input/N4.json, merged_lc: [cf6b4ff1], output: pilot/run/p1/skeletons/N4.yaml, validate: writer-lc, status: done, tokens: 113264, commit: pending}
  # Script pass after the writers: tools/prepare_phase.py (merges in pilot/run/p1/merges.md).
  - {id: p1.N1.proposer-a, stage: proposer-a, strand: N1, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/P-N1.json, validate: proposer, status: done, tokens: 122131, commit: pending}
  - {id: p1.N1.proposer-b, stage: proposer-b, strand: N1, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/Q-N1.json, validate: proposer, status: done, tokens: 122473, commit: pending}
  - {id: p1.N2.proposer-a, stage: proposer-a, strand: N2, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/P-N2.json, validate: proposer, status: pending, tokens: 0}
  - {id: p1.N2.proposer-b, stage: proposer-b, strand: N2, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/Q-N2.json, validate: proposer, status: pending, tokens: 0}
  - {id: p1.N3.proposer-a, stage: proposer-a, strand: N3, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/P-N3.json, validate: proposer, status: done, tokens: 126959, commit: pending}
  - {id: p1.N3.proposer-b, stage: proposer-b, strand: N3, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/Q-N3.json, validate: proposer, status: done, tokens: 127709, commit: pending}
  - {id: p1.N4.proposer-a, stage: proposer-a, strand: N4, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/P-N4.json, validate: proposer, status: pending, tokens: 0}
  - {id: p1.N4.proposer-b, stage: proposer-b, strand: N4, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/passes/Q-N4.json, validate: proposer, status: pending, tokens: 0}
  - {id: p1.N1.critic, stage: critic, strand: N1, after: [p1.N1.proposer-a, p1.N1.proposer-b, p1.N2.proposer-a, p1.N2.proposer-b, p1.N3.proposer-a, p1.N3.proposer-b, p1.N4.proposer-a, p1.N4.proposer-b], output: pilot/run/p1/critic/verdicts-N1.json, validate: critic, status: pending, tokens: 0}
  - {id: p1.N2.critic, stage: critic, strand: N2, after: [p1.N1.proposer-a, p1.N1.proposer-b, p1.N2.proposer-a, p1.N2.proposer-b, p1.N3.proposer-a, p1.N3.proposer-b, p1.N4.proposer-a, p1.N4.proposer-b], output: pilot/run/p1/critic/verdicts-N2.json, validate: critic, status: pending, tokens: 0}
  - {id: p1.N3.critic, stage: critic, strand: N3, after: [p1.N1.proposer-a, p1.N1.proposer-b, p1.N2.proposer-a, p1.N2.proposer-b, p1.N3.proposer-a, p1.N3.proposer-b, p1.N4.proposer-a, p1.N4.proposer-b], output: pilot/run/p1/critic/verdicts-N3.json, validate: critic, status: pending, tokens: 0}
  - {id: p1.N4.critic, stage: critic, strand: N4, after: [p1.N1.proposer-a, p1.N1.proposer-b, p1.N2.proposer-a, p1.N2.proposer-b, p1.N3.proposer-a, p1.N3.proposer-b, p1.N4.proposer-a, p1.N4.proposer-b], output: pilot/run/p1/critic/verdicts-N4.json, validate: critic, status: pending, tokens: 0}
  - {id: p1.merge, stage: merge, after: [p1.N1.critic, p1.N2.critic, p1.N3.critic, p1.N4.critic], output: pilot/run/p1/merge_report.md, validate: check, status: pending, tokens: 0}
  - {id: p1.retarget, stage: review, strand: retarget, after: [p1.N1.writer, p1.N2.writer, p1.N3.writer, p1.N4.writer], output: pilot/run/p1/retarget/out.json, validate: exists, status: done, tokens: 105649, note: "10 decimal edges moved by Claude from L2 model nodes to later-phase algorithm ids"}
