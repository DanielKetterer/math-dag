- id: measurement.time.tell-nearest-minute
  concept: measurement
  facet: time
  level: 2
  type: representation
  name: Tell and write time to the nearest minute
  statement: Read the time shown on an analog clock to the nearest minute, using the hour hand for the
    hour and the minute marks passed by the minute hand for the minutes, and write it as hours:minutes.
  assess: The hour hand is between 4 and 5 and the minute hand points to the second mark after the 7.
    What time does the clock show?
  sources:
    ccss:
    - 3.MD.A.1
    lc:
    - befd3355
  strand: M2
- id: measurement.time.elapsed.within-hour
  concept: measurement
  facet: time
  level: 2
  type: procedure
  name: Find elapsed minutes between two times in the same hour
  statement: The time interval between two clock times in the same hour is the number of minutes from
    the start time to the end time.
  procedure:
  - Find the minutes of the start time and of the end time.
  - Find how many minutes it takes to go from the start minutes to the end minutes.
  assess: One clock shows 2:15 and a later clock shows 2:52. How many minutes pass from the first time
    to the second?
  sources:
    ccss:
    - 3.MD.A.1
    lc:
    - 3c3c56d8
  strand: M2
- id: measurement.time.elapsed.across-hour
  concept: measurement
  facet: time
  level: 2
  type: procedure
  name: Find elapsed minutes across the start of an hour
  statement: The interval from a time in one hour to a time in the next hour, at most 60 minutes, is the
    minutes from the start time up to the hour plus the minutes past the hour at the end time, because
    an hour has 60 minutes.
  procedure:
  - Find the minutes from the start time up to the next hour.
  - Find the minutes from the hour to the end time.
  - Add the two numbers of minutes.
  assess: One clock shows 3:45 and a later clock shows 4:10. How many minutes pass from the first time
    to the second?
  sources:
    ccss:
    - 3.MD.A.1
    lc:
    - 3c3c56d8
  strand: M2
- id: measurement.time.application.addition
  concept: measurement
  facet: time
  level: 2
  type: application
  name: Solve word problems by adding a time interval in minutes
  statement: A story gives a start time and a duration in minutes, or two durations, and asks for the
    end time or the total time; the learner adds the minutes.
  assess: Recess starts at 10:20 and lasts 25 minutes. At what time does recess end?
  sources:
    ccss:
    - 3.MD.A.1
    lc:
    - fa9c8ad6
  strand: M2
- id: measurement.time.application.subtraction
  concept: measurement
  facet: time
  level: 2
  type: application
  name: Solve word problems by subtracting a time interval in minutes
  statement: A story gives an end time and a duration in minutes, or a total time and one part of it,
    and asks for the start time or the remaining time; the learner subtracts the minutes.
  assess: Swim practice lasted 35 minutes and ended at 5:50. At what time did it start?
  sources:
    ccss:
    - 3.MD.A.1
    lc:
    - 3e846152
  strand: M2
- id: measurement.liquid-volume.liters.measure
  concept: measurement
  facet: liquid-volume
  level: 2
  type: procedure
  name: Measure a liquid volume in liters with a marked container
  statement: The volume of a liquid in liters is read from the level it reaches on a container whose scale
    is marked in liters, including levels between labeled marks.
  procedure:
  - Find how many liters each step between marks on the scale stands for.
  - Find the marks just below and above the liquid level.
  - Read the volume from the level's position between those marks.
  assess: A tank's scale is labeled 0, 2, 4, 6, 8 liters. The water level is halfway between the 4 and
    the 6. How many liters of water are in the tank?
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - 78c89c62
  strand: M2
- id: measurement.liquid-volume.liters.estimate
  concept: measurement
  facet: liquid-volume
  level: 2
  type: procedure
  name: Estimate a liquid volume in liters
  statement: Estimate how many liters a container holds by comparing it with a known 1-liter benchmark,
    such as a 1-liter bottle.
  assess: 'A 1-liter bottle is shown. About how many liters does a full bucket hold: 1, 10, or 100?'
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - 15d457bc
  strand: M2
- id: measurement.mass.grams-kilograms.measure
  concept: measurement
  facet: mass
  level: 2
  type: procedure
  name: Measure mass in grams or kilograms with a scale
  statement: The mass of an object in grams or kilograms is read from a scale or balance marked in that
    unit, including readings between labeled marks.
  procedure:
  - Find how many grams or kilograms each step between marks stands for.
  - Find the marks just below and above the pointer.
  - Read the mass from the pointer's position between those marks.
  assess: A scale is labeled 0, 100, 200, 300, 400, 500 grams. The pointer is halfway between 300 and
    400. What is the mass of the apple on the scale?
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - 872ca956
    - a8a8a7ce
  strand: M2
- id: measurement.mass.grams-kilograms.estimate
  concept: measurement
  facet: mass
  level: 2
  type: procedure
  name: Estimate mass in grams or kilograms
  statement: Estimate the mass of an object in grams or kilograms by comparing it with known benchmarks,
    such as a paper clip of about 1 gram or a 1-liter bottle of water of about 1 kilogram.
  assess: 'A 1-liter bottle of water has a mass of about 1 kilogram. Which is the best estimate for the
    mass of a bicycle: 1 kg, 12 kg, or 120 kg?'
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - bbb494e8
    - a8d19cfc
  strand: M2
- id: measurement.mass-volume.application.addition
  concept: measurement
  facet: measured-quantity
  level: 2
  type: application
  name: Solve one-step addition word problems with masses or volumes
  statement: A one-step story gives two masses or two liquid volumes in the same unit and asks for their
    total; the learner adds and gives the answer in that unit.
  assess: A tub holds 18 liters of water. Ben pours in 25 more liters. How many liters of water are in
    the tub now?
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - d2882c17
  strand: M2
- id: measurement.mass-volume.application.subtraction
  concept: measurement
  facet: measured-quantity
  level: 2
  type: application
  name: Solve one-step subtraction word problems with masses or volumes
  statement: A one-step story about masses or liquid volumes in the same unit asks for an amount left
    or a difference; the learner subtracts and gives the answer in that unit.
  assess: A bag of flour has a mass of 900 grams. Ella uses 350 grams. What is the mass of the flour left?
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - a93d7dd3
  strand: M2
- id: measurement.mass-volume.application.multiplication
  concept: measurement
  facet: measured-quantity
  level: 2
  type: application
  name: Solve one-step multiplication word problems with masses or volumes
  statement: A one-step story gives a number of equal masses or equal liquid volumes in the same unit
    and asks for the total; the learner multiplies and gives the answer in that unit.
  assess: Each bag of rice has a mass of 4 kilograms. What is the mass of 6 bags?
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - f0a0bc8e
  strand: M2
- id: measurement.mass-volume.application.division
  concept: measurement
  facet: measured-quantity
  level: 2
  type: application
  name: Solve one-step division word problems with masses or volumes
  statement: A one-step story splits a mass or liquid volume in one unit into equal shares or equal-size
    portions; the learner divides and gives the answer in the right unit or count.
  assess: 24 liters of juice are poured equally into 6 jugs. How many liters of juice are in each jug?
  sources:
    ccss:
    - 3.MD.A.2
    lc:
    - e6c20427
  strand: M2
- id: data.picture-graph.scaled.draw
  concept: data
  facet: picture-graph
  level: 2
  type: representation
  name: Draw a scaled picture graph
  statement: Represent a data set with several categories as a picture graph in which each picture stands
    for a stated number of data points (a scale of 2, 5, or 10), using counts that are multiples of the
    scale.
  procedure:
  - Write the scale in a key, such as one picture = 5 pets.
  - For each category, find how many groups of the scale make its count.
  - Draw that many pictures in the category's row.
  assess: 'Pets: dogs 10, cats 6, fish 4, birds 8. Draw a picture graph in which each picture stands for
    2 pets.'
  sources:
    ccss:
    - 3.MD.B.3
    lc:
    - 78884bdd
    - 113eb6e8
    - fbe0d923
  strand: M2
- id: data.bar-graph.scaled.draw
  concept: data
  facet: bar-graph
  level: 2
  type: representation
  name: Draw a scaled bar graph
  statement: Represent a data set with several categories as a bar graph with a title, labeled axes, and
    a value axis marked in equal steps of a stated scale (such as 2, 5, or 10), each bar ending at its
    category's count.
  procedure:
  - Write a title and label the category axis and the value axis.
  - Mark the value axis from 0 in equal steps of the scale.
  - For each category, draw a bar that ends at its count, between marks when the count is not a multiple
    of the scale.
  assess: 'Favorite fruit: apples 15, bananas 25, grapes 10, pears 5. Draw a bar graph whose value axis
    counts by 5s.'
  sources:
    ccss:
    - 3.MD.B.3
    lc:
    - 927348fe
    - edc7c180
  strand: M2
- id: data.bar-graph.scaled.read
  concept: data
  facet: bar-graph
  level: 2
  type: representation
  name: Read a value from a scaled bar graph
  statement: The value of a category in a bar graph whose axis counts by a scale other than 1 is the number
    on the value axis where its bar ends, found from the scale when the bar ends between labeled marks.
  assess: A bar graph's value axis is labeled 0, 10, 20, 30, 40. The bar for soccer ends halfway between
    20 and 30. How many students chose soccer?
  sources:
    ccss:
    - 3.MD.B.3
    lc: []
  strand: M2
- id: data.bar-graph.application.one-step
  concept: data
  facet: bar-graph
  level: 2
  type: application
  name: Solve one-step how-many-more or how-many-fewer problems from a scaled bar graph
  statement: A question about a scaled bar graph asks how many more or how many fewer one category has
    than another; the learner reads both values and finds the difference.
  assess: A bar graph with a scale of 5 shows dogs 25, cats 15, fish 10, birds 20. How many more dogs
    than fish were counted?
  sources:
    ccss:
    - 3.MD.B.3
    lc:
    - 33be216e
  strand: M2
- id: data.bar-graph.application.two-step
  concept: data
  facet: bar-graph
  level: 2
  type: application
  name: Solve two-step how-many-more or how-many-fewer problems from a scaled bar graph
  statement: A question about a scaled bar graph needs two operations, such as combining two categories
    and then comparing the total with a third.
  assess: A bar graph with a scale of 5 shows dogs 25, cats 15, fish 10, birds 20. How many more dogs
    and cats together were counted than birds?
  sources:
    ccss:
    - 3.MD.B.3
    lc:
    - db9fc2c4
  strand: M2
- id: measurement.length.ruler.nearest-fourth-inch
  concept: measurement
  facet: length
  level: 2
  type: procedure
  name: Measure length to the nearest fourth of an inch with a ruler
  statement: Measure a length with a ruler marked in halves and fourths of an inch, reporting the whole
    number of inches plus the nearest half or fourth of an inch.
  procedure:
  - Line up the 0 mark of the ruler with one end of the object.
  - Find the last whole-inch mark at or before the other end.
  - Find the half-inch or fourth-inch mark nearest the other end and report the length as whole inches
    plus that fraction.
  assess: Measure this line segment to the nearest fourth of an inch with a ruler marked in halves and
    fourths. (The segment is 3 3/4 inches long.)
  sources:
    ccss:
    - 3.MD.B.4
    lc:
    - 566157d3
  strand: M2
- id: data.line-plot.fractional.make
  concept: data
  facet: line-plot
  level: 2
  type: representation
  name: Make a line plot of measurements in halves and fourths
  statement: 'Show a set of measurements as a line plot: a number line whose scale is marked in whole
    numbers, halves, or fourths, with one mark (such as an X) above the scale for each measurement.'
  procedure:
  - Choose a scale unit (whole, half, or fourth) that every measurement lands on.
  - Draw a number line covering the smallest to the largest measurement, marked in that unit.
  - Put one X above the matching point for each measurement.
  assess: 'Pencil lengths in inches: 2 1/4, 2 1/2, 2 1/2, 3, 2 3/4, 2 1/2, 2 1/4, 3. Make a line plot
    of these lengths with the scale marked in fourths of an inch.'
  sources:
    ccss:
    - 3.MD.B.4
    lc:
    - 029e11a6
  strand: M2
- id: area.unit-square
  concept: area
  facet: unit-squares
  level: 2
  type: concept
  name: The unit square and the square unit
  statement: A square with side length 1 unit is a unit square; it has an area of 1 square unit and is
    the unit used to measure area.
  assess: 'Which of these is a unit square for measuring area in centimeters: a 1 cm by 1 cm square, a
    1 cm by 2 cm rectangle, or a 2 cm by 2 cm square? What is its area?'
  sources:
    ccss:
    - 3.MD.C.5.a
    lc:
    - 6344463a
  strand: M2
- id: area.covering.meaning
  concept: area
  facet: unit-squares
  level: 2
  type: concept
  name: Area as the number of unit squares that cover a figure
  statement: A plane figure that can be covered by n unit squares with no gaps and no overlaps has an
    area of n square units.
  assess: Jo covered a shape with square tiles but left gaps between some of the tiles, then counted 10
    tiles. Is the area of the shape 10 square units? Explain.
  sources:
    ccss:
    - 3.MD.C.5.b
    lc:
    - 4e0c0405
  strand: M2
- id: area.unit-squares.count
  concept: area
  facet: unit-squares
  level: 2
  type: procedure
  name: Measure area by counting unit squares
  statement: Find the area of a figure drawn on a grid of unit squares (square cm, square m, square in,
    square ft, or an improvised square unit) by counting the squares inside it, and name the unit.
  assess: This L-shaped figure is drawn on a grid of square centimeters. What is its area?
  sources:
    ccss:
    - 3.MD.C.6
    lc:
    - '20767411'
  strand: M2
- id: area.rectangle.tiling
  concept: area
  facet: unit-squares
  level: 2
  type: procedure
  name: Find the area of a rectangle by tiling with unit squares
  statement: Find the area of a rectangle with whole-number side lengths by covering it with unit squares,
    with no gaps or overlaps, and counting them.
  procedure:
  - Lay unit squares along one side, edge to edge, so they fill that side.
  - Lay further rows the same way until the rectangle is covered with no gaps or overlaps.
  - Count the squares and report the area in square units.
  assess: Cover a rectangle 3 inches by 5 inches with 1-inch square tiles, with no gaps or overlaps. What
    is its area?
  sources:
    ccss:
    - 3.MD.C.7.a
    lc:
    - bb0d6f97
  strand: M2
- id: area.rectangle.tiles-along-side
  concept: area
  facet: unit-squares
  level: 2
  type: concept
  name: The number of tiles along a side equals the side length
  statement: When a rectangle is tiled with unit squares, the number of squares along a side equals the
    length of that side in units, since each square spans 1 unit of it.
  assess: A rectangle has a side 6 cm long. It is tiled with 1 cm square tiles. How many tiles touch that
    side, and why?
  sources:
    ccss:
    - 3.MD.C.6
    lc:
    - f538df9a
  strand: M2
- id: area.rectangle.tiling-product.explain
  concept: area
  facet: multiplicative
  level: 2
  type: justification
  name: Explain why tiling a rectangle and multiplying its sides give the same area
  statement: A rectangle a units by b units, tiled with unit squares, has a rows of b squares each, so
    the count of squares is a x b; the area found by tiling equals the product of the side lengths.
  assess: This 4 by 6 rectangle is tiled with unit squares. Explain why counting the tiles gives the same
    number as 4 x 6.
  sources:
    ccss:
    - 3.MD.C.7.a
    lc:
    - 0130a087
  strand: M2
- id: area.rectangle.length-times-width
  concept: area
  facet: multiplicative
  level: 3
  type: procedure
  name: Find the area of a rectangle by multiplying side lengths
  statement: The area of a rectangle with whole-number side lengths a and b units is a x b square units,
    found by multiplying the side lengths without tiling or counting.
  assess: A rectangle is 7 cm long and 9 cm wide, with no grid shown. What is its area?
  sources:
    ccss:
    - 3.MD.C.7.b
    lc:
    - b0653180
  strand: M2
- id: multiplication.array-area.whole-number-product.represent
  concept: multiplication
  facet: array-area
  level: 2
  type: representation
  name: Represent a whole-number product as a rectangular area
  statement: The product a x b of whole numbers is represented by a rectangle with side lengths a and
    b units, whose area is a x b square units.
  assess: Draw a rectangle on grid paper whose area shows the product 3 x 8, and label its side lengths.
  sources:
    ccss:
    - 3.MD.C.7.b
    lc:
    - d5edcb0c
  strand: M2
- id: area.rectangle.application
  concept: area
  facet: multiplicative
  level: 2
  type: application
  name: Solve real-world problems about the area of a rectangle
  statement: A real-world story gives the whole-number side lengths of a rectangular surface and asks
    how much area it covers; the learner multiplies the side lengths and answers in square units.
  assess: A rug is 6 feet long and 4 feet wide. How many square feet of floor does it cover?
  sources:
    ccss:
    - 3.MD.C.7.b
    lc:
    - aa837920
  strand: M2
- id: multiplication.array-area.distributive.tiling
  concept: multiplication
  facet: array-area
  level: 2
  type: justification
  name: Show with tiling that a x (b + c) = a x b + a x c
  statement: In a concrete case, a tiled rectangle with sides a and b + c splits into an a by b rectangle
    and an a by c rectangle with no overlap, so its area a x (b + c) equals a x b + a x c.
  assess: A 4 by 7 rectangle is tiled with unit squares. Split it into a 4 by 5 part and a 4 by 2 part,
    and use the tiles to show that 4 x 7 = 4 x 5 + 4 x 2.
  sources:
    ccss:
    - 3.MD.C.7.c
    lc:
    - a5b2425c
  strand: M2
- id: multiplication.array-area.distributive.model
  concept: multiplication
  facet: array-area
  level: 2
  type: representation
  name: Represent the distributive property with an area model
  statement: An area model shows a x (b + c) = a x b + a x c as a rectangle with one side a and the other
    side split into lengths b and c, so the whole area is the sum of the two part areas.
  assess: Draw an area model that shows 6 x 9 = 6 x 5 + 6 x 4, labeling every side length.
  sources:
    ccss:
    - 3.MD.C.7.c
    lc:
    - 8525ce00
  strand: M2
- id: area.additive
  concept: area
  facet: additive
  level: 2
  type: concept
  name: Area is additive
  statement: When a figure is made of parts that do not overlap, its area is the sum of the areas of the
    parts.
  assess: A figure is cut into two pieces that do not overlap. One piece has an area of 12 square units
    and the other 9 square units. Without measuring, what is the area of the whole figure?
  sources:
    ccss:
    - 3.MD.C.7.d
    lc: []
  strand: M2
- id: area.rectilinear.decompose
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: Find the area of a rectilinear figure by decomposing it into rectangles
  statement: Find the area of a rectilinear figure with whole-number side lengths by splitting it into
    non-overlapping rectangles, finding the area of each, and adding.
  procedure:
  - Draw a line segment that splits the figure into rectangles that do not overlap.
  - Find the side lengths of each rectangle from the labeled sides of the figure.
  - Find the area of each rectangle.
  - Add the areas of the rectangles.
  assess: An L-shaped figure, with no grid shown, has sides 8, 3, 5, 4, 3, and 7 meters going around it
    from the bottom-left corner. Find its area.
  sources:
    ccss:
    - 3.MD.C.7.d
    lc:
    - 29c42ed3
  strand: M2
- id: area.rectilinear.application
  concept: area
  facet: additive
  level: 2
  type: application
  name: Solve real-world area problems about rectilinear figures
  statement: A real-world story describes a rectilinear surface, such as a room or garden, with whole-number
    side lengths and asks for its area; the learner decomposes it into non-overlapping rectangles and
    adds their areas.
  assess: A room's floor plan is an L shape with sides 10, 4, 6, 5, 4, and 9 feet going around it. How
    many square feet of carpet cover the whole floor?
  sources:
    ccss:
    - 3.MD.C.7.d
    lc:
    - 7be9b24a
    - a997e206
  strand: M2
- id: perimeter.meaning
  concept: perimeter
  facet: core
  level: 2
  type: concept
  name: Perimeter as the length around a figure
  statement: The perimeter of a polygon is the total length of its boundary, the distance once around
    it, measured in length units.
  assess: An ant walks once around the edge of a rectangle drawn on a centimeter grid. The rectangle is
    5 squares long and 3 squares wide. How far does the ant walk?
  sources:
    ccss:
    - 3.MD.D.8
    lc: []
  strand: M2
- id: perimeter.polygon.from-sides
  concept: perimeter
  facet: core
  level: 3
  type: procedure
  name: Find the perimeter of a polygon from its side lengths
  statement: The perimeter of a polygon with all side lengths given is the sum of its side lengths.
  assess: A pentagon has sides of 4 cm, 6 cm, 3 cm, 5 cm, and 7 cm. What is its perimeter?
  sources:
    ccss:
    - 3.MD.D.8
    lc:
    - 7f34a6f4
    - a278d5f2
  strand: M2
- id: perimeter.polygon.application
  concept: perimeter
  facet: core
  level: 2
  type: application
  name: Solve real-world perimeter problems with given side lengths
  statement: A real-world story gives all the side lengths of a polygon-shaped object, such as a pen or
    a field, and asks for the length around it.
  assess: A farmer puts a fence around a triangular pen with sides of 14 m, 18 m, and 20 m. How many meters
    of fence does she need?
  sources:
    ccss:
    - 3.MD.D.8
    lc:
    - 8ff532f5
    - bba3f1fb
  strand: M2
- id: perimeter.rectangle.from-length-width
  concept: perimeter
  facet: core
  level: 3
  type: procedure
  name: Find the perimeter of a rectangle from its length and width
  statement: Because opposite sides of a rectangle are equal, its perimeter is the sum of two lengths
    and two widths, so it can be found when only the length and width are given.
  assess: A rectangle is 9 cm long and 4 cm wide, and only those two sides are labeled. What is its perimeter?
  sources:
    ccss:
    - 3.MD.D.8
    lc:
    - 5b8696e3
  strand: M2
- id: perimeter.rectangle.application
  concept: perimeter
  facet: core
  level: 2
  type: application
  name: Solve real-world perimeter problems about rectangles
  statement: A real-world story gives the length and width of a rectangular object and asks for the length
    around it.
  assess: A picture frame is a rectangle 12 inches long and 8 inches wide. How many inches of ribbon go
    once around its edge?
  sources:
    ccss:
    - 3.MD.D.8
    lc:
    - e1067102
  strand: M2
- id: perimeter.missing-side
  concept: perimeter
  facet: core
  level: 3
  type: procedure
  name: Find an unknown side length from the perimeter
  statement: When the perimeter of a polygon and all but one of its side lengths are known, the unknown
    side is the perimeter minus the sum of the known sides.
  assess: A quadrilateral has a perimeter of 30 cm. Three of its sides are 8 cm, 6 cm, and 9 cm. How long
    is the fourth side?
  sources:
    ccss:
    - 3.MD.D.8
    lc:
    - ede10534
  strand: M2
- id: perimeter.missing-side.application
  concept: perimeter
  facet: core
  level: 2
  type: application
  name: Solve real-world problems finding an unknown side from the perimeter
  statement: A real-world story gives the total length around a polygon-shaped object and all but one
    side length, and asks for the missing side.
  assess: The fence around a triangular pen is 40 feet long. Two sides of the pen are 12 feet and 15 feet.
    How long is the third side?
  sources:
    ccss:
    - 3.MD.D.8
    lc:
    - 67e309b0
  strand: M2
- id: perimeter.versus-area
  concept: perimeter
  facet: core
  level: 2
  type: concept
  name: Tell perimeter from area
  statement: Perimeter measures the length of a figure's boundary in length units; area measures how many
    unit squares cover it, in square units. They are different measures of the same figure.
