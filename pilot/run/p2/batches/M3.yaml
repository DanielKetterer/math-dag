  strand: M3
- id: volume.prism.formula.base-height
  concept: volume
  facet: unit-cubes
  level: 3
  type: concept
  name: The volume formula V = B x h
  statement: A right rectangular prism with whole-number edge lengths has volume V = B x h cubic units,
    where B is the area of its base in square units and h is its height.
  assess: 'A box has a base with an area of 20 square cm and a height of 4 cm. Which expression gives
    its volume in cubic cm: 20 + 4, 20 x 4, or 20 x 4 x 4?'
