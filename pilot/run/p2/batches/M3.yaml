  strand: M3
- id: volume.three-factor-product
  concept: volume
  facet: unit-cubes
  level: 2
  type: representation
  name: Represent a product of three whole numbers as the volume of a prism
  statement: A product a x b x c of whole numbers is represented by a right rectangular prism of unit
    cubes with edge lengths a, b, and c, whose number of cubes is the product.
  assess: Draw a rectangular prism of unit cubes whose number of cubes is 3 x 2 x 4, and label its three
    edge lengths.
