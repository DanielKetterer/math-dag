  strand: M3
- id: volume.prism.formula.base-height.apply
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a rectangular prism with V = B x h
  statement: Find the volume of a right rectangular prism by multiplying the area of its base by its height.
  procedure:
  - Find or read the area of the base in square units.
  - Multiply the base area by the height.
  - Label the product in cubic units.
  assess: A prism has a base with an area of 35 square inches and a height of 6 inches. Use V = B x h
