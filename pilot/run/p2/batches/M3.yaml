  strand: M3
- id: volume.prism.formula.lwh.apply
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a rectangular prism with V = l x w x h
  statement: Find the volume of a right rectangular prism with whole-number edge lengths by multiplying
    its length, width, and height.
  procedure:
  - Identify the length, width, and height in the same unit.
  - Multiply the three edge lengths.
  - Label the product in cubic units.
  assess: Use V = l x w x h to find the volume of a box 8 cm long, 5 cm wide, and 3 cm tall.
  sources:
    ccss:
    - 5.MD.C.5.b
