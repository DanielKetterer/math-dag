- id: volume.additive
  concept: volume
  facet: unit-cubes
  level: 2
  type: concept
  name: Volume is additive
  statement: When a solid is made of non-overlapping parts, its volume is the sum of the volumes of the
    parts.
  assess: A solid is made by joining a box of 24 cubic feet and a box of 18 cubic feet, with no overlap.
    What is the volume of the solid?
