- id: shapes.attributes.shared
  concept: shapes
  facet: category
  level: 2
  type: concept
  name: Shapes in different categories can share attributes
  statement: Two shapes with different category names can have an attribute in common, such as having
    four sides; sharing an attribute does not make them the same kind of shape.
  assess: A rhombus with no right angles and a rectangle that is not a square are shown. Name one attribute
    both shapes have.
  sources:
    ccss:
    - 3.G.A.1
    lc:
    - 7f057a0c
  strand: G2
- id: shapes.category.defined-by-attribute
  concept: shapes
  facet: category
  level: 2
  type: concept
  name: A shared attribute can define a larger category
  statement: 'An attribute can define a category of shapes: every shape that has the attribute belongs
    to the category, whatever its other attributes, size, or orientation.'
  assess: 'A ''quad-shape'' is any closed shape made of four straight sides. Which of these are quad-shapes:
    a square, a tilted kite, a rhombus, a four-sided arrowhead with one corner pointing in, a circle,
    a pentagon?'
  sources:
    ccss:
    - 3.G.A.1
    lc:
    - 57e16cea
  strand: G2
- id: shapes.quadrilateral.recognize
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Recognize quadrilaterals of any shape
  statement: A quadrilateral is a closed figure made of exactly four straight sides; every such figure
    is a quadrilateral, including irregular, tilted, and inward-pointing ones.
  assess: 'Circle every quadrilateral: a square, a tilted kite, a four-sided arrowhead with one corner
    pointing in, a trapezoid, a pentagon, a figure with three straight sides and one curved side.'
  sources:
    ccss:
    - 3.G.A.1
    lc:
    - 32da252f
  strand: G2
- id: shapes.rectangle.define
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: A rectangle is a quadrilateral with four right angles
  statement: A rectangle is a quadrilateral with four right angles; its side lengths play no part in the
    definition.
  assess: Which of these quadrilaterals are rectangles? A has four right angles and sides 2, 7, 2, 7 cm;
    B has four right angles and all sides 5 cm; C has sides 2, 7, 2, 7 cm and no right angles.
  sources:
    ccss:
    - 3.G.A.1
    lc: []
  strand: G2
- id: shapes.rhombus.define
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: A rhombus is a quadrilateral with four equal sides
  statement: A rhombus is a quadrilateral whose four sides all have the same length; its angles play no
    part in the definition.
  assess: Which of these quadrilaterals are rhombuses? A has four sides of 5 cm and no right angles; B
    has four sides of 5 cm and four right angles; C has sides 5, 3, 5, 3 cm.
  sources:
    ccss:
    - 3.G.A.1
    lc: []
  strand: G2
- id: shapes.square.define
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: A square has four equal sides and four right angles
  statement: A square is a quadrilateral with four sides of the same length and four right angles, in
    any orientation.
  assess: Which of these are squares? A has four sides of 4 cm and four right angles; B has four sides
    of 4 cm and no right angles; C has four right angles and sides 4, 6, 4, 6 cm; D is A turned to stand
    on one corner.
  sources:
    ccss:
    - 3.G.A.1
    lc: []
  strand: G2
- id: shapes.quadrilateral.subcategories-included
  concept: shapes
  facet: category
  level: 2
  type: concept
  name: Rhombuses, rectangles, and squares are quadrilaterals
  statement: Rhombuses, rectangles, and squares are all quadrilaterals, because each is a closed figure
    with four straight sides; a shape keeps its more specific name and also belongs to the category quadrilateral.
  assess: Is a square a quadrilateral? Is a rhombus? Is a rectangle? Name the attribute that decides it.
  sources:
    ccss:
    - 3.G.A.1
    lc:
    - 1bc66a86
    - 99b171db
    - c683d6c7
  strand: G2
- id: shapes.quadrilateral.draw-other
  concept: shapes
  facet: properties
  level: 2
  type: procedure
  name: Draw a quadrilateral that is not a rhombus, rectangle, or square
  statement: Draw a quadrilateral whose sides are not all the same length and whose angles are not all
    right angles, so it fits none of the definitions of rhombus, rectangle, or square.
  procedure:
  - Draw four straight sides that close into a figure.
  - Make at least two of the sides different in length, so it is not a rhombus or a square.
  - Make at least one angle that is not a right angle, so it is not a rectangle or a square.
  - Check the figure against each of the three definitions.
  assess: Draw a quadrilateral that is not a rhombus, not a rectangle, and not a square. Say why it is
    none of them.
  sources:
    ccss:
    - 3.G.A.1
    lc:
    - 0547ded3
  strand: G2
- id: point.meaning
  concept: point
  facet: core
  level: 2
  type: concept
  name: A point is an exact location
  statement: A point is an exact location with no size, drawn as a dot and named with a capital letter;
    the corners of a figure are points.
  assess: Draw a point on each corner of this triangle and label the points A, B, and C.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - 559a6e78
  strand: G2
- id: line.meaning
  concept: line
  facet: core
  level: 2
  type: concept
  name: A line is straight and extends without end both ways
  statement: A line is straight, has no endpoints, and extends without end in both directions; it is drawn
    with an arrowhead at each end and named by two of its points.
  assess: 'Which of these figures are lines: a straight path with arrowheads at both ends, a straight
    path with two endpoints, a straight path with one endpoint and one arrowhead, a curved path with arrowheads
    at both ends?'
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - d6ead46a
    - 1f95ef88
  strand: G2
- id: segment.meaning
  concept: segment
  facet: core
  level: 2
  type: concept
  name: A line segment is the part of a line between two endpoints
  statement: A line segment is the straight part of a line between two endpoints, including them; it is
    named by its endpoints, and the sides of a polygon are line segments.
  assess: This pentagon has points A, B, C, D, and E at its corners. Name the five line segments that
    form its sides.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - 2f646a05
  strand: G2
- id: ray.meaning
  concept: ray
  facet: core
  level: 2
  type: concept
  name: A ray starts at an endpoint and extends without end one way
  statement: A ray is the part of a line that starts at one endpoint and extends without end in one direction;
    it is drawn with one endpoint and one arrowhead and named starting with its endpoint.
  assess: 'Which of these figures are rays: a straight path with one endpoint and one arrowhead, a straight
    path with arrowheads at both ends, a straight path with two endpoints, a curved path with one endpoint
    and one arrowhead?'
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - 10e69fc1
  strand: G2
- id: angle.right.meaning
  concept: angle
  facet: figure
  level: 2
  type: concept
  name: A right angle forms a square corner
  statement: A right angle is an angle whose two sides form a square corner, so the corner of a sheet
    of paper fits it exactly.
  assess: Use the corner of an index card to test each angle of this quadrilateral, which is not a rectangle.
    Which of its angles are right angles?
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - c69a41b7
  strand: G2
- id: angle.acute-obtuse.classify
  concept: angle
  facet: figure
  level: 2
  type: concept
  name: Acute and obtuse angles compared with a right angle
  statement: An acute angle is smaller than a right angle; an obtuse angle is larger than a right angle
    and smaller than a straight angle.
  assess: Label each angle of this pentagon as right, acute, or obtuse.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - c69a41b7
  strand: G2
- id: angle.draw-by-type
  concept: angle
  facet: figure
  level: 2
  type: procedure
  name: Draw a right, acute, or obtuse angle
  statement: Draw an angle of a named type by drawing two rays from a common endpoint and checking the
    opening against a square corner.
  procedure:
  - Draw a ray.
  - Place a square corner at the ray's endpoint with one edge along the ray.
  - For a right angle, draw the second ray along the other edge of the square corner.
  - For an acute angle, draw the second ray from the endpoint inside the square corner.
  - For an obtuse angle, draw the second ray from the endpoint between the other edge of the square corner
    and the extension of the first ray backward through its endpoint.
  assess: Draw an obtuse angle with its vertex at point P.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - 27812e5c
  strand: G2
- id: perpendicular.meaning
  concept: perpendicular
  facet: core
  level: 2
  type: concept
  name: Perpendicular lines meet at right angles
  statement: Two lines are perpendicular when they meet to form right angles; two segments or sides are
    perpendicular when the lines they lie on are perpendicular.
  assess: In this trapezoid with two right angles, name every pair of sides that are perpendicular.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - ba8dce38
  strand: G2
- id: perpendicular.draw
  concept: perpendicular
  facet: core
  level: 2
  type: procedure
  name: Draw a line perpendicular to a given line
  statement: Draw a line perpendicular to a given line through a given point on it, using a square corner.
  procedure:
  - Place a square corner with its vertex at the point and one edge along the given line.
  - Draw along the other edge of the square corner, through the point.
  - Extend the drawn line in both directions.
  assess: Draw a line perpendicular to line m through the point P on m.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - 70453a52
  strand: G2
- id: parallel.meaning
  concept: parallel
  facet: core
  level: 2
  type: concept
  name: Parallel lines never meet
  statement: Two lines in a plane are parallel when they never meet, however far they are extended; two
    segments or sides are parallel when the lines they lie on are parallel.
  assess: In this trapezoid, which has exactly one pair of parallel sides, name the pair of sides that
    are parallel.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - 3a80eead
  strand: G2
- id: parallel.draw
  concept: parallel
  facet: core
  level: 2
  type: procedure
  name: Draw a line parallel to a given line
  statement: Draw a line through a given point, not on a given line, that is parallel to the given line.
  procedure:
  - Slide a square corner along the given line, one edge on the line, until its other edge passes through
    the point; draw along that edge.
  - At the point, draw a line perpendicular to the line just drawn.
  - The second line is parallel to the given line, because two lines perpendicular to the same line never
    meet.
  assess: Draw a line through point P that is parallel to line m.
  sources:
    ccss:
    - 4.G.A.1
    lc:
    - 70453a52
  strand: G2
- id: shapes.classify.parallel-perpendicular
  concept: shapes
  facet: properties
  level: 2
  type: procedure
  name: Sort figures by parallel or perpendicular sides
  statement: Sort two-dimensional figures by whether they have at least one pair of parallel sides, or
    by whether they have at least one pair of perpendicular sides.
  procedure:
  - For each figure, check each pair of sides for the named relationship.
  - Put the figures with at least one such pair in one group and the figures with none in the other.
  assess: 'Sort these six figures into two groups: those with at least one pair of perpendicular sides
    and those with none.'
  sources:
    ccss:
    - 4.G.A.2
    lc:
    - 10bc56bd
  strand: G2
- id: shapes.classify.angle-type
  concept: shapes
  facet: properties
  level: 2
  type: procedure
  name: Sort figures by angles of a named type
  statement: 'Sort two-dimensional figures by whether they have at least one angle of a named type: right,
    acute, or obtuse.'
  procedure:
  - For each figure, decide the type of each of its angles.
  - Put the figures with at least one angle of the named type in one group and the figures with none in
    the other.
  assess: 'Sort these six figures into two groups: those with at least one obtuse angle and those with
    none.'
  sources:
    ccss:
    - 4.G.A.2
    lc:
    - ec7e77d8
  strand: G2
- id: shapes.triangle.right.identify
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Right triangles as a category
  statement: A right triangle is a triangle with a right angle; right triangles form a category whatever
    their size, side lengths, or orientation.
  assess: Which of these triangles, drawn at different sizes and turned different ways with no angle marks,
    are right triangles?
  sources:
    ccss:
    - 4.G.A.2
    lc:
    - db42dcec
  strand: G2
- id: symmetry.line.meaning
  concept: symmetry
  facet: line
  level: 2
  type: concept
  name: A line of symmetry folds a figure into matching parts
  statement: A line of symmetry of a figure is a line across it such that folding the figure along the
    line makes the two parts match exactly; a figure with such a line is line-symmetric.
  assess: A rectangle that is not a square has a dashed line drawn along one diagonal. Is the dashed line
    a line of symmetry? Explain by what happens when the rectangle is folded along it.
  sources:
    ccss:
    - 4.G.A.3
    lc:
    - a0205dfb
  strand: G2
- id: symmetry.line.draw
  concept: symmetry
  facet: line
  level: 2
  type: procedure
  name: Draw all lines of symmetry of a figure
  statement: Find and draw every line of symmetry of a two-dimensional figure; for a polygon the candidate
    lines can be listed in full.
  procedure:
  - List the candidate lines. For a polygon, every line of symmetry passes through two points that are
    each a vertex or the midpoint of a side, so the candidates are the lines through two such points.
  - For each candidate, check whether folding along it makes the two parts match exactly.
  - Draw every candidate that passes, and no others.
  assess: Draw every line of symmetry of this rectangle that is not a square.
  sources:
    ccss:
    - 4.G.A.3
    lc:
    - f67e0d53
  strand: G2
- id: coordinate-plane.axes-origin
  concept: coordinate-plane
  facet: location
  level: 2
  type: concept
  name: Axes and origin of a coordinate plane
  statement: A coordinate plane is made from two perpendicular number lines, the axes (the x-axis and
    the y-axis), placed so they cross at 0 on each; the crossing point is the origin, with coordinates
    (0, 0).
  assess: On this grid with both axes drawn and numbered, mark the origin and write its coordinates.
  sources:
    ccss:
    - 5.G.A.1
    lc:
    - 7e59ad79
  strand: G2
- id: coordinate-plane.ordered-pair.meaning
  concept: coordinate-plane
  facet: location
  level: 2
  type: concept
  name: The two coordinates as distances from the origin
  statement: In an ordered pair (a, b), the first number a tells how far to travel from the origin in
    the direction of the x-axis, and the second number b tells how far to travel in the direction of the
    y-axis; so (a, b) and (b, a) are different points unless a = b.
  assess: Without plotting, describe how to travel from the origin to (2, 6) and how to travel from the
    origin to (6, 2). Are they the same point?
  sources:
    ccss:
    - 5.G.A.1
    lc:
    - cf895e10
    - 9a9aba52
    - ccfcad8c
  strand: G2
- id: coordinate-plane.first-quadrant.plot
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: Plot a point with whole-number coordinates in the first quadrant
  statement: Plot the point with given whole-number coordinates (a, b) on a first-quadrant coordinate
    grid.
  procedure:
  - Start at the origin.
  - Move a units in the direction of the x-axis.
  - From there, move b units in the direction of the y-axis.
  - Mark the point reached.
  assess: Plot the points (5, 2) and (0, 3) on this grid.
  sources:
    ccss:
    - 5.G.A.1
    lc:
    - 9f6772f5
  strand: G2
- id: coordinate-plane.first-quadrant.read
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: Read the coordinates of a point in the first quadrant
  statement: Give the ordered pair of whole-number coordinates of a point plotted on a first-quadrant
    coordinate grid.
  procedure:
  - From the point, follow the grid line parallel to the y-axis to the x-axis; the number there is the
    x-coordinate.
  - From the point, follow the grid line parallel to the x-axis to the y-axis; the number there is the
    y-coordinate.
  - Write the pair as (x-coordinate, y-coordinate).
  assess: Write the ordered pair for each of the unlabeled plotted points A and B on this grid; A lies
    on the y-axis.
  sources:
    ccss:
    - 5.G.A.1
    lc:
    - d94abe72
  strand: G2
- id: coordinate-plane.application.mathematical
  concept: coordinate-plane
  facet: location
  level: 2
  type: application
  name: Solve a mathematical problem by graphing points
  statement: Solve a mathematical problem by graphing points in the first quadrant and reasoning from
    their positions, such as finding a missing vertex of a figure.
  assess: Three corners of a rectangle are at (1, 2), (1, 6), and (5, 6). Plot them and find the coordinates
    of the fourth corner.
  sources:
    ccss:
    - 5.G.A.2
    lc:
    - ef95113c
  strand: G2
- id: coordinate-plane.application.real-world
  concept: coordinate-plane
  facet: graph
  level: 2
  type: application
  name: Graph paired quantities from a real-world situation
  statement: Represent a real-world situation that pairs two quantities by graphing each pair as a point
    in the first quadrant, the first quantity along the x-axis and the second along the y-axis.
  assess: A plant was 2 cm tall at week 0, 4 cm at week 1, 6 cm at week 2, and 8 cm at week 3. Graph these
    as points with weeks on the x-axis and height in centimeters on the y-axis.
  sources:
    ccss:
    - 5.G.A.2
    lc:
    - 70837fe6
  strand: G2
- id: coordinate-plane.application.interpret
  concept: coordinate-plane
  facet: graph
  level: 2
  type: application
  name: Interpret coordinate values in context
  statement: Say what each coordinate of a plotted point means in the situation the graph represents.
  assess: A graph shows hours worked on the x-axis and dollars earned on the y-axis. The point (3, 24)
    is plotted. What do the 3 and the 24 tell you?
  sources:
    ccss:
    - 5.G.A.2
    lc:
    - d2cd8103
  strand: G2
- id: shapes.quadrilateral.parallel-sides.define
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Trapezoids and parallelograms by pairs of parallel sides
  statement: A trapezoid is a quadrilateral with at least one pair of parallel sides; a parallelogram
    is a quadrilateral with two pairs of parallel sides.
  assess: Quadrilateral A has exactly one pair of parallel sides, B has two pairs, and C has none. Which
    of A, B, and C are trapezoids? Which are parallelograms?
  sources:
    ccss:
    - 5.G.B.4
    lc: []
  strand: G2
- id: shapes.triangle.by-sides.define
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Equilateral, isosceles, and scalene triangles
  statement: An equilateral triangle has three sides of equal length; an isosceles triangle has at least
    two sides of equal length; a scalene triangle has no two sides of equal length.
  assess: Three triangles have sides 5, 5, 5 cm; 5, 5, 8 cm; and 4, 6, 7 cm. Which are isosceles? Which
    are scalene?
  sources:
    ccss:
    - 5.G.B.4
    lc: []
  strand: G2
- id: shapes.triangle.by-angles.define
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Acute, right, and obtuse triangles
  statement: An acute triangle has three acute angles; a right triangle has a right angle; an obtuse triangle
    has an obtuse angle.
  assess: Name each of these three triangles, drawn with no angle marks, as acute, right, or obtuse.
  sources:
    ccss:
    - 5.G.B.4
    lc: []
  strand: G2
- id: shapes.category.inherit-attributes
  concept: shapes
  facet: category
  level: 3
  type: concept
  name: Attributes of a category belong to all its subcategories
  statement: If every shape in a category has an attribute, then every shape in each subcategory of that
    category has the attribute too.
  assess: All parallelograms have diagonals that cut each other in half. Every rhombus is a parallelogram.
    Without measuring, must the diagonals of every rhombus cut each other in half? Explain using the categories.
  sources:
    ccss:
    - 5.G.B.3
    lc:
    - e3e2af8b
    - 51e2d683
  strand: G2
- id: shapes.quadrilateral.classify
  concept: shapes
  facet: category
  level: 3
  type: procedure
  name: Name every category a quadrilateral belongs to
  statement: Name every category among trapezoid, parallelogram, rectangle, rhombus, and square that a
    given quadrilateral belongs to, by checking its parallel sides, right angles, and side lengths against
    each definition.
  procedure:
  - Count the pairs of parallel sides; at least one pair makes it a trapezoid, two pairs make it a parallelogram.
  - Check the angles; four right angles (each pair of adjacent sides perpendicular) make it a rectangle.
  - Check the side lengths; four equal sides make it a rhombus.
  - Four equal sides and four right angles make it a square.
  - List every name whose condition holds.
  assess: A quadrilateral has four sides of 6 cm and four right angles. List every name it has among trapezoid,
    parallelogram, rectangle, rhombus, and square.
  sources:
    ccss:
    - 5.G.B.4
    lc:
    - 788c4445
    - 72357b7d
    - ab4d63ce
    - 67d8843b
    - 413e97fa
  strand: G2
- id: shapes.quadrilateral.hierarchy
  concept: shapes
  facet: category
  level: 3
  type: concept
  name: The hierarchy of quadrilateral categories
  statement: 'The quadrilateral categories are nested by inclusion: every square is both a rectangle and
    a rhombus, every rectangle and every rhombus is a parallelogram, every parallelogram is a trapezoid,
    and every trapezoid is a quadrilateral.'
  assess: 'True or false, with a reason from the definitions: every square is a rhombus; every rhombus
    is a square; every rectangle is a parallelogram.'
  sources:
    ccss:
    - 5.G.B.4
    lc:
    - 175a45df
  strand: G2
- id: shapes.triangle.hierarchy
  concept: shapes
  facet: category
  level: 3
  type: concept
  name: The hierarchy of triangle categories
  statement: Equilateral triangles are a subcategory of isosceles triangles, and the categories by sides
    cross the categories by angles, so one triangle can belong to both kinds, such as an isosceles right
    triangle.
  assess: 'True or false, with a reason from the definitions: every equilateral triangle is isosceles;
    every isosceles triangle is equilateral; a right triangle can be isosceles.'
  sources:
    ccss:
    - 5.G.B.4
    lc:
    - 8bd3a000
  strand: G2
