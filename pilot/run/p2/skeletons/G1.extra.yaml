notes: "Partial coverage: shapes.recognize and shapes.name.prototype already cover recognizing any orientation and naming typical circles, squares and triangles; shapes.name.any-orientation writes only the missing part (expressive naming of non-typical, tilted and resized examples, plus rectangles and hexagons). K.G.B.4 sides and corners are covered by shapes.sides.count and shapes.corners.count; this strand adds equal sides, comparison by attributes (flat and solid) and the parts of solids. K.G.A.2 component 9a476e0a is cited twice (flat and solid naming), and 7dfda327 and 2b32313c twice, because each carries two skills. 5fbfdbc0 (compose a composite in 1.G.A.2) is covered by shapes.compose.combine; the new content of 1.G.A.2 is using the composite as a unit (shapes.compose.composite-unit), split from the solid version because solid composition needs face matching. Trapezoid: baa38680 names trapezoids, but a trapezoid's defining attribute needs parallel sides (exclusive versus inclusive definition is also unsettled); I kept trapezoids out of every assess item and the reviewer should decide whether a trapezoid node belongs here or with later parallel-line work. shapes.classify.defining-attributes is stated so a square passes the rectangle check, which is correct but anticipates hierarchical classification. 2.G.A.1 'angles' is used as the informal corner of a polygon; no separate angle node was written (shapes.corners.count carries it). The 'equal faces' part of 2.G.A.1 is carried only by shapes.cube.identify. counting.array.squares is borderline with counting.objects; I wrote it because counting adjacent tiled squares without skipping or recounting is a known separate difficulty and the area nodes owned by M2 will want to point at it, but a reviewer may fold it into counting.objects."
