new_concepts:
  - {concept: shapes, facet: category, reason: "Shapes as members of categories defined by shared attributes, with inclusion of subcategories (3.G.A.1, 5.G.B.3, 5.G.B.4); distinct from properties, which describes a single shape's attributes."}
  - {concept: point, facet: core, reason: "Point as an exact location (4.G.A.1)."}
  - {concept: line, facet: core, reason: "Line as a straight figure extending without end both ways (4.G.A.1)."}
  - {concept: segment, facet: core, reason: "Line segment between two endpoints (4.G.A.1)."}
  - {concept: ray, facet: core, reason: "Ray from one endpoint (4.G.A.1)."}
  - {concept: angle, facet: figure, reason: "Angle as a static figure classified against a right angle (4.G.A.1-2); the measure or turn facet belongs to the measurement strand (4.MD.C.5-7)."}
  - {concept: perpendicular, facet: core, reason: "Lines meeting at right angles (4.G.A.1)."}
  - {concept: parallel, facet: core, reason: "Lines in a plane that never meet (4.G.A.1)."}
  - {concept: symmetry, facet: line, reason: "Reflection (fold) symmetry of a plane figure (4.G.A.3); rotational symmetry would be a later facet."}
  - {concept: coordinate-plane, facet: location, reason: "Locating points by ordered pairs as distances along perpendicular axes (5.G.A.1)."}
  - {concept: coordinate-plane, facet: graph, reason: "Points as pairs of related quantities in a situation (5.G.A.2)."}
retires:
  - {id: coordinate-plane.first-quadrant, replaced_by: [coordinate-plane.first-quadrant.plot, coordinate-plane.first-quadrant.read], note: "'Plot and read' is two inverse procedures with different test problems. Edges that need the structure of the plane rather than either procedure should point at coordinate-plane.ordered-pair.meaning or coordinate-plane.axes-origin. Both new nodes are whole-number coordinates only; fraction or decimal coordinates (used by some ratio and proportional-relationship graphs) need a later node."}
covered_by: []
dropped: []
notes: "3.G.A.2 (partition shapes into equal areas) is written as partitioning.equal-area.any-shape; my input had no components for it, so nothing is listed under covered_by. Six nodes have no lc because they are definitions the standards use without a component of their own: shapes.rectangle.define, shapes.rhombus.define, shapes.square.define (needed by 3.G.A.1 recognition and drawing), shapes.quadrilateral.parallel-sides.define, shapes.triangle.by-sides.define, shapes.triangle.by-angles.define (needed by 5.G.B.4). Rectangle, rhombus and square are split because they use different attributes (angles versus side lengths), hence different prerequisites. Trapezoid uses the inclusive definition (at least one pair of parallel sides), so every parallelogram is a trapezoid in shapes.quadrilateral.hierarchy; Daniel should confirm, since many curricula use the exclusive definition (exactly one pair), which changes that hierarchy and the classify procedure. Possible overlap with G1 (2.G.A.1, which identifies quadrilaterals): shapes.quadrilateral.recognize is written at the attribute-defined level (any closed four-sided figure, including concave and tilted ones); merge it into a G1 node if G1 already has that meaning. The definition of an angle as two rays with a common endpoint (4.MD.C.5) is left to the measurement strand; the angle.* nodes here assume it. Angle types are defined by comparison with a right angle (square corner), not degrees, so they do not require angle measure. The 5.G.B.4 components that classify by side congruence, right angles, parallel sides, and perpendicular sides are steps of one procedure (shapes.quadrilateral.classify) rather than four nodes; perpendicular adjacent sides in a quadrilateral are the same check as right angles. The x- and y-coordinate interpretation components (9a9aba52, ccfcad8c, cf895e10) are one meaning and share coordinate-plane.ordered-pair.meaning. coordinate.ordered-pair.notation is a later-phase reserved id and is not written here. The symmetry.line.draw candidate rule is general for polygons: a line of symmetry meets the boundary only at vertices or at midpoints of sides it crosses at right angles."
