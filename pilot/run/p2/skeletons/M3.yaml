- id: measurement.length.units.metric
  concept: measurement
  facet: length
  level: 3
  type: fact
  name: Relative sizes of metric length units
  statement: Know that 1 km = 1000 m and 1 m = 100 cm, so a kilometer is 1000 times as long as a meter and a meter is 100 times as long as a centimeter.
  assess: "Without computing: how many meters are in 1 kilometer? How many centimeters are in 1 meter? Which is longer, 1 m or 1 cm?"
  sources: {ccss: ["4.MD.A.1"], lc: ["07e8b8c4"]}
  strand: M3
- id: measurement.length.units.customary
  concept: measurement
  facet: length
  level: 3
  type: fact
  name: Relative sizes of customary length units
  statement: Know that 1 ft = 12 in and 1 yd = 3 ft, so a foot is 12 times as long as an inch and a yard is 3 times as long as a foot.
  assess: "Without computing: how many inches are in 1 foot? How many feet are in 1 yard? Which is longer, 1 ft or 1 yd?"
  sources: {ccss: ["4.MD.A.1"], lc: ["c1f00fc0"]}
  strand: M3
- id: measurement.mass.units.metric
  concept: measurement
  facet: mass
  level: 3
  type: fact
  name: Relative sizes of metric mass units
  statement: Know that 1 kg = 1000 g, so a kilogram is 1000 times as heavy as a gram.
  assess: "Without computing: how many grams are in 1 kilogram? Which is heavier, 1 g or 1 kg?"
  sources: {ccss: ["4.MD.A.1"], lc: ["4a130b79"]}
  strand: M3
- id: measurement.weight.units.customary
  concept: measurement
  facet: mass
  level: 3
  type: fact
  name: Relative sizes of customary weight units
  statement: Know that 1 lb = 16 oz, so a pound is 16 times as heavy as an ounce.
  assess: "Without computing: how many ounces are in 1 pound? Which is heavier, 1 oz or 1 lb?"
  sources: {ccss: ["4.MD.A.1"], lc: ["08cdf68d"]}
  strand: M3
- id: measurement.liquid-volume.units.metric
  concept: measurement
  facet: liquid-volume
  level: 3
  type: fact
  name: Relative sizes of metric liquid volume units
  statement: Know that 1 L = 1000 mL, so a liter is 1000 times as much liquid as a milliliter.
  assess: "Without computing: how many milliliters are in 1 liter? Which is more liquid, 1 mL or 1 L?"
  sources: {ccss: ["4.MD.A.1"], lc: []}
  strand: M3
- id: measurement.time.units
  concept: measurement
  facet: time
  level: 3
  type: fact
  name: Relative sizes of hours, minutes, and seconds
  statement: Know that 1 hr = 60 min and 1 min = 60 sec, so an hour is 60 times as long as a minute and a minute is 60 times as long as a second.
  assess: "Without computing: how many minutes are in 1 hour? How many seconds are in 1 minute? Which is longer, 1 min or 1 sec?"
  sources: {ccss: ["4.MD.A.1"], lc: ["1dc43d2c"]}
  strand: M3
- id: measurement.unit-conversion.multiplicative-relation
  concept: measurement
  facet: unit-conversion
  level: 2
  type: concept
  name: A measurement in a smaller unit is k times its number in the larger unit
  statement: If 1 larger unit equals k smaller units, then the number of smaller units in any measurement is k times the number of larger units, because each larger unit is replaced by k smaller ones.
  assess: "1 ft is 12 times as long as 1 in. A snake is 4 ft long. Without finding its length in inches, is that number more or less than 4, and how many times as large is it?"
  sources: {ccss: ["4.MD.A.1"], lc: []}
  strand: M3
- id: measurement.unit-conversion.table
  concept: measurement
  facet: unit-conversion
  level: 2
  type: representation
  name: Record measurement equivalents in a two-column table
  statement: A two-column conversion table lists a number of larger units in one column and the equal number of smaller units in the other; when 1 larger unit = k smaller units, each row is (n, n x k).
  assess: "1 yd = 3 ft. Complete the table: yards 1, 2, 3, 4, 5 in the first column, feet in the second."
  sources: {ccss: ["4.MD.A.1"], lc: ["471384ea"]}
  strand: M3
- id: measurement.unit-conversion.to-smaller.whole
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Convert a whole-number measurement to a smaller unit
  statement: A measurement of n larger units, with n a whole number and 1 larger unit = k smaller units, equals n x k smaller units.
  procedure:
    - Find k, the number of smaller units in 1 larger unit.
    - Multiply the number of larger units by k.
    - Label the product with the smaller unit.
  assess: "Write 7 kg in grams. (1 kg = 1000 g)"
  sources: {ccss: ["4.MD.A.1"], lc: ["da70f59c"]}
  strand: M3
- id: measurement.unit-conversion.to-smaller.mixed-units
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Write a two-unit measurement in the smaller unit
  statement: A measurement of a larger units and b smaller units, with 1 larger unit = k smaller units, equals a x k + b smaller units.
  procedure:
    - Convert the a larger units to a x k smaller units.
    - Add the b smaller units.
    - Label the sum with the smaller unit.
  assess: "Write 2 hours 15 minutes in minutes. (1 hr = 60 min)"
  sources: {ccss: ["4.MD.A.1", "4.MD.A.2"], lc: []}
  strand: M3
- id: measurement.unit-conversion.to-smaller.decimal
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Convert a decimal metric measurement to a smaller unit
  statement: A metric measurement written as a decimal is converted to a smaller unit by multiplying it by the power of ten (10, 100, or 1000) that relates the two units.
  procedure:
    - Find the power of ten k with 1 larger unit = k smaller units.
    - Multiply the decimal by k.
    - Label the product with the smaller unit.
  assess: "Write 3.25 kg in grams. (1 kg = 1000 g)"
  sources: {ccss: ["5.MD.A.1"], lc: ["783e04ae"]}
  strand: M3
- id: measurement.unit-conversion.to-smaller.fraction
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Convert a fractional measurement to a smaller unit
  statement: A measurement of a/b larger units, with 1 larger unit = k smaller units, equals (a/b) x k smaller units.
  procedure:
    - Find k, the number of smaller units in 1 larger unit.
    - Multiply the fraction a/b by k.
    - Label the product with the smaller unit.
  assess: "How many minutes are in 3/4 of an hour? (1 hr = 60 min)"
  sources: {ccss: ["4.MD.A.2", "5.MD.A.1"], lc: ["783e04ae"]}
  strand: M3
- id: measurement.unit-conversion.to-larger.whole
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Convert a measurement to a larger unit with a whole-number result
  statement: When 1 larger unit = k smaller units and n is a multiple of k, n smaller units equal n divided by k larger units.
  procedure:
    - Find k, the number of smaller units in 1 larger unit.
    - Divide the number of smaller units by k.
    - Label the quotient with the larger unit.
  assess: "Write 72 inches in feet. (1 ft = 12 in)"
  sources: {ccss: ["5.MD.A.1"], lc: ["0c81b764"]}
  strand: M3
- id: measurement.unit-conversion.to-larger.mixed-units
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Write a measurement in larger and smaller units together
  statement: When 1 larger unit = k smaller units, n smaller units equal q larger units and r smaller units, where q and r are the whole-number quotient and remainder of n divided by k.
  procedure:
    - Find k, the number of smaller units in 1 larger unit.
    - Divide n by k to get a whole-number quotient q and remainder r.
    - Write the measurement as q larger units and r smaller units.
  assess: "Write 200 minutes in hours and minutes. (1 hr = 60 min)"
  sources: {ccss: ["4.MD.A.2", "5.MD.A.1"], lc: []}
  strand: M3
- id: measurement.unit-conversion.to-larger.decimal
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Convert a metric measurement to a larger unit as a decimal
  statement: A metric measurement is converted to a larger unit by dividing it by the power of ten (10, 100, or 1000) that relates the two units, giving a decimal when the division is not exact.
  procedure:
    - Find the power of ten k with 1 larger unit = k smaller units.
    - Divide the measurement by k.
    - Label the quotient with the larger unit.
  assess: "Write 5 cm in meters as a decimal. (1 m = 100 cm)"
  sources: {ccss: ["5.MD.A.1"], lc: ["0c81b764"]}
  strand: M3
- id: measurement.unit-conversion.to-larger.fraction
  concept: measurement
  facet: unit-conversion
  level: 3
  type: procedure
  name: Convert a measurement to a larger unit as a fraction
  statement: When 1 larger unit = k smaller units, n smaller units equal n/k larger units, written as a fraction or mixed number.
  procedure:
    - Find k, the number of smaller units in 1 larger unit.
    - Write the number of smaller units over k as the fraction n/k.
    - Label the fraction with the larger unit.
  assess: "What fraction of a foot is 9 inches? (1 ft = 12 in)"
  sources: {ccss: ["5.MD.A.1"], lc: ["0c81b764"]}
  strand: M3
- id: number-line.measurement-scale
  concept: number-line
  facet: measurement-scale
  level: 2
  type: representation
  name: Represent a measurement on a number line with a measurement scale
  statement: A measurement is shown on a number line whose marks are labeled in a unit of measure as the point that many units from 0, reading the size of the interval between marks when the marks are not one unit apart.
  assess: "A number line runs from 0 mL to 1000 mL, labeled only at 0 and 1000, with a mark every 100 mL. Mark 700 mL."
  sources: {ccss: ["4.MD.A.2"], lc: ["a05de981"]}
  strand: M3
- id: measurement.application.whole-number
  concept: measurement
  facet: quantity
  level: 2
  type: application
  name: Solve one- and two-step measurement word problems with whole numbers
  statement: Solve one- and two-step word problems about distances, liquid volumes, or masses, with all quantities given as whole numbers in one unit, using any of the four operations.
  assess: "A ribbon 260 cm long is cut into 4 equal pieces. Then 15 cm is cut off one piece. How long is that piece now?"
  sources: {ccss: ["4.MD.A.2"], lc: ["2abe1331", "e13cdaca", "3d94e385"]}
  strand: M3
- id: measurement.application.time-interval
  concept: measurement
  facet: time
  level: 2
  type: application
  name: Solve word problems about time intervals that cross the hour
  statement: Solve one- and two-step word problems that find a start time, end time, or elapsed time in hours and minutes, where the interval may cross an hour.
  assess: "Ana leaves home at 2:50 pm. The bus ride takes 25 minutes and the walk after it takes 15 minutes. What time does she arrive?"
  sources: {ccss: ["4.MD.A.2"], lc: ["ef9f46a3", "2abe1331"]}
  strand: M3
- id: measurement.application.fraction
  concept: measurement
  facet: quantity
  level: 2
  type: application
  name: Solve measurement word problems with simple fractions
  statement: Solve word problems about distances, liquid volumes, masses, or times in which the measurements are simple fractions or mixed numbers of one unit.
  assess: "Lia walked 3/8 mile to school and 7/8 mile home by a longer route. How far did she walk in all?"
  sources: {ccss: ["4.MD.A.2"], lc: ["9432b8e1"]}
  strand: M3
- id: measurement.application.money
  concept: measurement
  facet: quantity
  level: 2
  type: application
  name: Solve word problems with money in dollars and cents
  statement: Solve word problems about money in which amounts are written in dollars and cents with decimal notation.
  assess: "A notebook costs $2.75 and a pen costs $1.40. How much do they cost together?"
  sources: {ccss: ["4.MD.A.2"], lc: ["9432b8e1", "2abe1331"]}
  strand: M3
- id: measurement.application.convert-to-smaller
  concept: measurement
  facet: unit-conversion
  level: 2
  type: application
  name: Solve measurement word problems that need a larger unit written in a smaller unit
  statement: Solve word problems whose measurements are given in two units of one system, by first expressing the larger-unit measurement in the smaller unit.
  assess: "A rope is 3 m long. Kim cuts off a piece 85 cm long. How many centimeters of rope are left? (1 m = 100 cm)"
  sources: {ccss: ["4.MD.A.2"], lc: ["a16722fd"]}
  strand: M3
- id: measurement.application.conversion.multistep
  concept: measurement
  facet: unit-conversion
  level: 3
  type: application
  name: Solve multi-step real-world problems that use unit conversions
  statement: Solve multi-step real-world problems in which a conversion between units of one system, in either direction and with whole-number, decimal, or fraction results, is one of the steps.
  assess: "Jo runs 750 m each day for 5 days. How many kilometers does she run in all? (1 km = 1000 m)"
  sources: {ccss: ["5.MD.A.1"], lc: ["0013fbee"]}
  strand: M3
- id: area.rectangle.unknown-side
  concept: area
  facet: unit-squares
  level: 3
  type: procedure
  name: Find an unknown side of a rectangle from its area
  statement: Given the area A of a rectangle and one side length, the other side length is the unknown factor in A = l x w, found by dividing A by the known side.
  procedure:
    - Write A = l x w with the known area and known side filled in.
    - Find the unknown factor by dividing the area by the known side.
    - Label the result with the length unit.
  assess: "A rectangle has an area of 96 square feet and a length of 12 feet. What is its width?"
  sources: {ccss: ["4.MD.A.3"], lc: ["984b8dc3"]}
  strand: M3
- id: area.application.rectangle
  concept: area
  facet: unit-squares
  level: 3
  type: application
  name: Solve real-world problems with the rectangle area formula
  statement: Solve real-world problems that use A = l x w for a rectangle, finding either the area or an unknown side length.
  assess: "A rectangular room needs 180 square feet of flooring. The room is 15 feet long. How wide is it?"
  sources: {ccss: ["4.MD.A.3"], lc: ["92e853a7"]}
  strand: M3
- id: perimeter.rectangle.formula
  concept: perimeter
  facet: core
  level: 3
  type: concept
  name: The perimeter formula for a rectangle
  statement: A rectangle with length l and width w has perimeter P = 2 x l + 2 x w, because its opposite sides are equal, so it has two sides of each length.
  assess: "A rectangle has length l and width w. Which expression gives its perimeter: l x w, l + w, 2 x l + 2 x w, or 4 x l?"
  sources: {ccss: ["4.MD.A.3"], lc: ["1a91a235"]}
  strand: M3
- id: perimeter.rectangle.unknown-side
  concept: perimeter
  facet: core
  level: 3
  type: procedure
  name: Find an unknown side of a rectangle from its perimeter
  statement: Given the perimeter P and the length l of a rectangle, the width is w = P divided by 2, minus l, since l + w is half the perimeter.
  procedure:
    - Divide the perimeter by 2 to get the sum of one length and one width.
    - Subtract the known side from that sum.
    - Label the result with the length unit.
  assess: "A rectangle has a perimeter of 30 cm and a length of 9 cm. What is its width?"
  sources: {ccss: ["4.MD.A.3"], lc: ["1a91a235"]}
  strand: M3
- id: perimeter.application.rectangle
  concept: perimeter
  facet: core
  level: 3
  type: application
  name: Solve real-world problems with the rectangle perimeter formula
  statement: Solve real-world problems that use P = 2 x l + 2 x w for a rectangle, finding either the perimeter or an unknown side length.
  assess: "A rectangular garden is 14 m long and needs 46 m of fence to go all the way around. How wide is the garden?"
  sources: {ccss: ["4.MD.A.3"], lc: ["8a82f241"]}
  strand: M3
- id: data.line-plot.fraction-scale.make
  concept: data
  facet: line-plot
  level: 2
  type: representation
  name: Make a line plot of measurements in halves, fourths, and eighths
  statement: A data set of measurements in halves, fourths, or eighths of a unit is shown by marking a number line in the finest of those parts and placing one X above the point for each measurement.
  procedure:
    - Draw a number line from at or below the least value to at or above the greatest value.
    - Partition each whole unit into the finest part used in the data (halves, fourths, or eighths) and label the marks.
    - Place one X above the mark for each measurement, stacking Xs for repeated values.
  assess: "Make a line plot of these pencil lengths, in inches: 5 1/2, 5 3/4, 6, 5 3/4, 5 1/8, 6 1/4, 5 1/2."
  sources: {ccss: ["4.MD.B.4", "5.MD.B.2"], lc: ["701d2a97", "613323d4"]}
  strand: M3
- id: data.line-plot.fraction.add-subtract
  concept: data
  facet: line-plot
  level: 2
  type: application
  name: Solve addition and subtraction problems from a fraction line plot
  statement: Solve problems that add or subtract fractional measurements read from a line plot whose scale is marked in fractions of a unit.
  assess: "A line plot of insect lengths runs from 0 to 1 inch, marked in eighths, with Xs at 2/8, 3/8, 3/8, 5/8, and 7/8. How much longer is the longest insect than the shortest?"
  sources: {ccss: ["4.MD.B.4"], lc: ["751c388e"]}
  strand: M3
- id: data.line-plot.fraction.multistep
  concept: data
  facet: line-plot
  level: 3
  type: application
  name: Solve multi-step fraction problems from a line plot
  statement: Solve multi-step problems that combine data read from a fraction line plot using fraction addition, subtraction, multiplication, or division, such as finding an equal redistribution of a total.
  assess: "A line plot shows the liquid in 6 identical beakers, in liters, with Xs at 1/4, 1/2, 1/2, 3/4, 1, and 1. If all the liquid were poured together and shared equally among the 6 beakers, how much would each beaker hold?"
  sources: {ccss: ["5.MD.B.2"], lc: ["fcae5c49"]}
  strand: M3
