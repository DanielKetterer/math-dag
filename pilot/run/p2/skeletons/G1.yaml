- id: shapes.name.any-orientation
  concept: shapes
  facet: core
  level: 1
  type: representation
  name: Name flat shapes whatever their size or orientation
  statement: Give the correct name (circle, triangle, square, rectangle, hexagon) to any example of the shape, including tilted, very large or small, and non-typical examples such as a long thin triangle or a square standing on a corner.
  assess: "Name each shape: a square turned to stand on one corner, a long thin triangle pointing down, a small hexagon, a tall narrow rectangle, a very large circle."
  sources:
    ccss: ["K.G.A.2"]
    lc: ["742ff270", "d6a100ad", "edb08bc2", "0dee77b7", "813238cd", "2754c1cd", "9a476e0a"]
  strand: G1
- id: shapes.name.solids
  concept: shapes
  facet: core
  level: 1
  type: representation
  name: Name solid shapes whatever their size or orientation
  statement: Give the correct name (cube, cone, cylinder, sphere) to any example of the solid, whatever its size and however it is placed, for example a cone lying on its side or a short wide cylinder.
  assess: "Name each solid: a small cube, a cone lying on its side, a large sphere, a short wide cylinder standing on end, a tall thin cylinder lying down."
  sources:
    ccss: ["K.G.A.2"]
    lc: ["9a476e0a"]
  strand: G1
- id: shapes.name.real-objects
  concept: shapes
  facet: core
  level: 1
  type: representation
  name: Name the shape of an everyday object
  statement: Name the shape an everyday object has, ignoring its material, color and small details, using a solid name for its form (a can is a cylinder) or a flat shape name for a face or outline (the front of a door is a rectangle).
  assess: "Point to each object and name its shape: a ball, a soup can, the front of a door, a party hat, a block."
  sources:
    ccss: ["K.G.A.1"]
    lc: ["3938ec14"]
  strand: G1
- id: shapes.dimension.flat-solid
  concept: shapes
  facet: core
  level: 1
  type: concept
  name: Tell flat shapes from solid shapes
  statement: A two-dimensional shape is flat, lying in a plane like a drawing on paper; a three-dimensional shape is solid, with thickness in every direction like a ball or a box.
  assess: "Sort these into flat and solid: a triangle drawn on paper, a ball, a square drawn on paper, a cereal box, a soup can, a circle drawn on paper."
  sources:
    ccss: ["K.G.A.3"]
    lc: ["dc883171", "9eae2bea"]
  strand: G1
- id: shapes.attribute.equal-sides
  concept: shapes
  facet: properties
  level: 1
  type: concept
  name: Notice whether a shape's sides are equal in length
  statement: Some shapes have all their sides the same length (a square) and some do not (a long rectangle); whether the sides are equal is an attribute of the shape, found by comparing side lengths.
  assess: "Here are a square, a long thin rectangle, and a triangle with one long side. Which shape has all its sides the same length?"
  sources:
    ccss: ["K.G.B.4"]
    lc: ["2b32313c"]
  strand: G1
- id: shapes.compare.by-attributes
  concept: shapes
  facet: properties
  level: 1
  type: procedure
  name: Compare two flat shapes by their parts and attributes
  statement: Say how two flat shapes are alike and how they differ by their parts (number of sides and corners) and attributes (equal sides, straight or curved sides), not by size or orientation.
  procedure:
    - Count the sides and the corners of each shape.
    - Check other attributes of each shape, such as whether its sides are equal and whether they are straight or curved.
    - Name the parts and attributes the two shapes share and those they do not, ignoring size and orientation.
  assess: "Here are a large square and a small rectangle lying on its long side. Tell one way they are alike and one way they are different, without talking about size."
  sources:
    ccss: ["K.G.B.4"]
    lc: ["7dfda327", "2b32313c", "fcecf352", "040a3c85", "50953a3f"]
  strand: G1
- id: shapes.solid.parts
  concept: shapes
  facet: properties
  level: 1
  type: concept
  name: Identify the faces, curved surfaces and corners of a solid
  statement: The parts of a solid are its flat faces, its curved surfaces, the edges where faces meet, and its corners (vertices); a cube has 6 flat faces and 8 corners, a sphere has one curved surface and no corners.
  assess: "Here are a cube and a cylinder. How many flat faces does each have? Which one has a curved surface?"
  sources:
    ccss: ["K.G.B.4"]
    lc: ["7ea56e28"]
  strand: G1
- id: shapes.compare.solids.by-attributes
  concept: shapes
  facet: properties
  level: 1
  type: procedure
  name: Compare two solids by their parts and attributes
  statement: Say how two solids are alike and how they differ by their parts (flat faces, curved surfaces, corners) and attributes (whether it rolls, whether it stacks), not by size or orientation.
  procedure:
    - Find and count the flat faces and corners of each solid, and check for curved surfaces.
    - Name the parts and attributes the two solids share and those they do not, ignoring size and orientation.
  assess: "Here are a large cylinder standing up and a small cone lying on its side. Tell one way they are alike and one way they are different, without talking about size."
  sources:
    ccss: ["K.G.B.4"]
    lc: ["7dfda327", "40a169c6", "b70d9b7c", "305edb5e"]
  strand: G1
- id: shapes.draw.named
  concept: shapes
  facet: core
  level: 1
  type: procedure
  name: Draw a named flat shape
  statement: Draw a named shape (circle, triangle, square, rectangle, hexagon) as a closed figure with the right number of straight sides meeting at corners, or one closed curve for a circle.
  procedure:
    - Recall how many straight sides the named shape has, or that a circle has one curved side.
    - Draw the sides one after another, each starting where the last one ended.
    - Finish at the starting point so the shape is closed.
  assess: "Draw a triangle. Then draw a hexagon."
  sources:
    ccss: ["K.G.B.5"]
    lc: ["0c9a3738"]
  strand: G1
- id: shapes.attribute.defining
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Defining attributes of a named shape
  statement: A defining attribute is a feature every example of a shape must have; together they decide the shape's name. A triangle is closed with three straight sides; a rectangle is closed with four straight sides and four square corners; a square is a rectangle whose four sides are equal; a hexagon is closed with six straight sides.
  assess: "Tell what every rectangle must have, whatever its size or color."
  sources:
    ccss: ["1.G.A.1"]
    lc: ["eb8d0c94"]
  strand: G1
- id: shapes.attribute.non-defining
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Color, size and orientation do not decide a shape's name
  statement: Color, overall size, orientation and material are not defining attributes; changing them never changes which kind of shape a figure is.
  assess: "Mia says this big triangle is not a triangle because it is upside down and very big. Is she right? Why?"
  sources:
    ccss: ["1.G.A.1"]
    lc: ["a8e2fb9e"]
  strand: G1
- id: shapes.classify.defining-attributes
  concept: shapes
  facet: properties
  level: 2
  type: procedure
  name: Decide whether a figure is a named shape by its defining attributes
  statement: A figure is a triangle, square, rectangle or trapezoid exactly when it has every defining attribute of that shape, however it looks otherwise; the check is correct for any figure, so a square also passes the rectangle check.
  procedure:
    - Recall the defining attributes of the named shape.
    - Check the figure for each one (closed, number of straight sides, square corners, equal sides).
    - Name the figure as that shape exactly when every defining attribute holds, ignoring color, size and orientation.
  assess: "Which of these are triangles? A closed three-sided figure with all sides different, a three-sided figure with a gap at one corner, a figure with two straight sides and one curved side, a long thin three-sided figure pointing down, a four-sided figure."
  sources:
    ccss: ["1.G.A.1"]
    lc: ["baa38680"]
  strand: G1
- id: shapes.draw.defining-attributes
  concept: shapes
  facet: properties
  level: 2
  type: procedure
  name: Draw or build a non-typical example of a named shape
  statement: Draw or build a figure that has every defining attribute of a named shape while its non-defining attributes (size, orientation, proportions) differ from a given example.
  procedure:
    - Recall the defining attributes of the named shape.
    - Choose a size, orientation or proportions different from the given example.
    - Draw or build the figure so that it has each defining attribute, and check it is closed.
  assess: "Here is a triangle with equal sides pointing up. Draw a triangle that looks very different from it but is still a triangle."
  sources:
    ccss: ["1.G.A.1"]
    lc: ["205ba874"]
  strand: G1
- id: shapes.compose.composite-unit
  concept: shapes
  facet: composition
  level: 1
  type: procedure
  name: Use a composite flat shape as a unit to make a new shape
  statement: Make a composite shape from flat shapes, then treat the composite as a single piece and put copies of it together to make a new, larger shape.
  procedure:
    - Put flat shapes together, full sides touching, to make a composite shape.
    - Keep the composite together (or trace it) so it acts as one piece.
    - Put copies of the composite together, full sides touching, to make the new shape.
  assess: "Put two triangles together to make a square. Now use four of those two-triangle squares to make a bigger square."
  sources:
    ccss: ["1.G.A.2"]
    lc: ["91c7843b"]
  strand: G1
- id: shapes.compose.solids
  concept: shapes
  facet: composition
  level: 1
  type: procedure
  name: Put solids together to make a composite solid
  statement: Join solids (cubes, rectangular prisms, cones, cylinders) face to face to build a larger composite solid.
  procedure:
    - Choose a face of one solid and a matching face of another.
    - Place the two faces together so they meet fully.
    - Repeat with further solids until the composite is built.
  assess: "Use these cubes to build a box shape that is 3 cubes long and 1 cube wide and tall."
  sources:
    ccss: ["1.G.A.2"]
    lc: ["c9cf956f"]
  strand: G1
- id: shapes.compose.solids.composite-unit
  concept: shapes
  facet: composition
  level: 1
  type: procedure
  name: Use a composite solid as a unit to make a new solid
  statement: Build a composite solid, then treat it as a single piece and join copies of it to make a new, larger solid.
  procedure:
    - Join solids face to face to make a composite solid.
    - Keep the composite together so it acts as one piece.
    - Join copies of the composite face to face to make the new solid.
  assess: "Stack two cubes to make a tower. Now use two of those towers to build a box that is 2 cubes tall and 2 cubes long."
  sources:
    ccss: ["1.G.A.2"]
    lc: ["aaaeae52"]
  strand: G1
- id: shapes.polygon.name-by-sides
  concept: shapes
  facet: properties
  level: 2
  type: representation
  name: Name a polygon as a triangle, quadrilateral, pentagon or hexagon
  statement: A closed figure with straight sides is a triangle, quadrilateral, pentagon or hexagon according to whether it has 3, 4, 5 or 6 sides, whatever its side lengths, corners or orientation.
  assess: "Name each shape as a triangle, quadrilateral, pentagon or hexagon: an arrowhead shape with 4 sides, a house shape with 5 sides, a hexagon with unequal sides, a tilted triangle with all sides different, a long thin rectangle."
  sources:
    ccss: ["2.G.A.1"]
    lc: ["624d3620", "d63cce08", "d7569c36", "d2a946e9"]
  strand: G1
- id: shapes.identify.specified-attributes
  concept: shapes
  facet: properties
  level: 2
  type: procedure
  name: Pick out the shapes that have a given attribute
  statement: From a set of flat shapes, select exactly those that have a stated attribute, such as a given number of sides or angles, or all sides equal.
  procedure:
    - For each shape, count or check the stated attribute.
    - Select the shape when the attribute matches and leave it otherwise.
  assess: "Circle every shape that has exactly 5 angles: a regular pentagon, a house-shaped pentagon, a hexagon, a square, a pentagon standing on one corner."
  sources:
    ccss: ["2.G.A.1"]
    lc: ["6c049f8a"]
  strand: G1
- id: shapes.draw.specified-attributes
  concept: shapes
  facet: properties
  level: 2
  type: procedure
  name: Draw a shape with a given number of sides and angles
  statement: Draw a closed figure with straight sides that has a stated number of sides and angles.
  procedure:
    - Place as many dots as the stated number, spaced around an imaginary circle.
    - Join each dot to the next one around the circle with a straight line.
    - Join the last dot to the first, so the shape is closed with one angle at each dot.
  assess: "Draw a shape that has exactly 5 sides and 5 angles."
  sources:
    ccss: ["2.G.A.1"]
    lc: ["a0038c5e"]
  strand: G1
- id: shapes.cube.identify
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: A cube has six equal square faces
  statement: A cube is a solid with 6 flat faces that are all squares of the same size; a box whose faces are not all equal squares is not a cube.
  assess: "Which of these solids are cubes: a number cube, a cereal box, a small square-faced block, a box with two square faces and four long rectangular faces?"
  sources:
    ccss: ["2.G.A.1"]
    lc: ["fe364f7f"]
  strand: G1
- id: partitioning.rectangle.rows-columns
  concept: partitioning
  facet: area
  level: 1
  type: procedure
  name: Partition a rectangle into rows and columns of same-size squares
  statement: Draw lines across and down a rectangle whose sides fit a whole number of square sides, so that it is split into rows and columns of same-size squares with no gaps or overlaps.
  procedure:
    - Draw lines across the rectangle, evenly spaced, to make the rows.
    - Draw lines up and down, evenly spaced at the same spacing as the rows, to make the columns.
    - Check that every part is a square and all the squares are the same size.
  assess: "This rectangle is as long as 4 of these small squares and as tall as 3 of them. Draw lines to split it into rows and columns of same-size squares."
  sources:
    ccss: ["2.G.A.2"]
    lc: ["df455161"]
  strand: G1
- id: counting.array.squares
  concept: counting
  facet: core
  level: 1
  type: procedure
  name: Count the squares of a rectangle partitioned into rows and columns
  statement: Find how many same-size squares fill a partitioned rectangle by counting each square exactly once, keeping track of the count row by row or column by column.
  procedure:
    - Count the squares in the first row.
    - Continue the count through each next row in turn, without skipping or recounting a square.
    - The last number said is the total.
  assess: "This rectangle is split into 3 rows of 5 same-size squares. How many squares are there?"
  sources:
    ccss: ["2.G.A.2"]
    lc: ["2cd4f531"]
  strand: G1
