new_concepts:
  - {concept: area, facet: unit-squares, reason: "Area as the count of unit squares covering a figure (unit square, covering without gaps or overlaps, counting, tiling)."}
  - {concept: area, facet: multiplicative, reason: "Area of a rectangle as the product of its side lengths (rows of equal squares); the reserved id area.rectangle.length-times-width lives here."}
  - {concept: area, facet: additive, reason: "Area of a figure as the sum of the areas of non-overlapping parts (3.MD.C.7.d)."}
  - {concept: perimeter, facet: core, reason: "Perimeter as the length of a polygon's boundary; no existing concept covers it."}
  - {concept: data, facet: picture-graph, reason: "Picture graphs, including scaled ones where one picture stands for several data points."}
  - {concept: data, facet: bar-graph, reason: "Bar graphs, including scaled value axes; M1 owns data.graphs.read and may need the same concept."}
  - {concept: data, facet: line-plot, reason: "Line plots of measurement data on a scale marked in wholes, halves, or fourths."}
  - {concept: measurement, facet: time, reason: "Telling time and measuring time intervals in minutes."}
  - {concept: measurement, facet: liquid-volume, reason: "Measuring and estimating liquid volume in liters."}
  - {concept: measurement, facet: mass, reason: "Measuring and estimating mass in grams and kilograms; M1 owns measurement.weight.attribute, which may sit on a weight or mass facet."}
  - {concept: measurement, facet: measured-quantity, reason: "Operating on a measurement as a number of same units in word problems, where the arithmetic does not depend on whether the quantity is mass or liquid volume (3.MD.A.2 word problems). Used to avoid writing each operation twice."}
