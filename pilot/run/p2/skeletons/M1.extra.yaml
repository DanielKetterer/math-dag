notes: >-
  75eff216 and fbd247f1 (direct comparison of any measurable attribute, more of / less of) are met by
  comparing.size.direct for length and comparing.weight.direct for weight; listed under the length node only
  because covered_by takes one node. The K.MD.A.2 'describe the difference' components are split into a length
  node and a weight node because their prerequisite sets differ (length attribute versus weight attribute).
  measurement.length.ruler cites 2c71367f (measure twice with different units) and 33364bb0 (generate
  measurement data to the nearest whole unit): neither needs anything beyond measuring once with a ruler in a
  standard unit; the unit-size relation is its own concept node. measurement.length.ruler.from-zero,
  data.bar-graph.read and money.notation have no lc: they come from the standard text (2.MD.A.1 tool use,
  2.MD.D.10 reading a bar graph, 2.MD.C.8 'using $ and cents symbols'). measurement.length.unit-benchmarks and
  measurement.length.estimate both cite 5cfd8c36: estimating needs a benchmark, and knowing the benchmark is
  tested separately. Time: digital reading for hours, half hours and five minutes is one node (same prerequisite
  set: reading the numerals before and after the colon); analog reading is split hour / half hour / five minutes
  because half hours need the hour hand between numbers and halves of the clock, and five minutes need counting
  by fives. Read and draw on an analog clock are separate nodes (inverse representations). f25112a6
  (analog to digital and back) is cited on time.analog.five-minutes and time.analog.draw-five-minutes; the
  digital side is time.digital.read and time.digital.write. The a.m./p.m. components are cited on time.am-pm as
  well as on their clock node. Money: a dollar equals 100 cents is not written as a node, since 2.MD.C.8 problems
  keep dollars and cents separate and do not use decimal notation; a later strand may need it. The 1.MD.C.4 nodes
  (count-based charts, up to three categories) and the 2.MD.D.10 bar-graph nodes are separated by representation,
  not by the number of categories: the bar graph adds reading a scale. The data.bar-graph application nodes reuse
  the put-together / take-apart / compare problem types; the new part is taking the numbers from the graph.
  Length word problems (2.MD.B.5) are split into addition and subtraction nodes; 55fefca2 is cited on both. The
  equation components of 2.MD.B.5 are covered by equation.situation.one-step; length is only the context.
