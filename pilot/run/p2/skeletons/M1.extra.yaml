new_concepts:
  - {concept: measurement, facet: weight, reason: "Weight (heaviness) as a measurable attribute, distinct from length; needed for measurement.weight.attribute."}
  - {concept: measurement, facet: core, reason: "Measurable attributes in general (an object has several), not tied to one attribute."}
  - {concept: time, facet: clock, reason: "New concept: telling and writing time on analog and digital clocks."}
  - {concept: time, facet: day, reason: "The day as two 12-hour halves named a.m. and p.m."}
  - {concept: money, facet: core, reason: "New concept: coin values, money amounts in cents and dollars, money notation and money word problems."}
  - {concept: data, facet: categorical, reason: "New concept: counts in categories, charts, picture graphs and bar graphs."}
  - {concept: data, facet: measurement, reason: "Measurement data shown on a line plot with a numeric scale; differs from categorical data."}
retires:
  - {id: data.graphs.read, replaced_by: [data.categorical.read-count, data.bar-graph.read], note: "Broader than one node: reading a one-mark-per-point chart or picture graph needs only counting, while reading a bar graph needs a scale. Reading scaled picture and bar graphs (3.MD.B.3), line plots, and tables belong to later strands; a re-pointing pass should send each of the 3 old edges to the specific read node its source node needs, which may be a later-phase node."}
