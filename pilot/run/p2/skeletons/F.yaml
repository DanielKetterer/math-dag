- id: addition.within-10
  concept: addition
  facet: operation
  level: 1
  type: procedure
  name: Find a sum within 10
  statement: "Find the sum of two whole numbers whose total is at most 10, by any reliable method: joining objects, fingers or a drawing and counting, counting on, or a known fact."
  assess: "What is 4 + 3? Show or tell how you know."
  sources: {ccss: ["K.OA.A.2"], lc: ["10c58598"]}
  strand: F
- id: subtraction.within-10
  concept: subtraction
  facet: operation
  level: 1
  type: procedure
  name: Find a difference within 10
  statement: "Find a - b for whole numbers with b no greater than a and a at most 10, by any reliable method: taking objects away and counting the rest, counting back, counting up, or a known fact."
  assess: "What is 9 - 4? Show or tell how you know."
  sources: {ccss: ["K.OA.A.2"], lc: ["5c48ad41"]}
  strand: F
