- id: measurement.weight.attribute
  concept: measurement
  facet: weight
  level: 1
  type: concept
  name: "Weight as an attribute of an object, separate from its size"
  statement: "Weight is how heavy an object is, felt by holding it or shown on a balance; it is a different attribute from size, so a bigger object is not necessarily heavier."
  assess: "Hold a large beach ball in one hand and a small rock in the other. Sam says the beach ball is heavier because it is bigger. Is Sam right?"
  sources: {ccss: ["K.MD.A.1"], lc: ["c6c9c231"]}
  strand: M1
- id: measurement.attributes.several
  concept: measurement
  facet: core
  level: 1
  type: concept
  name: "One object has several measurable attributes"
  statement: "A single object has several different measurable attributes, such as length, height, weight and how much it holds, and each one can be described separately with its own words."
  assess: "Look at this water bottle. Name two different things about it that could be measured, and give a describing word for each."
  sources: {ccss: ["K.MD.A.1"], lc: ["c6c9c231", "5403c7b6"]}
  strand: M1
- id: comparing.length.describe-difference
  concept: comparing
  facet: length
  level: 1
  type: representation
  name: "Describe a direct length comparison with length words"
  statement: "After two objects are compared directly by length or height, the result is stated with the comparison words for that attribute (longer or shorter, taller or shorter) rather than a general word such as bigger."
  assess: "Two children stand back to back and one is clearly taller. Tell how their heights compare, using a word that is about height."
  sources: {ccss: ["K.MD.A.2"], lc: ["7e7f1a54", "2f9bf4e6", "4f7b7e82"]}
  strand: M1
- id: comparing.weight.describe-difference
  concept: comparing
  facet: weight
  level: 1
  type: representation
  name: "Describe a direct weight comparison with weight words"
  statement: "After two objects are compared directly by weight, the result is stated with the comparison words heavier or lighter rather than a general word such as bigger."
  assess: "A pan balance holds a book on one side and a box of crayons on the other, and the book side is lower. Tell how the weights compare, using a word that is about weight."
  sources: {ccss: ["K.MD.A.2"], lc: ["7e7f1a54", "2f9bf4e6", "4f7b7e82"]}
  strand: M1
- id: comparing.length.indirect
  concept: comparing
  facet: length
  level: 1
  type: procedure
  name: "Compare two lengths indirectly using a third object"
  statement: "Two lengths that cannot be placed side by side are compared by matching a third object, such as a string, to one of them and then comparing that third object with the other; whichever is longer than the matched string is the longer."
  procedure:
    - "Lay a string or strip along the first object and mark or cut it at the first object's length."
    - "Place the marked string along the second object, with one end lined up."
    - "If the second object extends past the mark, it is longer than the first; if it stops short, it is shorter; if it ends at the mark, they are the same length."
  assess: "The door and the bookshelf cannot be moved next to each other. Use this piece of string to find out which is wider."
  sources: {ccss: ["1.MD.A.1"], lc: ["e650344b"]}
  strand: M1
- id: measurement.length.tool.select
  concept: measurement
  facet: length
  level: 2
  type: concept
  name: "Choose a suitable tool for measuring a length"
  statement: "A measuring tool suits a length when it is long enough to span much of it and can follow its shape: a ruler for short straight lengths, a yardstick or meter stick for longer straight lengths, a measuring tape for very long or curved lengths."
  assess: "Which tool would you use to measure the distance around a pumpkin: a 12-inch ruler, a meter stick, or a measuring tape? Why?"
  sources: {ccss: ["2.MD.A.1"], lc: ["bf50bd46"]}
  strand: M1
- id: measurement.length.ruler.from-zero
  concept: measurement
  facet: length
  level: 2
  type: concept
  name: "Ruler numbers count units from the 0 mark"
  statement: "The number at a mark on a ruler counts the whole units from the 0 mark to that mark, so an object's length is the number of units between its two ends, which equals the number at its far end only when its near end is at 0."
  assess: "A crayon lies along an inch ruler from the 2 mark to the 7 mark. How long is the crayon?"
  sources: {ccss: ["2.MD.A.1"], lc: []}
  strand: M1
- id: measurement.length.ruler
  concept: measurement
  facet: length
  level: 2
  type: procedure
  name: "Measure a length in standard units with a ruler or other tool"
  statement: "Measure a length in inches, feet, centimeters or meters by lining up the 0 mark of a ruler, yardstick, meter stick or tape with one end of the object and reading the whole-unit mark nearest the other end, reported with the unit."
  procedure:
    - "Choose the unit and a tool marked in that unit."
    - "Line up the 0 mark of the tool with one end of the object, keeping the tool straight along the object."
    - "Find the whole-unit mark nearest the other end of the object."
    - "Report that number with the unit name."
  assess: "Use your centimeter ruler to measure this pencil, drawn at actual size, to the nearest centimeter."
  sources: {ccss: ["2.MD.A.1", "2.MD.A.2", "2.MD.D.9"], lc: ["c93f5e69", "2c71367f", "33364bb0"]}
  strand: M1
- id: measurement.length.unit-size.inverse
  concept: measurement
  facet: length
  level: 2
  type: concept
  name: "A larger unit gives a smaller measurement"
  statement: "When the same length is measured in two different units, the measurement in the larger unit is the smaller number, because each larger unit covers more of the length."
  assess: "A table is 4 feet long. Without measuring, is its length in inches a number greater than 4, less than 4, or equal to 4?"
  sources: {ccss: ["2.MD.A.2"], lc: ["b5092424"]}
  strand: M1
- id: measurement.length.unit-benchmarks
  concept: measurement
  facet: length
  level: 2
  type: concept
  name: "Know benchmark sizes of standard length units"
  statement: "Each standard length unit has a familiar benchmark of about its size: an inch is about the length of a thumb joint, a foot about the length of a sheet of paper, a centimeter about the width of a fingertip, a meter about the length of a long step or a baseball bat."
  assess: "Which is about 1 meter long: a pencil, a baseball bat, or a school bus?"
  sources: {ccss: ["2.MD.A.3"], lc: ["5cfd8c36"]}
  strand: M1
- id: measurement.length.estimate
  concept: measurement
  facet: length
  level: 2
  type: procedure
  name: "Estimate a length in a standard unit"
  statement: "Estimate a length in inches, feet, centimeters or meters by picturing copies of a benchmark for the unit laid end to end along the object and giving the whole number of units that would fit."
  procedure:
    - "Recall a benchmark for the named unit."
    - "Picture copies of the benchmark laid end to end along the object, with no gaps or overlaps."
    - "Give the number of copies that would fit as the estimate, with the unit."
  assess: "Without measuring, about how many inches long is this new crayon? (A new crayon is a little over 3 inches long; any estimate from 2 to 5 inches is accepted.)"
  sources: {ccss: ["2.MD.A.3"], lc: ["5cfd8c36"]}
  strand: M1
- id: measurement.length.difference
  concept: measurement
  facet: length
  level: 2
  type: procedure
  name: "Measure to find how much longer one object is than another"
  statement: "How much longer one object is than another is the difference of their lengths measured in the same standard unit, stated in that unit."
  procedure:
    - "Measure both objects in the same standard unit."
    - "Find the difference of the two lengths."
    - "State the difference with the unit."
  assess: "A blue strip and a red strip lie along an inch ruler, both starting at 0. The blue strip ends at 6 and the red strip ends at 9. How many inches longer is the red strip than the blue strip?"
  sources: {ccss: ["2.MD.A.4"], lc: ["19ea874e", "f81bec09"]}
  strand: M1
- id: measurement.length.application.addition
  concept: measurement
  facet: length
  level: 2
  type: application
  name: "Solve addition word problems about lengths within 100"
  statement: "A one-step word problem gives lengths in the same unit that are joined end to end or combined, with sums within 100; the learner finds the unknown length and states it with the unit."
  assess: "A ribbon is 34 centimeters long. Maya tapes another ribbon 25 centimeters long to its end. How long is the ribbon now?"
  sources: {ccss: ["2.MD.B.5"], lc: ["55fefca2", "0adb13b7"]}
  strand: M1
- id: measurement.length.application.subtraction
  concept: measurement
  facet: length
  level: 2
  type: application
  name: "Solve subtraction word problems about lengths within 100"
  statement: "A one-step word problem gives lengths in the same unit, within 100, where a piece is cut off or two lengths are compared; the learner finds the unknown length and states it with the unit."
  assess: "A board is 72 inches long. Dad cuts off a piece 28 inches long. How long is the board that is left?"
  sources: {ccss: ["2.MD.B.5"], lc: ["55fefca2", "a39e99c4"]}
  strand: M1
- id: time.analog.hour
  concept: time
  facet: clock
  level: 2
  type: representation
  name: "Tell time to the hour on an analog clock"
  statement: "When the minute hand of an analog clock points to 12, the clock shows a whole hour, named by the number the hour hand points to and read as that number o'clock."
  assess: "On this clock the short hand points to 3 and the long hand points to 12. What time is it?"
  sources: {ccss: ["1.MD.B.3"], lc: ["de9193f8"]}
  strand: M1
- id: time.analog.half-hour
  concept: time
  facet: clock
  level: 2
  type: representation
  name: "Tell time to the half hour on an analog clock"
  statement: "When the minute hand points to 6 it has gone halfway around since the hour, so the time is half past the hour; the hour hand is then halfway between two numbers, and the hour is the number it has most recently passed."
  assess: "On this clock the long hand points to 6 and the short hand is halfway between 8 and 9. What time is it?"
  sources: {ccss: ["1.MD.B.3"], lc: ["556c85d1"]}
  strand: M1
- id: time.digital.read
  concept: time
  facet: clock
  level: 2
  type: representation
  name: "Read a time on a digital clock"
  statement: "On a digital clock the number before the colon is the hour and the two digits after it are the minutes past that hour, so 7:00 is seven o'clock and 4:35 is thirty-five minutes past four."
  assess: "A digital clock shows 9:30. What hour is it, and how many minutes past that hour?"
  sources: {ccss: ["1.MD.B.3", "2.MD.C.7"], lc: ["f75162b7", "1b10f858", "54e86591"]}
  strand: M1
- id: time.analog.five-minutes
  concept: time
  facet: clock
  level: 2
  type: procedure
  name: "Tell time to the nearest five minutes on an analog clock"
  statement: "Read an analog clock to the nearest five minutes: the hour is the number the hour hand has most recently passed, and the minutes past the hour are found by counting by fives from 12 to the number nearest the minute hand."
  procedure:
    - "Find the number the hour hand has most recently passed; that is the hour."
    - "Find the number nearest the minute hand."
    - "Count by fives from 12 around to that number to get the minutes past the hour."
    - "Say or write the hour and the minutes."
  assess: "On this clock the long hand points to 7 and the short hand is a little past 4. What time is it?"
  sources: {ccss: ["2.MD.C.7"], lc: ["9af7bd3c", "f14f23e9", "f25112a6"]}
  strand: M1
- id: time.analog.draw-hour
  concept: time
  facet: clock
  level: 2
  type: representation
  name: "Show a time to the hour on an analog clock"
  statement: "A time of h o'clock is shown on an analog clock face by drawing the minute hand pointing to 12 and the hour hand pointing to h."
  assess: "Draw the hands on this blank clock face to show 5 o'clock."
  sources: {ccss: ["1.MD.B.3"], lc: ["ae4b7aec"]}
  strand: M1
- id: time.analog.draw-half-hour
  concept: time
  facet: clock
  level: 2
  type: representation
  name: "Show a time to the half hour on an analog clock"
  statement: "Half past h is shown on an analog clock face by drawing the minute hand pointing to 6 and the hour hand halfway between h and the next number."
  assess: "Draw the hands on this blank clock face to show half past 2."
  sources: {ccss: ["1.MD.B.3"], lc: ["ac90984d"]}
  strand: M1
- id: time.analog.draw-five-minutes
  concept: time
  facet: clock
  level: 2
  type: procedure
  name: "Show a time to five minutes on an analog clock"
  statement: "A time h:mm, with mm a multiple of 5, is shown on an analog clock face by drawing the minute hand to the number reached by counting by fives from 12 to mm, and the hour hand between h and the next number, closer to h when mm is small and closer to the next number when mm is large."
  procedure:
    - "Count by fives from 12 until reaching mm; draw the minute hand to that number."
    - "Draw the hour hand between h and the next number, positioned as far along as the minute hand is around the clock."
  assess: "Draw the hands on this blank clock face to show 7:20."
  sources: {ccss: ["2.MD.C.7"], lc: ["cf3900ab", "f25112a6"]}
  strand: M1
- id: time.digital.write
  concept: time
  facet: clock
  level: 2
  type: representation
  name: "Write a time described in words as a digital time"
  statement: "A time given in words is written as h:mm, with the hour before the colon and the minutes past the hour as two digits after it, so o'clock is written :00 and half past is written :30."
  assess: "Write 'twenty-five minutes past six' the way a digital clock shows it."
  sources: {ccss: ["1.MD.B.3", "2.MD.C.7"], lc: ["fca56ad3", "14fb1a65"]}
  strand: M1
- id: time.am-pm
  concept: time
  facet: day
  level: 2
  type: concept
  name: "a.m. and p.m. name the two halves of a day"
  statement: "a.m. names the times from midnight up to noon and p.m. names the times from noon up to midnight, so each clock reading happens twice a day and a.m. or p.m. tells which."
  assess: "School starts at 8:00 in the morning. Is that 8:00 a.m. or 8:00 p.m.?"
  sources: {ccss: ["2.MD.C.7"], lc: ["9af7bd3c", "54e86591", "fca56ad3", "cf3900ab"]}
  strand: M1
- id: money.coins.value
  concept: money
  facet: core
  level: 2
  type: fact
  name: "Name coins and recall their values in cents"
  statement: "A penny, a nickel, a dime and a quarter are recognized by sight and are worth 1, 5, 10 and 25 cents, regardless of their physical size."
  assess: "Here are a penny, a nickel, a dime and a quarter, mixed up. Name each coin and tell how many cents it is worth."
  sources: {ccss: ["2.MD.C.8"], lc: ["7784a836"]}
  strand: M1
- id: money.coins.total-value
  concept: money
  facet: core
  level: 2
  type: procedure
  name: "Find the total value of a collection of coins"
  statement: "The total value of a collection of coins, less than 100 cents, is the sum of the values of its coins, found most easily by counting on from the coins of greatest value."
  procedure:
    - "Sort the coins by kind, from greatest value to least."
    - "Start at the value of the first coin and count on by each coin's value: by 25s for quarters, 10s for dimes, 5s for nickels, 1s for pennies."
    - "The last number said is the total in cents."
  assess: "What is the total value of 1 quarter, 2 dimes, 1 nickel and 3 pennies?"
  sources: {ccss: ["2.MD.C.8"], lc: ["329aa819"]}
  strand: M1
- id: money.notation
  concept: money
  facet: core
  level: 2
  type: representation
  name: "Write money amounts with the dollar and cents signs"
  statement: "A whole number of dollars is written with the dollar sign before the number ($5), and a whole number of cents is written with the cents sign after the number (35 followed by the cents sign); one amount uses one sign, not both."
  assess: "Write 40 cents and 3 dollars using the money signs."
  sources: {ccss: ["2.MD.C.8"], lc: []}
  strand: M1
- id: money.application.addition
  concept: money
  facet: core
  level: 2
  type: application
  name: "Solve addition word problems with coins and dollars"
  statement: "A one-step word problem combines amounts of money given as coins, cents, or whole dollars, all in one unit; the learner finds the total and writes it with the correct sign."
  assess: "Jo has 3 dimes and 2 nickels. Her mom gives her a quarter. How much money does Jo have now?"
  sources: {ccss: ["2.MD.C.8"], lc: ["329aa819"]}
  strand: M1
- id: money.application.subtraction
  concept: money
  facet: core
  level: 2
  type: application
  name: "Solve subtraction word problems with coins and dollars"
  statement: "A one-step word problem takes away or compares amounts of money given as coins, cents, or whole dollars, all in one unit; the learner finds the unknown amount and writes it with the correct sign."
  assess: "Sam has 3 quarters. He buys a pencil for 40 cents. How much money does Sam have left?"
  sources: {ccss: ["2.MD.C.8"], lc: ["55158b1c"]}
  strand: M1
- id: data.categorical.count-each
  concept: data
  facet: categorical
  level: 1
  type: procedure
  name: "Count the objects in each category"
  statement: "After objects are sorted into given categories, with up to 10 in each, each category is counted separately to tell how many objects are in it."
  assess: "These buttons are already sorted into a red pile, a blue pile and a yellow pile. How many buttons are in each pile?"
  sources: {ccss: ["K.MD.B.3"], lc: ["7c601672"]}
  strand: M1
- id: data.categorical.order-by-count
  concept: data
  facet: categorical
  level: 1
  type: procedure
  name: "Order categories by their counts"
  statement: "Categories are put in order from the one with the most objects to the one with the fewest, or the reverse, by comparing their counts, with up to 10 in each."
  assess: "The red pile has 7 buttons, the blue pile has 4 and the yellow pile has 9. Put the piles in order from most buttons to fewest."
  sources: {ccss: ["K.MD.B.3"], lc: ["17c7558b"]}
  strand: M1
- id: data.categorical.organize
  concept: data
  facet: categorical
  level: 2
  type: representation
  name: "Organize data with up to three categories in a chart"
  statement: "A list of data points falling into up to three categories is recorded in a tally chart or table with one row for each category, one mark for each data point in its category's row, and the count for each category."
  assess: "Children named their favorite fruit: apple, banana, apple, grape, apple, banana, grape, apple. Make a tally chart with one row for each fruit."
  sources: {ccss: ["1.MD.C.4"], lc: ["8676d43c"]}
  strand: M1
- id: data.categorical.read-count
  concept: data
  facet: categorical
  level: 2
  type: representation
  name: "Read the count of a category from a chart or picture graph"
  statement: "The number of data points in one category is read from a tally chart, table, or picture graph with one mark or picture per data point."
  assess: "A tally chart shows Apple with 4 tallies, Banana with 2 tallies and Grape with 6 tallies. How many children chose grape?"
  sources: {ccss: ["1.MD.C.4"], lc: ["41a59407", "2ee06e08"]}
  strand: M1
- id: data.categorical.total
  concept: data
  facet: categorical
  level: 2
  type: application
  name: "Find the total number of data points in a chart"
  statement: "A question asks how many data points there are in all in a data set with up to three categories; the answer combines the counts of all the categories."
  assess: "A chart shows that 4 children chose apple, 2 chose banana and 6 chose grape. How many children answered in all?"
  sources: {ccss: ["1.MD.C.4"], lc: ["6cda6e52", "2ee06e08"]}
  strand: M1
- id: data.categorical.how-many-more
  concept: data
  facet: categorical
  level: 2
  type: application
  name: "Find how many more or fewer are in one category than another"
  statement: "A question asks how many more or how many fewer data points one category has than another, in a data set with up to three categories; the answer is the difference of the two category counts."
  assess: "A chart shows that 4 children chose apple, 2 chose banana and 6 chose grape. How many more children chose grape than banana?"
  sources: {ccss: ["1.MD.C.4"], lc: ["90e4775e", "2ee06e08"]}
  strand: M1
- id: data.picture-graph.draw
  concept: data
  facet: categorical
  level: 2
  type: representation
  name: "Draw a picture graph with one picture per data point"
  statement: "A data set with up to four categories is shown as a picture graph: one same-size picture for each data point, lined up in a row or column for each category from a common starting line, with each category labeled and a title."
  assess: "Make a picture graph of this pet data: Cats 3, Dogs 5, Fish 2, Birds 4."
  sources: {ccss: ["2.MD.D.10"], lc: ["6cb4db86"]}
  strand: M1
- id: data.bar-graph.draw
  concept: data
  facet: categorical
  level: 2
  type: representation
  name: "Draw a bar graph with a single-unit scale"
  statement: "A data set with up to four categories is shown as a bar graph on a scale marked in ones from 0: one labeled bar for each category, starting at 0 and ending level with the scale number equal to that category's count, with a title."
  assess: "On this grid with a scale from 0 to 10 marked by ones, draw a bar graph of this pet data: Cats 3, Dogs 5, Fish 2, Birds 4."
  sources: {ccss: ["2.MD.D.10"], lc: ["2445741d"]}
  strand: M1
- id: data.bar-graph.read
  concept: data
  facet: categorical
  level: 2
  type: representation
  name: "Read a category's count from a bar graph with a single-unit scale"
  statement: "The count for a category in a bar graph is the number on the scale level with the end of that category's bar."
  assess: "In this bar graph the scale runs from 0 to 10 by ones, and the Dogs bar is not next to the scale. Its end is level with the scale mark labeled 6. How many children chose dogs?"
  sources: {ccss: ["2.MD.D.10"], lc: []}
  strand: M1
- id: data.bar-graph.put-together
  concept: data
  facet: categorical
  level: 2
  type: application
  name: "Solve put-together problems using a bar graph"
  statement: "A one-step put-together problem asks for the combined count of categories shown in a bar graph with a single-unit scale; the learner reads the needed counts and finds the total."
  assess: "A bar graph with a scale by ones shows Red 7, Blue 5 and Green 9. How many children chose red or blue?"
  sources: {ccss: ["2.MD.D.10"], lc: ["5ac573e0"]}
  strand: M1
- id: data.bar-graph.take-apart
  concept: data
  facet: categorical
  level: 2
  type: application
  name: "Solve take-apart problems using a bar graph"
  statement: "A one-step take-apart problem gives a total and a bar graph with a single-unit scale showing one part; the learner reads the known part and finds the unknown part."
  assess: "There are 13 pets in Mia's class, all dogs or cats. A bar graph with a scale by ones shows 8 dogs, but the cats bar is missing. How many cats are there?"
  sources: {ccss: ["2.MD.D.10"], lc: ["51ebaa2d"]}
  strand: M1
- id: data.bar-graph.compare
  concept: data
  facet: categorical
  level: 2
  type: application
  name: "Solve compare problems using a bar graph"
  statement: "A one-step compare problem asks how many more or fewer are in one category than another in a bar graph with a single-unit scale; the learner reads both counts and finds the difference."
  assess: "A bar graph with a scale by ones shows Red 7, Blue 5 and Green 9. How many more children chose green than blue?"
  sources: {ccss: ["2.MD.D.10"], lc: ["d1013e8f"]}
  strand: M1
- id: data.line-plot.make
  concept: data
  facet: measurement
  level: 2
  type: representation
  name: "Make a line plot of whole-unit length measurements"
  statement: "A set of whole-number length measurements is shown on a line plot: a number line marked in whole units that spans the smallest to the largest measurement, labeled with the unit, with one X above the number for each measurement."
  procedure:
    - "Find the smallest and largest measurement."
    - "Draw a number line marked in whole units covering that span, and label it with the unit."
    - "For each measurement, draw an X above its number, stacking X's when values repeat."
  assess: "Seven pencils measured 5, 6, 6, 7, 5, 6 and 8 inches. Make a line plot of the lengths."
  sources: {ccss: ["2.MD.D.9"], lc: ["9ede2acf"]}
  strand: M1
