- id: fraction.compare.common-denominator
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Compare fractions by rewriting over a common denominator
  statement: Compare two fractions by rewriting both over a common denominator with the multiplication
    principle; the fraction with the greater rewritten numerator is greater.
  procedure:
  - Find a common multiple of the two denominators (the product of the denominators always works).
  - Rewrite each fraction over that denominator by multiplying its numerator and denominator by the same
    whole number.
  - Compare the rewritten numerators; the larger numerator gives the larger fraction, and equal numerators
    mean the fractions are equal.
  assess: Which is greater, 5/6 or 7/9? Show your work.
  sources:
    ccss:
    - 4.NF.A.2
    lc:
    - 82d042d0
    - b5c4b5f8
- id: fraction.compare.common-numerator
  concept: fraction
  facet: part-whole
  level: 3
  type: procedure
  name: Compare fractions by rewriting with a common numerator
  statement: Compare two fractions with nonzero numerators by rewriting both with a common numerator;
    the fraction with the smaller rewritten denominator is greater.
  procedure:
  - Find a common multiple of the two numerators (the product of the numerators always works).
  - Rewrite each fraction with that numerator by multiplying its numerator and denominator by the same
    whole number.
  - Compare the rewritten denominators; the smaller denominator gives the larger fraction, and equal denominators
    mean the fractions are equal.
  assess: Which is greater, 2/3 or 3/5? Compare them by making the numerators the same.
  sources:
    ccss:
    - 4.NF.A.2
    lc: []
- id: fraction.compare.benchmark
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Compare fractions using a benchmark fraction
  statement: Compare two fractions by comparing each to a benchmark such as 1/2 or 1; this decides the
    comparison only when the two fractions fall on opposite sides of the benchmark.
  procedure:
  - Choose a benchmark, 1/2 or 1.
  - Compare each fraction to the benchmark (a/b is greater than 1/2 exactly when 2 x a is greater than
    b, and greater than 1 exactly when a is greater than b).
  - If one fraction is above the benchmark and the other below, the one above is greater; otherwise this
    method does not decide, and another method is needed.
  assess: Use 1/2 to decide which is greater, 3/8 or 4/7.
  sources:
    ccss:
    - 4.NF.A.2
    lc: []
- id: fraction.compare.unlike.justify
  concept: fraction
  facet: part-whole
  level: 2
  type: justification
  name: Justify a comparison of fractions with unlike numerators and denominators
  statement: A comparison of two fractions with different numerators and different denominators is justified
    by a model of the same whole in which both fractions are shown with parts of a common size, so the
    numbers of parts can be compared.
  assess: Use a fraction model to show why 2/3 > 3/5.
  sources:
    ccss:
    - 4.NF.A.2
    lc:
    - 1995cc98
    - '67628647'
- id: fraction.non-unit.unit-sum
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: A fraction as a sum of unit fractions
  statement: For any whole number a and denominator b, a/b is the sum of a copies of 1/b, including when
    a is greater than b (for example, 5/4 = 1/4 + 1/4 + 1/4 + 1/4 + 1/4).
  assess: Write 5/4 as a sum of unit fractions and show the sum on a number line.
  sources:
    ccss:
    - 4.NF.B.3
    - 4.NF.B.4.a
    lc:
    - 28d45152
    - 1df660cf
    - 42bbf920
- id: fraction.addition.joining
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Adding fractions as joining parts of the same whole
  statement: Adding two fractions means joining their parts into one amount, where both fractions refer
    to the same whole.
  assess: Using one bar as the whole, draw what 2/5 + 1/5 means and say what the sum counts.
  sources:
    ccss:
    - 4.NF.B.3.a
    lc:
    - 2f52e80a
- id: fraction.subtraction.separating
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Subtracting fractions as separating parts of the same whole
  statement: Subtracting one fraction from another means separating the parts of the second from the parts
    of the first, where both fractions refer to the same whole.
  assess: Using one bar as the whole, draw what 4/6 - 1/6 means and say what the difference counts.
  sources:
    ccss:
    - 4.NF.B.3.a
    lc:
    - 0745e110
- id: fraction.addition.like-denominators.model
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Add fractions with like denominators using a model
  statement: Using fraction strips or a number line partitioned into lengths of 1/b, find a/b + c/b by
    joining a lengths and c lengths of 1/b and counting the total.
  procedure:
  - Show a/b as a lengths of size 1/b.
  - Place c more lengths of size 1/b end to end after them.
  - Count the total number of lengths of size 1/b and write that number over b.
  assess: Use a number line to find 3/4 + 2/4.
  sources:
    ccss:
    - 4.NF.B.3.a
    - 4.NF.B.3.d
    lc: []
- id: fraction.addition.like-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Add fractions with like denominators symbolically
  statement: For fractions with the same denominator, a/b + c/b = (a + c)/b.
  procedure:
  - Check that the denominators are the same.
  - Add the numerators.
  - Write the sum over the common denominator.
  assess: Compute 5/12 + 9/12.
  sources:
    ccss:
    - 4.NF.B.3.a
    - 4.NF.B.3.d
    lc: []
- id: fraction.subtraction.like-denominators.model
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Subtract fractions with like denominators using a model
  statement: Using fraction strips or a number line partitioned into lengths of 1/b, find a/b - c/b, with
    c no greater than a, by removing c lengths of 1/b from a lengths and counting what remains.
  procedure:
  - Show a/b as a lengths of size 1/b.
  - Remove c of those lengths.
  - Count the remaining lengths of size 1/b and write that number over b.
  assess: Use a number line to find 7/6 - 4/6.
  sources:
    ccss:
    - 4.NF.B.3.a
    - 4.NF.B.3.d
    lc: []
- id: fraction.subtraction.like-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Subtract fractions with like denominators symbolically
  statement: For fractions with the same denominator and c no greater than a, a/b - c/b = (a - c)/b.
  procedure:
  - Check that the denominators are the same.
  - Subtract the second numerator from the first.
  - Write the difference over the common denominator.
  assess: Compute 11/10 - 4/10.
  sources:
    ccss:
    - 4.NF.B.3.a
    - 4.NF.B.3.d
    lc: []
- id: fraction.decompose.model
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Decompose a fraction into a sum of same-denominator fractions with a model
  statement: Using a model of a/b as a parts of size 1/b, including when a is greater than b, split the
    a parts into groups in more than one way; each grouping is a sum of fractions with denominator b.
  procedure:
  - Show a/b on a model as a parts of size 1/b.
  - Separate the a parts into two or more groups.
  - Name each group as (number of parts in the group)/b.
  - Regroup the parts differently to get another decomposition.
  assess: Shade 7/5 on fraction strips of fifths, then group the shaded fifths to show two different ways
    to break 7/5 into a sum of fifths.
  sources:
    ccss:
    - 4.NF.B.3.b
    lc:
    - 144856f4
    - 78c91fb0
- id: fraction.decompose.equation
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: Record a fraction decomposition as an equation
  statement: A decomposition of a/b into groups of parts of size 1/b is recorded as an equation a/b =
    c/b + d/b + ..., where the numerators on the right add to a.
  assess: A model shows 7/5 split into a group of 3 fifths and a group of 4 fifths. Write the equation.
  sources:
    ccss:
    - 4.NF.B.3.b
    lc:
    - 7b4b5bc6
    - b6ee14d2
- id: fraction.decompose.justify
  concept: fraction
  facet: measure
  level: 2
  type: justification
  name: Justify a fraction decomposition with a model
  statement: An equation decomposing a/b into a sum of fractions with denominator b is justified by a
    model showing that the parts on the right, put together, are exactly the a parts of size 1/b.
  assess: Use a drawing to show why 5/6 = 2/6 + 2/6 + 1/6.
  sources:
    ccss:
    - 4.NF.B.3.b
    lc:
    - eadbe803
    - c152b85c
- id: fraction.mixed-number.meaning
  concept: fraction
  facet: measure
  level: 2
  type: concept
  name: A mixed number as a whole number plus a fraction
  statement: The mixed number n a/b, with a less than b, names the number n + a/b.
  assess: Mark 2 3/4 on a number line and write it as a whole number plus a fraction.
  sources:
    ccss:
    - 4.NF.B.3.b
    - 4.NF.B.3.c
    lc: []
- id: fraction.mixed-number.to-fraction
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Rewrite a mixed number as a fraction
  statement: The mixed number n a/b equals the fraction (n x b + a)/b, because each whole is b/b.
  procedure:
  - Rewrite the whole number n as (n x b)/b.
  - Add a/b by adding numerators.
  - Write the result (n x b + a)/b.
  assess: Write 3 2/5 as a fraction.
  sources:
    ccss:
    - 4.NF.B.3.c
    lc: []
- id: fraction.mixed-number.decompose.model
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Decompose a mixed number into a sum of same-denominator fractions with a model
  statement: Using a model of n a/b in which each whole is b parts of size 1/b, split all the parts into
    groups in more than one way; each grouping is a sum of fractions with denominator b.
  procedure:
  - Show n a/b on a model, with each of the n wholes partitioned into b parts of size 1/b, plus a more
    parts.
  - Separate all n x b + a parts into two or more groups.
  - Name each group as (number of parts in the group)/b.
  - Regroup the parts differently to get another decomposition.
  assess: Shade 1 3/4 on fraction strips of fourths, then group the shaded fourths to show two different
    ways to break 1 3/4 into a sum of fourths.
  sources:
    ccss:
    - 4.NF.B.3.b
    lc:
    - 8dc1a96f
    - a3248bfb
- id: fraction.mixed-number.decompose.equation
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: Record a mixed-number decomposition as an equation
  statement: A decomposition of n a/b into groups of parts of size 1/b is recorded as an equation n a/b
    = c/b + d/b + ..., where the numerators on the right add to n x b + a.
  assess: A model shows 1 3/4 as fourths grouped into 4 fourths, 2 fourths, and 1 fourth. Write the equation.
  sources:
    ccss:
    - 4.NF.B.3.b
    lc:
    - 1e84f1d7
    - d533aa7d
- id: fraction.mixed-number.decompose.justify
  concept: fraction
  facet: measure
  level: 2
  type: justification
  name: Justify a mixed-number decomposition with a model
  statement: An equation decomposing n a/b into a sum of fractions with denominator b is justified by
    a model showing that the parts on the right, put together, make exactly n wholes and a more parts
    of size 1/b.
  assess: Use a drawing to show why 2 1/3 = 4/3 + 3/3.
  sources:
    ccss:
    - 4.NF.B.3.b
    lc:
    - 5be2e8e4
    - 288a6904
- id: fraction.mixed-number.add
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Add mixed numbers with like denominators
  statement: Add two mixed numbers with the same denominator by adding the whole-number parts and the
    fractional parts separately, regrouping b/b as 1 when the fractional parts sum to 1 or more.
  procedure:
  - Add the whole-number parts.
  - Add the fractional parts by adding numerators over the common denominator b.
  - If the fractional sum is b/b or more, rewrite it as 1 plus the remaining fraction and add the 1 to
    the whole-number sum.
  - Write the whole-number sum and the remaining fraction as a mixed number.
  assess: Compute 2 3/4 + 1 3/4.
  sources:
    ccss:
    - 4.NF.B.3.c
    lc:
    - 35f78f08
    - 32a33b2c
- id: fraction.mixed-number.subtract
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Subtract mixed numbers with like denominators
  statement: Subtract a smaller mixed number from a larger one with the same denominator by subtracting
    the fractional parts and the whole-number parts separately, first renaming one whole as b/b if the
    first fractional part is smaller than the second.
  procedure:
  - If the fractional part of the first number is smaller than that of the second, rename p a/b as (p
    - 1) (a + b)/b.
  - Subtract the fractional numerators over the common denominator b.
  - Subtract the whole-number parts.
  - Write the whole-number difference and the fractional difference as a mixed number.
  assess: Compute 5 1/6 - 2 5/6.
  sources:
    ccss:
    - 4.NF.B.3.c
    lc:
    - 80e84a1d
    - d688c51d
- id: fraction.application.add-like-denominators
  concept: fraction
  facet: measure
  level: 2
  type: application
  name: Solve word problems adding fractions with like denominators
  statement: A story problem joins two fractional amounts of the same whole with the same denominator;
    the learner represents it with a model or equation and finds the total.
  assess: Jo ran 3/8 of a mile in the morning and 4/8 of a mile in the afternoon. How far did she run
    in all?
  sources:
    ccss:
    - 4.NF.B.3.d
    lc:
    - 123700d1
    - 832d4e61
- id: fraction.application.subtract-like-denominators
  concept: fraction
  facet: measure
  level: 2
  type: application
  name: Solve word problems subtracting fractions with like denominators
  statement: A story problem separates or compares two fractional amounts of the same whole with the same
    denominator; the learner represents it with a model or equation and finds the difference.
  assess: A ribbon is 9/10 of a meter long. Ana cuts off 4/10 of a meter. How long is the ribbon now?
  sources:
    ccss:
    - 4.NF.B.3.d
    lc:
    - 80c88178
    - 63e76820
- id: fraction.multiple-of-unit
  concept: fraction
  facet: measure
  level: 2
  type: concept
  name: A fraction as a whole-number multiple of a unit fraction
  statement: For any whole number a and denominator b, a/b = a x (1/b).
  assess: Write 5/4 as a product of a whole number and a unit fraction.
  sources:
    ccss:
    - 4.NF.B.4.a
    lc: []
- id: fraction.multiply-whole.unit-fraction
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Multiply a unit fraction by a whole number with a model
  statement: Find n x (1/b) by laying n lengths of 1/b end to end and counting them, giving n/b.
  procedure:
  - Show one length of size 1/b.
  - Lay n copies of that length end to end from 0.
  - Count the copies and write the product as n/b.
  assess: Use a number line to find 6 x (1/5).
  sources:
    ccss:
    - 4.NF.B.4
    lc:
    - a9ce7b44
- id: fraction.multiply-whole.as-unit-multiple
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: A multiple of a/b as a multiple of 1/b
  statement: n x (a/b) is n groups of a copies of 1/b, so it can be rewritten as (n x a) x (1/b).
  assess: Use a fraction model to rewrite 3 x (2/5) as a whole number times 1/5.
  sources:
    ccss:
    - 4.NF.B.4.b
    lc:
    - 14047f66
- id: fraction.multiply-whole.model
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Multiply a fraction by a whole number using unit fractions
  statement: Find n x (a/b) with a model by rewriting it as (n x a) x (1/b) and counting the copies of
    1/b, giving (n x a)/b.
  procedure:
  - Show a/b as a copies of 1/b, and draw n such groups.
  - Count all the copies of 1/b in the n groups.
  - Write the product as that count over b.
  assess: Use a fraction model to find 4 x (2/3).
  sources:
    ccss:
    - 4.NF.B.4.b
    lc:
    - 4671de27
- id: fraction.multiply-whole.rule
  concept: fraction
  facet: measure
  level: 3
  type: concept
  name: The rule n x (a/b) = (n x a)/b
  statement: For any whole number n and fraction a/b, n x (a/b) = (n x a)/b.
  assess: 'True or false: 4 x (3/5) = 12/20. True or false: 4 x (3/5) = 12/5. Say which rule decides it.'
  sources:
    ccss:
    - 4.NF.B.4.b
    lc: []
- id: fraction.multiply-whole.symbolic
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Multiply a fraction by a whole number symbolically
  statement: Compute n x (a/b) by multiplying the whole number by the numerator and keeping the denominator.
  procedure:
  - Multiply the whole number n by the numerator a.
  - Write the product over the denominator b.
  assess: Compute 7 x (3/8).
  sources:
    ccss:
    - 4.NF.B.4
    - 4.NF.B.4.b
    lc:
    - b676d1b5
    - 801b8bb6
    - 3caedc60
- id: fraction.application.multiply-whole
  concept: fraction
  facet: measure
  level: 2
  type: application
  name: Solve word problems multiplying a fraction by a whole number
  statement: A story problem gives a number of equal groups, each a fractional amount; the learner finds
    the total as whole number x fraction.
  assess: Each of 5 people at a party will eat 3/8 of a pound of roast beef. How many pounds of roast
    beef are needed?
  sources:
    ccss:
    - 4.NF.B.4.c
    lc:
    - 317f9cf3
    - b5446421
- id: fraction.application.multiply-whole.equation
  concept: fraction
  facet: measure
  level: 3
  type: representation
  name: Write an equation for a fraction-times-whole-number word problem
  statement: A story problem about n equal groups of a/b is represented by the equation n x (a/b) = t,
    where t is the unknown total.
  assess: 'Write an equation (do not solve) for: each of 4 bags holds 2/3 of a pound of rice; how many
    pounds of rice are there in all?'
  sources:
    ccss:
    - 4.NF.B.4.c
    lc:
    - 4d77123a
- id: fraction.application.multiply-whole.model
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: Draw a model for a fraction-times-whole-number word problem
  statement: A story problem about n equal groups of a/b is represented by a visual fraction model showing
    n groups, each of a parts of size 1/b.
  assess: 'Draw a fraction model (do not solve) for: each of 3 runners runs 3/4 of a mile; how far do
    they run in all?'
  sources:
    ccss:
    - 4.NF.B.4.c
    lc:
    - 4092257b
- id: fraction.tenths-to-hundredths
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Rewrite tenths as hundredths
  statement: A fraction with denominator 10 is rewritten with denominator 100 by multiplying numerator
    and denominator by 10, so a/10 = (10 x a)/100.
  procedure:
  - Multiply the numerator by 10.
  - Multiply the denominator 10 by 10 to get 100.
  - Write the result over 100.
  assess: Write 7/10 as a fraction with denominator 100.
  sources:
    ccss:
    - 4.NF.C.5
    lc:
    - 09f9dbf8
- id: fraction.addition.tenths-hundredths
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Add a fraction in tenths to a fraction in hundredths
  statement: Add a/10 + c/100 by rewriting a/10 as (10 x a)/100 and adding numerators, giving (10 x a
    + c)/100.
  procedure:
  - Rewrite the tenths fraction a/10 as (10 x a)/100.
  - Add the numerators of the two hundredths fractions.
  - Write the sum over 100.
  assess: Compute 3/10 + 4/100.
  sources:
    ccss:
    - 4.NF.C.5
    lc:
    - 91c2912b
- id: decimal.tenths.notation
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: representation
  name: Decimal notation for tenths
  statement: A fraction with denominator 10 is written in decimal notation with its number of tenths shown
    as whole ones before the point and the remaining tenths in the first place after the point (3/10 =
    0.3, 14/10 = 1.4).
  assess: Write 7/10 and 14/10 in decimal notation.
  sources:
    ccss:
    - 4.NF.C.6
    lc:
    - 86f60c17
- id: decimal.hundredths.notation
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: representation
  name: Decimal notation for hundredths
  statement: A fraction with denominator 100 is written in decimal notation with whole ones before the
    point and the remaining hundredths in two places after the point, using a 0 in the tenths place when
    there are fewer than 10 hundredths (62/100 = 0.62, 5/100 = 0.05).
  assess: Write 62/100 and 5/100 in decimal notation.
  sources:
    ccss:
    - 4.NF.C.6
    lc:
    - 269378e0
- id: decimal.number-line
  concept: decimal
  facet: measure
  level: 2
  type: representation
  name: Locate tenths and hundredths decimals on the number line
  statement: A decimal to tenths or hundredths is the point reached by partitioning each unit interval
    into 10 or 100 equal lengths and counting that many tenths or hundredths from 0.
  procedure:
  - Partition the interval from 0 to 1 into 10 equal lengths (tenths), and each tenth into 10 equal lengths
    (hundredths) if needed.
  - Count the decimal's number of tenths or hundredths from 0.
  - Label the endpoint with the decimal.
  assess: Locate 0.62 on a number line marked 0, 0.1, 0.2, ..., 1.
  sources:
    ccss:
    - 4.NF.C.6
    lc:
    - dc34402c
- id: decimal.compare
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: procedure
  name: Compare two decimals to hundredths
  statement: Compare two decimals to hundredths by rewriting each as a whole number of hundredths; the
    decimal with more hundredths is greater.
  procedure:
  - Write each decimal with two digits after the point, appending a 0 if it has only tenths.
  - Rewrite each as a total number of hundredths (1.20 is 120 hundredths, 0.95 is 95 hundredths).
  - Compare the two whole numbers; the larger count gives the larger decimal, and equal counts mean the
    decimals are equal.
  assess: Which is greater, 0.5 or 0.45?
  sources:
    ccss:
    - 4.NF.C.7
    lc:
    - f44fbaad
- id: decimal.compare.justify
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: justification
  name: Justify a decimal comparison with a model
  statement: A comparison of two decimals to hundredths is justified by a model of the same whole, such
    as a hundredths grid or number line, showing which decimal covers more of the whole.
  assess: Use a hundredths grid to show why 0.5 > 0.45.
  sources:
    ccss:
    - 4.NF.C.7
    lc:
    - 9bccf790
