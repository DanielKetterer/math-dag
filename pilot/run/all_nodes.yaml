  strand: S2
- id: fraction.mixed-number.subtract
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Subtract mixed numbers with like denominators
  statement: Subtract a smaller mixed number from a larger one with the same denominator by subtracting
    the fractional parts and the whole-number parts separately, first renaming one whole as b/b if the
    first fractional part is smaller than the second.
  procedure:
  - If the fractional part of the first number is smaller than that of the second, rename p a/b as (p
    - 1) (a + b)/b.
  - Subtract the fractional numerators over the common denominator b.
  - Subtract the whole-number parts.
  - Write the whole-number difference and the fractional difference as a mixed number.
  assess: Compute 5 1/6 - 2 5/6.
  sources:
    ccss:
    - 4.NF.B.3.c
    lc:
    - 80e84a1d
    - d688c51d
  strand: S2
