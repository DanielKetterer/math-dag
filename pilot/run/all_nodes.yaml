  strand: S4
- id: ratio.equivalent
  concept: ratio
  facet: composed-unit
  level: 2
  type: concept
  name: Equivalent ratios
  statement: Two ratios a:b and c:d are equivalent when there is one positive number n with c = n x a
    and d = n x b; they describe the same relationship between the quantities.
  assess: Are 4:6 and 10:15 equivalent ratios? If so, find the number n.
