  strand: S2
- id: fraction.addition.like-denominators.model
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Add fractions with like denominators using a model
  statement: Using fraction strips or a number line partitioned into lengths of 1/b, find a/b + c/b by
    joining a lengths and c lengths of 1/b and counting the total.
  procedure:
  - Show a/b as a lengths of size 1/b.
  - Place c more lengths of size 1/b end to end after them.
  - Count the total number of lengths of size 1/b and write that number over b.
  assess: Use a number line to find 3/4 + 2/4.
  sources:
    ccss:
    - 4.NF.B.3.a
    - 4.NF.B.3.d
    lc: []
  strand: S2
- id: fraction.addition.like-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Add fractions with like denominators symbolically
  statement: For fractions with the same denominator, a/b + c/b = (a + c)/b.
  procedure:
  - Check that the denominators are the same.
  - Add the numerators.
  - Write the sum over the common denominator.
  assess: Compute 5/12 + 9/12.
  sources:
    ccss:
    - 4.NF.B.3.a
    - 4.NF.B.3.d
    lc: []
  strand: S2
- id: fraction.subtraction.like-denominators.model
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Subtract fractions with like denominators using a model
  statement: Using fraction strips or a number line partitioned into lengths of 1/b, find a/b - c/b, with
    c no greater than a, by removing c lengths of 1/b from a lengths and counting what remains.
  procedure:
  - Show a/b as a lengths of size 1/b.
  - Remove c of those lengths.
  - Count the remaining lengths of size 1/b and write that number over b.
  assess: Use a number line to find 7/6 - 4/6.
  sources:
    ccss:
    - 4.NF.B.3.a
    - 4.NF.B.3.d
    lc: []
  strand: S2
- id: fraction.subtraction.like-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Subtract fractions with like denominators symbolically
  statement: For fractions with the same denominator and c no greater than a, a/b - c/b = (a - c)/b.
  procedure:
  - Check that the denominators are the same.
  - Subtract the second numerator from the first.
  - Write the difference over the common denominator.
  assess: Compute 11/10 - 4/10.
  sources:
