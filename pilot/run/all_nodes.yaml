  strand: S4
- id: ratio.unit-rate
  concept: ratio
  facet: unit-rate
  level: 3
  type: concept
  name: The unit rate a/b of a ratio a:b
  statement: 'For a ratio a:b with b not 0, the unit rate is a/b: the amount of the first quantity for
    1 unit of the second.'
  assess: The ratio of miles to hours for a trip is 150:4. What is the unit rate, and what does it mean?
  sources:
    ccss:
    - 6.RP.A.2
    lc:
    - db4c25ad
  strand: S4
- id: ratio.unit-rate.language
  concept: ratio
  facet: unit-rate
  level: 2
  type: representation
  name: Describe a ratio with rate language
  statement: A ratio relationship a:b is described with rate language as 'a/b units of the first quantity
    per (or for each) 1 unit of the second'.
  assess: A recipe uses 3 cups of flour for 4 cups of sugar. Write one sentence using 'per' about flour
    and sugar, and another about sugar and flour.
  sources:
    ccss:
    - 6.RP.A.2
    lc:
    - 523d04e7
  strand: S4
- id: ratio.unit-rate.find
  concept: ratio
  facet: unit-rate
  level: 3
  type: procedure
  name: Find a unit rate from a ratio of whole numbers
  statement: Find the unit rate of a ratio a:b, b not 0, by dividing a by b and naming the result in units
    of the first quantity per unit of the second.
  procedure:
  - Identify the two quantities and which is 'per' which.
  - Divide the first quantity's value a by the second's value b.
  - Label the result as units of the first quantity per 1 unit of the second.
  assess: A 12-pack of juice costs $9. Find the cost per can.
  sources:
    ccss:
    - 6.RP.A.2
    lc:
    - b9b94f31
  strand: S4
- id: ratio.tape-diagram
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: Represent a ratio with a tape diagram
  statement: A ratio a:b is drawn as two tapes made of a and b equal-size units; when a total or one quantity
    is known, dividing it by its number of units gives the unit size.
  procedure:
  - Draw a tape of a equal units for the first quantity and a tape of b equal units for the second.
  - Mark the known amount on the units it covers (one tape, or both tapes for a total).
  - Divide the known amount by the number of units it covers to get the unit size.
  - Multiply the unit size by the number of units of the quantity asked for.
  assess: The ratio of red to blue marbles is 3:5 and there are 40 marbles. Use a tape diagram to find
    how many are red.
  sources:
    ccss:
    - 6.RP.A.3
    lc: []
  strand: S4
- id: ratio.double-number-line
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: Represent a ratio with a double number line
  statement: A ratio relationship is drawn as two parallel number lines, one per quantity, with aligned
    tick marks at pairs of values in equivalent ratios, starting from 0 aligned with 0.
  assess: A car travels 150 miles on 5 gallons. Use a double number line to find how far it travels on
    2 gallons.
