- id: ratio.composed-unit
  concept: ratio
  facet: composed-unit
  level: 2
  type: concept
  name: A ratio as 'for every a, there are b'
  statement: A ratio relationship of a to b between two quantities means that for every a units of the
    first quantity there are b units of the second.
  assess: The ratio of wings to beaks in the zoo bird house is 2:1. Describe what this means using 'for
    every'.
  sources:
    ccss:
    - 6.RP.A.1
    lc:
    - '70393172'
  strand: S4
- id: ratio.notation
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: Write a ratio as a:b or a to b
  statement: A ratio of a units of the first quantity to b units of the second is written a:b or 'a to
    b', with the quantities in the stated order.
  assess: A class has 12 girls and 15 boys. Write the ratio of boys to girls.
  sources:
    ccss:
    - 6.RP.A.1
    lc:
