  strand: S0
- id: fraction.equivalent.simple.generate
  concept: fraction
  facet: part-whole
  level: 2
  type: procedure
  name: Recognize and generate simple equivalent fractions with a model
  statement: 'Using a fraction model with denominators 2, 3, 4, 6, or 8, find a fraction that covers the
    same amount as a given one by splitting or joining its parts.

    '
  procedure:
  - Show the given fraction on a model.
  - Split each part into equal smaller parts, or join equal groups of parts.
  - Count the new number of shaded parts and total parts and write the new fraction.
  assess: Use a fraction strip to find a fraction equal to 2/3 with denominator 6.
  sources:
    ccss:
    - 3.NF.A.3.b
    lc:
    - 3194d5b0
    - 463e4334
  strand: S0
- id: fraction.equivalent.simple.explain
  concept: fraction
  facet: part-whole
  level: 2
  type: justification
  name: Explain why simple equivalent fractions are equal
  statement: 'For a specific pair such as 1/2 and 2/4, a model shows the two fractions cover the same
    amount of the same whole, so they are equal.

    '
  assess: Explain, with a drawing, why 1/2 = 2/4.
  sources:
    ccss:
    - 3.NF.A.3.b
    lc:
    - d20a384e
    - f577262f
  strand: S0
- id: fraction.compare.same-denominator
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Compare fractions with the same denominator
  statement: 'When two fractions have the same denominator, the parts are the same size, so the fraction
    with more parts is greater.

    '
  assess: Which is greater, 3/8 or 5/8? Explain.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - '56514983'
    - bd5ee9b3
  strand: S0
- id: fraction.compare.same-numerator
  concept: fraction
  facet: part-whole
  level: 2
  type: procedure
  name: Compare fractions with the same numerator
  statement: 'When two fractions have the same numerator, there are the same number of parts, so the fraction
    whose parts are larger (smaller denominator) is greater.

    '
  assess: Which is greater, 2/3 or 2/5? Explain.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - ea2ae87f
    - 1f979ba2
  strand: S0
- id: fraction.compare.reasoning-size
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Compare fractions by reasoning about their size
  statement: Decide which of two fractions is greater by reasoning about the size of the parts and how
    many there are.
  assess: Which is greater, 3/4 or 3/6? Which is greater, 2/6 or 5/6?
  sources:
    ccss:
    - 3.NF.A.3
    lc:
    - 2bfc7496
  strand: S0
- id: fraction.compare.same-whole
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Fraction comparisons need the same whole
  statement: 'Comparing two fractions by size is only valid when both refer to the same whole; 1/2 of
    a small pizza can be less than 1/3 of a large one.

    '
  assess: Sam says 1/2 is always bigger than 1/3. When could 1/3 of something be bigger than 1/2 of something?
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - ee846e61
  strand: S0
- id: fraction.compare.record-symbols
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: Record fraction comparisons with >, =, <
  statement: The result of comparing two fractions is written with the symbols >, =, or <.
  assess: Write >, =, or < between 4/6 and 2/6.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - 2013ca22
  strand: S0
- id: fraction.compare.justify
  concept: fraction
  facet: part-whole
  level: 2
  type: justification
  name: Justify a fraction comparison
  statement: 'A comparison of fractions with the same numerator or the same denominator is justified by
    a model or an argument about part size and number of parts.

    '
  assess: Use a drawing to show why 2/3 > 2/5.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - b77a918b
  strand: S0
- id: fraction.application.compare-in-context
  concept: fraction
  facet: part-whole
  level: 2
  type: application
  name: Compare fractions in a story about shares
  statement: 'A story problem gives two fractional shares of same-size wholes; the learner decides which
    share is larger and explains why.

    '
  assess: Ana ate 2/6 of a pizza and Ben ate 2/8 of a pizza the same size. Who ate more? Explain.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc: []
  strand: S0
- id: fraction.equivalent.multiply-principle
  concept: fraction
  facet: measure
  level: 3
  type: concept
  name: The multiplication principle for equivalent fractions
  statement: For any fraction a/b and any whole number n greater than 0, a/b = (n x a)/(n x b).
  assess: 'True or false: 3/5 = 12/20. True or false: 3/5 = 5/7. Say which rule decides it.'
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - 5f61cb2a
    - c3b684c1
  strand: S0
- id: fraction.equivalent.multiply-principle.generate
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Generate equivalent fractions with a/b = (n x a)/(n x b)
  statement: Produce a fraction equivalent to a/b by multiplying its numerator and denominator by the
    same whole number n greater than 0.
  procedure:
  - Choose a whole number n greater than 0.
  - Multiply the numerator by n and the denominator by n.
  - Write the result as the equivalent fraction.
  assess: Write two fractions equivalent to 3/5.
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - c3b684c1
    - 13498e57
  strand: S0
- id: fraction.equivalent.multiply-principle.recognize
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Recognize equivalent fractions with a/b = (n x a)/(n x b)
  statement: Decide whether two fractions are equivalent by rewriting both over a common denominator with
    the multiplication principle and comparing numerators.
  procedure:
  - Find a common multiple of the two denominators.
  - Rewrite each fraction over that denominator by multiplying its numerator and denominator by the same
    whole number.
  - The fractions are equivalent exactly when the rewritten numerators are equal.
  assess: Is 4/6 equivalent to 6/9? Is 6/8 equivalent to 3/5?
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - 5f61cb2a
    - df5f3fb2
  strand: S0
- id: fraction.equivalent.multiply-principle.explain
  concept: fraction
  facet: part-whole
  level: 4
  type: justification
  name: Explain why a/b = (n x a)/(n x b)
  statement: 'Splitting each of the b parts into n equal parts multiplies the number of parts by n and
    the number of chosen parts by n, while the amount covered does not change; so (n x a)/(n x b) is the
    same amount as a/b, for every n.

    '
  assess: Use a visual fraction model to explain why 2/3 = (4 x 2)/(4 x 3), and say why the same argument
    works for any n.
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - 74de8dae
  strand: S0
- id: partitioning.equal-shares.area
  concept: partitioning
  facet: area
  level: 1
  type: procedure
  name: Partition a circle or rectangle into equal shares
  statement: Divide a circle or rectangle into n shares of the same size that together make up the whole
    with nothing left over (in grades 1-2, n is 2, 3, or 4).
  procedure:
  - Decide how many shares, n, are needed.
  - For a rectangle, draw n - 1 straight lines across it, spaced so every strip has the same width.
  - For a circle, draw n straight cuts from the center to the edge, spaced evenly around the center.
  - Check that the shares are the same size and that together they make the whole.
  assess: Draw lines to split this rectangle into 3 equal shares.
  sources:
    ccss:
    - 1.G.A.3
    - 2.G.A.3
    lc:
    - 48273ab9
    - a2011257
    - 8e30f23e
    - 4219c4aa
    - 88c9fab3
  strand: S1
- id: partitioning.equal-shares.name
  concept: partitioning
  facet: area
  level: 1
  type: representation
  name: Name equal shares as halves, thirds, and fourths
  statement: One of 2 equal shares of a whole is called a half of it, one of 3 equal shares a third of
    it, and one of 4 equal shares a fourth (or quarter) of it; the names apply only when the shares are
    equal.
  assess: This circle is cut into 4 equal shares and one share is shaded. What word names the shaded share?
  sources:
    ccss:
    - 1.G.A.3
    - 2.G.A.3
    lc:
    - 48273ab9
    - a2011257
    - 8e30f23e
    - 4219c4aa
    - 88c9fab3
  strand: S1
- id: partitioning.equal-shares.whole-as-shares
  concept: partitioning
  facet: area
  level: 1
  type: concept
  name: The whole as all of its equal shares
  statement: 'A whole partitioned into n equal shares is made of exactly n of those shares: two halves,
    three thirds, or four fourths make one whole.'
  assess: A sandwich is cut into fourths. How many fourths make the whole sandwich?
  sources:
    ccss:
    - 1.G.A.3
    - 2.G.A.3
    lc:
    - 213a7a8d
    - d40094e3
    - 75be40c8
  strand: S1
- id: partitioning.equal-shares.more-shares-smaller
  concept: partitioning
  facet: area
  level: 1
  type: concept
  name: More equal shares of the same whole are smaller
  statement: For the same whole, partitioning into more equal shares makes each share smaller; a fourth
    of a shape is smaller than a half of the same shape.
  assess: Two crackers are the same size. One is cut into halves and the other into fourths. Which is
    bigger, a half or a fourth?
  sources:
    ccss:
    - 1.G.A.3
    lc:
    - b3badaf7
  strand: S1
- id: partitioning.equal-shares.different-shapes
  concept: partitioning
  facet: area
  level: 1
  type: concept
  name: Equal shares need not have the same shape
  statement: Shares of identical wholes are equal when they cover the same amount, even if they have different
    shapes.
  assess: Two identical squares are each cut in half, one along a diagonal into triangles and one straight
    down the middle into rectangles. Is a triangle half the same amount as a rectangle half?
  sources:
    ccss:
    - 2.G.A.3
    lc:
    - 0b131675
  strand: S1
- id: partitioning.equal-area.any-shape
  concept: partitioning
  facet: area
  level: 2
  type: procedure
  name: Partition a shape into parts with equal area
  statement: Partition a shape into n parts that have the same area, checking equality by area (for example
    by counting unit squares) rather than by shape. The steps below work for any rectangle and any n;
    other shapes are split into pieces whose areas are then checked to be equal.
  procedure:
  - For a rectangle, partition one side into n equal lengths.
  - Through each mark, draw a line parallel to the adjacent side, making n strips.
  - Confirm the strips have equal area (same length and width, or the same number of unit squares).
  assess: This 6-by-2 rectangle is drawn on a grid. Partition it into 6 parts with equal area and show
    how you know the areas are equal.
  sources:
    ccss:
    - 3.G.A.2
    lc:
    - 1e26fb99
  strand: S1
- id: measurement.length.no-gaps-overlaps
  concept: measurement
  facet: length
  level: 1
  type: concept
  name: Length as the number of units that span an object
  statement: The length of an object in a given unit is the number of same-size copies of that unit that
    span it end to end with no gaps and no overlaps.
  assess: Mia laid paper clips along a pencil with spaces between them and counted 5. Is the pencil 5
    paper clips long? Why or why not?
  sources:
    ccss:
    - 1.MD.A.2
    lc:
    - 67bf1af6
  strand: S1
- id: measurement.length.iterate-units
  concept: measurement
  facet: length
  level: 1
  type: procedure
  name: Measure length by laying units end to end
  statement: Measure an object's length by laying same-size copies of a shorter unit end to end along
    it and counting them. At this level objects are chosen to be a whole number of units long; if the
    last copy overhangs the end, the length lies between two whole numbers of units.
  procedure:
  - Line up one end of the first copy of the unit with one end of the object.
  - Place each next copy so it starts exactly where the previous one ends, in a straight line along the
    object, with no gap and no overlap.
  - Stop when a copy reaches the other end of the object.
  - Count the copies; that whole number is the length in that unit.
  assess: Use copies of this paper clip to find how long the marker is, in paper clips.
  sources:
    ccss:
    - 1.MD.A.2
    lc:
    - c325c592
  strand: S1
- id: number-line.whole-number-lengths
  concept: number-line
  facet: core
  level: 2
  type: representation
  name: Whole numbers as lengths from 0 on a number line
  statement: On a number line diagram with equally spaced points labeled 0, 1, 2, ..., the whole number
    n is represented by the length from 0 to the point labeled n, which is n unit lengths.
  assess: On this number line, draw the length that shows 7.
  sources:
    ccss:
    - 2.MD.B.6
    lc:
    - 0119f987
  strand: S1
- id: addition.add-to.number-line
  concept: addition
  facet: add-to
  level: 2
  type: representation
  name: Represent a whole-number sum on a number line
  statement: The sum a + b is shown on a number line by placing a length of b units end to end after the
    length from 0 to a; the endpoint is a + b.
  procedure:
  - Mark the length from 0 to a.
  - From a, mark a further length of b units to the right, in one jump or in smaller jumps that total
    b.
  - Read the label at the endpoint; it is a + b.
  assess: Show 38 + 25 on a number line and find the sum.
  sources:
    ccss:
    - 2.MD.B.6
    lc:
    - 5ca2749c
    - 59146f3f
  strand: S1
- id: subtraction.take-away.number-line
  concept: subtraction
  facet: take-away
  level: 2
  type: representation
  name: Represent a whole-number difference by jumping back on a number line
  statement: For whole numbers with b no greater than a, the difference a - b is shown by starting at
    a and moving b units to the left; the point reached is a - b.
  procedure:
  - Locate a on the number line.
  - From a, mark a length of b units to the left, in one jump or in smaller jumps that total b.
  - Read the label at the endpoint; it is a - b.
  assess: Show 62 - 17 on a number line by jumping back from 62, and find the difference.
  sources:
    ccss:
    - 2.MD.B.6
    lc:
    - 6075778b
    - 59146f3f
  strand: S1
- id: subtraction.comparison.number-line
  concept: subtraction
  facet: comparison
  level: 2
  type: representation
  name: Represent a whole-number difference as a distance on a number line
  statement: For whole numbers with b no greater than a, the difference a - b is the length of the segment
    from b to a on the number line.
  procedure:
  - Locate b and a on the number line.
  - Measure the length from b up to a, in one jump or in smaller jumps (for example to the next ten, then
    by tens).
  - The total length of the jumps is a - b.
  assess: Use a number line to find how far it is from 48 to 73, and write the subtraction it shows.
  sources:
    ccss:
    - 2.MD.B.6
    lc:
    - 6075778b
    - 59146f3f
  strand: S1
- id: multiplication.equal-groups.meaning
  concept: multiplication
  facet: equal-groups
  level: 2
  type: concept
  name: A product as a number of equal groups
  statement: For whole numbers a and b, a x b is the total number of objects in a groups with b objects
