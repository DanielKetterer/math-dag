  type: justification
  name: Explain n divided by 1/b = n x b with multiplication
  statement: n divided by 1/b is the number that multiplied by 1/b gives n; since (n x b) x (1/b) = (n
    x b)/b = n, the quotient is n x b for every n and b.
  assess: Use multiplication to explain why 4 divided by 1/5 = 20, and say why the same argument works
