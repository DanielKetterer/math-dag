  concept: decimal
  facet: decimal-fraction
  level: 3
  type: procedure
  name: Compare two decimals to hundredths
  statement: Compare two decimals to hundredths by rewriting each as a whole number of hundredths; the
    decimal with more hundredths is greater.
  procedure:
  - Write each decimal with two digits after the point, appending a 0 if it has only tenths.
  - Rewrite each as a total number of hundredths (1.20 is 120 hundredths, 0.95 is 95 hundredths).
  - Compare the two whole numbers; the larger count gives the larger decimal, and equal counts mean the
    decimals are equal.
  assess: Which is greater, 0.5 or 0.45?
  sources:
    ccss:
    - 4.NF.C.7
    lc:
    - f44fbaad
  strand: S2
- id: decimal.compare.justify
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: justification
  name: Justify a decimal comparison with a model
  statement: A comparison of two decimals to hundredths is justified by a model of the same whole, such
    as a hundredths grid or number line, showing which decimal covers more of the whole.
  assess: Use a hundredths grid to show why 0.5 > 0.45.
  sources:
    ccss:
    - 4.NF.C.7
    lc:
    - 9bccf790
  strand: S2
- id: fraction.addition.unlike-denominators.equivalent-replacement
  concept: fraction
  facet: measure
  level: 3
  type: concept
  name: Replacing fractions by equivalents leaves a sum or difference unchanged
  statement: Replacing each fraction in a sum or difference by an equivalent fraction does not change
    the value of the sum or difference, so a/b + c/d can be rewritten as a sum of two fractions with a
    common denominator.
  assess: 'True or false: 2/3 + 5/4 = 8/12 + 15/12. True or false: 2/3 + 5/4 = 2/12 + 5/12. Say which
    rule decides it.'
  sources:
    ccss:
    - 5.NF.A.1
    lc:
    - d022d8d2
    - 089c550e
  strand: S3
- id: fraction.addition.unlike-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Add fractions with unlike denominators
  statement: Add a/b + c/d by rewriting both fractions over a common multiple n of b and d (b x d always
    works), then adding the numerators over n.
  procedure:
  - Find a common multiple n of the denominators b and d (b x d is always one).
  - Rewrite a/b as (a x (n/b))/n and c/d as (c x (n/d))/n.
  - Add the two numerators and write the sum over n.
  assess: Compute 5/6 + 3/8.
  sources:
    ccss:
    - 5.NF.A.1
    lc:
    - d022d8d2
  strand: S3
- id: fraction.subtraction.unlike-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Subtract fractions with unlike denominators
  statement: For a/b at least c/d, find a/b - c/d by rewriting both fractions over a common multiple n
    of b and d (b x d always works), then subtracting the numerators over n.
  procedure:
  - Find a common multiple n of the denominators b and d (b x d is always one).
  - Rewrite a/b as (a x (n/b))/n and c/d as (c x (n/d))/n.
  - Subtract the second numerator from the first and write the difference over n.
  assess: Compute 7/9 - 1/6.
  sources:
    ccss:
    - 5.NF.A.1
    lc:
    - 089c550e
  strand: S3
- id: fraction.mixed-number.addition.unlike-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Add mixed numbers with unlike denominators
  statement: Add two mixed numbers whose fraction parts have unlike denominators by adding whole parts
    and fraction parts separately over a common denominator, regrouping when the fraction parts sum to
    1 or more.
  procedure:
  - Rewrite the two fraction parts over a common multiple of their denominators.
  - Add the fraction parts, and add the whole-number parts.
  - If the fraction sum is 1 or more, write it as 1 plus a fraction less than 1 and add the 1 to the whole-number
    sum.
  assess: Compute 2 3/4 + 1 5/6.
  sources:
    ccss:
    - 5.NF.A.1
    lc:
    - d2565c2d
  strand: S3
- id: fraction.mixed-number.subtraction.unlike-denominators
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Subtract mixed numbers with unlike denominators
  statement: Subtract a smaller mixed number from a larger one when the fraction parts have unlike denominators
    by rewriting the fraction parts over a common denominator, regrouping 1 from the whole part when the
    first fraction part is smaller, then subtracting parts separately.
  procedure:
  - Rewrite the two fraction parts over a common multiple n of their denominators.
  - If the first fraction part is less than the second, take 1 from the first whole part and add n/n to
    its fraction part.
  - Subtract the fraction parts, and subtract the whole-number parts.
  assess: Compute 4 1/6 - 1 3/4.
  sources:
    ccss:
    - 5.NF.A.1
    lc:
    - 3f8f80e7
  strand: S3
- id: fraction.application.addition-same-whole
  concept: fraction
  facet: part-whole
  level: 3
  type: application
  name: Solve word problems adding fractions of the same whole
  statement: A story combines two fractional amounts of the same whole, possibly with unlike denominators;
    the learner represents it with an equation or model and finds the total.
  assess: Maria walked 2/3 mile to the park and then 3/4 mile to the store. How far did she walk in all?
  sources:
    ccss:
    - 5.NF.A.2
    lc:
    - 4b749054
  strand: S3
- id: fraction.application.subtraction-same-whole
  concept: fraction
  facet: part-whole
  level: 3
  type: application
  name: Solve word problems subtracting fractions of the same whole
  statement: A story takes away or compares two fractional amounts of the same whole, possibly with unlike
    denominators; the learner represents it with an equation or model and finds the difference.
  assess: A jug held 7/8 liter of juice. Leo poured out 1/3 liter. How much juice is left?
  sources:
    ccss:
    - 5.NF.A.2
    lc:
    - ed662f1f
  strand: S3
- id: fraction.estimate.benchmark.sum
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Estimate a fraction sum with benchmarks and judge reasonableness
  statement: Estimate a sum of fractions by replacing each addend with a nearby benchmark (0, 1/2, 1,
    or a whole number), and use the estimate to judge whether a computed sum is reasonable.
  procedure:
  - 'Replace each addend with its nearest benchmark: 0, 1/2, 1, or a whole number.'
  - Add the benchmarks to get an estimate of the sum.
  - Call a computed sum unreasonable if it is far from the estimate or is smaller than one of the addends.
  assess: Without computing exactly, decide whether 2/5 + 1/2 = 3/7 can be correct, and explain using
    benchmark fractions.
  sources:
    ccss:
    - 5.NF.A.2
    lc:
    - 1f6b0f81
  strand: S3
- id: fraction.estimate.benchmark.difference
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Estimate a fraction difference with benchmarks and judge reasonableness
  statement: Estimate a difference of fractions by replacing each fraction with a nearby benchmark (0,
    1/2, 1, or a whole number), and use the estimate to judge whether a computed difference is reasonable.
  procedure:
  - 'Replace each fraction with its nearest benchmark: 0, 1/2, 1, or a whole number.'
  - Subtract the benchmarks to get an estimate of the difference.
  - Call a computed difference unreasonable if it is far from the estimate or is larger than the first
    fraction.
  assess: Jo says 11/12 - 3/8 = 8/4. Use benchmark fractions to decide whether this is reasonable.
  sources:
    ccss:
    - 5.NF.A.2
    lc:
    - 109ac5cd
  strand: S3
- id: fraction.between-whole-numbers
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Find the two whole numbers a fraction lies between
  statement: For a fraction a/b, divide a by b with remainder to get quotient q and remainder r; if r
    = 0 then a/b equals the whole number q, otherwise a/b lies strictly between q and q + 1.
  procedure:
  - Divide a by b to get a whole-number quotient q and remainder r.
  - If r = 0, a/b equals the whole number q.
  - Otherwise, a/b lies between the whole numbers q and q + 1.
  assess: Between which two whole numbers does 47/6 lie?
  sources:
    ccss:
    - 5.NF.B.3
    lc:
    - 677ac9ea
  strand: S3
- id: fraction.quotient.equal-sharing
  concept: fraction
  facet: quotient
  level: 2
  type: concept
  name: A fraction as the share when a wholes are shared among b
  statement: When a equal wholes are shared equally among b people, each person's share is a/b of one
    whole.
  assess: 3 pizzas are shared equally among 4 people. Use a drawing to show how much pizza each person
    gets.
  sources:
    ccss:
    - 5.NF.B.3
    lc:
    - 35bc1efc
  strand: S3
- id: fraction.quotient.symbolic
  concept: fraction
  facet: quotient
  level: 3
  type: concept
  name: a divided by b equals a/b
  statement: For whole numbers a and b with b greater than 0, a divided by b equals the fraction a/b.
  assess: Write 7 divided by 3 as a fraction. Write 5/8 as a division of two whole numbers.
  sources:
    ccss:
    - 5.NF.B.3
    lc:
    - 35bc1efc
  strand: S3
- id: fraction.application.whole-number-division-fraction-answer
  concept: fraction
  facet: quotient
  level: 3
  type: application
  name: Solve division word problems with fraction or mixed-number answers
  statement: A story divides a whole number of units equally into a whole number of shares where the answer
    is not a whole number; the learner writes the quotient as a fraction or mixed number.
  assess: 9 people share a 50-pound sack of rice equally by weight. How many pounds does each person get,
    and between what two whole numbers does the answer lie?
  sources:
    ccss:
    - 5.NF.B.3
    lc:
    - 46b4aaee
    - '26645597'
  strand: S3
- id: fraction.multiplication.parts-of-partition.whole-number
  concept: fraction
  facet: operator
  level: 2
  type: concept
  name: (a/b) x q as a parts of q split into b equal parts, q whole
  statement: For a whole number q, (a/b) x q is the amount formed by a parts when q is partitioned into
    b equal parts.
  assess: Use a drawing to show (2/3) x 4 as parts of 4 split into 3 equal parts. What is the product?
  sources:
    ccss:
    - 5.NF.B.4.a
    lc:
    - 027af5d2
  strand: S3
- id: fraction.multiplication.parts-of-partition.fraction
  concept: fraction
  facet: operator
  level: 2
  type: concept
  name: (a/b) x (c/d) as a parts of c/d split into b equal parts
  statement: For a fraction c/d, (a/b) x (c/d) is the amount formed by a parts when c/d is partitioned
    into b equal parts.
  assess: Use a fraction model to show (2/3) x (4/5) as parts of 4/5 split into 3 equal parts. What is
    the product?
  sources:
    ccss:
    - 5.NF.B.4.a
    lc:
    - 027af5d2
  strand: S3
- id: fraction.multiplication.operation-sequence
  concept: fraction
  facet: operator
  level: 3
  type: concept
  name: (a/b) x q equals a x q divided by b
  statement: For any whole number or fraction q, (a/b) x q equals the result of multiplying q by a and
    then dividing by b.
  assess: Write (2/3) x 4 as a multiplication followed by a division, and find the result.
  sources:
    ccss:
    - 5.NF.B.4.a
    lc:
    - 61ddb83d
  strand: S3
- id: fraction.multiplication.product-rule
  concept: fraction
  facet: operator
  level: 3
  type: concept
  name: The product rule (a/b) x (c/d) = (a x c)/(b x d)
  statement: For any fractions a/b and c/d, (a/b) x (c/d) = (a x c)/(b x d), where a whole number q is
    written as q/1.
  assess: 'True or false: (2/3) x (4/5) = 8/15. True or false: (2/3) x (4/5) = 6/8. Say which rule decides
    it.'
  sources:
    ccss:
    - 5.NF.B.4
    - 5.NF.B.4.a
    lc:
    - 4aeee2dd
  strand: S3
- id: fraction.multiplication.symbolic
  concept: fraction
  facet: operator
  level: 3
  type: procedure
  name: Multiply a fraction or whole number by a fraction
  statement: Multiply a fraction or whole number by a fraction by multiplying numerators and multiplying
    denominators, after writing any whole number q as q/1.
  procedure:
  - Write any whole-number factor q as q/1.
  - Multiply the numerators to get the numerator of the product.
  - Multiply the denominators to get the denominator of the product.
  assess: Compute (3/4) x (5/6) and (2/9) x 6.
  sources:
    ccss:
    - 5.NF.B.4
    lc:
    - 4aeee2dd
  strand: S3
- id: fraction.mixed-number.multiplication
  concept: fraction
  facet: operator
  level: 3
  type: procedure
  name: Multiply mixed numbers
  statement: Multiply mixed numbers by rewriting each as a fraction, multiplying with the product rule,
    and rewriting the result as a mixed number if wanted.
  procedure:
  - Rewrite each mixed number w a/b as the fraction (w x b + a)/b.
  - 'Multiply the fractions: multiply numerators and multiply denominators.'
  - If the product is 1 or more, divide numerator by denominator to write it as a mixed number.
  assess: Compute 2 1/2 x 1 1/3.
  sources:
    ccss:
    - 5.NF.B.6
    lc: []
  strand: S3
- id: multiplication.array-area.fraction-sides.tiling
  concept: multiplication
  facet: array-area
  level: 2
  type: procedure
  name: Find the area of a fraction-sided rectangle by tiling with unit-fraction squares
  statement: Find the area of a rectangle with fractional side lengths by rewriting both sides over a
    common denominator n, tiling the rectangle with squares of side 1/n, and counting squares, each of
    area 1/(n x n).
  procedure:
  - Rewrite both side lengths over a common denominator n, as p/n and q/n.
  - 'Tile the rectangle with squares of side 1/n: p along one side and q along the other.'
  - Note that n x n such squares fill a unit square, so each has area 1/(n x n).
  - Count the p x q squares; the area is (p x q)/(n x n) square units.
  assess: A rectangle is 3/4 m by 1/2 m. Tile it with squares of side 1/4 m and find its area.
  sources:
    ccss:
    - 5.NF.B.4.b
    lc:
    - 3d4b5315
  strand: S3
- id: multiplication.array-area.fraction-sides.multiply
  concept: multiplication
  facet: array-area
  level: 3
  type: procedure
  name: Find the area of a fraction-sided rectangle by multiplying side lengths
  statement: The area of a rectangle with side lengths a/b and c/d is found by computing (a/b) x (c/d)
    with the product rule.
  procedure:
  - Multiply the two side lengths with the product rule (a x c)/(b x d).
  - Label the result in square units.
  assess: Find the area of a rectangle that is 3/5 m by 2/3 m.
  sources:
    ccss:
    - 5.NF.B.4.b
    lc:
    - fe7e289c
  strand: S3
- id: multiplication.array-area.fraction-product.represent
  concept: multiplication
  facet: array-area
  level: 2
  type: representation
  name: Represent a fraction product as a rectangular area
  statement: The product (a/b) x (c/d) is shown as the area of an a/b-by-c/d rectangle drawn inside a
    unit square whose sides are partitioned into b and d equal parts.
  procedure:
  - Draw a unit square.
  - Partition one side into b equal parts and the other side into d equal parts, making b x d small rectangles.
  - Shade the rectangle that is a parts by c parts; it holds a x c small rectangles, so its area is (a
    x c)/(b x d).
  assess: Draw an area model for (2/3) x (3/4) and use it to name the product.
  sources:
    ccss:
    - 5.NF.B.4.b
    lc:
    - 9e161f6b
  strand: S3
- id: multiplication.array-area.fraction-sides.explain
  concept: multiplication
  facet: array-area
  level: 4
  type: justification
  name: Explain why tiling and multiplying give the same area
  statement: With both sides written as p/n and q/n, tiling gives p x q squares of area 1/(n x n), an
    area of (p x q)/(n x n), which is exactly (p/n) x (q/n) by the product rule; so for any fractional
    side lengths the two methods agree.
  assess: Explain why tiling a 2/3-by-4/5 rectangle with small squares gives the same area as computing
    (2/3) x (4/5), and why the same argument works for any fractional side lengths.
  sources:
    ccss:
    - 5.NF.B.4.b
    lc:
    - 7e715af1
  strand: S3
- id: multiplication.scaling.resize
  concept: multiplication
  facet: scaling
  level: 2
  type: concept
  name: Multiplication as resizing
  statement: 'Multiplying a quantity by a factor resizes the quantity: the product is the quantity stretched
    or shrunk by that factor.'
  assess: A picture 6 inches wide is resized by a factor of 3/2. Is the new picture wider or narrower,
    and how wide is it?
  sources:
    ccss:
    - 5.NF.B.5
    lc:
    - 18ed149f
  strand: S3
- id: multiplication.scaling.size-principle
  concept: multiplication
  facet: scaling
  level: 3
  type: concept
  name: The scaling size principle
  statement: For a positive number q and a positive factor f, q x f is greater than q when f > 1, equal
    to q when f = 1, and less than q when f < 1.
  assess: 'True or false: (3/5) x 48 is greater than 48. True or false: (7/4) x 48 is greater than 48.
    Say which rule decides it.'
  sources:
    ccss:
    - 5.NF.B.5.a
    lc:
    - 029248f4
  strand: S3
- id: multiplication.scaling.compare-without-computing
  concept: multiplication
  facet: scaling
  level: 3
  type: procedure
  name: Compare a product with a factor without multiplying
  statement: Decide whether a product of positive numbers is greater than, equal to, or less than one
    factor by comparing the other factor with 1, without performing the multiplication.
  procedure:
  - Pick the factor q to compare the product with; call the other factor f.
  - Compare f with 1.
  - 'Conclude: the product is greater than q if f > 1, equal to q if f = 1, and less than q if f < 1.'
  assess: 'Without multiplying, put these in order from least to greatest: 225, (9/10) x 225, (11/8) x
    225.'
  sources:
    ccss:
    - 5.NF.B.5.a
    lc:
    - 029248f4
  strand: S3
- id: multiplication.scaling.explain-greater-than-one
  concept: multiplication
  facet: scaling
  level: 4
  type: justification
  name: Explain why multiplying by a fraction greater than 1 makes a number larger
  statement: For a positive number q and a fraction f > 1, write f = 1 + g with g > 0; then q x f = q
    + q x g, which is q plus a positive amount, so q x f > q. Multiplying by a whole number greater than
    1 is the familiar case.
  assess: Explain why (5/4) x 12 is greater than 12, and why the same reasoning works for any fraction
    greater than 1.
  sources:
    ccss:
    - 5.NF.B.5.b
    lc:
    - a60d004f
  strand: S3
- id: multiplication.scaling.explain-less-than-one
  concept: multiplication
  facet: scaling
  level: 4
  type: justification
  name: Explain why multiplying by a fraction less than 1 makes a number smaller
  statement: For a positive number q and a fraction a/b with 0 < a < b, (a/b) x q is a of the b equal
    parts of q, fewer than all b parts, so (a/b) x q < q.
  assess: Explain why (3/4) x 12 is less than 12, and why the same reasoning works for any positive fraction
    less than 1.
  sources:
    ccss:
    - 5.NF.B.5.b
    lc:
    - 5b65ffae
  strand: S3
- id: fraction.equivalent.multiply-principle.multiply-by-one
  concept: fraction
  facet: operator
  level: 4
  type: justification
  name: Relate a/b = (n x a)/(n x b) to multiplying by 1
  statement: Since (n x a)/(n x b) = (n/n) x (a/b) and n/n = 1, the equivalence principle a/b = (n x a)/(n
    x b) says that multiplying a/b by 1 does not change it.
  assess: Explain how the equation 2/3 = (5 x 2)/(5 x 3) is an example of multiplying 2/3 by 1.
  sources:
    ccss:
    - 5.NF.B.5.b
    lc:
    - 2b2dc2e5
  strand: S3
- id: fraction.application.multiplication-in-context.model
  concept: fraction
  facet: operator
  level: 2
  type: application
  name: Solve real-world fraction multiplication problems with a visual model
  statement: A real-world problem asks for a fraction of a fractional or mixed-number quantity; the learner
    represents it with a visual fraction model and reads the answer from the model.
  assess: A garden is 3/4 of an acre. 2/3 of the garden is planted with corn. Draw a model to find how
    many acres are planted with corn.
  sources:
    ccss:
    - 5.NF.B.6
    lc:
    - 46d4232e
  strand: S3
- id: fraction.application.multiplication-in-context.equation
  concept: fraction
  facet: operator
  level: 3
  type: application
  name: Solve real-world fraction multiplication problems with an equation
  statement: A real-world problem asks for a fraction or mixed-number multiple of a quantity; the learner
    writes a multiplication equation and solves it symbolically.
  assess: A recipe uses 2 1/4 cups of flour. How much flour is needed for 1 1/2 batches? Write an equation
    and solve it.
  sources:
    ccss:
    - 5.NF.B.6
    lc:
    - 354638aa
    - ea894526
  strand: S3
- id: division.unit-fraction-by-whole.interpret
  concept: division
  facet: partitive
  level: 2
  type: concept
  name: (1/b) divided by n as sharing 1/b into n equal parts
  statement: (1/b) divided by n is the size of each part when 1/b is partitioned into n equal parts; splitting
    each of the whole's b parts into n makes b x n equal parts, so each share is 1/(b x n) of the whole.
  assess: Draw a fraction model to show 1/3 divided by 4, and tell a story the division could describe.
  sources:
    ccss:
    - 5.NF.B.7.a
    lc:
    - ab93d733
  strand: S3
- id: division.unit-fraction-by-whole.rule
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: (1/b) divided by n = 1/(b x n)
  statement: For whole numbers b and n greater than 0, (1/b) divided by n = 1/(b x n).
  assess: 'True or false: 1/5 divided by 2 = 1/10. True or false: 1/5 divided by 2 = 2/5. Say which rule
    decides it.'
  sources:
    ccss:
    - 5.NF.B.7.a
    lc:
    - 137f8ccd
  strand: S3
- id: division.unit-fraction-by-whole.compute
  concept: division
  facet: unknown-factor
  level: 3
  type: procedure
  name: Divide a unit fraction by a whole number
  statement: Compute (1/b) divided by a whole number n greater than 0 by multiplying the denominator b
    by n.
  procedure:
  - Multiply the denominator b by the divisor n.
  - Write the quotient as 1/(b x n).
  assess: Compute 1/4 divided by 3.
  sources:
    ccss:
    - 5.NF.B.7
    - 5.NF.B.7.a
    lc:
    - 137f8ccd
    - bfa79064
  strand: S3
- id: division.unit-fraction-by-whole.explain
  concept: division
  facet: unknown-factor
  level: 4
  type: justification
  name: Explain (1/b) divided by n = 1/(b x n) with multiplication
  statement: (1/b) divided by n is the number that multiplied by n gives 1/b; since (1/(b x n)) x n =
    n/(b x n) = 1/b, the quotient is 1/(b x n) for every b and n.
  assess: Use multiplication to explain why 1/3 divided by 4 = 1/12, and say why the same argument works
    for any unit fraction and nonzero whole number.
  sources:
    ccss:
    - 5.NF.B.7.a
    lc: []
  strand: S3
- id: division.whole-by-unit-fraction.interpret
  concept: division
  facet: measurement
  level: 2
  type: concept
  name: n divided by 1/b as how many 1/b parts fit in n
  statement: n divided by 1/b is the number of parts of size 1/b that fit into n; each whole holds b of
    them, so n wholes hold n x b.
  assess: Draw a fraction model to show 4 divided by 1/5, and tell a story the division could describe.
  sources:
    ccss:
    - 5.NF.B.7.b
    lc:
    - 4a1b41fd
  strand: S3
- id: division.whole-by-unit-fraction.rule
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: n divided by 1/b = n x b
  statement: For whole numbers n and b with b greater than 0, n divided by 1/b = n x b.
  assess: 'True or false: 3 divided by 1/4 = 12. True or false: 3 divided by 1/4 = 3/4. Say which rule
    decides it.'
  sources:
    ccss:
    - 5.NF.B.7.b
