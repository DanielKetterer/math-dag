- id: ratio.table.make
  concept: ratio
  facet: composed-unit
  level: 2
  type: procedure
  name: Make a table of equivalent ratios
  statement: From a ratio a:b, given directly or read from a description, build a table whose rows are
    pairs of whole-number values in equivalent ratios.
  procedure:
  - Write the ratio a:b as the first row, one column per quantity.
  - 'For n = 2, 3, 4, ..., add the row (n x a) : (n x b).'
  assess: A paint mix uses 2 cans of blue for every 3 cans of yellow. Make a table with four rows of equivalent
    ratios.
  sources:
    ccss:
    - 6.RP.A.3.a
    lc:
    - 1da2eafe
    - 6808344c
    - '96529518'
  strand: S4
- id: ratio.table.missing-value
  concept: ratio
  facet: composed-unit
  level: 2
  type: procedure
  name: Find a missing value in a ratio table
  statement: Find a missing entry in a ratio table by multiplying both entries of a complete row by the
    same number, chosen to produce the known entry of the incomplete row.
  procedure:
  - Pick a complete row (p, q) of the table.
  - In the incomplete row, take the known entry and divide it by the entry of the complete row in the
    same column; call the result n (n may be a fraction).
  - Multiply the other entry of the complete row by n to get the missing value.
  assess: 'A ratio table has the row 4 : 6. Find the missing value in the row ? : 9.'
  sources:
    ccss:
    - 6.RP.A.3.a
    lc:
    - 23e8528c
  strand: S4
- id: ratio.table.plot
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: Plot the pairs of a ratio table on the coordinate plane
  statement: Each row (x, y) of a ratio table is plotted as the point (x, y), with the first quantity
    on the horizontal axis and the second on the vertical axis.
  procedure:
  - Label the horizontal axis with the first quantity and the vertical axis with the second.
  - For each row (x, y), plot the point x units right and y units up from the origin.
  assess: 'Plot the pairs from this table of cups of rice to cups of water: 1:2, 2:4, 3:6, 4:8.'
  sources:
    ccss:
    - 6.RP.A.3.a
    lc:
    - 8074c052
    - 31d1aa9e
  strand: S4
- id: ratio.table.compare
  concept: ratio
  facet: composed-unit
  level: 2
  type: procedure
  name: Compare two ratios with tables
  statement: Compare ratios a:b and c:d by extending both tables to rows with the same value of the first
    quantity and comparing the values of the second quantity there.
  procedure:
  - Make a table of equivalent ratios for each ratio.
  - Extend both tables until they share a value of the first quantity (a common multiple of a and c always
    works).
  - In those rows, the ratio with the larger second value has more of the second quantity per unit of
    the first.
  assess: Mix A uses 3 cups of juice to 5 cups of water; Mix B uses 4 cups of juice to 7 cups of water.
    Use tables to decide which mix has more water for the same amount of juice.
  sources:
    ccss:
    - 6.RP.A.3.a
    lc:
    - 05492c78
  strand: S4
- id: ratio.application.unit-rate
  concept: ratio
  facet: unit-rate
  level: 3
  type: application
  name: Solve unit rate problems (unit pricing, constant speed)
  statement: A problem gives a rate as a pair of amounts (cost and items, distance and time, work and
    time); the learner finds the unit rate and uses it to find another amount at the same rate.
  assess: It took 7 hours to mow 4 lawns. At that rate, how many lawns could be mowed in 35 hours, and
    at what rate were lawns mowed?
  sources:
