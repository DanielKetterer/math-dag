  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Subtracting fractions as separating parts of the same whole
  statement: Subtracting one fraction from another means separating the parts of the second from the parts
    of the first, where both fractions refer to the same whole.
  assess: Using one bar as the whole, draw what 4/6 - 1/6 means and say what the difference counts.
  sources:
    ccss:
    - 4.NF.B.3.a
    lc:
