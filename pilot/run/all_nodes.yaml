  strand: S4
- id: percent.rate-per-100
  concept: percent
  facet: rate-per-100
  level: 2
  type: concept
  name: Percent as a rate per 100
  statement: p percent of a quantity means p parts for every 100 equal parts of that quantity.
  assess: On a 10 by 10 grid, shade 35% of the grid. What does 35% mean in terms of the 100 squares?
  sources:
    ccss:
    - 6.RP.A.3.c
    lc: []
  strand: S4
- id: percent.of-quantity
  concept: percent
  facet: rate-per-100
  level: 3
  type: procedure
  name: Find a percent of a quantity
  statement: p percent of a quantity Q is (p/100) x Q.
  procedure:
  - Write p percent as the rate p/100.
  - Multiply p/100 by Q.
  assess: Find 35% of 60.
  sources:
    ccss:
    - 6.RP.A.3.c
    lc:
    - c75962da
  strand: S4
- id: percent.application.find-whole
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: Find the whole given a part and the percent
  statement: A problem gives a part and the percent of the whole that it is; the learner finds the whole
    W from (p/100) x W = part.
  assess: 18 students walk to school. That is 30% of the class. How many students are in the class?
  sources:
    ccss:
    - 6.RP.A.3.c
    lc:
    - e6525dd8
  strand: S4
- id: ratio.conversion-factor
  concept: ratio
  facet: unit-rate
  level: 3
  type: concept
  name: A conversion factor is a ratio of equal measurements
  statement: 'A conversion factor is a ratio of two equal measurements in different units, such as 12
    in : 1 ft, so multiplying a measurement by (12 in)/(1 ft) changes its unit without changing its size.'
  assess: To change 5 ft to inches, should you multiply by (12 in)/(1 ft) or by (1 ft)/(12 in)? Why does
    the length stay the same?
  sources:
    ccss:
    - 6.RP.A.3.d
    lc:
    - 534e2e4c
  strand: S4
- id: ratio.convert-units
  concept: ratio
  facet: unit-rate
  level: 3
  type: procedure
  name: Convert measurement units with conversion factors
  statement: Convert a measurement by multiplying it by one or more conversion factors, each written with
    the unit to remove in the denominator, and cancelling units like common factors.
  procedure:
  - Write the measurement with its unit.
  - Multiply by a conversion factor whose denominator has the current unit and whose numerator has the
    next unit.
  - Cancel the matching units and multiply the numbers.
  - Repeat until the result is in the target unit.
  assess: How many inches are in 2.5 yards? (1 yd = 3 ft, 1 ft = 12 in)
  sources:
    ccss:
    - 6.RP.A.3.d
    lc:
    - 18baa937
  strand: S4
- id: ratio.unit-rate.fractions
  concept: ratio
  facet: unit-rate
  level: 3
  type: procedure
  name: Compute a unit rate from a ratio of fractions
  statement: For a rate of a/b units of one quantity per c/d units of another, with c not 0, the unit
    rate is the complex fraction (a/b)/(c/d), computed by fraction division.
  procedure:
  - Write the rate as (a/b)/(c/d), the first quantity over the second.
  - Compute (a/b) divided by (c/d) by fraction division.
  - Label the result as units of the first quantity per 1 unit of the second.
  assess: A painter covers 2/3 of a wall in 3/4 of an hour. Find the unit rate in walls per hour.
  sources:
    ccss:
    - 7.RP.A.1
    lc:
    - 84257a01
    - 5b1f724c
    - 863028c4
  strand: S4
- id: proportional-relationship.definition
  concept: proportional-relationship
  facet: core
  level: 3
  type: concept
  name: What a proportional relationship is
  statement: Two quantities x and y are in a proportional relationship when the quotient y/x has the same
    value for every pair of corresponding values with x not 0, and y = 0 when x = 0.
  assess: A gym charges $20 to join plus $10 per visit. Is the total cost proportional to the number of
    visits? Explain using the definition.
  sources:
    ccss:
    - 7.RP.A.2
    - 7.RP.A.2.a
    lc:
    - b02c3de8
    - 539cab15
  strand: S4
- id: proportional-relationship.test.table
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: Decide from a table whether a relationship is proportional
  statement: A table shows a proportional relationship exactly when y/x is the same for every row with
    x not 0 and every row with x = 0 has y = 0.
  procedure:
  - For each row with x not 0, compute y/x.
  - Check that every row with x = 0 has y = 0.
  - The relationship is proportional exactly when all the quotients are equal and the check in step 2
    holds.
  assess: 'Is this relationship proportional? x: 2, 4, 6; y: 3, 6, 10.'
  sources:
    ccss:
    - 7.RP.A.2.a
    lc:
    - dad3591d
  strand: S4
- id: proportional-relationship.test.graph
  concept: proportional-relationship
  facet: core
  level: 2
  type: procedure
  name: Decide from a graph whether a relationship is proportional
  statement: A graph shows a proportional relationship exactly when its points lie on a single straight
    line that passes through the origin.
  procedure:
  - Check whether all plotted points lie on one straight line.
  - Check whether that line passes through (0, 0).
  - The relationship is proportional exactly when both checks hold.
  assess: Graph A is a line through (0, 1) and (2, 5). Graph B is a line through (0, 0) and (3, 4). Which
    shows a proportional relationship?
  sources:
    ccss:
    - 7.RP.A.2.a
    lc:
    - e979a208
  strand: S4
- id: proportional-relationship.constant
  concept: proportional-relationship
  facet: core
  level: 3
  type: concept
  name: The constant of proportionality
  statement: In a proportional relationship between x and y, the common value k of y/x is the constant
    of proportionality; it is the unit rate, the amount of y for 1 unit of x.
  assess: For a proportional relationship, 5 pounds of apples cost $7.50. What is the constant of proportionality
    for cost per pound, and what does it mean?
  sources:
    ccss:
    - 7.RP.A.2.b
    lc: []
  strand: S4
- id: proportional-relationship.constant.from-values
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: Find the constant of proportionality from a table or description
  statement: Given a proportional relationship as a table or a verbal description of corresponding values,
    k is the y-value divided by the x-value for any pair with x not 0.
  procedure:
  - Decide which quantity is y and which is x (y per x).
  - Take any pair of corresponding values with x not 0.
  - Compute k = y/x.
  assess: 8 movie tickets cost $30, and cost is proportional to the number of tickets. Find the constant
    of proportionality for cost per ticket.
  sources:
    ccss:
    - 7.RP.A.2.b
    lc:
    - a205a83d
    - 8c8b40c3
  strand: S4
- id: proportional-relationship.constant.graph
  concept: proportional-relationship
  facet: core
  level: 2
  type: procedure
  name: Find the constant of proportionality from a graph
  statement: For the graph of a proportional relationship, k is y/x for any point (x, y) on the line other
    than the origin.
  procedure:
  - Choose a point (x, y) on the line, other than (0, 0), whose coordinates can be read exactly.
  - Compute k = y/x.
  assess: A proportional graph is a line through (0, 0) and (2, 5). Find the constant of proportionality.
  sources:
    ccss:
    - 7.RP.A.2.b
    lc:
    - 5ec9f641
  strand: S4
- id: proportional-relationship.constant.equation
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: Find the constant of proportionality from an equation
  statement: When a proportional relationship's equation is written as y = kx, the constant of proportionality
    is the coefficient k of x.
  procedure:
  - If needed, rewrite the equation in the form y = kx.
  - Read k as the coefficient of x.
  assess: Find the constant of proportionality in y = x/3 and in 2y = 7x.
  sources:
    ccss:
    - 7.RP.A.2.b
    lc:
    - 3c7dcfad
  strand: S4
- id: proportional-relationship.constant.diagram
  concept: proportional-relationship
  facet: core
  level: 2
  type: procedure
  name: Find the constant of proportionality from a diagram
  statement: On a tape diagram or double number line of a proportional relationship, k is the y-amount
    aligned with 1 unit of x.
  procedure:
  - 'Find a marked pair: y-amount aligned with x-amount.'
  - Partition the x-amount into that many units of 1, and the y-amount into the same number of equal parts.
  - The y-amount of one part is k.
  assess: A double number line shows $15 aligned with 6 pounds. What is the cost per pound?
  sources:
    ccss:
    - 7.RP.A.2.b
    lc:
    - e927647f
  strand: S4
- id: proportional-relationship.equation.write
  concept: proportional-relationship
  facet: core
  level: 3
  type: representation
  name: Represent a proportional relationship with y = kx
  statement: A proportional relationship with constant of proportionality k is represented by the equation
    y = kx, with the variables naming the two quantities.
  procedure:
  - Name the variables for the two quantities, y for the one expressed per unit of the other.
  - Find the constant of proportionality k.
  - Write y = kx.
  assess: Total cost t is proportional to the number n of notebooks bought at $2.25 each. Write an equation
    for t in terms of n.
  sources:
    ccss:
    - 7.RP.A.2
    - 7.RP.A.2.c
    lc:
    - 0070d7c9
    - 91a4d15a
  strand: S4
- id: proportional-relationship.graph.point-meaning
  concept: proportional-relationship
  facet: core
  level: 2
  type: justification
  name: Explain what a point (x, y) on a proportional graph means
  statement: A point (x, y) on the graph of a proportional relationship means that x units of the first
    quantity correspond to y units of the second in the situation.
  assess: A graph of a cyclist's distance d (miles) against time t (hours) is a line through (0, 0) and
    (3, 36). Explain what the point (3, 36) means.
  sources:
    ccss:
    - 7.RP.A.2.d
    lc:
    - 7829e94a
  strand: S4
- id: proportional-relationship.graph.origin-meaning
  concept: proportional-relationship
  facet: core
  level: 2
  type: justification
  name: Explain what (0, 0) on a proportional graph means
  statement: The point (0, 0) on the graph of a proportional relationship means that zero units of the
    first quantity correspond to zero units of the second.
  assess: The graph of cost against pounds of grapes is a line through (0, 0) and (4, 10). Explain what
    (0, 0) means in this situation.
  sources:
    ccss:
    - 7.RP.A.2.d
    lc:
    - 9ff22c5d
  strand: S4
- id: proportional-relationship.graph.unit-rate-point
  concept: proportional-relationship
  facet: core
  level: 2
  type: justification
  name: Explain what (1, r) on a proportional graph means
  statement: The point (1, r) on the graph of a proportional relationship means that 1 unit of the first
    quantity corresponds to r units of the second, so r is the unit rate.
  assess: A graph of pages read against hours passes through (1, 12). Explain what this point means and
    how it relates to the unit rate.
  sources:
    ccss:
    - 7.RP.A.2.d
    lc:
    - db5f1010
  strand: S4
- id: ratio.application.multistep
  concept: ratio
  facet: composed-unit
  level: 3
  type: application
  name: Solve multi-step ratio problems
  statement: A problem needs two or more steps of ratio reasoning, such as finding parts from a part-to-part
    ratio and a total, then comparing or combining them.
  assess: The ratio of boys to girls in a class of 32 is 3:5. How many more girls than boys are there?
  sources:
    ccss:
    - 7.RP.A.3
    lc:
    - da9fc2c7
  strand: S4
- id: percent.application.multistep
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: Solve multi-step percent problems
  statement: A problem applies two or more percents in sequence, each to the result of the previous step,
    so the combined effect is not the sum of the percents.
  assess: A $100 item is discounted 20%, then the sale price is discounted another 10%. What is the final
    price, and what single percent discount is that?
  sources:
    ccss:
    - 7.RP.A.3
    lc:
    - fda5f0e0
  strand: S4
- id: percent.application.increase-amount
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: Find a total after adding a percent of a base (markup, tax, tip)
  statement: A problem adds one or more percents of a base amount to it, such as a markup, sales tax,
    or tip; the learner finds each percent of the base and the resulting total.
  assess: A meal costs $40. Sales tax is 6% and the tip is 18%, both of the $40. What is the total?
  sources:
    ccss:
    - 7.RP.A.3
    lc:
    - 3b368729
    - 3334f873
    - 6cd0042b
    - 82a776bd
  strand: S4
- id: percent.application.decrease-amount
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: Find a sale price after a percent discount
  statement: A problem takes a percent of an original price off as a discount; the learner finds the discount
    and the resulting sale price.
  assess: Shoes that cost $80 are 25% off. What are the discount and the sale price?
  sources:
    ccss:
    - 7.RP.A.3
    lc:
    - f5370e05
  strand: S4
- id: percent.application.percent-change
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: Find a percent increase or decrease
  statement: A problem gives an original and a new amount; the learner finds the percent change as (new
    - original)/original x 100, always relative to the original amount.
  assess: A price drops from $50 to $40. What is the percent decrease?
  sources:
    ccss:
    - 7.RP.A.3
    lc:
    - 892d2a63
    - 93360b70
  strand: S4
- id: proportional-relationship.graph.make
  concept: proportional-relationship
  facet: core
  level: 3
  type: representation
  name: Graph a proportional relationship
  statement: The graph of a proportional relationship y = kx is the line through the origin and the point
    (1, k).
  procedure:
  - Plot (0, 0).
  - Plot (x, k x x) for one convenient x not 0.
  - Draw the line through the two points (only the part where both quantities make sense, if the situation
    restricts them).
  assess: Graph y = 2.5x for x from 0 to 4.
  sources:
    ccss:
    - 8.EE.B.5
    lc:
    - 0edaa02c
  strand: S4
- id: slope.unit-rate
  concept: slope
  facet: core
  level: 3
  type: concept
  name: The slope of a proportional graph is the unit rate
  statement: The slope of the graph of a proportional relationship y = kx equals its unit rate k.
  assess: The graph of cost against pounds is a line through (0, 0) and (4, 10). Find its slope and say
    what it means as a rate.
  sources:
    ccss:
    - 8.EE.B.5
    lc:
    - c7ca6f31
  strand: S4
- id: proportional-relationship.compare.representations
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: Compare two proportional relationships given in different forms
  statement: Compare two proportional relationships given in different forms (table, graph, equation,
    description) by finding the unit rate of each and comparing the unit rates.
  procedure:
  - Find the unit rate of the first relationship from its form.
  - Find the unit rate of the second relationship from its form, in the same units.
  - The relationship with the greater unit rate has more of y per unit of x.
  assess: Car A's distance is d = 55t. Car B's distance-time graph is a line through (0, 0) and (4, 230).
    Which car is faster?
  sources:
    ccss:
    - 8.EE.B.5
    lc:
    - fbbff3cd
  strand: S4
- id: slope.between-two-points
  concept: slope
  facet: core
  level: 3
  type: concept
  name: Slope between two points
  statement: The slope between two points (x1, y1) and (x2, y2) with x1 not equal to x2 is (y2 - y1)/(x2
    - x1), the vertical change divided by the horizontal change.
  assess: Find the slope between (2, 5) and (6, -3).
  sources:
    ccss:
    - 8.EE.B.6
    lc: []
  strand: S4
- id: slope.constant-on-line
  concept: slope
  facet: core
  level: 3
  type: concept
  name: Slope is the same between any two points of a line
  statement: For a non-vertical line, the slope between any two distinct points on it has the same value,
    called the slope m of the line.
  assess: A(0, 1), B(2, 4), and C(6, 10) lie on one line. What must be true of the slopes AB, BC, and
    AC? Check by computing.
  sources:
    ccss:
    - 8.EE.B.6
    lc: []
  strand: S4
- id: slope.constant-on-line.explain
  concept: slope
  facet: core
  level: 4
  type: justification
  name: Explain with similar triangles why slope is constant on a line
  statement: For two pairs of distinct points on a non-vertical line, the right triangles formed by each
    pair's horizontal and vertical changes are similar, so the ratios of vertical to horizontal change
    are equal.
  assess: Use similar triangles to explain why the slope between any two distinct points on a non-vertical
    line is the same.
  sources:
    ccss:
    - 8.EE.B.6
    lc:
    - 650c0c11
  strand: S4
- id: linear-function.line.y-mx.write
  concept: linear-function
  facet: line
  level: 3
  type: representation
  name: Write y = mx for a line through the origin
  statement: A non-vertical line through the origin with slope m has the equation y = mx.
  procedure:
  - Read a point (x, y) on the line other than the origin.
  - Compute m = y/x.
  - Write y = mx.
  assess: A line passes through the origin and (4, 6). Write its equation.
  sources:
    ccss:
    - 8.EE.B.6
    lc:
    - c931c413
  strand: S4
- id: linear-function.line.y-mx.derive
  concept: linear-function
  facet: line
  level: 4
  type: justification
  name: Derive y = mx for a line through the origin
  statement: For any point (x, y) other than the origin on a non-vertical line through the origin with
    slope m, the slope from (0, 0) to (x, y) is y/x = m, so y = mx; the origin also satisfies y = mx.
  assess: A line through the origin has slope 3. Explain why every point (x, y) on it satisfies y = 3x.
  sources:
    ccss:
    - 8.EE.B.6
    lc: []
  strand: S4
- id: linear-function.line.y-mx-plus-b.write
  concept: linear-function
  facet: line
  level: 3
  type: representation
  name: Write y = mx + b for a line not through the origin
  statement: A non-vertical line with slope m that crosses the vertical axis at (0, b) has the equation
    y = mx + b.
  procedure:
  - Read two points (x1, y1) and (x2, y2) on the line.
  - Compute m = (y2 - y1)/(x2 - x1).
  - Compute b = y1 - m x x1.
  - Write y = mx + b.
  assess: A line passes through (2, 5) and (6, 7). Write its equation.
  sources:
    ccss:
    - 8.EE.B.6
    lc:
    - 3e7febf4
  strand: S4
- id: linear-function.line.y-mx-plus-b.derive
  concept: linear-function
  facet: line
  level: 4
  type: justification
  name: Derive y = mx + b for a line crossing the vertical axis at b
  statement: For any point (x, y) with x not 0 on a non-vertical line with slope m through (0, b), the
    slope from (0, b) to (x, y) is (y - b)/x = m, so y = mx + b; the point (0, b) also satisfies it.
  assess: A line has slope 2 and crosses the vertical axis at (0, -3). Explain why every point (x, y)
    on it satisfies y = 2x - 3.
  sources:
    ccss:
    - 8.EE.B.6
    lc: []
  strand: S4
- id: linear-function.model.construct
  concept: linear-function
  facet: model
  level: 3
  type: representation
  name: Construct a linear function to model a relationship
  statement: A linear relationship between two quantities is modeled by y = mx + b, where m is the rate
    of change of y per unit of x and b is the value of y when x = 0.
  procedure:
  - Name the input variable x and output variable y with their units.
  - Find the rate of change m.
  - Find the initial value b.
  - Write y = mx + b.
  assess: A plumber charges $40 for a visit plus $25 per hour. Write a function for the total cost C in
    terms of hours h.
  sources:
    ccss:
    - 8.F.B.4
    lc:
    - dab9e9b0
  strand: S4
- id: linear-function.model.rate.from-two-values
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: Find the rate of change from two (x, y) values
  statement: The rate of change of a linear function, from two (x, y) values read from a table or graph
    with different x, is (y2 - y1)/(x2 - x1).
  procedure:
  - Read two pairs (x1, y1) and (x2, y2) with x1 not equal to x2.
  - Compute m = (y2 - y1)/(x2 - x1).
  assess: A table for a linear function shows x = 2, y = 11 and x = 5, y = 20. Find the rate of change.
  sources:
    ccss:
    - 8.F.B.4
    lc:
    - e1ce9802
    - c6f0747b
  strand: S4
- id: linear-function.model.rate.from-description
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: Find the rate of change from a verbal description
  statement: From a description of a linear relationship, the rate of change is the stated change in the
    output for each 1-unit increase in the input, negative when the output decreases.
  procedure:
  - Find the phrase giving the change in the output per unit of input (for example 'per', 'each').
  - Take that amount as m, negative if the output goes down.
  - If the description instead gives two (x, y) values, compute m from them.
  assess: A 500-liter tank drains at 20 liters per minute. What is the rate of change of the volume with
    respect to time?
  sources:
    ccss:
    - 8.F.B.4
    lc:
    - 1944c542
    - dd4d95c3
  strand: S4
- id: linear-function.model.initial.from-two-values
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: Find the initial value from a table or graph
  statement: The initial value of a linear function is its output at x = 0; when x = 0 is not shown, it
    is b = y1 - m x x1 for any shown pair (x1, y1).
  procedure:
  - If the table or graph shows the point with x = 0, read its y-value as b.
  - Otherwise find the rate of change m from two shown pairs.
  - Compute b = y1 - m x x1 for one shown pair (x1, y1).
  assess: A table for a linear function shows x = 2, y = 11 and x = 5, y = 20. Find the initial value.
  sources:
    ccss:
    - 8.F.B.4
    lc:
    - 5f3a9252
    - 443d082c
  strand: S4
- id: linear-function.model.initial.from-description
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: Find the initial value from a verbal description
  statement: From a description of a linear relationship, the initial value is the output when the input
    is 0, such as a starting amount or a fixed fee.
  procedure:
  - If the description states the output at input 0 (a starting amount or fixed fee), take it as b.
  - Otherwise find m and a stated pair (x1, y1), and compute b = y1 - m x x1.
  assess: A candle burns 2 cm per hour. After 3 hours it is 18 cm tall. How tall was it at the start?
  sources:
    ccss:
    - 8.F.B.4
    lc:
    - 411f2a23
    - c8e759d8
  strand: S4
- id: linear-function.model.rate.interpret
  concept: linear-function
  facet: model
  level: 3
  type: concept
  name: Interpret the rate of change in context
  statement: The rate of change m of a linear model is the amount the output changes, in its units, for
    each 1-unit increase in the input.
  assess: The cost of a taxi ride is C = 2.5d + 3, where d is miles. What does 2.5 mean in this situation?
  sources:
    ccss:
    - 8.F.B.4
    lc:
    - b2a9431b
  strand: S4
- id: linear-function.model.initial.interpret
  concept: linear-function
  facet: model
  level: 3
  type: concept
  name: Interpret the initial value in context
  statement: The initial value b of a linear model is the output, in its units, when the input is 0.
  assess: The height of water in a pool is h = 120 - 4t centimeters after t hours of draining. What does
    120 mean in this situation?
  sources:
    ccss:
    - 8.F.B.4
    lc:
    - 6c340f89
  strand: S4
