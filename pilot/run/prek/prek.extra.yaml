notes: >-
  52 nodes, 5 roots (counting.sequence.recite, subitizing.perceptual, comparing.count.perceptual,
  shapes.match, classifying.alike). Toddler levels appear only inside those roots
  (cs.subitize.small-collection-namer, cs.compare.perceptual, cs.shapes.matcher, cs.classify.similarity).
  The counting.objects split: counting.one-to-one (K.CC.B.4.a), counting.cardinal.last-word (K.CC.B.4.b first
  clause), counting.cardinal.order-irrelevance (K.CC.B.4.b second clause), counting.successor (K.CC.B.4.c), and
  counting.objects kept for counting to answer how many (K.CC.B.5). counting.successor cites no prek id: no
  trajectory level in scope states it; cp.successor-lag, cp.unit-task and cp.successor-direction-dispute bear on
  it and block any edge touching it until the primary papers are read. Broad ELOF goals are cited on several
  nodes each (as lc ids were in S0); no source item is both cited and dropped.
  Calls a reviewer should check:
  (1) Produce a set of N is its own node (counting.produce-set), not the assess of cardinality: it is the
  give-a-number task at the CP range and needs a stopping rule the counting procedure lacks; cp.cp-age defines
  CP knowledge as both counting and producing, so the proposers may want an edge, not a merge.
  (2) cardinality.small-number-words merges the one-, two-, three- (and four-) knower levels (cp.knower-levels,
  memory-sourced) and is separate from counting.cardinal.last-word.
  (3) Counting-compare with same-size and with different-size objects is one node (comparing.count.by-counting):
  the task is the same; resisting the size cue is reliability. A reviewer could split it if conservation-type
  resistance is judged a different competency.
  (4) Perceptual subitizing to 4 and to 5 merged; conceptual subitizing to 5 and to 10 merged (VETTING 3b).
  (5) Nonverbal add and take-away are two nodes, as are count-all joining and count-remaining separating, and the
  two story-problem nodes; addition and subtraction are separate concepts in concepts.yaml.
  (6) cs.compose.pre-part-whole is merged into number-composition.part-whole.inexact (whole bigger than parts);
  its own description says the exact count is wrong, so the inexact relation is what it shows.
  (7) shapes.compare.same-different merges the four comparing-shapes levels (similar, part, some, most
  attributes) as reliability steps of one task; cs.cmpshape.same-thing went into classifying.alike since it compares
  real-world objects, not shapes.
  (8) cs.length.serial-orderer-6 is cited on comparing.size.order (order by length) although its trajectory text
  speaks of lengths marked in units; cs.compare.serial-orderer-6 (same level, comparing trajectory) is dropped as
  ordering by number.
  (9) ELOF P-MATH 8 also mentions measuring with the same unit; that part is measurement.length.iterate-units (an
  existing node), not repeated here. ELOF P-MATH 9 also mentions sorting 3D shapes; no 3D node was written.
  ELOF P-MATH 4 also mentions ordinal words; ordinal.position carries the Clements-Sarama ordinal level.
  (10) Fair sharing (partitioning.set.deal-out) is flagged in VETTING 3e as a candidate route into
  division.partitive.meaning, route-only; multiplication.equal-groups.make is similarly a candidate route into
  multiplication.equal-groups.meaning.
  (11) counting.sequence.backward has no root_reason because it is expected to require counting.sequence.recite;
  the proposers decide.
  (12) Twelve short procedure-type nodes (for example counting.events, comparing.weight.direct, the shape
  composition nodes, spatial.motion.turn-flip) carry their steps in the statement with no separate procedure list;
  add lists if an edge needs to point at a step.
