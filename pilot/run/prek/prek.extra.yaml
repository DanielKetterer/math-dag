new_concepts:
  - {concept: counting, facet: sequence, reason: "Saying the number words in order (forward or backward) with no objects is a meaning of counting distinct from enumerating a collection (cp.recite-before-meaning)."}
  - {concept: cardinality, facet: core, reason: "Exact quantity meaning of a number word, tested by give-a-number; the subset-knower levels (cp.knower-levels) live here, separate from the counting procedure."}
  - {concept: numeral, facet: core, reason: "Written numerals and their link to number words and quantities (reading, writing, matching to a set)."}
  - {concept: numeral, facet: informal-mark, reason: "Recording how many with one mark or drawing per object, before conventional numerals (ELOF P-MATH 5: drawings, tallies)."}
  - {concept: subitizing, facet: perceptual, reason: "Naming a small set at a glance without seeing parts."}
  - {concept: subitizing, facet: nonverbal, reason: "Reproducing a briefly seen small set without number words; the assess differs in kind from naming."}
  - {concept: subitizing, facet: conceptual, reason: "Naming a larger briefly shown set by seeing its parts and combining them."}
  - {concept: comparing, facet: weight, reason: "Direct comparison of weight (K.MD.A.2 and ELOF P-MATH 8 name weight alongside length)."}
  - {concept: ordinal, facet: core, reason: "Position in a sequence (first through tenth), distinct from how many."}
  - {concept: number-composition, facet: part-whole, reason: "A number as made of parts (whole bigger than parts; combinations within 5); Clements-Sarama Composing Number trajectory."}
  - {concept: shapes, facet: properties, reason: "Sides and corners as countable parts of a shape (K.G.B.4)."}
  - {concept: shapes, facet: composition, reason: "Building shapes from parts or from other shapes, and taking them apart (K.G.B.5, K.G.B.6)."}
  - {concept: spatial, facet: motion, reason: "Turning, sliding, and flipping a shape to fit (Clements-Sarama spatial sense / motions)."}
  - {concept: spatial, facet: position-body, reason: "Direction words referenced to one's own body (VETTING 4: body-referenced is a different facet from object-referenced)."}
  - {concept: spatial, facet: position-object, reason: "Position words for one object relative to another (K.G.A.1)."}
  - {concept: classifying, facet: core, reason: "Seeing objects as alike or different; root of the classification trajectory."}
  - {concept: classifying, facet: attribute, reason: "Naming and sorting by a single attribute (K.MD.B.3)."}
