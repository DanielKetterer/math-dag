- id: counting.sequence.recite
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Recite the number words in order through the teens
  statement: Say the number words as separate words in their conventional order, starting at one and continuing
    through nineteen, with none skipped or repeated. These words must be memorized; they do not follow
    the decade rule that generates the later number words.
  assess: 'With no objects present: ''Count out loud as far as you can, starting at one.'' Credit an unbroken
    correct sequence from one through nineteen.'
  sources:
    prek:
    - elof.p-math-1
    - cs.counting.reciter-10
    - cp.gg.stable-order
    ccss: []
- id: counting.sequence.backward
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count backward by ones
  statement: Say the number words in reverse order by ones, from a given starting number down to one,
    with none skipped or repeated.
  assess: '''Start at eight and count backward all the way to one.'' Credit ''eight, seven, six, five,
    four, three, two, one'' with no word skipped.'
  sources:
    prek:
    - cs.counting.backward-from-10
    ccss: []
- id: counting.one-to-one
  concept: counting
  facet: core
  level: 1
  type: procedure
  name: Say one number word for each object in a count
  statement: While counting a collection, pair each object with exactly one number word, so that every
    object is tagged once and no object is skipped or tagged twice.
  procedure:
  - Point to or move one object that has not been counted, and say one number word with it.
  - Set that object apart, or keep track of it, as counted.
  - Repeat until no uncounted objects remain.
  assess: '''Count these buttons, touching each one as you count'' (9 buttons scattered on the table).
    Credit if every button receives exactly one word and none is skipped or counted twice, whether or
    not the words are in the conventional order.'
  sources:
    prek:
    - cs.counting.corresponder
    - cp.gg.one-one
    ccss:
    - K.CC.B.4.a
- id: cardinality.small-number-words
  concept: cardinality
  facet: core
  level: 1
  type: concept
  name: Exact meanings of the small number words
  statement: Each of the number words one, two, and three names an exact quantity, so a learner asked
    for that many gives exactly that many objects.
  assess: 'From a bowl of 10 toy fish: ''Give the bear three fish.'' Credit exactly three fish (give-a-number
    task).'
  sources:
    prek:
    - elof.p-math-3
    ccss: []
- id: counting.cardinal.last-word
  concept: counting
  facet: core
  level: 1
  type: concept
  name: The last number word in a count tells how many
  statement: When a collection has been counted correctly, the last number word said names how many objects
    are in the whole collection, not only the last object counted.
  assess: After the child finishes counting 7 blocks, cover the blocks with a cloth and ask, 'How many
    blocks are under the cloth?' Credit 'seven' given without an attempt to recount.
  sources:
    prek:
    - cs.counting.counter-small
    - cp.gg.cardinal
    - elof.p-math-3
    ccss:
    - K.CC.B.4.b
- id: counting.cardinal.order-irrelevance
  concept: counting
  facet: core
  level: 1
  type: concept
  name: A count does not depend on order or arrangement
  statement: The number of objects in a collection is the same whatever order the objects are counted
    in and however they are rearranged, provided none are added or removed.
  assess: The child counts 7 bears in a row and says 'seven'. While the child watches, push the bears
    into a scattered pile, point to one in the middle, and ask, 'If you count them starting with this
    one, how many will you get?' Credit 'seven' without recounting.
  sources:
    prek:
    - cp.gg.order-irrelevance
    ccss:
    - K.CC.B.4.b
- id: counting.successor
  concept: counting
  facet: core
  level: 1
  type: concept
  name: Each next number word is one more
  statement: Each number word in the count sequence names a quantity exactly one greater than the word
    before it, so adding one object to a collection of n objects makes its number the word after n.
  assess: Count 8 marbles together with the child, then drop them into an opaque cup. Drop in one more
    while the child watches. 'How many marbles are in the cup now?' Credit 'nine' without emptying the
    cup to recount.
  sources:
    prek: []
    ccss:
    - K.CC.B.4.c
- id: counting.objects
  concept: counting
  facet: core
  level: 1
  type: procedure
  name: Count a collection to find how many
  statement: Find how many objects are in a collection, whether arranged in a line, an array, a circle,
    or scattered, by counting each object once with the number words in order and answering with the last
    word said.
  procedure:
  - Say the number words in order, starting at one.
  - Pair each word with exactly one object not yet counted, keeping counted and uncounted objects apart.
  - Stop when every object has been counted.
  - Answer 'how many' with the last number word said.
  assess: '''How many shells are on this tray?'' (12 shells scattered). Credit 12.'
  sources:
    prek:
    - elof.p-math-3
    - cs.counting.counter-10
    - cs.counting.counter-producer-10plus
    - cp.gg.stable-order
    ccss:
    - K.CC.B.5
- id: counting.produce-set
  concept: counting
  facet: core
  level: 1
  type: procedure
  name: Count out a set of a given number
  statement: Given a number word, make a set of exactly that many objects from a larger supply by counting
    objects out one at a time and stopping when the word just said is the given number.
  procedure:
  - Keep the given number word in mind.
  - Move objects from the supply one at a time, saying the number words in order from one.
  - Stop when the word just said is the given number word.
  assess: '''From this pile of 20 counters, put exactly 8 on the plate.'' Credit exactly 8 counters on
    the plate.'
  sources:
    prek:
    - cs.counting.producer-small
    - cs.counting.counter-producer-10plus
    ccss:
    - K.CC.B.5
- id: counting.events
  concept: counting
  facet: core
  level: 1
  type: procedure
  name: Count sounds or actions
  statement: Count a sequence of sounds or actions that are never present all at once, such as claps or
    jumps, by saying one number word with each as it happens, and tell how many there were.
  assess: '''Listen and count my claps.'' Clap 6 times out of the child''s sight. ''How many claps?''
    Credit 6.'
  sources:
    prek:
    - cp.gg.abstraction
    ccss: []
- id: numeral.read
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Read a written numeral
  statement: Say the number word that a written single-digit numeral stands for.
  assess: Point to numeral cards shown one at a time in mixed order (6, 2, 9, 0, 4). 'What number is this?'
    Credit the correct number word for each.
  sources:
    prek:
    - elof.p-math-5
    - cs.counting.counter-10
    ccss: []
- id: numeral.match-quantity
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Match a numeral to a set of objects
  statement: A written numeral stands for how many objects are in a set, so a numeral can be paired with
    the set it describes and a set can be labeled with its numeral.
  assess: Show the card '4' and three plates holding 3, 4, and 5 apples (arranged so the plate of 4 is
    not the longest row). 'Which plate has this many apples?' Credit the plate of 4.
  sources:
    prek:
    - elof.p-math-5
    ccss:
    - K.CC.A.3
- id: numeral.write
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Write a numeral for a spoken number
  statement: Write the conventional numeral for a number word that is spoken, with digits correctly formed
    and not reversed.
  assess: '''Write the number seven.'' Then ''Write the number three.'' Credit a recognizable, unreversed
    7 and 3.'
  sources:
    prek:
    - elof.p-math-5
    ccss:
    - K.CC.A.3
- id: numeral.informal-record
  concept: numeral
  facet: informal-mark
  level: 2
  type: representation
  name: Record how many with marks or drawings
  statement: Record the number of objects in a set by making one mark, tally, or drawing for each object,
    so the record can later be used to tell how many there were.
  assess: '''Make marks on this paper to remember how many cars are in the box'' (5 cars). Remove the
    box. ''Use your paper to tell me how many cars there were.'' Credit 5 marks and the answer 5.'
  sources:
    prek:
    - elof.p-math-5
    ccss: []
- id: subitizing.perceptual
  concept: subitizing
  facet: perceptual
  level: 1
  type: concept
  name: Name a small set at a glance
  statement: Name how many objects are in a set of one to about four or five that is shown too briefly
    to count, recognizing the number directly without seeing parts.
  assess: Flash a card with 3 dots in a random arrangement for about one second, then hide it. 'How many
    dots?' Repeat with 1, 4, and 2. Credit the correct number word each time.
  sources:
    prek:
    - elof.p-math-2
    - cs.subitize.small-collection-namer
    - cs.subitize.perceptual-4
    - cs.subitize.perceptual-5
    ccss: []
- id: subitizing.nonverbal
  concept: subitizing
  facet: nonverbal
  level: 1
  type: concept
  name: Make a matching set after a brief glimpse, without words
  statement: After seeing a set of one to about four objects briefly, make a set with the same number
    of objects without naming the number.
  assess: 'Show 3 blocks for about two seconds, then cover them. Hand the child a pile of blocks: ''Make
    yours just like mine.'' Credit exactly 3 blocks, whether or not the child says any number word.'
  sources:
    prek:
    - cs.subitize.nonverbal
    - cs.subitize.maker-small
    ccss: []
- id: subitizing.conceptual
  concept: subitizing
  facet: conceptual
  level: 1
  type: concept
  name: Name a briefly shown set by seeing its parts
  statement: Name how many objects are in a briefly shown arrangement too large to recognize at once by
    seeing it as small parts, each recognized at a glance, and knowing the whole they make.
  assess: Flash a ten-frame card with 5 dots in the top row and 2 in the bottom for about two seconds,
    then hide it. 'How many dots? How did you see them?' Credit 7 with a description of parts such as
    'five and two'.
  sources:
    prek:
    - cs.subitize.conceptual-5plus
    - cs.subitize.conceptual-10
    ccss: []
- id: comparing.count.perceptual
  concept: comparing
  facet: count
  level: 1
  type: concept
  name: Tell which of two very unequal sets has more
  statement: When one collection has at least about twice as many objects as another, tell which has more
    by looking, without counting.
  assess: Show a plate of 3 cookies and a plate of 10 cookies of the same size, side by side, for a few
    seconds. 'Which plate has more cookies?' Credit the plate of 10.
  sources:
    prek:
    - cs.compare.perceptual
    ccss: []
- id: comparing.count.small-equal
  concept: comparing
  facet: count
  level: 1
  type: concept
  name: Recognize two small sets as the same number
  statement: Recognize that two collections of one to four objects have the same number, or that one has
    more, by looking, even when the two collections are made of different kinds of objects.
  assess: Show 3 toy cars and 3 buttons, arranged differently. 'Do these have the same number, or does
    one have more?' Then show 3 cars and 4 buttons. Credit 'same' for the first pair and 'the buttons'
    for the second.
  sources:
    prek:
    - cs.compare.nonverbal-similar
    - cs.compare.nonverbal-dissimilar
    ccss: []
- id: comparing.count.matching
  concept: comparing
  facet: count
  level: 1
  type: procedure
  name: Compare two sets by one-to-one matching
  statement: Decide whether two collections have the same number, or which has more, by pairing each object
    in one with an object in the other; the collection with objects left unpaired has more.
  procedure:
  - Pair one object from the first collection with one object from the second.
  - Repeat until one collection, or both, has no unpaired objects.
  - If both run out together, they have the same number; otherwise the collection with unpaired objects
    has more.
  assess: Show 5 cups in a tight row and 6 saucers spread out in a longer row. 'Are there enough saucers
    for every cup, or are there more cups or more saucers? Show me how you know.' Credit 'more saucers'
    supported by pairing each cup with a saucer.
  sources:
    prek:
    - cs.compare.matching
    ccss:
    - K.CC.C.6
- id: comparing.count.by-counting
  concept: comparing
  facet: count
  level: 1
  type: procedure
  name: Compare two sets by counting
  statement: Decide which of two collections has more objects, or whether they have the same number, by
    counting each collection and comparing the two counts; the one whose count comes later in the number
    sequence has more, whatever the size or spread of the objects.
  procedure:
  - Count the first collection and remember its number.
  - Count the second collection and remember its number.
  - If the numbers are the same, the collections are equal; otherwise the collection whose number comes
    later in the count sequence has more.
  assess: Show 6 small buttons and 4 large blocks, the blocks spread so their row is longer. 'Are there
    more buttons or more blocks? Count to find out.' Credit 'more buttons' supported by counts of 6 and
    4.
  sources:
    prek:
    - elof.p-math-4
    - cs.compare.knows-to-count
    - cs.compare.counting-same-size
    - cs.compare.counting-5
    - cs.compare.counting-comparer
    ccss:
    - K.CC.C.6
- id: ordinal.position
  concept: ordinal
  facet: core
  level: 1
  type: concept
  name: Name a position in a line with ordinal words
  statement: In a line of objects with a stated starting end, the ordinal words first, second, third,
    and so on through tenth name each object's position counting from that end.
  assess: Line up 8 toy animals facing a toy barn. 'Which animal is fifth in line to go into the barn?'
    Then 'What place in line is the pig?' Credit the correct animal and the correct ordinal word.
  sources:
    prek:
    - cs.compare.ordinal-counter
    ccss: []
- id: measurement.length.attribute
  concept: measurement
  facet: length
  level: 1
  type: concept
  name: Length as an attribute of an object
  statement: Length is the attribute of an object that tells how long, tall, or far it is from end to
    end, separate from its other attributes such as weight or color.
  assess: Show a long thin ribbon and a short heavy block. 'Which one is longer? Which one is heavier?'
    Credit the ribbon as longer and the block as heavier, showing the two attributes are kept separate.
  sources:
    prek:
    - cs.length.quantity-recognizer
    ccss:
    - K.MD.A.1
- id: comparing.size.direct
  concept: comparing
  facet: length
  level: 1
  type: procedure
  name: Compare two lengths directly
  statement: Decide which of two objects is longer or taller, or that they are the same length, by placing
    them side by side with one pair of ends aligned and seeing which extends farther.
  procedure:
  - Place the two objects side by side, both straight.
  - Line up one end of each at the same starting point.
  - 'Look at the other ends: the object that extends farther is longer; if the ends meet, the lengths
    are equal.'
  assess: Give the child two pencils that differ in length by about one centimeter, laid crosswise with
    their ends not aligned. 'Which pencil is longer? Show me how you know.' Credit the correct pencil
    with the ends aligned to check.
  sources:
    prek:
    - cs.length.direct-comparer
    - elof.p-math-8
    ccss:
    - K.MD.A.2
- id: comparing.weight.direct
  concept: comparing
  facet: weight
  level: 1
  type: procedure
  name: Compare two weights directly
  statement: Decide which of two objects is heavier, or that they weigh the same, by holding one in each
    hand or placing them in the two pans of a balance; the side that goes down holds the heavier object.
  assess: Give the child a small, heavy stone and a large, light sponge and a pan balance. 'Which one
    is heavier? Show me how you know.' Credit the stone, shown with the balance or by hefting.
  sources:
    prek:
    - elof.p-math-8
    ccss:
    - K.MD.A.2
- id: comparing.size.order
  concept: comparing
  facet: length
  level: 1
  type: procedure
  name: Order several objects by length
  statement: Put three to five objects in order from shortest to longest by comparing their lengths, so
    each object is longer than the one before it.
  assess: Give the child 5 straws of clearly different lengths in a mixed pile. 'Put these in order from
    the shortest to the longest.' Credit a correct order.
  sources:
    prek:
    - elof.p-math-8
    - cs.length.serial-orderer-6
    ccss: []
- id: addition.add-to.nonverbal
  concept: addition
  facet: add-to
  level: 1
  type: procedure
  name: Add to a very small hidden set without words
  statement: After a set of one to three objects is hidden and one or two more are added to it out of
    sight, make a set that matches the new total, without naming any number.
  assess: Show 2 balls, put them in an opaque box, then drop 1 more ball in while the child watches. 'Make
    your pile match how many are in the box now.' Credit a pile of 3, whether or not any number word is
    said.
  sources:
    prek:
    - cs.addsub.nonverbal
    ccss: []
- id: subtraction.take-away.nonverbal
  concept: subtraction
  facet: take-away
  level: 1
  type: procedure
  name: Take away from a very small hidden set without words
  statement: After a set of two or three objects is hidden and one or two are removed from it, make a
    set that matches the number left, without naming any number.
  assess: Show 3 balls, put them in an opaque box, then take 1 out while the child watches. 'Make your
    pile match how many are in the box now.' Credit a pile of 2, whether or not any number word is said.
  sources:
    prek:
    - cs.addsub.nonverbal
    ccss: []
- id: addition.add-to.count-all
  concept: addition
  facet: add-to
  level: 1
  type: procedure
  name: Join two sets and count all
  statement: Find the total when a set of objects is joined to another set by putting both sets together
    and counting every object from one.
  procedure:
  - Make the first set with objects.
  - Make the second set and push it together with the first.
  - Count all the objects in the combined set, starting from one.
  - The last number word said is the total.
  assess: Put 3 counters on a plate, then add 2 more. 'How many counters are on the plate now?' Credit
    5 found by counting the whole plate.
  sources:
    prek:
    - elof.p-math-6
    - cs.addsub.small-number
    - cs.addsub.find-result
    ccss:
    - K.OA.A.1
- id: subtraction.take-away.count-remaining
  concept: subtraction
  facet: take-away
  level: 1
  type: procedure
  name: Take objects away and count what is left
  statement: Find how many remain when some objects are removed from a set by removing them and counting
    the objects left.
  procedure:
  - Make the starting set with objects.
  - Remove the number of objects to be taken away.
  - Count the objects that remain; the last number word said is the answer.
  assess: Put 5 crackers on a plate. Take 2 away and set them out of reach. 'How many crackers are left
    on the plate?' Credit 3 found by counting the plate.
  sources:
    prek:
    - elof.p-math-6
    - cs.addsub.small-number
    - cs.addsub.find-result
    ccss:
    - K.OA.A.1
- id: addition.application.add-to-story
  concept: addition
  facet: add-to
  level: 1
  type: application
  name: Solve add-to story problems with objects
  statement: A story tells of a starting amount and an amount added to it and asks for the result; the
    learner acts the story out with objects or fingers and finds how many there are in all.
  assess: '''Mia has 2 stickers. Her friend gives her 3 more stickers. How many stickers does Mia have
    now?'' (counters available). Credit 5.'
  sources:
    prek:
    - elof.p-math-6
    ccss:
    - K.OA.A.2
- id: subtraction.application.take-from-story
  concept: subtraction
  facet: take-away
  level: 1
  type: application
  name: Solve take-from story problems with objects
  statement: A story tells of a starting amount and an amount taken from it and asks how many are left;
    the learner acts the story out with objects or fingers and finds the result.
  assess: '''There are 5 ducks in the pond. 2 ducks fly away. How many ducks are still in the pond?''
    (counters available). Credit 3.'
  sources:
    prek:
    - elof.p-math-6
    ccss:
    - K.OA.A.2
- id: number-composition.part-whole.inexact
  concept: number-composition
  facet: part-whole
  level: 1
  type: concept
  name: A whole is more than either of its parts
  statement: When two nonempty sets are put together, the combined set has more objects than either set
    alone, and splitting a set gives parts that each have fewer objects than the whole.
  assess: 'Show a group of 4 red blocks and a group of 3 blue blocks, then push them together. Point to
    the red group in a separate identical picture: ''Are there more blocks all together, or more red blocks?''
    Credit ''more all together'' without the child needing to give either number.'
  sources:
    prek:
    - cs.compose.pre-part-whole
    - cs.compose.inexact-part-whole
    ccss: []
- id: number-composition.within-5
  concept: number-composition
  facet: part-whole
  level: 1
  type: fact
  name: Know the parts of numbers within 5
  statement: For any whole number up to 5, quickly name the missing part when the whole and one part are
    known, or the whole when both parts are known, without counting.
  assess: Show 5 counters, then hide some under a cup so 2 remain visible. 'There were 5. How many are
    hiding under the cup?' Credit 3 given quickly without lifting the cup.
  sources:
    prek:
    - cs.compose.composer-4-5
    ccss:
    - K.OA.A.3
    - K.OA.A.5
- id: partitioning.set.deal-out
  concept: partitioning
  facet: set
  level: 1
  type: procedure
  name: Share a set fairly by dealing it out
  statement: Share a set of objects equally among two or more recipients by giving one object to each
    recipient in turn until the objects run out, so every recipient ends with the same number.
  procedure:
  - Give one object to each recipient in turn.
  - Go around again, one object each, while objects remain.
  - Stop when the objects run out; if every recipient was given an object in the last round, the shares
    are equal.
  assess: '''Share these 12 crackers fairly among these 3 teddy bears so each one gets the same.'' Credit
    4 crackers per bear, made by dealing out.'
  sources:
    prek:
    - cs.muldiv.beginning-grouper
    - cs.muldiv.grouper-sharer
    ccss: []
- id: multiplication.equal-groups.make
  concept: multiplication
  facet: equal-groups
  level: 1
  type: procedure
  name: Make small groups of a given size
  statement: From a set of objects, make groups that each contain the same given number of objects, one
    group at a time, until no full group can be made.
  assess: '''Put these blocks into towers of 3 blocks each'' (12 blocks). Credit 4 towers, each of exactly
    3.'
  sources:
    prek:
    - cs.muldiv.grouper-sharer
    ccss: []
- id: shapes.match
  concept: shapes
  facet: core
  level: 1
  type: concept
  name: Match shapes that are the same shape
  statement: Pick, from several shapes, the one that is the same shape as a given shape, including when
    the two differ in size or orientation.
  assess: 'Show a small triangle pointing up. From a tray holding a large triangle turned on its side,
    a large square, a small circle, and a rectangle: ''Find the one that is the same shape as this one.''
    Credit the turned large triangle.'
  sources:
    prek:
    - cs.shapes.matcher
    - cs.shapes.matcher-more
    ccss: []
- id: shapes.name.prototype
  concept: shapes
  facet: core
  level: 1
  type: representation
  name: Name typical circles, squares, and triangles
  statement: Say the names circle, square, and triangle for typical examples of those shapes shown in
    their usual orientation.
  assess: Show, one at a time, a circle, a square resting on a side, and an equilateral triangle resting
    on a side. 'What shape is this?' Credit the correct name for each.
  sources:
    prek:
    - cs.shapes.prototype
    ccss: []
- id: shapes.recognize
  concept: shapes
  facet: core
  level: 1
  type: concept
  name: Recognize a shape whatever its size or orientation
  statement: Recognize every example of a familiar shape class, such as triangles, squares, rectangles,
    and circles, as that shape, whatever its size, orientation, or proportions, and reject figures that
    only resemble it.
  assess: On a sheet with 12 figures (long thin triangles, a triangle standing on a vertex, a tilted square,
    an oval, a triangle with a curved side, an open three-sided figure), 'Color every triangle.' Credit
    all and only the true triangles colored.
  sources:
    prek:
    - elof.p-math-9
    - cs.shapes.recognizer-cst
    - cs.shapes.recognizer-rectangles
    - cs.shapes.recognizer
    ccss:
    - K.G.A.2
- id: shapes.sides.count
  concept: shapes
  facet: properties
  level: 1
  type: concept
  name: Identify and count the sides of a shape
  statement: A side of a polygon is one of the straight segments that form its boundary, so the sides
    can be pointed to one by one and counted.
  assess: Show a hexagon. 'Run your finger along each side of this shape. How many sides does it have?'
    Credit 6 with each side traced once.
  sources:
    prek:
    - cs.shapes.side-recognizer
    ccss:
    - K.G.B.4
- id: shapes.corners.count
  concept: shapes
  facet: properties
  level: 1
  type: concept
  name: Identify and count the corners of a shape
  statement: A corner (vertex) of a polygon is a point where two of its sides meet, so the corners can
    be pointed to one by one and counted.
  assess: Show a pentagon. 'Touch each corner of this shape. How many corners does it have?' Credit 5
    with each corner touched once.
  sources:
    prek:
    - cs.shapes.angle-recognizer
    ccss:
    - K.G.B.4
- id: shapes.compare.same-different
  concept: shapes
  facet: core
  level: 1
  type: procedure
  name: Decide whether two shapes are the same by comparing whole shapes
  statement: Decide whether two flat shapes are exactly the same shape and size by checking that all of
    their parts match, for example by laying one on top of the other, not by matching only one side or
    part.
  assess: Give the child two paper triangles that share one side length but differ in another side. 'Are
    these the same shape and size? Show me how you know.' Credit 'no' supported by overlaying the whole
    shapes and pointing to the part that does not match.
  sources:
    prek:
    - cs.cmpshape.similar
    - cs.cmpshape.part
    - cs.cmpshape.some-attributes
    - cs.cmpshape.most-attributes
    ccss:
    - K.G.B.4
- id: shapes.compose.from-sides
  concept: shapes
  facet: composition
  level: 1
  type: procedure
  name: Build a shape from sticks for its sides
  statement: Build a model of a named shape by laying straight pieces such as sticks end to end as its
    sides, so that the pieces meet at the corners and the figure looks like the goal shape.
  assess: Give the child 6 craft sticks. 'Make a triangle with these sticks.' Credit a closed figure of
    three sticks meeting end to end.
  sources:
    prek:
    - cs.shapes.constructor-looks-like
    - elof.p-math-9
    ccss:
    - K.G.B.5
- id: shapes.compose.fill-outline
  concept: shapes
  facet: composition
  level: 1
  type: procedure
  name: Fill a puzzle outline where each piece is drawn
  statement: Fill a puzzle in which the outline of every piece is drawn by choosing, for each outlined
    region, a shape piece that fits it and placing it there, turning it as needed.
  assess: Give the child a picture of a house outlined with one square, one triangle, and two rectangles,
    and a pile of pattern blocks. 'Fill in the picture with these shapes.' Credit every outline filled
    by a fitting shape.
  sources:
    prek:
    - cs.compshape.piece-assembler
    ccss: []
- id: shapes.compose.combine
  concept: shapes
  facet: composition
  level: 1
  type: procedure
  name: Put shapes together to make a larger shape
  statement: Put two or more shapes together, edge to edge without gaps or overlaps, to make a larger
    shape or region whose inside lines are not drawn.
  assess: Give the child pattern blocks and an outline of a large hexagon with no inside lines. 'Fill
    this shape with blocks.' Credit the outline filled with no gaps or overlaps, for example by two trapezoids
    or six triangles.
  sources:
    prek:
    - cs.compshape.picture-maker
    - cs.compshape.shape-composer
    - elof.p-math-9
    ccss:
    - K.G.B.6
- id: shapes.decompose.simple
  concept: shapes
  facet: composition
  level: 1
  type: procedure
  name: Take a shape apart into smaller shapes
  statement: Show how a shape can be made of smaller shapes by covering it with smaller pieces or naming
    the smaller shapes it splits into, when the shape gives clear clues such as a drawn line or an obvious
    split.
  assess: Show a square with one diagonal drawn. 'This square is made of two smaller shapes. What shapes
    are they? Show me with your blocks.' Credit 'two triangles' shown with two triangle pieces covering
    the square.
  sources:
    prek:
    - cs.compshape.pre-decomposer
    - cs.compshape.simple-decomposer
    ccss: []
- id: spatial.motion.turn-flip
  concept: spatial
  facet: motion
  level: 1
  type: procedure
  name: Turn or flip a shape to make it fit
  statement: Make a shape fit an outline or match another shape by turning it, sliding it, or flipping
    it over, choosing which motion is needed.
  assess: Show an outline of a right triangle with its right angle at the lower left. Hand the child a
    matching triangle with its right angle at the upper right. 'Make your triangle fit exactly inside
    the outline.' Credit a fit made by turning the triangle.
  sources:
    prek:
    - cs.spatial.simple-turner
    - cs.spatial.beginning-motions
    ccss: []
- id: spatial.position.body
  concept: spatial
  facet: position-body
  level: 1
  type: concept
  name: Follow directions for moving one's own body
  statement: Direction words such as up, down, forward, backward, and around describe the position or
    movement of one's own body, so a learner can carry out a spoken direction that uses them.
  assess: '''Take two steps forward. Now put your hands up. Now take one step backward.'' Credit each
    movement made in the stated direction.'
  sources:
    prek:
    - elof.p-math-10
    ccss: []
- id: spatial.position.relative
  concept: spatial
  facet: position-object
  level: 1
  type: representation
  name: Use position words for where an object is
  statement: Position words such as in, on, under, above, below, in front of, behind, beside, and next
    to describe where one object is relative to another, and the learner can both place an object as told
    and say where an object is.
  assess: '''Put the bear behind the box.'' Then place the ball under the table and ask, ''Where is the
    ball?'' Credit the bear placed behind the box and ''under the table''.'
  sources:
    prek:
    - elof.p-math-10
    ccss:
    - K.G.A.1
- id: classifying.alike
  concept: classifying
  facet: core
  level: 1
  type: concept
  name: See two objects as alike or different
  statement: Judge whether two objects are the same kind of thing or alike in some way, and group objects
    that are alike.
  assess: Show a toy car, a second toy car of a different color, and a spoon. 'Which two go together?
    Why?' Credit the two cars, with any reason that names how they are alike.
  sources:
    prek:
    - cs.classify.similarity
    - cs.cmpshape.same-thing
    ccss: []
- id: classifying.attribute.identify
  concept: classifying
  facet: attribute
  level: 1
  type: concept
  name: Name the attribute a group of objects shares
  statement: Given a group of objects chosen because they share one attribute, such as color, shape, or
    size, name that attribute and add another object that has it.
  assess: Show a red block, a red car, and a red crayon (each a different kind of object). 'How are these
    all alike? Find one more thing from this basket that belongs with them.' Credit 'they are red' and
    a red object added.
  sources:
    prek:
    - cs.classify.attribute-identifier
    ccss: []
- id: classifying.sort.given-attribute
  concept: classifying
  facet: attribute
  level: 1
  type: procedure
  name: Sort objects by a given attribute
  statement: Separate a collection into groups by a stated attribute, placing every object in the group
    that matches its value of that attribute and keeping to that one attribute throughout.
  procedure:
  - Make one place for each value of the stated attribute (for example, one tray per color).
  - Take each object in turn and put it in the place for its value of that attribute.
  - Continue until every object is placed.
  assess: Give the child a mixed pile of 12 buttons in three colors and two sizes. 'Sort these buttons
    by color.' Credit three groups, each a single color, containing every button, with sizes mixed within
    groups.
  sources:
    prek:
    - cs.classify.attribute-sorter
    - cs.classify.consistent
    ccss:
    - K.MD.B.3
