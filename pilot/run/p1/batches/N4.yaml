- id: multiplication.power-of-ten.whole-number.explain
  concept: multiplication
  facet: base-ten
  level: 4
  type: justification
  name: Explain why multiplying by 10^k appends k zeros
  statement: Multiplying by 10 turns every ones into a ten, every ten into a hundred, and so on, so each
    digit moves one place to the left and a 0 fills the ones place; multiplying by 10^k does this k times,
    so k zeros appear.
  assess: Explain, using place value, why 368 x 1,000 = 368,000 and why the product has exactly three
