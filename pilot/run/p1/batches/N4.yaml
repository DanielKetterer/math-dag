- id: addition.base-ten.like-units
  concept: addition
  facet: base-ten
  level: 2
  type: concept
  name: Add like base-ten units
  statement: Adding two numbers written in base ten means adding hundreds to hundreds, tens to tens, and
    ones to ones; units of different sizes are never combined directly.
  assess: Lee says 325 + 40 = 725 because 3 + 4 = 7. Is he right? Use hundreds, tens, and ones to say
    what 325 + 40 is.
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - 0bbb2352
  strand: N4
- id: addition.base-ten.compose-unit
  concept: addition
  facet: base-ten
  level: 2
  type: concept
  name: Compose a ten or a hundred when adding
  statement: Ten ones make one ten and ten tens make one hundred, so when the units of one place total
    10 or more, 10 of them can be traded for 1 unit of the next larger place without changing the number.
  assess: After joining blocks you have 5 tens and 13 ones. Trade so that no place has 10 or more units.
    How many tens and ones do you have, and is it the same number?
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - 961d4025
  strand: N4
- id: addition.base-ten.model
  concept: addition
  facet: base-ten
  level: 2
  type: procedure
  name: Add within 1000 with base-ten models
  statement: Find a sum within 1000 with base-ten blocks or a drawing by joining like units and trading
    10 ones for a ten and 10 tens for a hundred where needed.
  procedure:
  - Show each addend with hundreds, tens, and ones (blocks or a drawing).
  - Put the like units together.
  - If there are 10 or more ones, trade 10 ones for 1 ten; then if there are 10 or more tens, trade 10
    tens for 1 hundred.
  - Count the hundreds, tens, and ones to read the sum.
  assess: Use base-ten blocks or a drawing to find 278 + 156.
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - 03fe171c
  strand: N4
- id: addition.base-ten.strategy
  concept: addition
  facet: base-ten
  level: 3
  type: procedure
  name: Add within 1000 by partial sums, without a model
  statement: Add two to four numbers within 1000, without blocks or drawings, by adding the hundreds,
    the tens, and the ones separately and then combining the partial sums.
  procedure:
  - Split each addend into hundreds, tens, and ones.
  - Add all the hundreds, add all the tens, and add all the ones.
  - Add the partial sums.
  assess: 'Without blocks or drawings, find 367 + 258 by partial sums: add the hundreds, the tens, and
    the ones, then combine.'
  sources:
    ccss:
    - 2.NBT.B.5
    - 2.NBT.B.6
    lc:
    - 39d56ac9
    - ff414985
  strand: N4
- id: addition.base-ten.relate-written
  concept: addition
  facet: base-ten
  level: 2
  type: representation
  name: Relate a base-ten addition model to a written method
  statement: 'Each step of a base-ten model of an addition matches a part of a written method in columns:
    joining like units matches adding a column, and each trade of 10 units for 1 of the next place matches
    a carried 1.'
  assess: 'A drawing shows 256 + 168: 14 ones are traded for 1 ten and 4 ones, then 12 tens for 1 hundred
    and 2 tens. In the written column method for 256 + 168, point to the mark that records each trade.'
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - ab0d6142
  strand: N4
- id: addition.base-ten.explain
  concept: addition
  facet: base-ten
  level: 4
  type: justification
  name: Explain a place-value addition strategy with properties
  statement: Adding by place value gives the correct sum because splitting the addends into place-value
    parts and regrouping those parts uses only the commutative and associative properties of addition,
    which never change a sum.
  assess: Explain why 47 + 38 = (40 + 30) + (7 + 8), naming the property of addition used at each step.
  sources:
    ccss:
    - 2.NBT.B.9
    lc:
    - 87aec89a
  strand: N4
- id: addition.standard-algorithm
  concept: addition
  facet: base-ten
  level: 3
  type: procedure
  name: Add multi-digit whole numbers with the standard algorithm
  statement: Add multi-digit whole numbers by adding column by column from the ones, writing each column's
    ones digit and carrying its tens digit to the next column left.
  procedure:
  - Write the numbers in columns with digits of the same place value aligned on the right.
  - Add the digits in the ones column.
  - If a column's total is 10 or more, write its ones digit in that column and carry its tens digit to
    the next column to the left.
  - Move one column left, add its digits and any carried digit, and repeat the previous step.
  - After the leftmost column, write any carried digit as the leading digit of the sum.
  assess: Use the standard algorithm to find 48,679 + 7,856.
  sources:
    ccss:
    - 4.NBT.B.4
    lc:
    - bd0c4c17
  strand: N4
- id: subtraction.base-ten.like-units
  concept: subtraction
  facet: base-ten
  level: 2
  type: concept
  name: Subtract like base-ten units
  statement: Subtracting numbers written in base ten means subtracting hundreds from hundreds, tens from
    tens, and ones from ones; units of different sizes are never subtracted from each other directly.
  assess: Kai says 586 - 30 = 286 because 5 - 3 = 2. Is he right? Use hundreds, tens, and ones to say
    what 586 - 30 is.
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - 0bbb2352
  strand: N4
- id: subtraction.base-ten.decompose-unit
  concept: subtraction
  facet: base-ten
  level: 2
  type: concept
  name: Decompose a ten or a hundred when subtracting
  statement: When a place has too few units to subtract from, 1 unit of the next larger place can be traded
    for 10 units of this place without changing the number.
  assess: You have 4 tens and 2 ones and must take away 7 ones. Trade 1 ten. How many tens and ones do
    you have now, and is it the same number?
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - 961d4025
  strand: N4
- id: subtraction.base-ten.model
  concept: subtraction
  facet: base-ten
  level: 2
  type: procedure
  name: Subtract within 1000 with base-ten models
  statement: Find a difference within 1000 with base-ten blocks or a drawing by taking away like units,
    trading 1 ten for 10 ones or 1 hundred for 10 tens where needed.
  procedure:
  - Show the minuend with hundreds, tens, and ones (blocks or a drawing).
  - For each place, starting with the ones, if there are fewer units than must be taken away, trade 1
    unit of the next larger place for 10 of this unit; if that place is empty, first trade a hundred for
    10 tens.
  - Take away the ones, tens, and hundreds of the subtrahend.
  - Count the hundreds, tens, and ones left to read the difference.
  assess: Use base-ten blocks or a drawing to find 503 - 268.
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - 5dfb9a7e
  strand: N4
- id: subtraction.base-ten.strategy
  concept: subtraction
  facet: base-ten
  level: 3
  type: procedure
  name: Subtract within 1000 by taking away place-value parts, without a model
  statement: Subtract within 1000, without blocks or drawings, by taking away the subtrahend's hundreds,
    then its tens, then its ones, one part at a time.
  procedure:
  - Split the subtrahend into hundreds, tens, and ones.
  - Subtract the hundreds part from the minuend.
  - Subtract the tens part from that result.
  - Subtract the ones part from that result; this is the difference.
  assess: Without blocks or drawings, find 724 - 358 by subtracting 300, then 50, then 8.
  sources:
    ccss:
    - 2.NBT.B.5
    lc:
    - 41093be0
  strand: N4
- id: subtraction.base-ten.relate-written
  concept: subtraction
  facet: base-ten
  level: 2
  type: representation
  name: Relate a base-ten subtraction model to a written method
  statement: 'Each step of a base-ten model of a subtraction matches a part of a written method in columns:
    taking away like units matches subtracting a column, and each trade of 1 unit for 10 of the next smaller
    place matches crossing out a digit, writing it 1 less, and adding 10 to the place on its right.'
  assess: 'A drawing shows 432 - 158: 1 ten is traded for 10 ones, then 1 hundred for 10 tens. In the
    written column method for 432 - 158, point to the marks that record each of the two trades.'
  sources:
    ccss:
    - 2.NBT.B.7
    lc:
    - f081e0ef
  strand: N4
- id: subtraction.base-ten.explain
  concept: subtraction
  facet: base-ten
  level: 4
  type: justification
  name: Explain a place-value subtraction strategy with properties
  statement: 'Taking away a number in place-value parts gives the correct difference because taking away
    b + c is the same as taking away b and then c: a - (b + c) = (a - b) - c.'
  assess: Explain why 724 - 358 = ((724 - 300) - 50) - 8.
  sources:
    ccss:
    - 2.NBT.B.9
    lc:
    - 37366bc7
  strand: N4
- id: subtraction.standard-algorithm
  concept: subtraction
  facet: base-ten
  level: 3
  type: procedure
  name: Subtract multi-digit whole numbers with the standard algorithm
  statement: Subtract a whole number from a larger or equal one column by column from the ones, regrouping
    from the nearest nonzero place to the left whenever a top digit is smaller than the digit below it.
  procedure:
  - Write the minuend above the subtrahend with digits of the same place value aligned on the right.
  - In the current column, starting with the ones, if the top digit is at least the bottom digit, subtract
    and write the result.
  - Otherwise take 1 from the nearest nonzero top digit to the left, change each 0 passed over to 9, add
    10 to the current top digit, then subtract.
  - Move one column left and repeat until every column is done.
  assess: Use the standard algorithm to find 60,402 - 18,756.
  sources:
    ccss:
    - 4.NBT.B.4
    lc:
    - 7d5e2ea9
  strand: N4
- id: multiplication.by-multiple-of-ten
  concept: multiplication
  facet: base-ten
  level: 3
  type: procedure
  name: Multiply a one-digit number by a multiple of 10, 100, or 1000
  statement: 'Multiply a one-digit number by a one-digit multiple of a base-ten unit by multiplying the
    one-digit numbers and keeping the unit: 9 x 80 = 9 x 8 tens = 72 tens = 720.'
  procedure:
  - Write the multiple of 10, 100, or 1000 as a number of tens, hundreds, or thousands (80 = 8 tens).
  - Multiply the two one-digit numbers (9 x 8 = 72).
  - The product is that many of the same unit (72 tens = 720).
  assess: Find 6 x 70 and 4 x 500 by counting tens or hundreds as units; do not use a written algorithm.
  sources:
    ccss:
    - 3.NBT.A.3
    lc:
    - 5067efaa
  strand: N4
- id: multiplication.multiple-of-ten.by-multiple-of-ten
  concept: multiplication
  facet: base-ten
  level: 3
  type: procedure
  name: Multiply a multiple of 10 by a multiple of 10
  statement: 'A product of two multiples of 10 such as 30 x 40 equals (3 x 4) x (10 x 10), so it is that
    many hundreds: 30 x 40 = 12 hundreds = 1200.'
  procedure:
  - Write each factor as a one-digit number times 10 (30 = 3 x 10, 40 = 4 x 10).
  - Multiply the one-digit numbers (3 x 4 = 12).
  - Since 10 x 10 = 100, the product is that many hundreds (1200).
  assess: Find 30 x 40 and 60 x 50 by multiplying the tens digits and naming the unit; do not use a written
    algorithm.
  sources:
    ccss:
    - 4.NBT.B.5
    lc: []
  strand: N4
- id: multiplication.partial-products.by-one-digit
  concept: multiplication
  facet: base-ten
  level: 3
  type: procedure
  name: Multiply a multi-digit number by a one-digit number with partial products
  statement: Multiply a whole number of up to four digits by a one-digit number by splitting the multi-digit
    factor into place-value parts, multiplying each part by the one-digit factor, and adding the partial
    products (the distributive property).
  procedure:
  - Split the multi-digit factor into thousands, hundreds, tens, and ones (3,846 = 3000 + 800 + 40 + 6).
  - Multiply each part by the one-digit factor.
  - Add the partial products.
  assess: Find 7 x 3,846 by splitting 3,846 into thousands, hundreds, tens, and ones, multiplying each
    part by 7, and adding.
