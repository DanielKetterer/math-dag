  strand: N4
- id: multiplication.power-of-ten.decimal.explain
  concept: multiplication
  facet: base-ten
  level: 4
  type: justification
  name: Explain why multiplying by 10^k moves the decimal point k places right
  statement: Each place is worth 10 times the place to its right, so multiplying by 10 makes every digit
    worth 10 times as much, which moves it one place left relative to the decimal point; doing this k
    times moves every digit k places left, so the point appears k places to the right.
  assess: Explain, using place value, why 0.47 x 100 = 47.
