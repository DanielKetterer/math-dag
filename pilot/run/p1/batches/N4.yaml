  strand: N4
- id: decimal.addition.model
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: procedure
  name: Add decimals to hundredths with a place-value model
  statement: Find a sum of decimals to hundredths with base-ten blocks or grids by joining like units
    (ones, tenths, hundredths) and trading 10 hundredths for 1 tenth and 10 tenths for 1 one where needed.
  procedure:
  - Show each addend as ones, tenths, and hundredths with blocks or grids.
  - Put the like units together.
  - If there are 10 or more hundredths, trade 10 hundredths for 1 tenth; then if there are 10 or more
    tenths, trade 10 tenths for 1 one.
  - Count the ones, tenths, and hundredths to read the sum.
  assess: Use base-ten blocks or hundredths grids to find 2.47 + 1.85.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - 425dce77
  strand: N4
- id: decimal.subtraction.model
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: procedure
  name: Subtract decimals to hundredths with a place-value model
  statement: Find a difference of decimals to hundredths with base-ten blocks or grids by taking away
    like units, trading 1 tenth for 10 hundredths or 1 one for 10 tenths where needed.
  procedure:
  - Show the minuend as ones, tenths, and hundredths with blocks or grids.
  - For each place, starting with the hundredths, if there are fewer units than must be taken away, trade
    1 unit of the next larger place for 10 of this unit; if that place is empty, first trade a one for
    10 tenths.
  - Take away the hundredths, tenths, and ones of the subtrahend.
  - Count what is left to read the difference.
  assess: Use base-ten blocks or hundredths grids to find 4.05 - 1.37.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - 445dd0dd
  strand: N4
- id: decimal.addition.relate-written
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: representation
  name: Relate a decimal addition model to a written method
  statement: Lining up the decimal points in a written decimal sum puts like units (ones, tenths, hundredths)
    in the same column, matching the joining of like units in the model; each trade of 10 units for 1
    of the next place matches a carried 1.
  assess: A grid model shows 2.47 + 1.85 with 12 hundredths traded for 1 tenth and 2 hundredths. Write
    the sum in columns, and say why the decimal points must line up and which mark records the trade.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - a42d73b8
  strand: N4
- id: decimal.subtraction.relate-written
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: representation
  name: Relate a decimal subtraction model to a written method
  statement: Lining up the decimal points in a written decimal difference puts like units in the same
    column, matching taking away like units in the model; each trade of 1 unit for 10 of the next smaller
    place matches regrouping in the written columns.
  assess: A grid model shows 4.05 - 1.37 with 1 one traded for 10 tenths and 1 tenth traded for 10 hundredths.
    Write the difference in columns and point to the marks that record each trade.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - 9965bcb5
  strand: N4
- id: decimal.multiplication.by-whole.model
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: procedure
  name: Multiply a decimal by a whole number with a place-value model
  statement: Find n x d, for a whole number n and a decimal d to hundredths, by making n copies of d with
    blocks or grids, combining like units, and trading 10 hundredths for 1 tenth and 10 tenths for 1 one.
  procedure:
  - Show d as ones, tenths, and hundredths with blocks or grids, n times.
  - Combine the like units.
  - Trade 10 hundredths for 1 tenth and 10 tenths for 1 one where possible.
  - Count the ones, tenths, and hundredths to read the product.
  assess: Use base-ten blocks or hundredths grids to find 4 x 0.36.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - 486045b7
  strand: N4
- id: decimal.multiplication.by-decimal.model
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: procedure
  name: Multiply two decimals with an area model
  statement: Find the product of two decimals, with a product to hundredths, as the area of a rectangle
    with those side lengths on a grid where the unit square is split into 100 hundredths, so a tenth times
    a tenth is one hundredth.
  procedure:
  - Draw a rectangle whose side lengths are the two factors, using a grid whose unit square is split into
    10 by 10 small squares.
  - Split each side into ones and tenths and divide the rectangle into the matching parts.
  - 'Find each part''s area: ones x ones in ones, ones x tenths in tenths, tenths x tenths in hundredths.'
  - Add the areas of the parts.
  assess: Use an area model on a hundredths grid to find 1.2 x 0.3.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - 486045b7
  strand: N4
- id: decimal.multiplication.relate-written
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: representation
  name: Relate decimal multiplication models to the decimal-point rule
  statement: In an area model, a tenth times a tenth is a hundredth, so a product of a factor in tenths
    and a factor in tenths is a whole number of hundredths; this matches the written method of multiplying
    as whole numbers and giving the product as many decimal places as the factors have together.
  assess: An area model shows 1.2 x 0.3 = 0.36. Find 12 x 3, and use the model to explain why the written
    method places the decimal point two places from the right.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - bb674a90
  strand: N4
- id: decimal.division.by-whole.model
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: procedure
  name: Divide a decimal by a whole number with a place-value model
  statement: Find d divided by n, for a decimal d to hundredths and a one-digit whole number n with a
    quotient to hundredths, by sharing the blocks for d into n equal groups, trading 1 one for 10 tenths
    or 1 tenth for 10 hundredths when a unit cannot be shared evenly.
  procedure:
  - Show d as ones, tenths, and hundredths with blocks or grids.
  - Share the ones equally among n groups; trade any ones left over for tenths.
  - Share the tenths equally; trade any tenths left over for hundredths.
  - Share the hundredths equally.
  - Read the amount in one group; it is the quotient.
  assess: Use base-ten blocks or hundredths grids to find 3.48 divided by 4 by sharing into 4 equal groups.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - 90b36ead
  strand: N4
- id: decimal.division.by-decimal.model
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: procedure
  name: Divide by a decimal with a model, as how many groups
  statement: Find a divided by d, for a decimal divisor d in tenths or hundredths with a whole-number
    quotient, by finding how many copies of d make a on a model.
  procedure:
  - Show the dividend a with blocks, grids, or a number line in units of the divisor's smallest place.
  - Mark off copies of the divisor d, one after another, until a is used up.
  - Count the copies; the count is the quotient.
  assess: Use a hundredths grid or a number line to find 1.6 divided by 0.2 by finding how many groups
    of 0.2 make 1.6.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - 90b36ead
  strand: N4
- id: decimal.division.relate-written
  concept: decimal
  facet: decimal-fraction
  level: 2
  type: representation
  name: Relate decimal division models to a written method
  statement: Sharing a decimal in a model, trading leftover ones for tenths and leftover tenths for hundredths,
    matches written long division where the decimal point of the quotient is placed directly above the
    decimal point of the dividend and each leftover is brought down into the next smaller place.
  assess: A block model shows 3.48 shared into 4 equal groups, with 3 ones traded for 30 tenths. Write
    3.48 divided by 4 as long division and point to where the model's trade appears and why the quotient's
    decimal point sits above the dividend's.
  sources:
    ccss:
    - 5.NBT.B.7
    lc:
    - c2ad2555
  strand: N4
- id: expressions.grouping.evaluate
  concept: expressions
  facet: numerical
  level: 3
  type: procedure
  name: Evaluate expressions with one level of grouping symbols
  statement: In a numerical expression with parentheses, brackets, or braces that are not nested, compute
    each grouped part first, then finish the rest of the expression.
  procedure:
  - Compute the value inside each pair of grouping symbols.
  - Replace each group by its value.
  - Compute the resulting expression, doing multiplication and division before addition and subtraction.
  assess: Evaluate (12 - 4) x (3 + 2) and 20 - [6 + 9].
  sources:
    ccss:
    - 5.OA.A.1
    lc:
    - 9355ee95
  strand: N4
- id: expressions.grouping.nested.evaluate
  concept: expressions
  facet: numerical
  level: 3
  type: procedure
  name: Evaluate expressions with nested grouping symbols
  statement: In a numerical expression with grouping symbols inside other grouping symbols, compute the
    innermost group first and work outward.
  procedure:
  - Find the innermost pair of grouping symbols and compute its value.
  - Replace that group by its value.
  - Repeat with the new innermost group until no grouping symbols remain.
  - Compute the remaining expression.
  assess: Evaluate 2 x {5 + [12 - (3 + 1)]}.
  sources:
    ccss:
    - 5.OA.A.1
    lc:
    - '79506838'
  strand: N4
- id: expressions.write.record-calculation
  concept: expressions
  facet: numerical
  level: 3
  type: representation
  name: Write a numerical expression that records a calculation
  statement: A calculation of two or more steps described in words is recorded as one numerical expression,
    with grouping symbols around each step that must be done before the operation applied to it.
  assess: 'Write an expression, without evaluating it, for: add 8 and 7, then multiply by 2.'
  sources:
    ccss:
    - 5.OA.A.2
    lc:
    - 4f28828c
  strand: N4
- id: expressions.interpret.without-evaluating
  concept: expressions
  facet: numerical
  level: 3
  type: concept
  name: Interpret a numerical expression without evaluating it
  statement: 'The structure of a numerical expression tells how its value relates to its parts: n x (A)
    is n times as large as A, and (A) + n is n more than A, whatever the value of A.'
  assess: Without calculating, how does 3 x (18,932 + 921) compare with 18,932 + 921?
  sources:
    ccss:
    - 5.OA.A.2
    lc:
    - fe00d7de
  strand: N4
- id: patterns.numerical.two-rules
  concept: patterns
  facet: numerical
  level: 3
  type: procedure
  name: Generate two numerical patterns from two rules
  statement: Given two rules and a starting number for each, produce the terms of each pattern by applying
    its rule repeatedly to the previous term.
  procedure:
  - Write the starting number of the first pattern as its first term.
  - Apply the first rule to the last term written to get the next term; repeat for as many terms as needed.
  - Do the same for the second pattern with its own starting number and rule.
  assess: Pattern A starts at 0 with the rule 'add 3'. Pattern B starts at 0 with the rule 'add 6'. Write
    the first five terms of each.
  sources:
    ccss:
    - 5.OA.B.3
    lc:
    - 8a9af9bf
  strand: N4
- id: patterns.numerical.corresponding-pairs
  concept: patterns
  facet: numerical
  level: 3
  type: representation
  name: Form ordered pairs from corresponding terms of two patterns
  statement: Pairing the term in position k of one pattern with the term in position k of another gives
    the ordered pair (first-pattern term, second-pattern term) for each position k.
  assess: Pattern A is 0, 3, 6, 9, 12. Pattern B is 0, 6, 12, 18, 24. Write the ordered pairs (A term,
    B term) for the five positions.
  sources:
    ccss:
    - 5.OA.B.3
    lc:
    - 20eff432
    - eb4874e5
  strand: N4
- id: patterns.numerical.graph-pairs
  concept: patterns
  facet: numerical
  level: 3
  type: representation
  name: Graph corresponding-term pairs on a coordinate plane
  statement: The ordered pairs formed from corresponding terms of two patterns are plotted as points in
    the first quadrant, the first term on the horizontal axis and the second on the vertical axis.
  assess: Plot the points (0, 0), (3, 6), (6, 12), (9, 18) on a coordinate grid; they are corresponding
    terms of two patterns.
  sources:
    ccss:
    - 5.OA.B.3
    lc:
    - d39ace9b
    - eb4874e5
  strand: N4
- id: patterns.numerical.relationship
  concept: patterns
  facet: numerical
  level: 3
  type: concept
  name: Identify a relationship between corresponding terms
  statement: Corresponding terms of two patterns can stand in a fixed relationship, such as each term
    of one being a fixed multiple of, or a fixed amount more than, the corresponding term of the other.
  assess: Pattern A is 0, 3, 6, 9, 12 and Pattern B is 0, 6, 12, 18, 24. What is true of each B term compared
    with the A term in the same position?
  sources:
    ccss:
    - 5.OA.B.3
    lc:
    - 3e8126aa
  strand: N4
- id: patterns.numerical.relationship.explain
  concept: patterns
  facet: numerical
  level: 4
  type: justification
  name: Explain a relationship between corresponding terms from the rules
  statement: 'A relationship between corresponding terms follows from the rules: if both patterns start
    at 0 and one adds a and the other adds n x a, then after k steps the terms are k x a and k x (n x
    a), so the second is always n times the first.'
  assess: Pattern A starts at 0 and adds 3; Pattern B starts at 0 and adds 6. Explain why every B term
    is twice the A term in the same position, using the rules rather than the listed terms.
  sources:
    ccss:
    - 5.OA.B.3
    lc: []
  strand: N4
