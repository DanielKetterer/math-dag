- id: multiplication.partial-products.two-digit-by-two-digit
  concept: multiplication
  facet: base-ten
  level: 3
  type: procedure
  name: Multiply two two-digit numbers with partial products
  statement: Multiply two two-digit numbers by splitting both into tens and ones, finding the four products
    of a part of one factor with a part of the other, and adding them.
  procedure:
  - Split each factor into tens and ones (47 = 40 + 7, 36 = 30 + 6).
  - 'Multiply each part of the first factor by each part of the second: tens x tens, tens x ones, ones
    x tens, ones x ones.'
  - Add the four partial products.
  assess: Find 47 x 36 by splitting both factors into tens and ones, finding the four partial products,
