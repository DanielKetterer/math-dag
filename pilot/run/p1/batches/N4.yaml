- id: multiplication.standard-algorithm
  concept: multiplication
  facet: base-ten
  level: 3
  type: procedure
  name: Multiply multi-digit whole numbers with the standard algorithm
  statement: Multiply multi-digit whole numbers by finding, for each digit of one factor, a shifted row
    that multiplies the other factor by that digit with carrying, and adding the rows.
  procedure:
  - Write one factor above the other with digits aligned on the right.
  - Take the ones digit of the bottom factor. Multiply it by each digit of the top factor from right to
    left, adding any carried digit; write the ones digit of each result and carry its tens digit to the
    next product. Write the final carry at the left of the row.
  - Repeat for each next digit of the bottom factor, starting its row one more place to the left (fill
    the places on the right with zeros).
  - Add all the rows with the standard addition algorithm.
  assess: Use the standard algorithm to find 3,407 x 286.
  sources:
    ccss:
    - 5.NBT.B.5
    lc:
    - 39c3502c
    - c944c44a
    - f71f6845
    - 39865eff
  strand: N4
- id: division.partial-quotients.one-digit-divisor
  concept: division
  facet: measurement
  level: 3
  type: procedure
  name: Divide by a one-digit number with partial quotients, no remainder
  statement: Find the whole-number quotient of a dividend of up to four digits by a one-digit divisor,
    when it divides exactly, by repeatedly subtracting easy multiples of the divisor (such as 100 or 10
    times it) and adding up how many divisors were subtracted.
  procedure:
  - Start with the dividend as the amount left.
  - Choose a multiple of the divisor, such as divisor x 100, divisor x 10, or divisor x a one-digit number,
    that is not more than the amount left.
  - Subtract it from the amount left and record the number of divisors used (100, 10, ...) as a partial
    quotient.
  - Repeat until the amount left is 0.
  - Add the partial quotients; the sum is the quotient.
  assess: 'Find 852 divided by 6 by partial quotients: subtract multiples of 6 such as 100 x 6 and 10
    x 6, then add the partial quotients.'
  sources:
    ccss:
    - 4.NBT.B.6
    lc:
    - d5bcfb8d
    - 437e6968
    - f6809045
  strand: N4
- id: division.partial-quotients.one-digit-divisor.remainder
  concept: division
  facet: measurement
  level: 3
  type: procedure
  name: Find a quotient and remainder for a one-digit divisor with partial quotients
  statement: When a one-digit divisor does not divide a dividend of up to four digits exactly, partial
    quotients stop when the amount left is less than the divisor; the sum of the partial quotients is
    the whole-number quotient q and the amount left is the remainder r, with dividend = q x divisor +
    r and r less than the divisor.
  procedure:
  - Subtract multiples of the divisor from the dividend as in partial quotients, recording each partial
    quotient.
  - Stop when the amount left is less than the divisor.
  - The sum of the partial quotients is the quotient; the amount left is the remainder.
  assess: Find the whole-number quotient and the remainder of 2,347 divided by 5 by partial quotients.
  sources:
    ccss:
    - 4.NBT.B.6
    lc:
    - 47171d80
    - 81aefb08
    - f7db0623
  strand: N4
- id: division.area-model.one-digit-divisor.explain
  concept: division
  facet: unknown-factor
  level: 2
  type: justification
  name: Explain division by a one-digit number with an area model
  statement: Dividing n by a one-digit d is finding the unknown side of a rectangle with area n and one
    side d; cutting the area into parts that are each a multiple of d gives side pieces (the partial quotients)
    that add to the unknown side, and any area too small to make another full strip of width d is the
    remainder.
  assess: Draw an area model with one side 6 and area 852, and use it to explain why 852 divided by 6
    = 100 + 40 + 2.
  sources:
    ccss:
    - 4.NBT.B.6
    lc:
    - 6e0b8067
    - 9d81bd35
    - d98ddefd
  strand: N4
- id: division.partial-quotients.two-digit-divisor
  concept: division
  facet: measurement
  level: 3
  type: procedure
  name: Divide by a two-digit number with partial quotients
  statement: Find the whole-number quotient (and remainder, if any) of a dividend of up to four digits
    by a two-digit divisor by partial quotients, estimating each multiple of the divisor to subtract and
    choosing a smaller one when the estimate is more than the amount left.
  procedure:
  - Start with the dividend as the amount left.
  - Estimate a multiple of the divisor not more than the amount left, by rounding the divisor (36 is about
    40) or using a known product such as 100 x 36 or 10 x 36.
  - Multiply to find that multiple exactly; if it is more than the amount left, choose a smaller one.
  - Subtract it and record the partial quotient.
  - Repeat until the amount left is less than the divisor; add the partial quotients for the quotient,
    and the amount left is the remainder.
  assess: Find 7,452 divided by 36 by partial quotients, subtracting multiples of 36.
  sources:
    ccss:
    - 5.NBT.B.6
    lc:
    - 05283aa2
    - e8d8c43a
  strand: N4
- id: division.area-model.two-digit-divisor.explain
  concept: division
  facet: unknown-factor
  level: 2
  type: justification
  name: Explain division by a two-digit number with an area model
  statement: Dividing n by a two-digit d is finding the unknown side of a rectangle with area n and one
    side d; cutting the area into parts that are multiples of d gives side pieces that add to the unknown
    side.
  assess: Draw an area model with one side 24 and area 1,512, and use it to explain why 1,512 divided
