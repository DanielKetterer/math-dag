  concept: place-value
  facet: whole-number
  level: 2
  type: representation
  name: Record a teen number as 10 plus ones with an equation
  statement: A number from 11 to 19 shown as ten ones and some further ones is recorded by an equation
    that writes the number as 10 plus the further ones, for example 18 = 10 + 8.
  assess: A full ten-frame and 3 more counters are shown, 13 counters in all. Write an equation that shows
