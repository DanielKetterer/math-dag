- id: counting.sequence.to-100
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by ones from 1 to 100
  statement: Say the number words in order from one to one hundred, continuing correctly past each decade
    change (twenty-nine, thirty; ninety-nine, one hundred).
  assess: Count aloud by ones from 1 to 100.
  sources:
    ccss:
    - K.CC.A.1
    lc:
    - 555df2b6
  strand: N1
- id: counting.sequence.count-on
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count forward from a given number within 100
  statement: Begin the count at a given number within 100 and continue forward by ones, without first
    counting up from one.
  procedure:
  - Say the given number.
  - Say the next number word in the sequence after it.
  - Keep saying each next number word until told to stop.
  assess: Start at 57 and count forward by ones to 64. Do not start from 1.
  sources:
    ccss:
    - K.CC.A.2
    lc:
    - 85bcacad
    - 0f188ee6
  strand: N1
- id: counting.sequence.within-1000
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count forward by ones within 1000, across hundreds
  statement: Count forward by ones from any number to any number within 1000, continuing correctly across
    decades and hundreds (ninety-nine, one hundred, one hundred one; three hundred ninety-nine, four hundred).
  procedure:
  - Say the starting number.
  - For each next number, keep the hundreds name and say the next tens-and-ones name.
  - After a number ending in ninety-nine, say the next hundred (for example, four hundred), then continue
    with one, two, and so on after the hundred.
  assess: Count aloud by ones from 296 to 305.
  sources:
    ccss:
    - 1.NBT.A.1
    - 2.NBT.A.2
    lc:
    - 18d6b278
    - da04a9ac
    - 49fe9974
  strand: N1
- id: counting.sequence.backward.across-decades
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count backward by ones within 120, across decades
  statement: Count backward by ones from any number up to 120 to any smaller number, continuing correctly
    across decade and hundred changes (forty-one, forty, thirty-nine; one hundred one, one hundred, ninety-nine).
  procedure:
  - Say the starting number.
  - Say the number word just before it in the counting sequence.
  - After a number ending in zero, say the previous decade name with nine (after forty, thirty-nine).
  - Continue until the stopping number.
  assess: Count backward by ones from 103 to 96.
  sources:
    ccss:
    - 1.NBT.A.1
    lc:
    - c753e6c1
  strand: N1
- id: counting.skip.tens.decades
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by tens from 0 to 120
  statement: 'Say the decade numbers in order from zero: ten, twenty, thirty, ..., one hundred, one hundred
