  concept: comparing
  facet: whole-number
  level: 2
  type: representation
  name: Record a whole-number comparison with >, =, <
  statement: The result of comparing two whole numbers is written with > (is greater than), = (is equal
    to), or < (is less than), the symbol opening toward the greater number.
  assess: 'You are told 58 is less than 85. Write the comparison with a symbol: 58 __ 85.'
