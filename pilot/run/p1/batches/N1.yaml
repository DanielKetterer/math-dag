    - c9115f50
  strand: N1
- id: rounding.whole-number.any-place
  concept: rounding
  facet: whole-number
  level: 3
  type: procedure
  name: Round a multi-digit whole number to any place
  statement: To round a whole number to a given place, keep the digits to the left of that place, add
    one unit of that place if the digit to its right is 5 or more, and write 0 in every place to its right.
  procedure:
  - Find the digit in the rounding place.
  - Look at the digit just to its right.
  - If that digit is 5 or more, add one unit of the rounding place, regrouping if the digit was 9.
  - Write 0 in every place to the right of the rounding place.
  assess: Round 296,513 to the nearest thousand and to the nearest ten thousand. Round 9,962 to the nearest
    hundred.
  sources:
    ccss:
    - 4.NBT.A.3
    lc:
    - 8f3e372f
  strand: N1
- id: rounding.decimal.any-place
  concept: rounding
  facet: decimal
  level: 3
  type: procedure
  name: Round a decimal to any place
  statement: To round a decimal to a given place, keep the digits to the left of that place, add one unit
    of that place if the digit to its right is 5 or more, and drop every digit to its right after the
    decimal point.
  procedure:
  - Find the digit in the rounding place.
  - Look at the digit just to its right.
  - If that digit is 5 or more, add one unit of the rounding place, regrouping if the digit was 9.
  - Drop the digits to the right of the rounding place that are after the decimal point, and write 0 in
    any to its right that are before it.
  assess: Round 2.968 to the nearest tenth and to the nearest hundredth. Round 14.7 to the nearest whole
    number.
  sources:
    ccss:
    - 5.NBT.A.4
    lc:
    - 6a3040b7
  strand: N1
