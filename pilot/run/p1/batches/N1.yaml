  strand: N1
- id: counting.skip.hundreds
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by hundreds from 0 to 1000
  statement: 'Say the multiples of one hundred in order from zero: one hundred, two hundred, ..., nine
