- id: place-value.two-digit.tens-ones
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: The two digits of a two-digit number are tens and ones
  statement: In a two-digit numeral, the left digit counts tens and the right digit counts ones, so the
    number is that many tens plus that many ones (47 is 4 tens and 7 ones, 40 + 7).
