    - 1d1c64d6
  strand: N1
- id: place-value.ten-more-less
  concept: place-value
  facet: whole-number
  level: 3
  type: procedure
  name: Find 10 more or 10 less than a number mentally
  statement: Adding or subtracting 10 changes the tens by one and leaves the ones unchanged; when the
    tens digit is 9 (adding) or 0 (subtracting), the hundreds change by one as well (196 + 10 = 206, 305
    - 10 = 295).
  procedure:
  - Keep the ones digit.
  - Add one ten or take away one ten from the tens.
  - If the tens become ten tens, write them as one more hundred and 0 tens; if there are no tens to take,
    take one hundred as ten tens first.
  assess: 'Without counting by ones or writing anything, say: 10 more than 46; 10 less than 305.'
  sources:
    ccss:
    - 1.NBT.C.5
    - 2.NBT.B.8
    lc:
    - 2626d399
    - 00c5755b
    - 0dccf8c6
    - f7a052d7
  strand: N1
- id: place-value.ten-more-less.explain
  concept: place-value
  facet: whole-number
  level: 2
  type: justification
  name: Explain 10 more or 10 less with a model
  statement: Finding 10 more or 10 less adds or removes one ten-rod (or moves one row on a hundred chart),
    so the tens change by one and the ones do not.
  assess: Use base-ten blocks or a hundred chart to show why 10 more than 34 is 44.
  sources:
    ccss:
    - 1.NBT.C.5
    lc:
    - a58c4ac4
  strand: N1
- id: place-value.hundred-more-less
  concept: place-value
  facet: whole-number
  level: 3
  type: procedure
  name: Find 100 more or 100 less than a number mentally
  statement: Adding or subtracting 100 to a number from 100 to 900 changes the hundreds by one and leaves
    the tens and ones unchanged.
  procedure:
  - Keep the tens and ones digits.
  - Add one hundred or take away one hundred from the hundreds.
  assess: 'Without counting or writing anything, say: 100 more than 472; 100 less than 608.'
