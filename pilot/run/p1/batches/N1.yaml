- id: place-value.ten-times-right.decimal
  concept: place-value
  facet: decimal
  level: 3
  type: concept
  name: Each place, including decimal places, is ten times the place to its right
  statement: In a multi-digit number with decimal places, a digit in any place represents ten times what
    the same digit represents in the place to its right, including across the decimal point (ones to tenths,
    tenths to hundredths).
  assess: In 3.33, the 3 in the tenths place is how many times the value of the 3 in the hundredths place?
  sources:
    ccss:
    - 5.NBT.A.1
    lc:
    - ba0b5da7
  strand: N1
- id: place-value.tenth-of-left
  concept: place-value
  facet: decimal
  level: 3
  type: concept
  name: Each place is one tenth of the place to its left
  statement: In a multi-digit number, including one with decimal places, a digit in one place represents
    1/10 of what the same digit represents in the place to its left.
  assess: In 4.44, the value of the 4 in the hundredths place is what fraction of the value of the 4 in
    the tenths place?
  sources:
    ccss:
    - 5.NBT.A.1
    lc:
    - 051034c9
  strand: N1
- id: place-value.factor-of-ten
  concept: place-value
  facet: whole-number
  level: 3
  type: procedure
  name: Use place value to multiply or divide by a factor of 10
  statement: Multiplying a whole number by 10 moves each digit one place to the left, so a x 10 is a with
    a 0 written after it; hence when b = a x 10, b divided by a = 10 and b divided by 10 = a.
  procedure:
  - For a x 10, write the digits of a followed by one 0.
  - For a quotient, find whether the dividend is the divisor with one 0 written after it, or the divisor
    is 10.
  - If the dividend is the divisor times 10, the quotient is 10; if the divisor is 10 and the dividend
    ends in 0, the quotient is the dividend with its final 0 removed (this node covers only quotients
    with no remainder).
  assess: Without long division, use place value to find 700 divided by 70.
  sources:
    ccss:
    - 4.NBT.A.1
    lc:
    - cb2cec73
  strand: N1
- id: place-value.expanded-form
  concept: place-value
  facet: whole-number
  level: 3
  type: representation
  name: Move between a whole-number numeral and its expanded form
  statement: A whole number up to 1,000,000 is the sum of the values of its digits, and expanded form
    writes that sum with one term per nonzero digit (40,603 = 40,000 + 600 + 3).
  procedure:
  - To expand, write each nonzero digit followed by as many zeros as there are places to its right, and
    join these with plus signs.
  - To write the numeral, put each term's leading digit in the place its value names, and write 0 in every
    place no term names.
  assess: Write 40,603 in expanded form. Write the numeral for 300,000 + 2,000 + 50 + 4.
  sources:
    ccss:
    - 2.NBT.A.3
    - 4.NBT.A.2
    lc:
    - 10148e7b
    - 66dbae34
    - d5c3d2f5
    - 0bfafde1
  strand: N1
- id: place-value.expanded-form.decimal
  concept: place-value
  facet: decimal
  level: 3
  type: representation
  name: Move between a decimal numeral and its expanded form
  statement: A decimal to thousandths is the sum of its digits times their place values, including 1/10,
    1/100, and 1/1000 (347.392 = 3 x 100 + 4 x 10 + 7 x 1 + 3 x (1/10) + 9 x (1/100) + 2 x (1/1000)).
  procedure:
  - To expand, write each nonzero digit times the value of its place, and join these with plus signs.
  - To write the numeral, put each digit in the place its multiplier names, and write 0 in every place
    between the leftmost and rightmost named places that no term names.
  assess: Write 52.406 in expanded form using fractions for the decimal places. Write the decimal for
    6 x 10 + 3 x (1/10) + 8 x (1/1000).
  sources:
    ccss:
    - 5.NBT.A.3.a
    lc:
    - 364bf4c1
    - 8c0e0d39
    - a96daa57
    - a8282e62
  strand: N1
- id: decimal.name.read
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: representation
  name: Read a decimal to thousandths as a number name
  statement: Name a decimal to thousandths by naming the whole-number part, saying and, then naming the
    digits after the decimal point as one whole number followed by the name of the last place (42.07 is
    forty-two and seven hundredths).
  procedure:
  - Name the whole-number part, if it is not 0, and say and.
  - Read the digits after the decimal point as a whole number.
  - Say the name of the place of the last digit: tenths, hundredths, or thousandths.
  assess: 'Write these decimals in words: 5.408 and 0.06.'
  sources:
    ccss:
    - 5.NBT.A.3.a
    lc:
    - 2f4e3bac
    - b6add9b5
  strand: N1
- id: decimal.name.write
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: representation
  name: Write a decimal to thousandths from its number name
  statement: Write the decimal for a number name to thousandths, placing the digits after the decimal
    point so that the last one falls in the named place, with zeros filling any places before it (forty-two
    and seven thousandths is 42.007).
  procedure:
  - Write the numeral for the whole-number part, or 0 if there is none, then a decimal point.
  - Write the number said after and, with leading zeros so that it uses one digit for tenths, two for
    hundredths, or three for thousandths.
  assess: Write the decimal for six and fifty-four thousandths.
  sources:
    ccss:
    - 5.NBT.A.3.a
    lc:
    - 2f4e3bac
    - b6add9b5
  strand: N1
- id: comparing.whole-numbers.numerals-within-10
  concept: comparing
  facet: whole-number
  level: 2
  type: procedure
  name: Compare two numerals from 1 to 10
  statement: Of two written numerals from 1 to 10, the one that comes later in the counting sequence names
    the greater number.
  assess: 'Shown only the written numerals 9 and 6, with no objects: which number is greater?'
  sources:
    ccss:
    - K.CC.C.7
    lc:
    - 96c682e0
  strand: N1
- id: comparing.whole-numbers.magnitude
  concept: comparing
  facet: whole-number
  level: 3
  type: procedure
  name: Decide which of two whole numbers is greater by place value
  statement: Of two whole numbers written without leading zeros, the one with more digits is greater;
    if they have the same number of digits, the greater is the one with the greater digit in the leftmost
    place where their digits differ.
  procedure:
  - If one numeral has more digits, it names the greater number.
  - Otherwise, compare the digits place by place from the left.
  - At the first place where the digits differ, the number with the greater digit is greater; if no place
    differs, the numbers are equal.
  assess: Which is greater, 49,812 or 51,099? Which is greater, 706 or 760? Say which digits decide it.
  sources:
    ccss:
    - 1.NBT.B.3
    - 2.NBT.A.4
    - 4.NBT.A.2
    lc:
    - b2b4888f
    - 24cff8cf
    - 8b7a4579
    - eca9bcd8
    - fd3f3ed6
    - 0f972f57
  strand: N1
