- id: place-value.ten-times-right
  concept: place-value
  facet: whole-number
  level: 3
  type: concept
  name: Each whole-number place is ten times the place to its right
  statement: In a multi-digit whole number, a digit in one place represents ten times what the same digit
    represents in the place to its right.
  assess: In 5,550, the 5 in the hundreds place is how many times the value of the 5 in the tens place?
