- id: numeral.read.to-1000
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Read numerals up to 1000
  statement: 'Give the number name, spoken or written in words, for a numeral up to 1000: name the hundreds,
    then the tens-and-ones name, saying nothing for a place whose digit is 0.'
  procedure:
  - If there are three digits, say the first digit followed by hundred.
  - Say the name of the two-digit number formed by the last two digits, or of the last digit if the tens
    digit is 0, or nothing if both are 0.
  assess: 'Read these numerals aloud: 406, 117, 860.'
  sources:
    ccss:
    - 1.NBT.A.1
    - 2.NBT.A.3
    lc:
    - 5a704f63
    - be537a94
  strand: N1
- id: numeral.write.to-1000
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Write numerals up to 1000 from number names
  statement: Write the numeral for a number name up to 1000 using one digit for each place, with 0 in
    any place that has no units (four hundred six is 406, not 4006).
  procedure:
  - Write the number of hundreds as the first digit, if there are hundreds.
  - Write the number of tens next, writing 0 if there are hundreds but no tens.
  - Write the number of ones last, writing 0 if there are none.
  assess: 'Write the numeral for each number: four hundred six; one hundred twelve; seven hundred.'
  sources:
    ccss:
    - 1.NBT.A.1
    - 2.NBT.A.3
    lc:
    - 8c23a3f0
    - be537a94
  strand: N1
- id: numeral.record-collection
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Write the numeral for a collection of up to 120 objects
  statement: Find how many objects are in a collection of up to 120 and record that number with a written
    numeral.
  assess: Here is a pile of 73 loose counters. Write the number that tells how many counters there are.
  sources:
    ccss:
    - 1.NBT.A.1
    lc:
    - aa4cdcda
  strand: N1
- id: numeral.read.periods
  concept: numeral
  facet: core
  level: 3
  type: representation
  name: Read multi-digit numerals up to 1,000,000
  statement: Give the number name for a whole number up to 1,000,000 by splitting its digits into periods
    of three from the right and naming each period's value followed by the period name (304,050 is three
    hundred four thousand fifty).
  procedure:
  - Split the digits into groups of three from the right.
  - Read the leftmost group as a number up to 999 and say thousand (or million for 1,000,000).
  - Read the last group as a number up to 999, saying nothing if it is 000.
  assess: 'Write these numbers in words: 304,050 and 90,009.'
  sources:
    ccss:
    - 4.NBT.A.2
    lc:
    - 8b6dc1d3
  strand: N1
- id: numeral.write.periods
  concept: numeral
  facet: core
  level: 3
  type: representation
  name: Write multi-digit numerals up to 1,000,000 from number names
  statement: Write the numeral for a number name up to 1,000,000, writing the thousands part and then
    exactly three digits for the part after the word thousand, filling empty places with 0 (forty thousand
    six is 40,006).
  procedure:
  - Write the numeral for the number said before the word thousand.
  - Write the numeral for the number said after thousand as exactly three digits, using leading zeros
    if needed.
  - Join the two parts, separated by a comma.
  assess: Write the numeral for two hundred eight thousand forty.
  sources:
    ccss:
    - 4.NBT.A.2
    lc:
    - 8b6dc1d3
  strand: N1
- id: place-value.teen.ten-and-ones
  concept: place-value
  facet: whole-number
  level: 1
  type: concept
  name: Teen numbers are ten ones and some more ones
  statement: 'Each number from 11 to 19 is made of ten ones and some further ones, from one to nine: sixteen
    is ten and six.'
  assess: Sixteen is ten and how many more? Answer without counting.
  sources:
    ccss:
    - K.NBT.A.1
    lc:
    - 901c35e9
  strand: N1
- id: place-value.teen.compose
  concept: place-value
  facet: whole-number
  level: 1
  type: procedure
  name: Make a teen number from ten ones and some ones
  statement: Build a given number from 11 to 19 with objects or a drawing as one group of ten ones and
    the needed further ones.
  procedure:
  - Make a group of exactly ten ones, for example a full ten-frame.
  - Add further ones, one at a time, while counting on from ten until the given number is reached.
  - Show the ten and the further ones as separate parts, in objects or in a drawing.
  assess: Use a ten-frame and counters to make 14 as a full ten and some extra ones.
  sources:
    ccss:
    - K.NBT.A.1
    lc:
    - ec5ef28f
    - 0a7a9ee1
  strand: N1
- id: place-value.teen.decompose
  concept: place-value
  facet: whole-number
  level: 1
  type: procedure
  name: Split a teen number of objects into ten ones and some ones
  statement: Separate a collection of 11 to 19 objects, or a drawing of one, into a group of ten ones
    and the remaining ones, and say how many ones remain.
  procedure:
  - Count out ten of the objects and set them together as one group.
  - Count the objects that are left.
  - Say the number as ten and that many ones.
  assess: Here are 17 loose counters. Put ten of them in a ten-frame. How many counters are outside the
    ten-frame?
  sources:
    ccss:
    - K.NBT.A.1
    lc:
    - d2918c03
    - cd964993
  strand: N1
