- id: place-value.three-digit.hundreds-tens-ones
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: The three digits of a three-digit number are hundreds, tens, and ones
  statement: In a three-digit numeral, the digits from left to right count hundreds, tens, and ones, so
    the number is that many hundreds plus tens plus ones (706 is 7 hundreds, 0 tens, and 6 ones).
  assess: What is the value of each digit in 706? Show 706 with base-ten blocks.
