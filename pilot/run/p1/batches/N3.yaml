- id: operations.application.reasonableness
  concept: operations
  facet: whole-number
  level: 2
  type: justification
  name: Judge whether the answer to a two-step word problem is reasonable by estimating
  statement: An answer to a two-step whole-number word problem, each step an addition or subtraction within
    1000 or a multiplication or division within 100, is judged reasonable or not by estimating the answer
    with rounded numbers or mental computation and comparing.
  assess: Ana had 412 beads. She used 189 of them, then bought 6 packs of 8 beads. She says she now has 371
