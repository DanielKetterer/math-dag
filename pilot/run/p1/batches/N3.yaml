- id: factors.prime-composite.decide
  concept: factors
  facet: core
  level: 3
  type: procedure
  name: Decide whether a whole number within 100 is prime or composite
  statement: A whole number from 2 to 100 is composite if it is a multiple of some number from 2 to 9
    other than itself, and prime otherwise, because any factor pair of a number up to 100 contains a factor
    no greater than 10.
  procedure:
  - Test whether the number is a multiple of 2, 3, 5 or 7, the primes less than 10.
  - If it is a multiple of one of them and is not that prime itself, it is composite.
  - If it is a multiple of none of them, it is prime.
  assess: Decide whether 91 is prime or composite, and whether 89 is prime or composite.
  sources:
    ccss:
    - 4.OA.B.4
    lc:
    - f548ce1a
  strand: N3
- id: patterns.rule.generate-number
  concept: patterns
  facet: rule
  level: 2
  type: procedure
  name: Generate a number pattern from a given rule
  statement: Given a starting number and a rule such as "add 3" or "multiply by 2", produce the terms
    of the sequence by applying the rule to each term to get the next.
  procedure:
  - Write the starting number as the first term.
  - Apply the rule to the last term written to get the next term.
  - Repeat until the asked-for number of terms is written.
  assess: Start at 4 and use the rule "add 5". Write the first six terms.
