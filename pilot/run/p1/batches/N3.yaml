- id: multiplication.comparison.application.divide
  concept: multiplication
  facet: comparison
  level: 2
  type: application
  name: Solve multiplicative comparison word problems by dividing
  statement: A story gives the larger quantity in a multiplicative comparison and either the multiplier
    or the smaller quantity, and asks for the other; the learner finds it by division, using a drawing
    or an equation.
  assess: A red hat costs $18 and a blue hat costs $6. How many times as much does the red hat cost as
    the blue hat?
