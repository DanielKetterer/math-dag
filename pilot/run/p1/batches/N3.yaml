    lc:
    - 195e87be
  strand: N3
- id: patterns.addition-table.identify
  concept: patterns
  facet: table
  level: 2
  type: concept
  name: Identify a pattern in the addition table
  statement: The entries of the addition table follow regular patterns, such as each entry being one more
    than the entry to its left, and equal sums lying along diagonals.
  assess: Look at this addition table for 0 to 9. Describe one pattern you see along a row and one along
    a diagonal.
  sources:
    ccss:
    - 3.OA.D.9
    lc:
    - d340a239
    - 11d23252
  strand: N3
- id: patterns.multiplication-table.identify
  concept: patterns
  facet: table
  level: 2
  type: concept
  name: Identify a pattern in the multiplication table
  statement: The entries of the multiplication table follow regular patterns, such as each row increasing
    by the same amount, the table being symmetric across its diagonal, and every entry in the 4s row being
    even.
  assess: Look at this multiplication table for 1 to 10. Describe one pattern in the row for 4 and one
    pattern that compares the row for 3 with the column for 3.
  sources:
    ccss:
    - 3.OA.D.9
    lc:
    - a0846564
    - 11d23252
  strand: N3
- id: patterns.arithmetic.explain
  concept: patterns
  facet: table
  level: 4
  type: justification
  name: Explain an arithmetic pattern using properties of operations
  statement: An arithmetic pattern is explained in general by showing that it follows from a property
    of operations, such as 4 x n = 2 x n + 2 x n being a sum of two equal addends and so even.
  assess: Explain why 4 times any whole number is even.
  sources:
    ccss:
    - 3.OA.D.9
    lc:
    - 686b69e4
  strand: N3
- id: factors.factor-pair.meaning
  concept: factors
  facet: core
  level: 3
  type: concept
  name: A factor pair of a whole number
  statement: A factor pair of a whole number n is two whole numbers whose product is n; each is a factor
    of n.
  assess: Is 4 and 9 a factor pair of 36? Is 5 and 7 a factor pair of 36? Explain.
  sources:
    ccss:
    - 4.OA.B.4
    lc:
    - 8970cb2b
  strand: N3
- id: factors.factor-pairs.find-all
  concept: factors
  facet: core
  level: 3
  type: procedure
  name: Find all factor pairs of a whole number within 100
  statement: List every factor pair of a whole number n from 1 to 100 by testing each whole number d from
    1 upward as a factor, stopping once d x d is greater than n, because in every pair the smaller factor
    d has d x d no greater than n.
  procedure:
  - Start with 1 x n.
  - For each next whole number d, decide whether n divided by d is a whole number; if it is, record d
    x (n divided by d).
  - Stop as soon as d x d is greater than n; any further pair would repeat one already recorded.
  assess: Find all the factor pairs of 48.
  sources:
    ccss:
    - 4.OA.B.4
    lc:
    - 8970cb2b
  strand: N3
- id: factors.multiple-of-each-factor
  concept: factors
  facet: core
  level: 3
  type: concept
  name: A whole number is a multiple of each of its factors
  statement: 'If d is a factor of n, then n is a multiple of d: n = d x k for a whole number k, so n is
    in the list d, 2 x d, 3 x d, ...'
  assess: 6 is a factor of 42. Is 42 a multiple of 6? Explain using the factor pair.
  sources:
    ccss:
    - 4.OA.B.4
    lc:
    - a19972ce
  strand: N3
- id: factors.is-multiple.decide
  concept: factors
  facet: core
  level: 3
  type: procedure
  name: Decide whether a whole number within 100 is a multiple of a one-digit number
  statement: A whole number n from 1 to 100 is a multiple of a one-digit number d exactly when d x k =
    n for some whole number k, which is checked by skip-counting by d or by dividing n by d and looking
    for a remainder of 0.
  procedure:
  - Divide n by d, or skip-count by d up to n.
  - If the division has remainder 0, or the skip-count lands on n, then n is a multiple of d.
  - Otherwise n is not a multiple of d.
  assess: Is 91 a multiple of 7? Is 58 a multiple of 6?
  sources:
    ccss:
    - 4.OA.B.4
    lc:
    - 6c81abb2
  strand: N3
- id: factors.prime-composite.meaning
  concept: factors
  facet: core
  level: 3
  type: concept
  name: Prime and composite numbers
  statement: A whole number greater than 1 is prime if its only factors are 1 and itself, and composite
    if it has a factor other than 1 and itself; 1 is neither prime nor composite.
  assess: 13 has the factor pairs 1 x 13 only. 15 has the factor pairs 1 x 15 and 3 x 5. Which is prime
    and which is composite? Is 1 prime?
  sources:
