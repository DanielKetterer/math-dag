- id: parity.even-odd.pairing
  concept: parity
  facet: pairing
  level: 1
  type: concept
  name: Even and odd as pairing with none or one left over
  statement: A collection has an even number of objects when its objects can be put into pairs with none
    left over, and an odd number when one object is left over.
  assess: Here are 13 counters. Put them in pairs. Is 13 even or odd? How do you know?
  sources:
    ccss:
    - 2.OA.C.3
    lc:
    - 80e6e23a
    - 85cc2d51
  strand: N3
- id: parity.even-odd.skip-count
  concept: parity
  facet: pairing
  level: 1
  type: procedure
  name: Decide even or odd by counting a collection by 2s
  statement: Count a collection of up to 20 objects by moving them two at a time while saying 2, 4, 6,
    ...; the number is even if the count ends with no object left, and odd if one object is left.
  procedure:
  - Move two objects aside and say 2.
  - Keep moving two objects at a time, saying the next number in the count by 2s.
  - If no object is left, the number is even; if one object is left, it is odd.
  assess: Count these 14 counters by 2s, moving two at a time. Is 14 even or odd?
  sources:
    ccss:
    - 2.OA.C.3
    lc:
    - 4d79797d
  strand: N3
- id: parity.even.equal-addends
  concept: parity
  facet: equal-addends
  level: 2
  type: representation
  name: Write an even number as a sum of two equal addends
  statement: An even number n can be written as an equation n = a + a, the sum of two equal whole numbers.
  assess: Write 18 as the sum of two equal numbers.
  sources:
    ccss:
    - 2.OA.C.3
    lc:
    - 2a88d495
  strand: N3
- id: multiplication.array.rows-columns
  concept: multiplication
  facet: array-area
  level: 1
  type: concept
  name: An array as rows of equal columns
  statement: A rectangular array is an arrangement of objects in rows and columns in which every row has
    the same number of objects and every column has the same number of objects.
  assess: Here are three arrangements of dots. Which one is an array? For the array, how many rows are
    there and how many dots are in each row?
  sources:
    ccss:
    - 2.OA.C.4
    lc: []
  strand: N3
- id: multiplication.array.total-by-adding
  concept: multiplication
  facet: array-area
  level: 2
  type: procedure
  name: Find the total of an array by adding its rows
  statement: The total number of objects in a rectangular array with up to 5 rows and 5 columns is found
    by adding the number in one row once for each row.
  procedure:
  - Count the objects in one row.
  - Count the rows.
  - Add the row amount once for each row; the sum is the total.
  assess: This array has 4 rows of 5 dots. Find the total by adding the rows, not by counting the dots
    one by one.
  sources:
    ccss:
    - 2.OA.C.4
    lc:
    - 4de8aad6
  strand: N3
- id: multiplication.array.equal-addends-equation
  concept: multiplication
  facet: array-area
  level: 2
  type: representation
  name: Write an array total as a sum of equal addends
  statement: The total of a rectangular array is recorded as an equation with one equal addend for each
    row, such as 5 + 5 + 5 + 5 = 20 for 4 rows of 5.
  assess: This array has 3 rows of 4 stars and 12 stars in all. Write an addition equation with one addend
    for each row.
  sources:
    ccss:
    - 2.OA.C.4
    lc:
    - abdeadbc
  strand: N3
- id: multiplication.application.equal-groups
  concept: multiplication
  facet: equal-groups
  level: 2
  type: application
  name: Solve one-step multiplication word problems within 100
  statement: A story gives a number of equal groups (objects in bags, rows of an array, or equal measures)
    and the size of each, with a total within 100; the learner finds the total, using a drawing or an
