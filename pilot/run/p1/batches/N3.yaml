- id: division.unknown-factor.equation-from-story
  concept: division
  facet: unknown-factor
  level: 2
  type: representation
  name: Write a division word problem as a multiplication equation with an unknown factor
  statement: A sharing or grouping word problem is represented by a multiplication equation in which a
    symbol stands for the unknown factor, such as 4 x ? = 28 for 28 children seated 4 to a table.
  assess: 28 children sit at tables with 4 children at each table. Write a multiplication equation with
    a box for the number of tables. Do not solve it.
  sources:
    ccss:
    - 3.OA.A.3
    lc:
    - 8f411df0
    - 94a5a051
  strand: N3
- id: multiplication.unknown-factor.solve
  concept: multiplication
  facet: equal-groups
  level: 3
  type: procedure
  name: Find the unknown factor in a multiplication equation
  statement: In an equation a x ? = c or ? x b = c with whole numbers, factors through 10 and c within
    100, the unknown is the whole number whose product with the known factor is c.
  procedure:
  - Identify the known factor and the product.
  - Find the number whose product with the known factor is the product, by recalling the multiplication
    fact or by dividing the product by the known factor.
  - Check by multiplying the number found by the known factor.
  assess: 'Find the number that makes each equation true: 8 x ? = 48, and ? x 6 = 54.'
  sources:
    ccss:
    - 3.OA.A.4
    lc:
    - 26f02245
    - 007dac47
  strand: N3
- id: division.unknown-dividend-divisor.solve
  concept: division
  facet: unknown-factor
  level: 3
  type: procedure
  name: Find an unknown dividend or divisor in a division equation
  statement: In a division equation c divided by a = b with whole numbers and a nonzero quotient, an unknown
    dividend is the product a x b, and an unknown divisor is the unknown factor in ? x b = c.
  procedure:
  - Rewrite the division equation c divided by a = b as the multiplication equation a x b = c, keeping
    the symbol for the unknown.
  - If the dividend c is unknown, multiply a x b.
  - If the divisor a is unknown, find the number that times b gives c.
  - Check by putting the number found into the division equation.
  assess: 'Find the number that makes each equation true: ? divided by 3 = 5, and 48 divided by ? = 6.'
  sources:
    ccss:
    - 3.OA.A.4
    lc:
    - 26cdecbb
    - 32c5d5d7
  strand: N3
- id: multiplication.commutative
  concept: multiplication
  facet: array-area
  level: 3
  type: concept
  name: The commutative property of multiplication
  statement: For any numbers a and b, a x b = b x a.
  assess: Without computing either side, is 7 x 9 = 9 x 7 true? Which property tells you?
  sources:
    ccss:
    - 3.OA.B.5
    lc:
    - a285646c
  strand: N3
- id: multiplication.commutative.strategy
  concept: multiplication
  facet: array-area
  level: 3
  type: procedure
  name: Use the commutative property to find a product
  statement: Find a product a x b by switching the order of the factors to b x a when that product is
    known or easier to find.
  procedure:
  - Switch the order of the two factors.
  - Find the product with the factors switched, from a known fact or an easier count.
  - Give that product as the answer to the original problem.
  assess: You know 3 x 9 = 27. Use the commutative property to find 9 x 3, and say how you used it.
  sources:
    ccss:
    - 3.OA.B.5
    lc:
    - a285646c
  strand: N3
- id: multiplication.associative
  concept: multiplication
  facet: core
  level: 3
  type: concept
  name: The associative property of multiplication
  statement: 'For any numbers a, b and c, (a x b) x c = a x (b x c): when three numbers are multiplied,
    the product does not depend on which adjacent pair is multiplied first.'
  assess: Without computing either side, is (6 x 5) x 2 = 6 x (5 x 2) true? Which property tells you?
  sources:
    ccss:
    - 3.OA.B.5
    lc:
    - 3d90c554
  strand: N3
- id: multiplication.associative.strategy
  concept: multiplication
  facet: core
  level: 3
  type: procedure
  name: Use the associative property to find a product of three factors
  statement: Find a product of three factors by regrouping them so that an adjacent pair with a known
    or easy product, such as 10, is multiplied first.
  procedure:
  - Look for two adjacent factors whose product is known or easy.
  - Regroup with parentheses around that pair.
  - Multiply that pair, then multiply the result by the remaining factor.
  assess: Find 7 x 5 x 2 by multiplying 5 x 2 first. Show the regrouping with parentheses.
  sources:
    ccss:
    - 3.OA.B.5
    lc:
    - 3d90c554
  strand: N3
- id: multiplication.distributive
  concept: multiplication
  facet: array-area
  level: 3
  type: concept
  name: The distributive property of multiplication over addition
  statement: For any numbers a, b and c, a x (b + c) = a x b + a x c.
  assess: Without computing either side, is 6 x (5 + 3) = 6 x 5 + 6 x 3 true? Is 6 x (5 + 3) = 6 x 5 +
    3 true?
  sources:
    ccss:
    - 3.OA.B.5
    lc:
    - 270da5c5
  strand: N3
- id: multiplication.distributive.strategy
  concept: multiplication
  facet: array-area
  level: 3
  type: procedure
  name: Find a product by breaking apart a factor
  statement: Find a x b by writing b as a sum of two numbers whose products with a are known, multiplying
    a by each part, and adding the two products.
  procedure:
  - Write one factor b as a sum c + d of numbers whose products with a are known.
  - Find a x c and a x d.
  - Add the two products; the sum is a x b.
  assess: You know 8 x 5 = 40 and 8 x 2 = 16. Use the distributive property to find 8 x 7, and show the
    break-apart.
  sources:
    ccss:
    - 3.OA.B.5
    lc:
    - 270da5c5
  strand: N3
- id: division.distributive.strategy
  concept: division
  facet: partitive
  level: 3
  type: procedure
  name: Find a quotient by breaking apart the dividend
  statement: Find c divided by a by writing c as a sum of two multiples of a, dividing each part by a,
    and adding the two quotients; this works because (p + q) divided by a = (p divided by a) + (q divided
    by a).
  procedure:
  - Write the dividend as a sum of two numbers that are each a multiple of the divisor.
  - Divide each part by the divisor.
  - Add the two quotients; the sum is the quotient of the whole dividend.
  assess: Find 56 divided by 4 by splitting 56 into 40 + 16. Show each step.
  sources:
    ccss:
    - 3.OA.B.5
    lc:
    - f75f123d
  strand: N3
- id: multiplication.by-one
  concept: multiplication
  facet: core
  level: 3
  type: concept
  name: Multiplying by 1 leaves a number unchanged
  statement: For any number a, a x 1 = a and 1 x a = a.
  assess: Without computing, what is 1 x 87? What is 3/5 x 1? Say what rule you used.
  sources:
    ccss:
    - 3.OA.B.5
    lc: []
  strand: N3
- id: multiplication.by-zero
  concept: multiplication
  facet: core
  level: 3
  type: concept
  name: Multiplying by 0 gives 0
  statement: For any number a, a x 0 = 0 and 0 x a = 0.
  assess: 'Without computing, what is 0 x 9? What is 46 x 0? Explain using groups: what is 46 groups of
    0?'
  sources:
    ccss: []
    lc: []
  strand: N3
- id: division.by-zero.undefined
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: Division by zero is undefined
  statement: 'c divided by 0 has no value: for c not 0, no number times 0 gives c, and for c = 0, every
    number times 0 gives 0, so no single number is the quotient.'
  assess: Ella says 6 divided by 0 = 0. Write 6 divided by 0 = ? as a multiplication with an unknown factor
    and explain why no number works.
  sources:
    ccss: []
    lc: []
  strand: N3
