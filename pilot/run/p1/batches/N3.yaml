- id: operations.application.justify-solution
  concept: operations
  facet: whole-number
  level: 2
  type: justification
  name: Justify that a solution answers a word problem
  statement: A proposed solution to a one-step or multi-step whole-number word problem is justified by
    showing it satisfies every condition of the story, for example by working back with the inverse operation.
  assess: A farmer packs 156 eggs into cartons of 12 and says he needs 13 cartons. Show that 13 is correct
    by working back from the answer.
