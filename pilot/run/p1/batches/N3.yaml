  concept: division
  facet: measurement
  level: 2
  type: application
  name: Solve one-step grouping division word problems within 100
  statement: A story gives a total within 100 and the size of each equal group or piece (including the
    length of a row of an array, or an equal measure); the learner finds the number of groups, using a
    drawing or an equation.
  assess: Jo has 30 centimeters of ribbon and cuts it into pieces 5 centimeters long. How many pieces
