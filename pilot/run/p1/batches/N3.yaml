    - 81f35b63
  strand: N3
- id: multiplication.comparison.application.equation
  concept: multiplication
  facet: comparison
  level: 2
  type: representation
  name: Write an equation with a symbol for the unknown for a multiplicative comparison word problem
  statement: A multiplicative comparison word problem is written as an equation c = a x b in which a symbol
    stands for whichever of the larger quantity, the multiplier, or the smaller quantity is unknown.
  assess: A tree is 35 feet tall. It is 5 times as tall as a bush. Write an equation with a symbol for
