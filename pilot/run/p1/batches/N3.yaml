  strand: N3
- id: multiplication.comparison
  concept: multiplication
  facet: comparison
  level: 2
  type: concept
  name: A multiplication equation as a comparison
  statement: 'An equation c = a x b can be read as a comparison: c is a times as many as b.'
  assess: 'Finish the sentence for 35 = 5 x 7: 35 is ___ times as many as 7.'
  sources:
    ccss:
    - 4.OA.A.1
    lc:
    - 3ab3ded7
  strand: N3
- id: multiplication.comparison.statement-to-equation
  concept: multiplication
  facet: comparison
  level: 2
  type: representation
  name: Write a multiplicative comparison statement as a multiplication equation
  statement: A verbal statement that one quantity is a times as many as another quantity b is written
    as the equation c = a x b, where c is the first quantity.
  assess: 'Write an equation for: 24 is 3 times as many as 8.'
  sources:
    ccss:
    - 4.OA.A.1
    lc:
