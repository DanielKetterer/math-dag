  strand: N3
- id: multiplication.comparison.vs-additive
  concept: multiplication
  facet: comparison
  level: 2
  type: concept
  name: Tell multiplicative comparison from additive comparison
  statement: '"a times as many as b" means a x b, while "a more than b" means b + a; the two describe
    different relationships between quantities.'
  assess: Tom has 4 marbles. Sue has 3 times as many. Ray has 3 more than Tom. Draw a bar for each person,
    then say how many marbles Sue has and how many Ray has.
