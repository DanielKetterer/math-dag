- id: addition.add-to.fingers
  concept: addition
  facet: add-to
  level: 1
  type: procedure
  name: Add within 10 on fingers
  statement: "Show each addend as a set of raised fingers and find the total of all the raised fingers; the total is the sum."
  procedure:
    - "Raise fingers for the first number."
    - "Raise more fingers for the second number."
    - "Find how many fingers are raised in all, by counting or by recognizing the finger pattern."
  assess: "Use your fingers to find 4 + 3."
  sources: {ccss: ["K.OA.A.1"], lc: ["98ade912"]}
  strand: N2
- id: addition.add-to.events
  concept: addition
  facet: add-to
  level: 1
  type: procedure
  name: Join two runs of sounds or actions
  statement: "The total of two runs of sounds or actions is found by keeping the count of the first run and continuing it through the second, since the first run is gone when the second is heard."
  procedure:
    - "Count the first run of sounds as it happens and keep the last number."
    - "Continue the count from that number through the second run."
    - "The last number said is the total."
  assess: "Listen: I clap 3 times, then 2 more times. How many claps were there in all?"
  sources: {ccss: ["K.OA.A.1"], lc: ["9dd0efd5"]}
  strand: N2
- id: addition.add-to.describe
  concept: addition
  facet: add-to
  level: 1
  type: representation
  name: Tell a joining action in words with numbers
  statement: "A joining action is described in words by naming how many there were at the start, how many joined, and how many there are now."
  assess: "Watch: 3 toy cars are parked, then 2 more drive in. Tell what happened, using numbers."
  sources: {ccss: ["K.OA.A.1"], lc: ["07728089"]}
  strand: N2
- id: addition.notation.expression
  concept: addition
  facet: operation
  level: 2
  type: representation
  name: Write an addition expression for a joining situation
  statement: "The expression a + b stands for the amount made when an amount b is joined to an amount a."
  assess: "Write an expression, with no equal sign, for: 4 ducks are in a pond and 2 more ducks come."
  sources: {ccss: ["K.OA.A.1"], lc: ["39fb55f6"]}
  strand: N2
- id: addition.notation.equation
  concept: addition
  facet: operation
  level: 2
  type: representation
  name: Write an addition equation for a joining situation
  statement: "The equation a + b = c records that joining an amount b to an amount a makes the amount c."
  assess: "Write an equation for: 4 ducks were in a pond, 2 more came, and now there are 6 ducks."
  sources: {ccss: ["K.OA.A.1"], lc: ["2ad5b1aa"]}
  strand: N2
- id: subtraction.take-away.fingers
  concept: subtraction
  facet: take-away
  level: 1
  type: procedure
  name: Subtract within 10 on fingers
  statement: "Raise fingers for the starting amount, lower fingers for the amount taken away; the fingers still raised are the difference."
  procedure:
    - "Raise fingers for the starting number."
    - "Lower fingers for the number taken away."
    - "Find how many fingers are still raised, by counting or by recognizing the finger pattern."
  assess: "Hold up 8 fingers. Put down 3 of them. How many are still up?"
  sources: {ccss: ["K.OA.A.1"], lc: ["a37824b0"]}
  strand: N2
- id: subtraction.take-away.describe
  concept: subtraction
  facet: take-away
  level: 1
  type: representation
  name: Tell a taking-away action in words with numbers
  statement: "A taking-away action is described in words by naming how many there were at the start, how many were taken away, and how many are left."
  assess: "Watch: 6 toy birds are on a branch, then 2 fly away. Tell what happened, using numbers."
  sources: {ccss: ["K.OA.A.1"], lc: ["62e19879"]}
  strand: N2
- id: subtraction.notation.expression
  concept: subtraction
  facet: operation
  level: 2
  type: representation
  name: Write a subtraction expression for a taking-away situation
  statement: "The expression a - b stands for the amount left when an amount b is taken away from an amount a."
  assess: "Write an expression, with no equal sign, for: 7 apples are on a plate and 3 are eaten."
  sources: {ccss: ["K.OA.A.1"], lc: ["895a2332"]}
  strand: N2
- id: subtraction.notation.equation
  concept: subtraction
  facet: operation
  level: 2
  type: representation
  name: Write a subtraction equation for a taking-away situation
  statement: "The equation a - b = c records that taking an amount b away from an amount a leaves the amount c."
  assess: "Write an equation for: 7 apples were on a plate, 3 were eaten, and 4 are left."
  sources: {ccss: ["K.OA.A.1"], lc: ["3ecee76a"]}
  strand: N2
- id: addition.application.put-together.total-unknown
  concept: addition
  facet: put-together
  level: 1
  type: application
  name: Solve put-together story problems with the total unknown
  statement: "A story gives two parts that are together at once, with no joining action, and asks for the total; the learner finds it with objects or a drawing."
  assess: "There are 3 red apples and 4 green apples in a bowl. How many apples are in the bowl? Use counters or a drawing."
  sources: {ccss: ["K.OA.A.2", "1.OA.A.1"], lc: ["f22b9881", "eb90163e", "fe904c98"]}
  strand: N2
- id: number-composition.within-10.decompose
  concept: number-composition
  facet: part-whole
  level: 1
  type: procedure
  name: Break a number up to 10 into two parts in more than one way
  statement: "A number from 2 to 10 can be split into two parts in several different ways; each split is found by separating a set of that many objects into two groups, and is recorded by a drawing."
  procedure:
    - "Make a set of the given number of objects."
    - "Separate the set into two groups and draw the two groups."
    - "Put the set back together and separate it a different way."
  assess: "Use 7 cubes. Break them into two groups in three different ways, and draw each way."
  sources: {ccss: ["K.OA.A.3"], lc: ["272d9661", "748cd81c", "01b92a76", "764695a4"]}
  strand: N2
- id: number-composition.within-10.equation
  concept: number-composition
  facet: part-whole
  level: 2
  type: representation
  name: Record a split of a number up to 10 as an equation
  statement: "A split of a whole w into parts a and b is recorded by the equation w = a + b, or a + b = w."
  assess: "Lia broke 8 cubes into a group of 5 and a group of 3. Write an equation that shows this."
  sources: {ccss: ["K.OA.A.3", "K.OA.A.4"], lc: ["5d4318eb", "c7bb0820", "3ad73d18"]}
  strand: N2
- id: number-composition.make-ten.find
  concept: number-composition
  facet: part-whole
  level: 1
  type: procedure
  name: Find the number that makes 10 with a given number
  statement: "For a number n from 1 to 9, the partner that makes 10 is the number of objects that must be added to n objects to have 10, shown for example by the empty spaces of a ten frame."
  procedure:
    - "Show n objects, for example in a ten frame."
    - "Add objects one at a time, or look at the empty spaces, until there are 10."
    - "The number of objects added is the partner of n."
  assess: "This ten frame has 6 dots. How many more dots are needed to make 10?"
  sources: {ccss: ["K.OA.A.4"], lc: ["af9a99a3", "e3d2b02c", "d20e2e5e"]}
  strand: N2
- id: addition.within-10.fluency
  concept: addition
  facet: operation
  level: 3
  type: fact
  name: Add within 10 fluently
  statement: "Give any sum of two whole numbers with a total of 10 or less quickly and accurately, without counting."
  assess: "Answer each within about 3 seconds, without counting or computing aloud: 4 + 3, 2 + 6, 5 + 5, 0 + 7, 3 + 2."
  sources: {ccss: ["K.OA.A.5", "1.OA.C.6"], lc: ["a00966f2", "ed56ad51"]}
  strand: N2
- id: subtraction.within-10.fluency
  concept: subtraction
  facet: operation
  level: 3
  type: fact
  name: Subtract within 10 fluently
  statement: "Give any difference a - b with a at most 10 and b at most a quickly and accurately, without counting."
  assess: "Answer each within about 3 seconds, without counting or computing aloud: 9 - 4, 7 - 7, 10 - 3, 6 - 2, 5 - 1."
  sources: {ccss: ["K.OA.A.5", "1.OA.C.6"], lc: ["c7ac60b3", "7d8ac59e"]}
  strand: N2
- id: addition.count-on
  concept: addition
  facet: add-to
  level: 2
  type: procedure
  name: Add by counting on
  statement: "To find a + b, start from the number a without recounting it and say the next b number words, keeping track of how many have been said; the last word said is a + b."
  procedure:
    - "Say the first addend a."
    - "Say the next number word and track it as 1 counted on; continue, tracking 2, 3, and so on."
    - "Stop when b words have been counted on; the last word said is the sum."
  assess: "Find 8 + 3 by counting on from 8. Do not count out 8 first."
  sources: {ccss: ["1.OA.C.5"], lc: ["60239d6d"]}
  strand: N2
- id: subtraction.count-back
  concept: subtraction
  facet: take-away
  level: 2
  type: procedure
  name: Subtract by counting back
  statement: "To find a - b, start from a and say the next b number words backward, keeping track of how many have been said; the last word said is a - b (the starting word a is not counted)."
  procedure:
    - "Start at the number a."
    - "Say the number one less and track it as 1 counted back; continue, tracking 2, 3, and so on."
    - "Stop when b words have been counted back; the last word said is the difference."
  assess: "Find 12 - 3 by counting back from 12."
  sources: {ccss: ["1.OA.C.5"], lc: ["1f109af5"]}
  strand: N2
- id: addition.commutative
  concept: addition
  facet: operation
  level: 3
  type: concept
  name: The order of two addends does not change the sum
  statement: "For any whole numbers a and b, a + b = b + a."
  assess: "Without adding, say whether 9 + 6 = 6 + 9 is true, and what rule tells you."
  sources: {ccss: ["1.OA.B.3"], lc: []}
  strand: N2
- id: addition.commutative.strategy
  concept: addition
  facet: operation
  level: 3
  type: procedure
  name: Switch the order of addends to make a sum easier
  statement: "Replace a + b by b + a when the second form is easier, for example to count on from the larger addend or to use a known fact."
  procedure:
    - "Look at a + b and decide whether b + a is easier (larger number first, or a known fact)."
    - "Rewrite the sum as b + a."
    - "Find b + a; it equals a + b."
  assess: "Find 2 + 9 by first switching the order of the addends. Tell what you switched it to."
  sources: {ccss: ["1.OA.B.3"], lc: ["108ea2f2"]}
  strand: N2
- id: addition.associative.strategy
  concept: addition
  facet: operation
  level: 3
  type: procedure
  name: Add three numbers by choosing which two to add first
  statement: "When adding three numbers, any adjacent two may be added first without changing the total, so add the pair that is easier (for example, a pair that makes 10) first."
  procedure:
    - "Look for two adjacent addends whose sum is easy, such as a pair that makes 10."
    - "Add that pair first."
    - "Add the third number to their sum."
  assess: "Find 3 + 8 + 2 by first adding the two numbers that make 10."
  sources: {ccss: ["1.OA.B.3"], lc: ["108ea2f2"]}
  strand: N2
- id: subtraction.unknown-addend.meaning
  concept: subtraction
  facet: unknown-addend
  level: 2
  type: concept
  name: A difference as an unknown addend
  statement: "a - b is the number that must be added to b to make a, so a - b = c exactly when b + c = a."
  assess: "Which equation has the same missing number as 12 - 5 = ?  (a) 5 + ? = 12  (b) 12 + 5 = ?  (c) ? - 5 = 12"
  sources: {ccss: ["1.OA.B.4"], lc: ["fb04b29a"]}
  strand: N2
- id: subtraction.unknown-addend.strategy
  concept: subtraction
  facet: unknown-addend
  level: 3
  type: procedure
  name: Subtract by finding the missing addend
  statement: "To find a - b, find the number c with b + c = a, using a known addition fact or by counting up from b to a; c is the difference."
  procedure:
    - "Rewrite a - b = ? as b + ? = a."
    - "Find the missing addend from a known addition fact, or count up from b to a and track how many were counted."
    - "The missing addend is a - b."
  assess: "Find 13 - 9 by thinking of 9 + ? = 13. Tell the addition fact you used."
  sources: {ccss: ["1.OA.B.4", "1.OA.C.6"], lc: ["304a8bf8", "e1cb5730"]}
  strand: N2
- id: addition.make-ten
  concept: addition
  facet: operation
  level: 2
  type: procedure
  name: Add across 10 by making a ten
  statement: "When a + b is more than 10 with a and b at most 9, split b into the part that completes a to 10 and the rest; then a + b = 10 + the rest."
  procedure:
    - "Find the partner of a that makes 10, namely 10 - a."
    - "Split b into 10 - a and the rest, b - (10 - a)."
    - "Add 10 - a to a to make 10, then add the rest: the sum is 10 + (b - (10 - a))."
  assess: "Find 8 + 6 by making a ten. Show how you split the 6."
  sources: {ccss: ["1.OA.C.6"], lc: ["690addcb"]}
  strand: N2
- id: addition.doubles.fact
  concept: addition
  facet: operation
  level: 3
  type: fact
  name: Recall the doubles to 9 + 9
  statement: "Recall each sum n + n for n from 1 to 9 without counting."
  assess: "Answer each within about 3 seconds, without counting or computing aloud: 6 + 6, 8 + 8, 7 + 7, 9 + 9."
  sources: {ccss: ["1.OA.C.6"], lc: []}
  strand: N2
- id: addition.near-doubles
  concept: addition
  facet: operation
  level: 3
  type: procedure
  name: Add by using a known double
  statement: "When two addends are close, rewrite the sum as the double of the smaller addend plus the difference between them: a + (a + d) = (a + a) + d."
  procedure:
    - "Identify the smaller addend a and how much larger the other addend is, d."
    - "Recall the double a + a."
    - "Add d to the double."
  assess: "Find 6 + 7 by using 6 + 6. Show the steps."
  sources: {ccss: ["1.OA.C.6"], lc: ["690addcb"]}
  strand: N2
- id: subtraction.decompose-to-ten
  concept: subtraction
  facet: take-away
  level: 2
  type: procedure
  name: Subtract across 10 by decomposing to ten
  statement: "When a teen number a is reduced by a one-digit number b larger than the ones of a, split b into the ones of a and the rest; subtracting the ones reaches 10, and then the rest is subtracted from 10."
  procedure:
    - "Let r be the ones in a (a = 10 + r), with b greater than r."
    - "Split b into r and b - r."
    - "Subtract r from a to reach 10, then subtract b - r from 10."
  assess: "Find 13 - 4 by first subtracting down to 10. Show how you split the 4."
  sources: {ccss: ["1.OA.C.6", "1.OA.B.3"], lc: ["e1cb5730", "4309ce5e"]}
  strand: N2
- id: addition.within-20.fluency
  concept: addition
  facet: operation
  level: 3
  type: fact
  name: Know all sums of two one-digit numbers
  statement: "Give any sum of two one-digit numbers, including those greater than 10, quickly and accurately without counting."
  assess: "Answer each within about 3 seconds, without counting or computing aloud: 8 + 5, 7 + 9, 6 + 4, 9 + 3, 7 + 6."
  sources: {ccss: ["2.OA.B.2"], lc: ["f2c9aa2c", "8cecfb5c"]}
  strand: N2
- id: subtraction.within-20.fluency
  concept: subtraction
  facet: operation
  level: 3
  type: fact
  name: Subtract within 20 fluently
  statement: "Give any difference a - b in which b and a - b are both one-digit numbers (so a is at most 18), including those that cross 10, quickly and accurately without counting."
  assess: "Answer each within about 3 seconds, without counting or computing aloud: 14 - 6, 11 - 8, 17 - 9, 12 - 5, 15 - 7."
  sources: {ccss: ["2.OA.B.2"], lc: ["7ded9ec8"]}
  strand: N2
- id: equation.equal-sign.meaning
  concept: equation
  facet: relational
  level: 2
  type: concept
  name: The equal sign means both sides have the same value
  statement: "The equal sign states that the number or expression on its left has the same value as the number or expression on its right; it does not mean 'the answer comes next'."
  assess: "Sam says 3 + 4 = 7 + 2 is true because 3 + 4 makes 7. Is Sam right? Explain what the = sign tells you."
  sources: {ccss: ["1.OA.D.7"], lc: ["93ef1daf"]}
  strand: N2
- id: equation.true-false
  concept: equation
  facet: relational
  level: 2
  type: procedure
  name: Decide whether an addition or subtraction equation is true
  statement: "An equation built from whole numbers, sums, and differences is true when the two sides have the same value and false otherwise."
  procedure:
    - "Find the value of the left side."
    - "Find the value of the right side."
    - "The equation is true if the two values are equal, and false if they are not."
  assess: "True or false: 6 = 6;  7 = 8 - 1;  5 + 2 = 2 + 5;  4 + 1 = 5 + 2;  9 - 3 = 4 + 2."
  sources: {ccss: ["1.OA.D.7"], lc: ["32458a68", "5d2ed8f0"]}
  strand: N2
- id: subtraction.unknown-addend.rewrite
  concept: subtraction
  facet: unknown-addend
  level: 2
  type: representation
  name: Rewrite a subtraction as an addition with an unknown addend
  statement: "The subtraction a - b = ? is rewritten as the addition b + ? = a, with the unknown in the addend position."
  assess: "Write an addition equation with a box for the missing number that has the same answer as 15 - 7 = ?. Do not solve it."
  sources: {ccss: ["1.OA.B.4"], lc: ["4abe18e7"]}
  strand: N2
- id: equation.unknown.addition
  concept: equation
  facet: relational
  level: 2
  type: procedure
  name: Find the unknown in an addition equation
  statement: "In an equation relating three whole numbers by addition (a + b = c, written either way round), the unknown may be either addend or the sum; it is the number that makes the equation true."
  procedure:
    - "If the sum is unknown, add the two addends."
    - "If an addend is unknown, find the number that added to the known addend makes the sum, by counting up or a known fact."
    - "Check that the number makes the two sides equal."
  assess: "Find the number that makes each equation true: 8 + ? = 11;  ? + 5 = 12;  14 = 6 + ?;  6 + 6 = ?."
  sources: {ccss: ["1.OA.D.8"], lc: ["b9ab4f32"]}
  strand: N2
- id: equation.unknown.subtraction
  concept: equation
  facet: relational
  level: 2
  type: procedure
  name: Find the unknown in a subtraction equation
  statement: "In an equation relating three whole numbers by subtraction (a - b = c, written either way round), the unknown may be the minuend, the subtrahend, or the difference; it is the number that makes the equation true."
  procedure:
    - "If the difference is unknown, subtract."
    - "If the subtrahend is unknown, find how many must be taken from a to leave c (a - c)."
    - "If the minuend is unknown, find the number that b and c together make (b + c)."
    - "Check that the number makes the two sides equal."
  assess: "Find the number that makes each equation true: 5 = ? - 3;  12 - ? = 8;  ? - 6 = 7;  15 - 9 = ?."
  sources: {ccss: ["1.OA.D.8"], lc: ["fb83f538"]}
  strand: N2
- id: addition.application.add-to.change-unknown
  concept: addition
  facet: add-to
  level: 2
  type: application
  name: Solve add-to story problems with the change unknown
  statement: "A story gives a starting amount and the amount after more were added, and asks how many were added; the answer is the number that joined to the start makes the result."
  assess: "Ana had 7 shells. She found some more. Now she has 12 shells. How many shells did she find? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["fe904c98", "17aaf480", "c1129849", "ecfbb806"]}
  strand: N2
- id: addition.application.add-to.start-unknown
  concept: addition
  facet: add-to
  level: 2
  type: application
  name: Solve add-to story problems with the start unknown
  statement: "A story gives how many were added and the final amount, and asks how many there were at the start; the answer is the number that, with the added amount joined to it, makes the final amount."
  assess: "Some birds were on a wire. 5 more birds landed. Then there were 13 birds. How many birds were on the wire at first? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["fe904c98", "17aaf480", "c1129849", "ecfbb806"]}
  strand: N2
- id: subtraction.application.take-from.change-unknown
  concept: subtraction
  facet: take-away
  level: 2
  type: application
  name: Solve take-from story problems with the change unknown
  statement: "A story gives a starting amount and the amount left after some were taken away, and asks how many were taken; the answer is the start minus what is left."
  assess: "There were 14 cookies on a plate. Some were eaten. Now there are 6 cookies. How many were eaten? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["17aaf480", "fe904c98", "c1129849", "ecfbb806"]}
  strand: N2
- id: subtraction.application.take-from.start-unknown
  concept: subtraction
  facet: take-away
  level: 2
  type: application
  name: Solve take-from story problems with the start unknown
  statement: "A story gives how many were taken away and how many are left, and asks how many there were at the start; the answer is the amount left joined with the amount taken."
  assess: "Some children were at the park. 4 children went home. Now 9 children are at the park. How many children were at the park at first? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["17aaf480", "fe904c98", "c1129849", "ecfbb806"]}
  strand: N2
- id: addition.application.put-together.addend-unknown
  concept: addition
  facet: put-together
  level: 2
  type: application
  name: Solve put-together/take-apart story problems with one part unknown
  statement: "A story gives a total made of two kinds and the size of one part, with no action, and asks for the other part; the answer is the total minus the known part."
  assess: "There are 15 balls in a box. 8 are red and the rest are blue. How many are blue? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["17aaf480", "fe904c98", "c1129849", "ecfbb806"]}
  strand: N2
- id: addition.application.put-together.both-unknown
  concept: addition
  facet: put-together
  level: 1
  type: application
  name: Solve put-together story problems with both parts unknown
  statement: "A story gives only the total of two kinds and asks how many of each there could be; any split of the total into two parts is an answer, and there are several."
  assess: "Grandma has 6 flowers. Some are red and some are yellow. How many red and how many yellow could there be? Use objects or a drawing to find two different answers."
  sources: {ccss: ["1.OA.A.1"], lc: ["fe904c98", "17aaf480"]}
  strand: N2
- id: subtraction.application.compare.difference-unknown
  concept: subtraction
  facet: comparison
  level: 2
  type: application
  name: Solve compare story problems with the difference unknown
  statement: "A story gives two amounts and asks how many more one has than the other (or how many fewer); the answer is the larger minus the smaller."
  assess: "Lucy has 12 stickers. Julie has 7 stickers. How many more stickers does Lucy have than Julie? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["951e92fc", "cf1426e3", "c1129849", "ecfbb806"]}
  strand: N2
- id: subtraction.application.compare.bigger-unknown
  concept: subtraction
  facet: comparison
  level: 2
  type: application
  name: Solve compare story problems with the larger amount unknown
  statement: "A story gives the smaller amount and how many more (or fewer) the other has, and asks for the larger amount; the answer is the smaller plus the difference."
  assess: "Julie has 7 stickers. Lucy has 5 more stickers than Julie. How many stickers does Lucy have? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["cf1426e3", "951e92fc", "c1129849", "ecfbb806"]}
  strand: N2
- id: subtraction.application.compare.smaller-unknown
  concept: subtraction
  facet: comparison
  level: 2
  type: application
  name: Solve compare story problems with the smaller amount unknown
  statement: "A story gives the larger amount and how many fewer (or more) the other has, and asks for the smaller amount; the answer is the larger minus the difference."
  assess: "Lucy has 13 stickers. Julie has 4 fewer stickers than Lucy. How many stickers does Julie have? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.1", "2.OA.A.1"], lc: ["951e92fc", "cf1426e3", "c1129849", "ecfbb806"]}
  strand: N2
- id: addition.application.three-addends
  concept: addition
  facet: put-together
  level: 2
  type: application
  name: Solve story problems that add three numbers
  statement: "A story combines three amounts and asks for the total, which is the sum of all three."
  assess: "Max has 4 red cars, 7 blue cars, and 6 green cars. How many cars does he have? Use objects, a drawing, or an equation."
  sources: {ccss: ["1.OA.A.2"], lc: ["686ee785", "74008d2f", "04b5868f"]}
  strand: N2
- id: equation.situation.one-step
  concept: equation
  facet: relational
  level: 2
  type: representation
  name: Write an equation with a symbol for the unknown for a one-step story
  statement: "A one-step addition or subtraction story is represented by one equation that relates its three quantities, with a symbol such as ? or a box standing for the unknown quantity in its position."
  assess: "Write an equation, using a box for the unknown, for this story. Do not solve it. Some birds were on a wire. 5 more landed. Then there were 13 birds."
  sources: {ccss: ["2.OA.A.1", "1.OA.A.1"], lc: ["62f8e446", "9410f088", "219ac1be"]}
