- id: addition.application.two-step
  concept: addition
  facet: operation
  level: 2
  type: application
  name: Solve two-step addition and subtraction story problems
  statement: "A story requires two addition or subtraction steps, the result of the first step being a quantity used in the second, with the unknown in any position."
  assess: "A bus had 23 people. At the first stop 8 got off. At the second stop 15 got on. How many people are on the bus now? Use a drawing or equations."
  sources: {ccss: ["2.OA.A.1"], lc: ["f298b8b3", "38ae28b9", "a12524cd"]}
  strand: N2
- id: equation.situation.two-step
  concept: equation
  facet: relational
  level: 2
  type: representation
  name: Write equations with a symbol for the unknown for a two-step story
  statement: "A two-step addition or subtraction story is represented by equations (one per step, or one with two operations) in which a symbol stands for each unknown quantity."
  assess: "Write equations, using boxes for unknowns, for this story. Do not solve them. A bus had 23 people. At the first stop 8 got off. At the second stop 15 got on. How many people are on the bus now?"
  sources: {ccss: ["2.OA.A.1"], lc: ["85d030b7", "d57ecfb9"]}
