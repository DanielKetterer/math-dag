notes: >-
  Reserved id used: patterns.numerical.two-rules (the generating procedure; forming pairs, graphing,
  and relationships are separate nodes). Fluency components (2.NBT.B.5 within 100, 3.NBT.A.2 within
  1000) are cited by addition.base-ten.strategy and subtraction.base-ten.strategy (and the 3.NBT.A.2
  ones also by the standard-algorithm nodes, since that standard names algorithms); I did not write
  separate 'fluency' nodes because multi-digit fluency is efficient, accurate strategy use, not recall,
  so its test does not differ in kind from the strategy node. Within 100 and within 1000 were merged
  (no new threshold); 2.NBT.B.6 (up to four two-digit addends) merged into addition.base-ten.strategy.
  Lc 41093be0 (subtract within 100 by strategies) is cited by both subtraction.base-ten.strategy
  (take away in parts) and subtraction.base-ten.add-up (relationship between addition and subtraction),
  two genuinely different strategies; add-up uses facet 'comparison' as the nearest existing meaning
  (missing addend / distance), reviewer may prefer a 'missing-addend' facet. Multiplication strategy
  components (place value vs properties) were merged per range: one node for multi-digit by one-digit
  (3- and 4-digit merged), one for two-digit by two-digit. multiplication.multiple-of-ten.by-multiple-of-ten
  has no lc of its own: 4.NBT.B.5 two-digit by two-digit partial products uses it (tens x tens); a
  reviewer may decide it belongs in another strand. Division: exact quotient vs remainder split at the
  remainder threshold for one-digit divisors; the two-digit-divisor node allows remainders because
  5.NBT.B.6 components do not separate them and the new mathematics there is estimating the multiple.
  Area-model explain nodes use facet unknown-factor (division) and array-area (multiplication).
  Power-of-ten rule and explain nodes each cite the same 'explain patterns' lc, since it carries both
  the pattern and its reason; dividing whole numbers and decimals by 10^k merged (same rule).
  decimal.multiplication split into by-whole (copies, a real model difference) and by-decimal (area
  with tenths x tenths = hundredths); division split into by-whole (sharing) and by-decimal (how many
  groups), since the decimal-divisor case needs the measurement meaning. Both lc 486045b7 and 90b36ead
  are cited by two nodes for this reason. patterns.numerical.relationship.explain has no lc of its own;
  it is the 'explain informally why' in the 5.OA.B.3 example. 5.OA.B.3 graphing presumes
  coordinate-plane.first-quadrant (later phase).
