new_concepts:
  - {concept: addition, facet: base-ten, reason: "Multi-digit addition by place value (like units, composing tens and hundreds, algorithm) is a distinct meaning from add-to joining."}
  - {concept: subtraction, facet: base-ten, reason: "Multi-digit subtraction by place value (like units, decomposing, algorithm) is distinct from take-away and comparison of small sets."}
  - {concept: multiplication, facet: base-ten, reason: "Multiplying by place-value parts and by powers of 10 relies on base-ten units, not on equal groups, arrays, or scaling."}
  - {concept: division, facet: base-ten, reason: "Dividing by powers of 10 as a shift of place value."}
  - {concept: exponent, facet: power-of-ten, reason: "Whole-number exponents first appear as notation for powers of 10."}
  - {concept: expressions, facet: numerical, reason: "Numerical expressions with grouping symbols: writing, evaluating, interpreting structure. Distinct from the later-phase expressions.variables."}
  - {concept: patterns, facet: numerical, reason: "Numerical patterns generated by a rule, and relationships between corresponding terms of two patterns."}
