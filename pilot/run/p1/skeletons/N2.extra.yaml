notes: >-
  Strand N2 writes no reserved ids. addition.whole-number and subtraction.whole-number (owner N4) are
  broader than any N2 node; the N4 retire list should include addition.within-10.fluency,
  addition.within-20.fluency, addition.make-ten, addition.two-digit-plus-one-digit.model and
  addition.two-digit-plus-tens.model among the replacements, and subtraction.within-10.fluency,
  subtraction.within-20.fluency, subtraction.decompose-to-ten and subtraction.tens-minus-tens.model for
  subtraction. Word problems: 1.OA.A.1 and 2.OA.A.1 components are split by situation type and unknown
  position (CCSS Table 1), not by range or by grade, since the range 20 versus 100 changes only the
  computation, which is its own node; the K one-step result-unknown cases stay with the existing
  addition.application.add-to-story and subtraction.application.take-from-story. The 1.OA.A.1 and
  2.OA.A.1 lc ids are therefore cited by several situation nodes each (each component spans many
  situations). The add-to/take-from result-unknown case within 20 is not a new node: it is the existing
  story nodes with a larger range. Merges I was unsure of: (1) K.OA.A.5 within 5 merged into within-10
  fluency (no threshold between 5 and 10); (2) 2.OA.B.2 add-within-20 automaticity and 'know from memory
  all sums of two one-digit numbers' merged into addition.within-20.fluency, since sums of two one-digit
  numbers are exactly the sums within 18; (3) 1.OA.B.3 'apply properties to add' cited by both the
  commutative and associative strategy nodes; 'apply properties to subtract' attached to
  subtraction.decompose-to-ten, which rests on a - (r + s) = (a - r) - s. addition.commutative (the
  property itself) and addition.doubles.fact have no lc of their own; they are written because the
  commutative strategy and near-doubles nodes use them. 1.NBT.C.4 strategy components were split into a
  model node per case (level 2) and a symbolic strategy node per case (level 3); the 'relationship between
  addition and subtraction' half of 125bff3f and 890139d1 is not a separate node for addition of tens.
  1.NBT.C.4 two-digit plus two-digit (42 + 35) appears only inside addition.two-digit.like-units; full
  two-digit addition within 100 belongs to the place-value strand (2.NBT.B.5) or N4.
