- id: counting.sequence.to-100
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by ones from 1 to 100
  statement: "Say the number words in order from one to one hundred, continuing correctly past each decade change (twenty-nine, thirty; ninety-nine, one hundred)."
  assess: "Count aloud by ones from 1 to 100."
  sources: {ccss: ["K.CC.A.1"], lc: ["555df2b6"]}
  strand: N1
- id: counting.sequence.count-on
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count forward from a given number within 100
  statement: "Begin the count at a given number within 100 and continue forward by ones, without first counting up from one."
  procedure:
    - Say the given number.
    - Say the next number word in the sequence after it.
    - Keep saying each next number word until told to stop.
  assess: "Start at 57 and count forward by ones to 64. Do not start from 1."
  sources: {ccss: ["K.CC.A.2"], lc: ["85bcacad", "0f188ee6"]}
  strand: N1
- id: counting.sequence.within-1000
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count forward by ones within 1000, across hundreds
  statement: "Count forward by ones from any number to any number within 1000, continuing correctly across decades and hundreds (ninety-nine, one hundred, one hundred one; three hundred ninety-nine, four hundred)."
  procedure:
    - Say the starting number.
    - For each next number, keep the hundreds name and say the next tens-and-ones name.
    - After a number ending in ninety-nine, say the next hundred (for example, four hundred), then continue with one, two, and so on after the hundred.
  assess: "Count aloud by ones from 296 to 305."
  sources: {ccss: ["1.NBT.A.1", "2.NBT.A.2"], lc: ["18d6b278", "da04a9ac", "49fe9974"]}
  strand: N1
- id: counting.sequence.backward.across-decades
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count backward by ones within 120, across decades
  statement: "Count backward by ones from any number up to 120 to any smaller number, continuing correctly across decade and hundred changes (forty-one, forty, thirty-nine; one hundred one, one hundred, ninety-nine)."
  procedure:
    - Say the starting number.
    - Say the number word just before it in the counting sequence.
    - After a number ending in zero, say the previous decade name with nine (after forty, thirty-nine).
    - Continue until the stopping number.
  assess: "Count backward by ones from 103 to 96."
  sources: {ccss: ["1.NBT.A.1"], lc: ["c753e6c1"]}
  strand: N1
- id: counting.skip.tens.decades
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by tens from 0 to 120
  statement: "Say the decade numbers in order from zero: ten, twenty, thirty, ..., one hundred, one hundred ten, one hundred twenty."
  assess: "Count aloud by tens from 0 to 120."
  sources: {ccss: ["K.CC.A.1", "1.NBT.A.1", "2.NBT.A.2"], lc: ["4ae29496", "17f4ad11", "3b089bbf"]}
  strand: N1
- id: counting.skip.tens.from-any
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count forward by tens from any number within 120
  statement: "Count forward by tens from any starting number up to 120, so that the ones stay the same and the tens increase by one each step (24, 34, 44, ..., 94, 104)."
  procedure:
    - Say the starting number.
    - Say the number with the same ones and one more ten.
    - Repeat until the stopping number.
  assess: "Count aloud by tens starting at 24 and stopping at 114."
  sources: {ccss: ["1.NBT.A.1"], lc: ["c497e2ee"]}
  strand: N1
- id: counting.skip.tens.backward
  concept: counting
  facet: sequence
  level: 1
  type: procedure
  name: Count backward by tens from any number within 120
  statement: "Count backward by tens from any starting number up to 120, so that the ones stay the same and the tens decrease by one each step (117, 107, 97, 87)."
  procedure:
    - Say the starting number.
    - Say the number with the same ones and one less ten.
    - Repeat until the stopping number.
  assess: "Count aloud backward by tens starting at 117 and stopping at 37."
  sources: {ccss: ["1.NBT.A.1"], lc: ["3c1df05c"]}
  strand: N1
- id: counting.skip.fives
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by fives from 0 to 100
  statement: "Say the multiples of five in order from zero: five, ten, fifteen, twenty, ..., one hundred."
  assess: "Count aloud by fives from 0 to 100."
  sources: {ccss: ["2.NBT.A.2"], lc: ["3b089bbf"]}
  strand: N1
- id: counting.skip.hundreds
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by hundreds from 0 to 1000
  statement: "Say the multiples of one hundred in order from zero: one hundred, two hundred, ..., nine hundred, one thousand."
  assess: "Count aloud by hundreds from 0 to 1,000."
  sources: {ccss: ["2.NBT.A.2"], lc: ["3b089bbf"]}
  strand: N1
- id: numeral.read.to-1000
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Read numerals up to 1000
  statement: "Give the number name, spoken or written in words, for a numeral up to 1000: name the hundreds, then the tens-and-ones name, saying nothing for a place whose digit is 0."
  procedure:
    - If there are three digits, say the first digit followed by hundred.
    - Say the name of the two-digit number formed by the last two digits, or of the last digit if the tens digit is 0, or nothing if both are 0.
  assess: "Read these numerals aloud: 406, 117, 860."
  sources: {ccss: ["1.NBT.A.1", "2.NBT.A.3"], lc: ["5a704f63", "be537a94"]}
  strand: N1
- id: numeral.write.to-1000
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Write numerals up to 1000 from number names
  statement: "Write the numeral for a number name up to 1000 using one digit for each place, with 0 in any place that has no units (four hundred six is 406, not 4006)."
  procedure:
    - Write the number of hundreds as the first digit, if there are hundreds.
    - Write the number of tens next, writing 0 if there are hundreds but no tens.
    - Write the number of ones last, writing 0 if there are none.
  assess: "Write the numeral for each number: four hundred six; one hundred twelve; seven hundred."
  sources: {ccss: ["1.NBT.A.1", "2.NBT.A.3"], lc: ["8c23a3f0", "be537a94"]}
  strand: N1
- id: numeral.record-collection
  concept: numeral
  facet: core
  level: 2
  type: representation
  name: Write the numeral for a collection of up to 120 objects
  statement: "Find how many objects are in a collection of up to 120 and record that number with a written numeral."
  assess: "Here is a pile of 73 loose counters. Write the number that tells how many counters there are."
  sources: {ccss: ["1.NBT.A.1"], lc: ["aa4cdcda"]}
  strand: N1
- id: numeral.read.periods
  concept: numeral
  facet: core
  level: 3
  type: representation
  name: Read multi-digit numerals up to 1,000,000
  statement: "Give the number name for a whole number up to 1,000,000 by splitting its digits into periods of three from the right and naming each period's value followed by the period name (304,050 is three hundred four thousand fifty)."
  procedure:
    - Split the digits into groups of three from the right.
    - Read the leftmost group as a number up to 999 and say thousand (or million for 1,000,000).
    - Read the last group as a number up to 999, saying nothing if it is 000.
  assess: "Write these numbers in words: 304,050 and 90,009."
  sources: {ccss: ["4.NBT.A.2"], lc: ["8b6dc1d3"]}
  strand: N1
- id: numeral.write.periods
  concept: numeral
  facet: core
  level: 3
  type: representation
  name: Write multi-digit numerals up to 1,000,000 from number names
  statement: "Write the numeral for a number name up to 1,000,000, writing the thousands part and then exactly three digits for the part after the word thousand, filling empty places with 0 (forty thousand six is 40,006)."
  procedure:
    - Write the numeral for the number said before the word thousand.
    - Write the numeral for the number said after thousand as exactly three digits, using leading zeros if needed.
    - Join the two parts, separated by a comma.
  assess: "Write the numeral for two hundred eight thousand forty."
  sources: {ccss: ["4.NBT.A.2"], lc: ["8b6dc1d3"]}
  strand: N1
- id: place-value.teen.ten-and-ones
  concept: place-value
  facet: whole-number
  level: 1
  type: concept
  name: Teen numbers are ten ones and some more ones
  statement: "Each number from 11 to 19 is made of ten ones and some further ones, from one to nine: sixteen is ten and six."
  assess: "Sixteen is ten and how many more? Answer without counting."
  sources: {ccss: ["K.NBT.A.1"], lc: ["901c35e9"]}
  strand: N1
- id: place-value.teen.compose
  concept: place-value
  facet: whole-number
  level: 1
  type: procedure
  name: Make a teen number from ten ones and some ones
  statement: "Build a given number from 11 to 19 with objects or a drawing as one group of ten ones and the needed further ones."
  procedure:
    - Make a group of exactly ten ones, for example a full ten-frame.
    - Add further ones, one at a time, while counting on from ten until the given number is reached.
    - Show the ten and the further ones as separate parts, in objects or in a drawing.
  assess: "Use a ten-frame and counters to make 14 as a full ten and some extra ones."
  sources: {ccss: ["K.NBT.A.1"], lc: ["ec5ef28f", "0a7a9ee1"]}
  strand: N1
- id: place-value.teen.decompose
  concept: place-value
  facet: whole-number
  level: 1
  type: procedure
  name: Split a teen number of objects into ten ones and some ones
  statement: "Separate a collection of 11 to 19 objects, or a drawing of one, into a group of ten ones and the remaining ones, and say how many ones remain."
  procedure:
    - Count out ten of the objects and set them together as one group.
    - Count the objects that are left.
    - Say the number as ten and that many ones.
  assess: "Here are 17 loose counters. Put ten of them in a ten-frame. How many counters are outside the ten-frame?"
  sources: {ccss: ["K.NBT.A.1"], lc: ["d2918c03", "cd964993"]}
  strand: N1
- id: place-value.teen.equation
  concept: place-value
  facet: whole-number
  level: 2
  type: representation
  name: Record a teen number as 10 plus ones with an equation
  statement: "A number from 11 to 19 shown as ten ones and some further ones is recorded by an equation of the form 1x = 10 + x, for example 18 = 10 + 8."
  assess: "A full ten-frame and 3 more counters are shown, 13 counters in all. Write an equation that shows the ten and the extra ones making 13."
  sources: {ccss: ["K.NBT.A.1"], lc: ["b2046c2d", "17704693"]}
  strand: N1
- id: place-value.ten.unit
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: A ten is a bundle of ten ones
  statement: "Ten ones grouped together form one unit called a ten, and the numeral 10 represents one ten and no ones."
  assess: "Ten cubes are snapped into one rod. What is the rod called, and how many ones does it stand for?"
  sources: {ccss: ["1.NBT.B.2.a"], lc: ["bc061183", "71ab99a5"]}
  strand: N1
- id: place-value.teen.digits
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: In 11 to 19 the first digit is one ten
  statement: "In the numerals 11 to 19, the first digit 1 stands for one ten and the second digit stands for the number of further ones."
  assess: "In the numeral 16, how many ones does the 1 stand for?"
  sources: {ccss: ["1.NBT.B.2.b"], lc: ["b192afe3"]}
  strand: N1
- id: place-value.decade.tens
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: Decade numbers are a number of tens and no ones
  statement: "The numbers 10, 20, 30, ..., 90 are one, two, three, ..., nine tens and 0 ones; the first digit counts the tens."
  assess: "How many ten-rods make 70? How many single cubes are needed besides the rods?"
  sources: {ccss: ["1.NBT.B.2.c"], lc: ["78e03758"]}
  strand: N1
- id: place-value.two-digit.tens-ones
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: The two digits of a two-digit number are tens and ones
  statement: "In a two-digit numeral, the left digit counts tens and the right digit counts ones, so the number is that many tens plus that many ones (47 is 4 tens and 7 ones, 40 + 7)."
  assess: "How many ones in all does the 4 in 47 stand for?"
  sources: {ccss: ["1.NBT.B.2"], lc: []}
  strand: N1
- id: place-value.hundred.unit
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: A hundred is a bundle of ten tens
  statement: "Ten tens grouped together form one unit called a hundred, equal to one hundred ones."
  assess: "How many ten-rods are needed to make one hundred-flat?"
  sources: {ccss: ["2.NBT.A.1.a"], lc: ["e24232f5"]}
  strand: N1
- id: place-value.hundreds.multiples
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: 100, 200, ..., 900 are a number of hundreds
  statement: "The numbers 100, 200, ..., 900 are one, two, ..., nine hundreds with 0 tens and 0 ones; the first digit counts the hundreds."
  assess: "How many hundred-flats make 600? How many ten-rods and single cubes are needed besides the flats?"
  sources: {ccss: ["2.NBT.A.1.b"], lc: ["91fb37cd"]}
  strand: N1
- id: place-value.three-digit.hundreds-tens-ones
  concept: place-value
  facet: whole-number
  level: 2
  type: concept
  name: The three digits of a three-digit number are hundreds, tens, and ones
  statement: "In a three-digit numeral, the digits from left to right count hundreds, tens, and ones, so the number is that many hundreds plus tens plus ones (706 is 7 hundreds, 0 tens, and 6 ones)."
  assess: "What is the value of each digit in 706? Show 706 with base-ten blocks."
  sources: {ccss: ["2.NBT.A.1"], lc: []}
  strand: N1
- id: place-value.ten-times-right
  concept: place-value
  facet: whole-number
  level: 3
  type: concept
  name: Each whole-number place is ten times the place to its right
  statement: "In a multi-digit whole number, a digit in one place represents ten times what the same digit represents in the place to its right."
  assess: "In 5,550, the 5 in the hundreds place is how many times the value of the 5 in the tens place?"
  sources: {ccss: ["4.NBT.A.1"], lc: ["10c7a285"]}
  strand: N1
- id: place-value.ten-times-right.decimal
  concept: place-value
  facet: decimal
  level: 3
  type: concept
  name: Each place, including decimal places, is ten times the place to its right
  statement: "In a multi-digit number with decimal places, a digit in any place represents ten times what the same digit represents in the place to its right, including across the decimal point (ones to tenths, tenths to hundredths)."
  assess: "In 3.33, the 3 in the tenths place is how many times the value of the 3 in the hundredths place?"
  sources: {ccss: ["5.NBT.A.1"], lc: ["ba0b5da7"]}
  strand: N1
- id: place-value.tenth-of-left
  concept: place-value
  facet: decimal
  level: 3
  type: concept
  name: Each place is one tenth of the place to its left
  statement: "In a multi-digit number, including one with decimal places, a digit in one place represents 1/10 of what the same digit represents in the place to its left."
  assess: "In 4.44, the value of the 4 in the hundredths place is what fraction of the value of the 4 in the tenths place?"
  sources: {ccss: ["5.NBT.A.1"], lc: ["051034c9"]}
  strand: N1
- id: place-value.factor-of-ten
  concept: place-value
  facet: whole-number
  level: 3
  type: procedure
  name: Use place value to multiply or divide by a factor of 10
  statement: "Multiplying a whole number by 10 moves each digit one place to the left, so a x 10 is a with a 0 written after it; hence when b = a x 10, b divided by a = 10 and b divided by 10 = a."
  procedure:
    - For a x 10, write the digits of a followed by one 0.
    - For a quotient, find whether the dividend is the divisor with one 0 written after it, or the divisor is 10.
    - If the dividend is the divisor times 10, the quotient is 10; if the divisor is 10 and the dividend ends in 0, the quotient is the dividend with its final 0 removed (this node covers only quotients with no remainder).
  assess: "Without long division, use place value to find 700 divided by 70."
  sources: {ccss: ["4.NBT.A.1"], lc: ["cb2cec73"]}
  strand: N1
