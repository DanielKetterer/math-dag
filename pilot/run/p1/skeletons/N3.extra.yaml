notes: >
  Coverage: unknown factor (26f02245, 007dac47) is cited by multiplication.unknown-factor.solve. Unknown quotient (2b2dea9c, 0a25c5d6) is fully covered by the written
  division.unknown-factor.find-quotient. Fluent division within 100 (5a0a81bb) is covered by division.facts.within-100.
  Fluent multiplication within 100 (dd8b4c11) and unknown product (72f366ee, ac8cd492) are merged into
  multiplication.facts.within-100: an unknown-product equation 6 x 6 = ? is a fact recall within 10 x 10, so a separate
  node would test the same thing. 3.OA.C.7 also allows reaching fluency through strategies; the strategy nodes are the
  credible routes and the critic should treat them as route-only, not AND-clause, prerequisites of the fact node.
  3.OA.A.3 division word problems (754f84dd, 076bb94c, 1843505b) are cited by both division.application.partitive and
  division.application.measurement, since a learner can meet one situation type without the other.
  multiplication.array.rows-columns has no lc of its own; it is the reserved id, sourced on 2.OA.C.4. multiplication.by-zero
  and division.by-zero.undefined have no CCSS standard (by-zero is implicit in 3.OA.C.7 facts with 0, division by 0 in
  3.OA.A.4 and 6.NS); left with empty sources rather than an invented code. multiplication.by-one kept as its own node
  because 7 written nodes point at it (fraction multiply-by-one arguments), and it is cited at level 3 for any number.
  multiplication.comparison.vs-additive comes from the 4.OA.A.2 text ("distinguishing multiplicative comparison from
  additive comparison"), which has no learning component of its own.
  operations.application.multistep and its siblings merge 3.OA.D.8 and 4.OA.A.3 ranges (within 1000 / 100 versus up to five
  digits); the range does not change the mathematics of choosing steps. The remainder version is split because
  interpreting a remainder is a real threshold. Reasonableness (88ab95a4, 44a2143c) and justify-solution (29217307,
  f81ccf8a) are separate: one estimates, the other checks exactly. The multi-digit computation inside these problems
  belongs to N4 (multiplication.multi-digit, division.multi-digit, addition.whole-number, subtraction.whole-number).
  The 11d23252 component ("identify arithmetic patterns") is cited by both table-pattern nodes.
  Facet choices for the properties (array-area for commutative and distributive, core for associative) follow the usual
  model that makes each visible; a reviewer may prefer core for all three.
