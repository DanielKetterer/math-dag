new_concepts:
  - {concept: parity, facet: pairing, reason: "Even and odd as pairing objects with none or one left over (2.OA.C.3)."}
  - {concept: parity, facet: equal-addends, reason: "Even numbers as doubles, n = a + a (2.OA.C.3); a different meaning from pairing."}
  - {concept: multiplication, facet: core, reason: "Properties stated for numbers in general (associative, by-one, by-zero) and fact recall, not tied to the equal-groups or array model."}
  - {concept: multiplication, facet: comparison, reason: "Multiplicative comparison, 'a times as many as b' (4.OA.A.1-2). Kept under multiplication because the reserved id multiplication.comparison already names it; ratio has a multiplicative-comparison facet that a reviewer may want to link."}
  - {concept: operations, facet: whole-number, reason: "Multi-step word problems mixing the four whole-number operations belong to no single operation (3.OA.D.8, 4.OA.A.3)."}
  - {concept: patterns, facet: table, reason: "Patterns in the addition and multiplication tables (3.OA.D.9)."}
  - {concept: patterns, facet: rule, reason: "Sequences and shape patterns generated by a stated rule (4.OA.C.5)."}
  - {concept: factors, facet: core, reason: "Factor pairs, multiples, prime and composite (4.OA.B.4)."}
retires:
  - {id: multiplication.properties, replaced_by: [multiplication.commutative, multiplication.associative, multiplication.distributive, multiplication.by-one, multiplication.by-zero], note: "Three or more separate properties; an edge pointing at the group should point at the one property it uses. The strategy nodes (multiplication.commutative.strategy, multiplication.associative.strategy, multiplication.distributive.strategy, division.distributive.strategy) are the applications."}
  - {id: factors-multiples.whole-number, replaced_by: [factors.factor-pair.meaning, factors.factor-pairs.find-all, factors.multiple-of-each-factor, factors.is-multiple.decide, factors.prime-composite.meaning, factors.prime-composite.decide], note: "The reserved description also names common multiples, GCF and LCM (6.NS.B.4); those are not in this strand's input and must be written by the strand that owns 6.NS.B.4. Edges that need GCF or LCM should be re-pointed to those later nodes, not to these."}
