- id: fraction.equivalent.simple.generate
  concept: fraction
  facet: part-whole
  level: 2
  type: procedure
  name: Recognize and generate simple equivalent fractions with a model
  statement: 'Using a fraction model with denominators 2, 3, 4, 6, or 8, find a fraction that covers the
    same amount as a given one by splitting or joining its parts.

    '
  procedure:
  - Show the given fraction on a model.
  - Split each part into equal smaller parts, or join equal groups of parts.
  - Count the new number of shaded parts and total parts and write the new fraction.
  assess: Use a fraction strip to find a fraction equal to 2/3 with denominator 6.
  sources:
    ccss:
    - 3.NF.A.3.b
    lc:
    - 3194d5b0
    - 463e4334
  strand: S0
- id: fraction.equivalent.simple.explain
  concept: fraction
  facet: part-whole
  level: 2
  type: justification
  name: Explain why simple equivalent fractions are equal
  statement: 'For a specific pair such as 1/2 and 2/4, a model shows the two fractions cover the same
    amount of the same whole, so they are equal.

    '
  assess: Explain, with a drawing, why 1/2 = 2/4.
  sources:
    ccss:
    - 3.NF.A.3.b
    lc:
    - d20a384e
    - f577262f
  strand: S0
- id: fraction.compare.same-denominator
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Compare fractions with the same denominator
  statement: 'When two fractions have the same denominator, the parts are the same size, so the fraction
    with more parts is greater.

    '
  assess: Which is greater, 3/8 or 5/8? Explain.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - '56514983'
    - bd5ee9b3
  strand: S0
- id: fraction.compare.same-numerator
  concept: fraction
  facet: part-whole
  level: 2
  type: procedure
  name: Compare fractions with the same numerator
  statement: 'When two fractions have the same numerator, there are the same number of parts, so the fraction
    whose parts are larger (smaller denominator) is greater.

    '
  assess: Which is greater, 2/3 or 2/5? Explain.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - ea2ae87f
    - 1f979ba2
  strand: S0
- id: fraction.compare.reasoning-size
  concept: fraction
  facet: measure
  level: 2
  type: procedure
  name: Compare fractions by reasoning about their size
  statement: Decide which of two fractions is greater by reasoning about the size of the parts and how
    many there are.
  assess: Which is greater, 3/4 or 3/6? Which is greater, 2/6 or 5/6?
  sources:
    ccss:
    - 3.NF.A.3
    lc:
    - 2bfc7496
  strand: S0
- id: fraction.compare.same-whole
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Fraction comparisons need the same whole
  statement: 'Comparing two fractions by size is only valid when both refer to the same whole; 1/2 of
    a small pizza can be less than 1/3 of a large one.

    '
  assess: Sam says 1/2 is always bigger than 1/3. When could 1/3 of something be bigger than 1/2 of something?
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - ee846e61
  strand: S0
