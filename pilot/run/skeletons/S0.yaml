- id: fraction.unit.part-whole
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Unit fraction as one of b equal parts of a whole
  statement: 1/b names the quantity formed by one part when a whole is partitioned into b equal parts.
  assess: This rectangle is split into 6 equal parts and one is shaded. What fraction of the rectangle
    is shaded?
  sources:
    ccss:
    - 3.NF.A.1
    - 3.G.A.2
    lc:
    - 188fe970
    - 1b707b1d
  strand: S0
- id: fraction.non-unit.part-whole
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Non-unit fraction as a parts of size 1/b
  statement: a/b names the quantity formed by a parts, each of size 1/b, of a whole partitioned into b
    equal parts.
  assess: A bar is split into 8 equal parts and 3 are shaded. What fraction of the bar is shaded?
  sources:
    ccss:
    - 3.NF.A.1
    lc:
    - 0f80aa86
  strand: S0
- id: fraction.unit.number-line
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: Locate a unit fraction on the number line
  statement: 1/b is the point reached by partitioning the interval from 0 to 1 into b equal lengths and
    taking one of those lengths from 0.
  procedure:
  - Mark 0 and 1 on a number line.
  - Partition the interval from 0 to 1 into b equal lengths.
  - Label the endpoint of the first length from 0 as 1/b.
  assess: Place 1/4 on a number line marked only with 0 and 1.
  sources:
    ccss:
    - 3.NF.A.2.a
    lc:
    - 9adcd390
    - 33922a0f
  strand: S0
- id: fraction.non-unit.number-line
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: Locate a non-unit fraction on the number line
  statement: a/b is the endpoint reached by marking off a lengths of size 1/b from 0 on the number line.
  procedure:
  - Locate 1/b on the number line.
  - Mark off a copies of the length 1/b, end to end, starting at 0.
  - Label the endpoint of the last copy as a/b.
  assess: Place 5/6 on a number line marked only with 0 and 1.
  sources:
    ccss:
    - 3.NF.A.2.b
    lc:
    - d65254fc
    - a1e20219
  strand: S0
- id: fraction.as-number
  concept: fraction
  facet: measure
  level: 2
  type: concept
  name: A fraction is a number
  statement: 'A fraction names a single point on the number line, so it is a number of the same kind as
    a whole number, with a definite size and position.

    '
  assess: Is 3/4 more than 0? Less than 1? Mark where it goes between 0 and 2.
  sources:
    ccss:
    - 3.NF.A.2
    lc:
    - 524bcfce
  strand: S0
- id: fraction.whole-number.as-fraction
  concept: fraction
  facet: measure
  level: 2
  type: representation
  name: Whole numbers written as fractions
  statement: 'Any whole number can be written as a fraction: n = n/1, and 1 = b/b for any b, because both
    name the same point on the number line.

    '
  assess: Write 3 as a fraction. Write 1 as a fraction with denominator 6.
  sources:
    ccss:
    - 3.NF.A.3.c
    lc:
    - '18987551'
    - 42e054c8
  strand: S0
- id: fraction.equivalent.same-size
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Equivalent fractions as the same amount of the same whole
  statement: Two fractions are equivalent when they cover the same amount of the same whole.
  assess: These two equal-size bars show 1/2 and 2/4 shaded. Are the fractions equal? How do you know?
  sources:
    ccss:
    - 3.NF.A.3.a
    lc:
