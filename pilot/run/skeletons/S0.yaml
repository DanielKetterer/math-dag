  strand: S0
- id: fraction.compare.justify
  concept: fraction
  facet: part-whole
  level: 2
  type: justification
  name: Justify a fraction comparison
  statement: 'A comparison of fractions with the same numerator or the same denominator is justified by
    a model or an argument about part size and number of parts.

    '
  assess: Use a drawing to show why 2/3 > 2/5.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc:
    - b77a918b
  strand: S0
- id: fraction.application.compare-in-context
  concept: fraction
  facet: part-whole
  level: 2
  type: application
  name: Compare fractions in a story about shares
  statement: 'A story problem gives two fractional shares of same-size wholes; the learner decides which
    share is larger and explains why.

    '
  assess: Ana ate 2/6 of a pizza and Ben ate 2/8 of a pizza the same size. Who ate more? Explain.
  sources:
    ccss:
    - 3.NF.A.3.d
    lc: []
  strand: S0
- id: fraction.equivalent.multiply-principle
  concept: fraction
  facet: measure
  level: 3
  type: concept
  name: The multiplication principle for equivalent fractions
  statement: For any fraction a/b and any whole number n greater than 0, a/b = (n x a)/(n x b).
  assess: 'True or false: 3/5 = 12/20. True or false: 3/5 = 5/7. Say which rule decides it.'
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - 5f61cb2a
    - c3b684c1
  strand: S0
- id: fraction.equivalent.multiply-principle.generate
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Generate equivalent fractions with a/b = (n x a)/(n x b)
  statement: Produce a fraction equivalent to a/b by multiplying its numerator and denominator by the
    same whole number n greater than 0.
  procedure:
  - Choose a whole number n greater than 0.
  - Multiply the numerator by n and the denominator by n.
  - Write the result as the equivalent fraction.
  assess: Write two fractions equivalent to 3/5.
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - c3b684c1
    - 13498e57
  strand: S0
- id: fraction.equivalent.multiply-principle.recognize
  concept: fraction
  facet: measure
  level: 3
  type: procedure
  name: Recognize equivalent fractions with a/b = (n x a)/(n x b)
  statement: Decide whether two fractions are equivalent by rewriting both over a common denominator with
    the multiplication principle and comparing numerators.
  procedure:
  - Find a common multiple of the two denominators.
  - Rewrite each fraction over that denominator by multiplying its numerator and denominator by the same
    whole number.
  - The fractions are equivalent exactly when the rewritten numerators are equal.
  assess: Is 4/6 equivalent to 6/9? Is 6/8 equivalent to 3/5?
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - 5f61cb2a
    - df5f3fb2
  strand: S0
- id: fraction.equivalent.multiply-principle.explain
  concept: fraction
  facet: part-whole
  level: 4
  type: justification
  name: Explain why a/b = (n x a)/(n x b)
  statement: 'Splitting each of the b parts into n equal parts multiplies the number of parts by n and
    the number of chosen parts by n, while the amount covered does not change; so (n x a)/(n x b) is the
    same amount as a/b, for every n.

    '
  assess: Use a visual fraction model to explain why 2/3 = (4 x 2)/(4 x 3), and say why the same argument
    works for any n.
  sources:
    ccss:
    - 4.NF.A.1
    lc:
    - 74de8dae
  strand: S0
