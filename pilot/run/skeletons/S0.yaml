  strand: S0
- id: fraction.equivalent.same-point
  concept: fraction
  facet: measure
  level: 2
  type: concept
  name: Equivalent fractions as the same point on the number line
  statement: Two fractions are equivalent when they name the same point on the number line.
  assess: On this number line, 2/3 and 4/6 are marked. Are they equivalent? How do you know?
