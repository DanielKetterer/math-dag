notes: >-
  All 35 learning components are placed in node lc lists; some lc ids appear on
  more than one node, following S0 (a principle node and its procedure share
  the lc). Umbrella components are attached to the general nodes: 4aeee2dd
  (5.NF.B.4) to the product rule and the multiply procedure, 18ed149f
  (5.NF.B.5) to multiplication.scaling.resize, bfa79064 (5.NF.B.7) to both
  unit-fraction division compute procedures. 26645597 is a number-range variant
  of 46b4aaee and is merged into the same application node. Splits made under
  the calibration rules: 5.NF.B.4.a "equivalently" gives two meanings
  (parts-of-partition vs operation sequence); parts-of-partition is further
  split by whole-number q vs fraction q because partitioning a fraction into b
  parts needs unit-fraction division, which changes the prerequisites. 5.NF.B.6
  model (L2) and equation (L3) applications are separate nodes. Four nodes have
  lc: [] because they come from standard text with no component:
  fraction.mixed-number.multiplication (needed by 5.NF.B.6) and the two
  division explain nodes (5.NF.B.7.a/b examples ask to use the relationship
  between multiplication and division to explain). The tiling procedure uses
  squares of side 1/n over a common denominator n so that the tiles really are
  squares when the denominators differ (for example 2/3 by 3/4); tiles of size
  1/b by 1/d are the rectangle-based alternative. The 5.NF.A.1 general formula
  a/b + c/d = (ad + bc)/bd and a model-level (L2) unlike-denominator addition
  are not written as nodes (no component). Addition and subtraction word
  problems (5.NF.A.2) are each one L3 node since their components do not
  separate model from equation. Reviewer check: the existing example node
  fraction.division.symbolic was not read beyond its id and was not reused;
  if it covers fraction as division (5.NF.B.3) or unit-fraction division
  (5.NF.B.7), reconcile it with fraction.quotient.symbolic or the
  division.*.compute nodes. Statements write "divided by" in words because
  the division sign is not a plain keyboard character.
