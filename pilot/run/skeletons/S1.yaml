- id: partitioning.equal-shares.area
  concept: partitioning
  facet: area
  level: 1
  type: procedure
  name: Partition a circle or rectangle into equal shares
  statement: "Divide a circle or rectangle into n shares of the same size that together make up the whole with nothing left over (in grades 1-2, n is 2, 3, or 4)."
  procedure:
    - Decide how many shares, n, are needed.
    - For a rectangle, draw n - 1 straight lines across it, spaced so every strip has the same width.
    - For a circle, draw n straight cuts from the center to the edge, spaced evenly around the center.
    - Check that the shares are the same size and that together they make the whole.
  assess: "Draw lines to split this rectangle into 3 equal shares."
  sources: {ccss: ["1.G.A.3", "2.G.A.3"], lc: ["48273ab9", "a2011257", "8e30f23e", "4219c4aa", "88c9fab3"]}
  strand: S1
- id: partitioning.equal-shares.name
  concept: partitioning
  facet: area
  level: 1
  type: representation
  name: Name equal shares as halves, thirds, and fourths
  statement: "One of 2 equal shares of a whole is called a half of it, one of 3 equal shares a third of it, and one of 4 equal shares a fourth (or quarter) of it; the names apply only when the shares are equal."
  assess: "This circle is cut into 4 equal shares and one share is shaded. What word names the shaded share?"
  sources: {ccss: ["1.G.A.3", "2.G.A.3"], lc: ["48273ab9", "a2011257", "8e30f23e", "4219c4aa", "88c9fab3"]}
  strand: S1
- id: partitioning.equal-shares.whole-as-shares
  concept: partitioning
  facet: area
  level: 1
  type: concept
  name: The whole as all of its equal shares
  statement: "A whole partitioned into n equal shares is made of exactly n of those shares: two halves, three thirds, or four fourths make one whole."
  assess: "A sandwich is cut into fourths. How many fourths make the whole sandwich?"
  sources: {ccss: ["1.G.A.3", "2.G.A.3"], lc: ["213a7a8d", "d40094e3", "75be40c8"]}
  strand: S1
- id: partitioning.equal-shares.more-shares-smaller
  concept: partitioning
  facet: area
  level: 1
  type: concept
  name: More equal shares of the same whole are smaller
  statement: "For the same whole, partitioning into more equal shares makes each share smaller; a fourth of a shape is smaller than a half of the same shape."
  assess: "Two crackers are the same size. One is cut into halves and the other into fourths. Which is bigger, a half or a fourth?"
  sources: {ccss: ["1.G.A.3"], lc: ["b3badaf7"]}
  strand: S1
- id: partitioning.equal-shares.different-shapes
  concept: partitioning
  facet: area
  level: 1
  type: concept
  name: Equal shares need not have the same shape
  statement: "Shares of identical wholes are equal when they cover the same amount, even if they have different shapes."
  assess: "Two identical squares are each cut in half, one along a diagonal into triangles and one straight down the middle into rectangles. Is a triangle half the same amount as a rectangle half?"
  sources: {ccss: ["2.G.A.3"], lc: ["0b131675"]}
  strand: S1
- id: partitioning.equal-area.any-shape
  concept: partitioning
  facet: area
  level: 2
  type: procedure
  name: Partition a shape into parts with equal area
  statement: "Partition a shape into n parts that have the same area, checking equality by area (for example by counting unit squares) rather than by shape. The steps below work for any rectangle and any n; other shapes are split into pieces whose areas are then checked to be equal."
  procedure:
    - For a rectangle, partition one side into n equal lengths.
    - Through each mark, draw a line parallel to the adjacent side, making n strips.
    - Confirm the strips have equal area (same length and width, or the same number of unit squares).
  assess: "This 6-by-2 rectangle is drawn on a grid. Partition it into 6 parts with equal area and show how you know the areas are equal."
  sources: {ccss: ["3.G.A.2"], lc: ["1e26fb99"]}
  strand: S1
- id: measurement.length.no-gaps-overlaps
  concept: measurement
  facet: length
  level: 1
  type: concept
  name: Length as the number of units that span an object
  statement: "The length of an object in a given unit is the number of same-size copies of that unit that span it end to end with no gaps and no overlaps."
  assess: "Mia laid paper clips along a pencil with spaces between them and counted 5. Is the pencil 5 paper clips long? Why or why not?"
  sources: {ccss: ["1.MD.A.2"], lc: ["67bf1af6"]}
  strand: S1
- id: measurement.length.iterate-units
  concept: measurement
  facet: length
  level: 1
  type: procedure
  name: Measure length by laying units end to end
  statement: "Measure an object's length by laying same-size copies of a shorter unit end to end along it and counting them. At this level objects are chosen to be a whole number of units long; if the last copy overhangs the end, the length lies between two whole numbers of units."
  procedure:
    - Line up one end of the first copy of the unit with one end of the object.
    - Place each next copy so it starts exactly where the previous one ends, in a straight line along the object, with no gap and no overlap.
    - Stop when a copy reaches the other end of the object.
    - Count the copies; that whole number is the length in that unit.
  assess: "Use copies of this paper clip to find how long the marker is, in paper clips."
  sources: {ccss: ["1.MD.A.2"], lc: ["c325c592"]}
  strand: S1
- id: number-line.whole-number-lengths
  concept: number-line
  facet: core
  level: 2
  type: representation
  name: Whole numbers as lengths from 0 on a number line
  statement: "On a number line diagram with equally spaced points labeled 0, 1, 2, ..., the whole number n is represented by the length from 0 to the point labeled n, which is n unit lengths."
  assess: "On this number line, draw the length that shows 7."
  sources: {ccss: ["2.MD.B.6"], lc: ["0119f987"]}
  strand: S1
- id: addition.add-to.number-line
  concept: addition
  facet: add-to
  level: 2
  type: representation
  name: Represent a whole-number sum on a number line
  statement: "The sum a + b is shown on a number line by placing a length of b units end to end after the length from 0 to a; the endpoint is a + b."
  procedure:
    - Mark the length from 0 to a.
    - From a, mark a further length of b units to the right, in one jump or in smaller jumps that total b.
    - Read the label at the endpoint; it is a + b.
  assess: "Show 38 + 25 on a number line and find the sum."
  sources: {ccss: ["2.MD.B.6"], lc: ["5ca2749c", "59146f3f"]}
  strand: S1
- id: subtraction.take-away.number-line
  concept: subtraction
  facet: take-away
  level: 2
  type: representation
  name: Represent a whole-number difference by jumping back on a number line
  statement: "For whole numbers with b no greater than a, the difference a - b is shown by starting at a and moving b units to the left; the point reached is a - b."
  procedure:
    - Locate a on the number line.
    - From a, mark a length of b units to the left, in one jump or in smaller jumps that total b.
    - Read the label at the endpoint; it is a - b.
  assess: "Show 62 - 17 on a number line by jumping back from 62, and find the difference."
  sources: {ccss: ["2.MD.B.6"], lc: ["6075778b", "59146f3f"]}
  strand: S1
- id: subtraction.comparison.number-line
  concept: subtraction
  facet: comparison
  level: 2
  type: representation
  name: Represent a whole-number difference as a distance on a number line
  statement: "For whole numbers with b no greater than a, the difference a - b is the length of the segment from b to a on the number line."
  procedure:
    - Locate b and a on the number line.
    - Measure the length from b up to a, in one jump or in smaller jumps (for example to the next ten, then by tens).
    - The total length of the jumps is a - b.
  assess: "Use a number line to find how far it is from 48 to 73, and write the subtraction it shows."
  sources: {ccss: ["2.MD.B.6"], lc: ["6075778b", "59146f3f"]}
  strand: S1
- id: multiplication.equal-groups.meaning
  concept: multiplication
  facet: equal-groups
  level: 2
  type: concept
  name: A product as a number of equal groups
  statement: "For whole numbers a and b, a x b is the total number of objects in a groups with b objects in each group."
  assess: "In 5 x 7 = 35, counting objects in groups, what does the 5 stand for, what does the 7 stand for, and what does the 35 stand for?"
  sources: {ccss: ["3.OA.A.1"], lc: ["9a5c62b7", "a0174086"]}
  strand: S1
- id: multiplication.equal-groups.expression-to-situation
  concept: multiplication
  facet: equal-groups
  level: 2
  type: representation
  name: Match a multiplication expression to an equal-groups situation
  statement: "Given a x b, identify or describe a situation with a groups of b objects each whose total the expression gives."
  assess: "Which story is about 4 x 6? (A) 4 bags with 6 apples in each bag. (B) 4 apples and 6 more apples. (C) 6 apples shared among 4 bags."
  sources: {ccss: ["3.OA.A.1"], lc: ["9c0f3844", "fa260e04"]}
  strand: S1
- id: multiplication.equal-groups.situation-to-expression
  concept: multiplication
  facet: equal-groups
  level: 2
  type: representation
  name: Model an equal-groups situation and write a multiplication expression
  statement: "Represent an equal-groups situation with objects or a drawing and write it as a x b, where a is the number of groups and b is the number in each group."
  assess: "There are 7 boxes with 3 crayons in each box. Draw a picture and write a multiplication expression for the total number of crayons."
  sources: {ccss: ["3.OA.A.1"], lc: ["dc76aa42", "5ed8e4b9"]}
  strand: S1
- id: division.partitive.meaning
  concept: division
  facet: partitive
  level: 2
  type: concept
  name: A quotient as the size of each equal share
  statement: "When a objects are partitioned equally into b groups, the quotient a divided by b is the number of objects in each group."
  assess: "24 stickers are shared equally among 6 children, and 24 divided by 6 is 4. What does the 4 tell you?"
  sources: {ccss: ["3.OA.A.2"], lc: ["fabd7cd3", "ab83adaa"]}
  strand: S1
- id: division.measurement.meaning
  concept: division
  facet: measurement
  level: 2
  type: concept
  name: A quotient as the number of equal groups
  statement: "When a objects are put into equal groups of b objects each, the quotient a divided by b is the number of groups."
  assess: "24 stickers are put into packs of 6, and 24 divided by 6 is 4. What does the 4 tell you?"
  sources: {ccss: ["3.OA.A.2"], lc: ["6d81db77", "30398626"]}
  strand: S1
- id: division.partitive.situation-to-expression
  concept: division
  facet: partitive
  level: 2
  type: representation
  name: Model a sharing situation and write a division expression
  statement: "Represent a situation in which a objects are shared equally among b groups, with the size of each group unknown, using objects or a drawing, and write it as a divided by b."
  assess: "18 apples are shared equally among 3 baskets. Draw a picture and write a division expression for the number of apples in each basket."
  sources: {ccss: ["3.OA.A.2"], lc: ["7c6b812d", "5a4a44b7"]}
  strand: S1
- id: division.measurement.situation-to-expression
  concept: division
  facet: measurement
  level: 2
  type: representation
  name: Model a grouping situation and write a division expression
  statement: "Represent a situation in which a objects are put into groups of b, with the number of groups unknown, using objects or a drawing, and write it as a divided by b."
  assess: "18 apples are packed 3 to a bag. Draw a picture and write a division expression for the number of bags."
  sources: {ccss: ["3.OA.A.2"], lc: ["7c6b812d", "5a4a44b7"]}
  strand: S1
- id: division.partitive.expression-to-situation
  concept: division
  facet: partitive
  level: 2
  type: representation
  name: Match a division expression to a sharing situation
  statement: "Given a divided by b, identify or describe a situation in which a objects are shared equally among b groups and the quotient is the number in each group."
  assess: "Write a story in which 20 divided by 4 tells how many are in each group."
  sources: {ccss: ["3.OA.A.2"], lc: ["560b2136", "2dd98000"]}
  strand: S1
- id: division.measurement.expression-to-situation
  concept: division
  facet: measurement
  level: 2
  type: representation
  name: Match a division expression to a grouping situation
  statement: "Given a divided by b, identify or describe a situation in which a objects are put into groups of b and the quotient is the number of groups."
  assess: "Write a story in which 20 divided by 4 tells how many groups there are."
  sources: {ccss: ["3.OA.A.2"], lc: ["560b2136", "2dd98000"]}
  strand: S1
- id: division.unknown-factor.meaning
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: A quotient as an unknown factor
  statement: "For whole numbers a and b, with b not 0 and a a multiple of b, a divided by b is the whole number c for which b x c = a."
  assess: "Which multiplication fact shows that 42 divided by 7 is 6?"
  sources: {ccss: ["3.OA.B.6"], lc: []}
  strand: S1
- id: division.unknown-factor.rewrite
  concept: division
  facet: unknown-factor
  level: 3
  type: representation
  name: Rewrite a division problem as a multiplication with an unknown factor
  statement: "The division problem a divided by b = ? is rewritten as the multiplication problem b x ? = a, with the same unknown."
  assess: "Write 32 divided by 8 = ? as a multiplication problem with an unknown factor."
  sources: {ccss: ["3.OA.B.6"], lc: ["3ad29867"]}
  strand: S1
- id: division.unknown-factor.find-quotient
  concept: division
  facet: unknown-factor
  level: 3
  type: procedure
  name: Find a quotient by finding an unknown factor
  statement: "Find a divided by b by finding the unknown factor in b x ? = a. This gives a whole-number quotient only when b is not 0 and a is a multiple of b; otherwise skip-counting by b passes a without landing on it."
  procedure:
    - Rewrite a divided by b = ? as b x ? = a.
    - Find the whole number that makes b x ? = a true, by recalling a multiplication fact or by skip-counting by b from 0 until reaching a and counting the skips.
    - That number is the quotient.
  assess: "Find 56 divided by 8 by thinking of a multiplication fact. Write the fact you used."
  sources: {ccss: ["3.OA.B.6"], lc: ["6c50e14a"]}
  strand: S1
