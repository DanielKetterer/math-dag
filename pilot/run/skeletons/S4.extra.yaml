new_concepts:
  - {concept: percent, facet: rate-per-100, reason: "6.RP.A.3.c and 7.RP.A.3 treat percent as a rate per 100 and build a family of problem types on it (percent of, find the whole, markup, tax, tip, discount, percent change). It could instead be a facet of ratio, but percent has its own later uses (percent change, growth) that make a separate concept cleaner."}
  - {concept: linear-function, facet: line, reason: "8.EE.B.6 is about equations of lines in the coordinate plane (y = mx, y = mx + b) as geometric objects; this is neither slope alone nor a proportional relationship (b may be nonzero)."}
  - {concept: linear-function, facet: model, reason: "8.F.B.4 uses a linear function as a model of a situation, with rate of change and initial value read and interpreted in context; a different meaning from the line-equation facet."}
covered_by: []
dropped: []
notes: >-
  (1) fraction.division.symbolic is one of the four example nodes; this strand owns 6.NS.A.1, so it is
  rewritten here with the same id, now with concept division, facet unknown-factor (its id still starts
  with "fraction", kept for compatibility). (2) Several nodes have empty lc lists because the standard text
  names an idea no learning component covers but other nodes clearly need: the partitive and unknown-factor
  meanings of fraction division, the visual-model procedure, the general rule as a claim (separate from its
  use), the check-by-multiplication justification, tape diagrams and double number lines (6.RP.A.3),
  percent as a rate per 100, the constant of proportionality as a concept, slope between two points, slope
  constancy as a claim, and the two derivations in 8.EE.B.6. (3) lc 63c4ca02 "Interpret quotients of
  fractions" was attached to the measurement meaning only; reviewers may want to also credit the partitive
  node. (4) Number-range and context variants were merged per rule 4: unit pricing vs constant speed;
  mathematical vs real-world contexts in 6.RP.A.3, 7.RP.A.1 and 8.F.B.4; markup, tax and tip; percent
  increase and decrease. Discount was kept separate from markup/tax/tip because subtracting a percent of a
  base is a distinct problem type. (5) Rate of change and initial value were split by input form (two
  values from a table or graph vs verbal description) because the procedures differ, not just the numbers.
  (6) "Determine whether two quantities are in a proportional relationship" (539cab15) and "Recognize
  proportional relationships" (b02c3de8) were attached to the definition node; the table and graph tests
  are separate procedure nodes. (7) "Represent proportional relationships" (91a4d15a, 7.RP.A.2) is attached
  to the equation node y = kx; it could equally be credited to the table and graph nodes.
