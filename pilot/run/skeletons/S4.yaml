# Strand S4: grade 6 ratio, rate and fraction division; grade 7 proportional
# relationships and percent; grade 8 slope, rate of change and linear models.

# ---------------------------------------------------------------- 6.NS.A.1
- id: division.fractions.measurement
  concept: division
  facet: measurement
  level: 2
  type: concept
  name: "Fraction division as how many groups of c/d make a/b"
  statement: "a/b divided by c/d is the number of groups of size c/d that make up a/b, where a leftover amount counts as the fraction of a group it fills."
  assess: "Write a division expression for 'How many 3/4-cup servings are in 2/3 cup of yogurt?' and say what the quotient counts."
  sources: {ccss: ["6.NS.A.1"], lc: ["63c4ca02"]}
  strand: S4

- id: division.fractions.partitive
  concept: division
  facet: partitive
  level: 2
  type: concept
  name: "Fraction division as the amount in one whole group"
  statement: "a/b divided by c/d is the amount in one whole group when c/d of a group holds the amount a/b."
  assess: "3/4 of a jug holds 1/2 gallon. Write a division expression for how much the full jug holds and say what the quotient measures."
  sources: {ccss: ["6.NS.A.1"], lc: []}
  strand: S4

- id: division.fractions.unknown-factor
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: "Fraction division as finding the unknown factor"
  statement: "For fractions a/b and c/d with c not 0, a/b divided by c/d is the number q for which (c/d) x q = a/b."
  assess: "Write the multiplication equation with an unknown that matches (2/3) divided by (3/4) = ?. Then decide whether 8/9 is the answer by using that equation."
  sources: {ccss: ["6.NS.A.1"], lc: []}
  strand: S4

- id: division.fractions.measurement.model
  concept: division
  facet: measurement
  level: 2
  type: procedure
  name: "Divide fractions with a visual fraction model"
  statement: "Find a/b divided by c/d by cutting the whole into b x d equal parts, so both fractions are counted in the same parts, and finding how many groups the size of c/d fit in a/b."
  procedure:
    - "Draw a whole and partition it into b x d equal parts."
    - "Shade a/b of the whole; it covers a x d of the parts. Mark c/d; it covers c x b of the parts."
    - "Count how many full groups of c x b parts fit in the a x d shaded parts."
    - "If r parts are left over, they make r/(c x b) of a group."
    - "The quotient is the number of full groups plus r/(c x b)."
  assess: "Use a visual fraction model to find (3/4) divided by (1/6)."
  sources: {ccss: ["6.NS.A.1"], lc: []}
  strand: S4

- id: division.fractions.rule
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: "The rule (a/b) divided by (c/d) = (a x d)/(b x c)"
  statement: "For any fractions a/b and c/d with b, c, d not 0, (a/b) divided by (c/d) = (a x d)/(b x c)."
  assess: "True or false: (2/5) divided by (3/7) = 14/15. True or false: (2/5) divided by (3/7) = 6/35. Say which rule decides it."
  sources: {ccss: ["6.NS.A.1"], lc: []}
  strand: S4

- id: fraction.division.symbolic
  concept: division
  facet: unknown-factor
  level: 3
  type: procedure
  name: "Divide fractions with the rule (a/b) divided by (c/d) = (a x d)/(b x c)"
  statement: "Compute a quotient of two fractions, the divisor not 0, by multiplying the dividend by the reciprocal of the divisor."
  procedure:
    - "Check that the divisor c/d is not 0 (c is not 0)."
    - "Rewrite (a/b) divided by (c/d) as (a/b) x (d/c)."
    - "Multiply numerators and denominators to get (a x d)/(b x c), and simplify if asked."
  assess: "Compute (5/6) divided by (5/12) and (2/3) divided by (3/4)."
  sources: {ccss: ["6.NS.A.1"], lc: ["bc5dfb39"]}
  strand: S4

- id: division.fractions.check-by-multiplication
  concept: division
  facet: unknown-factor
  level: 3
  type: justification
  name: "Justify a fraction quotient by multiplying back"
  statement: "A claimed quotient q of a/b divided by c/d is correct because (c/d) x q = a/b, by the relationship between multiplication and division."
  assess: "Explain, using multiplication, why (2/3) divided by (3/4) = 8/9."
  sources: {ccss: ["6.NS.A.1"], lc: []}
  strand: S4

- id: division.fractions.application.model
  concept: division
  facet: measurement
  level: 2
  type: application
  name: "Solve fraction-by-fraction division story problems with a visual model"
  statement: "A story problem asks how many groups of one fractional size fit in a fractional amount; the learner represents it with a visual fraction model and reads off the quotient."
  assess: "How many 3/4-cup servings are in 2/3 cup of yogurt? Draw a model and answer."
  sources: {ccss: ["6.NS.A.1"], lc: ["5f4d46ea"]}
  strand: S4

- id: division.fractions.application.equation
  concept: division
  facet: unknown-factor
  level: 3
  type: application
  name: "Solve fraction-by-fraction division story problems with an equation"
  statement: "A story problem relates two known fractions by division; the learner writes an equation such as (c/d) x ? = a/b or (a/b) divided by (c/d) = ? and solves it."
  assess: "A rectangular strip of land has length 3/4 mi and area 1/2 square mi. Write an equation and find its width."
  sources: {ccss: ["6.NS.A.1"], lc: ["b15981ec", "133abb93"]}
  strand: S4

# ---------------------------------------------------------------- 6.RP.A.1
- id: ratio.composed-unit
  concept: ratio
  facet: composed-unit
  level: 2
  type: concept
  name: "A ratio as 'for every a, there are b'"
  statement: "A ratio relationship of a to b between two quantities means that for every a units of the first quantity there are b units of the second."
  assess: "The ratio of wings to beaks in the zoo bird house is 2:1. Describe what this means using 'for every'."
  sources: {ccss: ["6.RP.A.1"], lc: ["70393172"]}
  strand: S4

- id: ratio.notation
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: "Write a ratio as a:b or a to b"
  statement: "A ratio of a units of the first quantity to b units of the second is written a:b or 'a to b', with the quantities in the stated order."
  assess: "A class has 12 girls and 15 boys. Write the ratio of boys to girls."
  sources: {ccss: ["6.RP.A.1"], lc: ["6e6acf93"]}
  strand: S4

- id: ratio.equivalent
  concept: ratio
  facet: composed-unit
  level: 2
  type: concept
  name: "Equivalent ratios"
  statement: "Two ratios a:b and c:d are equivalent when there is one positive number n with c = n x a and d = n x b; they describe the same relationship between the quantities."
  assess: "Are 4:6 and 10:15 equivalent ratios? If so, find the number n."
  sources: {ccss: ["6.RP.A.1"], lc: ["ff25751a"]}
  strand: S4

# ---------------------------------------------------------------- 6.RP.A.2
- id: ratio.unit-rate
  concept: ratio
  facet: unit-rate
  level: 3
  type: concept
  name: "The unit rate a/b of a ratio a:b"
  statement: "For a ratio a:b with b not 0, the unit rate is a/b: the amount of the first quantity for 1 unit of the second."
  assess: "The ratio of miles to hours for a trip is 150:4. What is the unit rate, and what does it mean?"
  sources: {ccss: ["6.RP.A.2"], lc: ["db4c25ad"]}
  strand: S4

- id: ratio.unit-rate.language
  concept: ratio
  facet: unit-rate
  level: 2
  type: representation
  name: "Describe a ratio with rate language"
  statement: "A ratio relationship a:b is described with rate language as 'a/b units of the first quantity per (or for each) 1 unit of the second'."
  assess: "A recipe uses 3 cups of flour for 4 cups of sugar. Write one sentence using 'per' about flour and sugar, and another about sugar and flour."
  sources: {ccss: ["6.RP.A.2"], lc: ["523d04e7"]}
  strand: S4

- id: ratio.unit-rate.find
  concept: ratio
  facet: unit-rate
  level: 3
  type: procedure
  name: "Find a unit rate from a ratio of whole numbers"
  statement: "Find the unit rate of a ratio a:b, b not 0, by dividing a by b and naming the result in units of the first quantity per unit of the second."
  procedure:
    - "Identify the two quantities and which is 'per' which."
    - "Divide the first quantity's value a by the second's value b."
    - "Label the result as units of the first quantity per 1 unit of the second."
  assess: "A 12-pack of juice costs $9. Find the cost per can."
  sources: {ccss: ["6.RP.A.2"], lc: ["b9b94f31"]}
  strand: S4

# ---------------------------------------------------------------- 6.RP.A.3
- id: ratio.tape-diagram
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: "Represent a ratio with a tape diagram"
  statement: "A ratio a:b is drawn as two tapes made of a and b equal-size units; when a total or one quantity is known, dividing it by its number of units gives the unit size."
  procedure:
    - "Draw a tape of a equal units for the first quantity and a tape of b equal units for the second."
    - "Mark the known amount on the units it covers (one tape, or both tapes for a total)."
    - "Divide the known amount by the number of units it covers to get the unit size."
    - "Multiply the unit size by the number of units of the quantity asked for."
  assess: "The ratio of red to blue marbles is 3:5 and there are 40 marbles. Use a tape diagram to find how many are red."
  sources: {ccss: ["6.RP.A.3"], lc: []}
  strand: S4

- id: ratio.double-number-line
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: "Represent a ratio with a double number line"
  statement: "A ratio relationship is drawn as two parallel number lines, one per quantity, with aligned tick marks at pairs of values in equivalent ratios, starting from 0 aligned with 0."
  assess: "A car travels 150 miles on 5 gallons. Use a double number line to find how far it travels on 2 gallons."
  sources: {ccss: ["6.RP.A.3"], lc: []}
  strand: S4

- id: ratio.application.missing-value
  concept: ratio
  facet: composed-unit
  level: 2
  type: application
  name: "Solve ratio problems that give a ratio and one quantity"
  statement: "A real-world or mathematical problem gives a ratio between two quantities and one value of one quantity; the learner uses ratio reasoning (table, tape diagram, double number line, or equation) to find the corresponding value."
  assess: "A recipe uses 3 cups of flour for every 2 eggs. How many cups of flour are needed for 10 eggs?"
  sources: {ccss: ["6.RP.A.3"], lc: ["c869a6c1", "5b9cd29a"]}
  strand: S4

# ---------------------------------------------------------------- 6.RP.A.3.a
- id: ratio.table.make
  concept: ratio
  facet: composed-unit
  level: 2
  type: procedure
  name: "Make a table of equivalent ratios"
  statement: "From a ratio a:b, given directly or read from a description, build a table whose rows are pairs of whole-number values in equivalent ratios."
  procedure:
    - "Write the ratio a:b as the first row, one column per quantity."
    - "For n = 2, 3, 4, ..., add the row (n x a) : (n x b)."
  assess: "A paint mix uses 2 cans of blue for every 3 cans of yellow. Make a table with four rows of equivalent ratios."
  sources: {ccss: ["6.RP.A.3.a"], lc: ["1da2eafe", "6808344c", "96529518"]}
  strand: S4

- id: ratio.table.missing-value
  concept: ratio
  facet: composed-unit
  level: 2
  type: procedure
  name: "Find a missing value in a ratio table"
  statement: "Find a missing entry in a ratio table by multiplying both entries of a complete row by the same number, chosen to produce the known entry of the incomplete row."
  procedure:
    - "Pick a complete row (p, q) of the table."
    - "In the incomplete row, take the known entry and divide it by the entry of the complete row in the same column; call the result n (n may be a fraction)."
    - "Multiply the other entry of the complete row by n to get the missing value."
  assess: "A ratio table has the row 4 : 6. Find the missing value in the row ? : 9."
  sources: {ccss: ["6.RP.A.3.a"], lc: ["23e8528c"]}
  strand: S4

- id: ratio.table.plot
  concept: ratio
  facet: composed-unit
  level: 2
  type: representation
  name: "Plot the pairs of a ratio table on the coordinate plane"
  statement: "Each row (x, y) of a ratio table is plotted as the point (x, y), with the first quantity on the horizontal axis and the second on the vertical axis."
  procedure:
    - "Label the horizontal axis with the first quantity and the vertical axis with the second."
    - "For each row (x, y), plot the point x units right and y units up from the origin."
  assess: "Plot the pairs from this table of cups of rice to cups of water: 1:2, 2:4, 3:6, 4:8."
  sources: {ccss: ["6.RP.A.3.a"], lc: ["8074c052", "31d1aa9e"]}
  strand: S4

- id: ratio.table.compare
  concept: ratio
  facet: composed-unit
  level: 2
  type: procedure
  name: "Compare two ratios with tables"
  statement: "Compare ratios a:b and c:d by extending both tables to rows with the same value of the first quantity and comparing the values of the second quantity there."
  procedure:
    - "Make a table of equivalent ratios for each ratio."
    - "Extend both tables until they share a value of the first quantity (a common multiple of a and c always works)."
    - "In those rows, the ratio with the larger second value has more of the second quantity per unit of the first."
  assess: "Mix A uses 3 cups of juice to 5 cups of water; Mix B uses 4 cups of juice to 7 cups of water. Use tables to decide which mix has more water for the same amount of juice."
  sources: {ccss: ["6.RP.A.3.a"], lc: ["05492c78"]}
  strand: S4

# ---------------------------------------------------------------- 6.RP.A.3.b
- id: ratio.application.unit-rate
  concept: ratio
  facet: unit-rate
  level: 3
  type: application
  name: "Solve unit rate problems (unit pricing, constant speed)"
  statement: "A problem gives a rate as a pair of amounts (cost and items, distance and time, work and time); the learner finds the unit rate and uses it to find another amount at the same rate."
  assess: "It took 7 hours to mow 4 lawns. At that rate, how many lawns could be mowed in 35 hours, and at what rate were lawns mowed?"
  sources: {ccss: ["6.RP.A.3.b"], lc: ["3c9af449", "37ee8b36", "29e60e03"]}
  strand: S4

# ---------------------------------------------------------------- 6.RP.A.3.c
- id: percent.rate-per-100
  concept: percent
  facet: rate-per-100
  level: 2
  type: concept
  name: "Percent as a rate per 100"
  statement: "p percent of a quantity means p parts for every 100 equal parts of that quantity."
  assess: "On a 10 by 10 grid, shade 35% of the grid. What does 35% mean in terms of the 100 squares?"
  sources: {ccss: ["6.RP.A.3.c"], lc: []}
  strand: S4

- id: percent.of-quantity
  concept: percent
  facet: rate-per-100
  level: 3
  type: procedure
  name: "Find a percent of a quantity"
  statement: "p percent of a quantity Q is (p/100) x Q."
  procedure:
    - "Write p percent as the rate p/100."
    - "Multiply p/100 by Q."
  assess: "Find 35% of 60."
  sources: {ccss: ["6.RP.A.3.c"], lc: ["c75962da"]}
  strand: S4

- id: percent.application.find-whole
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: "Find the whole given a part and the percent"
  statement: "A problem gives a part and the percent of the whole that it is; the learner finds the whole W from (p/100) x W = part."
  assess: "18 students walk to school. That is 30% of the class. How many students are in the class?"
  sources: {ccss: ["6.RP.A.3.c"], lc: ["e6525dd8"]}
  strand: S4

# ---------------------------------------------------------------- 6.RP.A.3.d
- id: ratio.conversion-factor
  concept: ratio
  facet: unit-rate
  level: 3
  type: concept
  name: "A conversion factor is a ratio of equal measurements"
  statement: "A conversion factor is a ratio of two equal measurements in different units, such as 12 in : 1 ft, so multiplying a measurement by (12 in)/(1 ft) changes its unit without changing its size."
  assess: "To change 5 ft to inches, should you multiply by (12 in)/(1 ft) or by (1 ft)/(12 in)? Why does the length stay the same?"
  sources: {ccss: ["6.RP.A.3.d"], lc: ["534e2e4c"]}
  strand: S4

- id: ratio.convert-units
  concept: ratio
  facet: unit-rate
  level: 3
  type: procedure
  name: "Convert measurement units with conversion factors"
  statement: "Convert a measurement by multiplying it by one or more conversion factors, each written with the unit to remove in the denominator, and cancelling units like common factors."
  procedure:
    - "Write the measurement with its unit."
    - "Multiply by a conversion factor whose denominator has the current unit and whose numerator has the next unit."
    - "Cancel the matching units and multiply the numbers."
    - "Repeat until the result is in the target unit."
  assess: "How many inches are in 2.5 yards? (1 yd = 3 ft, 1 ft = 12 in)"
  sources: {ccss: ["6.RP.A.3.d"], lc: ["18baa937"]}
  strand: S4

# ---------------------------------------------------------------- 7.RP.A.1
- id: ratio.unit-rate.fractions
  concept: ratio
  facet: unit-rate
  level: 3
  type: procedure
  name: "Compute a unit rate from a ratio of fractions"
  statement: "For a rate of a/b units of one quantity per c/d units of another, with c not 0, the unit rate is the complex fraction (a/b)/(c/d), computed by fraction division."
  procedure:
    - "Write the rate as (a/b)/(c/d), the first quantity over the second."
    - "Compute (a/b) divided by (c/d) by fraction division."
    - "Label the result as units of the first quantity per 1 unit of the second."
  assess: "A painter covers 2/3 of a wall in 3/4 of an hour. Find the unit rate in walls per hour."
  sources: {ccss: ["7.RP.A.1"], lc: ["84257a01", "5b1f724c", "863028c4"]}
  strand: S4

# ---------------------------------------------------------------- 7.RP.A.2 and 7.RP.A.2.a
- id: proportional-relationship.definition
  concept: proportional-relationship
  facet: core
  level: 3
  type: concept
  name: "What a proportional relationship is"
  statement: "Two quantities x and y are in a proportional relationship when the quotient y/x has the same value for every pair of corresponding values with x not 0, and y = 0 when x = 0."
  assess: "A gym charges $20 to join plus $10 per visit. Is the total cost proportional to the number of visits? Explain using the definition."
  sources: {ccss: ["7.RP.A.2", "7.RP.A.2.a"], lc: ["b02c3de8", "539cab15"]}
  strand: S4

- id: proportional-relationship.test.table
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: "Decide from a table whether a relationship is proportional"
  statement: "A table shows a proportional relationship exactly when y/x is the same for every row with x not 0 and every row with x = 0 has y = 0."
  procedure:
    - "For each row with x not 0, compute y/x."
    - "Check that every row with x = 0 has y = 0."
    - "The relationship is proportional exactly when all the quotients are equal and the check in step 2 holds."
  assess: "Is this relationship proportional? x: 2, 4, 6; y: 3, 6, 10."
  sources: {ccss: ["7.RP.A.2.a"], lc: ["dad3591d"]}
  strand: S4

- id: proportional-relationship.test.graph
  concept: proportional-relationship
  facet: core
  level: 2
  type: procedure
  name: "Decide from a graph whether a relationship is proportional"
  statement: "A graph shows a proportional relationship exactly when its points lie on a single straight line that passes through the origin."
  procedure:
    - "Check whether all plotted points lie on one straight line."
    - "Check whether that line passes through (0, 0)."
    - "The relationship is proportional exactly when both checks hold."
  assess: "Graph A is a line through (0, 1) and (2, 5). Graph B is a line through (0, 0) and (3, 4). Which shows a proportional relationship?"
  sources: {ccss: ["7.RP.A.2.a"], lc: ["e979a208"]}
  strand: S4

# ---------------------------------------------------------------- 7.RP.A.2.b
- id: proportional-relationship.constant
  concept: proportional-relationship
  facet: core
  level: 3
  type: concept
  name: "The constant of proportionality"
  statement: "In a proportional relationship between x and y, the common value k of y/x is the constant of proportionality; it is the unit rate, the amount of y for 1 unit of x."
  assess: "For a proportional relationship, 5 pounds of apples cost $7.50. What is the constant of proportionality for cost per pound, and what does it mean?"
  sources: {ccss: ["7.RP.A.2.b"], lc: []}
  strand: S4

- id: proportional-relationship.constant.from-values
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: "Find the constant of proportionality from a table or description"
  statement: "Given a proportional relationship as a table or a verbal description of corresponding values, k is the y-value divided by the x-value for any pair with x not 0."
  procedure:
    - "Decide which quantity is y and which is x (y per x)."
    - "Take any pair of corresponding values with x not 0."
    - "Compute k = y/x."
  assess: "8 movie tickets cost $30, and cost is proportional to the number of tickets. Find the constant of proportionality for cost per ticket."
  sources: {ccss: ["7.RP.A.2.b"], lc: ["a205a83d", "8c8b40c3"]}
  strand: S4

- id: proportional-relationship.constant.graph
  concept: proportional-relationship
  facet: core
  level: 2
  type: procedure
  name: "Find the constant of proportionality from a graph"
  statement: "For the graph of a proportional relationship, k is y/x for any point (x, y) on the line other than the origin."
  procedure:
    - "Choose a point (x, y) on the line, other than (0, 0), whose coordinates can be read exactly."
    - "Compute k = y/x."
  assess: "A proportional graph is a line through (0, 0) and (2, 5). Find the constant of proportionality."
  sources: {ccss: ["7.RP.A.2.b"], lc: ["5ec9f641"]}
  strand: S4

- id: proportional-relationship.constant.equation
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: "Find the constant of proportionality from an equation"
  statement: "When a proportional relationship's equation is written as y = kx, the constant of proportionality is the coefficient k of x."
  procedure:
    - "If needed, rewrite the equation in the form y = kx."
    - "Read k as the coefficient of x."
  assess: "Find the constant of proportionality in y = x/3 and in 2y = 7x."
  sources: {ccss: ["7.RP.A.2.b"], lc: ["3c7dcfad"]}
  strand: S4

- id: proportional-relationship.constant.diagram
  concept: proportional-relationship
  facet: core
  level: 2
  type: procedure
  name: "Find the constant of proportionality from a diagram"
  statement: "On a tape diagram or double number line of a proportional relationship, k is the y-amount aligned with 1 unit of x."
  procedure:
    - "Find a marked pair: y-amount aligned with x-amount."
    - "Partition the x-amount into that many units of 1, and the y-amount into the same number of equal parts."
    - "The y-amount of one part is k."
  assess: "A double number line shows $15 aligned with 6 pounds. What is the cost per pound?"
  sources: {ccss: ["7.RP.A.2.b"], lc: ["e927647f"]}
  strand: S4

# ---------------------------------------------------------------- 7.RP.A.2.c
- id: proportional-relationship.equation.write
  concept: proportional-relationship
  facet: core
  level: 3
  type: representation
  name: "Represent a proportional relationship with y = kx"
  statement: "A proportional relationship with constant of proportionality k is represented by the equation y = kx, with the variables naming the two quantities."
  procedure:
    - "Name the variables for the two quantities, y for the one expressed per unit of the other."
    - "Find the constant of proportionality k."
    - "Write y = kx."
  assess: "Total cost t is proportional to the number n of notebooks bought at $2.25 each. Write an equation for t in terms of n."
  sources: {ccss: ["7.RP.A.2", "7.RP.A.2.c"], lc: ["0070d7c9", "91a4d15a"]}
  strand: S4

# ---------------------------------------------------------------- 7.RP.A.2.d
- id: proportional-relationship.graph.point-meaning
  concept: proportional-relationship
  facet: core
  level: 2
  type: justification
  name: "Explain what a point (x, y) on a proportional graph means"
  statement: "A point (x, y) on the graph of a proportional relationship means that x units of the first quantity correspond to y units of the second in the situation."
  assess: "A graph of a cyclist's distance d (miles) against time t (hours) is a line through (0, 0) and (3, 36). Explain what the point (3, 36) means."
  sources: {ccss: ["7.RP.A.2.d"], lc: ["7829e94a"]}
  strand: S4

- id: proportional-relationship.graph.origin-meaning
  concept: proportional-relationship
  facet: core
  level: 2
  type: justification
  name: "Explain what (0, 0) on a proportional graph means"
  statement: "The point (0, 0) on the graph of a proportional relationship means that zero units of the first quantity correspond to zero units of the second."
  assess: "The graph of cost against pounds of grapes is a line through (0, 0) and (4, 10). Explain what (0, 0) means in this situation."
  sources: {ccss: ["7.RP.A.2.d"], lc: ["9ff22c5d"]}
  strand: S4

- id: proportional-relationship.graph.unit-rate-point
  concept: proportional-relationship
  facet: core
  level: 2
  type: justification
  name: "Explain what (1, r) on a proportional graph means"
  statement: "The point (1, r) on the graph of a proportional relationship means that 1 unit of the first quantity corresponds to r units of the second, so r is the unit rate."
  assess: "A graph of pages read against hours passes through (1, 12). Explain what this point means and how it relates to the unit rate."
  sources: {ccss: ["7.RP.A.2.d"], lc: ["db5f1010"]}
  strand: S4

# ---------------------------------------------------------------- 7.RP.A.3
- id: ratio.application.multistep
  concept: ratio
  facet: composed-unit
  level: 3
  type: application
  name: "Solve multi-step ratio problems"
  statement: "A problem needs two or more steps of ratio reasoning, such as finding parts from a part-to-part ratio and a total, then comparing or combining them."
  assess: "The ratio of boys to girls in a class of 32 is 3:5. How many more girls than boys are there?"
  sources: {ccss: ["7.RP.A.3"], lc: ["da9fc2c7"]}
  strand: S4

- id: percent.application.multistep
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: "Solve multi-step percent problems"
  statement: "A problem applies two or more percents in sequence, each to the result of the previous step, so the combined effect is not the sum of the percents."
  assess: "A $100 item is discounted 20%, then the sale price is discounted another 10%. What is the final price, and what single percent discount is that?"
  sources: {ccss: ["7.RP.A.3"], lc: ["fda5f0e0"]}
  strand: S4

- id: percent.application.increase-amount
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: "Find a total after adding a percent of a base (markup, tax, tip)"
  statement: "A problem adds one or more percents of a base amount to it, such as a markup, sales tax, or tip; the learner finds each percent of the base and the resulting total."
  assess: "A meal costs $40. Sales tax is 6% and the tip is 18%, both of the $40. What is the total?"
  sources: {ccss: ["7.RP.A.3"], lc: ["3b368729", "3334f873", "6cd0042b", "82a776bd"]}
  strand: S4

- id: percent.application.decrease-amount
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: "Find a sale price after a percent discount"
  statement: "A problem takes a percent of an original price off as a discount; the learner finds the discount and the resulting sale price."
  assess: "Shoes that cost $80 are 25% off. What are the discount and the sale price?"
  sources: {ccss: ["7.RP.A.3"], lc: ["f5370e05"]}
  strand: S4

- id: percent.application.percent-change
  concept: percent
  facet: rate-per-100
  level: 3
  type: application
  name: "Find a percent increase or decrease"
  statement: "A problem gives an original and a new amount; the learner finds the percent change as (new - original)/original x 100, always relative to the original amount."
  assess: "A price drops from $50 to $40. What is the percent decrease?"
  sources: {ccss: ["7.RP.A.3"], lc: ["892d2a63", "93360b70"]}
  strand: S4

# ---------------------------------------------------------------- 8.EE.B.5
- id: proportional-relationship.graph.make
  concept: proportional-relationship
  facet: core
  level: 3
  type: representation
  name: "Graph a proportional relationship"
  statement: "The graph of a proportional relationship y = kx is the line through the origin and the point (1, k)."
  procedure:
    - "Plot (0, 0)."
    - "Plot (x, k x x) for one convenient x not 0."
    - "Draw the line through the two points (only the part where both quantities make sense, if the situation restricts them)."
  assess: "Graph y = 2.5x for x from 0 to 4."
  sources: {ccss: ["8.EE.B.5"], lc: ["0edaa02c"]}
  strand: S4

- id: slope.unit-rate
  concept: slope
  facet: core
  level: 3
  type: concept
  name: "The slope of a proportional graph is the unit rate"
  statement: "The slope of the graph of a proportional relationship y = kx equals its unit rate k."
  assess: "The graph of cost against pounds is a line through (0, 0) and (4, 10). Find its slope and say what it means as a rate."
  sources: {ccss: ["8.EE.B.5"], lc: ["c7ca6f31"]}
  strand: S4

- id: proportional-relationship.compare.representations
  concept: proportional-relationship
  facet: core
  level: 3
  type: procedure
  name: "Compare two proportional relationships given in different forms"
  statement: "Compare two proportional relationships given in different forms (table, graph, equation, description) by finding the unit rate of each and comparing the unit rates."
  procedure:
    - "Find the unit rate of the first relationship from its form."
    - "Find the unit rate of the second relationship from its form, in the same units."
    - "The relationship with the greater unit rate has more of y per unit of x."
  assess: "Car A's distance is d = 55t. Car B's distance-time graph is a line through (0, 0) and (4, 230). Which car is faster?"
  sources: {ccss: ["8.EE.B.5"], lc: ["fbbff3cd"]}
  strand: S4

# ---------------------------------------------------------------- 8.EE.B.6
- id: slope.between-two-points
  concept: slope
  facet: core
  level: 3
  type: concept
  name: "Slope between two points"
  statement: "The slope between two points (x1, y1) and (x2, y2) with x1 not equal to x2 is (y2 - y1)/(x2 - x1), the vertical change divided by the horizontal change."
  assess: "Find the slope between (2, 5) and (6, -3)."
  sources: {ccss: ["8.EE.B.6"], lc: []}
  strand: S4

- id: slope.constant-on-line
  concept: slope
  facet: core
  level: 3
  type: concept
  name: "Slope is the same between any two points of a line"
  statement: "For a non-vertical line, the slope between any two distinct points on it has the same value, called the slope m of the line."
  assess: "A(0, 1), B(2, 4), and C(6, 10) lie on one line. What must be true of the slopes AB, BC, and AC? Check by computing."
  sources: {ccss: ["8.EE.B.6"], lc: []}
  strand: S4

- id: slope.constant-on-line.explain
  concept: slope
  facet: core
  level: 4
  type: justification
  name: "Explain with similar triangles why slope is constant on a line"
  statement: "For two pairs of distinct points on a non-vertical line, the right triangles formed by each pair's horizontal and vertical changes are similar, so the ratios of vertical to horizontal change are equal."
  assess: "Use similar triangles to explain why the slope between any two distinct points on a non-vertical line is the same."
  sources: {ccss: ["8.EE.B.6"], lc: ["650c0c11"]}
  strand: S4

- id: linear-function.line.y-mx.write
  concept: linear-function
  facet: line
  level: 3
  type: representation
  name: "Write y = mx for a line through the origin"
  statement: "A non-vertical line through the origin with slope m has the equation y = mx."
  procedure:
    - "Read a point (x, y) on the line other than the origin."
    - "Compute m = y/x."
    - "Write y = mx."
  assess: "A line passes through the origin and (4, 6). Write its equation."
  sources: {ccss: ["8.EE.B.6"], lc: ["c931c413"]}
  strand: S4

- id: linear-function.line.y-mx.derive
  concept: linear-function
  facet: line
  level: 4
  type: justification
  name: "Derive y = mx for a line through the origin"
  statement: "For any point (x, y) other than the origin on a non-vertical line through the origin with slope m, the slope from (0, 0) to (x, y) is y/x = m, so y = mx; the origin also satisfies y = mx."
  assess: "A line through the origin has slope 3. Explain why every point (x, y) on it satisfies y = 3x."
  sources: {ccss: ["8.EE.B.6"], lc: []}
  strand: S4

- id: linear-function.line.y-mx-plus-b.write
  concept: linear-function
  facet: line
  level: 3
  type: representation
  name: "Write y = mx + b for a line not through the origin"
  statement: "A non-vertical line with slope m that crosses the vertical axis at (0, b) has the equation y = mx + b."
  procedure:
    - "Read two points (x1, y1) and (x2, y2) on the line."
    - "Compute m = (y2 - y1)/(x2 - x1)."
    - "Compute b = y1 - m x x1."
    - "Write y = mx + b."
  assess: "A line passes through (2, 5) and (6, 7). Write its equation."
  sources: {ccss: ["8.EE.B.6"], lc: ["3e7febf4"]}
  strand: S4

- id: linear-function.line.y-mx-plus-b.derive
  concept: linear-function
  facet: line
  level: 4
  type: justification
  name: "Derive y = mx + b for a line crossing the vertical axis at b"
  statement: "For any point (x, y) with x not 0 on a non-vertical line with slope m through (0, b), the slope from (0, b) to (x, y) is (y - b)/x = m, so y = mx + b; the point (0, b) also satisfies it."
  assess: "A line has slope 2 and crosses the vertical axis at (0, -3). Explain why every point (x, y) on it satisfies y = 2x - 3."
  sources: {ccss: ["8.EE.B.6"], lc: []}
  strand: S4

# ---------------------------------------------------------------- 8.F.B.4
- id: linear-function.model.construct
  concept: linear-function
  facet: model
  level: 3
  type: representation
  name: "Construct a linear function to model a relationship"
  statement: "A linear relationship between two quantities is modeled by y = mx + b, where m is the rate of change of y per unit of x and b is the value of y when x = 0."
  procedure:
    - "Name the input variable x and output variable y with their units."
    - "Find the rate of change m."
    - "Find the initial value b."
    - "Write y = mx + b."
  assess: "A plumber charges $40 for a visit plus $25 per hour. Write a function for the total cost C in terms of hours h."
  sources: {ccss: ["8.F.B.4"], lc: ["dab9e9b0"]}
  strand: S4

- id: linear-function.model.rate.from-two-values
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: "Find the rate of change from two (x, y) values"
  statement: "The rate of change of a linear function, from two (x, y) values read from a table or graph with different x, is (y2 - y1)/(x2 - x1)."
  procedure:
    - "Read two pairs (x1, y1) and (x2, y2) with x1 not equal to x2."
    - "Compute m = (y2 - y1)/(x2 - x1)."
  assess: "A table for a linear function shows x = 2, y = 11 and x = 5, y = 20. Find the rate of change."
  sources: {ccss: ["8.F.B.4"], lc: ["e1ce9802", "c6f0747b"]}
  strand: S4

- id: linear-function.model.rate.from-description
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: "Find the rate of change from a verbal description"
  statement: "From a description of a linear relationship, the rate of change is the stated change in the output for each 1-unit increase in the input, negative when the output decreases."
  procedure:
    - "Find the phrase giving the change in the output per unit of input (for example 'per', 'each')."
    - "Take that amount as m, negative if the output goes down."
    - "If the description instead gives two (x, y) values, compute m from them."
  assess: "A 500-liter tank drains at 20 liters per minute. What is the rate of change of the volume with respect to time?"
  sources: {ccss: ["8.F.B.4"], lc: ["1944c542", "dd4d95c3"]}
  strand: S4

- id: linear-function.model.initial.from-two-values
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: "Find the initial value from a table or graph"
  statement: "The initial value of a linear function is its output at x = 0; when x = 0 is not shown, it is b = y1 - m x x1 for any shown pair (x1, y1)."
  procedure:
    - "If the table or graph shows the point with x = 0, read its y-value as b."
    - "Otherwise find the rate of change m from two shown pairs."
    - "Compute b = y1 - m x x1 for one shown pair (x1, y1)."
  assess: "A table for a linear function shows x = 2, y = 11 and x = 5, y = 20. Find the initial value."
  sources: {ccss: ["8.F.B.4"], lc: ["5f3a9252", "443d082c"]}
  strand: S4

- id: linear-function.model.initial.from-description
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: "Find the initial value from a verbal description"
  statement: "From a description of a linear relationship, the initial value is the output when the input is 0, such as a starting amount or a fixed fee."
  procedure:
    - "If the description states the output at input 0 (a starting amount or fixed fee), take it as b."
    - "Otherwise find m and a stated pair (x1, y1), and compute b = y1 - m x x1."
  assess: "A candle burns 2 cm per hour. After 3 hours it is 18 cm tall. How tall was it at the start?"
  sources: {ccss: ["8.F.B.4"], lc: ["411f2a23", "c8e759d8"]}
  strand: S4

- id: linear-function.model.rate.interpret
  concept: linear-function
  facet: model
  level: 3
  type: concept
  name: "Interpret the rate of change in context"
  statement: "The rate of change m of a linear model is the amount the output changes, in its units, for each 1-unit increase in the input."
  assess: "The cost of a taxi ride is C = 2.5d + 3, where d is miles. What does 2.5 mean in this situation?"
  sources: {ccss: ["8.F.B.4"], lc: ["b2a9431b"]}
  strand: S4

- id: linear-function.model.initial.interpret
  concept: linear-function
  facet: model
  level: 3
  type: concept
  name: "Interpret the initial value in context"
  statement: "The initial value b of a linear model is the output, in its units, when the input is 0."
  assess: "The height of water in a pool is h = 120 - 4t centimeters after t hours of draining. What does 120 mean in this situation?"
  sources: {ccss: ["8.F.B.4"], lc: ["6c340f89"]}
  strand: S4
