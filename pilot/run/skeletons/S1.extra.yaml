new_concepts:
  - {concept: measurement, facet: length, reason: "Length as the count of same-size units spanning an object (1.MD.A.2); not partitioning, since units are iterated rather than a whole divided. Later strands can add facets such as area and volume."}
  - {concept: addition, facet: add-to, reason: "2.MD.B.6 represents sums on the number line as a start length followed by a further length; addition has no registry entry."}
  - {concept: subtraction, facet: take-away, reason: "2.MD.B.6 differences shown by jumping back from a; subtraction has no registry entry."}
  - {concept: subtraction, facet: comparison, reason: "2.MD.B.6 differences shown as the distance from b to a; a second meaning of difference, so a separate facet and node."}
covered_by:
  - {lc: "1b707b1d", node: fraction.unit.part-whole}
dropped: []
notes: >-
  The division sign is not a plain keyboard character, so division is written
  as "a divided by b" throughout; the slash is avoided because it would be
  read as fraction notation. Number-range variants (10x10, dividends through 50,
  sums within 100, denominators 2-8, 2/3/4 shares) are merged; the range never
  changes the mathematics here. The grade 1 and grade 2 partition-and-name
  components each carry two skills, so their lc ids appear on both
  partitioning.equal-shares.area (the partitioning) and
  partitioning.equal-shares.name (the vocabulary). The 3.OA.A.1 phrase "or vice
  versa" is not encoded: multiplication.equal-groups.meaning fixes the
  convention a x b = a groups of b; reading it as b groups of a should come by
  an edge from commutativity (3.OA.B.5, not in this strand). The 3.OA.A.2
  modeling and identifying components cover both division meanings, so each is
  split into a partitive node and a measurement node sharing the same lc ids.
  3.OA.B.6 is split into a concept (no lc of its own, like
  fraction.application.compare-in-context), a representation, and a procedure;
  the unknown-factor form is written b x ? = a, matching the standard's
  example of 32 divided by 8 as 8 x ? = 32. 3.G.A.2 area-as-unit-fraction
  (1b707b1d) is already on fraction.unit.part-whole. The two example nodes
  partitioning.equal-shares.area and number-line.whole-number-lengths are
  rewritten here with their ids kept.
