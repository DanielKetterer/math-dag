- id: exponent.whole-number-power.meaning
  concept: exponent
  facet: whole-number-power
  level: 3
  type: concept
  name: a^b as a product of b equal factors
  statement: For a whole number b of at least 1, a^b is the product of b factors, each equal to a; a is
    the base and b is the exponent.
  assess: 'Which of these equals 4^3: 4 x 3, 4 x 4 x 4, 3 x 3 x 3 x 3, or 4 + 4 + 4?'
  sources:
    ccss:
    - 6.EE.A.1
    lc: []
  strand: E1
- id: exponent.whole-number-power.write
  concept: exponent
  facet: whole-number-power
  level: 3
  type: representation
  name: Write a product of equal factors as a power
  statement: A product of b equal factors a is written a^b, with the repeated factor as the base and the
    number of factors as the exponent.
  assess: Write 6 x 6 x 6 x 6 x 6 using an exponent.
  sources:
    ccss:
    - 6.EE.A.1
    lc:
    - 1f44c510
  strand: E1
- id: exponent.whole-number-power.evaluate.whole-base
  concept: exponent
  facet: whole-number-power
  level: 3
  type: procedure
  name: Evaluate a power of a whole number
  statement: Find the value of a^b, for a whole number a and a whole-number exponent b of at least 1,
    by multiplying b factors of a.
  procedure:
  - Write a^b as a product of b factors of a.
  - Multiply the factors.
  assess: Evaluate 3^4.
  sources:
    ccss:
    - 6.EE.A.1
    lc:
    - fe47029d
  strand: E1
- id: exponent.whole-number-power.evaluate.fraction-base
  concept: exponent
  facet: whole-number-power
  level: 3
  type: procedure
  name: Evaluate a power of a fraction
  statement: Find the value of (a/c)^b, for a fraction a/c and a whole-number exponent b of at least 1,
    by multiplying b factors of a/c.
  procedure:
  - Write (a/c)^b as a product of b factors of a/c.
  - Multiply the fractions.
  assess: Evaluate (2/3)^3.
  sources:
    ccss:
    - 6.EE.A.1
    lc:
    - fe47029d
  strand: E1
- id: exponent.whole-number-power.evaluate.decimal-base
  concept: exponent
  facet: whole-number-power
  level: 3
  type: procedure
  name: Evaluate a power of a decimal
  statement: Find the value of d^b, for a decimal d and a whole-number exponent b of at least 1, by multiplying
    b factors of d.
  procedure:
  - Write d^b as a product of b factors of d.
  - Multiply the decimals.
  assess: Evaluate (0.2)^3.
  sources:
    ccss:
    - 6.EE.A.1
    lc:
    - fe47029d
  strand: E1
- id: expressions.order-of-operations.exponents
  concept: expressions
  facet: numerical
  level: 3
  type: concept
  name: Powers come before multiplication and division
  statement: In the conventional order of operations, powers are evaluated after the work inside grouping
    symbols and before multiplication and division.
  assess: In 2 x 3^2, which is done first, the multiplication or the power? Is the value 36 or 18?
  sources:
    ccss:
    - 6.EE.A.2.c
    lc:
    - ceb07b7c
  strand: E1
- id: expressions.exponents.evaluate
  concept: expressions
  facet: numerical
  level: 3
  type: procedure
  name: Evaluate a numerical expression that contains powers
  statement: 'Evaluate a numerical expression of whole numbers that contains whole-number exponents, in
    the conventional order: grouping symbols, then powers, then multiplication and division from left
    to right, then addition and subtraction from left to right.'
  procedure:
  - Evaluate inside grouping symbols, innermost first.
  - Evaluate powers.
  - Multiply and divide from left to right.
  - Add and subtract from left to right.
  assess: Evaluate 20 - 2 x 3^2.
  sources:
    ccss:
    - 6.EE.A.1
    - 6.EE.A.2.c
    lc:
    - ceb07b7c
  strand: E1
- id: expressions.variable.meaning
  concept: expressions
  facet: algebraic
  level: 3
  type: concept
  name: A letter in an expression stands for a number
  statement: A letter in an expression stands for a number, so operations written with the letter are
    operations on that number, not on an object or a word.
  assess: In the expression 3 x b, b stands for the number of books on each of 3 shelves. Sam says b means
    'books'. What does b stand for, and what does 3 x b stand for?
  sources:
    ccss:
    - 6.EE.A.2.a
    - 6.EE.B.6
    lc:
    - 12b69651
  strand: E1
- id: expressions.notation.implicit-multiplication
  concept: expressions
  facet: algebraic
  level: 3
  type: representation
  name: A number next to a letter or parenthesis means multiply
  statement: 'A number written directly before a letter or a parenthesis means multiplication: 4y means
    4 x y, and 5(2 + n) means 5 x (2 + n).'
  assess: Rewrite 4y and 5(2 + n) with the multiplication sign x shown.
  sources:
    ccss:
    - 6.EE.A.2.c
    - 6.EE.A.3
    lc: []
  strand: E1
- id: expressions.variable.read
  concept: expressions
  facet: algebraic
  level: 3
  type: representation
  name: Describe an expression with a letter in words
  statement: Given an expression built from numbers, letters and operations, choose or give a phrase that
    describes its operations in the right order.
  assess: 'Which phrase describes 5 - y: ''y less than 5'', ''5 less than y'', or ''y minus 5''?'
  sources:
    ccss:
    - 6.EE.A.2.a
    lc:
    - ced6fc6b
  strand: E1
- id: expressions.variable.write-from-words
  concept: expressions
  facet: algebraic
  level: 3
  type: representation
  name: Write an expression with a letter from a verbal phrase
  statement: Write an expression, using numbers, letters and operation symbols, that records the operations
    a verbal phrase describes, in the order the phrase gives them.
  assess: Write an expression for '7 less than 3 times a number n'.
  sources:
    ccss:
    - 6.EE.A.2.a
    lc:
    - 115636bf
    - 16e16ca9
  strand: E1
- id: expressions.parts.name
  concept: expressions
  facet: algebraic
  level: 3
  type: concept
  name: Name the parts of an expression
  statement: 'The parts of an expression are named by its operations: the parts added in a sum are terms,
    the parts multiplied in a product are factors, an expression whose last operation is division is a
    quotient, and the number factor of a term with a letter is its coefficient.'
  assess: 'In 5x + 2y + 8: how many terms are there, what is the coefficient of y, and what are the two
    factors of 5x?'
  sources:
    ccss:
    - 6.EE.A.2.b
    lc:
    - adfe0503
  strand: E1
- id: expressions.parts.single-entity
  concept: expressions
  facet: algebraic
  level: 3
  type: concept
  name: View part of an expression as a single quantity
  statement: A part of an expression, such as (8 + 7) in 2(8 + 7), can be treated as one quantity (here,
    one factor) while also being a sum of terms.
  assess: Describe 2(8 + 7) as a product of two factors. Then describe its second factor as a sum of two
    terms.
  sources:
    ccss:
    - 6.EE.A.2.b
    lc:
    - 1ca4a9fc
  strand: E1
- id: expressions.variable.evaluate
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Evaluate an expression at given values of its variables
  statement: Find the value of an expression at given values of its variables by replacing each letter
    with its value and evaluating in the conventional order.
  procedure:
  - Replace each letter with its given value, writing out any multiplication the notation hides (4a with
    a = 5 becomes 4 x 5).
  - Evaluate the resulting numerical expression in the conventional order.
  assess: Evaluate 4a + 3b when a = 5 and b = 2.
  sources:
    ccss:
    - 6.EE.A.2.c
    lc:
    - 5702c4ef
  strand: E1
- id: expressions.formula.evaluate
  concept: expressions
  facet: algebraic
  level: 3
  type: application
  name: Use a given formula to find a quantity in a real-world problem
  statement: In a real-world problem that gives a formula, such as V = s^3 or A = 6s^2, find the quantity
    the formula names by evaluating it at the given measurements, and state the result with its unit.
  assess: The volume of a cube with edge length s is V = s^3. Find the volume of a cube whose edges are
    1/2 inch long.
  sources:
    ccss:
    - 6.EE.A.2.c
    lc:
    - 06806313
  strand: E1
- id: expressions.numerical.fractions-decimals.evaluate
  concept: expressions
  facet: numerical
  level: 3
  type: procedure
  name: Evaluate a numerical expression with fractions or decimals
  statement: Evaluate a numerical expression with two or more operations, possibly including whole-number
    exponents, whose numbers are nonnegative fractions or decimals, in the conventional order of operations.
  procedure:
  - Evaluate inside grouping symbols, innermost first.
  - Evaluate powers.
  - Multiply and divide from left to right.
  - Add and subtract from left to right.
  assess: Evaluate 1/2 + 3 x (1/2)^2.
  sources:
    ccss:
    - 6.EE.A.2.c
    lc:
    - ceb07b7c
  strand: E1
- id: expressions.sum.rearrange-terms
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Reorder and regroup the terms of a sum
  statement: Generate an expression equivalent to a sum by writing its terms in a different order or grouping
    them differently, using the commutative and associative properties of addition.
  procedure:
  - Write the terms in the new order.
  - Group the terms to be combined with parentheses.
  assess: Rewrite 3 + x + 7 as x plus a single number.
  sources:
    ccss:
    - 6.EE.A.3
    lc:
    - e1d1c595
    - a629106a
  strand: E1
- id: expressions.product.regroup-factors
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Reorder and regroup the factors of a product
  statement: Generate an expression equivalent to a product by writing its factors in a different order
    or grouping them differently, using the commutative and associative properties of multiplication,
    so that the number factors can be multiplied together.
  procedure:
  - Write the number factors next to each other.
  - Group the number factors with parentheses and multiply them.
  assess: Rewrite 4 x (y x 5) as a single number times y.
  sources:
    ccss:
    - 6.EE.A.3
    lc:
    - e1d1c595
    - a629106a
  strand: E1
- id: expressions.like-terms.meaning
  concept: expressions
  facet: algebraic
  level: 3
  type: concept
  name: Like terms
  statement: Like terms are terms with the same variable part (the same letters raised to the same powers);
    they may differ only in their number coefficient. Number terms with no letter are like terms of one
    another.
  assess: 'Which of these pairs are like terms: 3x and 7x; 3x and 3y; 5 and 9; 4x and 4; 2x^2 and 2x?'
  sources:
    ccss:
    - 6.EE.A.3
    lc: []
  strand: E1
- id: expressions.like-terms.combine
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Combine like terms with nonnegative coefficients
  statement: Combine like terms whose coefficients are nonnegative whole numbers, fractions or decimals
    by adding their coefficients, ax + bx = (a + b)x, where a term written x has coefficient 1.
  procedure:
  - Identify the like terms.
  - Add their coefficients, counting a term written x as 1x.
  - Write the sum of the coefficients times the shared variable part.
  assess: Write y + y + y as a single term. Write 2.5x + 4x as a single term.
  sources:
    ccss:
    - 6.EE.A.3
    - 6.EE.A.4
    lc:
    - e1d1c595
    - a629106a
  strand: E1
- id: expressions.distributive.expand
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Expand a(b + c) with a variable using the distributive property
  statement: Rewrite a nonnegative number times a sum or difference that contains a variable, a(b + c)
    or a(b - c), as ab + ac or ab - ac, using the distributive property.
  procedure:
  - Multiply the outside factor by each term inside the parentheses.
  - Write the products joined by the sign that joined the terms.
  assess: Rewrite 3(2 + x) without parentheses.
  sources:
    ccss:
    - 6.EE.A.3
    lc:
    - 977bc6f0
  strand: E1
- id: expressions.distributive.factor
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Factor a common whole-number factor out of a sum
  statement: Rewrite a sum of terms that share a whole-number factor f as f times a sum, such as 24x +
    18y = 6(4x + 3y), using the distributive property in reverse.
  procedure:
  - Divide each term by the common factor f.
  - Write f times the sum of the quotients.
  assess: Rewrite 24x + 18y as a product with 6 as one factor.
  sources:
    ccss:
    - 6.EE.A.3
    lc:
    - 8819fa6b
  strand: E1
- id: expressions.equivalent.meaning
  concept: expressions
  facet: algebraic
  level: 3
  type: concept
  name: Equivalent expressions
  statement: Two expressions are equivalent when they have the same value for every number substituted
    for the variable; having the same value for one number is not enough.
  assess: When x = 2, both 2x and x + 2 equal 4. What does each equal when x = 5? Are 2x and x + 2 equivalent?
  sources:
    ccss:
    - 6.EE.A.4
    lc: []
  strand: E1
- id: expressions.equivalent.test-substitution
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Show two expressions are not equivalent by substitution
  statement: Show that two expressions are not equivalent by finding a value of the variable at which
    they have different values; agreement at the values tried does not by itself show that they are equivalent.
  procedure:
  - Choose a value for the variable and evaluate both expressions.
  - If the values differ, the expressions are not equivalent.
  - If they agree, try another value, or use properties of operations to decide.
  assess: Substitute x = 0, 1 and 2 into 2(x + 3) and 2x + 3. Are the two expressions equivalent?
  sources:
    ccss:
    - 6.EE.A.4
    lc:
    - 67cfaafc
  strand: E1
- id: expressions.equivalent.test-properties
  concept: expressions
  facet: algebraic
  level: 3
  type: procedure
  name: Decide whether expressions are equivalent using properties
  statement: Decide whether two expressions are equivalent by using properties of operations to rewrite
    one into the other, or both into the same form.
  procedure:
  - Expand products and combine like terms in each expression.
  - Compare the two resulting forms term by term.
  assess: Use properties of operations to decide whether 3(x + 4) + 2x and 5x + 12 are equivalent.
  sources:
    ccss:
    - 6.EE.A.4
    lc:
    - 52a53073
  strand: E1
- id: expressions.equivalent.explain
  concept: expressions
  facet: algebraic
  level: 4
  type: justification
  name: Explain whether two expressions are equivalent
  statement: An argument that two expressions are equivalent rewrites one into the other with properties
    of operations, which hold for every value of the variable; an argument that they are not gives one
    value at which they differ.
  assess: Explain why y + y + y and 3y are equivalent, and why y + 3 and 3y are not.
  sources:
    ccss:
    - 6.EE.A.4
    lc:
    - 5ccfcd23
  strand: E1
- id: equation.solution.meaning
  concept: equation
  facet: open-sentence
  level: 3
  type: concept
  name: A solution of an equation
  statement: A solution of an equation with a variable is a value of the variable that makes the equation
    true; solving the equation means finding which values from a given set, if any, are solutions.
  assess: When x = 4, the equation 3x + 2 = 14 is true. When x = 5, it is false. Which of 4 and 5 is a
    solution of 3x + 2 = 14, and why?
  sources:
    ccss:
    - 6.EE.B.5
    lc:
    - f7a9f0e5
  strand: E1
- id: inequality.solution.meaning
  concept: inequality
  facet: open-sentence
  level: 3
  type: concept
  name: A solution of an inequality
  statement: A solution of an inequality with a variable is a value of the variable that makes the inequality
    true; an inequality can have more than one solution.
  assess: x + 1 > 5 is true when x = 6 and when x = 9, and false when x = 3. Which of 3, 6 and 9 are solutions
    of x + 1 > 5?
  sources:
    ccss:
    - 6.EE.B.5
    lc:
    - f7a9f0e5
  strand: E1
- id: equation.solution.check-substitution
  concept: equation
  facet: open-sentence
  level: 3
  type: procedure
  name: Check by substitution which numbers solve an equation
  statement: Decide which numbers in a given set, if any, make an equation true by substituting each for
    the variable and checking whether the two sides have the same value.
  procedure:
  - Substitute a number from the set for the variable.
  - Evaluate each side.
  - If the sides are equal, the number is a solution; repeat for each number in the set.
  assess: Which numbers in the set {2, 3, 5} make 2x + 1 = 7 true?
  sources:
    ccss:
    - 6.EE.B.5
    lc:
    - 25259f33
    - 10b7ec1d
  strand: E1
- id: inequality.solution.check-substitution
  concept: inequality
  facet: open-sentence
  level: 3
  type: procedure
  name: Check by substitution which numbers solve an inequality
  statement: Decide which numbers in a given set, if any, make an inequality true by substituting each
    for the variable and checking whether the resulting comparison is true.
  procedure:
  - Substitute a number from the set for the variable.
  - Evaluate each side.
  - If the comparison is true, the number is a solution; repeat for each number in the set.
  assess: Which numbers in the set {1, 3, 5, 7} make 2x - 1 > 6 true?
  sources:
    ccss:
    - 6.EE.B.5
    lc:
    - 8fec2d18
    - a9e1847a
  strand: E1
- id: expressions.variable.unknown-vs-varying
  concept: expressions
  facet: algebraic
  level: 3
  type: concept
  name: A variable as one unknown number or as any number in a set
  statement: A letter can stand for one unknown number that a condition fixes, as in the equation n +
    3 = 10, or for any number in a set, as in the expression 3n for the cost in dollars of n pencils at
    $3 each; the purpose at hand decides which.
  assess: In n + 3 = 10, which numbers can n be? In 'n pencils at $3 each cost 3n dollars', which numbers
    can n be?
  sources:
    ccss:
    - 6.EE.B.6
    lc:
    - 12b69651
  strand: E1
- id: expressions.variable.situation-from-expression
  concept: expressions
  facet: algebraic
  level: 3
  type: representation
  name: Describe a situation that an expression with a variable represents
  statement: Given an expression with a variable, describe a real-world situation the expression could
    represent, saying what the variable stands for.
  assess: Describe a situation that 20 - 3x could represent, and say what x stands for.
  sources:
    ccss:
    - 6.EE.B.6
    lc:
    - 306ce9f4
  strand: E1
- id: expressions.variable.write-for-situation
  concept: expressions
  facet: algebraic
  level: 3
  type: representation
  name: Write an expression with a variable for a real-world quantity
  statement: Write an expression, with a letter for a number that can vary, for a quantity in a real-world
    situation that depends on that number.
  assess: Pencils cost $2 each and a notebook costs $3. Write an expression for the cost, in dollars,
    of p pencils and one notebook.
  sources:
    ccss:
    - 6.EE.B.6
    lc:
    - 60a51673
  strand: E1
- id: equation.equality-preserved.same-operation
  concept: equation
  facet: relational
  level: 3
  type: concept
  name: Doing the same operation to both sides keeps an equation's solutions
  statement: Adding the same number to both sides of an equation, subtracting the same number from both
    sides, or multiplying or dividing both sides by the same nonzero number gives an equation with exactly
    the same solutions.
  assess: 'Which of these equations have exactly the same solutions as n + 5 = 12: n + 5 - 5 = 12 - 5;
    n + 5 - 5 = 12; 3 x (n + 5) = 3 x 12; 0 x (n + 5) = 0 x 12?'
  sources:
    ccss:
    - 6.EE.B.7
    lc: []
  strand: E1
- id: equation.one-step.addition.solve
  concept: equation
  facet: open-sentence
  level: 3
  type: procedure
  name: Solve x + p = q with nonnegative rational numbers
  statement: Solve an equation x + p = q, where p and q are nonnegative whole numbers, fractions or decimals
    with q at least p, by subtracting p from both sides, so that x = q - p.
  procedure:
  - Subtract p from both sides of the equation.
  - Compute q - p; the result is the value of x.
  assess: Solve x + 2/3 = 7/6.
  sources:
    ccss:
    - 6.EE.B.7
    lc:
    - 1981017a
  strand: E1
- id: equation.one-step.multiplication.solve
  concept: equation
  facet: open-sentence
  level: 3
  type: procedure
  name: Solve px = q with nonnegative rational numbers
  statement: Solve an equation px = q, where p is a positive whole number, fraction or decimal and q is
    a nonnegative one, by dividing both sides by p, so that x = q divided by p.
  procedure:
  - Divide both sides of the equation by p.
  - Compute q divided by p; the result is the value of x.
  assess: Solve (3/4)x = 6.
  sources:
    ccss:
    - 6.EE.B.7
    lc:
    - e50eda80
  strand: E1
- id: equation.one-step.write.addition
  concept: equation
  facet: open-sentence
  level: 3
  type: representation
  name: Write x + p = q for a word problem
  statement: For a problem stated in words in which an unknown nonnegative quantity and a known nonnegative
    rational amount p together make a known amount q, write the equation x + p = q, saying what x stands
    for.
  assess: After Ana poured 1.25 liters of water into a jug, the jug held 3 liters. Write an equation for
    the amount of water w, in liters, that was in the jug at first.
  sources:
    ccss:
    - 6.EE.B.7
    lc:
    - 099ceccb
    - ed92d2a4
  strand: E1
- id: equation.one-step.write.multiplication
  concept: equation
  facet: open-sentence
  level: 3
  type: representation
  name: Write px = q for a word problem
  statement: For a problem stated in words in which a known positive rational number p times an unknown
    nonnegative quantity gives a known amount q (p may be a fraction, as in 'p of the quantity'), write
    the equation px = q, saying what x stands for.
  assess: Three-fourths of a bag of rice weighs 6 pounds. Write an equation for the weight b, in pounds,
    of the full bag.
  sources:
    ccss:
    - 6.EE.B.7
    lc:
    - e54e642e
    - 8d29194f
  strand: E1
- id: equation.one-step.addition.application
  concept: equation
  facet: open-sentence
  level: 3
  type: application
  name: Solve real-world problems with an equation x + p = q
  statement: Solve a real-world problem in which an unknown nonnegative quantity plus a known nonnegative
    rational amount p gives a known amount q, by writing x + p = q and solving it.
  assess: A plant grew 2 3/4 inches this month and is now 10 1/2 inches tall. Write an equation and solve
    it to find how tall the plant was at the start of the month.
  sources:
    ccss:
    - 6.EE.B.7
    lc:
    - cd69a8c5
  strand: E1
