- id: angle.triangle.exterior.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain why an exterior angle equals the sum of the two remote interior angles
  statement: The exterior angle and the interior angle next to it form a straight angle, so the exterior
    angle is 180 degrees minus that interior angle; by the angle sum, the other two interior angles also
    add to 180 degrees minus that interior angle, so the exterior angle equals their sum.
  assess: In triangle ABC, side BC is extended past C to point D. Explain why angle ACD = angle A + angle
    B for every triangle.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.application.triangles-parallel-lines
  concept: angle
  facet: measure
  level: 3
  type: application
  name: Find an unknown angle in a diagram with parallel lines and a triangle
  statement: Solve problems that find an unknown angle measure in a diagram combining two parallel lines,
    a transversal, and a triangle, by chaining a transversal angle fact with the triangle angle sum or
    the exterior angle fact; all given measures are numbers.
  assess: Lines m and n are parallel. Point A is on m, and points B and C are on n, with B to the left
    of C. The angle between segment AB and the part of line m to the left of A measures 50 degrees, and
    angle ACB measures 70 degrees. Find the measure of angle BAC.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b4b423c9
  strand: G4
- id: pythagorean-theorem.squares-on-sides
  concept: pythagorean-theorem
  facet: area
  level: 2
  type: concept
  name: The square on the hypotenuse has the area of the two squares on the legs together
  statement: For a right triangle, the area of the square built on the hypotenuse (the side opposite the
    right angle) equals the sum of the areas of the squares built on the two legs.
  assess: On a grid, a right triangle has legs 3 units and 4 units long, and a square is built on each
    side of the triangle. The squares on the legs have areas 9 and 16 square units. Without counting,
    what is the area of the square on the hypotenuse?
  sources:
    ccss:
    - 8.G.B.6
    lc: []
  strand: G4
- id: pythagorean-theorem.statement
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: concept
  name: The Pythagorean theorem a^2 + b^2 = c^2
  statement: In a right triangle with legs of lengths a and b and hypotenuse (the side opposite the right
    angle) of length c, a^2 + b^2 = c^2.
  assess: Triangle PQR has its right angle at Q. Write the Pythagorean theorem as an equation in the lengths
    PQ, QR, and PR.
  sources:
    ccss:
    - 8.G.B.6
    - 8.G.B.7
    lc: []
  strand: G4
- id: pythagorean-theorem.proof.explain
  concept: pythagorean-theorem
  facet: area
  level: 4
  type: justification
  name: Explain a proof of the Pythagorean theorem by rearranging triangles
  statement: 'Four copies of a right triangle with legs a and b and hypotenuse c fit inside a square of
    side a + b in two ways: around a tilted square of side c, or beside a square of side a and a square
    of side b; the uncovered area is the same both times, so c^2 = a^2 + b^2.'
  assess: The diagram shows two arrangements of four copies of a right triangle with legs a and b and
    hypotenuse c inside a square of side a + b. Use them to explain why a^2 + b^2 = c^2.
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 9ca7bb46
  strand: G4
- id: pythagorean-theorem.converse
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: concept
  name: The converse of the Pythagorean theorem
  statement: If the side lengths a, b, and c of a triangle satisfy a^2 + b^2 = c^2, the triangle is a
    right triangle with its right angle opposite the side of length c.
  assess: A triangle has side lengths a, b, and c with a^2 + b^2 = c^2. What can you conclude about the
    angle opposite the side of length c?
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 54ee8a5e
  strand: G4
- id: pythagorean-theorem.converse.explain
  concept: pythagorean-theorem
  facet: length
  level: 4
  type: justification
  name: Explain a proof of the converse of the Pythagorean theorem
  statement: Given a triangle with sides a, b, and c and a^2 + b^2 = c^2, build a right triangle with
    legs a and b; by the Pythagorean theorem its hypotenuse is c, so the two triangles have the same three
    side lengths, they are congruent, and the angle opposite c in the given triangle is a right angle.
  assess: Triangle ABC has AC = 5, BC = 12, and AB = 13, so AC^2 + BC^2 = AB^2. Explain, by comparing
    it with a right triangle whose legs are 5 and 12, why angle C must be a right angle.
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 54ee8a5e
  strand: G4
- id: pythagorean-theorem.right-triangle.decide
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Decide from side lengths whether a triangle is a right triangle
  statement: 'Decide whether a triangle with given side lengths is a right triangle by comparing the sum
    of the squares of the two shorter sides with the square of the longest side: equal means right (by
    the converse), unequal means not right (by the theorem).'
  procedure:
  - Name the longest side c and the two shorter sides a and b.
  - Compute a^2 + b^2 and c^2.
  - If they are equal, the triangle is a right triangle; if not, it is not a right triangle.
  assess: A triangle has side lengths 6, 8, and 11. Is it a right triangle?
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 09bd90d2
  strand: G4
- id: pythagorean-theorem.unknown-side.whole
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find an unknown side of a right triangle when the answer is a whole number
  statement: Find an unknown side length of a right triangle from the other two, when the squares of the
    sides make the unknown length a whole number, using a^2 + b^2 = c^2.
  procedure:
  - Identify the hypotenuse (opposite the right angle) and the legs.
  - If the hypotenuse is unknown, compute a^2 + b^2; if a leg is unknown, compute c^2 minus the square
    of the known leg.
  - The result is a perfect square; its square root is the unknown length.
  assess: A right triangle has a hypotenuse of length 13 and one leg of length 5. Find the length of the
    other leg.
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - cac68ba0
  strand: G4
- id: pythagorean-theorem.unknown-side.irrational
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find the exact unknown side of a right triangle as a square root
  statement: Find an unknown side length of a right triangle from the other two when its square n is not
    a perfect square, giving the exact length sqrt(n).
  procedure:
  - Identify the hypotenuse (opposite the right angle) and the legs.
  - If the hypotenuse is unknown, compute n = a^2 + b^2; if a leg is unknown, compute n = c^2 minus the
    square of the known leg.
  - Write the exact length as sqrt(n).
  assess: A right triangle has legs of lengths 2 and 5. Give the exact length of its hypotenuse.
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - cac68ba0
  strand: G4
- id: pythagorean-theorem.unknown-side.3d
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find the interior diagonal of a rectangular prism
  statement: 'Find the length of the diagonal of a rectangular prism from a bottom corner to the opposite
    top corner by applying the Pythagorean theorem twice: first to the diagonal of the base, then to the
    right triangle formed by that diagonal, a vertical edge, and the interior diagonal.'
  procedure:
  - Find the length d of the diagonal of the base rectangle from d^2 = l^2 + w^2.
  - Use the right triangle whose legs are the base diagonal and a vertical edge of length h, with the
    right angle at the base, and whose hypotenuse is the interior diagonal.
  - Find the interior diagonal D from D^2 = d^2 + h^2.
  assess: A rectangular box is 3 cm long, 4 cm wide, and 12 cm tall. Find the length of the diagonal from
    a bottom corner to the opposite top corner.
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - cac68ba0
  strand: G4
- id: pythagorean-theorem.application.2d.whole
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world right-triangle problems with whole-number answers
  statement: Solve real-world problems in which the unknown length is a side of one right triangle in
    a plane, such as a ladder against a wall or the diagonal of a rectangle, and the answer is a whole
    number.
  assess: A 13-foot ladder leans against a vertical wall, with its foot on level ground 5 feet from the
    wall. How high up the wall does the top of the ladder reach?
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - b922397f
  strand: G4
- id: pythagorean-theorem.application.2d.approximate
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world right-triangle problems with answers rounded to the nearest tenth
  statement: Solve real-world problems in which the unknown length is a side of one right triangle in
    a plane and is not a whole number, giving the length rounded to the nearest tenth.
  assess: A rectangular screen is 8 inches wide and 5 inches tall. How long is its diagonal, to the nearest
    tenth of an inch?
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - b922397f
  strand: G4
- id: pythagorean-theorem.application.3d
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world problems about the interior diagonal of a box
  statement: Solve real-world problems that find the length from a bottom corner to the opposite top corner
    of a box-shaped object, by applying the Pythagorean theorem twice, when the answer is a whole number.
  assess: A storage box is 6 inches long, 8 inches wide, and 24 inches tall. How long is the longest straight
    rod that fits inside it, from a bottom corner to the opposite top corner?
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - b922397f
  strand: G4
- id: pythagorean-theorem.distance.coordinates
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find the distance between two points in the coordinate plane
  statement: Find the distance between two points in the coordinate plane that are not on the same horizontal
    or vertical line as the hypotenuse of the right triangle whose legs are the horizontal and vertical
    distances between the points.
  procedure:
  - Find the horizontal distance between the points from their x-coordinates and the vertical distance
    from their y-coordinates.
  - Use these distances as the legs of a right triangle whose hypotenuse is the segment joining the two
    points.
  - Find the length of the hypotenuse with the Pythagorean theorem.
  assess: Find the distance between the points (-2, 1) and (1, 5).
  sources:
    ccss:
    - 8.G.B.8
    lc:
    - 9a823129
  strand: G4
- id: pythagorean-theorem.distance.application
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world straight-line distance problems on a coordinate grid
  statement: Solve real-world problems that find the straight-line distance between two places given by
    coordinates on a map grid, using the Pythagorean theorem and giving the distance rounded to the nearest
    tenth.
  assess: On a town map where each grid unit is 1 km, the school is at (1, 2) and the library is at (4,
    7). What is the straight-line distance between them, to the nearest tenth of a kilometer?
  sources:
    ccss:
    - 8.G.B.8
    lc:
    - de09df1b
  strand: G4
- id: volume.cylinder.formula
  concept: volume
  facet: unit-cubes
  level: 3
  type: concept
  name: The volume formula for a cylinder
  statement: The volume of a cylinder with base radius r and height h is V = pi x r^2 x h, the area of
    its circular base times its height.
  assess: 'Which expression gives the volume of a cylinder with radius 3 cm and height 10 cm: pi x 3^2
    x 10; 2 x pi x 3 x 10; pi x 3 x 10^2?'
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
  strand: G4
- id: volume.cylinder.compute
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a cylinder in terms of pi
  statement: Find the volume of a cylinder from its radius or diameter and its height with V = pi x r^2
    x h, giving the answer in terms of pi.
  procedure:
  - If the diameter is given, halve it to get the radius r.
  - Compute r^2 x h.
  - Write the volume as that number times pi, in cubic units.
  assess: A cylinder has radius 3 cm and height 10 cm. Find its volume in terms of pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
    - 2249c3b7
  strand: G4
- id: volume.cylinder.find-height
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the height of a cylinder from its volume and radius
  statement: Find the height of a cylinder from its volume and radius by dividing the volume by the base
    area pi x r^2.
  procedure:
  - Compute the base area pi x r^2.
  - Divide the volume by the base area; the quotient is the height.
  assess: A cylinder has a volume of 72 x pi cubic cm and a radius of 3 cm. Find its height.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
    - 2249c3b7
  strand: G4
- id: volume.cylinder.find-radius
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the radius of a cylinder from its volume and height
  statement: Find the radius of a cylinder from its volume and height by dividing the volume by pi x h
    to get r^2 and then taking the square root.
  procedure:
  - Divide the volume by pi x h; the quotient is r^2.
  - Take the positive square root of r^2 to get r.
  assess: A cylinder has a volume of 80 x pi cubic cm and a height of 5 cm. Find its radius.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
  strand: G4
- id: volume.cylinder.application
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the volume of a cylinder
  statement: Solve real-world problems that find the volume or capacity of a cylindrical object from its
    radius or diameter and its height, using 3.14 for pi.
  assess: A cylindrical water tank has a diameter of 2 m and a height of 3 m. About how many cubic meters
    of water does it hold? Use 3.14 for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - '73140379'
    - 6d9c6fbd
  strand: G4
- id: volume.cylinder.application.find-height
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the height of a cylinder from its volume
  statement: Solve real-world problems that find the height of a cylindrical object from its volume and
    radius, using 3.14 for pi.
  assess: A cylindrical can holds 785 cubic cm and has a radius of 5 cm. How tall is the can? Use 3.14
    for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - '73140379'
    - 6d9c6fbd
  strand: G4
- id: volume.cylinder.application.find-radius
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the radius of a cylinder from its volume
  statement: Solve real-world problems that find the radius of a cylindrical object from its volume and
    height, using 3.14 for pi.
  assess: A cylindrical tank is 2 m tall and holds 56.52 cubic meters of water. What is its radius? Use
    3.14 for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - '73140379'
  strand: G4
- id: volume.cone.formula
  concept: volume
  facet: unit-cubes
  level: 3
  type: concept
  name: The volume formula for a cone
  statement: The volume of a cone with base radius r and height h is V = (1/3) x pi x r^2 x h, one third
    of the volume of the cylinder with the same base and height.
  assess: A cylinder and a cone have the same radius and the same height. The cylinder holds 30 cubic
    cm. How much does the cone hold?
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 74823f49
  strand: G4
- id: volume.cone.compute
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a cone in terms of pi
  statement: Find the volume of a cone from its radius or diameter and its height with V = (1/3) x pi
    x r^2 x h, giving the answer in terms of pi.
  procedure:
  - If the diameter is given, halve it to get the radius r.
  - Compute r^2 x h and divide by 3.
  - Write the volume as that number times pi, in cubic units.
  assess: A cone has radius 3 cm and height 5 cm. Find its volume in terms of pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 74823f49
  strand: G4
- id: volume.cone.find-height
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the height of a cone from its volume and radius
  statement: Find the height of a cone from its volume and radius by multiplying the volume by 3 and dividing
    by the base area pi x r^2.
  procedure:
  - Multiply the volume by 3.
  - Divide by the base area pi x r^2; the quotient is the height.
  assess: A cone has a volume of 12 x pi cubic cm and a radius of 3 cm. Find its height.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 74823f49
  strand: G4
- id: volume.cone.application
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the volume of a cone
  statement: Solve real-world problems that find the volume or capacity of a cone-shaped object from its
    radius or diameter and its height, using 3.14 for pi.
  assess: A paper cone cup has a radius of 3 cm and a height of 10 cm. About how many cubic cm of water
    does it hold? Use 3.14 for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - d28cebe9
  strand: G4
- id: volume.sphere.formula
  concept: volume
  facet: unit-cubes
  level: 3
  type: concept
  name: The volume formula for a sphere
  statement: The volume of a sphere with radius r is V = (4/3) x pi x r^3.
  assess: 'Which expression gives the volume of a sphere with radius 3 cm: (4/3) x pi x 3^3; (4/3) x pi
    x 3^2; 4 x pi x 3^2?'
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 8e127d06
  strand: G4
- id: volume.sphere.compute
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a sphere in terms of pi
  statement: Find the volume of a sphere from its radius or diameter with V = (4/3) x pi x r^3, giving
    the answer in terms of pi.
  procedure:
  - If the diameter is given, halve it to get the radius r.
  - Compute r^3, multiply by 4, and divide by 3.
  - Write the volume as that number times pi, in cubic units.
  assess: A sphere has radius 3 cm. Find its volume in terms of pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 8e127d06
  strand: G4
- id: volume.sphere.find-radius
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the radius of a sphere from its volume
  statement: Find the radius of a sphere from its volume by multiplying the volume by 3 and dividing by
    4 x pi to get r^3, then taking the cube root.
  procedure:
  - Multiply the volume by 3 and divide by 4 x pi; the quotient is r^3.
  - Take the cube root of r^3 to get r.
  assess: A sphere has a volume of 36 x pi cubic cm. Find its radius.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 8e127d06
  strand: G4
- id: volume.sphere.application
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the volume of a sphere
  statement: Solve real-world problems that find the volume of a ball or other sphere-shaped object from
    its radius or diameter, using 3.14 for pi.
  assess: A ball has a diameter of 6 inches. About how many cubic inches of air does it hold? Use 3.14
    for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 77fac757
  strand: G4
- id: shapes.square-corner
  concept: shapes
  facet: properties
  level: 1
  type: concept
  name: A square corner
  statement: A square corner is a corner of a shape that the corner of a sheet of paper or an index card
    fits exactly, with no gap on either side; whether a corner is square is checked by fitting such a
    corner into it.
  assess: Test each corner of this four-sided shape with the corner of an index card. Which of its corners
    are square corners?
  sources:
    ccss:
    - 1.G.A.1
    - 3.G.A.1
    lc: []
  strand: F2
- id: shapes.name.prototype.rectangle-hexagon
  concept: shapes
  facet: core
  level: 1
  type: representation
  name: Name typical rectangles and hexagons
  statement: Say the names rectangle and hexagon for typical examples of those shapes shown in their usual
    orientation.
  assess: Show, one at a time, a rectangle resting on a long side and a regular hexagon resting on a side.
    'What shape is this?' Credit the correct name for each.
  sources:
    ccss:
    - K.G.A.2
    lc: []
  strand: F2
- id: shapes.rectangle.opposite-sides-equal
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Opposite sides of a rectangle are equal
  statement: In every rectangle each pair of opposite sides has the same length, so a rectangle has two
    sides of one length and two sides of another, or four equal sides when it is a square.
  assess: A rectangle has one side 7 cm long and the side next to it 3 cm long. How long are the other
    two sides?
  sources:
    ccss:
    - 3.MD.D.8
    - 4.MD.A.3
    lc: []
  strand: F2
- id: parallel.perpendicular-to-same-line
  concept: parallel
  facet: core
  level: 3
  type: concept
  name: Two lines perpendicular to the same line are parallel
  statement: Two lines in a plane that are each perpendicular to the same line are parallel to each other.
  assess: In this plane, lines p and q are each drawn perpendicular to line r. Are p and q parallel? How
    do you know without extending them?
  sources:
    ccss:
    - 5.G.B.4
    lc: []
  strand: F2
- id: area.attribute
  concept: area
  facet: attribute
  level: 1
  type: concept
  name: Area is the amount of flat surface a figure covers
  statement: 'The area of a flat figure is the amount of surface it covers, an attribute different from
    its length: a long thin strip can cover less surface than a short wide square.'
  assess: A long thin ribbon and a square sheet of paper lie on a table; the ribbon is longer. Which covers
    more of the table? Is the longer figure always the one that covers more?
  sources:
    ccss:
    - 3.MD.C.5
    lc: []
  strand: F2
- id: volume.space-occupied
  concept: volume
  facet: attribute
  level: 1
  type: concept
  name: Volume is the amount of space a solid takes up
  statement: 'The volume of a solid is the amount of space it takes up, an attribute different from its
    height: a short wide box can take up more space than a tall thin one.'
  assess: Which takes up more space, a basketball or a tennis ball? Can a taller object take up less space
    than a shorter one? Give an example.
  sources:
    ccss:
    - 5.MD.C.3
    lc: []
  strand: F2
- id: measurement.liquid-volume.liter-unit
  concept: measurement
  facet: liquid-volume
  level: 2
  type: concept
  name: The liter as a unit of liquid volume
  statement: A liter is a standard unit of liquid volume, the amount of liquid that fills a 1-liter container;
    a liquid volume in liters is the number of times it fills that container.
  assess: The water in this jug fills a 1-liter bottle exactly 3 times. How many liters of water are in
    the jug?
  sources:
    ccss:
    - 3.MD.A.2
    lc: []
  strand: F2
- id: measurement.mass.gram-kilogram-unit
  concept: measurement
  facet: mass
  level: 2
  type: concept
  name: The gram and the kilogram as units of mass
  statement: The gram and the kilogram are standard units of mass, a kilogram being much heavier than
    a gram; the mass of an object in grams or kilograms is the number of those unit masses that balance
    it on a pan balance.
  assess: A bag of rice balances 2 one-kilogram masses on a pan balance. What is the mass of the bag?
    Is 1 gram heavier or lighter than 1 kilogram?
  sources:
    ccss:
    - 3.MD.A.2
    lc: []
  strand: F2
- id: measurement.weight.ounces-pounds.measure
  concept: measurement
  facet: weight
  level: 2
  type: procedure
  name: Measure weight in ounces or pounds with a scale
  statement: The weight of an object in ounces or pounds is read from a scale marked in that unit, reported
    as the number with the unit.
  assess: A scale marked in ounces shows its pointer at 12. How much does the bag of beans on it weigh?
  sources:
    ccss:
    - 4.MD.A.1
    lc: []
  strand: F2
- id: measurement.length.whole-plus-fraction
  concept: measurement
  facet: length
  level: 2
  type: representation
  name: A length of whole units plus a fraction of a unit
  statement: A length of a whole number of units and a fraction of a unit more, such as 2 1/4 inches,
    is the point on a ruler or number line that fraction of the way from that whole-number mark to the
    next; it is written as the whole number followed by the fraction and read two and one fourth.
  assess: On this inch ruler marked in fourths, mark 2 1/4 inches and 3 3/4 inches.
  sources:
    ccss:
    - 3.MD.B.4
    lc: []
  strand: F2
