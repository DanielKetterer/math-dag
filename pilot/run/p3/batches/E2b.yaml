- id: equation.linear.solution-count.generate
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: Write a linear equation with one, no, or infinitely many solutions
  statement: 'Write a linear equation in one variable with a required number of solutions by choosing
    the coefficients of x and the constants on the two sides: different coefficients for one solution,
    equal coefficients with different constants for no solution, equal coefficients and equal constants
    for infinitely many.'
  procedure:
  - Write each side in the form px + q.
  - For one solution, give the two sides different coefficients of x.
  - For no solution, give them the same coefficient of x and different constants.
  - For infinitely many solutions, give them the same coefficient of x and the same constant.
  assess: Fill in the blanks in 5x - 2 = __x + __ so the equation has no solution. Then fill them in again
    so it has infinitely many solutions.
  sources:
    ccss:
    - 8.EE.C.7.a
    lc:
    - 9ad64d89
  strand: E2
- id: equation.two-variable.graph-as-solutions
  concept: equation
  facet: two-variable
  level: 3
  type: concept
  name: The graph of an equation in two variables is the set of its solutions
  statement: The graph of an equation in x and y is the set of all points (a, b) such that substituting
    x = a and y = b makes the equation true.
  assess: Is the point (1, 1) on the graph of 3x + 2y = 5? Is the point (2, 0)?
  sources:
    ccss:
    - 8.EE.C.8.a
    lc: []
  strand: E2
- id: linear-system.solution.meaning
  concept: linear-system
  facet: algebraic
  level: 3
  type: concept
  name: A solution of a system of two equations
  statement: A solution of a system of two equations in x and y is a pair (a, b) that makes both equations
    true at the same time.
  assess: Is (2, 3) a solution of the system x + y = 5 and 2x - y = 1? Is (1, 4)?
  sources:
    ccss:
    - 8.EE.C.8.a
    lc:
    - b6895508
  strand: E2
- id: linear-system.solution.intersection
  concept: linear-system
  facet: graphical
  level: 3
  type: concept
  name: Solutions of a system as the intersection points of the graphs
  statement: The solutions of a system of two linear equations in two variables are exactly the points
    where their graphs intersect, because a point lies on both graphs exactly when its coordinates satisfy
    both equations.
  assess: Point P lies on the graph of the first equation of a system but not on the graph of the second.
    Point Q is where the two graphs cross. Which point's coordinates solve the system, and why do the
    other point's coordinates not?
  sources:
    ccss:
    - 8.EE.C.8.a
    lc:
    - b6895508
  strand: E2
- id: linear-system.graph.read
  concept: linear-system
  facet: graphical
  level: 2
  type: procedure
  name: Read the solution of a system from its drawn graphs
  statement: When the graphs of the two equations of a system are drawn, the solution is the coordinate
    pair of the point where the lines cross.
  procedure:
  - Find the point where the two lines cross.
  - Read its coordinates (x, y); that pair is the solution.
  assess: The graphs of the two equations of a system are drawn on a coordinate grid and cross at a grid
    point (shown). What is the solution of the system?
  sources:
    ccss:
    - 8.EE.C.8.b
    lc:
    - 7477f174
  strand: E2
- id: linear-system.graph.estimate
  concept: linear-system
  facet: graphical
  level: 3
  type: procedure
  name: Estimate the solution of a system by graphing
  statement: Estimate the solution of a system of two equations of the form y = mx + b by graphing both
    lines on the same axes and reading the coordinates of their intersection, estimating them when the
    intersection is not at a grid point.
  procedure:
  - Graph each equation as a line on the same coordinate axes.
  - Locate the point where the lines cross.
  - Read or estimate its coordinates.
  assess: Graph y = x + 1 and y = -2x + 6 on the same axes and estimate the solution of the system.
  sources:
    ccss:
    - 8.EE.C.8.b
    lc: []
  strand: E2
- id: linear-system.inspection
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: Tell by inspection how many solutions a simple system has
  statement: 'For a system written as ax + by = c and dx + ey = f: if the left side of one equation is
    k times the left side of the other, the system has infinitely many solutions when the right sides
    are in the same ratio k and no solution when they are not; otherwise it has exactly one solution.'
  procedure:
  - Write both equations with the x and y terms on the left and the constant on the right.
  - Check whether the left side of one equation is a number k times the left side of the other.
  - 'If not, the system has exactly one solution. If so, compare the right sides: k times the other right
    side means infinitely many solutions, anything else means no solution.'
  assess: 'Without solving, say how many solutions each system has: 3x + 2y = 5 and 3x + 2y = 6; x + y
    = 4 and 2x + 2y = 8; x + y = 4 and x - y = 2.'
  sources:
    ccss:
    - 8.EE.C.8.b
    lc:
    - 9cdd3a07
  strand: E2
- id: linear-system.solution-count.slopes
  concept: linear-system
  facet: graphical
  level: 3
  type: concept
  name: The number of solutions of a system from the slopes and intercepts of its lines
  statement: For a system of two equations of the form y = mx + b, different slopes give lines that cross
    once (one solution); equal slopes with different intercepts give parallel lines (no solution); equal
    slopes with equal intercepts give the same line (infinitely many solutions).
  assess: 'Without graphing or solving, say how many solutions each system has: y = 2x + 1 and y = 2x
    - 3; y = 2x + 1 and y = -x + 1; y = 2x + 1 and y = 1 + 2x.'
  sources:
    ccss:
    - 8.EE.C.8.b
    lc:
    - 9cdd3a07
  strand: E2
- id: linear-system.set-expressions-equal
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: Solve a system of two equations y = mx + b by setting the expressions equal
  statement: When both equations of a system give y in terms of x, solve the system by setting the two
    expressions for y equal, solving that equation for x, and substituting to find y.
  procedure:
  - Set the two expressions for y equal to each other.
  - Solve the resulting equation for x.
  - Substitute that value of x into either equation to find y.
  assess: Solve the system y = 3x - 2 and y = x + 4.
  sources:
    ccss:
    - 8.EE.C.8.b
    lc:
    - c7a43025
  strand: E2
- id: linear-system.substitution
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: Solve a system of two linear equations by substitution
  statement: Solve a system of two linear equations by expressing one variable in terms of the other from
    one equation, substituting that expression into the other equation, solving for the remaining variable,
    and substituting back.
  procedure:
  - If neither equation is already solved for a variable, solve one of them for one variable.
  - Substitute that expression for the variable in the other equation.
  - Solve the resulting one-variable equation.
  - Substitute the value back to find the other variable.
  assess: Solve the system y = 2x + 1 and 3x + y = 11 by substitution.
  sources:
    ccss:
    - 8.EE.C.8.b
    lc:
    - c7a43025
  strand: E2
- id: linear-system.elimination
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: Solve a system of two linear equations by elimination
  statement: Solve a system of two linear equations by adding or subtracting the equations, after multiplying
    one or both by a number if needed, so that one variable is eliminated; then solve for the other variable
    and substitute back.
  procedure:
  - Multiply one or both equations by numbers so that one variable has equal or opposite coefficients.
  - Subtract the equations if the coefficients are equal, or add them if they are opposite, to eliminate
    that variable.
  - Solve the resulting one-variable equation.
  - Substitute the value back to find the other variable.
  assess: Solve the system 2x + 3y = 12 and 2x - y = 4 by elimination.
  sources:
    ccss:
    - 8.EE.C.8.b
    lc:
    - c7a43025
  strand: E2
- id: linear-system.application.mathematical.simple
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: Find where two lines meet when each is given by its y-intercept and a slope or second point, with
    an integer meeting point
  statement: Solve mathematical problems about two lines, each given by its y-intercept together with
    its slope or one other point, that meet at a point with integer coordinates, by writing both equations
    as y = mx + b and solving the system.
  assess: Line A passes through (0, 1) and (2, 5). Line B passes through (0, 7) and (3, 4). At what point
    do the two lines meet?
  sources:
    ccss:
    - 8.EE.C.8.c
    lc:
    - d77eb62e
  strand: E2
- id: linear-system.application.mathematical
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: Decide whether and where two lines given by two points each intersect
  statement: For two lines, each given by any two of its points, decide whether they intersect and, if
    they do, find the intersection point, which may have fraction coordinates, by writing an equation
    for each line and solving the system.
  assess: Does the line through (1, 2) and (3, 6) meet the line through (0, 5) and (5, 0)? If so, at what
    point?
  sources:
    ccss:
    - 8.EE.C.8.c
    lc:
    - c7120f98
  strand: E2
- id: linear-system.application.real-world.simple
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: Solve real-world problems about when two constant-rate quantities are equal
  statement: Solve real-world problems about two quantities that each start at a given value and change
    at a constant rate, finding when they are equal, by writing two equations of the form y = mx + b and
    solving the system, in problems whose answers are whole numbers.
  assess: Plan A costs $20 plus $5 per month. Plan B costs $50 plus $2 per month. After how many months
    do the two plans cost the same, and what is that cost?
  sources:
    ccss:
    - 8.EE.C.8.c
    lc:
    - 237c924f
  strand: E2
- id: linear-system.application.real-world
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: Solve real-world problems about two unknowns given two linear conditions
  statement: Solve real-world problems about two unknown quantities related by two linear conditions,
    such as a total count and a total value, by writing a system of two linear equations and solving it
    algebraically.
  assess: A club sold 20 tickets, some at $2 and some at $5, and took in $76. How many tickets of each
    price did it sell?
  sources:
    ccss:
    - 8.EE.C.8.c
    lc:
    - 158e0231
  strand: E2
- id: functions.definition
  concept: functions
  facet: rule
  level: 3
  type: concept
  name: A function assigns to each input exactly one output
  statement: A function is a rule that assigns to each input exactly one output.
  assess: Rule A takes a positive whole number and gives any whole number smaller than it. Rule B takes
    a positive whole number and gives the number 1 less than it. Which rule is a function?
  sources:
    ccss:
    - 8.F.A.1
    lc:
    - f50b9fed
  strand: E2
- id: functions.identify.table
  concept: functions
  facet: rule
  level: 3
  type: procedure
  name: Decide from a table of pairs whether a relationship is a function
  statement: A table or list of input-output pairs fits a function exactly when no input is paired with
    two different outputs; the same output may appear for different inputs.
  procedure:
  - Look for any input that appears more than once.
  - If a repeated input has two different outputs, the relationship is not a function; otherwise the listed
    pairs fit a function.
  assess: 'Does each table show y as a function of x? Table 1: (1, 3), (2, 5), (1, 4). Table 2: (1, 3),
    (2, 3), (3, 3).'
  sources:
    ccss:
    - 8.F.A.1
    lc:
    - f50b9fed
  strand: E2
- id: functions.graph.meaning
  concept: functions
  facet: graph
  level: 3
  type: concept
  name: The graph of a function is the set of its input-output pairs
  statement: The graph of a function is the set of all points (x, y) in the coordinate plane where x is
    an input and y is the output the function assigns to x.
  assess: The point (3, 7) is on the graph of a function. What output does the function give for the input
    3? Must the point (7, 3) also be on the graph?
  sources:
    ccss:
    - 8.F.A.1
    lc:
    - d37fc186
  strand: E2
- id: functions.identify.graph
  concept: functions
  facet: graph
  level: 3
  type: procedure
  name: Decide from a graph whether y is a function of x
  statement: A graph in the coordinate plane shows y as a function of x exactly when no vertical line
    meets it in more than one point, since two points on one vertical line are one input with two outputs.
  procedure:
  - Picture vertical lines placed across the whole graph.
  - If some vertical line meets the graph in two or more points, y is not a function of x; otherwise it
    is.
  assess: 'Which of these graphs show y as a function of x: a circle; a V shape opening upward; a vertical
    line; a horizontal line?'
  sources:
    ccss:
    - 8.F.A.1
    lc:
    - d37fc186
  strand: E2
- id: linear-function.compare.rate-of-change
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: Compare the rates of change of two linear functions given in different forms
  statement: Given two linear functions represented in different ways (equation, table, graph, or verbal
    description), find the rate of change of each and decide which is greater.
  procedure:
  - 'Find each function''s rate of change from its representation: m in y = mx + b, or the change in y
    divided by the change in x between two points of a table or graph.'
  - Compare the two rates.
  assess: 'Function A is y = 3x + 2. Function B is given by the table x: 0, 2, 4 and y: 1, 9, 17. Which
    function has the greater rate of change?'
  sources:
    ccss:
    - 8.F.A.2
    lc:
    - 74b65cd2
  strand: E2
- id: linear-function.compare.initial-value
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: Compare the initial values of two linear functions given in different forms
  statement: Given two linear functions represented in different ways (equation, table, graph, or verbal
    description), find the initial value of each, the output for input 0, and decide which is greater.
  procedure:
  - 'Find each function''s initial value: b in y = mx + b, the y-intercept of a graph, or, for a table,
    the output reached by working back to input 0 at the constant rate.'
  - Compare the two initial values.
  assess: 'Function A is y = 4x + 1. Function B is given by the table x: 1, 2, 3 and y: 5, 7, 9. Which
    function has the greater initial value?'
  sources:
    ccss:
    - 8.F.A.2
    lc:
    - 74b65cd2
  strand: E2
- id: linear-function.line.equation-defines
  concept: linear-function
  facet: line
  level: 3
  type: concept
  name: An equation y = mx + b defines a linear function
  statement: Every equation that can be written in the form y = mx + b, for numbers m and b, defines y
    as a linear function of x.
  assess: 'Which of these define y as a linear function of x: y = 3x - 2; y = x^2 + 1; y = 5; y = 2/x;
    y = 7 - x/2?'
  sources:
    ccss:
    - 8.F.A.3
    lc:
    - 646a03d8
  strand: E2
- id: linear-function.line.graph-is-line
  concept: linear-function
  facet: line
  level: 3
  type: concept
  name: The graphs of linear functions are the non-vertical straight lines
  statement: The graph of a linear function is a straight line that is not vertical, and every straight
    line in the coordinate plane that is not vertical is the graph of a linear function.
  assess: 'Which of these are graphs of linear functions: a slanted straight line; a horizontal straight
    line; a vertical straight line; a curve through (0, 0), (1, 1) and (2, 4)?'
  sources:
    ccss:
    - 8.F.A.3
    lc:
    - 19cec163
  strand: E2
- id: linear-function.line.graph
  concept: linear-function
  facet: line
  level: 3
  type: procedure
  name: Graph a linear function from its equation y = mx + b
  statement: Graph y = mx + b by plotting two points whose coordinates satisfy the equation and drawing
    the straight line through them.
  procedure:
  - Plot the point (0, b).
  - Substitute another value of x into the equation to find a second point, and plot it.
  - Draw the straight line through the two points.
  assess: Graph y = -2x + 3.
  sources:
    ccss:
    - 8.F.A.3
    lc: []
  strand: E2
- id: linear-function.nonlinear.identify
  concept: linear-function
  facet: line
  level: 3
  type: procedure
  name: Show from its values that a function is not linear
  statement: A function is not linear if the rate of change, the change in output divided by the change
    in input, differs between two pairs of its points; if the rate is the same for every pair of listed
    points, those points lie on one line.
  procedure:
  - Take pairs of points from the table or rule.
  - Compute the rate of change for each pair.
  - If two rates differ, the function is not linear.
  assess: The area of a square is A = s^2. Use the side lengths s = 1, 2 and 3 to decide whether A is
    a linear function of s.
  sources:
    ccss:
    - 8.F.A.3
    lc:
    - 469afc42
  strand: E2
- id: linear-function.nonlinear.example
  concept: linear-function
  facet: line
  level: 3
  type: procedure
  name: Give an example of a function that is not linear
  statement: Produce a function that is not linear and show that it is not linear by exhibiting three
    of its points that do not lie on one line.
  procedure:
  - Choose a rule whose output does not change by equal amounts for equal changes in input, such as squaring
    the input.
  - Compute three points of the rule.
  - Show that the rates of change between two pairs of these points differ, so the points are not on one
    line.
  assess: Give a rule for a function that is not linear, and use three of its points to show that it is
    not linear.
  sources:
    ccss:
    - 8.F.A.3
    lc:
    - 469afc42
  strand: E2
- id: functions.qualitative.increasing-decreasing
  concept: functions
  facet: covariation
  level: 2
  type: representation
  name: Describe where a graphed relationship is increasing, decreasing, or constant
  statement: From a graph relating two quantities, describe the intervals of the input over which the
    output increases, decreases, or stays the same as the input increases.
  assess: The graph shown gives the height of a hot-air balloon over 60 minutes. Describe in words when
    the height increases, stays the same, and decreases.
  sources:
    ccss:
    - 8.F.B.5
    lc:
    - 13cc406a
  strand: E2
- id: functions.qualitative.linear-nonlinear
  concept: functions
  facet: covariation
  level: 2
  type: representation
  name: Tell from a graph where a relationship changes at a constant or a changing rate
  statement: From a graph relating two quantities, tell the intervals where the relationship is linear
    (the graph is straight, so the output changes at a constant rate) and where it is nonlinear (the graph
    curves, so the rate changes).
  assess: The graph shown gives the distance a car has traveled over 10 minutes. Over which interval does
    the car travel at a constant speed, and over which is its speed changing?
  sources:
    ccss:
    - 8.F.B.5
    lc:
    - 13cc406a
  strand: E2
- id: functions.qualitative.sketch
  concept: functions
  facet: covariation
  level: 2
  type: representation
  name: Sketch a graph from a verbal description of a relationship
  statement: Sketch a graph, without a numerical scale, whose increasing, decreasing, constant, straight
    and curved parts match a verbal description of how one quantity changes with another.
  assess: 'Sketch a graph of the temperature of a cup of hot cocoa over one hour: it cools quickly at
    first, then more slowly, and then stays at room temperature.'
  sources:
    ccss:
    - 8.F.B.5
    lc:
    - f0af8f05
  strand: E2
- id: addition.multi-digit
  concept: addition
  facet: operation
  level: 3
  type: procedure
  name: Add multi-digit whole numbers
  statement: Find the sum of multi-digit whole numbers, with sums up to 1,000,000, accurately and without
    objects, by any reliable method; place-value strategies and the standard algorithm both meet it.
  assess: Find 4,827 + 3,596 and 26,054 + 8,968. Use any method.
  sources:
    ccss:
    - 4.NBT.B.4
    lc: []
  strand: F1
- id: division.by-two-digit
  concept: division
  facet: base-ten
  level: 3
  type: procedure
  name: Divide by a two-digit number, no remainder
  statement: Find the whole-number quotient of a dividend of up to four digits by a two-digit divisor
    that divides it exactly, by any reliable method; partial quotients, an area model with numbers, and
    the standard algorithm all meet it.
  assess: Find 7,452 divided by 36 and 96 divided by 12. Use any method.
  sources:
    ccss:
    - 5.NBT.B.6
    lc: []
  strand: F1
- id: division.by-two-digit.remainder
  concept: division
  facet: base-ten
  level: 3
  type: procedure
  name: Divide by a two-digit number with a remainder
  statement: Find the whole-number quotient and the remainder of a dividend of up to four digits by a
    two-digit divisor, with the remainder less than the divisor, by any reliable method.
  assess: Find the quotient and remainder of 200 divided by 60, and of 1,000 divided by 24. Use any method.
  sources:
    ccss:
    - 5.NBT.B.6
    lc: []
  strand: F1
- id: division.remainder.meaning
  concept: division
  facet: measurement
  level: 2
  type: concept
  name: A remainder is what is left after making as many whole groups as possible
  statement: When a whole number of objects is put into as many groups of a given size as possible, the
    objects left over are the remainder; the remainder is always less than the group size, since otherwise
    one more group could be made.
  assess: 17 cubes are put into towers of 5 cubes. How many full towers are made, and how many cubes are
    left over? Could 6 cubes be left over? Why or why not?
  sources:
    ccss:
    - 4.NBT.B.6
    lc: []
  strand: F1
- id: division.successive-division
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: Dividing by a and then by b is dividing by a x b
  statement: For nonzero whole numbers a and b, dividing a number by a and then dividing the result by
    b gives the same quotient as dividing the number by a x b.
  assess: Maya divides 720 by 8 and then divides that answer by 10. Without computing, what single division
    gives the same answer?
  sources:
    ccss:
    - 5.NBT.A.2
    lc: []
  strand: F1
- id: operations.application.reasonableness.multi-digit
  concept: operations
  facet: whole-number
  level: 2
  type: justification
  name: Judge whether the answer to a multistep word problem is reasonable by estimating
  statement: An answer to a multistep whole-number word problem with multi-digit numbers and the four
    operations is judged reasonable or not by estimating the answer with rounded numbers or mental computation
    and comparing.
  assess: Lee says 4 boxes of 198 nails, minus 305 nails used, leaves 1,097 nails. Without computing exactly,
    use rounding to decide whether his answer is reasonable, and explain.
  sources:
    ccss:
    - 4.OA.A.3
    lc:
    - 44a2143c
  strand: F1
- id: fraction.subtraction.comparison
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Subtracting fractions as comparing parts of the same whole
  statement: 'Subtracting one fraction from another also tells how much more the first amount is than
    the second: the difference is the part that would have to be joined to the smaller amount to make
    the larger, where both fractions refer to the same whole.'
  assess: Using one bar as the whole, show how much more 5/6 is than 2/6, and say what the difference
    counts.
  sources:
    ccss:
    - 4.NF.B.3.d
    lc: []
  strand: F1
- id: number.halfway-between
  concept: number-line
  facet: core
  level: 2
  type: concept
  name: The number halfway between two numbers
  statement: 'The number halfway between two numbers is the point of the number line at the same distance
    from both: the smaller number plus half of the distance from it to the larger.'
  assess: What number is halfway between 40 and 50? Between 200 and 300? Between 4 and 6?
  sources:
    ccss:
    - 3.NBT.A.1
    lc: []
  strand: F1
- id: counting.skip.twos
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by twos from 0 to 20
  statement: 'Say the multiples of two in order from zero: two, four, six, ..., twenty.'
  assess: Count aloud by twos from 0 to 20.
  sources:
    ccss:
    - 2.OA.C.3
    lc: []
  strand: F1
- id: counting.skip.twenty-fives
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: Count by twenty-fives from 0 to 100
  statement: 'Say the multiples of twenty-five in order from zero: twenty-five, fifty, seventy-five, one
    hundred.'
  assess: Count aloud by twenty-fives from 0 to 100.
  sources:
    ccss:
    - 2.MD.C.8
    lc: []
  strand: F1
- id: counting.number-word.thousand
  concept: counting
  facet: sequence
  level: 1
  type: fact
  name: The number after nine hundred ninety-nine is one thousand
  statement: The number after nine hundred ninety-nine is one thousand, written 1000; counting by hundreds,
    one thousand comes after nine hundred.
  assess: 'What number comes right after 999? Count by hundreds from seven hundred: what comes after nine
    hundred?'
