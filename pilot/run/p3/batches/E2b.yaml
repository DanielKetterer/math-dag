- id: data.table-graph.read-values
  concept: data
  facet: paired-values
  level: 2
  type: representation
  name: Read paired values from a table or a graph
  statement: When pairs of values of two quantities are shown, the value of the second quantity that goes
    with a given value of the first is read in the same row of a table, or at the point of the graph above
    that value on the horizontal axis.
  assess: A table shows hours 1, 2, 3, 4 and miles 6, 12, 18, 24. How many miles go with 3 hours? On a
    graph of the same pairs, what is the y-value of the point above x = 4?
  sources:
    ccss:
    - 5.G.A.2
    lc: []
  strand: F1
- id: time.parts-of-day
  concept: time
  facet: day
  level: 1
  type: concept
  name: The parts of a day in order
  statement: A day goes in order through morning, afternoon, evening and night, and then the next morning
    begins; events of a day can be placed in that order.
  assess: Which comes first in a day, waking up in the morning or eating lunch in the afternoon? Which
    part of the day comes after the evening?
