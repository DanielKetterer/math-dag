- id: statistical-question.recognize
  concept: statistical-question
  facet: core
  level: 2
  type: concept
  name: Recognize a statistical question
  statement: A statistical question is one answered by collecting data that are expected to vary, with
    an answer that describes that variation; a question with one fixed answer is not statistical, even
    when it is about a group.
  assess: Which of these are statistical questions? (a) How tall is the classroom door? (b) How many hours
    did each student in this class sleep last night? (c) How many students are in this class? (d) How
    old are the students in this school?
  sources:
    ccss:
    - 6.SP.A.1
    lc:
    - 3fd3c652
  strand: S1
- id: distribution.describe
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: Describe a distribution by its center, spread, and shape
  statement: The values of a numerical data set collected to answer a statistical question form a distribution,
    described informally by where its values center, how far they spread, and its overall shape.
  assess: 'A dot plot shows the number of books each of 13 students read last month: 1 dot above 1, 3
    dots above 2, 5 dots above 3, 3 dots above 4, and 1 dot above 5. Describe where the data center, how
    far they spread, and the overall shape.'
  sources:
    ccss:
    - 6.SP.A.2
    lc:
    - ee7501cd
  strand: S1
- id: distribution.shape.symmetric-skewed
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: Symmetric and skewed distributions
  statement: A distribution is symmetric when its two sides about the center are close to mirror images,
    skewed right when its values trail off in a long tail toward larger values, and skewed left when they
    trail off in a long tail toward smaller values.
  assess: 'Three dot plots use a scale from 0 to 10. Plot A has most dots at 1 to 3 and a few stretching
    out to 9. Plot B has most dots at 7 to 9 and a few stretching down to 1. Plot C has its dots piled
    around 5 and falling off equally on both sides. Name the shape of each: symmetric, skewed left, or
    skewed right.'
  sources:
    ccss:
    - 6.SP.A.2
    lc:
    - 24b6a84f
  strand: S1
- id: center.meaning
  concept: center
  facet: core
  level: 2
  type: concept
  name: A measure of center summarizes a data set with one number
  statement: A measure of center is a single number that summarizes all the values of a numerical data
    set as one typical value.
  assess: 'Test scores: 70, 75, 80, 80, 95. Lee says ''a typical score is about 80.'' Kim says ''the scores
    go from 70 to 95.'' Raj says ''the scores are spread over 25 points.'' Whose statement gives a measure
    of center? Why are the other two not measures of center?'
  sources:
    ccss:
    - 6.SP.A.3
    lc:
    - 26d22200
  strand: S1
- id: variability.meaning
  concept: variability
  facet: core
  level: 2
  type: concept
  name: A measure of variation describes spread with one number
  statement: A measure of variation is a single number that describes how much the values of a numerical
    data set differ from one another; it is 0 when all the values are equal and larger when the values
    are more spread out.
  assess: Data set A is 5, 5, 5, 5. Data set B is 1, 3, 7, 9. Both have a typical value of 5. Which data
    set should have the larger measure of variation? What should the measure of variation of A be?
  sources:
    ccss:
    - 6.SP.A.3
    lc:
    - d6f0d3bc
  strand: S1
- id: data.dot-plot.read
  concept: data
  facet: line-plot
  level: 2
  type: representation
  name: Read the data set from a dot plot
  statement: A dot plot (line plot) shows a numerical data set on a number line with one dot above a value
    for each time the value occurs, so the full list of values can be read back from it.
  assess: A dot plot on a number line from 0 to 6 has 2 dots above 1, 1 dot above 3, and 3 dots above
    4. List every value in the data set.
  sources:
    ccss:
    - 6.SP.B.4
    lc:
    - b274f357
    - 1525b97c
  strand: S1
- id: data.histogram.make
  concept: data
  facet: histogram
  level: 2
  type: representation
  name: Make a histogram from a numerical data set
  statement: A histogram groups numerical data into equal-width intervals along a number line and draws
    over each interval a bar, with no gaps between adjacent bars, whose height is the number of values
    in that interval.
  procedure:
  - Choose equal-width intervals that together cover all the values, such as 10 to under 20 and 20 to
    under 30.
  - Count the values in each interval; a value on a boundary goes in the interval that starts there.
  - Draw a number line marked at the interval boundaries and a vertical scale for the counts.
  - Draw a bar over each interval up to its count, with no gaps between adjacent intervals.
  assess: 'Ages of 10 people: 12, 15, 21, 23, 24, 30, 31, 38, 39, 45. Make a histogram with the intervals
    10 to under 20, 20 to under 30, 30 to under 40, and 40 to under 50.'
  sources:
    ccss:
    - 6.SP.B.4
    lc:
    - a8fd1516
  strand: S1
- id: data.histogram.read
  concept: data
  facet: histogram
  level: 2
  type: representation
  name: Read interval counts from a histogram
  statement: Each bar of a histogram gives how many data values lie in its interval; a histogram does
    not show the individual values, so exact values cannot be read from it.
  assess: A histogram of ages has a bar of height 3 over 10 to under 20, a bar of height 5 over 20 to
    under 30, and a bar of height 2 over 30 to under 40. How many people are 20 to under 30 years old?
    Can you tell from the histogram how many people are exactly 25?
  sources:
    ccss:
    - 6.SP.B.4
    lc:
    - a5b32d92
  strand: S1
- id: data.box-plot.make
  concept: data
  facet: box-plot
  level: 2
  type: representation
  name: Draw a box plot from a five-number summary
  statement: 'A box plot shows the five-number summary of a numerical data set on a number line: a box
    from the lower quartile to the upper quartile with a line across it at the median, and whiskers from
    the box out to the minimum and to the maximum.'
  procedure:
  - Draw a number line whose scale covers the minimum and the maximum.
  - Mark the minimum, lower quartile, median, upper quartile, and maximum above the line.
  - Draw a box from the lower quartile to the upper quartile and a segment across the box at the median.
  - Draw a whisker from the lower quartile out to the minimum and one from the upper quartile out to the
    maximum.
  assess: A data set has minimum 2, lower quartile 5, median 7, upper quartile 10, and maximum 15. Draw
    its box plot on a number line from 0 to 16.
  sources:
    ccss:
    - 6.SP.B.4
    lc:
    - b81144de
  strand: S1
- id: data.box-plot.read
  concept: data
  facet: box-plot
  level: 2
  type: representation
  name: Read the five-number summary from a box plot
  statement: On a box plot, the minimum and maximum are read at the ends of the whiskers, the lower and
    upper quartiles at the ends of the box, and the median at the line inside the box.
  assess: A box plot on a number line from 0 to 20 has whiskers reaching 2 and 18, a box from 6 to 12,
    and a line inside the box at 9. Give the minimum, lower quartile, median, upper quartile, and maximum.
  sources:
    ccss:
    - 6.SP.B.4
    lc:
    - 8bf02e1b
  strand: S1
- id: data.observations.count
  concept: data
  facet: measurement
  level: 2
  type: concept
  name: The number of observations in a data set
  statement: The number of observations in a data set is the number of values recorded, one for each individual
    measured, so a value that occurs several times is counted each time it occurs.
  assess: 'Students reported how many pets they own: 0, 1, 0, 2, 0, 1, 5, 0, 1. Ana says there are 4 observations
    because there are 4 different values. How many observations are there, and what does each one record?'
  sources:
    ccss:
    - 6.SP.B.5.a
    lc:
    - 64c60862
  strand: S1
- id: data.attribute.describe
  concept: data
  facet: measurement
  level: 2
  type: concept
  name: Describe the attribute a numerical data set measures
  statement: Summarizing a numerical data set in context includes naming the attribute measured on each
    individual, how it was measured, and its unit of measurement.
  assess: 'Each student in a class timed the trip to school with a phone, from leaving home to arriving
    at school, and reported the result: 12, 25, 8, 15, 30. What attribute was measured, how was it measured,
    and in what unit?'
  sources:
    ccss:
    - 6.SP.B.5.b
    lc:
    - 6c56f94a
  strand: S1
- id: center.mean.compute
  concept: center
  facet: mean
  level: 3
  type: procedure
  name: Find the mean of a numerical data set
  statement: The mean of a numerical data set is the sum of its values divided by the number of values.
  procedure:
  - Add all the values in the data set, counting repeated values each time.
  - Count the number of values.
  - Divide the sum by the number of values.
  assess: Find the mean of 4, 7, 7, 10, 12.
  sources:
    ccss:
    - 6.SP.B.5.c
    lc:
    - 2ad87414
  strand: S1
- id: center.median.find
  concept: center
  facet: median
  level: 3
  type: procedure
  name: Find the median of a numerical data set
  statement: The median of a numerical data set is the middle value when the values are listed in order;
    when there is an even number of values, it is the number halfway between the two middle values.
  procedure:
  - List the values in order from least to greatest, keeping repeated values.
  - If the number of values is odd, the median is the middle value of the list.
  - If the number of values is even, the median is the number halfway between the two middle values.
  assess: Find the median of 9, 3, 7, 12, 5, 10.
  sources:
    ccss:
    - 6.SP.B.5.c
    lc:
    - 2ad87414
  strand: S1
- id: variability.quartiles.find
  concept: variability
  facet: iqr
  level: 3
  type: procedure
  name: Find the quartiles of a numerical data set
  statement: The lower quartile is the median of the lower half of the ordered data and the upper quartile
    is the median of the upper half, where the halves are the values before and after the median's position
    in the ordered list (the median itself is left out of both halves when the number of values is odd).
  procedure:
  - List the values in order and find the median.
  - Form the lower half from the values before the median's position, leaving out the median itself when
    the number of values is odd.
  - Form the upper half from the values after the median's position in the same way.
  - The lower quartile is the median of the lower half; the upper quartile is the median of the upper
    half.
  assess: Find the lower quartile and the upper quartile of 1, 3, 5, 6, 8, 9, 11, 13, 14.
  sources:
    ccss:
    - 6.SP.B.4
    - 6.SP.B.5.c
    lc:
    - 3280abf4
  strand: S1
- id: variability.iqr.compute
  concept: variability
  facet: iqr
  level: 3
  type: procedure
  name: Find the interquartile range
  statement: The interquartile range (IQR) of a numerical data set is the upper quartile minus the lower
    quartile, the length of the interval that holds the middle half of the ordered data.
  procedure:
  - Find the lower quartile and the upper quartile.
  - Subtract the lower quartile from the upper quartile.
  assess: A data set has minimum 4, lower quartile 12, median 15, upper quartile 20, and maximum 31. Find
    its interquartile range.
  sources:
    ccss:
    - 6.SP.B.5.c
    lc:
    - 3280abf4
  strand: S1
- id: variability.mad.compute
  concept: variability
  facet: mad
  level: 3
  type: procedure
  name: Find the mean absolute deviation
  statement: The mean absolute deviation (MAD) of a numerical data set is the mean of the distances of
    its values from the mean of the data set.
  procedure:
  - Find the mean of the data set.
  - For each value, find its distance from the mean (the larger of the two numbers minus the smaller).
  - Find the mean of these distances.
  assess: Find the mean absolute deviation of 2, 4, 6, 8. (The mean is 5.)
  sources:
    ccss:
    - 6.SP.B.5.c
    lc:
    - 3280abf4
  strand: S1
- id: distribution.pattern-deviations
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: Describe the overall pattern and striking deviations in context
  statement: Summarizing a numerical data set includes describing its overall pattern (where most values
    lie, clusters, gaps) and any values that depart strikingly from that pattern, with a possible reason
    for the departure drawn from how and where the data were gathered.
  assess: 'Minutes that 10 students spent on homework last night: 25, 30, 30, 35, 35, 35, 40, 40, 45,
    150. Describe the overall pattern, name the value that departs from it, and give a reason from the
    situation that could explain it.'
  sources:
    ccss:
    - 6.SP.B.5.c
    lc:
    - dc8ffe80
  strand: S1
- id: center.mean-median.outlier-effect
  concept: center
  facet: core
  level: 2
  type: concept
  name: An extreme value pulls the mean but barely moves the median
  statement: Changing one value to an extreme value pulls the mean toward it, because every value enters
    the sum, but changes the median little or not at all, because the median depends only on the middle
    position of the ordered values.
  assess: The data set 2, 3, 4, 5, 6 has mean 4 and median 4. If the 6 is replaced by 56, which changes
    a lot, the mean or the median? Explain without computing.
  sources:
    ccss:
    - 6.SP.B.5.d
    lc:
    - 8f6aea95
  strand: S1
- id: center.choose
  concept: center
  facet: core
  level: 3
  type: concept
  name: Choose the mean or the median to fit the distribution
  statement: For a roughly symmetric distribution without outliers the mean and median are close and the
    mean is a good summary of a typical value; for a strongly skewed distribution or one with outliers
    the median better describes a typical value.
  assess: 'Prices in thousands of dollars of the 7 houses on a street: 200, 210, 215, 220, 225, 230, 900.
    The mean is about 314 and the median is 220. Which better describes the price of a typical house on
    this street, and why?'
  sources:
    ccss:
    - 6.SP.B.5.d
    lc:
    - 8f6aea95
  strand: S1
- id: variability.choose
  concept: variability
  facet: core
  level: 3
  type: concept
  name: Choose the IQR or the MAD to fit the distribution
  statement: For a strongly skewed distribution or one with outliers the IQR, reported with the median,
    describes variability better, because extreme values inflate the MAD; for a roughly symmetric distribution
    without outliers the MAD, reported with the mean, is a good summary.
  assess: Commute times for 30 workers are strongly skewed right, with three commutes much longer than
    the rest. Should you report the IQR or the MAD as the measure of variability? Why?
  sources:
    ccss:
    - 6.SP.B.5.d
    lc:
    - 5b18f52e
  strand: S1
- id: variability.mad.interpret
  concept: variability
  facet: mad
  level: 2
  type: concept
  name: Interpret the mean absolute deviation
  statement: 'The MAD of a data set is the typical distance of its values from the mean, in the units
    of the data: a small MAD means the values lie close to the mean and a larger MAD means they lie farther
    from it.'
  assess: Class A's reading times have mean 30 minutes and MAD 2 minutes. Class B's have mean 30 minutes
    and MAD 9 minutes. What do the two MADs tell you about the reading times in each class?
  sources:
    ccss:
    - 7.SP.B.3
    lc:
    - a6f3f96d
  strand: S1
- id: sampling.population-sample.meaning
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: Population and sample
  statement: The population is the whole group a statistical question is about; a sample is the part of
    the population from which data are actually collected, in order to learn about the population.
  assess: To find out how many hours the 900 students at a school sleep on a school night, Mia asks 50
    of them. What is the population? What is the sample?
  sources:
    ccss:
    - 7.SP.A.1
    lc: []
  strand: S1
- id: sampling.representative
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: A generalization from a sample needs a representative sample
  statement: A conclusion about a population drawn from a sample is valid only if the sample is representative,
    meaning that for the characteristic studied the sample is like the population.
  assess: To find out how much the students at a school like soccer, Ben surveys the members of the school
    soccer team. Can he use his results to describe all the students at the school? Why or why not?
  sources:
    ccss:
    - 7.SP.A.1
    lc:
    - 3b3c207c
  strand: S1
- id: sampling.random.meaning
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: A random sample gives every member the same chance
  statement: A random sample is chosen so that every member of the population has the same chance of being
    selected.
  assess: Which of these ways of choosing 30 students give every student at the school the same chance
    of being chosen? (a) the first 30 students to arrive in the morning; (b) 30 names drawn from a bag
    holding one slip for every student; (c) 30 volunteers; (d) the 30 students in the art club.
  sources:
    ccss:
    - 7.SP.A.1
    lc: []
  strand: S1
- id: sampling.random.representative
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: Random sampling tends to produce representative samples
  statement: Because no part of the population is favored, random sampling tends to produce representative
    samples and so supports valid conclusions about the population, although any single random sample
    can still differ from the population by chance.
  assess: Kai says a random sample of 30 students is guaranteed to match the whole school exactly. Lia
    says random sampling only tends to give a sample like the school. Who is right, and why does choosing
    at random help?
  sources:
    ccss:
    - 7.SP.A.1
    lc:
    - f26b664c
  strand: S1
- id: sampling.variability.meaning
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: Sample statistics estimate population statistics and vary from sample to sample
  statement: A statistic computed from a sample, such as a sample mean or a sample proportion, estimates
    the matching population statistic but is usually not equal to it, and different samples of the same
    size usually give different values.
  assess: The mean height of all 600 students in a school is 152 cm. Ana's random sample of 20 students
    has mean height 150 cm and Tom's random sample of 20 students has mean height 155 cm. Did either of
    them make a mistake? Explain.
  sources:
    ccss:
    - 7.SP.A.2
    lc:
    - 78dd8689
  strand: S1
- id: sampling.variability.simulate.numerical
  concept: sampling
  facet: core
  level: 2
  type: procedure
  name: Gauge the error of a sample mean from several samples
  statement: Draw several random samples (or simulated samples) of the same size from the same population
    of numerical data, compute the mean of each, and use how far the sample means spread to judge how
    far an estimate from one sample might be from the population mean.
  procedure:
  - Draw several random samples of the same size from the population, or simulate them.
  - Compute the mean of each sample.
  - Note the least and greatest sample means and how far apart they are.
  - Use that spread to say about how far one sample mean might be from the population mean.
  assess: Lin drew 4 random samples of 10 words each from a book. The sample mean word lengths were 4.1,
    4.8, 4.4, and 4.7 letters. About how far off might an estimate of the book's mean word length from
    one sample of 10 words be?
  sources:
    ccss:
    - 7.SP.A.2
    lc:
    - 8cf753cf
    - 67bdbbc4
  strand: S1
- id: sampling.variability.simulate.categorical
  concept: sampling
  facet: core
  level: 2
  type: procedure
  name: Gauge the error of a sample proportion from several samples
  statement: Draw several random samples (or simulated samples) of the same size from the same population
    of categorical data, find the proportion in the category of interest in each, and use how far the
    sample proportions spread to judge how far an estimate from one sample might be from the population
    proportion.
  procedure:
  - Draw several random samples of the same size from the population, or simulate them.
  - In each sample, find the fraction of members in the category of interest.
  - Note the least and greatest sample proportions and how far apart they are.
  - Use that spread to say about how far one sample proportion might be from the population proportion.
  assess: Four random samples of 20 voters each were asked whether they will vote for Candidate A. The
    numbers saying yes were 11, 13, 9, and 12. About how far off might an estimate of Candidate A's share
    of all voters from one sample of 20 be?
  sources:
    ccss:
    - 7.SP.A.2
    lc:
    - 6f445725
    - 67bdbbc4
  strand: S1
- id: inference.estimate.population-mean
  concept: inference
  facet: estimate
  level: 3
  type: application
  name: Estimate a population mean from a random sample
  statement: When the data come from a random sample, the sample mean is used as an estimate of the unknown
    mean of the population.
  assess: A random sample of 5 words from a book has word lengths 3, 5, 4, 6, and 7 letters. Estimate
    the mean word length of all the words in the book.
  sources:
    ccss:
    - 7.SP.A.2
    lc:
    - c5ae0dd5
  strand: S1
- id: inference.estimate.population-proportion
  concept: inference
  facet: estimate
  level: 3
  type: application
  name: Estimate a population proportion from a random sample
  statement: When categorical data come from a random sample, the fraction of the sample in a category
    is used as an estimate of the unknown fraction of the population in that category.
  assess: In a random sample of 50 students at a school, 30 said they would vote for Maria and 20 said
    they would vote for Leo. Estimate the fraction of all the students at the school who would vote for
    Maria.
  sources:
    ccss:
    - 7.SP.A.2
    lc:
    - c5ae0dd5
  strand: S1
- id: distribution.compare.overlap
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: Judge the visual overlap of two distributions with similar variability
  statement: For two numerical distributions with similar variability shown on the same scale, the less
    their plots overlap, the larger the difference between their centers is compared with their spread;
    distributions that barely overlap are clearly separated.
  assess: Four dot plots share one scale and have about the same spread. Plot A runs from 150 to 170 and
    plot B from 152 to 172. Plot C runs from 150 to 170 and plot D from 175 to 195. Which pair of plots
    overlaps more? In which pair are the two groups clearly separated?
  sources:
    ccss:
    - 7.SP.B.3
    lc:
    - 5f434177
  strand: S1
- id: distribution.compare.center-difference-in-variability
  concept: distribution
  facet: core
  level: 3
  type: procedure
  name: Express the difference between two centers as a multiple of a measure of variability
  statement: For two numerical distributions with similar variability, the difference between their centers
    is measured in units of that variability by dividing the difference by the common measure of variability
    (such as the MAD).
  procedure:
  - Subtract the smaller center from the larger center.
  - Divide the difference by the common measure of variability.
  - Report the result as the number of measures of variability that separate the centers.
  assess: The mean height of the basketball team is 190 cm and the mean height of the soccer team is 180
    cm. The MAD of each team's heights is 5 cm. The difference between the means is how many MADs?
  sources:
    ccss:
    - 7.SP.B.3
    lc:
    - 5f41fba8
  strand: S1
- id: inference.compare.two-populations
  concept: inference
  facet: comparison
  level: 3
  type: application
  name: Compare two populations informally from random samples
  statement: Given the centers and measures of variability of random samples of numerical data from two
    populations, decide informally whether the values in one population are generally greater than in
    the other, judging the difference between the centers against the variability rather than against
    zero.
  assess: 'Random samples of 30 words from two books give these word lengths: Book A has mean 6.5 letters
    and MAD 1 letter; Book B has mean 4 letters and MAD 1 letter. Are the words in Book A generally longer
    than the words in Book B? Explain using the means and MADs.'
  sources:
    ccss:
    - 7.SP.B.4
    lc:
    - 60a6523a
  strand: S1
