- id: transformation.translation.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A translation moves every point the same distance in the same direction
  statement: A translation moves every point of the plane the same distance in the same direction; the
    image of a figure is the set of the moved points.
  assess: Picture A shows a flag after every point of it moved 4 cm to the right. Picture B shows the
    flag after it was turned about the foot of its pole, so points far from the foot moved farther than
    points near it. Which picture shows a translation, and which condition of a translation does the other
    one break?
  sources:
    ccss:
    - 8.G.A.1
    lc: []
  strand: G4
- id: transformation.reflection.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A reflection across a line
  statement: A reflection across a line l takes each point P not on l to the point P' on the other side
    of l such that segment PP' is perpendicular to l and l passes through its midpoint; each point on
    l stays where it is.
  assess: Point P is 3 cm from line l. Point Q is 3 cm from l on the other side, on the perpendicular
    to l through P. Point R is 3 cm from l on the other side, but not on that perpendicular. Point S is
    5 cm from l on the other side, on that perpendicular. Which point is the reflection of P across l?
  sources:
    ccss:
    - 8.G.A.1
    lc: []
  strand: G4
- id: transformation.rotation.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A rotation about a center through an angle
  statement: A rotation about a center O through d degrees in a given direction (clockwise or counterclockwise)
    takes each point P to the point P' with OP' = OP and angle POP' = d degrees, turned in that direction;
    O stays where it is.
  assess: Point P is 4 cm from point O. Point Q is 4 cm from O, 90 degrees counterclockwise from ray OP.
    Point R is 6 cm from O, 90 degrees counterclockwise from ray OP. Point S is 4 cm from O, 90 degrees
    clockwise from ray OP. Which point is the image of P under a rotation of 90 degrees counterclockwise
    about O?
  sources:
    ccss:
    - 8.G.A.1
    lc: []
  strand: G4
- id: transformation.rotation.draw
  concept: transformation
  facet: geometric
  level: 2
  type: procedure
  name: Draw the image of a figure under a rotation through any angle
  statement: Draw the image of a polygon under a rotation about a given center through a given angle,
    including angles that are not multiples of 90 degrees, by rotating each vertex with a protractor and
    ruler.
  procedure:
  - For one vertex P, draw segment OP from the center O.
  - With a protractor centered at O, draw a ray that makes the given angle with ray OP, turned in the
    given direction.
  - Mark P' on that ray so that OP' = OP.
  - Repeat for every vertex and join the image vertices in the same order.
  assess: Triangle ABC and a point O are drawn on a coordinate grid. Draw the image of triangle ABC under
    a rotation of 60 degrees counterclockwise about O.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 4815a989
  strand: G4
- id: transformation.rigid-motion.preserves-length
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: Rigid motions keep lines straight and lengths the same
  statement: A translation, reflection, or rotation, or any sequence of them, takes every line to a line
    and every line segment to a line segment of the same length.
  assess: Segment AB is 7 cm long. It is reflected across a line, and the image is then rotated 90 degrees
    about a point. Without measuring, what kind of figure is the final image of AB, and how long is it?
  sources:
    ccss:
    - 8.G.A.1.a
    lc:
    - 715f7b83
  strand: G4
- id: transformation.rigid-motion.preserves-length.verify
  concept: transformation
  facet: geometric
  level: 2
  type: justification
  name: Verify experimentally that rigid motions keep lengths
  statement: Moving a tracing of a segment by translations, reflections, and rotations, and comparing
    each image with the original, shows experimentally that the image is always a segment of the same
    length.
  assess: Trace segment AB on transparent paper. Translate the tracing, then reflect it, then rotate it,
    comparing the image with segment AB after each move. What do you find about the image, and how does
    the tracing show it?
  sources:
    ccss:
    - 8.G.A.1.a
    lc:
    - 715f7b83
  strand: G4
- id: transformation.rigid-motion.preserves-angle
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: Rigid motions keep angle measures the same
  statement: A translation, reflection, or rotation, or any sequence of them, takes every angle to an
    angle of the same measure.
  assess: Angle ABC measures 35 degrees. It is translated, and the image is then reflected across a line.
    Without measuring, what is the measure of the final image angle?
  sources:
    ccss:
    - 8.G.A.1.b
    lc:
    - 2d077eff
  strand: G4
- id: transformation.rigid-motion.preserves-angle.verify
  concept: transformation
  facet: geometric
  level: 2
  type: justification
  name: Verify experimentally that rigid motions keep angle measures
  statement: Moving a tracing of an angle by translations, reflections, and rotations, and comparing each
    image with the original, shows experimentally that the image is always an angle of the same measure.
  assess: Trace angle ABC on transparent paper. Translate the tracing, then reflect it, then rotate it,
    comparing the image with angle ABC after each move. What do you find about the image angle, and how
    does the tracing show it?
  sources:
    ccss:
    - 8.G.A.1.b
    lc:
    - 2d077eff
  strand: G4
- id: transformation.rigid-motion.preserves-parallel
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: Rigid motions take parallel lines to parallel lines
  statement: A translation, reflection, or rotation, or any sequence of them, takes two parallel lines
    to two parallel lines and two lines that meet to two lines that meet.
  assess: Lines m and n are parallel; lines p and q meet at a point. All four lines are rotated 50 degrees
    about a point, and the images are then reflected across a line. Without drawing, which pair of final
    image lines is parallel?
  sources:
    ccss:
    - 8.G.A.1.c
    lc:
    - d3571b9e
  strand: G4
- id: transformation.rigid-motion.preserves-parallel.verify
  concept: transformation
  facet: geometric
  level: 2
  type: justification
  name: Verify experimentally that rigid motions keep parallel lines parallel
  statement: Moving a tracing of two parallel lines by translations, reflections, and rotations, and checking
    each image, shows experimentally that the image lines are always parallel.
  assess: Draw two parallel lines and trace them on transparent paper. Translate the tracing, then reflect
    it, then rotate it, checking after each move whether the image lines are parallel. What do you find,
    and how does the tracing show it?
  sources:
    ccss:
    - 8.G.A.1.c
    lc:
    - d3571b9e
  strand: G4
- id: congruence.rigid-motion.meaning
  concept: congruence
  facet: rigid-motion
  level: 3
  type: concept
  name: Congruent figures as figures related by rigid motions
  statement: One figure is congruent to another when some sequence of translations, reflections, and rotations
    takes the first figure exactly onto the second.
  assess: Figure B is figure A rotated 90 degrees and then reflected across a line. Figure C has the same
    area as A but a different shape. Figure D is A enlarged with scale factor 2. Which of B, C, and D
    are congruent to A?
  sources:
    ccss:
    - 8.G.A.2
    lc:
    - f56c2e0b
  strand: G4
- id: congruence.sequence.describe
  concept: congruence
  facet: rigid-motion
  level: 2
  type: procedure
  name: Describe a sequence of rigid motions that shows two figures are congruent
  statement: Given two congruent figures and their corresponding vertices, describe a sequence of translations,
    reflections, and rotations that takes the first figure onto the second.
  procedure:
  - Match each vertex of the first figure with its corresponding vertex in the second.
  - Translate the first figure so that one vertex lands on its corresponding vertex.
  - Rotate about that vertex so that a side from it lies along the corresponding side of the second figure.
  - If the figures still do not match, reflect across the line containing that side.
  assess: On a coordinate grid, triangle ABC has A(1, 1), B(4, 1), C(1, 3), and the congruent triangle
    DEF has D(9, 4), E(6, 4), F(9, 6), with A -> D, B -> E, C -> F. Describe a sequence of translations,
    reflections, and rotations that takes triangle ABC onto triangle DEF.
  sources:
    ccss:
    - 8.G.A.2
    lc:
    - 07f4ca9a
  strand: G4
- id: transformation.dilation.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A dilation with a center and a scale factor
  statement: A dilation with center O and scale factor k, where k > 0, takes each point P to the point
    P' on ray OP with OP' = k x OP; the center O stays where it is.
  assess: Point P is 2 cm from point O. Point Q is on ray OP, 6 cm from O. Point R is on ray OP, 5 cm
    from O. Point S is 6 cm from O but not on ray OP. Which point is the image of P under the dilation
    with center O and scale factor 3?
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - e8c6b8a4
  strand: G4
- id: transformation.dilation.scale-lengths
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: A dilation multiplies every length by the scale factor
  statement: A dilation with scale factor k multiplies every length in a figure by k, so it enlarges the
    figure when k > 1 and reduces it when k < 1; when k is not 1 it changes lengths, so it is not a rigid
    motion.
  assess: A dilation has scale factor 1/2. A segment in the figure is 4 cm long. How long is the image
    of the segment, and is this dilation a rigid motion?
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - e8c6b8a4
  strand: G4
- id: transformation.dilation.preserves-angle
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: A dilation keeps angle measures the same
  statement: A dilation takes every angle to an angle of the same measure, so the image of a figure has
    the same angle measures as the figure.
  assess: Triangle ABC has angles of 30, 60, and 90 degrees. It is dilated with scale factor 3. Without
    measuring, what are the angle measures of the image triangle?
  sources:
    ccss:
    - 8.G.A.3
    - 8.G.A.4
    lc: []
  strand: G4
- id: transformation.translation.coordinates.image
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon after a translation
  statement: Find the coordinates of the image of a polygon after a translation of a given number of units
    horizontally and vertically; a horizontal move changes only the x-coordinate and a vertical move changes
    only the y-coordinate.
  procedure:
  - Move each vertex the given number of units right or left and the given number of units up or down
    on the grid.
  - 'Record each image vertex: the x-coordinate changes by the horizontal move and the y-coordinate by
    the vertical move.'
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 5). Give the coordinates of the vertices
    of its image after a translation 3 units left and 2 units down.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 0efc2703
    - c01f36a2
    - c78dcad7
  strand: G4
- id: transformation.translation.coordinates.rule
  concept: transformation
  facet: coordinate
  level: 3
  type: representation
  name: Write a translation as a coordinate rule
  statement: A translation of a units horizontally and b units vertically is the coordinate rule (x, y)
    -> (x + a, y + b), with a negative for a move left and b negative for a move down.
  assess: Write the coordinate rule (x, y) -> ( , ) for a translation 3 units left and 4 units up.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 5816f6d6
  strand: G4
- id: transformation.reflection.axis.coordinates.image
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon reflected across an axis
  statement: Find the coordinates of the image of a polygon reflected across the x-axis or the y-axis
    by moving each vertex to the point the same distance from the axis on the other side.
  procedure:
  - For each vertex, find its distance from the axis of reflection.
  - Locate the point the same distance from the axis on the other side, on the line through the vertex
    perpendicular to the axis, and record its coordinates.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 5). Give the coordinates of the vertices
    of its image after a reflection across the x-axis.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 0af11eff
    - 44df92bc
  strand: G4
- id: transformation.reflection.axis.coordinates.rule
  concept: transformation
  facet: coordinate
  level: 3
  type: representation
  name: Write a reflection across an axis as a coordinate rule
  statement: Reflection across the x-axis is the coordinate rule (x, y) -> (x, -y), and reflection across
    the y-axis is the rule (x, y) -> (-x, y).
  assess: Write the coordinate rule (x, y) -> ( , ) for a reflection across the y-axis.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 9483c9ac
  strand: G4
- id: transformation.reflection.parallel-to-axis.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon reflected across a line x = h or y = k
  statement: Find the coordinates of the image of a polygon reflected across a vertical line x = h or
    a horizontal line y = k by moving each vertex to the point the same distance from the line on the
    other side, keeping the other coordinate.
  procedure:
  - For each vertex, find its horizontal distance to the line x = h, or its vertical distance to the line
    y = k.
  - Move the same distance past the line on the other side, keeping the other coordinate the same, and
    record the image vertex.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 1), B(3, 1), and C(1, 4). Give the coordinates of the vertices
    of its image after a reflection across the line x = 5.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 6827617f
  strand: G4
- id: transformation.reflection.diagonal.coordinates
  concept: transformation
  facet: coordinate
  level: 3
  type: procedure
  name: Find the coordinates of the image of a polygon reflected across y = x or y = -x
  statement: Find the coordinates of the image of a polygon reflected across the line y = x with the rule
    (x, y) -> (y, x), or across the line y = -x with the rule (x, y) -> (-y, -x).
  procedure:
  - For a reflection across y = x, swap the two coordinates of each vertex.
  - For a reflection across y = -x, swap the two coordinates of each vertex and change the sign of both.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 2), B(1, 5), and C(3, 2). Give the coordinates of the vertices
    of its image after a reflection across the line y = -x.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 402e7eef
  strand: G4
- id: transformation.rotation.origin.coordinates
  concept: transformation
  facet: coordinate
  level: 3
  type: procedure
  name: Find the coordinates of the image of a polygon rotated about the origin by a multiple of 90 degrees
  statement: Find the coordinates of the image of a polygon rotated about the origin by a multiple of
    90 degrees with the rules (x, y) -> (-y, x) for 90 degrees counterclockwise, (x, y) -> (-x, -y) for
    180 degrees, and (x, y) -> (y, -x) for 90 degrees clockwise.
  procedure:
  - 'Choose the rule for the angle and direction: 90 degrees counterclockwise (the same as 270 degrees
    clockwise) is (x, y) -> (-y, x); 180 degrees is (x, y) -> (-x, -y); 90 degrees clockwise (the same
    as 270 degrees counterclockwise) is (x, y) -> (y, -x).'
  - Apply the rule to each vertex.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 1), B(4, 1), and C(1, 3). Give the coordinates of the vertices
    of its image after a rotation of 90 degrees counterclockwise about the origin.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 61d83709
  strand: G4
- id: transformation.rotation.center.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon rotated by a multiple of 90 degrees about a grid
    point
  statement: Find the coordinates of the image of a polygon rotated by a multiple of 90 degrees about
    a grid point other than the origin by turning each vertex's horizontal and vertical offsets from the
    center.
  procedure:
  - 'For each vertex, count its offset from the center: a units across and b units up, with a negative
    for left and b negative for down.'
  - 'Turn the offset: (a, b) becomes (-b, a) for 90 degrees counterclockwise, (-a, -b) for 180 degrees,
    and (b, -a) for 90 degrees clockwise.'
  - Count the turned offset from the center to locate the image vertex, and record its coordinates.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(2, 1), B(5, 1), and C(2, 3). Give the coordinates of the vertices
    of its image after a rotation of 90 degrees counterclockwise about A.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - b12819c6
  strand: G4
- id: transformation.sequence.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon after a sequence of rigid motions
  statement: Find the coordinates of the image of a polygon after a sequence of translations, reflections,
    and rotations by applying each motion, in the given order, to the image produced by the one before.
  procedure:
  - Apply the first motion to each vertex and record the image vertices.
  - Apply the next motion to those image vertices, not to the original figure.
  - Repeat until every motion in the sequence has been applied; the last set of vertices is the final
    image.
  assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 4). It is reflected across the x-axis,
    and the image is then translated 3 units left. Give the coordinates of the vertices of the final image.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - dd9fa6a3
    - 128d2c8f
    - 2d10f542
  strand: G4
- id: transformation.dilation.origin.coordinates
  concept: transformation
  facet: coordinate
  level: 3
  type: procedure
  name: Find the coordinates of the image of a polygon under a dilation centered at the origin
  statement: Find the coordinates of the image of a polygon under a dilation with center at the origin
    and scale factor k with the rule (x, y) -> (k x x, k x y).
  procedure:
  - Multiply both coordinates of each vertex by k.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(2, 4), B(6, 4), and C(2, 8). Give the coordinates of the vertices
    of its image under a dilation with center at the origin and scale factor 1/2.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - b6e6ec4d
  strand: G4
- id: transformation.dilation.center.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon under a dilation with another center
  statement: Find the coordinates of the image of a polygon under a dilation whose center is a point other
    than the origin by multiplying each vertex's horizontal and vertical offsets from the center by the
    scale factor.
  procedure:
  - 'For each vertex, count its offset from the center: a units across and b units up, with a negative
    for left and b negative for down.'
  - Multiply both parts of the offset by the scale factor k.
  - Count the new offset from the center to locate the image vertex, and record its coordinates.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 1), B(3, 1), and C(1, 4). Give the coordinates of the vertices
    of its image under a dilation with center A and scale factor 2.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - c169f8f0
  strand: G4
- id: transformation.sequence.with-dilation.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon after a sequence that includes a dilation
  statement: Find the coordinates of the image of a polygon after a sequence of a dilation and rigid motions
    by applying each transformation, in the given order, to the image produced by the one before.
  procedure:
  - Apply the first transformation to each vertex and record the image vertices.
  - Apply the next transformation to those image vertices, not to the original figure.
  - Repeat until every transformation in the sequence has been applied; the last set of vertices is the
    final image.
  assess: Triangle ABC has vertices A(1, 1), B(3, 1), and C(1, 2). It is dilated with center at the origin
    and scale factor 2, and the image is then translated 1 unit down. Give the coordinates of the vertices
    of the final image.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 4c98d1fb
  strand: G4
- id: similarity.transformation.meaning
  concept: similarity
  facet: transformation
  level: 3
  type: concept
  name: Similar figures as figures related by rigid motions and dilations
  statement: One figure is similar to another when some sequence of translations, reflections, rotations,
    and dilations takes the first figure exactly onto the second.
  assess: Rectangle A is 2 cm by 4 cm. Figure B is A dilated with scale factor 3 and then rotated 90 degrees.
    Rectangle C is 5 cm by 7 cm, each side 3 cm longer than in A. Rectangle D is 2 cm by 8 cm, A stretched
    in one direction only. Which of B, C, and D are similar to A?
  sources:
    ccss:
    - 8.G.A.4
    lc:
    - 92a7fb82
  strand: G4
- id: similarity.sequence.describe
  concept: similarity
  facet: transformation
  level: 2
  type: procedure
  name: Describe a sequence of transformations that shows two figures are similar
  statement: Given two similar figures and their corresponding vertices, describe a sequence of a dilation
    and translations, reflections, and rotations that takes the first figure onto the second.
  procedure:
  - Match each vertex of the first figure with its corresponding vertex in the second.
  - 'Find the scale factor k: the length of a side of the second figure divided by the length of the corresponding
    side of the first.'
  - Dilate the first figure by k about any center; the image is congruent to the second figure.
  - Describe a sequence of translations, reflections, and rotations that takes the dilated image onto
    the second figure.
  assess: On a coordinate grid, triangle ABC has A(0, 0), B(2, 0), C(0, 1), and the similar triangle DEF
    has D(6, 2), E(6, 6), F(4, 2), with A -> D, B -> E, C -> F. Describe a sequence of a dilation and
    rigid motions that takes triangle ABC onto triangle DEF.
  sources:
    ccss:
    - 8.G.A.4
    lc:
    - 655932cc
  strand: G4
- id: geometry.similar-triangles
  concept: similarity
  facet: proportional-sides
  level: 3
  type: concept
  name: Similar triangles have proportional corresponding sides
  statement: 'If triangle ABC is similar to triangle DEF with A -> D, B -> E, C -> F, then each side of
    DEF is the same number k times the corresponding side of ABC: DE/AB = EF/BC = DF/AC = k.'
  assess: 'Triangle ABC is similar to triangle DEF with A -> D, B -> E, C -> F, and DE is 3 times as long
    as AB. Which must be true: EF = 3 x BC; EF = BC + 3; EF = BC?'
  sources:
    ccss:
    - 8.G.A.4
    - 8.G.A.5
    lc: []
  strand: G4
- id: similarity.triangle.angle-angle
  concept: similarity
  facet: transformation
  level: 3
  type: concept
  name: The angle-angle criterion for similar triangles
  statement: If two angles of one triangle have the same measures as two angles of another triangle, the
    two triangles are similar.
  assess: Triangle ABC has angles of 40 degrees and 75 degrees. Triangle DEF is larger and also has angles
    of 40 degrees and 75 degrees. Triangle GHI has one angle of 40 degrees; its other angles are not given.
    Which of DEF and GHI must be similar to ABC?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 6f4e508f
  strand: G4
- id: similarity.triangle.angle-angle.explain
  concept: similarity
  facet: transformation
  level: 4
  type: justification
  name: Explain informally why two pairs of equal angles make triangles similar
  statement: If angle A = angle D and angle B = angle E in triangles ABC and DEF, dilating ABC with scale
    factor DE/AB gives a triangle whose side matching AB is as long as DE and whose angles are unchanged;
    rigid motions then place that side on DE with the third vertex on the same side as F, and because
    the rays from D and E at the matching angles meet only at F, the image lands exactly on DEF, so the
    triangles are similar.
  assess: Triangles ABC and DEF have angle A = angle D and angle B = angle E. Explain, using a dilation
    and rigid motions, why the triangles must be similar.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 6f4e508f
  strand: G4
- id: similarity.triangle.angle-angle.decide
  concept: similarity
  facet: transformation
  level: 3
  type: procedure
  name: Decide from angle measures whether two triangles are similar
  statement: Decide whether two triangles are similar from given angle measures by finding any missing
    third angle with the angle sum and checking for two pairs of equal angles.
  procedure:
  - For each triangle with only two angles given, find the third angle by subtracting their sum from 180
    degrees.
  - Compare the angle measures of the two triangles.
  - If two angles of one triangle equal two angles of the other, the triangles are similar; otherwise
    they are not.
  assess: Triangle ABC has angles of 50 degrees and 60 degrees. Triangle DEF has angles of 60 degrees
    and 70 degrees. Are the two triangles similar?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 6f4e508f
  strand: G4
- id: angle.transversal.corresponding
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: Corresponding angles at parallel lines cut by a transversal are equal
  statement: When a transversal crosses two parallel lines, corresponding angles, the angles in matching
    positions at the two crossing points, have equal measures.
  assess: Line t crosses lines m and n. At the crossing with m, the angle above m and to the right of
    t measures 70 degrees. In diagram 1, m and n are parallel; in diagram 2, they are not. In which diagram
    must the angle above n and to the right of t also measure 70 degrees?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.corresponding.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain with a translation why corresponding angles are equal
  statement: Translating along the transversal by the distance between the two crossing points moves line
    m to a line through the other crossing point parallel to m, which must be n; since a translation keeps
    angle measures, each angle at the first crossing lands on its corresponding angle at the second, so
    corresponding angles are equal.
  assess: Parallel lines m and n are crossed by line t at points P and Q. Explain, using a translation,
    why each angle at P has the same measure as its corresponding angle at Q.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.alternate-interior
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: Alternate interior angles at parallel lines cut by a transversal are equal
  statement: When a transversal crosses two parallel lines, alternate interior angles, the angles between
    the two lines on opposite sides of the transversal, have equal measures.
  assess: Line t crosses lines m and n. Angle 3 is between m and n, left of t, at the crossing with m;
    angle 6 is between m and n, right of t, at the crossing with n; angle 3 measures 110 degrees. In diagram
    1, m and n are parallel; in diagram 2, they are not. In which diagram must angle 6 measure 110 degrees?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.alternate-interior.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain with vertical and corresponding angles why alternate interior angles are equal
  statement: Each alternate interior angle at one crossing is vertical to the angle that corresponds to
    the other alternate interior angle; vertical angles are equal and corresponding angles are equal,
    so the two alternate interior angles are equal.
  assess: Parallel lines m and n are crossed by line t. Explain, using vertical angles and corresponding
    angles, why the two alternate interior angles marked in the diagram are equal.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.find-angles
  concept: angle
  facet: measure
  level: 3
  type: procedure
  name: Find all eight angles at parallel lines cut by a transversal from one angle
  statement: Given one of the eight angles formed when a transversal crosses two parallel lines, find
    the other seven using vertical angles, adjacent angles on a line that add to 180 degrees, and corresponding
    angles.
  procedure:
  - At the crossing with the given angle, give its vertical angle the same measure.
  - Give each of the two angles next to it on a line the measure 180 degrees minus the given angle.
  - At the other crossing, give each angle the measure of its corresponding angle.
  assess: Parallel lines m and n are crossed by line t. One of the eight angles formed measures 115 degrees.
    Find the measures of the other seven angles.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.triangle.sum
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: The angles of a triangle add to 180 degrees
  statement: The three angle measures of any triangle add to 180 degrees.
  assess: Without measuring, what is the sum of the three angle measures of the long, thin obtuse triangle
    shown?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.triangle.sum.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain with a parallel line why the angles of a triangle add to 180 degrees
  statement: The line through one vertex parallel to the opposite side makes two angles at that vertex
    that are alternate interior angles with the other two angles of the triangle; these two angles and
    the triangle's angle at that vertex form a straight angle, so the three angles of the triangle add
    to 180 degrees.
  assess: Triangle ABC is drawn with the line through C parallel to AB. Use this line to explain why angle
    A + angle B + angle C = 180 degrees for every triangle.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.triangle.third-angle
  concept: angle
  facet: measure
  level: 3
  type: procedure
  name: Find the third angle of a triangle
  statement: Find the unknown angle measure of a triangle by subtracting the sum of the two known angle
    measures from 180 degrees.
  procedure:
  - Add the two known angle measures.
  - Subtract the sum from 180 degrees.
  assess: Two angles of a triangle measure 47 degrees and 68 degrees. What is the measure of the third
    angle?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.triangle.exterior
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: An exterior angle of a triangle equals the sum of the two remote interior angles
  statement: An exterior angle of a triangle, formed by one side and the extension of an adjacent side,
    has a measure equal to the sum of the two interior angles that are not next to it.
  assess: 'In triangle ABC, side BC is extended past C to point D. Which is always true: angle ACD = angle
    A + angle B; angle ACD = 180 degrees - angle A; angle ACD = angle B + angle ACB?'
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
