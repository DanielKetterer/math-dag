  strand: Q1
- id: absolute-value.magnitude.context
  concept: absolute-value
  facet: magnitude
  level: 2
  type: concept
  name: Absolute value as the size of a signed quantity in context
  statement: For a quantity in a real-world context written as a signed number, its absolute value is
    the size of the quantity without its direction, such as the amount of a debt or a depth below sea
    level.
  assess: An account balance is -30 dollars. What does |-30| = 30 tell you about the account?
  sources:
    ccss:
