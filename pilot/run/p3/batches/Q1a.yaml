    lc:
    - 8ef052eb
  strand: Q1
- id: absolute-value.vs-order
  concept: absolute-value
  facet: distance
  level: 3
  type: concept
  name: Comparing absolute values is not comparing numbers
  statement: 'A comparison of absolute values is a different statement from a comparison of the numbers:
    of two negative numbers, the one with the greater absolute value is the lesser number.'
  assess: 'True or false: -8 < -3. True or false: |-8| < |-3|. Explain why the two answers differ.'
  sources:
