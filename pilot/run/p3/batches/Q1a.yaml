  level: 2
  type: concept
  name: Absolute value of a fraction or decimal as its distance from 0
  statement: The absolute value of a rational number a given as a fraction or decimal, written |a|, is
    the distance from 0 to a on the number line.
  assess: Use a number line to find |-2.5| and |-3/4|.
  sources:
    ccss:
