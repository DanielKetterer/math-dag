- id: rational-number.multiplication.sign-rule
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: The sign rule for multiplying signed numbers
  statement: The product of two nonzero rational numbers is positive when they have the same sign and
    negative when they have opposite signs, and its absolute value is the product of their absolute values.
  assess: 'Without computing the values, give the sign of each product: (-3.1) x 4.7; (-2/5) x (-8); 0.5
    x 12.'
  sources:
    ccss:
    - 7.NS.A.2.a
    lc:
    - 056c6b51
  strand: Q1
- id: rational-number.multiplication.sign-rule.explain
  concept: rational-number
  facet: core
  level: 4
  type: justification
  name: Explain with the distributive property why (-1) x (-1) = 1
  statement: If multiplication of signed numbers keeps the distributive property, then 0 = (-1) x (1 +
    (-1)) = (-1) x 1 + (-1) x (-1) = -1 + (-1) x (-1), so (-1) x (-1) must be the additive inverse of
    -1, which is 1.
  assess: Use 0 = (-1) x (1 + (-1)) and the distributive property to explain why (-1) x (-1) must equal
    1.
  sources:
    ccss:
    - 7.NS.A.2.a
    lc:
    - 056c6b51
  strand: Q1
