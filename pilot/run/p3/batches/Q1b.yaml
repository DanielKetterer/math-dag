- id: rational-number.addition.integers
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: Add two integers
  statement: 'Add two integers by the sign rules: with the same sign, add the absolute values and keep
    the sign; with opposite signs, subtract the smaller absolute value from the larger and take the sign
    of the addend with the larger absolute value.'
  procedure:
  - If one addend is 0, the sum is the other addend.
  - If the addends have the same sign, add their absolute values and give the sum that sign.
  - If they have opposite signs, subtract the smaller absolute value from the larger and give the result
    the sign of the addend with the larger absolute value; if the absolute values are equal, the sum is
    0.
  assess: Compute -9 + 4, -6 + (-8), and 7 + (-7).
  sources:
    ccss:
    - 7.NS.A.1
    lc: []
  strand: Q1
- id: rational-number.addition.rationals
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: Add two signed fractions or decimals
  statement: Add two rational numbers given as signed fractions or decimals by the sign rules for addition,
    computing the sum or difference of their absolute values as fractions or decimals.
  procedure:
  - If one addend is 0, the sum is the other addend.
  - If the addends have the same sign, add their absolute values as fractions or decimals and give the
    sum that sign.
  - If they have opposite signs, subtract the smaller absolute value from the larger as fractions or decimals
    and give the result the sign of the addend with the larger absolute value; if the absolute values
    are equal, the sum is 0.
  assess: Compute -2.4 + 0.75 and -1/2 + (-1/3).
  sources:
    ccss:
    - 7.NS.A.1
    - 7.NS.A.3
    lc:
    - 2f8040bb
  strand: Q1
