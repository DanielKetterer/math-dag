  facet: decimal-expansion
  level: 3
  type: concept
  name: The decimal form of a rational number terminates or eventually repeats
  statement: The decimal form of a rational number either terminates, ending in 0s, or eventually repeats
    one block of digits forever.
  assess: 'Which of these could be the decimal form of a fraction: 0.375; 0.41666... with the 6 repeating
    forever; 0.1010010001... with one more 0 before each 1?'
