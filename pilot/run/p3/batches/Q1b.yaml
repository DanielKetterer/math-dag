  type: justification
  name: Show on a number line that a number plus its opposite is 0
  statement: On a number line, starting at a and moving |a| in the direction of -a, back toward 0, lands
    exactly on 0, so a + (-a) = 0.
  assess: Use a number line to show why 3.5 + (-3.5) = 0.
