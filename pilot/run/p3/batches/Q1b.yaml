- id: rational-number.definition
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: A rational number is a quotient of integers
  statement: A rational number is a number that can be written as p/q for some integers p and q with q
    not 0.
  assess: Show that -1.25, 3 1/2 and 6 are rational numbers by writing each as a quotient of two integers.
  sources:
    ccss:
    - 8.NS.A.1
    lc:
    - 1de87160
  strand: Q1
- id: rational-number.decimal-expansion.terminate-or-repeat.explain
  concept: rational-number
  facet: decimal-expansion
  level: 4
  type: justification
  name: Explain why the decimal of a fraction terminates or repeats
  statement: In the long division of a whole number a by a positive whole number b, every remainder is
    one of 0, 1, ..., b - 1, and once the digits of a are used up each step depends only on the remainder;
    so within b such steps either a remainder is 0 and the decimal terminates, or a remainder recurs and
    from then on the digits repeat.
  assess: When you divide 1 by 7 with long division, explain why some remainder must recur within 7 steps
    after the decimal point, and why the digits of the quotient repeat from then on.
  sources:
    ccss:
    - 8.NS.A.1
    lc:
    - 796584cf
  strand: Q1
- id: rational-number.repeating-decimal.to-fraction
  concept: rational-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: Write an eventually repeating decimal as a quotient of integers
  statement: Write an eventually repeating decimal x as a quotient of integers by subtracting x from 10^k
    x, where k is the number of digits in the repeating block, so that the repeating parts cancel, and
    solving for x.
  procedure:
  - Let x be the decimal and k the number of digits in its repeating block.
  - Write 10^k x by moving the decimal point of x k places to the right.
  - Subtract x from 10^k x; the repeating parts cancel, leaving (10^k - 1) x = d, where d is a terminating
    decimal.
  - Write x = d/(10^k - 1), and multiply the numerator and denominator by a power of 10 if needed so both
    are integers.
  assess: Write 0.8333..., with the 3 repeating, as a quotient of two integers.
  sources:
    ccss:
    - 8.NS.A.1
    lc:
    - 7608d2f3
  strand: Q1
- id: real-number.decimal-expansion
  concept: real-number
  facet: decimal-expansion
  level: 2
  type: concept
  name: Every number has a decimal expansion
  statement: Every number on the number line has a decimal expansion, possibly never ending, whose digits
    record which tenth, then which hundredth, and so on, the number lies in.
  assess: A point P on the number line lies between 0.7 and 0.8, and between 0.73 and 0.74. What are the
    first two digits after the decimal point in the decimal expansion of P?
  sources:
    ccss:
    - 8.NS.A.1
    lc:
    - ab61aaed
  strand: Q1
- id: real-number.irrational.definition
  concept: real-number
  facet: core
  level: 3
  type: concept
  name: An irrational number is a number that is not rational
  statement: A number that cannot be written as p/q with integers p and q and q not 0 is called irrational.
  assess: 'Which of these are irrational: 0.25, which equals 1/4; sqrt(2), which cannot be written as
    a quotient of integers; -7; 0.333..., which equals 1/3?'
  sources:
    ccss:
    - 8.NS.A.1
    lc:
    - a622aa0e
  strand: Q1
- id: real-number.irrational.identify
  concept: real-number
  facet: core
  level: 3
  type: procedure
  name: Classify a number as rational or irrational
  statement: 'Classify a number given in one of these forms: integers, fractions of integers, terminating
    decimals, eventually repeating decimals and square roots of perfect squares are rational; square roots
    of whole numbers that are not perfect squares, pi, and decimals that neither terminate nor repeat
    are irrational.'
  procedure:
  - If the number is an integer, a fraction of integers, or a terminating or eventually repeating decimal,
    it is rational.
  - If it is the square root of a whole number, it is rational when that whole number is a perfect square
    and irrational otherwise.
  - If it is pi, or a decimal that neither terminates nor repeats, it is irrational.
  assess: 'Classify each as rational or irrational: sqrt(16); sqrt(15); 0.121212... with 12 repeating;
    0.1211211121111... with one more 1 each time; pi; -4/9.'
  sources:
    ccss:
    - 8.NS.A.1
    lc:
    - a622aa0e
  strand: Q1
- id: real-number.approximate.truncate
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: Bound a number between truncations of its decimal expansion
  statement: If t is the decimal expansion of a positive number x cut off after n decimal places, then
    t <= x <= t + 1/10^n, which bounds x between two decimals with n places.
  procedure:
  - Cut off the decimal expansion of x after n decimal places to get t.
  - Add 1 in the last place kept to get t + 1/10^n.
  - State that x lies between t and t + 1/10^n.
  assess: pi = 3.14159... Between which two consecutive hundredths does pi lie?
  sources:
    ccss:
    - 8.NS.A.2
    lc:
    - bac2efb6
  strand: Q1
- id: real-number.approximate.square-root
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: Find decimal bounds for a square root by squaring
  statement: 'Find decimals with a given number of places between which sqrt(n) lies, for a whole number
    n that is not a perfect square, by squaring trial values: first consecutive whole numbers, then consecutive
    tenths, then consecutive hundredths.'
  procedure:
  - Find the whole number a with a^2 < n < (a + 1)^2.
  - Square a + 0.1, a + 0.2, and so on, until a square first exceeds n; sqrt(n) lies between that value
    and the one before it.
  - Repeat inside that interval with steps of 0.01, and so on, for each further decimal place.
  assess: Without a calculator, show that sqrt(5) is between 2 and 3, and then between 2.2 and 2.3.
  sources:
    ccss:
    - 8.NS.A.2
    lc:
    - bac2efb6
    - e96d5914
  strand: Q1
- id: real-number.number-line.approximate
  concept: real-number
  facet: core
  level: 2
  type: representation
  name: Locate an irrational number approximately on a number line
  statement: Mark an irrational number approximately on a number line by placing it between the two decimals
    that bound it.
  assess: sqrt(7) is between 2.6 and 2.7. Mark sqrt(7) approximately on a number line marked from 2 to
    3 in tenths.
  sources:
    ccss:
    - 8.NS.A.2
    lc:
    - e96d5914
  strand: Q1
- id: real-number.compare.approximation
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: Compare irrational numbers with decimal bounds
  statement: Compare two numbers, at least one irrational, by bounding each between decimals with more
    and more places until the two bounding intervals do not overlap; the number in the higher interval
    is greater.
  procedure:
  - Bound each number between two consecutive tenths.
  - If the two intervals overlap, bound each between consecutive hundredths, and so on, until they do
    not overlap.
  - The number whose interval lies to the right is the greater.
  assess: Which is greater, sqrt(10) or pi? Use decimal bounds for each to decide.
  sources:
    ccss:
    - 8.NS.A.2
    lc: []
  strand: Q1
- id: real-number.expression.estimate
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: Estimate an expression in an irrational number from decimal bounds
  statement: Estimate the value of an expression in a positive irrational number, such as pi^2, that increases
    as the number increases, by evaluating it at a lower and an upper decimal bound of the number; its
    value lies between the two results.
  procedure:
  - Bound the irrational number between two decimals.
  - Evaluate the expression at the lower bound and at the upper bound.
  - State that the value of the expression lies between the two results.
  assess: Use 3.1 < pi < 3.2 to find two numbers that pi^2 lies between.
  sources:
    ccss:
    - 8.NS.A.2
    lc: []
  strand: Q1
