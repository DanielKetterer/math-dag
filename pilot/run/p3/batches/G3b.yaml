- id: circle.center-radius
  concept: circle
  facet: figure
  level: 2
  type: concept
  name: A circle as the points at one distance from a center
  statement: A circle is all the points in a plane at one fixed distance, the radius, from a fixed point,
    the center.
  assess: A circle has center O and radius 5 cm. Point Q is 4 cm from O and point R is 6 cm from O. Which
    of Q and R is on the circle, inside it, or outside it?
  sources:
    ccss:
    - 7.G.A.2
    - 7.G.B.4
    lc: []
  strand: G3
- id: circle.diameter
  concept: circle
  facet: figure
  level: 2
  type: concept
  name: A diameter of a circle
  statement: A diameter of a circle is a segment that passes through the center and has both endpoints
    on the circle; its length is twice the radius.
  assess: In the picture, segment AB has both endpoints on the circle but misses the center, and segment
    CD passes through the center with both endpoints on the circle. Which is a diameter? The radius is
    3 cm; how long is it?
  sources:
    ccss:
    - 7.G.A.2
    - 7.G.B.4
    lc: []
  strand: G3
- id: construction.circle.radius-diameter
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: Draw a circle with a given radius or diameter using a compass
  statement: A circle with a given radius is drawn with a compass opened to that radius and turned about
    the center; for a given diameter the compass is opened to half the diameter.
  procedure:
  - If the diameter is given, halve it to get the radius.
  - Open the compass so its point and pencil are one radius apart, measured on a ruler.
  - Put the point on the center and turn the compass once around.
  assess: With a compass and ruler, draw a circle with a diameter of 8 cm.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 52ffb8ee
  strand: G3
- id: construction.triangle.two-sides-included-angle
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: Draw a triangle from two sides and the angle between them
  statement: A triangle with two given side lengths and a given angle between them is drawn with a ruler
    and protractor.
  procedure:
  - Draw one side to its given length.
  - At one endpoint, draw a ray making the given angle with that side, using a protractor.
  - Mark the second side length along the ray.
  - Join the two free endpoints.
  assess: With a ruler and protractor, draw triangle ABC with AB = 6 cm, AC = 4 cm and angle A = 50 degrees.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 52ffb8ee
  strand: G3
- id: construction.triangle.two-angles-included-side
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: Draw a triangle from two angles and the side between them
  statement: A triangle with two given angles, whose sum is less than 180 degrees, and a given side between
    them is drawn with a ruler and protractor.
  procedure:
  - Draw the given side to its length.
  - At each endpoint, draw a ray making the given angle with the side, both rays on the same side of it.
  - Extend the rays until they meet; the meeting point is the third vertex.
  assess: With a ruler and protractor, draw triangle PQR with PQ = 5 cm, angle P = 40 degrees and angle
    Q = 70 degrees.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 52ffb8ee
  strand: G3
- id: construction.triangle.three-sides
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: Draw a triangle from three side lengths with a compass
  statement: A triangle with three given side lengths is drawn by laying down one side and finding the
    third vertex where two arcs, with radii equal to the other two lengths, meet.
  procedure:
  - Draw one side to its given length.
  - From one endpoint, draw an arc with radius equal to the second length.
  - From the other endpoint, draw an arc with radius equal to the third length.
  - Join the point where the arcs meet to both endpoints.
  assess: With a ruler and compass, draw a triangle with sides of 5 cm, 6 cm and 7 cm.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 52ffb8ee
  strand: G3
- id: triangle.inequality
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: Three lengths make a triangle only when the two shorter add to more than the longest
  statement: Three lengths are the side lengths of a triangle exactly when the sum of the two shorter
    lengths is greater than the longest length.
  assess: 'Which of these sets of lengths can be the sides of a triangle: 3, 4, 5; 2, 3, 6; 2, 3, 5?'
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 9ddaee28
  strand: G3
- id: triangle.determined.three-sides
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: Three side lengths determine a unique triangle
  statement: 'Three lengths that can form a triangle determine exactly one triangle: any two triangles
    with those side lengths are identical copies, angles included.'
  assess: Ana and Ben each build a triangle from straws of 5 cm, 6 cm and 8 cm. Must their triangles have
    the same angles? Explain by trying to build a different one.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 9ddaee28
  strand: G3
- id: triangle.determined.two-sides-included-angle
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: Two sides and the angle between them determine a unique triangle
  statement: Two side lengths and the measure of the angle between those two sides determine exactly one
    triangle.
  assess: Ana draws a triangle with sides of 5 cm and 7 cm and a 40-degree angle between them. Ben draws
    one with the same three measures. Must the third sides of their triangles be equal? Explain.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 9ddaee28
  strand: G3
- id: triangle.determined.two-angles-included-side
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: Two angles and the side between them determine a unique triangle
  statement: Two angle measures whose sum is less than 180 degrees, and the length of the side between
    those two angles, determine exactly one triangle.
  assess: Ana and Ben each draw a triangle with a 5 cm side that has a 40-degree angle at one end and
    a 60-degree angle at the other. Must their triangles be identical? Explain.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 9ddaee28
  strand: G3
- id: triangle.ambiguous.two-sides-non-included-angle
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: Two sides and an angle not between them can give more than one triangle
  statement: 'Two side lengths and the measure of an angle that is not between those two sides do not
    always determine one triangle: they can fit two different triangles.'
  assess: Angle A is 30 degrees, side AB is 6 cm and side BC is 4 cm. Draw two different triangles ABC
    that meet all three conditions.
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 9ddaee28
  strand: G3
- id: triangle.three-angles
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: Three angles give no triangle or infinitely many
  statement: Three angle measures fit no triangle unless their sum is 180 degrees; when the sum is 180
    degrees they fit infinitely many triangles, all the same shape and different in size.
  assess: Can you draw a triangle with angles of 50, 60 and 70 degrees? Can you draw two different ones?
    Can you draw a triangle with angles of 50, 60 and 80 degrees?
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 9ddaee28
  strand: G3
- id: triangle.conditions.classify
  concept: triangle
  facet: determination
  level: 2
  type: procedure
  name: Decide whether three measures give one triangle, more than one, or none
  statement: Given three measures of sides or angles, decide whether they determine exactly one triangle,
    more than one triangle, or no triangle.
  procedure:
  - 'Name which kind of condition the three measures are: three sides, two sides and the angle between
    them, two sides and an angle not between them, two angles and the side between them, or three angles.'
  - 'Check whether the measures can fit any triangle: the two shorter sides must add to more than the
    longest, and the angles must add to less than 180 degrees, or to exactly 180 degrees when all three
    are angles.'
  - If they fit, decide from the kind of condition whether only one triangle fits, or try to draw a second,
    different triangle that also meets them.
  assess: 'For each set, say whether it gives exactly one triangle, more than one, or none: (a) sides
    of 4 cm, 5 cm and 10 cm; (b) angles of 30, 60 and 90 degrees; (c) sides of 6 cm and 8 cm with a 50-degree
    angle between them.'
  sources:
    ccss:
    - 7.G.A.2
    lc:
    - 9ddaee28
  strand: G3
- id: cross-section.meaning
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: A cross-section is the flat figure where a plane slices a solid
  statement: 'When a plane slices through a solid, the cross-section is the flat figure where the plane
    and the solid meet: the shape of the cut face.'
  assess: 'A block of cheese shaped like a box is cut straight through with a knife. Which is the cross-section:
    (a) the shape of the cut face, (b) the piece that was cut off, (c) the whole block?'
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - 4fa7e2b4
    - 851942b6
  strand: G3
- id: cross-section.prism.parallel-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: Slicing a rectangular prism parallel to its base
  statement: A plane parallel to a base of a right rectangular prism slices it in a rectangle of the same
    size and shape as the base.
  assess: A box 6 cm long, 4 cm wide and 10 cm tall is sliced halfway up by a plane parallel to its base.
    Describe the cross-section and give its dimensions.
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - feecfb2f
    - 851942b6
  strand: G3
- id: cross-section.prism.perpendicular-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: Slicing a rectangular prism perpendicular to its base
  statement: A plane perpendicular to a base of a right rectangular prism, crossing the base, slices it
    in a rectangle whose height is the prism's height and whose width is the length of the cut across
    the base.
  assess: A box has a 6 cm by 8 cm base and is 5 cm tall. A plane perpendicular to the base slices it
    along a diagonal of the base, which is 10 cm long. Describe the cross-section and give its dimensions.
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - feecfb2f
    - 08434f52
    - 4fa7e2b4
    - 851942b6
  strand: G3
- id: cross-section.pyramid.parallel-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: Slicing a rectangular pyramid parallel to its base
  statement: A plane parallel to the base of a right rectangular pyramid, between the base and the apex,
    slices it in a rectangle with the same shape as the base and a smaller size, smaller the nearer the
    plane is to the apex.
  assess: A pyramid has a square base 6 cm on a side. It is sliced by a plane parallel to the base, part
    way up. What shape is the cross-section, and is it larger or smaller than the base?
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - feecfb2f
    - 851942b6
  strand: G3
- id: cross-section.pyramid.perpendicular-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: Slicing a rectangular pyramid perpendicular to its base
  statement: A plane perpendicular to the base of a right rectangular pyramid and parallel to one side
    of the base slices it in a triangle when the plane passes through the apex, and in a trapezoid when
    it does not.
  assess: A right rectangular pyramid is sliced by a plane perpendicular to its base and parallel to one
    side of the base. What shape is the cross-section if the plane passes through the apex? If it misses
    the apex?
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - feecfb2f
    - 08434f52
    - 4fa7e2b4
    - 851942b6
  strand: G3
- id: cross-section.side-per-face
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: A cross-section has one side in each face the plane crosses
  statement: When a plane slices a solid with flat faces, the cross-section is a polygon with exactly
    one side in each face the plane crosses.
  assess: A plane slices a box so that it crosses exactly five of the box's six faces. How many sides
    does the cross-section have?
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - 4c290798
  strand: G3
- id: cross-section.prism.oblique
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: Slicing a rectangular prism at a slant
  statement: A plane that is neither parallel nor perpendicular to the base of a right rectangular prism
    can slice it in a triangle, a quadrilateral, a pentagon or a hexagon, according to how many faces
    it crosses.
  assess: A slanted plane cuts off one corner of a box, crossing only the three faces that meet at that
    corner. What shape is the cross-section?
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - 4c290798
  strand: G3
- id: cross-section.pyramid.oblique
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: Slicing a rectangular pyramid at a slant
  statement: A plane that is neither parallel nor perpendicular to the base of a right rectangular pyramid
    can slice it in a triangle, a quadrilateral or a pentagon, according to how many faces it crosses.
  assess: A slanted plane slices a square pyramid, crossing all four triangular faces but not the base.
    What kind of polygon is the cross-section?
  sources:
    ccss:
    - 7.G.A.3
    lc:
    - 4c290798
  strand: G3
- id: circle.circumference.meaning
  concept: circle
  facet: measure
  level: 2
  type: concept
  name: The circumference of a circle
  statement: 'The circumference of a circle is its length: the distance once around the circle.'
  assess: A string wrapped once around the circular bottom of a can and then laid straight is 19 cm long.
    The can is 6 cm across and 12 cm tall. What is the circumference of the bottom of the can?
  sources:
    ccss:
    - 7.G.B.4
    lc: []
  strand: G3
- id: circle.pi.ratio
  concept: circle
  facet: measure
  level: 2
  type: concept
  name: Pi as the ratio of circumference to diameter
  statement: For every circle, the circumference divided by the diameter is the same number, called pi,
    which is about 3.14.
  assess: Circles with diameters 2 cm, 5 cm and 10 cm have circumferences of about 6.28 cm, 15.7 cm and
    31.4 cm. Find circumference divided by diameter for each circle. What is this number called?
  sources:
    ccss:
    - 7.G.B.4
    lc: []
  strand: G3
- id: circle.circumference.formula
  concept: circle
  facet: measure
  level: 3
  type: concept
  name: The circumference formula C = pi x d
  statement: The circumference of a circle with diameter d and radius r is C = pi x d, which is the same
    as C = 2 x pi x r.
  assess: 'True or false: a circle with radius 4 cm has circumference pi x 4 cm. Say which rule decides
    it.'
  sources:
    ccss:
    - 7.G.B.4
    lc: []
  strand: G3
- id: circle.circumference.formula.apply
  concept: circle
  facet: measure
  level: 3
  type: procedure
  name: Find the circumference of a circle with the formula
  statement: The circumference of a circle is found by multiplying its diameter by pi, doubling the radius
    first when the radius is given.
  procedure:
  - If the radius is given, double it to get the diameter.
  - Multiply the diameter by pi, or by an approximation such as 3.14.
  assess: Find the circumference of a circle with radius 5 cm. Use 3.14 for pi.
  sources:
    ccss:
    - 7.G.B.4
    lc:
    - 3e117ec0
  strand: G3
- id: circle.area.formula
  concept: circle
  facet: measure
  level: 3
  type: concept
  name: The area formula A = pi x r^2
  statement: The area of a circle with radius r is A = pi x r x r, written pi x r^2.
  assess: 'True or false: a circle with diameter 6 m has area pi x 6 x 6 square m. Say which rule decides
    it.'
  sources:
    ccss:
    - 7.G.B.4
    lc: []
  strand: G3
- id: circle.area.formula.apply
  concept: circle
  facet: measure
  level: 3
  type: procedure
  name: Find the area of a circle with the formula
  statement: The area of a circle is found by multiplying pi by the radius times itself, halving the diameter
    first when the diameter is given.
  procedure:
  - If the diameter is given, halve it to get the radius.
  - Multiply the radius by itself.
  - Multiply the result by pi, or by an approximation such as 3.14.
  assess: Find the area of a circle with radius 10 cm. Use 3.14 for pi.
  sources:
    ccss:
    - 7.G.B.4
    lc:
    - a6134b89
  strand: G3
- id: circle.area.derive-from-circumference
  concept: circle
  facet: measure
  level: 4
  type: justification
  name: Derive the area of a circle from its circumference by rearranging sectors
  statement: A circle cut into many equal sectors, arranged alternately point up and point down, is close
    to a parallelogram whose base is half the circumference and whose height is the radius, and closer
    the more sectors are used; so the area is (1/2) x C x r, which is (1/2) x 2 x pi x r x r = pi x r^2.
  assess: A circle of radius r is cut into 16 equal sectors, which are rearranged as in the picture. Use
    the picture to explain why the area of the circle is half its circumference times its radius, and
    why that equals pi x r^2.
  sources:
    ccss:
    - 7.G.B.4
    lc:
    - b220156e
  strand: G3
- id: circle.application.circumference
  concept: circle
  facet: measure
  level: 3
  type: application
  name: Solve real-world problems about the distance around a circular object
  statement: A real-world problem gives the radius or diameter of a circular object and asks for the distance
    once around it; the learner finds the circumference.
  assess: A circular garden has a radius of 5 m. How many meters of fencing go once around it? Use 3.14
    for pi.
  sources:
    ccss:
    - 7.G.B.4
    lc:
    - 3e117ec0
  strand: G3
- id: circle.application.area
  concept: circle
  facet: measure
  level: 3
  type: application
  name: Solve real-world problems about the area of a circular region
  statement: A real-world problem gives the radius or diameter of a circular region and asks how much
    surface it covers; the learner finds its area.
  assess: A circular rug has a diameter of 4 m. How many square meters of floor does it cover? Use 3.14
    for pi.
  sources:
    ccss:
    - 7.G.B.4
    lc:
    - a6134b89
  strand: G3
- id: angle.adjacent
  concept: angle
  facet: figure
  level: 2
  type: concept
  name: Adjacent angles
  statement: Two angles are adjacent when they share a vertex and a side and do not overlap.
  assess: 'Three pairs of angles are shown: (a) two angles that share a vertex and a side and do not overlap,
    (b) two angles that share only a vertex, (c) two angles that share a vertex and a side, one lying
    inside the other. Which pair is adjacent?'
  sources:
    ccss:
    - 7.G.B.5
    lc: []
  strand: G3
- id: angle.vertical
  concept: angle
  facet: figure
  level: 2
  type: concept
  name: Vertical angles
  statement: When two lines cross, each pair of opposite angles, which share the vertex and no side, is
    a pair of vertical angles.
  assess: Lines AB and CD cross at O. Which angle is vertical to angle AOC? Are angles AOC and COB vertical
    angles?
  sources:
    ccss:
    - 7.G.B.5
    lc: []
  strand: G3
- id: angle.vertical.equal
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: Vertical angles are equal
  statement: Vertical angles have equal measures.
  assess: Two lines cross. One of the four angles measures 65 degrees. Without measuring, what is the
    measure of the angle vertical to it?
  sources:
    ccss:
    - 7.G.B.5
    lc: []
  strand: G3
- id: angle.supplementary
  concept: angle
  facet: measure
  level: 2
  type: concept
  name: Supplementary angles
  statement: Two angles are supplementary when their measures add to 180 degrees; they need not be adjacent.
  assess: 'Which pairs are supplementary: (a) a 120-degree angle and a 60-degree angle in different parts
    of a figure, (b) adjacent angles of 100 and 70 degrees, (c) two 45-degree angles?'
  sources:
    ccss:
    - 7.G.B.5
    lc: []
  strand: G3
- id: angle.complementary
  concept: angle
  facet: measure
  level: 2
  type: concept
  name: Complementary angles
  statement: Two angles are complementary when their measures add to 90 degrees; they need not be adjacent.
  assess: 'Which pairs are complementary: (a) a 30-degree angle and a 60-degree angle in different parts
    of a figure, (b) adjacent angles of 40 and 40 degrees, (c) two 90-degree angles?'
  sources:
    ccss:
    - 7.G.B.5
    lc: []
  strand: G3
- id: angle.straight-line.sum-180
  concept: angle
  facet: measure
  level: 2
  type: concept
  name: Adjacent angles along a straight line add to 180 degrees
  statement: Adjacent angles whose outer sides form a straight line together make a straight angle, so
    their measures add to 180 degrees.
  assess: Ray OC is drawn from point O on line AB. Angle AOC measures 130 degrees. Without measuring,
    find angle COB.
  sources:
    ccss:
    - 7.G.B.5
    lc: []
  strand: G3
- id: angle.unknown.equation.write
  concept: angle
  facet: measure
  level: 3
  type: representation
  name: Write an equation for an unknown angle from an angle relationship
  statement: 'When angle measures in a figure are given as expressions in an unknown, an angle relationship
    gives an equation: the measures of supplementary angles, or of adjacent angles along a straight line,
    add to 180; of complementary angles add to 90; vertical angles are equal.'
  assess: Angles ABD and DBC are adjacent, and A, B and C lie on a straight line. Angle ABD measures 2x
    degrees and angle DBC measures (x + 30) degrees. Write an equation for x. Do not solve it.
  sources:
    ccss:
    - 7.G.B.5
    lc:
    - 779be2f1
  strand: G3
- id: angle.unknown.equation.solve
  concept: angle
  facet: measure
  level: 3
  type: procedure
  name: Find an unknown angle by writing and solving a two-step equation
  statement: An unknown in angle measures given as expressions is found by writing an equation of the
    form p x + q = r from an angle relationship and solving it.
  procedure:
  - Write the equation that the angle relationship gives.
  - Combine like terms so the equation has the form p x + q = r.
  - Solve the equation for x.
  assess: Two complementary angles measure x degrees and (2x + 15) degrees. Find x.
  sources:
    ccss:
    - 7.G.B.5
    lc:
    - 82575afc
  strand: G3
- id: angle.application.multi-step
  concept: angle
  facet: measure
  level: 3
  type: application
  name: Find an unknown angle in a figure by using two or more angle relationships in turn
  statement: A figure problem needs two or more angle relationships (vertical, supplementary, complementary,
    adjacent angles along a line, or parts of a whole angle) used one after another to find an unknown
    angle.
  assess: Lines AB and CD cross at O. Ray OE lies inside angle BOD. Angle AOC measures 70 degrees and
    angle EOD measures 25 degrees. Find angle BOE.
  sources:
    ccss:
    - 7.G.B.5
    lc:
    - 779be2f1
    - 82575afc
  strand: G3
- id: volume.prism.right.base-height
  concept: volume
  facet: multiplicative
  level: 3
  type: concept
  name: The volume of any right prism is V = B x h
  statement: The volume of any right prism is the area B of its base times its height h, whatever polygon
    the base is.
  assess: 'True or false: a right prism 10 cm long whose bases are right triangles with legs 3 cm and
    4 cm has volume 3 x 4 x 10 = 120 cubic cm. Say which rule decides it.'
  sources:
    ccss:
    - 7.G.B.6
    lc: []
  strand: G3
- id: volume.prism.right.base-height.apply
  concept: volume
  facet: multiplicative
  level: 3
  type: procedure
  name: Find the volume of a right prism with a non-rectangular base
  statement: The volume of a right prism whose base is a triangle or another polygon is found by computing
    the area of the base and multiplying it by the height of the prism.
  procedure:
  - Find the area B of the base.
  - Find the height h, the distance between the two bases.
  - Multiply B by h.
  assess: A right prism is 10 cm long. Its bases are right triangles with legs of 6 cm and 4 cm. Find
    its volume.
  sources:
    ccss:
    - 7.G.B.6
    lc:
    - c9233a4b
  strand: G3
- id: volume.composite.right-prisms
  concept: volume
  facet: additive
  level: 3
  type: procedure
  name: Find the volume of a solid made of right prisms, not all rectangular
  statement: The volume of a solid made of non-overlapping right prisms, at least one with a non-rectangular
    base, is the sum of the volumes of the prisms.
  procedure:
  - Split the solid into right prisms that do not overlap.
  - Find the volume of each prism with V = B x h.
  - Add the volumes.
  assess: A solid is a 6 m by 4 m by 3 m box with a triangular prism on top. The prism is 6 m long and
    its triangular ends have a base of 4 m and a height of 2 m. Find the volume of the solid.
  sources:
