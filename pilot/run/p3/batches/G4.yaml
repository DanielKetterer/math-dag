- id: transformation.translation.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A translation moves every point the same distance in the same direction
  statement: A translation moves every point of the plane the same distance in the same direction; the
    image of a figure is the set of the moved points.
  assess: Picture A shows a flag after every point of it moved 4 cm to the right. Picture B shows the
    flag after it was turned about the foot of its pole, so points far from the foot moved farther than
    points near it. Which picture shows a translation, and which condition of a translation does the other
    one break?
  sources:
    ccss:
    - 8.G.A.1
    lc: []
  strand: G4
- id: transformation.reflection.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A reflection across a line
  statement: A reflection across a line l takes each point P not on l to the point P' on the other side
    of l such that segment PP' is perpendicular to l and l passes through its midpoint; each point on
    l stays where it is.
  assess: Point P is 3 cm from line l. Point Q is 3 cm from l on the other side, on the perpendicular
    to l through P. Point R is 3 cm from l on the other side, but not on that perpendicular. Point S is
    5 cm from l on the other side, on that perpendicular. Which point is the reflection of P across l?
  sources:
    ccss:
    - 8.G.A.1
    lc: []
  strand: G4
- id: transformation.rotation.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A rotation about a center through an angle
  statement: A rotation about a center O through d degrees in a given direction (clockwise or counterclockwise)
    takes each point P to the point P' with OP' = OP and angle POP' = d degrees, turned in that direction;
    O stays where it is.
  assess: Point P is 4 cm from point O. Point Q is 4 cm from O, 90 degrees counterclockwise from ray OP.
    Point R is 6 cm from O, 90 degrees counterclockwise from ray OP. Point S is 4 cm from O, 90 degrees
    clockwise from ray OP. Which point is the image of P under a rotation of 90 degrees counterclockwise
    about O?
  sources:
    ccss:
    - 8.G.A.1
    lc: []
  strand: G4
- id: transformation.rotation.draw
  concept: transformation
  facet: geometric
  level: 2
  type: procedure
  name: Draw the image of a figure under a rotation through any angle
  statement: Draw the image of a polygon under a rotation about a given center through a given angle,
    including angles that are not multiples of 90 degrees, by rotating each vertex with a protractor and
    ruler.
  procedure:
  - For one vertex P, draw segment OP from the center O.
  - With a protractor centered at O, draw a ray that makes the given angle with ray OP, turned in the
    given direction.
  - Mark P' on that ray so that OP' = OP.
  - Repeat for every vertex and join the image vertices in the same order.
  assess: Triangle ABC and a point O are drawn on a coordinate grid. Draw the image of triangle ABC under
    a rotation of 60 degrees counterclockwise about O.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 4815a989
  strand: G4
- id: transformation.rigid-motion.preserves-length
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: Rigid motions keep lines straight and lengths the same
  statement: A translation, reflection, or rotation, or any sequence of them, takes every line to a line
    and every line segment to a line segment of the same length.
  assess: Segment AB is 7 cm long. It is reflected across a line, and the image is then rotated 90 degrees
    about a point. Without measuring, what kind of figure is the final image of AB, and how long is it?
  sources:
    ccss:
    - 8.G.A.1.a
    lc:
    - 715f7b83
  strand: G4
- id: transformation.rigid-motion.preserves-length.verify
  concept: transformation
  facet: geometric
  level: 2
  type: justification
  name: Verify experimentally that rigid motions keep lengths
  statement: Moving a tracing of a segment by translations, reflections, and rotations, and comparing
    each image with the original, shows experimentally that the image is always a segment of the same
    length.
  assess: Trace segment AB on transparent paper. Translate the tracing, then reflect it, then rotate it,
    comparing the image with segment AB after each move. What do you find about the image, and how does
    the tracing show it?
  sources:
    ccss:
    - 8.G.A.1.a
    lc:
    - 715f7b83
  strand: G4
- id: transformation.rigid-motion.preserves-angle
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: Rigid motions keep angle measures the same
  statement: A translation, reflection, or rotation, or any sequence of them, takes every angle to an
    angle of the same measure.
  assess: Angle ABC measures 35 degrees. It is translated, and the image is then reflected across a line.
    Without measuring, what is the measure of the final image angle?
  sources:
    ccss:
    - 8.G.A.1.b
    lc:
    - 2d077eff
  strand: G4
- id: transformation.rigid-motion.preserves-angle.verify
  concept: transformation
  facet: geometric
  level: 2
  type: justification
  name: Verify experimentally that rigid motions keep angle measures
  statement: Moving a tracing of an angle by translations, reflections, and rotations, and comparing each
    image with the original, shows experimentally that the image is always an angle of the same measure.
  assess: Trace angle ABC on transparent paper. Translate the tracing, then reflect it, then rotate it,
    comparing the image with angle ABC after each move. What do you find about the image angle, and how
    does the tracing show it?
  sources:
    ccss:
    - 8.G.A.1.b
    lc:
    - 2d077eff
  strand: G4
- id: transformation.rigid-motion.preserves-parallel
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: Rigid motions take parallel lines to parallel lines
  statement: A translation, reflection, or rotation, or any sequence of them, takes two parallel lines
    to two parallel lines and two lines that meet to two lines that meet.
  assess: Lines m and n are parallel; lines p and q meet at a point. All four lines are rotated 50 degrees
    about a point, and the images are then reflected across a line. Without drawing, which pair of final
    image lines is parallel?
  sources:
    ccss:
    - 8.G.A.1.c
    lc:
    - d3571b9e
  strand: G4
- id: transformation.rigid-motion.preserves-parallel.verify
  concept: transformation
  facet: geometric
  level: 2
  type: justification
  name: Verify experimentally that rigid motions keep parallel lines parallel
  statement: Moving a tracing of two parallel lines by translations, reflections, and rotations, and checking
    each image, shows experimentally that the image lines are always parallel.
  assess: Draw two parallel lines and trace them on transparent paper. Translate the tracing, then reflect
    it, then rotate it, checking after each move whether the image lines are parallel. What do you find,
    and how does the tracing show it?
  sources:
    ccss:
    - 8.G.A.1.c
    lc:
    - d3571b9e
  strand: G4
- id: congruence.rigid-motion.meaning
  concept: congruence
  facet: rigid-motion
  level: 3
  type: concept
  name: Congruent figures as figures related by rigid motions
  statement: One figure is congruent to another when some sequence of translations, reflections, and rotations
    takes the first figure exactly onto the second.
  assess: Figure B is figure A rotated 90 degrees and then reflected across a line. Figure C has the same
    area as A but a different shape. Figure D is A enlarged with scale factor 2. Which of B, C, and D
    are congruent to A?
  sources:
    ccss:
    - 8.G.A.2
    lc:
    - f56c2e0b
  strand: G4
- id: congruence.sequence.describe
  concept: congruence
  facet: rigid-motion
  level: 2
  type: procedure
  name: Describe a sequence of rigid motions that shows two figures are congruent
  statement: Given two congruent figures and their corresponding vertices, describe a sequence of translations,
    reflections, and rotations that takes the first figure onto the second.
  procedure:
  - Match each vertex of the first figure with its corresponding vertex in the second.
  - Translate the first figure so that one vertex lands on its corresponding vertex.
  - Rotate about that vertex so that a side from it lies along the corresponding side of the second figure.
  - If the figures still do not match, reflect across the line containing that side.
  assess: On a coordinate grid, triangle ABC has A(1, 1), B(4, 1), C(1, 3), and the congruent triangle
    DEF has D(9, 4), E(6, 4), F(9, 6), with A -> D, B -> E, C -> F. Describe a sequence of translations,
    reflections, and rotations that takes triangle ABC onto triangle DEF.
  sources:
    ccss:
    - 8.G.A.2
    lc:
    - 07f4ca9a
  strand: G4
- id: transformation.dilation.meaning
  concept: transformation
  facet: geometric
  level: 2
  type: concept
  name: A dilation with a center and a scale factor
  statement: A dilation with center O and scale factor k, where k > 0, takes each point P to the point
    P' on ray OP with OP' = k x OP; the center O stays where it is.
  assess: Point P is 2 cm from point O. Point Q is on ray OP, 6 cm from O. Point R is on ray OP, 5 cm
    from O. Point S is 6 cm from O but not on ray OP. Which point is the image of P under the dilation
    with center O and scale factor 3?
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - e8c6b8a4
  strand: G4
- id: transformation.dilation.scale-lengths
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: A dilation multiplies every length by the scale factor
  statement: A dilation with scale factor k multiplies every length in a figure by k, so it enlarges the
    figure when k > 1 and reduces it when k < 1; when k is not 1 it changes lengths, so it is not a rigid
    motion.
  assess: A dilation has scale factor 1/2. A segment in the figure is 4 cm long. How long is the image
    of the segment, and is this dilation a rigid motion?
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - e8c6b8a4
  strand: G4
- id: transformation.dilation.preserves-angle
  concept: transformation
  facet: geometric
  level: 3
  type: concept
  name: A dilation keeps angle measures the same
  statement: A dilation takes every angle to an angle of the same measure, so the image of a figure has
    the same angle measures as the figure.
  assess: Triangle ABC has angles of 30, 60, and 90 degrees. It is dilated with scale factor 3. Without
    measuring, what are the angle measures of the image triangle?
  sources:
    ccss:
    - 8.G.A.3
    - 8.G.A.4
    lc: []
  strand: G4
- id: transformation.translation.coordinates.image
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon after a translation
  statement: Find the coordinates of the image of a polygon after a translation of a given number of units
    horizontally and vertically; a horizontal move changes only the x-coordinate and a vertical move changes
    only the y-coordinate.
  procedure:
  - Move each vertex the given number of units right or left and the given number of units up or down
    on the grid.
  - 'Record each image vertex: the x-coordinate changes by the horizontal move and the y-coordinate by
    the vertical move.'
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 5). Give the coordinates of the vertices
    of its image after a translation 3 units left and 2 units down.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 0efc2703
    - c01f36a2
    - c78dcad7
  strand: G4
- id: transformation.translation.coordinates.rule
  concept: transformation
  facet: coordinate
  level: 3
  type: representation
  name: Write a translation as a coordinate rule
  statement: A translation of a units horizontally and b units vertically is the coordinate rule (x, y)
    -> (x + a, y + b), with a negative for a move left and b negative for a move down.
  assess: Write the coordinate rule (x, y) -> ( , ) for a translation 3 units left and 4 units up.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 5816f6d6
  strand: G4
- id: transformation.reflection.axis.coordinates.image
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon reflected across an axis
  statement: Find the coordinates of the image of a polygon reflected across the x-axis or the y-axis
    by moving each vertex to the point the same distance from the axis on the other side.
  procedure:
  - For each vertex, find its distance from the axis of reflection.
  - Locate the point the same distance from the axis on the other side, on the line through the vertex
    perpendicular to the axis, and record its coordinates.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 5). Give the coordinates of the vertices
    of its image after a reflection across the x-axis.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 0af11eff
    - 44df92bc
  strand: G4
- id: transformation.reflection.axis.coordinates.rule
  concept: transformation
  facet: coordinate
  level: 3
  type: representation
  name: Write a reflection across an axis as a coordinate rule
  statement: Reflection across the x-axis is the coordinate rule (x, y) -> (x, -y), and reflection across
    the y-axis is the rule (x, y) -> (-x, y).
  assess: Write the coordinate rule (x, y) -> ( , ) for a reflection across the y-axis.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 9483c9ac
  strand: G4
- id: transformation.reflection.parallel-to-axis.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon reflected across a line x = h or y = k
  statement: Find the coordinates of the image of a polygon reflected across a vertical line x = h or
    a horizontal line y = k by moving each vertex to the point the same distance from the line on the
    other side, keeping the other coordinate.
  procedure:
  - For each vertex, find its horizontal distance to the line x = h, or its vertical distance to the line
    y = k.
  - Move the same distance past the line on the other side, keeping the other coordinate the same, and
    record the image vertex.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 1), B(3, 1), and C(1, 4). Give the coordinates of the vertices
    of its image after a reflection across the line x = 5.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 6827617f
  strand: G4
- id: transformation.reflection.diagonal.coordinates
  concept: transformation
  facet: coordinate
  level: 3
  type: procedure
  name: Find the coordinates of the image of a polygon reflected across y = x or y = -x
  statement: Find the coordinates of the image of a polygon reflected across the line y = x with the rule
    (x, y) -> (y, x), or across the line y = -x with the rule (x, y) -> (-y, -x).
  procedure:
  - For a reflection across y = x, swap the two coordinates of each vertex.
  - For a reflection across y = -x, swap the two coordinates of each vertex and change the sign of both.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 2), B(1, 5), and C(3, 2). Give the coordinates of the vertices
    of its image after a reflection across the line y = -x.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 402e7eef
  strand: G4
- id: transformation.rotation.origin.coordinates
  concept: transformation
  facet: coordinate
  level: 3
  type: procedure
  name: Find the coordinates of the image of a polygon rotated about the origin by a multiple of 90 degrees
  statement: Find the coordinates of the image of a polygon rotated about the origin by a multiple of
    90 degrees with the rules (x, y) -> (-y, x) for 90 degrees counterclockwise, (x, y) -> (-x, -y) for
    180 degrees, and (x, y) -> (y, -x) for 90 degrees clockwise.
  procedure:
  - 'Choose the rule for the angle and direction: 90 degrees counterclockwise (the same as 270 degrees
    clockwise) is (x, y) -> (-y, x); 180 degrees is (x, y) -> (-x, -y); 90 degrees clockwise (the same
    as 270 degrees counterclockwise) is (x, y) -> (y, -x).'
  - Apply the rule to each vertex.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 1), B(4, 1), and C(1, 3). Give the coordinates of the vertices
    of its image after a rotation of 90 degrees counterclockwise about the origin.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 61d83709
  strand: G4
- id: transformation.rotation.center.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon rotated by a multiple of 90 degrees about a grid
    point
  statement: Find the coordinates of the image of a polygon rotated by a multiple of 90 degrees about
    a grid point other than the origin by turning each vertex's horizontal and vertical offsets from the
    center.
  procedure:
  - 'For each vertex, count its offset from the center: a units across and b units up, with a negative
    for left and b negative for down.'
  - 'Turn the offset: (a, b) becomes (-b, a) for 90 degrees counterclockwise, (-a, -b) for 180 degrees,
    and (b, -a) for 90 degrees clockwise.'
  - Count the turned offset from the center to locate the image vertex, and record its coordinates.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(2, 1), B(5, 1), and C(2, 3). Give the coordinates of the vertices
    of its image after a rotation of 90 degrees counterclockwise about A.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - b12819c6
  strand: G4
- id: transformation.sequence.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon after a sequence of rigid motions
  statement: Find the coordinates of the image of a polygon after a sequence of translations, reflections,
    and rotations by applying each motion, in the given order, to the image produced by the one before.
  procedure:
  - Apply the first motion to each vertex and record the image vertices.
  - Apply the next motion to those image vertices, not to the original figure.
  - Repeat until every motion in the sequence has been applied; the last set of vertices is the final
    image.
  assess: Triangle ABC has vertices A(1, 2), B(4, 2), and C(1, 4). It is reflected across the x-axis,
    and the image is then translated 3 units left. Give the coordinates of the vertices of the final image.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - dd9fa6a3
    - 128d2c8f
    - 2d10f542
  strand: G4
- id: transformation.dilation.origin.coordinates
  concept: transformation
  facet: coordinate
  level: 3
  type: procedure
  name: Find the coordinates of the image of a polygon under a dilation centered at the origin
  statement: Find the coordinates of the image of a polygon under a dilation with center at the origin
    and scale factor k with the rule (x, y) -> (k x x, k x y).
  procedure:
  - Multiply both coordinates of each vertex by k.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(2, 4), B(6, 4), and C(2, 8). Give the coordinates of the vertices
    of its image under a dilation with center at the origin and scale factor 1/2.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - b6e6ec4d
  strand: G4
- id: transformation.dilation.center.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon under a dilation with another center
  statement: Find the coordinates of the image of a polygon under a dilation whose center is a point other
    than the origin by multiplying each vertex's horizontal and vertical offsets from the center by the
    scale factor.
  procedure:
  - 'For each vertex, count its offset from the center: a units across and b units up, with a negative
    for left and b negative for down.'
  - Multiply both parts of the offset by the scale factor k.
  - Count the new offset from the center to locate the image vertex, and record its coordinates.
  - Join the image vertices in the same order.
  assess: Triangle ABC has vertices A(1, 1), B(3, 1), and C(1, 4). Give the coordinates of the vertices
    of its image under a dilation with center A and scale factor 2.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - c169f8f0
  strand: G4
- id: transformation.sequence.with-dilation.coordinates
  concept: transformation
  facet: coordinate
  level: 2
  type: procedure
  name: Find the coordinates of the image of a polygon after a sequence that includes a dilation
  statement: Find the coordinates of the image of a polygon after a sequence of a dilation and rigid motions
    by applying each transformation, in the given order, to the image produced by the one before.
  procedure:
  - Apply the first transformation to each vertex and record the image vertices.
  - Apply the next transformation to those image vertices, not to the original figure.
  - Repeat until every transformation in the sequence has been applied; the last set of vertices is the
    final image.
  assess: Triangle ABC has vertices A(1, 1), B(3, 1), and C(1, 2). It is dilated with center at the origin
    and scale factor 2, and the image is then translated 1 unit down. Give the coordinates of the vertices
    of the final image.
  sources:
    ccss:
    - 8.G.A.3
    lc:
    - 4c98d1fb
  strand: G4
- id: similarity.transformation.meaning
  concept: similarity
  facet: transformation
  level: 3
  type: concept
  name: Similar figures as figures related by rigid motions and dilations
  statement: One figure is similar to another when some sequence of translations, reflections, rotations,
    and dilations takes the first figure exactly onto the second.
  assess: Rectangle A is 2 cm by 4 cm. Figure B is A dilated with scale factor 3 and then rotated 90 degrees.
    Rectangle C is 5 cm by 7 cm, each side 3 cm longer than in A. Rectangle D is 2 cm by 8 cm, A stretched
    in one direction only. Which of B, C, and D are similar to A?
  sources:
    ccss:
    - 8.G.A.4
    lc:
    - 92a7fb82
  strand: G4
- id: similarity.sequence.describe
  concept: similarity
  facet: transformation
  level: 2
  type: procedure
  name: Describe a sequence of transformations that shows two figures are similar
  statement: Given two similar figures and their corresponding vertices, describe a sequence of a dilation
    and translations, reflections, and rotations that takes the first figure onto the second.
  procedure:
  - Match each vertex of the first figure with its corresponding vertex in the second.
  - 'Find the scale factor k: the length of a side of the second figure divided by the length of the corresponding
    side of the first.'
  - Dilate the first figure by k about any center; the image is congruent to the second figure.
  - Describe a sequence of translations, reflections, and rotations that takes the dilated image onto
    the second figure.
  assess: On a coordinate grid, triangle ABC has A(0, 0), B(2, 0), C(0, 1), and the similar triangle DEF
    has D(6, 2), E(6, 6), F(4, 2), with A -> D, B -> E, C -> F. Describe a sequence of a dilation and
    rigid motions that takes triangle ABC onto triangle DEF.
  sources:
    ccss:
    - 8.G.A.4
    lc:
    - 655932cc
  strand: G4
- id: geometry.similar-triangles
  concept: similarity
  facet: proportional-sides
  level: 3
  type: concept
  name: Similar triangles have proportional corresponding sides
  statement: 'If triangle ABC is similar to triangle DEF with A -> D, B -> E, C -> F, then each side of
    DEF is the same number k times the corresponding side of ABC: DE/AB = EF/BC = DF/AC = k.'
  assess: 'Triangle ABC is similar to triangle DEF with A -> D, B -> E, C -> F, and DE is 3 times as long
    as AB. Which must be true: EF = 3 x BC; EF = BC + 3; EF = BC?'
  sources:
    ccss:
    - 8.G.A.4
    - 8.G.A.5
    lc: []
  strand: G4
- id: similarity.triangle.angle-angle
  concept: similarity
  facet: transformation
  level: 3
  type: concept
  name: The angle-angle criterion for similar triangles
  statement: If two angles of one triangle have the same measures as two angles of another triangle, the
    two triangles are similar.
  assess: Triangle ABC has angles of 40 degrees and 75 degrees. Triangle DEF is larger and also has angles
    of 40 degrees and 75 degrees. Triangle GHI has one angle of 40 degrees; its other angles are not given.
    Which of DEF and GHI must be similar to ABC?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 6f4e508f
  strand: G4
- id: similarity.triangle.angle-angle.explain
  concept: similarity
  facet: transformation
  level: 4
  type: justification
  name: Explain informally why two pairs of equal angles make triangles similar
  statement: If angle A = angle D and angle B = angle E in triangles ABC and DEF, dilating ABC with scale
    factor DE/AB gives a triangle whose side matching AB is as long as DE and whose angles are unchanged;
    rigid motions then place that side on DE with the third vertex on the same side as F, and because
    the rays from D and E at the matching angles meet only at F, the image lands exactly on DEF, so the
    triangles are similar.
  assess: Triangles ABC and DEF have angle A = angle D and angle B = angle E. Explain, using a dilation
    and rigid motions, why the triangles must be similar.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 6f4e508f
  strand: G4
- id: similarity.triangle.angle-angle.decide
  concept: similarity
  facet: transformation
  level: 3
  type: procedure
  name: Decide from angle measures whether two triangles are similar
  statement: Decide whether two triangles are similar from given angle measures by finding any missing
    third angle with the angle sum and checking for two pairs of equal angles.
  procedure:
  - For each triangle with only two angles given, find the third angle by subtracting their sum from 180
    degrees.
  - Compare the angle measures of the two triangles.
  - If two angles of one triangle equal two angles of the other, the triangles are similar; otherwise
    they are not.
  assess: Triangle ABC has angles of 50 degrees and 60 degrees. Triangle DEF has angles of 60 degrees
    and 70 degrees. Are the two triangles similar?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 6f4e508f
  strand: G4
- id: angle.transversal.corresponding
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: Corresponding angles at parallel lines cut by a transversal are equal
  statement: When a transversal crosses two parallel lines, corresponding angles, the angles in matching
    positions at the two crossing points, have equal measures.
  assess: Line t crosses lines m and n. At the crossing with m, the angle above m and to the right of
    t measures 70 degrees. In diagram 1, m and n are parallel; in diagram 2, they are not. In which diagram
    must the angle above n and to the right of t also measure 70 degrees?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.corresponding.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain with a translation why corresponding angles are equal
  statement: Translating along the transversal by the distance between the two crossing points moves line
    m to a line through the other crossing point parallel to m, which must be n; since a translation keeps
    angle measures, each angle at the first crossing lands on its corresponding angle at the second, so
    corresponding angles are equal.
  assess: Parallel lines m and n are crossed by line t at points P and Q. Explain, using a translation,
    why each angle at P has the same measure as its corresponding angle at Q.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.alternate-interior
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: Alternate interior angles at parallel lines cut by a transversal are equal
  statement: When a transversal crosses two parallel lines, alternate interior angles, the angles between
    the two lines on opposite sides of the transversal, have equal measures.
  assess: Line t crosses lines m and n. Angle 3 is between m and n, left of t, at the crossing with m;
    angle 6 is between m and n, right of t, at the crossing with n; angle 3 measures 110 degrees. In diagram
    1, m and n are parallel; in diagram 2, they are not. In which diagram must angle 6 measure 110 degrees?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.alternate-interior.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain with vertical and corresponding angles why alternate interior angles are equal
  statement: Each alternate interior angle at one crossing is vertical to the angle that corresponds to
    the other alternate interior angle; vertical angles are equal and corresponding angles are equal,
    so the two alternate interior angles are equal.
  assess: Parallel lines m and n are crossed by line t. Explain, using vertical angles and corresponding
    angles, why the two alternate interior angles marked in the diagram are equal.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.transversal.find-angles
  concept: angle
  facet: measure
  level: 3
  type: procedure
  name: Find all eight angles at parallel lines cut by a transversal from one angle
  statement: Given one of the eight angles formed when a transversal crosses two parallel lines, find
    the other seven using vertical angles, adjacent angles on a line that add to 180 degrees, and corresponding
    angles.
  procedure:
  - At the crossing with the given angle, give its vertical angle the same measure.
  - Give each of the two angles next to it on a line the measure 180 degrees minus the given angle.
  - At the other crossing, give each angle the measure of its corresponding angle.
  assess: Parallel lines m and n are crossed by line t. One of the eight angles formed measures 115 degrees.
    Find the measures of the other seven angles.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - 2b003d7c
  strand: G4
- id: angle.triangle.sum
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: The angles of a triangle add to 180 degrees
  statement: The three angle measures of any triangle add to 180 degrees.
  assess: Without measuring, what is the sum of the three angle measures of the long, thin obtuse triangle
    shown?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.triangle.sum.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain with a parallel line why the angles of a triangle add to 180 degrees
  statement: The line through one vertex parallel to the opposite side makes two angles at that vertex
    that are alternate interior angles with the other two angles of the triangle; these two angles and
    the triangle's angle at that vertex form a straight angle, so the three angles of the triangle add
    to 180 degrees.
  assess: Triangle ABC is drawn with the line through C parallel to AB. Use this line to explain why angle
    A + angle B + angle C = 180 degrees for every triangle.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.triangle.third-angle
  concept: angle
  facet: measure
  level: 3
  type: procedure
  name: Find the third angle of a triangle
  statement: Find the unknown angle measure of a triangle by subtracting the sum of the two known angle
    measures from 180 degrees.
  procedure:
  - Add the two known angle measures.
  - Subtract the sum from 180 degrees.
  assess: Two angles of a triangle measure 47 degrees and 68 degrees. What is the measure of the third
    angle?
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.triangle.exterior
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: An exterior angle of a triangle equals the sum of the two remote interior angles
  statement: An exterior angle of a triangle, formed by one side and the extension of an adjacent side,
    has a measure equal to the sum of the two interior angles that are not next to it.
  assess: 'In triangle ABC, side BC is extended past C to point D. Which is always true: angle ACD = angle
    A + angle B; angle ACD = 180 degrees - angle A; angle ACD = angle B + angle ACB?'
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.triangle.exterior.explain
  concept: angle
  facet: measure
  level: 4
  type: justification
  name: Explain why an exterior angle equals the sum of the two remote interior angles
  statement: The exterior angle and the interior angle next to it form a straight angle, so the exterior
    angle is 180 degrees minus that interior angle; by the angle sum, the other two interior angles also
    add to 180 degrees minus that interior angle, so the exterior angle equals their sum.
  assess: In triangle ABC, side BC is extended past C to point D. Explain why angle ACD = angle A + angle
    B for every triangle.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b9325562
  strand: G4
- id: angle.application.triangles-parallel-lines
  concept: angle
  facet: measure
  level: 3
  type: application
  name: Find an unknown angle in a diagram with parallel lines and a triangle
  statement: Solve problems that find an unknown angle measure in a diagram combining two parallel lines,
    a transversal, and a triangle, by chaining a transversal angle fact with the triangle angle sum or
    the exterior angle fact; all given measures are numbers.
  assess: Lines m and n are parallel. Point A is on m, and points B and C are on n, with B to the left
    of C. The angle between segment AB and the part of line m to the left of A measures 50 degrees, and
    angle ACB measures 70 degrees. Find the measure of angle BAC.
  sources:
    ccss:
    - 8.G.A.5
    lc:
    - b4b423c9
  strand: G4
- id: pythagorean-theorem.squares-on-sides
  concept: pythagorean-theorem
  facet: area
  level: 2
  type: concept
  name: The square on the hypotenuse has the area of the two squares on the legs together
  statement: For a right triangle, the area of the square built on the hypotenuse (the side opposite the
    right angle) equals the sum of the areas of the squares built on the two legs.
  assess: On a grid, a right triangle has legs 3 units and 4 units long, and a square is built on each
    side of the triangle. The squares on the legs have areas 9 and 16 square units. Without counting,
    what is the area of the square on the hypotenuse?
  sources:
    ccss:
    - 8.G.B.6
    lc: []
  strand: G4
- id: pythagorean-theorem.statement
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: concept
  name: The Pythagorean theorem a^2 + b^2 = c^2
  statement: In a right triangle with legs of lengths a and b and hypotenuse (the side opposite the right
    angle) of length c, a^2 + b^2 = c^2.
  assess: Triangle PQR has its right angle at Q. Write the Pythagorean theorem as an equation in the lengths
    PQ, QR, and PR.
  sources:
    ccss:
    - 8.G.B.6
    - 8.G.B.7
    lc: []
  strand: G4
- id: pythagorean-theorem.proof.explain
  concept: pythagorean-theorem
  facet: area
  level: 4
  type: justification
  name: Explain a proof of the Pythagorean theorem by rearranging triangles
  statement: 'Four copies of a right triangle with legs a and b and hypotenuse c fit inside a square of
    side a + b in two ways: around a tilted square of side c, or beside a square of side a and a square
    of side b; the uncovered area is the same both times, so c^2 = a^2 + b^2.'
  assess: The diagram shows two arrangements of four copies of a right triangle with legs a and b and
    hypotenuse c inside a square of side a + b. Use them to explain why a^2 + b^2 = c^2.
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 9ca7bb46
  strand: G4
- id: pythagorean-theorem.converse
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: concept
  name: The converse of the Pythagorean theorem
  statement: If the side lengths a, b, and c of a triangle satisfy a^2 + b^2 = c^2, the triangle is a
    right triangle with its right angle opposite the side of length c.
  assess: A triangle has side lengths a, b, and c with a^2 + b^2 = c^2. What can you conclude about the
    angle opposite the side of length c?
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 54ee8a5e
  strand: G4
- id: pythagorean-theorem.converse.explain
  concept: pythagorean-theorem
  facet: length
  level: 4
  type: justification
  name: Explain a proof of the converse of the Pythagorean theorem
  statement: Given a triangle with sides a, b, and c and a^2 + b^2 = c^2, build a right triangle with
    legs a and b; by the Pythagorean theorem its hypotenuse is c, so the two triangles have the same three
    side lengths, they are congruent, and the angle opposite c in the given triangle is a right angle.
  assess: Triangle ABC has AC = 5, BC = 12, and AB = 13, so AC^2 + BC^2 = AB^2. Explain, by comparing
    it with a right triangle whose legs are 5 and 12, why angle C must be a right angle.
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 54ee8a5e
  strand: G4
- id: pythagorean-theorem.right-triangle.decide
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Decide from side lengths whether a triangle is a right triangle
  statement: 'Decide whether a triangle with given side lengths is a right triangle by comparing the sum
    of the squares of the two shorter sides with the square of the longest side: equal means right (by
    the converse), unequal means not right (by the theorem).'
  procedure:
  - Name the longest side c and the two shorter sides a and b.
  - Compute a^2 + b^2 and c^2.
  - If they are equal, the triangle is a right triangle; if not, it is not a right triangle.
  assess: A triangle has side lengths 6, 8, and 11. Is it a right triangle?
  sources:
    ccss:
    - 8.G.B.6
    lc:
    - 09bd90d2
  strand: G4
- id: pythagorean-theorem.unknown-side.whole
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find an unknown side of a right triangle when the answer is a whole number
  statement: Find an unknown side length of a right triangle from the other two, when the squares of the
    sides make the unknown length a whole number, using a^2 + b^2 = c^2.
  procedure:
  - Identify the hypotenuse (opposite the right angle) and the legs.
  - If the hypotenuse is unknown, compute a^2 + b^2; if a leg is unknown, compute c^2 minus the square
    of the known leg.
  - The result is a perfect square; its square root is the unknown length.
  assess: A right triangle has a hypotenuse of length 13 and one leg of length 5. Find the length of the
    other leg.
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - cac68ba0
  strand: G4
- id: pythagorean-theorem.unknown-side.irrational
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find the exact unknown side of a right triangle as a square root
  statement: Find an unknown side length of a right triangle from the other two when its square n is not
    a perfect square, giving the exact length sqrt(n).
  procedure:
  - Identify the hypotenuse (opposite the right angle) and the legs.
  - If the hypotenuse is unknown, compute n = a^2 + b^2; if a leg is unknown, compute n = c^2 minus the
    square of the known leg.
  - Write the exact length as sqrt(n).
  assess: A right triangle has legs of lengths 2 and 5. Give the exact length of its hypotenuse.
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - cac68ba0
  strand: G4
- id: pythagorean-theorem.unknown-side.3d
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find the interior diagonal of a rectangular prism
  statement: 'Find the length of the diagonal of a rectangular prism from a bottom corner to the opposite
    top corner by applying the Pythagorean theorem twice: first to the diagonal of the base, then to the
    right triangle formed by that diagonal, a vertical edge, and the interior diagonal.'
  procedure:
  - Find the length d of the diagonal of the base rectangle from d^2 = l^2 + w^2.
  - Use the right triangle whose legs are the base diagonal and a vertical edge of length h, with the
    right angle at the base, and whose hypotenuse is the interior diagonal.
  - Find the interior diagonal D from D^2 = d^2 + h^2.
  assess: A rectangular box is 3 cm long, 4 cm wide, and 12 cm tall. Find the length of the diagonal from
    a bottom corner to the opposite top corner.
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - cac68ba0
  strand: G4
- id: pythagorean-theorem.application.2d.whole
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world right-triangle problems with whole-number answers
  statement: Solve real-world problems in which the unknown length is a side of one right triangle in
    a plane, such as a ladder against a wall or the diagonal of a rectangle, and the answer is a whole
    number.
  assess: A 13-foot ladder leans against a vertical wall, with its foot on level ground 5 feet from the
    wall. How high up the wall does the top of the ladder reach?
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - b922397f
  strand: G4
- id: pythagorean-theorem.application.2d.approximate
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world right-triangle problems with answers rounded to the nearest tenth
  statement: Solve real-world problems in which the unknown length is a side of one right triangle in
    a plane and is not a whole number, giving the length rounded to the nearest tenth.
  assess: A rectangular screen is 8 inches wide and 5 inches tall. How long is its diagonal, to the nearest
    tenth of an inch?
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - b922397f
  strand: G4
- id: pythagorean-theorem.application.3d
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world problems about the interior diagonal of a box
  statement: Solve real-world problems that find the length from a bottom corner to the opposite top corner
    of a box-shaped object, by applying the Pythagorean theorem twice, when the answer is a whole number.
  assess: A storage box is 6 inches long, 8 inches wide, and 24 inches tall. How long is the longest straight
    rod that fits inside it, from a bottom corner to the opposite top corner?
  sources:
    ccss:
    - 8.G.B.7
    lc:
    - b922397f
  strand: G4
- id: pythagorean-theorem.distance.coordinates
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: procedure
  name: Find the distance between two points in the coordinate plane
  statement: Find the distance between two points in the coordinate plane that are not on the same horizontal
    or vertical line as the hypotenuse of the right triangle whose legs are the horizontal and vertical
    distances between the points.
  procedure:
  - Find the horizontal distance between the points from their x-coordinates and the vertical distance
    from their y-coordinates.
  - Use these distances as the legs of a right triangle whose hypotenuse is the segment joining the two
    points.
  - Find the length of the hypotenuse with the Pythagorean theorem.
  assess: Find the distance between the points (-2, 1) and (1, 5).
  sources:
    ccss:
    - 8.G.B.8
    lc:
    - 9a823129
  strand: G4
- id: pythagorean-theorem.distance.application
  concept: pythagorean-theorem
  facet: length
  level: 3
  type: application
  name: Solve real-world straight-line distance problems on a coordinate grid
  statement: Solve real-world problems that find the straight-line distance between two places given by
    coordinates on a map grid, using the Pythagorean theorem and giving the distance rounded to the nearest
    tenth.
  assess: On a town map where each grid unit is 1 km, the school is at (1, 2) and the library is at (4,
    7). What is the straight-line distance between them, to the nearest tenth of a kilometer?
  sources:
    ccss:
    - 8.G.B.8
    lc:
    - de09df1b
  strand: G4
- id: volume.cylinder.formula
  concept: volume
  facet: unit-cubes
  level: 3
  type: concept
  name: The volume formula for a cylinder
  statement: The volume of a cylinder with base radius r and height h is V = pi x r^2 x h, the area of
    its circular base times its height.
  assess: 'Which expression gives the volume of a cylinder with radius 3 cm and height 10 cm: pi x 3^2
    x 10; 2 x pi x 3 x 10; pi x 3 x 10^2?'
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
  strand: G4
- id: volume.cylinder.compute
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a cylinder in terms of pi
  statement: Find the volume of a cylinder from its radius or diameter and its height with V = pi x r^2
    x h, giving the answer in terms of pi.
  procedure:
  - If the diameter is given, halve it to get the radius r.
  - Compute r^2 x h.
  - Write the volume as that number times pi, in cubic units.
  assess: A cylinder has radius 3 cm and height 10 cm. Find its volume in terms of pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
    - 2249c3b7
  strand: G4
- id: volume.cylinder.find-height
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the height of a cylinder from its volume and radius
  statement: Find the height of a cylinder from its volume and radius by dividing the volume by the base
    area pi x r^2.
  procedure:
  - Compute the base area pi x r^2.
  - Divide the volume by the base area; the quotient is the height.
  assess: A cylinder has a volume of 72 x pi cubic cm and a radius of 3 cm. Find its height.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
    - 2249c3b7
  strand: G4
- id: volume.cylinder.find-radius
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the radius of a cylinder from its volume and height
  statement: Find the radius of a cylinder from its volume and height by dividing the volume by pi x h
    to get r^2 and then taking the square root.
  procedure:
  - Divide the volume by pi x h; the quotient is r^2.
  - Take the positive square root of r^2 to get r.
  assess: A cylinder has a volume of 80 x pi cubic cm and a height of 5 cm. Find its radius.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - ba4daaa8
  strand: G4
- id: volume.cylinder.application
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the volume of a cylinder
  statement: Solve real-world problems that find the volume or capacity of a cylindrical object from its
    radius or diameter and its height, using 3.14 for pi.
  assess: A cylindrical water tank has a diameter of 2 m and a height of 3 m. About how many cubic meters
    of water does it hold? Use 3.14 for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - '73140379'
    - 6d9c6fbd
  strand: G4
- id: volume.cylinder.application.find-height
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the height of a cylinder from its volume
  statement: Solve real-world problems that find the height of a cylindrical object from its volume and
    radius, using 3.14 for pi.
  assess: A cylindrical can holds 785 cubic cm and has a radius of 5 cm. How tall is the can? Use 3.14
    for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - '73140379'
    - 6d9c6fbd
  strand: G4
- id: volume.cylinder.application.find-radius
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the radius of a cylinder from its volume
  statement: Solve real-world problems that find the radius of a cylindrical object from its volume and
    height, using 3.14 for pi.
  assess: A cylindrical tank is 2 m tall and holds 56.52 cubic meters of water. What is its radius? Use
    3.14 for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - '73140379'
  strand: G4
- id: volume.cone.formula
  concept: volume
  facet: unit-cubes
  level: 3
  type: concept
  name: The volume formula for a cone
  statement: The volume of a cone with base radius r and height h is V = (1/3) x pi x r^2 x h, one third
    of the volume of the cylinder with the same base and height.
  assess: A cylinder and a cone have the same radius and the same height. The cylinder holds 30 cubic
    cm. How much does the cone hold?
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 74823f49
  strand: G4
- id: volume.cone.compute
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a cone in terms of pi
  statement: Find the volume of a cone from its radius or diameter and its height with V = (1/3) x pi
    x r^2 x h, giving the answer in terms of pi.
  procedure:
  - If the diameter is given, halve it to get the radius r.
  - Compute r^2 x h and divide by 3.
  - Write the volume as that number times pi, in cubic units.
  assess: A cone has radius 3 cm and height 5 cm. Find its volume in terms of pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 74823f49
  strand: G4
- id: volume.cone.find-height
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the height of a cone from its volume and radius
  statement: Find the height of a cone from its volume and radius by multiplying the volume by 3 and dividing
    by the base area pi x r^2.
  procedure:
  - Multiply the volume by 3.
  - Divide by the base area pi x r^2; the quotient is the height.
  assess: A cone has a volume of 12 x pi cubic cm and a radius of 3 cm. Find its height.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 74823f49
  strand: G4
- id: volume.cone.application
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the volume of a cone
  statement: Solve real-world problems that find the volume or capacity of a cone-shaped object from its
    radius or diameter and its height, using 3.14 for pi.
  assess: A paper cone cup has a radius of 3 cm and a height of 10 cm. About how many cubic cm of water
    does it hold? Use 3.14 for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - d28cebe9
  strand: G4
- id: volume.sphere.formula
  concept: volume
  facet: unit-cubes
  level: 3
  type: concept
  name: The volume formula for a sphere
  statement: The volume of a sphere with radius r is V = (4/3) x pi x r^3.
  assess: 'Which expression gives the volume of a sphere with radius 3 cm: (4/3) x pi x 3^3; (4/3) x pi
    x 3^2; 4 x pi x 3^2?'
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 8e127d06
  strand: G4
- id: volume.sphere.compute
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the volume of a sphere in terms of pi
  statement: Find the volume of a sphere from its radius or diameter with V = (4/3) x pi x r^3, giving
    the answer in terms of pi.
  procedure:
  - If the diameter is given, halve it to get the radius r.
  - Compute r^3, multiply by 4, and divide by 3.
  - Write the volume as that number times pi, in cubic units.
  assess: A sphere has radius 3 cm. Find its volume in terms of pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 8e127d06
  strand: G4
- id: volume.sphere.find-radius
  concept: volume
  facet: unit-cubes
  level: 3
  type: procedure
  name: Find the radius of a sphere from its volume
  statement: Find the radius of a sphere from its volume by multiplying the volume by 3 and dividing by
    4 x pi to get r^3, then taking the cube root.
  procedure:
  - Multiply the volume by 3 and divide by 4 x pi; the quotient is r^3.
  - Take the cube root of r^3 to get r.
  assess: A sphere has a volume of 36 x pi cubic cm. Find its radius.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 8e127d06
  strand: G4
- id: volume.sphere.application
  concept: volume
  facet: unit-cubes
  level: 3
  type: application
  name: Solve real-world problems that find the volume of a sphere
  statement: Solve real-world problems that find the volume of a ball or other sphere-shaped object from
    its radius or diameter, using 3.14 for pi.
  assess: A ball has a diameter of 6 inches. About how many cubic inches of air does it hold? Use 3.14
    for pi.
  sources:
    ccss:
    - 8.G.C.9
    lc:
    - 77fac757
  strand: G4
- id: shapes.square-corner
  concept: shapes
  facet: properties
  level: 1
  type: concept
  name: A square corner
  statement: A square corner is a corner of a shape that the corner of a sheet of paper or an index card
    fits exactly, with no gap on either side; whether a corner is square is checked by fitting such a
    corner into it.
  assess: Test each corner of this four-sided shape with the corner of an index card. Which of its corners
    are square corners?
  sources:
    ccss:
    - 3.G.A.1
    lc: []
  strand: F2
- id: shapes.name.prototype.rectangle-hexagon
  concept: shapes
  facet: core
  level: 1
  type: representation
  name: Name typical rectangles and hexagons
  statement: Say the names rectangle and hexagon for typical examples of those shapes shown in their usual
    orientation.
  assess: Show, one at a time, a rectangle resting on a long side and a regular hexagon resting on a side.
    'What shape is this?' Credit the correct name for each.
  sources:
    ccss:
    - K.G.A.2
    lc: []
  strand: F2
- id: shapes.rectangle.opposite-sides-equal
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Opposite sides of a rectangle are equal
  statement: In every rectangle each pair of opposite sides has the same length, so a rectangle has two
    sides of one length and two sides of another, or four equal sides when it is a square.
  assess: A rectangle has one side 7 cm long and the side next to it 3 cm long. How long are the other
    two sides?
  sources:
    ccss:
    - 4.MD.A.3
    lc: []
  strand: F2
- id: parallel.perpendicular-to-same-line
  concept: parallel
  facet: core
  level: 3
  type: concept
  name: Two lines perpendicular to the same line are parallel
  statement: Two lines in a plane that are each perpendicular to the same line are parallel to each other.
  assess: In this plane, lines p and q are each drawn perpendicular to line r. Are p and q parallel? How
    do you know without extending them?
  sources:
    ccss:
    - 5.G.B.4
    lc: []
  strand: F2
- id: area.attribute
  concept: area
  facet: attribute
  level: 1
  type: concept
  name: Area is the amount of flat surface a figure covers
  statement: 'The area of a flat figure is the amount of surface it covers, an attribute different from
    its length: a long thin strip can cover less surface than a short wide square.'
  assess: A long thin ribbon and a square sheet of paper lie on a table; the ribbon is longer. Which covers
    more of the table? Is the longer figure always the one that covers more?
  sources:
    ccss:
    - 3.MD.C.5
    lc: []
  strand: F2
- id: volume.space-occupied
  concept: volume
  facet: attribute
  level: 1
  type: concept
  name: Volume is the amount of space a solid takes up
  statement: 'The volume of a solid is the amount of space it takes up, an attribute different from its
    height: a short wide box can take up more space than a tall thin one.'
  assess: Which takes up more space, a basketball or a tennis ball? Can a taller object take up less space
    than a shorter one? Give an example.
  sources:
    ccss:
    - 5.MD.C.3
    lc: []
  strand: F2
- id: measurement.liquid-volume.liter-unit
  concept: measurement
  facet: liquid-volume
  level: 2
  type: concept
  name: The liter as a unit of liquid volume
  statement: A liter is a standard unit of liquid volume, the amount of liquid that fills a 1-liter container;
    a liquid volume in liters is the number of times it fills that container.
  assess: The water in this jug fills a 1-liter bottle exactly 3 times. How many liters of water are in
    the jug?
  sources:
    ccss:
    - 3.MD.A.2
    lc: []
  strand: F2
- id: measurement.mass.gram-kilogram-unit
  concept: measurement
  facet: mass
  level: 2
  type: concept
  name: The gram and the kilogram as units of mass
  statement: The gram and the kilogram are standard units of mass, a kilogram being much heavier than
    a gram; the mass of an object in grams or kilograms is the number of those unit masses that balance
    it on a pan balance.
  assess: A bag of rice balances 2 one-kilogram masses on a pan balance. What is the mass of the bag?
    Is 1 gram heavier or lighter than 1 kilogram?
  sources:
    ccss:
    - 3.MD.A.2
    lc: []
  strand: F2
- id: measurement.weight.ounces-pounds.measure
  concept: measurement
  facet: weight
  level: 2
  type: procedure
  name: Measure weight in ounces or pounds with a scale
  statement: The weight of an object in ounces or pounds is read from a scale marked in that unit, reported
    as the number with the unit.
  assess: A scale marked in ounces shows its pointer at 12. How much does the bag of beans on it weigh?
  sources:
    ccss:
    - 4.MD.A.1
    lc: []
  strand: F2
- id: measurement.length.whole-plus-fraction
  concept: measurement
  facet: length
  level: 2
  type: representation
  name: A length of whole units plus a fraction of a unit
  statement: A length of a whole number of units and a fraction of a unit more, such as 2 1/4 inches,
    is the point on a ruler or number line that fraction of the way from that whole-number mark to the
    next; it is written as the whole number followed by the fraction and read two and one fourth.
  assess: On this inch ruler marked in fourths, mark 2 1/4 inches and 3 3/4 inches.
  sources:
    ccss:
    - 3.MD.B.4
    lc: []
  strand: F2
