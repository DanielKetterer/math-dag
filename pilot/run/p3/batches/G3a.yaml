- id: scale-drawing.meaning
  concept: scale-drawing
  facet: core
  level: 2
  type: concept
  name: A scale drawing multiplies every length by the same factor
  statement: A scale drawing of a figure has the same angles as the figure, and every length in the drawing
    is the actual length multiplied by one and the same factor; the scale states which actual length a
    drawing length stands for.
  assess: Rectangle A is 4 cm by 6 cm. Rectangle B is 6 cm by 8 cm. Rectangle C is 6 cm by 9 cm. Which
    of B and C is a scale drawing of A?
  sources:
    ccss:
    - 7.G.A.1
    lc: []
  strand: G3
- id: scale-drawing.actual-length
  concept: scale-drawing
  facet: core
  level: 2
  type: procedure
  name: Find an actual length from a scale drawing
  statement: 'An actual length is found from its length in a scale drawing by proportional reasoning with
    the scale: drawing length and actual length are in the same ratio as the two lengths named in the
    scale.'
  procedure:
  - Write the scale as a pair of corresponding lengths, drawing length to actual length.
  - Find how many times the scale's drawing length fits into the given drawing length.
  - Multiply the scale's actual length by that number.
  assess: On a plan, 2 cm represents 5 m. A wall is 8 cm long on the plan. How long is the actual wall?
  sources:
    ccss:
    - 7.G.A.1
    lc:
    - 9ffdee4b
  strand: G3
- id: scale-drawing.actual-area
  concept: scale-drawing
  facet: core
  level: 2
  type: procedure
  name: Find an actual area from a scale drawing
  statement: The actual area of a figure in a scale drawing is found by converting the drawing lengths
    it needs to actual lengths with the scale and then computing the area from the actual lengths.
  procedure:
  - Convert each drawing length needed for the area to an actual length with the scale.
  - Compute the area from the actual lengths.
  assess: A rectangular room is drawn 4 cm by 3 cm. The scale is 1 cm to 2 m. What is the actual area
    of the room?
  sources:
    ccss:
    - 7.G.A.1
    lc:
    - f75552e4
  strand: G3
- id: scale-drawing.area.scale-factor-squared
  concept: scale-drawing
  facet: core
  level: 3
  type: concept
  name: Scaling lengths by k scales area by k x k
  statement: When every length of a figure is multiplied by k, its area is multiplied by k x k.
  assess: Every side of a rectangle is multiplied by 3. Is its area multiplied by 3? If not, by what number
    is it multiplied?
  sources:
    ccss:
    - 7.G.A.1
    lc: []
  strand: G3
- id: scale-drawing.reproduce
  concept: scale-drawing
  facet: core
  level: 2
  type: procedure
  name: Redraw a scale drawing at a different scale
  statement: A scale drawing is redrawn at a new scale by finding each actual length from the old scale,
    converting it to a drawing length with the new scale, and drawing the figure with those lengths and
    the same angles.
  procedure:
  - Find the actual length of each side from the old scale.
  - Find the new drawing length of each side from the new scale.
  - Draw the figure with the new lengths and the same angles.
  assess: A rectangular garden is drawn 6 cm by 4 cm with the scale 1 cm to 2 m. Redraw it with the scale
    1 cm to 4 m, labeling the new side lengths.
  sources:
    ccss:
    - 7.G.A.1
    lc:
    - 48cb8621
  strand: G3
