new_concepts:
  - {concept: statistical-question, facet: core, reason: "6.SP.A.1: a question that anticipates variability in its data; no existing concept fits."}
  - {concept: distribution, facet: core, reason: "6.SP.A.2, 6.SP.B.5.c, 7.SP.B.3: the distribution of a numerical data set (center, spread, shape, overlap of two distributions)."}
  - {concept: center, facet: core, reason: "6.SP.A.3, 6.SP.B.5.d: a measure of center as one summarizing number, and choosing between measures."}
  - {concept: center, facet: mean, reason: "The mean as sum divided by count (6.SP.B.5.c)."}
  - {concept: center, facet: median, reason: "The median as the middle of the ordered data (6.SP.B.5.c)."}
  - {concept: variability, facet: core, reason: "6.SP.A.3, 6.SP.B.5.d: a measure of variation as one number, and choosing between measures."}
  - {concept: variability, facet: iqr, reason: "Quartiles and interquartile range (6.SP.B.4 box plots, 6.SP.B.5.c)."}
  - {concept: variability, facet: mad, reason: "Mean absolute deviation (6.SP.B.5.c, 7.SP.B.3)."}
  - {concept: data, facet: histogram, reason: "Histograms (6.SP.B.4); not a line plot or a bar graph, since values are grouped into intervals."}
  - {concept: data, facet: box-plot, reason: "Box plots of the five-number summary (6.SP.B.4)."}
  - {concept: data, facet: scatter-plot, reason: "Scatter plots of bivariate measurement data (8.SP.A.1)."}
  - {concept: sampling, facet: core, reason: "7.SP.A.1-2: population, sample, random and representative samples, sampling variability."}
  - {concept: inference, facet: estimate, reason: "7.SP.A.2: estimating a population mean or proportion from a random sample."}
  - {concept: inference, facet: comparison, reason: "7.SP.B.4: informal comparative inference about two populations."}
  - {concept: probability, facet: likelihood, reason: "7.SP.C.5: probability as a number from 0 to 1 measuring likelihood."}
  - {concept: probability, facet: relative-frequency, reason: "7.SP.C.6, 7.SP.C.7.b, 7.SP.C.8.c: probability approximated by long-run relative frequency, including simulation."}
  - {concept: probability, facet: equally-likely, reason: "7.SP.C.7.a, 7.SP.C.8.a-b: classical probability as a fraction of equally likely outcomes, and the sample spaces it counts."}
  - {concept: probability, facet: model, reason: "7.SP.C.7.b: a probability model that assigns (possibly unequal) probabilities to outcomes, with event probabilities as sums."}
  - {concept: association, facet: numerical, reason: "8.SP.A.1: direction, form, strength, clusters and outliers of association in a scatter plot."}
  - {concept: association, facet: categorical, reason: "8.SP.A.4: association between two categorical variables shown by relative frequencies in a two-way table."}
  - {concept: linear-function, facet: fitted-line, reason: "8.SP.A.2-3: a line fitted informally to data as a model of a trend, distinct from the exact line and model facets."}
