  - {lc: "0bfe77de", node: data.line-plot.make}
dropped:
  - {lc: "f6b991bd", reason: "Misstates 6.SP.A.3: the standard says a single number summarizes the center or the variation, not the whole distribution; both correct readings are written as center.meaning (26d22200) and variability.meaning (d6f0d3bc)."}
notes: "No reserved id in existing_ids.txt is owned by S1, so none was used or retired. Covered_by: making a dot plot or number-line plot of numerical data is the existing data.line-plot.make skill (one dot per value above a number line); the range rule does not split it, since 6.SP dot plots use whole-number or simple-unit values with the same prerequisites. Reading the data set back from a dot plot had no written node, so data.dot-plot.read is new (facet line-plot). Partly covered: table.two-way.interpret adds only the meaning of cells and marginal totals; reading one entry is the written table.read-two-way, which proposers should use as its prerequisite. Splits made under the range and class rules: mean and median are separate procedure nodes (both cite 2ad87414); quartiles, IQR, and MAD are separate nodes (all cite 3280abf4); estimating a population mean and a population proportion are separate (both cite c5ae0dd5) because one needs the mean and the other a fraction of a count; gauging sampling error from several samples is split numerical versus categorical (8cf753cf and 6f445725, both also citing the general 67bdbbc4); using a fitted-line equation is split into predicting the output (arithmetic only) and finding the input (needs equation solving, E2's equations.linear.solve), both citing 31ebd1b1; relative frequencies in a two-way table (computing) and using them to describe an association (application) both cite 13103f2c. Choice of measures (6.SP.B.5.d) is written as two concept nodes plus center.mean-median.outlier-effect, the informal fact the choice rests on. Informal before formal: sampling.population-sample.meaning, sampling.random.meaning, and probability.relative-frequency.estimate carry no lc of their own; they are the informal ideas that 7.SP.A.1 and 7.SP.C.6 use and that the cited nodes need, and are written so proposers can point at them. Facet naming to review: the three sample-space representation nodes and probability.compound.event-outcomes use facet equally-likely because 7.SP.C.8 counts them toward classical probability, though listing a sample space does not itself require equally likely outcomes; probability.model.nonuniform.event uses facet model while probability.model.from-frequencies uses relative-frequency, since the first is about computing within any model and the second about building one from data. linear-function.fitted-line.slope.interpret and .intercept.interpret parallel the written linear-function.model.rate.interpret and .initial.interpret; they differ because a fitted line describes a trend, not an exact rule, so they are written as separate nodes and the written ones are their natural prerequisites. Range (maximum minus minimum) is not a 6-8 CCSS measure and was not written. A box plot drawn from raw data is reached through variability.quartiles.find, center.median.find, and data.box-plot.make; no separate raw-data node was written. probability.relative-frequency.predict-count is typed procedure but has no procedure list (it is the single step p x n); left as checkpointed rather than rewritten."
