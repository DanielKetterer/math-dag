- id: exponent.whole-number.product-rule
  concept: exponent
  facet: whole-number-power
  level: 3
  type: concept
  name: "Product of powers with the same base: a^m x a^n = a^(m+n)"
  statement: "For any number a and any positive whole numbers m and n, a^m x a^n = a^(m+n): multiplying powers of the same base adds the exponents."
  assess: "Without computing any power, decide whether each is true: 5^3 x 5^4 = 5^7; 5^3 x 5^4 = 5^12; 5^3 x 5^4 = 25^7."
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.whole-number.quotient-rule
  concept: exponent
  facet: whole-number-power
  level: 3
  type: concept
  name: "Quotient of powers with the same base: a^m divided by a^n = a^(m - n)"
  statement: "For any nonzero number a and positive whole numbers m and n with m greater than n, a^m divided by a^n = a^(m - n): dividing powers of the same base subtracts the exponents."
  assess: "Without computing any power, decide whether each is true: 7^6 divided by 7^2 = 7^4; 7^6 divided by 7^2 = 7^3; 7^6 divided by 7^2 = 1^4."
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.whole-number.power-of-power
  concept: exponent
  facet: whole-number-power
  level: 3
  type: concept
  name: "Power of a power: (a^m)^n = a^(m x n)"
  statement: "For any number a and positive whole numbers m and n, (a^m)^n = a^(m x n): raising a power to a power multiplies the exponents."
  assess: "Without computing any power, decide whether each is true: (3^2)^4 = 3^8; (3^2)^4 = 3^6; (3^2)^4 = 9^8."
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.whole-number.power-of-product
  concept: exponent
  facet: whole-number-power
  level: 3
  type: concept
  name: "Power of a product: (a x b)^n = a^n x b^n"
  statement: "For any numbers a and b and positive whole number n, (a x b)^n = a^n x b^n. The rule is for a product only: (a + b)^n is not in general a^n + b^n."
  assess: "Without computing any power, decide whether each is true: (2 x 5)^3 = 2^3 x 5^3; (2 x 5)^3 = 2 x 5^3; (2 + 5)^3 = 2^3 + 5^3."
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.whole-number.power-of-quotient
  concept: exponent
  facet: whole-number-power
  level: 3
  type: concept
  name: "Power of a quotient: (a/b)^n = a^n/b^n"
  statement: "For any number a, nonzero number b, and positive whole number n, (a/b)^n = a^n/b^n."
  assess: "Without computing any power, decide whether each is true: (2/3)^4 = 2^4/3^4; (2/3)^4 = 2^4/3; (2/3)^4 = 8/12."
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.zero
  concept: exponent
  facet: integer-power
  level: 3
  type: concept
  name: "The zero exponent: a^0 = 1"
  statement: "For any nonzero number a, a^0 = 1."
  assess: "True or false: 7^0 = 0; 7^0 = 1; 7^0 = 7; (2/5)^0 = 1."
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.negative
  concept: exponent
  facet: integer-power
  level: 3
  type: concept
  name: "A negative exponent: a^(-n) = 1/a^n"
  statement: "For any nonzero number a and positive whole number n, a^(-n) = 1/a^n, the reciprocal of a^n."
  assess: "Which of these equals 2^-3: -8, -6, 1/8, or 1/6?"
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.integer.properties
  concept: exponent
  facet: integer-power
  level: 3
  type: concept
  name: "The exponent properties hold for all integer exponents"
  statement: "With a^0 = 1 and a^(-n) = 1/a^n, the rules a^m x a^n = a^(m+n), a^m divided by a^n = a^(m - n), (a^m)^n = a^(m x n), (a x b)^n = a^n x b^n and (a/b)^n = a^n/b^n hold for all integers m and n, with nonzero bases."
  assess: "Without computing any power, decide whether each is true: 5^-2 x 5^6 = 5^4; 4^3 divided by 4^7 = 4^-4; (2^-3)^2 = 2^-1; 6^4 divided by 6^4 = 6^0."
  sources: {ccss: ["8.EE.A.1"], lc: []}
  strand: E2
- id: exponent.integer.equivalent-expressions
  concept: exponent
  facet: integer-power
  level: 3
  type: procedure
  name: "Rewrite a numerical expression with integer exponents using the exponent properties"
  statement: "Rewrite a numerical expression made of products, quotients and powers of powers with integer exponents as an equivalent single power, or as a fraction without exponents, by applying the exponent properties."
  procedure:
    - "Combine powers with the same base into one power, using the product, quotient and power-of-a-power rules."
    - "Combine powers with the same exponent into one power of a product or quotient where that helps."
    - "Rewrite any negative exponent as a reciprocal: a^(-n) = 1/a^n."
    - "If a value is asked for, evaluate the remaining whole-number power."
  assess: "Write 3^2 x 3^-5 as a fraction with no exponents."
  sources: {ccss: ["8.EE.A.1"], lc: ["95a6521a"]}
  strand: E2
- id: root.square.meaning
  concept: root
  facet: square
  level: 3
  type: concept
  name: "The square root of a number"
  statement: "For a number p that is 0 or greater, sqrt(p) is the number that is 0 or greater and whose square is p."
  assess: "Which of these is sqrt(36): 18, 6, or -6?"
  sources: {ccss: ["8.EE.A.2"], lc: []}
  strand: E2
- id: root.cube.meaning
  concept: root
  facet: cube
  level: 3
  type: concept
  name: "The cube root of a number"
  statement: "For a positive number p, the cube root of p is the number whose cube is p."
  assess: "Which of these is the cube root of 64: 8, 4, or 64/3?"
  sources: {ccss: ["8.EE.A.2"], lc: []}
  strand: E2
- id: root.square.perfect-square.evaluate
  concept: root
  facet: square
  level: 3
  type: procedure
  name: "Evaluate the square root of a perfect square up to 625"
  statement: "For a perfect square p from 0 to 625, find sqrt(p): the whole number from 0 to 25 whose square is p."
  procedure:
    - "Recall a square equal to p, or locate p between two known squares and try the whole numbers between their roots."
    - "Check by squaring that the number found gives p."
  assess: "Find sqrt(196) and sqrt(529)."
  sources: {ccss: ["8.EE.A.2"], lc: ["619c552c", "62ce8911", "4e8760e7"]}
  strand: E2
- id: root.cube.perfect-cube.evaluate
  concept: root
  facet: cube
  level: 3
  type: procedure
  name: "Evaluate the cube root of a perfect cube up to 1000"
  statement: "For a perfect cube p from 1 to 1000, find the cube root of p: the whole number from 1 to 10 whose cube is p."
  procedure:
    - "Recall a cube equal to p, or locate p between two known cubes and try the whole numbers between their roots."
    - "Check by cubing that the number found gives p."
  assess: "Find the cube root of 343 and the cube root of 1000."
  sources: {ccss: ["8.EE.A.2"], lc: ["a0e9560a", "4e8760e7"]}
  strand: E2
- id: root.square.solve-x-squared
  concept: root
  facet: square
  level: 3
  type: procedure
  name: "Write the solutions of x^2 = p with square roots"
  statement: "For a positive rational number p, the equation x^2 = p has exactly two solutions, x = sqrt(p) and x = -sqrt(p)."
  procedure:
    - "Write the two solutions x = sqrt(p) and x = -sqrt(p)."
    - "If p is a perfect square, the roots may be replaced by their values."
  assess: "Find every solution of x^2 = 10. Write the solutions with the square root symbol."
  sources: {ccss: ["8.EE.A.2"], lc: ["1c9b3eef"]}
  strand: E2
- id: root.cube.solve-x-cubed
  concept: root
  facet: cube
  level: 3
  type: procedure
  name: "Write the solution of x^3 = p with a cube root"
  statement: "For a positive rational number p, the equation x^3 = p has exactly one solution, the cube root of p."
  procedure:
    - "Write the single solution x = the cube root of p."
    - "If p is a perfect cube, the root may be replaced by its value."
  assess: "Find every solution of x^3 = 20. Write the solution with the cube root symbol."
  sources: {ccss: ["8.EE.A.2"], lc: ["1c9b3eef"]}
  strand: E2
- id: root.square.sqrt2-irrational
  concept: root
  facet: square
  level: 3
  type: concept
  name: "sqrt(2) is irrational"
  statement: "sqrt(2) is irrational: it is not equal to any fraction a/b of integers, so every fraction or finite decimal written for it, such as 1.414, is only an approximation."
  assess: "Ana says sqrt(2) = 1.414 exactly. Ben says sqrt(2) = 99/70 exactly. Is either of them right? What kind of number is sqrt(2)?"
  sources: {ccss: ["8.EE.A.2"], lc: ["5c1fe43a"]}
  strand: E2
- id: exponent.power-of-ten.negative
  concept: exponent
  facet: power-of-ten
  level: 3
  type: representation
  name: "Negative powers of 10 as decimals"
  statement: "For a positive whole number n, 10^-n = 1/10^n, the decimal with the digit 1 in the n-th place after the decimal point and zeros in the places before it."
  assess: "Write 10^-4 as a decimal."
  sources: {ccss: ["8.EE.A.3"], lc: []}
  strand: E2
- id: scientific-notation.meaning
  concept: scientific-notation
  facet: core
  level: 3
  type: concept
  name: "What scientific notation is"
  statement: "A positive number is written in scientific notation when it has the form a x 10^n, where n is an integer and the leading factor a is at least 1 and less than 10."
  assess: "Which of these are written in scientific notation: 4.5 x 10^6; 45 x 10^5; 0.45 x 10^7; 4.5 x 10^-3; 4.5 x 2^6?"
  sources: {ccss: ["8.EE.A.4"], lc: []}
  strand: E2
- id: scientific-notation.from-decimal.large
  concept: scientific-notation
  facet: core
  level: 3
  type: representation
  name: "Write a number of 10 or more in scientific notation"
  statement: "Write a number of 10 or more as a x 10^n, with a at least 1 and less than 10 and n a positive integer, by placing the decimal point just after the first nonzero digit and taking n as the number of places the point moved left."
  procedure:
    - "Place the decimal point just after the first nonzero digit; the number formed is a."
    - "Count the places the decimal point moved to the left; that count is n."
    - "Write a x 10^n, dropping trailing zeros after the decimal point of a."
  assess: "Write 52,000,000 in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: []}
  strand: E2
- id: scientific-notation.from-decimal.small
  concept: scientific-notation
  facet: core
  level: 3
  type: representation
  name: "Write a positive number less than 1 in scientific notation"
  statement: "Write a positive number less than 1 as a x 10^n, with a at least 1 and less than 10 and n a negative integer, by moving the decimal point right to just after the first nonzero digit and taking n as minus the number of places it moved."
  procedure:
    - "Move the decimal point right to just after the first nonzero digit; the number formed is a."
    - "Count the places the decimal point moved; n is the negative of that count."
    - "Write a x 10^n."
  assess: "Write 0.00073 in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: []}
  strand: E2
- id: scientific-notation.to-decimal.large
  concept: scientific-notation
  facet: core
  level: 3
  type: representation
  name: "Write a number in scientific notation with a positive exponent as a decimal"
  statement: "Write a x 10^n, with n a positive integer, as a decimal by moving the decimal point of a n places to the right, writing zeros in any empty places."
  procedure:
    - "Move the decimal point of a n places to the right."
    - "Write a zero in each place passed that has no digit."
  assess: "Write 6.02 x 10^5 as a decimal."
  sources: {ccss: ["8.EE.A.4"], lc: []}
  strand: E2
- id: scientific-notation.to-decimal.small
  concept: scientific-notation
  facet: core
  level: 3
  type: representation
  name: "Write a number in scientific notation with a negative exponent as a decimal"
  statement: "Write a x 10^-k, with k a positive whole number, as a decimal by moving the decimal point of a k places to the left, writing zeros in any empty places."
  procedure:
    - "Move the decimal point of a k places to the left."
    - "Write a zero in each place passed that has no digit, and a 0 before the decimal point."
  assess: "Write 4.1 x 10^-3 as a decimal."
  sources: {ccss: ["8.EE.A.4"], lc: []}
  strand: E2
- id: scientific-notation.estimate.large
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Estimate a large number as a single digit times a power of 10"
  statement: "Estimate a whole number of 10 or more as d x 10^n, with d a single digit from 1 to 9 and n a positive integer, by rounding the number to its greatest place."
  procedure:
    - "Round the number to its greatest place, so that one nonzero digit is left."
    - "Take that digit as d, and the number of places after it as n."
    - "Write d x 10^n."
  assess: "Estimate 4,120,000,000 as a single digit times a power of 10."
  sources: {ccss: ["8.EE.A.3"], lc: ["36effa5a"]}
  strand: E2
- id: scientific-notation.estimate.small
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Estimate a small number as a single digit times a power of 10"
  statement: "Estimate a positive number less than 1 as d x 10^n, with d a single digit from 1 to 9 and n a negative integer, by rounding the number to the place of its first nonzero digit."
  procedure:
    - "Round the number to the place of its first nonzero digit."
    - "Take that digit as d; if it is in the k-th decimal place, n = -k."
    - "Write d x 10^n."
  assess: "Estimate 0.000062 as a single digit times a power of 10."
  sources: {ccss: ["8.EE.A.3"], lc: ["36effa5a"]}
  strand: E2
- id: scientific-notation.compare.order
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Decide which of two numbers in scientific notation is greater"
  statement: "Of two positive numbers in scientific notation, the one with the greater exponent is greater; when the exponents are equal, the one with the greater leading factor is greater."
  procedure:
    - "Compare the exponents; the number with the greater exponent is greater."
    - "If the exponents are equal, compare the leading factors."
  assess: "Which is greater, 9 x 10^-6 or 2 x 10^-5?"
  sources: {ccss: ["8.EE.A.3"], lc: ["97d917b6"]}
  strand: E2
- id: scientific-notation.compare.times-as-much
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Find how many times as large one number written with a power of 10 is as another"
  statement: "For positive numbers a x 10^m and b x 10^n, the first is (a divided by b) x 10^(m - n) times as large as the second."
  procedure:
    - "Divide the leading factors: a divided by b."
    - "Subtract the exponents: m - n."
    - "Write the result as (a divided by b) x 10^(m - n) and state it as a number of times."
  assess: "How many times as large is 6 x 10^4 as 2 x 10^-3?"
  sources: {ccss: ["8.EE.A.3"], lc: ["97d917b6", "52599614"]}
  strand: E2
- id: scientific-notation.normalize
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Rewrite a x 10^n in scientific notation when a is 10 or more or less than 1"
  statement: "When the leading factor of a x 10^n is 10 or more or less than 1, rewrite the number in scientific notation by moving the decimal point of a and changing the exponent so the value is unchanged: each place moved left adds 1 to n, each place moved right subtracts 1."
  procedure:
    - "Move the decimal point of a until a is at least 1 and less than 10, counting the places moved."
    - "If the point moved k places left, add k to the exponent; if it moved k places right, subtract k."
  assess: "Write 34.5 x 10^5 and 0.6 x 10^-2 in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: []}
  strand: E2
- id: scientific-notation.add.same-exponent
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Add numbers in scientific notation with the same power of 10"
  statement: "(a x 10^n) + (b x 10^n) = (a + b) x 10^n: add the leading factors and keep the power of 10."
  procedure:
    - "Add the leading factors."
    - "Keep the common power of 10."
    - "If the new leading factor is 10 or more, rewrite the result in scientific notation."
  assess: "Find 3.2 x 10^5 + 4.5 x 10^5. Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["d4f29aa5"]}
  strand: E2
- id: scientific-notation.subtract.same-exponent
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Subtract numbers in scientific notation with the same power of 10"
  statement: "(a x 10^n) - (b x 10^n) = (a - b) x 10^n: subtract the leading factors and keep the power of 10."
  procedure:
    - "Subtract the leading factors."
    - "Keep the common power of 10."
    - "If the new leading factor is less than 1, rewrite the result in scientific notation."
  assess: "Find 8.6 x 10^-4 - 2.3 x 10^-4. Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["cad5a87d"]}
  strand: E2
- id: scientific-notation.add.different-exponents
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Add numbers in scientific notation with different powers of 10"
  statement: "To add two numbers in scientific notation with different powers of 10, rewrite one so both have the same power of 10, then add the leading factors."
  procedure:
    - "Rewrite the number with the smaller exponent to have the larger exponent, moving its decimal point one place left for each 1 added to the exponent."
    - "Add the leading factors and keep the common power of 10."
    - "If needed, rewrite the result in scientific notation."
  assess: "Find 3 x 10^6 + 4.5 x 10^5. Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["d6c129bf", "2687e8fb"]}
  strand: E2
- id: scientific-notation.subtract.different-exponents
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Subtract numbers in scientific notation with different powers of 10"
  statement: "To subtract two numbers in scientific notation with different powers of 10, rewrite one so both have the same power of 10, then subtract the leading factors."
  procedure:
    - "Rewrite the number with the smaller exponent to have the larger exponent, moving its decimal point one place left for each 1 added to the exponent."
    - "Subtract the leading factors and keep the common power of 10."
    - "If needed, rewrite the result in scientific notation."
  assess: "Find 7.2 x 10^-3 - 5 x 10^-4. Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["52ad9e03", "2687e8fb"]}
  strand: E2
- id: scientific-notation.multiply
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Multiply numbers in scientific notation"
  statement: "(a x 10^m) x (b x 10^n) = (a x b) x 10^(m+n): multiply the leading factors and add the exponents."
  procedure:
    - "Multiply the leading factors."
    - "Add the exponents."
    - "If the new leading factor is 10 or more, rewrite the result in scientific notation."
  assess: "Find (2 x 10^3) x (4 x 10^-5). Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["d4407237", "2687e8fb"]}
  strand: E2
- id: scientific-notation.divide
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Divide numbers in scientific notation"
  statement: "(a x 10^m) divided by (b x 10^n) = (a divided by b) x 10^(m - n): divide the leading factors and subtract the exponents."
  procedure:
    - "Divide the leading factors."
    - "Subtract the exponent of the divisor from the exponent of the dividend."
    - "If the new leading factor is less than 1, rewrite the result in scientific notation."
  assess: "Find (9 x 10^4) divided by (3 x 10^-2). Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["93a8423a", "2687e8fb"]}
  strand: E2
- id: scientific-notation.multiply.mixed-forms
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Multiply a decimal by a number in scientific notation"
  statement: "Multiply a number written as a decimal by a number written in scientific notation by first writing the decimal in scientific notation, then multiplying the two numbers in scientific notation."
  procedure:
    - "Write the decimal number in scientific notation."
    - "Multiply the two numbers in scientific notation."
  assess: "Find 0.0003 x (2 x 10^7). Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["c34d178e"]}
  strand: E2
- id: scientific-notation.divide.mixed-forms
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Divide when one number is a decimal and the other is in scientific notation"
  statement: "Divide when one number is written as a decimal and the other in scientific notation by first writing the decimal in scientific notation, then dividing the two numbers in scientific notation."
  procedure:
    - "Write the decimal number in scientific notation."
    - "Divide the two numbers in scientific notation."
  assess: "Find 4,800,000 divided by (1.2 x 10^-3). Give the answer in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["0c75837c"]}
  strand: E2
- id: scientific-notation.units.choose
  concept: scientific-notation
  facet: core
  level: 3
  type: procedure
  name: "Choose a unit of suitable size for a very large or very small measurement"
  statement: "Given a very large or very small measurement in scientific notation and a set of metric units, choose the unit that makes its measure a number from 1 to 1000, and rewrite the measurement in that unit using powers of 10."
  procedure:
    - "Write the size of each offered unit as a power of 10 times the given unit."
    - "For each unit, divide the measurement by that power of 10 and find the unit that gives a number from 1 to 1000."
    - "Write the measurement in that unit."
  assess: "The Atlantic seafloor widens by about 2.5 x 10^-5 kilometers each year. Which unit makes this rate a number from 1 to 1000: kilometers, meters, or millimeters per year? Give the rate in that unit."
  sources: {ccss: ["8.EE.A.4"], lc: ["dc8db438"]}
  strand: E2
- id: scientific-notation.technology.interpret
  concept: scientific-notation
  facet: core
  level: 3
  type: representation
  name: "Read scientific notation shown by a calculator or computer"
  statement: "A calculator or computer display such as 4.7E-6 means 4.7 x 10^-6: the number after E is the exponent of 10."
  assess: "A calculator shows 4.7E-6. Write the number it shows in scientific notation."
  sources: {ccss: ["8.EE.A.4"], lc: ["4cc1921c"]}
  strand: E2
- id: equation.linear.variable-both-sides
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Solve a linear equation with the variable on both sides"
  statement: "Solve an equation of the form ax + b = cx + d with integer coefficients and a not equal to c by subtracting one variable term from both sides, which leaves an equation with the variable on one side, and solving that equation."
  procedure:
    - "Subtract one of the variable terms, cx or ax, from both sides so the variable appears on one side only."
    - "Solve the resulting equation of the form px + q = r."
  assess: "Solve 7x - 4 = 3x + 16."
  sources: {ccss: ["8.EE.C.7.b"], lc: []}
  strand: E2
- id: equation.linear.expand-collect
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Solve a linear equation that needs expanding and collecting like terms"
  statement: "Solve a linear equation with integer coefficients in which a side must first be rewritten, by expanding products with the distributive property and collecting like terms, as a single expression px + q."
  procedure:
    - "Expand each product such as 3(x - 2) with the distributive property."
    - "Collect like terms on each side."
    - "Solve the resulting equation."
  assess: "Solve 3(x - 2) + 4x = 15."
  sources: {ccss: ["8.EE.C.7.b"], lc: []}
  strand: E2
- id: equation.linear.clear-fractions
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Clear the fractions from a linear equation"
  statement: "Multiplying every term on both sides of an equation by a common multiple of its denominators gives an equivalent equation with integer coefficients."
  procedure:
    - "Find a common multiple of all the denominators in the equation."
    - "Multiply every term on both sides by it."
    - "Simplify each term so its coefficient is an integer."
  assess: "Multiply both sides of (2/3)x - 1 = (1/6)x + 2 by a number that clears every fraction, and write the new equation."
  sources: {ccss: ["8.EE.C.7.b"], lc: []}
  strand: E2
- id: equation.linear.rational-coefficients
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Solve a linear equation with fraction or decimal coefficients by operating on them directly"
  statement: "Solve a linear equation whose coefficients and constants are fractions or decimals, with the variable on both sides, by applying the same operations to both sides and computing with the fractions or decimals as they are."
  procedure:
    - "Subtract one variable term from both sides, combining the fractional or decimal coefficients of x."
    - "Add or subtract the constant on the variable side from both sides."
    - "Divide both sides by the coefficient of x."
  assess: "Solve (2/3)x - 1 = (1/6)x + 2 without first clearing the fractions."
  sources: {ccss: ["8.EE.C.7.b"], lc: ["47943e2b"]}
  strand: E2
- id: equations.linear.solve
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Solve a multi-step linear equation in one variable"
  statement: "Solve any linear equation in one variable with rational coefficients that has exactly one solution, using whichever of these steps it needs: expanding products, collecting like terms, moving the variable terms to one side, and isolating the variable."
  procedure:
    - "Expand products with the distributive property."
    - "Collect like terms on each side."
    - "Add or subtract the same terms on both sides so the variable terms are on one side and the constants on the other."
    - "Divide both sides by the coefficient of the variable."
  assess: "Solve (1/2)(4x - 6) + x = 2x + 5."
  sources: {ccss: ["8.EE.C.7.b"], lc: ["47943e2b"]}
  strand: E2
- id: equation.linear.solution-count.cases
  concept: equation
  facet: linear-one-variable
  level: 3
  type: concept
  name: "A linear equation can have one solution, no solution, or infinitely many"
  statement: "A linear equation in one variable is true for exactly one value of the variable, for no value, or for every value; in the last two cases it has no solution or infinitely many solutions."
  assess: "Which of these equations is true for every value of x, which for no value, and which for exactly one: x + 3 = 3 + x; x + 3 = x + 4; x + 3 = 2x?"
  sources: {ccss: ["8.EE.C.7.a"], lc: ["c219ca3a"]}
  strand: E2
- id: equation.linear.solution-count.reduce
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Find the number of solutions by transforming to x = a, a = a, or a = b"
  statement: "Transform a linear equation in one variable into simpler equivalent equations until x = a (exactly one solution), a = a (infinitely many solutions), or a = b with a and b different numbers (no solution) results."
  procedure:
    - "Expand products and collect like terms on each side."
    - "Subtract a variable term from both sides so that at most one side has the variable."
    - "If the variable is gone, the equation reads a = a (infinitely many solutions) or a = b with a not equal to b (no solution)."
    - "Otherwise isolate the variable to reach x = a (one solution)."
  assess: "How many solutions does 3(x + 2) = 3x + 5 have? Show the simplest equivalent equation you reach."
  sources: {ccss: ["8.EE.C.7.a"], lc: ["c219ca3a"]}
  strand: E2
- id: equation.linear.solution-count.inspection
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Tell by inspection how many solutions a linear equation has"
  statement: "When each side of a linear equation is collected into the form px + q, the equation has exactly one solution if the coefficients of x differ, no solution if they are equal and the constants differ, and infinitely many solutions if both are equal."
  procedure:
    - "If needed, expand and collect like terms mentally so each side has the form px + q."
    - "Compare the coefficients of x: if they differ, there is exactly one solution."
    - "If they are equal, compare the constants: different constants mean no solution, equal constants mean infinitely many."
  assess: "Without solving, say how many solutions each equation has: 4x + 1 = 4x + 7; 4x + 1 = 2x + 1; 2(2x + 3) = 4x + 6."
  sources: {ccss: ["8.EE.C.7.a"], lc: ["d9f1f252"]}
  strand: E2
- id: equation.linear.solution-count.generate
  concept: equation
  facet: linear-one-variable
  level: 3
  type: procedure
  name: "Write a linear equation with one, no, or infinitely many solutions"
  statement: "Write a linear equation in one variable with a required number of solutions by choosing the coefficients of x and the constants on the two sides: different coefficients for one solution, equal coefficients with different constants for no solution, equal coefficients and equal constants for infinitely many."
  procedure:
    - "Write each side in the form px + q."
    - "For one solution, give the two sides different coefficients of x."
    - "For no solution, give them the same coefficient of x and different constants."
    - "For infinitely many solutions, give them the same coefficient of x and the same constant."
  assess: "Fill in the blanks in 5x - 2 = __x + __ so the equation has no solution. Then fill them in again so it has infinitely many solutions."
  sources: {ccss: ["8.EE.C.7.a"], lc: ["9ad64d89"]}
  strand: E2
- id: equation.two-variable.graph-as-solutions
  concept: equation
  facet: two-variable
  level: 3
  type: concept
  name: "The graph of an equation in two variables is the set of its solutions"
  statement: "The graph of an equation in x and y is the set of all points (a, b) such that substituting x = a and y = b makes the equation true."
  assess: "Is the point (1, 1) on the graph of 3x + 2y = 5? Is the point (2, 0)?"
  sources: {ccss: ["8.EE.C.8.a"], lc: []}
  strand: E2
- id: linear-system.solution.meaning
  concept: linear-system
  facet: algebraic
  level: 3
  type: concept
  name: "A solution of a system of two equations"
  statement: "A solution of a system of two equations in x and y is a pair (a, b) that makes both equations true at the same time."
  assess: "Is (2, 3) a solution of the system x + y = 5 and 2x - y = 1? Is (1, 4)?"
  sources: {ccss: ["8.EE.C.8.a"], lc: ["b6895508"]}
  strand: E2
- id: linear-system.solution.intersection
  concept: linear-system
  facet: graphical
  level: 3
  type: concept
  name: "Solutions of a system as the intersection points of the graphs"
  statement: "The solutions of a system of two linear equations in two variables are exactly the points where their graphs intersect, because a point lies on both graphs exactly when its coordinates satisfy both equations."
  assess: "Point P lies on the graph of the first equation of a system but not on the graph of the second. Point Q is where the two graphs cross. Which point's coordinates solve the system, and why do the other point's coordinates not?"
  sources: {ccss: ["8.EE.C.8.a"], lc: ["b6895508"]}
  strand: E2
- id: linear-system.graph.read
  concept: linear-system
  facet: graphical
  level: 2
  type: procedure
  name: "Read the solution of a system from its drawn graphs"
  statement: "When the graphs of the two equations of a system are drawn, the solution is the coordinate pair of the point where the lines cross."
  procedure:
    - "Find the point where the two lines cross."
    - "Read its coordinates (x, y); that pair is the solution."
  assess: "The graphs of the two equations of a system are drawn on a coordinate grid and cross at a grid point (shown). What is the solution of the system?"
  sources: {ccss: ["8.EE.C.8.b"], lc: ["7477f174"]}
  strand: E2
- id: linear-system.graph.estimate
  concept: linear-system
  facet: graphical
  level: 3
  type: procedure
  name: "Estimate the solution of a system by graphing"
  statement: "Estimate the solution of a system of two equations of the form y = mx + b by graphing both lines on the same axes and reading the coordinates of their intersection, estimating them when the intersection is not at a grid point."
  procedure:
    - "Graph each equation as a line on the same coordinate axes."
    - "Locate the point where the lines cross."
    - "Read or estimate its coordinates."
  assess: "Graph y = x + 1 and y = -2x + 6 on the same axes and estimate the solution of the system."
  sources: {ccss: ["8.EE.C.8.b"], lc: []}
  strand: E2
- id: linear-system.inspection
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: "Tell by inspection how many solutions a simple system has"
  statement: "For a system written as ax + by = c and dx + ey = f: if the left side of one equation is k times the left side of the other, the system has infinitely many solutions when the right sides are in the same ratio k and no solution when they are not; otherwise it has exactly one solution."
  procedure:
    - "Write both equations with the x and y terms on the left and the constant on the right."
    - "Check whether the left side of one equation is a number k times the left side of the other."
    - "If not, the system has exactly one solution. If so, compare the right sides: k times the other right side means infinitely many solutions, anything else means no solution."
  assess: "Without solving, say how many solutions each system has: 3x + 2y = 5 and 3x + 2y = 6; x + y = 4 and 2x + 2y = 8; x + y = 4 and x - y = 2."
  sources: {ccss: ["8.EE.C.8.b"], lc: ["9cdd3a07"]}
  strand: E2
- id: linear-system.solution-count.slopes
  concept: linear-system
  facet: graphical
  level: 3
  type: concept
  name: "The number of solutions of a system from the slopes and intercepts of its lines"
  statement: "For a system of two equations of the form y = mx + b, different slopes give lines that cross once (one solution); equal slopes with different intercepts give parallel lines (no solution); equal slopes with equal intercepts give the same line (infinitely many solutions)."
  assess: "Without graphing or solving, say how many solutions each system has: y = 2x + 1 and y = 2x - 3; y = 2x + 1 and y = -x + 1; y = 2x + 1 and y = 1 + 2x."
  sources: {ccss: ["8.EE.C.8.b"], lc: ["9cdd3a07"]}
  strand: E2
- id: linear-system.set-expressions-equal
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: "Solve a system of two equations y = mx + b by setting the expressions equal"
  statement: "When both equations of a system give y in terms of x, solve the system by setting the two expressions for y equal, solving that equation for x, and substituting to find y."
  procedure:
    - "Set the two expressions for y equal to each other."
    - "Solve the resulting equation for x."
    - "Substitute that value of x into either equation to find y."
  assess: "Solve the system y = 3x - 2 and y = x + 4."
  sources: {ccss: ["8.EE.C.8.b"], lc: ["c7a43025"]}
  strand: E2
- id: linear-system.substitution
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: "Solve a system of two linear equations by substitution"
  statement: "Solve a system of two linear equations by expressing one variable in terms of the other from one equation, substituting that expression into the other equation, solving for the remaining variable, and substituting back."
  procedure:
    - "If neither equation is already solved for a variable, solve one of them for one variable."
    - "Substitute that expression for the variable in the other equation."
    - "Solve the resulting one-variable equation."
    - "Substitute the value back to find the other variable."
  assess: "Solve the system y = 2x + 1 and 3x + y = 11 by substitution."
  sources: {ccss: ["8.EE.C.8.b"], lc: ["c7a43025"]}
  strand: E2
- id: linear-system.elimination
  concept: linear-system
  facet: algebraic
  level: 3
  type: procedure
  name: "Solve a system of two linear equations by elimination"
  statement: "Solve a system of two linear equations by adding or subtracting the equations, after multiplying one or both by a number if needed, so that one variable is eliminated; then solve for the other variable and substitute back."
  procedure:
    - "Multiply one or both equations by numbers so that one variable has equal or opposite coefficients."
    - "Subtract the equations if the coefficients are equal, or add them if they are opposite, to eliminate that variable."
    - "Solve the resulting one-variable equation."
    - "Substitute the value back to find the other variable."
  assess: "Solve the system 2x + 3y = 12 and 2x - y = 4 by elimination."
  sources: {ccss: ["8.EE.C.8.b"], lc: ["c7a43025"]}
  strand: E2
- id: linear-system.application.mathematical.simple
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: "Find where two lines meet when each is given by its y-intercept and a slope or second point, with an integer meeting point"
  statement: "Solve mathematical problems about two lines, each given by its y-intercept together with its slope or one other point, that meet at a point with integer coordinates, by writing both equations as y = mx + b and solving the system."
  assess: "Line A passes through (0, 1) and (2, 5). Line B passes through (0, 7) and (3, 4). At what point do the two lines meet?"
  sources: {ccss: ["8.EE.C.8.c"], lc: ["d77eb62e"]}
  strand: E2
- id: linear-system.application.mathematical
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: "Decide whether and where two lines given by two points each intersect"
  statement: "For two lines, each given by any two of its points, decide whether they intersect and, if they do, find the intersection point, which may have fraction coordinates, by writing an equation for each line and solving the system."
  assess: "Does the line through (1, 2) and (3, 6) meet the line through (0, 5) and (5, 0)? If so, at what point?"
  sources: {ccss: ["8.EE.C.8.c"], lc: ["c7120f98"]}
  strand: E2
- id: linear-system.application.real-world.simple
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: "Solve real-world problems about when two constant-rate quantities are equal"
  statement: "Solve real-world problems about two quantities that each start at a given value and change at a constant rate, finding when they are equal, by writing two equations of the form y = mx + b and solving the system, in problems whose answers are whole numbers."
  assess: "Plan A costs $20 plus $5 per month. Plan B costs $50 plus $2 per month. After how many months do the two plans cost the same, and what is that cost?"
  sources: {ccss: ["8.EE.C.8.c"], lc: ["237c924f"]}
  strand: E2
- id: linear-system.application.real-world
  concept: linear-system
  facet: algebraic
  level: 3
  type: application
  name: "Solve real-world problems about two unknowns given two linear conditions"
  statement: "Solve real-world problems about two unknown quantities related by two linear conditions, such as a total count and a total value, by writing a system of two linear equations and solving it algebraically."
  assess: "A club sold 20 tickets, some at $2 and some at $5, and took in $76. How many tickets of each price did it sell?"
  sources: {ccss: ["8.EE.C.8.c"], lc: ["158e0231"]}
  strand: E2
- id: functions.definition
  concept: functions
  facet: rule
  level: 3
  type: concept
  name: "A function assigns to each input exactly one output"
  statement: "A function is a rule that assigns to each input exactly one output."
  assess: "Rule A takes a positive whole number and gives any whole number smaller than it. Rule B takes a positive whole number and gives the number 1 less than it. Which rule is a function?"
  sources: {ccss: ["8.F.A.1"], lc: ["f50b9fed"]}
  strand: E2
- id: functions.identify.table
  concept: functions
  facet: rule
  level: 3
  type: procedure
  name: "Decide from a table of pairs whether a relationship is a function"
  statement: "A table or list of input-output pairs fits a function exactly when no input is paired with two different outputs; the same output may appear for different inputs."
  procedure:
    - "Look for any input that appears more than once."
    - "If a repeated input has two different outputs, the relationship is not a function; otherwise the listed pairs fit a function."
  assess: "Does each table show y as a function of x? Table 1: (1, 3), (2, 5), (1, 4). Table 2: (1, 3), (2, 3), (3, 3)."
  sources: {ccss: ["8.F.A.1"], lc: ["f50b9fed"]}
  strand: E2
- id: functions.graph.meaning
  concept: functions
  facet: graph
  level: 3
  type: concept
  name: "The graph of a function is the set of its input-output pairs"
  statement: "The graph of a function is the set of all points (x, y) in the coordinate plane where x is an input and y is the output the function assigns to x."
  assess: "The point (3, 7) is on the graph of a function. What output does the function give for the input 3? Must the point (7, 3) also be on the graph?"
  sources: {ccss: ["8.F.A.1"], lc: ["d37fc186"]}
  strand: E2
- id: functions.identify.graph
  concept: functions
  facet: graph
  level: 3
  type: procedure
  name: "Decide from a graph whether y is a function of x"
  statement: "A graph in the coordinate plane shows y as a function of x exactly when no vertical line meets it in more than one point, since two points on one vertical line are one input with two outputs."
  procedure:
    - "Picture vertical lines placed across the whole graph."
    - "If some vertical line meets the graph in two or more points, y is not a function of x; otherwise it is."
  assess: "Which of these graphs show y as a function of x: a circle; a V shape opening upward; a vertical line; a horizontal line?"
  sources: {ccss: ["8.F.A.1"], lc: ["d37fc186"]}
  strand: E2
- id: linear-function.compare.rate-of-change
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: "Compare the rates of change of two linear functions given in different forms"
  statement: "Given two linear functions represented in different ways (equation, table, graph, or verbal description), find the rate of change of each and decide which is greater."
  procedure:
    - "Find each function's rate of change from its representation: m in y = mx + b, or the change in y divided by the change in x between two points of a table or graph."
    - "Compare the two rates."
  assess: "Function A is y = 3x + 2. Function B is given by the table x: 0, 2, 4 and y: 1, 9, 17. Which function has the greater rate of change?"
  sources: {ccss: ["8.F.A.2"], lc: ["74b65cd2"]}
  strand: E2
- id: linear-function.compare.initial-value
  concept: linear-function
  facet: model
  level: 3
  type: procedure
  name: "Compare the initial values of two linear functions given in different forms"
  statement: "Given two linear functions represented in different ways (equation, table, graph, or verbal description), find the initial value of each, the output for input 0, and decide which is greater."
  procedure:
    - "Find each function's initial value: b in y = mx + b, the y-intercept of a graph, or, for a table, the output reached by working back to input 0 at the constant rate."
    - "Compare the two initial values."
  assess: "Function A is y = 4x + 1. Function B is given by the table x: 1, 2, 3 and y: 5, 7, 9. Which function has the greater initial value?"
  sources: {ccss: ["8.F.A.2"], lc: ["74b65cd2"]}
  strand: E2
- id: linear-function.line.equation-defines
  concept: linear-function
  facet: line
  level: 3
  type: concept
  name: "An equation y = mx + b defines a linear function"
  statement: "Every equation that can be written in the form y = mx + b, for numbers m and b, defines y as a linear function of x."
  assess: "Which of these define y as a linear function of x: y = 3x - 2; y = x^2 + 1; y = 5; y = 2/x; y = 7 - x/2?"
  sources: {ccss: ["8.F.A.3"], lc: ["646a03d8"]}
  strand: E2
- id: linear-function.line.graph-is-line
  concept: linear-function
  facet: line
  level: 3
  type: concept
  name: "The graphs of linear functions are the non-vertical straight lines"
  statement: "The graph of a linear function is a straight line that is not vertical, and every straight line in the coordinate plane that is not vertical is the graph of a linear function."
  assess: "Which of these are graphs of linear functions: a slanted straight line; a horizontal straight line; a vertical straight line; a curve through (0, 0), (1, 1) and (2, 4)?"
  sources: {ccss: ["8.F.A.3"], lc: ["19cec163"]}
  strand: E2
- id: linear-function.line.graph
  concept: linear-function
  facet: line
  level: 3
  type: procedure
  name: "Graph a linear function from its equation y = mx + b"
  statement: "Graph y = mx + b by plotting two points whose coordinates satisfy the equation and drawing the straight line through them."
  procedure:
    - "Plot the point (0, b)."
    - "Substitute another value of x into the equation to find a second point, and plot it."
    - "Draw the straight line through the two points."
  assess: "Graph y = -2x + 3."
  sources: {ccss: ["8.F.A.3"], lc: []}
  strand: E2
- id: linear-function.nonlinear.identify
  concept: linear-function
  facet: line
  level: 3
  type: procedure
  name: "Show from its values that a function is not linear"
  statement: "A function is not linear if the rate of change, the change in output divided by the change in input, differs between two pairs of its points; if the rate is the same for every pair of listed points, those points lie on one line."
  procedure:
    - "Take pairs of points from the table or rule."
    - "Compute the rate of change for each pair."
    - "If two rates differ, the function is not linear."
  assess: "The area of a square is A = s^2. Use the side lengths s = 1, 2 and 3 to decide whether A is a linear function of s."
  sources: {ccss: ["8.F.A.3"], lc: ["469afc42"]}
  strand: E2
- id: linear-function.nonlinear.example
  concept: linear-function
  facet: line
  level: 3
  type: procedure
  name: "Give an example of a function that is not linear"
  statement: "Produce a function that is not linear and show that it is not linear by exhibiting three of its points that do not lie on one line."
  procedure:
    - "Choose a rule whose output does not change by equal amounts for equal changes in input, such as squaring the input."
    - "Compute three points of the rule."
    - "Show that the rates of change between two pairs of these points differ, so the points are not on one line."
  assess: "Give a rule for a function that is not linear, and use three of its points to show that it is not linear."
  sources: {ccss: ["8.F.A.3"], lc: ["469afc42"]}
  strand: E2
- id: functions.qualitative.increasing-decreasing
  concept: functions
  facet: covariation
  level: 2
  type: representation
  name: "Describe where a graphed relationship is increasing, decreasing, or constant"
  statement: "From a graph relating two quantities, describe the intervals of the input over which the output increases, decreases, or stays the same as the input increases."
  assess: "The graph shown gives the height of a hot-air balloon over 60 minutes. Describe in words when the height increases, stays the same, and decreases."
  sources: {ccss: ["8.F.B.5"], lc: ["13cc406a"]}
  strand: E2
- id: functions.qualitative.linear-nonlinear
  concept: functions
  facet: covariation
  level: 2
  type: representation
  name: "Tell from a graph where a relationship changes at a constant or a changing rate"
  statement: "From a graph relating two quantities, tell the intervals where the relationship is linear (the graph is straight, so the output changes at a constant rate) and where it is nonlinear (the graph curves, so the rate changes)."
  assess: "The graph shown gives the distance a car has traveled over 10 minutes. Over which interval does the car travel at a constant speed, and over which is its speed changing?"
  sources: {ccss: ["8.F.B.5"], lc: ["13cc406a"]}
  strand: E2
- id: functions.qualitative.sketch
  concept: functions
  facet: covariation
  level: 2
  type: representation
  name: "Sketch a graph from a verbal description of a relationship"
  statement: "Sketch a graph, without a numerical scale, whose increasing, decreasing, constant, straight and curved parts match a verbal description of how one quantity changes with another."
  assess: "Sketch a graph of the temperature of a cup of hot cocoa over one hour: it cools quickly at first, then more slowly, and then stays at room temperature."
  sources: {ccss: ["8.F.B.5"], lc: ["f0af8f05"]}
  strand: E2
