- id: height.base-height
  concept: height
  facet: core
  level: 2
  type: concept
  name: "Base and height of a triangle or parallelogram"
  statement: "Once a side is chosen as the base, the height is the length of a segment perpendicular to the line containing the base, running from that line to the opposite vertex of a triangle or to the opposite side of a parallelogram. The height may lie outside the figure."
  assess: "In the obtuse triangle shown, the base is the 6 cm side. Two segments are drawn from the top vertex: the 5 cm side of the triangle, and a 4 cm dashed segment that meets the extended base line at a right angle outside the triangle. Which length is the height for this base?"
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.triangle.right.half-rectangle
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a right triangle as half of a rectangle"
  statement: "A right triangle is half of the rectangle whose sides are its two legs, so its area is half of that rectangle's area."
  procedure:
    - "Draw the rectangle that has the two legs of the right triangle as two of its sides."
    - "Note that the hypotenuse is a diagonal that cuts the rectangle into two copies of the triangle."
    - "Find the area of the rectangle and take half of it."
  assess: "A right triangle has legs of 6 cm and 4 cm. Draw the rectangle it is half of and use it to find the area of the triangle."
  sources: {ccss: ["6.G.A.1"], lc: ["c2509042"]}
  strand: G3
- id: area.parallelogram.rearrange
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a parallelogram by rearranging it into a rectangle"
  statement: "Cutting a parallelogram along a segment perpendicular to the base, from the base to the opposite side, and sliding the cut-off piece to the other end makes a rectangle with the same base and height, so the parallelogram has the area of that rectangle. Such a cut always exists when a longer side is used as the base."
  procedure:
    - "Use a longer side as the base."
    - "Cut along a segment from a vertex of the opposite side, perpendicular to the base, down to the base."
    - "Move the cut-off right triangle to the other end so that its slanted side meets the other slanted side."
    - "Find the area of the resulting rectangle, whose sides are the base and the height."
  assess: "A parallelogram drawn on grid paper has a base of 7 units, a slanted side of 5 units and a height of 4 units. Cut it and rearrange the pieces into a rectangle, and find its area."
  sources: {ccss: ["6.G.A.1"], lc: ["0d09acef"]}
  strand: G3
- id: area.triangle.half-parallelogram
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of any triangle as half of a parallelogram"
  statement: "Two copies of any triangle fit together along a side to form a parallelogram with the same base and height as the triangle, so the triangle's area is half of the parallelogram's area."
  procedure:
    - "Make a copy of the triangle and turn it halfway around."
    - "Join the copy to the original along a side other than the base, so that the two form a parallelogram."
    - "Find the area of the parallelogram from its base and height, which are the triangle's base and height."
    - "Take half of that area."
  assess: "An obtuse triangle has a base of 8 cm and a height of 3 cm, drawn outside the triangle. Use two copies of the triangle to form a parallelogram, and find the area of the triangle."
  sources: {ccss: ["6.G.A.1"], lc: ["c2509042"]}
  strand: G3
- id: area.parallelogram.formula
  concept: area
  facet: multiplicative
  level: 3
  type: concept
  name: "The area formula for a parallelogram, A = b x h"
  statement: "The area of any parallelogram is its base times its height, A = b x h, for any side chosen as the base and the height to that base."
  assess: "True or false: a parallelogram with sides of 6 cm and 5 cm, and a height of 4 cm to the 6 cm side, has an area of 30 square cm. Say which rule decides it."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.parallelogram.formula.apply
  concept: area
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the area of a parallelogram with A = b x h"
  statement: "The area of a parallelogram is found by multiplying a base by the height to that base."
  procedure:
    - "Choose a side as the base and identify the height to that base."
    - "Multiply the base by the height."
  assess: "A parallelogram has a base of 9 m, a slanted side of 5 m, and a height of 4 m to the base. Find its area."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.triangle.formula
  concept: area
  facet: multiplicative
  level: 3
  type: concept
  name: "The area formula for a triangle, A = (1/2) x b x h"
  statement: "The area of any triangle is half of its base times its height, A = (1/2) x b x h, for any side chosen as the base and the height to that base."
  assess: "True or false: a right triangle with legs of 6 cm and 8 cm and a hypotenuse of 10 cm has an area of 40 square cm. Say which rule decides it."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.triangle.formula.apply
  concept: area
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the area of a triangle with A = (1/2) x b x h"
  statement: "The area of a triangle is found by multiplying a base by the height to that base and taking half of the product."
  procedure:
    - "Choose a side as the base and identify the height to that base, which may lie outside the triangle."
    - "Multiply the base by the height."
    - "Take half of the product."
  assess: "An obtuse triangle has a base of 6 cm, another side of 5 cm, and a height of 4 cm to the base, drawn outside the triangle. Find its area."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.polygon.decompose
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a polygon by decomposing it into triangles and rectangles"
  statement: "The area of a polygon is the sum of the areas of non-overlapping triangles and rectangles that together make it up."
  procedure:
    - "Cut the polygon into non-overlapping triangles and rectangles whose bases and heights are given or can be found from the given lengths."
    - "Find the area of each piece."
    - "Add the areas of the pieces."
  assess: "A trapezoid has parallel sides of 4 cm and 10 cm, a height of 3 cm, and two equal slanted sides (picture). Cut it into a rectangle and two triangles, and find its area."
  sources: {ccss: ["6.G.A.1", "7.G.B.6"], lc: ["5a75b6d4", "0d09acef", "370f42c5"]}
  strand: G3
- id: area.polygon.subtract
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a figure by subtracting the pieces outside it from a larger figure"
  statement: "The area of a figure equals the area of a larger figure that contains it minus the areas of the non-overlapping pieces of the larger figure that lie outside it."
  procedure:
    - "Enclose the figure in a larger figure whose area can be found, usually a rectangle."
    - "Find the area of each piece of the larger figure that lies outside the given figure."
    - "Subtract the sum of those areas from the area of the larger figure."
  assess: "A triangle drawn on grid paper fits exactly inside a 6-by-5 rectangle. The three pieces of the rectangle outside the triangle are right triangles with legs 6 and 2, 4 and 3, and 2 and 5. Find the area of the triangle by subtracting."
  sources: {ccss: ["6.G.A.1", "7.G.B.6"], lc: ["5a75b6d4", "370f42c5"]}
  strand: G3
- id: area.application.triangle
  concept: area
  facet: multiplicative
  level: 3
  type: application
  name: "Solve real-world problems that find the area of a triangular region"
  statement: "A real-world problem describes a triangular region with a given base and height; the learner finds its area."
  assess: "A triangular sail is 4 m along its bottom edge and 6 m tall, measured straight up from the bottom edge. How many square meters of cloth make the sail?"
  sources: {ccss: ["6.G.A.1"], lc: ["ae975d69"]}
  strand: G3
- id: area.application.polygon
  concept: area
  facet: additive
  level: 2
  type: application
  name: "Solve real-world problems that find the area of a region made of rectangles and triangles"
  statement: "A real-world problem describes a region, with a picture and lengths, that can be cut into rectangles and triangles; the learner finds its area."
  assess: "A patio is a 6 m by 4 m rectangle with a triangle added along one 4 m side; the triangle sticks out 3 m from that side (picture). How many square meters of tile cover the patio?"
  sources: {ccss: ["6.G.A.1", "7.G.B.6"], lc: ["68e69e23", "924ca975", "3bc46cc4"]}
  strand: G3
- id: volume.unit-fraction-cube
  concept: volume
  facet: unit-cubes
  level: 2
  type: concept
  name: "Volume of a cube with a unit-fraction edge"
  statement: "A cube with edge length 1/n unit has volume 1/(n x n x n) cubic unit, because n x n x n such cubes pack one unit cube."
  assess: "A 1-inch cube is cut into equal small cubes, each with edge 1/2 inch (picture). What is the volume, in cubic inches, of one small cube?"
  sources: {ccss: ["6.G.A.2"], lc: ["79258680"]}
  strand: G3
- id: volume.prism.fraction-edges.packing
  concept: volume
  facet: unit-cubes
  level: 2
  type: procedure
  name: "Find the volume of a fraction-edged rectangular prism by packing it with unit-fraction cubes"
  statement: "A right rectangular prism whose edge lengths are multiples of 1/n unit is packed exactly by cubes of edge 1/n; its volume is the number of those cubes times 1/(n x n x n) cubic unit."
  procedure:
    - "Choose a unit fraction 1/n such that each edge length is a whole number of 1/n lengths."
    - "Count the cubes of edge 1/n along each edge and multiply the three counts to get the number of cubes that pack the prism."
    - "Multiply the number of cubes by the volume of one cube, 1/(n x n x n) cubic unit."
  assess: "A box is 3/2 units long, 1 unit wide, and 1/2 unit tall. It is packed exactly with cubes of edge 1/2 unit, as shown. Use the packing to find the volume of the box in cubic units."
  sources: {ccss: ["6.G.A.2"], lc: ["79258680"]}
  strand: G3
- id: volume.prism.fraction-edges.packing-equals-product
  concept: volume
  facet: unit-cubes
  level: 2
  type: justification
  name: "Show that packing and multiplying edge lengths give the same volume for fractional edges"
  statement: "For a right rectangular prism with fractional edge lengths, the volume found by packing with unit-fraction cubes equals the product of the edge lengths, because counting the cubes and multiplying by the volume of one cube computes the same product of fractions."
  assess: "A prism is 3/4 unit by 1/2 unit by 1 unit. Find its volume by packing it with cubes of edge 1/4 unit, and show why the result must equal 3/4 x 1/2 x 1."
  sources: {ccss: ["6.G.A.2"], lc: ["f3bed57a"]}
  strand: G3
- id: volume.prism.fraction-edges.lwh.apply
  concept: volume
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the volume of a fraction-edged rectangular prism with V = l x w x h"
  statement: "The volume of a right rectangular prism with fractional edge lengths is the product of its length, width and height."
  procedure:
    - "Identify the length, width and height."
    - "Multiply the three lengths."
    - "Write the result in cubic units."
  assess: "Find the volume of a right rectangular prism that is 1/2 m long, 3/4 m wide and 2 m tall."
  sources: {ccss: ["6.G.A.2"], lc: ["e270cd96", "2a84aba3"]}
  strand: G3
- id: volume.prism.fraction-edges.base-height.apply
  concept: volume
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the volume of a fraction-edged rectangular prism with V = B x h"
  statement: "The volume of a right rectangular prism with fractional edge lengths is the area of its base times its height."
  procedure:
    - "Find or read the area B of the base."
    - "Multiply B by the height h."
  assess: "A right rectangular prism has a base with area 5/2 square ft and a height of 3/4 ft. Find its volume."
  sources: {ccss: ["6.G.A.2"], lc: ["1756aedc", "2a84aba3"]}
  strand: G3
- id: volume.application.prism.fraction-edges.lwh
  concept: volume
  facet: multiplicative
  level: 3
  type: application
  name: "Solve real-world problems about the volume of a box with fractional edge lengths"
  statement: "A real-world problem gives the length, width and height of a box-shaped object, at least one of them a fraction or mixed number; the learner finds its volume."
  assess: "A box of rice is 4 in long, 3/2 in wide and 5/2 in tall. How many cubic inches of rice fill it?"
  sources: {ccss: ["6.G.A.2"], lc: ["319c693b", "f873f320"]}
  strand: G3
- id: volume.application.prism.fraction-edges.base-height
  concept: volume
  facet: multiplicative
  level: 3
  type: application
  name: "Solve real-world problems about the volume of a box from a fractional base area and height"
  statement: "A real-world problem gives the area of the base of a box-shaped object and its height, at least one of them a fraction; the learner finds its volume."
  assess: "The bottom of a fish tank has an area of 3/2 square ft. Water fills the tank to a depth of 2/3 ft. How many cubic feet of water are in the tank?"
  sources: {ccss: ["6.G.A.2"], lc: ["0bbc7349", "f873f320"]}
  strand: G3
- id: coordinate-plane.polygon.draw
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Draw a polygon in the coordinate plane from the coordinates of its vertices"
  statement: "A polygon is drawn in the coordinate plane by plotting its vertices, given as ordered pairs in any of the four quadrants, and joining them in the given order with segments."
  procedure:
    - "Plot each vertex from its ordered pair."
    - "Join consecutive vertices in the given order with segments, and join the last vertex to the first."
  assess: "On a coordinate grid, draw polygon ABCD with A(-3, 2), B(2, 2), C(2, -1) and D(-3, -1)."
  sources: {ccss: ["6.G.A.3"], lc: ["9dbe375b", "89c16385"]}
  strand: G3
- id: coordinate-plane.polygon.missing-vertex
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Find the missing vertex of a rectangle with sides parallel to the axes"
  statement: "In a rectangle whose sides are parallel to the axes, each vertex shares its first coordinate with one neighboring vertex and its second coordinate with the other, so the missing vertex takes its first coordinate from one known vertex and its second coordinate from another."
  procedure:
    - "Find the known vertex that is diagonally opposite the missing one; the other two known vertices are its neighbors."
    - "Take the first coordinate of the neighbor that lies on the same vertical side as the missing vertex."
    - "Take the second coordinate of the neighbor that lies on the same horizontal side as the missing vertex."
  assess: "Three vertices of a rectangle with sides parallel to the axes are (-4, 3), (2, 3) and (2, -1). What are the coordinates of the fourth vertex?"
  sources: {ccss: ["6.G.A.3"], lc: ["89c16385"]}
  strand: G3
- id: coordinate-plane.segment-length.meaning
  concept: coordinate-plane
  facet: location
  level: 2
  type: concept
  name: "The length of a horizontal or vertical segment from coordinates"
  statement: "Two points with the same first coordinate lie on one vertical line, and the length of the segment joining them is the distance between their second coordinates; two points with the same second coordinate lie on one horizontal line, and the length is the distance between their first coordinates."
  assess: "Segment PQ joins P(3, -2) and Q(3, 5). Is PQ horizontal or vertical, and which coordinates of P and Q do you compare to find its length?"
  sources: {ccss: ["6.G.A.3"], lc: ["418d3f5e"]}
  strand: G3
- id: coordinate-plane.segment-length.same-sign
  concept: coordinate-plane
  facet: location
  level: 3
  type: procedure
  name: "Find a horizontal or vertical length when the differing coordinates have the same sign"
  statement: "When two points share one coordinate and their other coordinates have the same sign, the points are on the same side of the axis, and the length of the segment joining them is the difference of the absolute values of those coordinates."
  procedure:
    - "Find the coordinate the points do not share."
    - "Take the absolute value of each of those two coordinates."
    - "Subtract the smaller absolute value from the larger."
  assess: "Without a grid, find the length of the segment joining (-2, -7) and (-2, -3)."
  sources: {ccss: ["6.G.A.3"], lc: ["418d3f5e"]}
  strand: G3
- id: coordinate-plane.segment-length.opposite-sign
  concept: coordinate-plane
  facet: location
  level: 3
  type: procedure
  name: "Find a horizontal or vertical length when the differing coordinates have opposite signs"
  statement: "When two points share one coordinate and their other coordinates have opposite signs, the points are on opposite sides of the axis, and the length of the segment joining them is the sum of the absolute values of those coordinates."
  procedure:
    - "Find the coordinate the points do not share."
    - "Take the absolute value of each of those two coordinates."
    - "Add the two absolute values."
  assess: "Without a grid, find the length of the segment joining (4, -3) and (4, 5)."
  sources: {ccss: ["6.G.A.3"], lc: ["418d3f5e"]}
  strand: G3
- id: coordinate-plane.application.perimeter
  concept: coordinate-plane
  facet: location
  level: 3
  type: application
  name: "Find the perimeter of a polygon with horizontal and vertical sides from its vertices"
  statement: "A mathematical problem gives the vertices of a polygon whose sides are all horizontal or vertical, in any quadrants; the learner finds its perimeter from the coordinates."
  assess: "A polygon has vertices (-3, 4), (2, 4), (2, -2) and (-3, -2). Find its perimeter."
  sources: {ccss: ["6.G.A.3"], lc: ["fcb8e3dc"]}
  strand: G3
- id: coordinate-plane.application.rectangle-area
  concept: coordinate-plane
  facet: location
  level: 3
  type: application
  name: "Find the area of a rectangle with sides parallel to the axes from its vertices"
  statement: "A mathematical problem gives the vertices of a rectangle with sides parallel to the axes, in any quadrants; the learner finds its area from the coordinates."
  assess: "A rectangle has vertices (-2, 3), (4, 3), (4, -1) and (-2, -1). Find its area."
  sources: {ccss: ["6.G.A.3"], lc: ["fcb8e3dc"]}
  strand: G3
- id: coordinate-plane.application.distance.real-world
  concept: coordinate-plane
  facet: location
  level: 3
  type: application
  name: "Find the distance between two places on a coordinate map that share a coordinate"
  statement: "A real-world problem places two locations on a coordinate map with the same first coordinate or the same second coordinate, in any quadrants; the learner finds the distance between them along the grid line."
  assess: "On a town map with a coordinate grid measured in blocks, the library is at (-4, 3) and the school is at (5, 3). How many blocks apart are they along the street that joins them?"
  sources: {ccss: ["6.G.A.3"], lc: ["d07119b2"]}
  strand: G3
- id: coordinate-plane.application.missing-corner.real-world
  concept: coordinate-plane
  facet: location
  level: 2
  type: application
  name: "Find the missing corner of a rectangular region on a coordinate map"
  statement: "A real-world problem gives three corners of a rectangular region, with sides parallel to the axes, on a coordinate map in any quadrants; the learner finds the fourth corner."
  assess: "A park is a rectangle on a city map with sides along the grid lines. Three of its corners are at (-5, 2), (3, 2) and (3, -4). Where is the fourth corner?"
  sources: {ccss: ["6.G.A.3"], lc: ["9303ba90"]}
  strand: G3
