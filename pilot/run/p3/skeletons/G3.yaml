- id: height.base-height
  concept: height
  facet: core
  level: 2
  type: concept
  name: "Base and height of a triangle or parallelogram"
  statement: "Once a side is chosen as the base, the height is the length of a segment perpendicular to the line containing the base, running from that line to the opposite vertex of a triangle or to the opposite side of a parallelogram. The height may lie outside the figure."
  assess: "In the obtuse triangle shown, the base is the 6 cm side. Two segments are drawn from the top vertex: the 5 cm side of the triangle, and a 4 cm dashed segment that meets the extended base line at a right angle outside the triangle. Which length is the height for this base?"
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.triangle.right.half-rectangle
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a right triangle as half of a rectangle"
  statement: "A right triangle is half of the rectangle whose sides are its two legs, so its area is half of that rectangle's area."
  procedure:
    - "Draw the rectangle that has the two legs of the right triangle as two of its sides."
    - "Note that the hypotenuse is a diagonal that cuts the rectangle into two copies of the triangle."
    - "Find the area of the rectangle and take half of it."
  assess: "A right triangle has legs of 6 cm and 4 cm. Draw the rectangle it is half of and use it to find the area of the triangle."
  sources: {ccss: ["6.G.A.1"], lc: ["c2509042"]}
  strand: G3
- id: area.parallelogram.rearrange
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a parallelogram by rearranging it into a rectangle"
  statement: "Cutting a parallelogram along a segment perpendicular to the base, from the base to the opposite side, and sliding the cut-off piece to the other end makes a rectangle with the same base and height, so the parallelogram has the area of that rectangle. Such a cut always exists when a longer side is used as the base."
  procedure:
    - "Use a longer side as the base."
    - "Cut along a segment from a vertex of the opposite side, perpendicular to the base, down to the base."
    - "Move the cut-off right triangle to the other end so that its slanted side meets the other slanted side."
    - "Find the area of the resulting rectangle, whose sides are the base and the height."
  assess: "A parallelogram drawn on grid paper has a base of 7 units, a slanted side of 5 units and a height of 4 units. Cut it and rearrange the pieces into a rectangle, and find its area."
  sources: {ccss: ["6.G.A.1"], lc: ["0d09acef"]}
  strand: G3
- id: area.triangle.half-parallelogram
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of any triangle as half of a parallelogram"
  statement: "Two copies of any triangle fit together along a side to form a parallelogram with the same base and height as the triangle, so the triangle's area is half of the parallelogram's area."
  procedure:
    - "Make a copy of the triangle and turn it halfway around."
    - "Join the copy to the original along a side other than the base, so that the two form a parallelogram."
    - "Find the area of the parallelogram from its base and height, which are the triangle's base and height."
    - "Take half of that area."
  assess: "An obtuse triangle has a base of 8 cm and a height of 3 cm, drawn outside the triangle. Use two copies of the triangle to form a parallelogram, and find the area of the triangle."
  sources: {ccss: ["6.G.A.1"], lc: ["c2509042"]}
  strand: G3
- id: area.parallelogram.formula
  concept: area
  facet: multiplicative
  level: 3
  type: concept
  name: "The area formula for a parallelogram, A = b x h"
  statement: "The area of any parallelogram is its base times its height, A = b x h, for any side chosen as the base and the height to that base."
  assess: "True or false: a parallelogram with sides of 6 cm and 5 cm, and a height of 4 cm to the 6 cm side, has an area of 30 square cm. Say which rule decides it."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.parallelogram.formula.apply
  concept: area
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the area of a parallelogram with A = b x h"
  statement: "The area of a parallelogram is found by multiplying a base by the height to that base."
  procedure:
    - "Choose a side as the base and identify the height to that base."
    - "Multiply the base by the height."
  assess: "A parallelogram has a base of 9 m, a slanted side of 5 m, and a height of 4 m to the base. Find its area."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.triangle.formula
  concept: area
  facet: multiplicative
  level: 3
  type: concept
  name: "The area formula for a triangle, A = (1/2) x b x h"
  statement: "The area of any triangle is half of its base times its height, A = (1/2) x b x h, for any side chosen as the base and the height to that base."
  assess: "True or false: a right triangle with legs of 6 cm and 8 cm and a hypotenuse of 10 cm has an area of 40 square cm. Say which rule decides it."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.triangle.formula.apply
  concept: area
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the area of a triangle with A = (1/2) x b x h"
  statement: "The area of a triangle is found by multiplying a base by the height to that base and taking half of the product."
  procedure:
    - "Choose a side as the base and identify the height to that base, which may lie outside the triangle."
    - "Multiply the base by the height."
    - "Take half of the product."
  assess: "An obtuse triangle has a base of 6 cm, another side of 5 cm, and a height of 4 cm to the base, drawn outside the triangle. Find its area."
  sources: {ccss: ["6.G.A.1"], lc: []}
  strand: G3
- id: area.polygon.decompose
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a polygon by decomposing it into triangles and rectangles"
  statement: "The area of a polygon is the sum of the areas of non-overlapping triangles and rectangles that together make it up."
  procedure:
    - "Cut the polygon into non-overlapping triangles and rectangles whose bases and heights are given or can be found from the given lengths."
    - "Find the area of each piece."
    - "Add the areas of the pieces."
  assess: "A trapezoid has parallel sides of 4 cm and 10 cm, a height of 3 cm, and two equal slanted sides (picture). Cut it into a rectangle and two triangles, and find its area."
  sources: {ccss: ["6.G.A.1", "7.G.B.6"], lc: ["5a75b6d4", "0d09acef", "370f42c5"]}
  strand: G3
- id: area.polygon.subtract
  concept: area
  facet: additive
  level: 2
  type: procedure
  name: "Find the area of a figure by subtracting the pieces outside it from a larger figure"
  statement: "The area of a figure equals the area of a larger figure that contains it minus the areas of the non-overlapping pieces of the larger figure that lie outside it."
  procedure:
    - "Enclose the figure in a larger figure whose area can be found, usually a rectangle."
    - "Find the area of each piece of the larger figure that lies outside the given figure."
    - "Subtract the sum of those areas from the area of the larger figure."
  assess: "A triangle drawn on grid paper fits exactly inside a 6-by-5 rectangle. The three pieces of the rectangle outside the triangle are right triangles with legs 6 and 2, 4 and 3, and 2 and 5. Find the area of the triangle by subtracting."
  sources: {ccss: ["6.G.A.1", "7.G.B.6"], lc: ["5a75b6d4", "370f42c5"]}
  strand: G3
- id: area.application.triangle
  concept: area
  facet: multiplicative
  level: 3
  type: application
  name: "Solve real-world problems that find the area of a triangular region"
  statement: "A real-world problem describes a triangular region with a given base and height; the learner finds its area."
  assess: "A triangular sail is 4 m along its bottom edge and 6 m tall, measured straight up from the bottom edge. How many square meters of cloth make the sail?"
  sources: {ccss: ["6.G.A.1"], lc: ["ae975d69"]}
  strand: G3
- id: area.application.polygon
  concept: area
  facet: additive
  level: 2
  type: application
  name: "Solve real-world problems that find the area of a region made of rectangles and triangles"
  statement: "A real-world problem describes a region, with a picture and lengths, that can be cut into rectangles and triangles; the learner finds its area."
  assess: "A patio is a 6 m by 4 m rectangle with a triangle added along one 4 m side; the triangle sticks out 3 m from that side (picture). How many square meters of tile cover the patio?"
  sources: {ccss: ["6.G.A.1", "7.G.B.6"], lc: ["68e69e23", "924ca975", "3bc46cc4"]}
  strand: G3
- id: volume.unit-fraction-cube
  concept: volume
  facet: unit-cubes
  level: 2
  type: concept
  name: "Volume of a cube with a unit-fraction edge"
  statement: "A cube with edge length 1/n unit has volume 1/(n x n x n) cubic unit, because n x n x n such cubes pack one unit cube."
  assess: "A 1-inch cube is cut into equal small cubes, each with edge 1/2 inch (picture). What is the volume, in cubic inches, of one small cube?"
  sources: {ccss: ["6.G.A.2"], lc: ["79258680"]}
  strand: G3
- id: volume.prism.fraction-edges.packing
  concept: volume
  facet: unit-cubes
  level: 2
  type: procedure
  name: "Find the volume of a fraction-edged rectangular prism by packing it with unit-fraction cubes"
  statement: "A right rectangular prism whose edge lengths are multiples of 1/n unit is packed exactly by cubes of edge 1/n; its volume is the number of those cubes times 1/(n x n x n) cubic unit."
  procedure:
    - "Choose a unit fraction 1/n such that each edge length is a whole number of 1/n lengths."
    - "Count the cubes of edge 1/n along each edge and multiply the three counts to get the number of cubes that pack the prism."
    - "Multiply the number of cubes by the volume of one cube, 1/(n x n x n) cubic unit."
  assess: "A box is 3/2 units long, 1 unit wide, and 1/2 unit tall. It is packed exactly with cubes of edge 1/2 unit, as shown. Use the packing to find the volume of the box in cubic units."
  sources: {ccss: ["6.G.A.2"], lc: ["79258680"]}
  strand: G3
- id: volume.prism.fraction-edges.packing-equals-product
  concept: volume
  facet: unit-cubes
  level: 2
  type: justification
  name: "Show that packing and multiplying edge lengths give the same volume for fractional edges"
  statement: "For a right rectangular prism with fractional edge lengths, the volume found by packing with unit-fraction cubes equals the product of the edge lengths, because counting the cubes and multiplying by the volume of one cube computes the same product of fractions."
  assess: "A prism is 3/4 unit by 1/2 unit by 1 unit. Find its volume by packing it with cubes of edge 1/4 unit, and show why the result must equal 3/4 x 1/2 x 1."
  sources: {ccss: ["6.G.A.2"], lc: ["f3bed57a"]}
  strand: G3
- id: volume.prism.fraction-edges.lwh.apply
  concept: volume
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the volume of a fraction-edged rectangular prism with V = l x w x h"
  statement: "The volume of a right rectangular prism with fractional edge lengths is the product of its length, width and height."
  procedure:
    - "Identify the length, width and height."
    - "Multiply the three lengths."
    - "Write the result in cubic units."
  assess: "Find the volume of a right rectangular prism that is 1/2 m long, 3/4 m wide and 2 m tall."
  sources: {ccss: ["6.G.A.2"], lc: ["e270cd96", "2a84aba3"]}
  strand: G3
- id: volume.prism.fraction-edges.base-height.apply
  concept: volume
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the volume of a fraction-edged rectangular prism with V = B x h"
  statement: "The volume of a right rectangular prism with fractional edge lengths is the area of its base times its height."
  procedure:
    - "Find or read the area B of the base."
    - "Multiply B by the height h."
  assess: "A right rectangular prism has a base with area 5/2 square ft and a height of 3/4 ft. Find its volume."
  sources: {ccss: ["6.G.A.2"], lc: ["1756aedc", "2a84aba3"]}
  strand: G3
- id: volume.application.prism.fraction-edges.lwh
  concept: volume
  facet: multiplicative
  level: 3
  type: application
  name: "Solve real-world problems about the volume of a box with fractional edge lengths"
  statement: "A real-world problem gives the length, width and height of a box-shaped object, at least one of them a fraction or mixed number; the learner finds its volume."
  assess: "A box of rice is 4 in long, 3/2 in wide and 5/2 in tall. How many cubic inches of rice fill it?"
  sources: {ccss: ["6.G.A.2"], lc: ["319c693b", "f873f320"]}
  strand: G3
- id: volume.application.prism.fraction-edges.base-height
  concept: volume
  facet: multiplicative
  level: 3
  type: application
  name: "Solve real-world problems about the volume of a box from a fractional base area and height"
  statement: "A real-world problem gives the area of the base of a box-shaped object and its height, at least one of them a fraction; the learner finds its volume."
  assess: "The bottom of a fish tank has an area of 3/2 square ft. Water fills the tank to a depth of 2/3 ft. How many cubic feet of water are in the tank?"
  sources: {ccss: ["6.G.A.2"], lc: ["0bbc7349", "f873f320"]}
  strand: G3
- id: coordinate-plane.polygon.draw
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Draw a polygon in the coordinate plane from the coordinates of its vertices"
  statement: "A polygon is drawn in the coordinate plane by plotting its vertices, given as ordered pairs in any of the four quadrants, and joining them in the given order with segments."
  procedure:
    - "Plot each vertex from its ordered pair."
    - "Join consecutive vertices in the given order with segments, and join the last vertex to the first."
  assess: "On a coordinate grid, draw polygon ABCD with A(-3, 2), B(2, 2), C(2, -1) and D(-3, -1)."
  sources: {ccss: ["6.G.A.3"], lc: ["9dbe375b", "89c16385"]}
  strand: G3
- id: coordinate-plane.polygon.missing-vertex
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Find the missing vertex of a rectangle with sides parallel to the axes"
  statement: "Find the fourth vertex of a rectangle with sides parallel to the axes from three given vertices with coordinates of any sign, by any reliable method: plotting the points and completing the rectangle, or using that each vertex shares its first coordinate with one neighboring vertex and its second coordinate with the other."
  assess: "Three vertices of a rectangle with sides parallel to the axes are (-4, 3), (2, 3) and (2, -1). What are the coordinates of the fourth vertex?"
  sources: {ccss: ["6.G.A.3", "6.NS.C.8"], lc: ["89c16385", "c7645c9c"]}
  strand: G3
- id: coordinate-plane.segment-length.meaning
  concept: coordinate-plane
  facet: location
  level: 2
  type: concept
  name: "The length of a horizontal or vertical segment from coordinates"
  statement: "Two points with the same first coordinate lie on one vertical line, and the length of the segment joining them is the distance between their second coordinates; two points with the same second coordinate lie on one horizontal line, and the length is the distance between their first coordinates."
  assess: "Segment PQ joins P(3, -2) and Q(3, 5). Is PQ horizontal or vertical, and which coordinates of P and Q do you compare to find its length?"
  sources: {ccss: ["6.G.A.3"], lc: ["418d3f5e"]}
  strand: G3
- id: coordinate-plane.segment-length.same-sign
  concept: coordinate-plane
  facet: location
  level: 3
  type: procedure
  name: "Find a horizontal or vertical length when the differing coordinates have the same sign"
  statement: "When two points share one coordinate and their other coordinates have the same sign, the points are on the same side of the axis, and the length of the segment joining them is the difference of the absolute values of those coordinates."
  procedure:
    - "Find the coordinate the points do not share."
    - "Take the absolute value of each of those two coordinates."
    - "Subtract the smaller absolute value from the larger."
  assess: "Without a grid, find the length of the segment joining (-2, -7) and (-2, -3)."
  sources: {ccss: ["6.G.A.3", "6.NS.C.8"], lc: ["418d3f5e", "1ba53b4c"]}
  strand: G3
- id: coordinate-plane.segment-length.opposite-sign
  concept: coordinate-plane
  facet: location
  level: 3
  type: procedure
  name: "Find a horizontal or vertical length when the differing coordinates have opposite signs"
  statement: "When two points share one coordinate and their other coordinates have opposite signs, the points are on opposite sides of the axis, and the length of the segment joining them is the sum of the absolute values of those coordinates."
  procedure:
    - "Find the coordinate the points do not share."
    - "Take the absolute value of each of those two coordinates."
    - "Add the two absolute values."
  assess: "Without a grid, find the length of the segment joining (4, -3) and (4, 5)."
  sources: {ccss: ["6.G.A.3", "6.NS.C.8"], lc: ["418d3f5e", "1ba53b4c"]}
  strand: G3
- id: coordinate-plane.application.perimeter
  concept: coordinate-plane
  facet: location
  level: 3
  type: application
  name: "Find the perimeter of a polygon with horizontal and vertical sides from its vertices"
  statement: "A mathematical problem gives the vertices of a polygon whose sides are all horizontal or vertical, in any quadrants; the learner finds its perimeter from the coordinates."
  assess: "A polygon has vertices (-3, 4), (2, 4), (2, -2) and (-3, -2). Find its perimeter."
  sources: {ccss: ["6.G.A.3"], lc: ["fcb8e3dc"]}
  strand: G3
- id: coordinate-plane.application.rectangle-area
  concept: coordinate-plane
  facet: location
  level: 3
  type: application
  name: "Find the area of a rectangle with sides parallel to the axes from its vertices"
  statement: "A mathematical problem gives the vertices of a rectangle with sides parallel to the axes, in any quadrants; the learner finds its area from the coordinates."
  assess: "A rectangle has vertices (-2, 3), (4, 3), (4, -1) and (-2, -1). Find its area."
  sources: {ccss: ["6.G.A.3"], lc: ["fcb8e3dc"]}
  strand: G3
- id: coordinate-plane.application.distance.real-world
  concept: coordinate-plane
  facet: location
  level: 3
  type: application
  name: "Find the distance between two places on a coordinate map that share a coordinate"
  statement: "A real-world problem places two locations on a coordinate map with the same first coordinate or the same second coordinate, in any quadrants; the learner finds the distance between them along the grid line."
  assess: "On a town map with a coordinate grid measured in blocks, the library is at (-4, 3) and the school is at (5, 3). How many blocks apart are they along the street that joins them?"
  sources: {ccss: ["6.G.A.3"], lc: ["d07119b2"]}
  strand: G3
- id: coordinate-plane.application.missing-corner.real-world
  concept: coordinate-plane
  facet: location
  level: 2
  type: application
  name: "Find the missing corner of a rectangular region on a coordinate map"
  statement: "A real-world problem gives three corners of a rectangular region, with sides parallel to the axes, on a coordinate map in any quadrants; the learner finds the fourth corner."
  assess: "A park is a rectangle on a city map with sides along the grid lines. Three of its corners are at (-5, 2), (3, 2) and (3, -4). Where is the fourth corner?"
  sources: {ccss: ["6.G.A.3"], lc: ["9303ba90"]}
  strand: G3
- id: shapes.prism.right.meaning
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: "A right prism"
  statement: "A right prism is a solid with two congruent, parallel polygon bases joined by rectangular faces that are perpendicular to the bases; the distance between the bases is its height."
  assess: "Pictures show (a) a box, (b) a solid with two parallel triangles joined by three rectangles perpendicular to them, (c) a solid with a square base and four triangles meeting at a point, (d) a solid with two parallel squares joined by four leaning parallelograms. Which are right prisms?"
  sources: {ccss: ["6.G.A.4", "7.G.B.6"], lc: []}
  strand: G3
- id: shapes.pyramid.meaning
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: "A pyramid"
  statement: "A pyramid is a solid with one polygon base and one triangular face on each side of the base, all the triangles meeting at a single point, the apex."
  assess: "Pictures show (a) a solid with a square base and four triangles meeting at a point, (b) a solid with two parallel triangles joined by three rectangles, (c) a cone, (d) a solid made of four triangles. Which are pyramids?"
  sources: {ccss: ["6.G.A.4", "7.G.A.3"], lc: []}
  strand: G3
- id: net.meaning
  concept: net
  facet: core
  level: 2
  type: concept
  name: "A net of a solid"
  statement: "A net of a solid with flat faces is a flat figure made of all of its faces, joined edge to edge, that folds up into the solid with no gaps and no overlaps."
  assess: "Three arrangements of six equal squares are shown: (a) a row of four squares with one square above and one below the second square, (b) a row of four squares with one square above each of the first two, (c) a 2-by-3 block. Which fold into a cube?"
  sources: {ccss: ["6.G.A.4"], lc: []}
  strand: G3
- id: net.draw
  concept: net
  facet: core
  level: 2
  type: representation
  name: "Draw a net of a prism or pyramid made of rectangles and triangles"
  statement: "A net of a right prism or a pyramid is drawn by laying out each of its rectangular and triangular faces, with its dimensions, so that faces that meet along an edge in the solid share that edge in the net wherever the net is joined."
  procedure:
    - "List the faces of the solid and the dimensions of each."
    - "Draw one face, usually a base."
    - "Draw each face that meets it along an edge against that edge, and continue until every face is drawn once."
    - "Check that the net would fold into the solid with no gaps or overlaps, and label the edge lengths."
  assess: "Draw and label a net of a square pyramid whose base edges are 4 cm and whose triangular faces each have a height of 3 cm."
  sources: {ccss: ["6.G.A.4"], lc: ["ff4ee7ca"]}
  strand: G3
- id: surface-area.meaning
  concept: surface-area
  facet: core
  level: 2
  type: concept
  name: "Surface area as the total area of all faces"
  statement: "The surface area of a solid with flat faces is the sum of the areas of all of its faces, measured in square units."
  assess: "Which tells the surface area of a closed box: (a) the area of its bottom, (b) the total area of all six of its faces, (c) the number of unit cubes that fill it, (d) the sum of its edge lengths?"
  sources: {ccss: ["6.G.A.4"], lc: []}
  strand: G3
- id: surface-area.net.rectangular-prism
  concept: surface-area
  facet: core
  level: 2
  type: procedure
  name: "Find the surface area of a rectangular prism from its net"
  statement: "The surface area of a right rectangular prism is the sum of the areas of the six rectangles in its net."
  procedure:
    - "Find the area of each rectangle in the net."
    - "Add the six areas."
  assess: "A net of a box is made of six labeled rectangles: two are 5 cm by 3 cm, two are 5 cm by 2 cm, and two are 3 cm by 2 cm. Find the surface area of the box."
  sources: {ccss: ["6.G.A.4"], lc: ["eed1bb5e", "20ceb752"]}
  strand: G3
- id: surface-area.net.triangle-faces
  concept: surface-area
  facet: core
  level: 2
  type: procedure
  name: "Find the surface area of a solid with triangular faces from its net"
  statement: "The surface area of a solid whose net is made of rectangles and triangles, such as a triangular prism or a pyramid, is the sum of the areas of the rectangles and triangles in its net."
  procedure:
    - "Find the area of each rectangle in the net."
    - "Find the area of each triangle in the net from its base and height."
    - "Add all the areas."
  assess: "A net of a square pyramid has a square base 4 cm on a side and four triangles, each with base 4 cm and height 3 cm. Find the surface area of the pyramid."
  sources: {ccss: ["6.G.A.4"], lc: ["eed1bb5e", "20ceb752"]}
  strand: G3
- id: surface-area.rectangular-prism.from-dimensions
  concept: surface-area
  facet: core
  level: 3
  type: procedure
  name: "Find the surface area of a rectangular prism from its length, width and height"
  statement: "A right rectangular prism has three pairs of identical faces, l by w, l by h and w by h, so its surface area is twice the sum of lw, lh and wh."
  procedure:
    - "Find the areas l x w, l x h and w x h of three faces that meet at one corner."
    - "Add the three areas."
    - "Double the sum."
  assess: "Without drawing a net, find the surface area of a right rectangular prism that is 5 cm long, 3 cm wide and 2 cm tall."
  sources: {ccss: ["7.G.B.6"], lc: ["42c0d603"]}
  strand: G3
- id: surface-area.prism.from-dimensions
  concept: surface-area
  facet: core
  level: 3
  type: procedure
  name: "Find the surface area of a right prism from its base and height"
  statement: "The surface area of a right prism is the sum of the areas of its two congruent bases and of its rectangular side faces; each side face has one side of the base as one dimension and the prism's height as the other."
  procedure:
    - "Find the area of the base and double it."
    - "For each side of the base, multiply its length by the height of the prism."
    - "Add the doubled base area and all the side-face areas."
  assess: "A right prism is 10 cm long. Its bases are right triangles with sides 3 cm, 4 cm and 5 cm. Find its surface area."
  sources: {ccss: ["7.G.B.6"], lc: ["22098a76"]}
  strand: G3
- id: surface-area.application.rectangular-prism
  concept: surface-area
  facet: core
  level: 3
  type: application
  name: "Solve real-world problems about the surface area of a box"
  statement: "A real-world problem describes a closed box-shaped object by its length, width and height and asks how much material covers it; the learner finds its surface area."
  assess: "A gift box is 6 in long, 4 in wide and 2 in tall. How many square inches of paper cover it exactly, with no overlap?"
  sources: {ccss: ["6.G.A.4", "7.G.B.6"], lc: ["6179a7ca", "854e3387"]}
  strand: G3
- id: surface-area.application.triangle-faces
  concept: surface-area
  facet: core
  level: 3
  type: application
  name: "Solve real-world problems about the surface area of an object with triangular and rectangular faces"
  statement: "A real-world problem describes an object shaped like a solid whose faces are triangles and rectangles, such as a triangular prism or a pyramid, with the lengths needed, and asks how much material covers it; the learner finds its surface area."
  assess: "A tent is a triangular prism 8 ft long, with a floor. Each triangular end has a base of 6 ft, a height of 4 ft and slanted sides of 5 ft. How many square feet of canvas make the tent, floor included?"
  sources: {ccss: ["6.G.A.4", "7.G.B.6"], lc: ["6179a7ca", "8b731d33"]}
  strand: G3
- id: scale-drawing.meaning
  concept: scale-drawing
  facet: core
  level: 2
  type: concept
  name: "A scale drawing multiplies every length by the same factor"
  statement: "A scale drawing of a figure has the same angles as the figure, and every length in the drawing is the actual length multiplied by one and the same factor; the scale states which actual length a drawing length stands for."
  assess: "Rectangle A is 4 cm by 6 cm. Rectangle B is 6 cm by 8 cm. Rectangle C is 6 cm by 9 cm. Which of B and C is a scale drawing of A?"
  sources: {ccss: ["7.G.A.1"], lc: []}
  strand: G3
- id: scale-drawing.actual-length
  concept: scale-drawing
  facet: core
  level: 2
  type: procedure
  name: "Find an actual length from a scale drawing"
  statement: "An actual length is found from its length in a scale drawing by proportional reasoning with the scale: drawing length and actual length are in the same ratio as the two lengths named in the scale."
  procedure:
    - "Write the scale as a pair of corresponding lengths, drawing length to actual length."
    - "Find how many times the scale's drawing length fits into the given drawing length."
    - "Multiply the scale's actual length by that number."
  assess: "On a plan, 2 cm represents 5 m. A wall is 8 cm long on the plan. How long is the actual wall?"
  sources: {ccss: ["7.G.A.1"], lc: ["9ffdee4b"]}
  strand: G3
- id: scale-drawing.actual-area
  concept: scale-drawing
  facet: core
  level: 2
  type: procedure
  name: "Find an actual area from a scale drawing"
  statement: "The actual area of a figure in a scale drawing is found by converting the drawing lengths it needs to actual lengths with the scale and then computing the area from the actual lengths."
  procedure:
    - "Convert each drawing length needed for the area to an actual length with the scale."
    - "Compute the area from the actual lengths."
  assess: "A rectangular room is drawn 4 cm by 3 cm. The scale is 1 cm to 2 m. What is the actual area of the room?"
  sources: {ccss: ["7.G.A.1"], lc: ["f75552e4"]}
  strand: G3
- id: scale-drawing.area.scale-factor-squared
  concept: scale-drawing
  facet: core
  level: 3
  type: concept
  name: "Scaling lengths by k scales area by k x k"
  statement: "When every length of a figure is multiplied by k, its area is multiplied by k x k."
  assess: "Every side of a rectangle is multiplied by 3. Is its area multiplied by 3? If not, by what number is it multiplied?"
  sources: {ccss: ["7.G.A.1"], lc: []}
  strand: G3
- id: scale-drawing.reproduce
  concept: scale-drawing
  facet: core
  level: 2
  type: procedure
  name: "Redraw a scale drawing at a different scale"
  statement: "A scale drawing is redrawn at a new scale by finding each actual length from the old scale, converting it to a drawing length with the new scale, and drawing the figure with those lengths and the same angles."
  procedure:
    - "Find the actual length of each side from the old scale."
    - "Find the new drawing length of each side from the new scale."
    - "Draw the figure with the new lengths and the same angles."
  assess: "A rectangular garden is drawn 6 cm by 4 cm with the scale 1 cm to 2 m. Redraw it with the scale 1 cm to 4 m, labeling the new side lengths."
  sources: {ccss: ["7.G.A.1"], lc: ["48cb8621"]}
  strand: G3
- id: circle.center-radius
  concept: circle
  facet: figure
  level: 2
  type: concept
  name: "A circle as the points at one distance from a center"
  statement: "A circle is all the points in a plane at one fixed distance, the radius, from a fixed point, the center."
  assess: "A circle has center O and radius 5 cm. Point Q is 4 cm from O and point R is 6 cm from O. Which of Q and R is on the circle, inside it, or outside it?"
  sources: {ccss: ["7.G.A.2", "7.G.B.4"], lc: []}
  strand: G3
- id: circle.diameter
  concept: circle
  facet: figure
  level: 2
  type: concept
  name: "A diameter of a circle"
  statement: "A diameter of a circle is a segment that passes through the center and has both endpoints on the circle; its length is twice the radius."
  assess: "In the picture, segment AB has both endpoints on the circle but misses the center, and segment CD passes through the center with both endpoints on the circle. Which is a diameter? The radius is 3 cm; how long is it?"
  sources: {ccss: ["7.G.A.2", "7.G.B.4"], lc: []}
  strand: G3
- id: construction.circle.radius-diameter
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: "Draw a circle with a given radius or diameter using a compass"
  statement: "A circle with a given radius is drawn with a compass opened to that radius and turned about the center; for a given diameter the compass is opened to half the diameter."
  procedure:
    - "If the diameter is given, halve it to get the radius."
    - "Open the compass so its point and pencil are one radius apart, measured on a ruler."
    - "Put the point on the center and turn the compass once around."
  assess: "With a compass and ruler, draw a circle with a diameter of 8 cm."
  sources: {ccss: ["7.G.A.2"], lc: ["52ffb8ee"]}
  strand: G3
- id: construction.triangle.two-sides-included-angle
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: "Draw a triangle from two sides and the angle between them"
  statement: "A triangle with two given side lengths and a given angle between them is drawn with a ruler and protractor."
  procedure:
    - "Draw one side to its given length."
    - "At one endpoint, draw a ray making the given angle with that side, using a protractor."
    - "Mark the second side length along the ray."
    - "Join the two free endpoints."
  assess: "With a ruler and protractor, draw triangle ABC with AB = 6 cm, AC = 4 cm and angle A = 50 degrees."
  sources: {ccss: ["7.G.A.2"], lc: ["52ffb8ee"]}
  strand: G3
- id: construction.triangle.two-angles-included-side
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: "Draw a triangle from two angles and the side between them"
  statement: "A triangle with two given angles, whose sum is less than 180 degrees, and a given side between them is drawn with a ruler and protractor."
  procedure:
    - "Draw the given side to its length."
    - "At each endpoint, draw a ray making the given angle with the side, both rays on the same side of it."
    - "Extend the rays until they meet; the meeting point is the third vertex."
  assess: "With a ruler and protractor, draw triangle PQR with PQ = 5 cm, angle P = 40 degrees and angle Q = 70 degrees."
  sources: {ccss: ["7.G.A.2"], lc: ["52ffb8ee"]}
  strand: G3
- id: construction.triangle.three-sides
  concept: construction
  facet: core
  level: 2
  type: procedure
  name: "Draw a triangle from three side lengths with a compass"
  statement: "A triangle with three given side lengths is drawn by laying down one side and finding the third vertex where two arcs, with radii equal to the other two lengths, meet."
  procedure:
    - "Draw one side to its given length."
    - "From one endpoint, draw an arc with radius equal to the second length."
    - "From the other endpoint, draw an arc with radius equal to the third length."
    - "Join the point where the arcs meet to both endpoints."
  assess: "With a ruler and compass, draw a triangle with sides of 5 cm, 6 cm and 7 cm."
  sources: {ccss: ["7.G.A.2"], lc: ["52ffb8ee"]}
  strand: G3
- id: triangle.inequality
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: "Three lengths make a triangle only when the two shorter add to more than the longest"
  statement: "Three lengths are the side lengths of a triangle exactly when the sum of the two shorter lengths is greater than the longest length."
  assess: "Which of these sets of lengths can be the sides of a triangle: 3, 4, 5; 2, 3, 6; 2, 3, 5?"
  sources: {ccss: ["7.G.A.2"], lc: ["9ddaee28"]}
  strand: G3
- id: triangle.determined.three-sides
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: "Three side lengths determine a unique triangle"
  statement: "Three lengths that can form a triangle determine exactly one triangle: any two triangles with those side lengths are identical copies, angles included."
  assess: "Ana and Ben each build a triangle from straws of 5 cm, 6 cm and 8 cm. Must their triangles have the same angles? Explain by trying to build a different one."
  sources: {ccss: ["7.G.A.2"], lc: ["9ddaee28"]}
  strand: G3
- id: triangle.determined.two-sides-included-angle
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: "Two sides and the angle between them determine a unique triangle"
  statement: "Two side lengths and the measure of the angle between those two sides determine exactly one triangle."
  assess: "Ana draws a triangle with sides of 5 cm and 7 cm and a 40-degree angle between them. Ben draws one with the same three measures. Must the third sides of their triangles be equal? Explain."
  sources: {ccss: ["7.G.A.2"], lc: ["9ddaee28"]}
  strand: G3
- id: triangle.determined.two-angles-included-side
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: "Two angles and the side between them determine a unique triangle"
  statement: "Two angle measures whose sum is less than 180 degrees, and the length of the side between those two angles, determine exactly one triangle."
  assess: "Ana and Ben each draw a triangle with a 5 cm side that has a 40-degree angle at one end and a 60-degree angle at the other. Must their triangles be identical? Explain."
  sources: {ccss: ["7.G.A.2"], lc: ["9ddaee28"]}
  strand: G3
- id: triangle.ambiguous.two-sides-non-included-angle
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: "Two sides and an angle not between them can give more than one triangle"
  statement: "Two side lengths and the measure of an angle that is not between those two sides do not always determine one triangle: they can fit two different triangles."
  assess: "Angle A is 30 degrees, side AB is 6 cm and side BC is 4 cm. Draw two different triangles ABC that meet all three conditions."
  sources: {ccss: ["7.G.A.2"], lc: ["9ddaee28"]}
  strand: G3
- id: triangle.three-angles
  concept: triangle
  facet: determination
  level: 2
  type: concept
  name: "Three angles give no triangle or infinitely many"
  statement: "Three angle measures fit no triangle unless their sum is 180 degrees; when the sum is 180 degrees they fit infinitely many triangles, all the same shape and different in size."
  assess: "Can you draw a triangle with angles of 50, 60 and 70 degrees? Can you draw two different ones? Can you draw a triangle with angles of 50, 60 and 80 degrees?"
  sources: {ccss: ["7.G.A.2"], lc: ["9ddaee28"]}
  strand: G3
- id: triangle.conditions.classify
  concept: triangle
  facet: determination
  level: 2
  type: procedure
  name: "Decide whether three measures give one triangle, more than one, or none"
  statement: "Given three measures of sides or angles, decide whether they determine exactly one triangle, more than one triangle, or no triangle."
  procedure:
    - "Name which kind of condition the three measures are: three sides, two sides and the angle between them, two sides and an angle not between them, two angles and the side between them, or three angles."
    - "Check whether the measures can fit any triangle: the two shorter sides must add to more than the longest, and the angles must add to less than 180 degrees, or to exactly 180 degrees when all three are angles."
    - "If they fit, decide from the kind of condition whether only one triangle fits, or try to draw a second, different triangle that also meets them."
  assess: "For each set, say whether it gives exactly one triangle, more than one, or none: (a) sides of 4 cm, 5 cm and 10 cm; (b) angles of 30, 60 and 90 degrees; (c) sides of 6 cm and 8 cm with a 50-degree angle between them."
  sources: {ccss: ["7.G.A.2"], lc: ["9ddaee28"]}
  strand: G3
- id: cross-section.meaning
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "A cross-section is the flat figure where a plane slices a solid"
  statement: "When a plane slices through a solid, the cross-section is the flat figure where the plane and the solid meet: the shape of the cut face."
  assess: "A block of cheese shaped like a box is cut straight through with a knife. Which is the cross-section: (a) the shape of the cut face, (b) the piece that was cut off, (c) the whole block?"
  sources: {ccss: ["7.G.A.3"], lc: ["4fa7e2b4", "851942b6"]}
  strand: G3
- id: cross-section.prism.parallel-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "Slicing a rectangular prism parallel to its base"
  statement: "A plane parallel to a base of a right rectangular prism slices it in a rectangle of the same size and shape as the base."
  assess: "A box 6 cm long, 4 cm wide and 10 cm tall is sliced halfway up by a plane parallel to its base. Describe the cross-section and give its dimensions."
  sources: {ccss: ["7.G.A.3"], lc: ["feecfb2f", "851942b6"]}
  strand: G3
- id: cross-section.prism.perpendicular-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "Slicing a rectangular prism perpendicular to its base"
  statement: "A plane perpendicular to a base of a right rectangular prism, crossing the base, slices it in a rectangle whose height is the prism's height and whose width is the length of the cut across the base."
  assess: "A box has a 6 cm by 8 cm base and is 5 cm tall. A plane perpendicular to the base slices it along a diagonal of the base, which is 10 cm long. Describe the cross-section and give its dimensions."
  sources: {ccss: ["7.G.A.3"], lc: ["feecfb2f", "08434f52", "4fa7e2b4", "851942b6"]}
  strand: G3
- id: cross-section.pyramid.parallel-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "Slicing a rectangular pyramid parallel to its base"
  statement: "A plane parallel to the base of a right rectangular pyramid, between the base and the apex, slices it in a rectangle with the same shape as the base and a smaller size, smaller the nearer the plane is to the apex."
  assess: "A pyramid has a square base 6 cm on a side. It is sliced by a plane parallel to the base, part way up. What shape is the cross-section, and is it larger or smaller than the base?"
  sources: {ccss: ["7.G.A.3"], lc: ["feecfb2f", "851942b6"]}
  strand: G3
- id: cross-section.pyramid.perpendicular-to-base
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "Slicing a rectangular pyramid perpendicular to its base"
  statement: "A plane perpendicular to the base of a right rectangular pyramid and parallel to one side of the base slices it in a triangle when the plane passes through the apex, and in a trapezoid when it does not."
  assess: "A right rectangular pyramid is sliced by a plane perpendicular to its base and parallel to one side of the base. What shape is the cross-section if the plane passes through the apex? If it misses the apex?"
  sources: {ccss: ["7.G.A.3"], lc: ["feecfb2f", "08434f52", "4fa7e2b4", "851942b6"]}
  strand: G3
- id: cross-section.side-per-face
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "A cross-section has one side in each face the plane crosses"
  statement: "When a plane slices a solid with flat faces, the cross-section is a polygon with exactly one side in each face the plane crosses."
  assess: "A plane slices a box so that it crosses exactly five of the box's six faces. How many sides does the cross-section have?"
  sources: {ccss: ["7.G.A.3"], lc: ["4c290798"]}
  strand: G3
- id: cross-section.prism.oblique
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "Slicing a rectangular prism at a slant"
  statement: "A plane that is neither parallel nor perpendicular to the base of a right rectangular prism can slice it in a triangle, a quadrilateral, a pentagon or a hexagon, according to how many faces it crosses."
  assess: "A slanted plane cuts off one corner of a box, crossing only the three faces that meet at that corner. What shape is the cross-section?"
  sources: {ccss: ["7.G.A.3"], lc: ["4c290798"]}
  strand: G3
- id: cross-section.pyramid.oblique
  concept: cross-section
  facet: core
  level: 2
  type: concept
  name: "Slicing a rectangular pyramid at a slant"
  statement: "A plane that is neither parallel nor perpendicular to the base of a right rectangular pyramid can slice it in a triangle, a quadrilateral or a pentagon, according to how many faces it crosses."
  assess: "A slanted plane slices a square pyramid, crossing all four triangular faces but not the base. What kind of polygon is the cross-section?"
  sources: {ccss: ["7.G.A.3"], lc: ["4c290798"]}
  strand: G3
- id: circle.circumference.meaning
  concept: circle
  facet: measure
  level: 2
  type: concept
  name: "The circumference of a circle"
  statement: "The circumference of a circle is its length: the distance once around the circle."
  assess: "A string wrapped once around the circular bottom of a can and then laid straight is 19 cm long. The can is 6 cm across and 12 cm tall. What is the circumference of the bottom of the can?"
  sources: {ccss: ["7.G.B.4"], lc: []}
  strand: G3
- id: circle.pi.ratio
  concept: circle
  facet: measure
  level: 2
  type: concept
  name: "Pi as the ratio of circumference to diameter"
  statement: "For every circle, the circumference divided by the diameter is the same number, called pi, which is about 3.14."
  assess: "Circles with diameters 2 cm, 5 cm and 10 cm have circumferences of about 6.28 cm, 15.7 cm and 31.4 cm. Find circumference divided by diameter for each circle. What is this number called?"
  sources: {ccss: ["7.G.B.4"], lc: []}
  strand: G3
- id: circle.circumference.formula
  concept: circle
  facet: measure
  level: 3
  type: concept
  name: "The circumference formula C = pi x d"
  statement: "The circumference of a circle with diameter d and radius r is C = pi x d, which is the same as C = 2 x pi x r."
  assess: "True or false: a circle with radius 4 cm has circumference pi x 4 cm. Say which rule decides it."
  sources: {ccss: ["7.G.B.4"], lc: []}
  strand: G3
- id: circle.circumference.formula.apply
  concept: circle
  facet: measure
  level: 3
  type: procedure
  name: "Find the circumference of a circle with the formula"
  statement: "The circumference of a circle is found by multiplying its diameter by pi, doubling the radius first when the radius is given."
  procedure:
    - "If the radius is given, double it to get the diameter."
    - "Multiply the diameter by pi, or by an approximation such as 3.14."
  assess: "Find the circumference of a circle with radius 5 cm. Use 3.14 for pi."
  sources: {ccss: ["7.G.B.4"], lc: ["3e117ec0"]}
  strand: G3
- id: circle.area.formula
  concept: circle
  facet: measure
  level: 3
  type: concept
  name: "The area formula A = pi x r^2"
  statement: "The area of a circle with radius r is A = pi x r x r, written pi x r^2."
  assess: "True or false: a circle with diameter 6 m has area pi x 6 x 6 square m. Say which rule decides it."
  sources: {ccss: ["7.G.B.4"], lc: []}
  strand: G3
- id: circle.area.formula.apply
  concept: circle
  facet: measure
  level: 3
  type: procedure
  name: "Find the area of a circle with the formula"
  statement: "The area of a circle is found by multiplying pi by the radius times itself, halving the diameter first when the diameter is given."
  procedure:
    - "If the diameter is given, halve it to get the radius."
    - "Multiply the radius by itself."
    - "Multiply the result by pi, or by an approximation such as 3.14."
  assess: "Find the area of a circle with radius 10 cm. Use 3.14 for pi."
  sources: {ccss: ["7.G.B.4"], lc: ["a6134b89"]}
  strand: G3
- id: circle.area.derive-from-circumference
  concept: circle
  facet: measure
  level: 4
  type: justification
  name: "Derive the area of a circle from its circumference by rearranging sectors"
  statement: "A circle cut into many equal sectors, arranged alternately point up and point down, is close to a parallelogram whose base is half the circumference and whose height is the radius, and closer the more sectors are used; so the area is (1/2) x C x r, which is (1/2) x 2 x pi x r x r = pi x r^2."
  assess: "A circle of radius r is cut into 16 equal sectors, which are rearranged as in the picture. Use the picture to explain why the area of the circle is half its circumference times its radius, and why that equals pi x r^2."
  sources: {ccss: ["7.G.B.4"], lc: ["b220156e"]}
  strand: G3
- id: circle.application.circumference
  concept: circle
  facet: measure
  level: 3
  type: application
  name: "Solve real-world problems about the distance around a circular object"
  statement: "A real-world problem gives the radius or diameter of a circular object and asks for the distance once around it; the learner finds the circumference."
  assess: "A circular garden has a radius of 5 m. How many meters of fencing go once around it? Use 3.14 for pi."
  sources: {ccss: ["7.G.B.4"], lc: ["3e117ec0"]}
  strand: G3
- id: circle.application.area
  concept: circle
  facet: measure
  level: 3
  type: application
  name: "Solve real-world problems about the area of a circular region"
  statement: "A real-world problem gives the radius or diameter of a circular region and asks how much surface it covers; the learner finds its area."
  assess: "A circular rug has a diameter of 4 m. How many square meters of floor does it cover? Use 3.14 for pi."
  sources: {ccss: ["7.G.B.4"], lc: ["a6134b89"]}
  strand: G3
- id: angle.adjacent
  concept: angle
  facet: figure
  level: 2
  type: concept
  name: "Adjacent angles"
  statement: "Two angles are adjacent when they share a vertex and a side and do not overlap."
  assess: "Three pairs of angles are shown: (a) two angles that share a vertex and a side and do not overlap, (b) two angles that share only a vertex, (c) two angles that share a vertex and a side, one lying inside the other. Which pair is adjacent?"
  sources: {ccss: ["7.G.B.5"], lc: []}
  strand: G3
- id: angle.vertical
  concept: angle
  facet: figure
  level: 2
  type: concept
  name: "Vertical angles"
  statement: "When two lines cross, each pair of opposite angles, which share the vertex and no side, is a pair of vertical angles."
  assess: "Lines AB and CD cross at O. Which angle is vertical to angle AOC? Are angles AOC and COB vertical angles?"
  sources: {ccss: ["7.G.B.5"], lc: []}
  strand: G3
- id: angle.vertical.equal
  concept: angle
  facet: measure
  level: 3
  type: concept
  name: "Vertical angles are equal"
  statement: "Vertical angles have equal measures."
  assess: "Two lines cross. One of the four angles measures 65 degrees. Without measuring, what is the measure of the angle vertical to it?"
  sources: {ccss: ["7.G.B.5"], lc: []}
  strand: G3
- id: angle.supplementary
  concept: angle
  facet: measure
  level: 2
  type: concept
  name: "Supplementary angles"
  statement: "Two angles are supplementary when their measures add to 180 degrees; they need not be adjacent."
  assess: "Which pairs are supplementary: (a) a 120-degree angle and a 60-degree angle in different parts of a figure, (b) adjacent angles of 100 and 70 degrees, (c) two 45-degree angles?"
  sources: {ccss: ["7.G.B.5"], lc: []}
  strand: G3
- id: angle.complementary
  concept: angle
  facet: measure
  level: 2
  type: concept
  name: "Complementary angles"
  statement: "Two angles are complementary when their measures add to 90 degrees; they need not be adjacent."
  assess: "Which pairs are complementary: (a) a 30-degree angle and a 60-degree angle in different parts of a figure, (b) adjacent angles of 40 and 40 degrees, (c) two 90-degree angles?"
  sources: {ccss: ["7.G.B.5"], lc: []}
  strand: G3
- id: angle.straight-line.sum-180
  concept: angle
  facet: measure
  level: 2
  type: concept
  name: "Adjacent angles along a straight line add to 180 degrees"
  statement: "Adjacent angles whose outer sides form a straight line together make a straight angle, so their measures add to 180 degrees."
  assess: "Ray OC is drawn from point O on line AB. Angle AOC measures 130 degrees. Without measuring, find angle COB."
  sources: {ccss: ["7.G.B.5"], lc: []}
  strand: G3
- id: angle.unknown.equation.write
  concept: angle
  facet: measure
  level: 3
  type: representation
  name: "Write an equation for an unknown angle from an angle relationship"
  statement: "When angle measures in a figure are given as expressions in an unknown, an angle relationship gives an equation: the measures of supplementary angles, or of adjacent angles along a straight line, add to 180; of complementary angles add to 90; vertical angles are equal."
  assess: "Angles ABD and DBC are adjacent, and A, B and C lie on a straight line. Angle ABD measures 2x degrees and angle DBC measures (x + 30) degrees. Write an equation for x. Do not solve it."
  sources: {ccss: ["7.G.B.5"], lc: ["779be2f1"]}
  strand: G3
- id: angle.unknown.equation.solve
  concept: angle
  facet: measure
  level: 3
  type: procedure
  name: "Find an unknown angle by writing and solving a two-step equation"
  statement: "An unknown in angle measures given as expressions is found by writing an equation of the form p x + q = r from an angle relationship and solving it."
  procedure:
    - "Write the equation that the angle relationship gives."
    - "Combine like terms so the equation has the form p x + q = r."
    - "Solve the equation for x."
  assess: "Two complementary angles measure x degrees and (2x + 15) degrees. Find x."
  sources: {ccss: ["7.G.B.5"], lc: ["82575afc"]}
  strand: G3
- id: angle.application.multi-step
  concept: angle
  facet: measure
  level: 3
  type: application
  name: "Find an unknown angle in a figure by using two or more angle relationships in turn"
  statement: "A figure problem needs two or more angle relationships (vertical, supplementary, complementary, adjacent angles along a line, or parts of a whole angle) used one after another to find an unknown angle."
  assess: "Lines AB and CD cross at O. Ray OE lies inside angle BOD. Angle AOC measures 70 degrees and angle EOD measures 25 degrees. Find angle BOE."
  sources: {ccss: ["7.G.B.5"], lc: ["779be2f1", "82575afc"]}
  strand: G3
- id: volume.prism.right.base-height
  concept: volume
  facet: multiplicative
  level: 3
  type: concept
  name: "The volume of any right prism is V = B x h"
  statement: "The volume of any right prism is the area B of its base times its height h, whatever polygon the base is."
  assess: "True or false: a right prism 10 cm long whose bases are right triangles with legs 3 cm and 4 cm has volume 3 x 4 x 10 = 120 cubic cm. Say which rule decides it."
  sources: {ccss: ["7.G.B.6"], lc: []}
  strand: G3
- id: volume.prism.right.base-height.apply
  concept: volume
  facet: multiplicative
  level: 3
  type: procedure
  name: "Find the volume of a right prism with a non-rectangular base"
  statement: "The volume of a right prism whose base is a triangle or another polygon is found by computing the area of the base and multiplying it by the height of the prism."
  procedure:
    - "Find the area B of the base."
    - "Find the height h, the distance between the two bases."
    - "Multiply B by h."
  assess: "A right prism is 10 cm long. Its bases are right triangles with legs of 6 cm and 4 cm. Find its volume."
  sources: {ccss: ["7.G.B.6"], lc: ["c9233a4b"]}
  strand: G3
- id: volume.composite.right-prisms
  concept: volume
  facet: additive
  level: 3
  type: procedure
  name: "Find the volume of a solid made of right prisms, not all rectangular"
  statement: "The volume of a solid made of non-overlapping right prisms, at least one with a non-rectangular base, is the sum of the volumes of the prisms."
  procedure:
    - "Split the solid into right prisms that do not overlap."
    - "Find the volume of each prism with V = B x h."
    - "Add the volumes."
  assess: "A solid is a 6 m by 4 m by 3 m box with a triangular prism on top. The prism is 6 m long and its triangular ends have a base of 4 m and a height of 2 m. Find the volume of the solid."
  sources: {ccss: ["7.G.B.6"], lc: ["c9233a4b"]}
  strand: G3
- id: volume.application.right-prism
  concept: volume
  facet: multiplicative
  level: 3
  type: application
  name: "Solve real-world problems about the volume of an object shaped like a non-rectangular right prism"
  statement: "A real-world problem describes an object shaped like a right prism whose base is a triangle or another polygon, with the lengths needed, and asks how much space it holds or takes up; the learner finds its volume."
  assess: "A tent is a triangular prism 3 m long. Each triangular end has a base of 4 m and a height of 2 m. How many cubic meters of space are inside the tent?"
  sources: {ccss: ["7.G.B.6"], lc: ["414ec184"]}
  strand: G3
- id: volume.application.composite.right-prisms
  concept: volume
  facet: additive
  level: 3
  type: application
  name: "Solve real-world problems about the volume of an object made of right prisms"
  statement: "A real-world problem describes an object made of right prisms, at least one with a non-rectangular base, with the lengths needed, and asks how much space it holds or takes up; the learner finds its volume."
  assess: "A shed is a box 4 m long, 3 m wide and 2 m tall with a roof shaped like a triangular prism on top. The roof is 4 m long and its triangular ends have a base of 3 m and a height of 1 m. What is the total volume of the shed?"
  sources: {ccss: ["7.G.B.6"], lc: ["414ec184"]}
  strand: G3
