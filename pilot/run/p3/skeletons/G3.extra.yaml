new_concepts:
  - {concept: height, facet: core, reason: "Base and height of a triangle or parallelogram, the perpendicular distance used by every area and volume formula in this strand; no existing concept fits."}
  - {concept: volume, facet: multiplicative, reason: "Volume by formula (l x w x h, B x h) for fractional edges and non-rectangular right prisms; concepts.yaml lists only unit-cubes."}
  - {concept: volume, facet: additive, reason: "Volume of a solid made of non-overlapping prisms as the sum of their volumes."}
  - {concept: surface-area, facet: core, reason: "Surface area as the total area of all faces; new at 6.G.A.4."}
  - {concept: net, facet: core, reason: "A flat figure of all faces that folds into a solid; new at 6.G.A.4."}
  - {concept: scale-drawing, facet: core, reason: "Scale drawings and scales (7.G.A.1); uses ratio but is a geometric concept of its own."}
  - {concept: circle, facet: figure, reason: "Circle as the points at one distance from a center; radius and diameter."}
  - {concept: circle, facet: measure, reason: "Circumference, pi, and area of a circle."}
  - {concept: construction, facet: core, reason: "Drawing figures from given measures with ruler, protractor and compass (7.G.A.2)."}
  - {concept: triangle, facet: determination, reason: "Which sets of three measures give one triangle, more than one, or none (7.G.A.2)."}
  - {concept: cross-section, facet: core, reason: "Plane sections of solids (7.G.A.3)."}
retires: []
covered_by: []
dropped: []
notes: "No reserved id in existing_ids.txt is owned by G3, so none was used or retired. Every input component is cited by at least one written node; nothing went to covered_by or dropped. (1) Input error: the 7.G.B.5 record repeats 4fa7e2b4 and 851942b6, which are slicing components; they are cited by the 7.G.A.3 cross-section nodes. (2) Partial overlaps with written nodes, where only the missing part was written: area.polygon.decompose extends area.rectilinear.decompose (adds triangles and non-rectilinear polygons); angle.unknown.equation.write extends angle.unknown.equation (measures as expressions in x, and the supplementary, complementary, vertical and straight-line relationships); one-step unknown-angle cases are covered by angle.unknown.equation, angle.unknown-part and equation.unknown.addition, so angle.unknown.equation.solve is two-step only (p x + q = r; it will need E2's linear-equation node); volume.composite.right-prisms extends volume.composite.two-prisms to non-rectangular prisms; the volume.prism.fraction-edges.* nodes extend volume.prism.formula.lwh.apply and volume.prism.formula.base-height.apply to fractional edges, and multiplication.array-area.fraction-sides.* is the two-dimensional analogue of the packing node. (3) Range splits: surface area with rectangles only vs with triangular faces; horizontal/vertical segment length with same-sign vs opposite-sign coordinates (absolute value difference vs sum); rectangular vs non-rectangular prism volume; unknown angles needing one-step vs two-step equations. (4) Informal before formal: triangle.three-angles uses the 180-degree angle sum as noticed by drawing; the formal fact and its argument belong to the 8.G.A.5 strand. cross-section.pyramid.parallel-to-base uses 'same shape, smaller' informally; similarity is G4 (geometry.similar-triangles). (5) scale-drawing.area.scale-factor-squared has no lc: it is a second route for f75552e4 next to scale-drawing.actual-area; drop it if the reviewer prefers. (6) circle.area.derive-from-circumference is level 4 although the standard calls it informal, because the argument holds for every circle. (7) Known weaknesses a reviewer may want to tighten: triangle.conditions.classify step 2 does not catch the two-sides-and-a-non-included-angle case with no triangle (the side opposite the angle too short to reach the other ray); only step 3's attempt to draw catches it. coordinate-plane.polygon.missing-vertex has a correct but clumsy procedure; a simpler equivalent is that the missing vertex takes the first coordinate that occurs only once among the three known vertices, and likewise the second. (8) Not written: freehand and technology routes of 7.G.A.2; quadrilateral constructions (the component's examples are side lengths, angles and radius/diameter, covered by the triangle and circle construction nodes); slices of cylinders and cones (the general components 4fa7e2b4 and 851942b6 cite the prism and pyramid nodes, since the standard names those solids); the angle-angle-side condition (it reduces to two-angles-included-side through the angle sum). (9) area.application.polygon cites both the polygon and the quadrilateral real-world components of 6.G.A.1 and the composite-figure real-world component of 7.G.B.6; they share one problem class. (10) circle.area.formula writes pi x r^2 and spells it as pi x r x r; whole-number exponent notation is E1's. (11) height.base-height is a new concept node that the triangle and parallelogram formula nodes and the decomposition nodes will need; perpendicular.meaning is its likely prerequisite."
