new_concepts:
  - {concept: exponent, facet: whole-number-power, reason: "Exponent rules for positive whole-number exponents, which follow from counting factors and come before zero and negative exponents are defined (E1 may propose the same facet for 6.EE.A.1 evaluation)."}
  - {concept: exponent, facet: integer-power, reason: "Zero and negative exponents and the exponent properties extended to all integer exponents; needs the definitions a^0 = 1 and a^(-n) = 1/a^n, which the whole-number facet does not."}
  - {concept: root, facet: square, reason: "Square roots: sqrt(p) as the non-negative number whose square is p, evaluation, solutions of x^2 = p, and the irrationality of sqrt(2)."}
  - {concept: root, facet: cube, reason: "Cube roots: the number whose cube is p, evaluation, and the single solution of x^3 = p."}
  - {concept: scientific-notation, facet: core, reason: "Numbers written as a x 10^n with 1 <= a < 10; conversion, estimation, comparison, operations, unit choice, calculator display."}
  - {concept: equation, facet: linear-one-variable, reason: "Solving linear equations in one variable beyond two-step, and the number of solutions (one, none, infinitely many)."}
  - {concept: equation, facet: two-variable, reason: "The graph of an equation in x and y as the set of its solution pairs, needed for systems."}
  - {concept: linear-system, facet: algebraic, reason: "A system of two linear equations in two variables read as two conditions a pair must meet at once; inspection, substitution, elimination, applications."}
  - {concept: linear-system, facet: graphical, reason: "A system read as two lines; solutions as intersection points, reading and estimating from graphs, counting solutions from slopes."}
  - {concept: functions, facet: rule, reason: "A function as a rule assigning exactly one output to each input (matches the reserved id functions.definition)."}
  - {concept: functions, facet: graph, reason: "A function as its graph, the set of (input, output) points."}
  - {concept: functions, facet: covariation, reason: "A function as the way one quantity changes with another, read and sketched qualitatively from graphs."}
