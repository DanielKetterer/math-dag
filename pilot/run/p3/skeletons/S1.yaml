- id: statistical-question.recognize
  concept: statistical-question
  facet: core
  level: 2
  type: concept
  name: "Recognize a statistical question"
  statement: "A statistical question is one answered by collecting data that are expected to vary, with an answer that describes that variation; a question with one fixed answer is not statistical, even when it is about a group."
  assess: "Which of these are statistical questions? (a) How tall is the classroom door? (b) How many hours did each student in this class sleep last night? (c) How many students are in this class? (d) How old are the students in this school?"
  sources:
    ccss: ["6.SP.A.1"]
    lc: ["3fd3c652"]
  strand: S1
- id: distribution.describe
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: "Describe a distribution by its center, spread, and shape"
  statement: "The values of a numerical data set collected to answer a statistical question form a distribution, described informally by where its values center, how far they spread, and its overall shape."
  assess: "A dot plot shows the number of books each of 13 students read last month: 1 dot above 1, 3 dots above 2, 5 dots above 3, 3 dots above 4, and 1 dot above 5. Describe where the data center, how far they spread, and the overall shape."
  sources:
    ccss: ["6.SP.A.2"]
    lc: ["ee7501cd"]
  strand: S1
- id: distribution.shape.symmetric-skewed
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: "Symmetric and skewed distributions"
  statement: "A distribution is symmetric when its two sides about the center are close to mirror images, skewed right when its values trail off in a long tail toward larger values, and skewed left when they trail off in a long tail toward smaller values."
  assess: "Three dot plots use a scale from 0 to 10. Plot A has most dots at 1 to 3 and a few stretching out to 9. Plot B has most dots at 7 to 9 and a few stretching down to 1. Plot C has its dots piled around 5 and falling off equally on both sides. Name the shape of each: symmetric, skewed left, or skewed right."
  sources:
    ccss: ["6.SP.A.2"]
    lc: ["24b6a84f"]
  strand: S1
- id: center.meaning
  concept: center
  facet: core
  level: 2
  type: concept
  name: "A measure of center summarizes a data set with one number"
  statement: "A measure of center is a single number that summarizes all the values of a numerical data set as one typical value."
  assess: "Test scores: 70, 75, 80, 80, 95. Lee says 'a typical score is about 80.' Kim says 'the scores go from 70 to 95.' Raj says 'the scores are spread over 25 points.' Whose statement gives a measure of center? Why are the other two not measures of center?"
  sources:
    ccss: ["6.SP.A.3"]
    lc: ["26d22200"]
  strand: S1
- id: variability.meaning
  concept: variability
  facet: core
  level: 2
  type: concept
  name: "A measure of variation describes spread with one number"
  statement: "A measure of variation is a single number that describes how much the values of a numerical data set differ from one another; it is 0 when all the values are equal and larger when the values are more spread out."
  assess: "Data set A is 5, 5, 5, 5. Data set B is 1, 3, 7, 9. Both have a typical value of 5. Which data set should have the larger measure of variation? What should the measure of variation of A be?"
  sources:
    ccss: ["6.SP.A.3"]
    lc: ["d6f0d3bc"]
  strand: S1
- id: data.dot-plot.read
  concept: data
  facet: line-plot
  level: 2
  type: representation
  name: "Read the data set from a dot plot"
  statement: "A dot plot (line plot) shows a numerical data set on a number line with one dot above a value for each time the value occurs, so the full list of values can be read back from it."
  assess: "A dot plot on a number line from 0 to 6 has 2 dots above 1, 1 dot above 3, and 3 dots above 4. List every value in the data set."
  sources:
    ccss: ["6.SP.B.4"]
    lc: ["b274f357", "1525b97c"]
  strand: S1
- id: data.histogram.make
  concept: data
  facet: histogram
  level: 2
  type: representation
  name: "Make a histogram from a numerical data set"
  statement: "A histogram groups numerical data into equal-width intervals along a number line and draws over each interval a bar, with no gaps between adjacent bars, whose height is the number of values in that interval."
  procedure:
  - "Choose equal-width intervals that together cover all the values, such as 10 to under 20 and 20 to under 30."
  - "Count the values in each interval; a value on a boundary goes in the interval that starts there."
  - "Draw a number line marked at the interval boundaries and a vertical scale for the counts."
  - "Draw a bar over each interval up to its count, with no gaps between adjacent intervals."
  assess: "Ages of 10 people: 12, 15, 21, 23, 24, 30, 31, 38, 39, 45. Make a histogram with the intervals 10 to under 20, 20 to under 30, 30 to under 40, and 40 to under 50."
  sources:
    ccss: ["6.SP.B.4"]
    lc: ["a8fd1516"]
  strand: S1
- id: data.histogram.read
  concept: data
  facet: histogram
  level: 2
  type: representation
  name: "Read interval counts from a histogram"
  statement: "Each bar of a histogram gives how many data values lie in its interval; a histogram does not show the individual values, so exact values cannot be read from it."
  assess: "A histogram of ages has a bar of height 3 over 10 to under 20, a bar of height 5 over 20 to under 30, and a bar of height 2 over 30 to under 40. How many people are 20 to under 30 years old? Can you tell from the histogram how many people are exactly 25?"
  sources:
    ccss: ["6.SP.B.4"]
    lc: ["a5b32d92"]
  strand: S1
- id: data.box-plot.make
  concept: data
  facet: box-plot
  level: 2
  type: representation
  name: "Draw a box plot from a five-number summary"
  statement: "A box plot shows the five-number summary of a numerical data set on a number line: a box from the lower quartile to the upper quartile with a line across it at the median, and whiskers from the box out to the minimum and to the maximum."
  procedure:
  - "Draw a number line whose scale covers the minimum and the maximum."
  - "Mark the minimum, lower quartile, median, upper quartile, and maximum above the line."
  - "Draw a box from the lower quartile to the upper quartile and a segment across the box at the median."
  - "Draw a whisker from the lower quartile out to the minimum and one from the upper quartile out to the maximum."
  assess: "A data set has minimum 2, lower quartile 5, median 7, upper quartile 10, and maximum 15. Draw its box plot on a number line from 0 to 16."
  sources:
    ccss: ["6.SP.B.4"]
    lc: ["b81144de"]
  strand: S1
- id: data.box-plot.read
  concept: data
  facet: box-plot
  level: 2
  type: representation
  name: "Read the five-number summary from a box plot"
  statement: "On a box plot, the minimum and maximum are read at the ends of the whiskers, the lower and upper quartiles at the ends of the box, and the median at the line inside the box."
  assess: "A box plot on a number line from 0 to 20 has whiskers reaching 2 and 18, a box from 6 to 12, and a line inside the box at 9. Give the minimum, lower quartile, median, upper quartile, and maximum."
  sources:
    ccss: ["6.SP.B.4"]
    lc: ["8bf02e1b"]
  strand: S1
- id: data.observations.count
  concept: data
  facet: measurement
  level: 2
  type: concept
  name: "The number of observations in a data set"
  statement: "The number of observations in a data set is the number of values recorded, one for each individual measured, so a value that occurs several times is counted each time it occurs."
  assess: "Students reported how many pets they own: 0, 1, 0, 2, 0, 1, 5, 0, 1. Ana says there are 4 observations because there are 4 different values. How many observations are there, and what does each one record?"
  sources:
    ccss: ["6.SP.B.5.a"]
    lc: ["64c60862"]
  strand: S1
- id: data.attribute.describe
  concept: data
  facet: measurement
  level: 2
  type: concept
  name: "Describe the attribute a numerical data set measures"
  statement: "Summarizing a numerical data set in context includes naming the attribute measured on each individual, how it was measured, and its unit of measurement."
  assess: "Each student in a class timed the trip to school with a phone, from leaving home to arriving at school, and reported the result: 12, 25, 8, 15, 30. What attribute was measured, how was it measured, and in what unit?"
  sources:
    ccss: ["6.SP.B.5.b"]
    lc: ["6c56f94a"]
  strand: S1
- id: center.mean.compute
  concept: center
  facet: mean
  level: 3
  type: procedure
  name: "Find the mean of a numerical data set"
  statement: "The mean of a numerical data set is the sum of its values divided by the number of values."
  procedure:
  - "Add all the values in the data set, counting repeated values each time."
  - "Count the number of values."
  - "Divide the sum by the number of values."
  assess: "Find the mean of 4, 7, 7, 10, 12."
  sources:
    ccss: ["6.SP.B.5.c"]
    lc: ["2ad87414"]
  strand: S1
- id: center.median.find
  concept: center
  facet: median
  level: 3
  type: procedure
  name: "Find the median of a numerical data set"
  statement: "The median of a numerical data set is the middle value when the values are listed in order; when there is an even number of values, it is the number halfway between the two middle values."
  procedure:
  - "List the values in order from least to greatest, keeping repeated values."
  - "If the number of values is odd, the median is the middle value of the list."
  - "If the number of values is even, the median is the number halfway between the two middle values."
  assess: "Find the median of 9, 3, 7, 12, 5, 10."
  sources:
    ccss: ["6.SP.B.5.c"]
    lc: ["2ad87414"]
  strand: S1
- id: variability.quartiles.find
  concept: variability
  facet: iqr
  level: 3
  type: procedure
  name: "Find the quartiles of a numerical data set"
  statement: "The lower quartile is the median of the lower half of the ordered data and the upper quartile is the median of the upper half, where the halves are the values before and after the median's position in the ordered list (the median itself is left out of both halves when the number of values is odd)."
  procedure:
  - "List the values in order and find the median."
  - "Form the lower half from the values before the median's position, leaving out the median itself when the number of values is odd."
  - "Form the upper half from the values after the median's position in the same way."
  - "The lower quartile is the median of the lower half; the upper quartile is the median of the upper half."
  assess: "Find the lower quartile and the upper quartile of 1, 3, 5, 6, 8, 9, 11, 13, 14."
  sources:
    ccss: ["6.SP.B.4", "6.SP.B.5.c"]
    lc: ["3280abf4"]
  strand: S1
- id: variability.iqr.compute
  concept: variability
  facet: iqr
  level: 3
  type: procedure
  name: "Find the interquartile range"
  statement: "The interquartile range (IQR) of a numerical data set is the upper quartile minus the lower quartile, the length of the interval that holds the middle half of the ordered data."
  procedure:
  - "Find the lower quartile and the upper quartile."
  - "Subtract the lower quartile from the upper quartile."
  assess: "A data set has minimum 4, lower quartile 12, median 15, upper quartile 20, and maximum 31. Find its interquartile range."
  sources:
    ccss: ["6.SP.B.5.c"]
    lc: ["3280abf4"]
  strand: S1
- id: variability.mad.compute
  concept: variability
  facet: mad
  level: 3
  type: procedure
  name: "Find the mean absolute deviation"
  statement: "The mean absolute deviation (MAD) of a numerical data set is the mean of the distances of its values from the mean of the data set."
  procedure:
  - "Find the mean of the data set."
  - "For each value, find its distance from the mean (the larger of the two numbers minus the smaller)."
  - "Find the mean of these distances."
  assess: "Find the mean absolute deviation of 2, 4, 6, 8. (The mean is 5.)"
  sources:
    ccss: ["6.SP.B.5.c"]
    lc: ["3280abf4"]
  strand: S1
- id: distribution.pattern-deviations
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: "Describe the overall pattern and striking deviations in context"
  statement: "Summarizing a numerical data set includes describing its overall pattern (where most values lie, clusters, gaps) and any values that depart strikingly from that pattern, with a possible reason for the departure drawn from how and where the data were gathered."
  assess: "Minutes that 10 students spent on homework last night: 25, 30, 30, 35, 35, 35, 40, 40, 45, 150. Describe the overall pattern, name the value that departs from it, and give a reason from the situation that could explain it."
  sources:
    ccss: ["6.SP.B.5.c"]
    lc: ["dc8ffe80"]
  strand: S1
- id: center.mean-median.outlier-effect
  concept: center
  facet: core
  level: 2
  type: concept
  name: "An extreme value pulls the mean but barely moves the median"
  statement: "Changing one value to an extreme value pulls the mean toward it, because every value enters the sum, but changes the median little or not at all, because the median depends only on the middle position of the ordered values."
  assess: "The data set 2, 3, 4, 5, 6 has mean 4 and median 4. If the 6 is replaced by 56, which changes a lot, the mean or the median? Explain without computing."
  sources:
    ccss: ["6.SP.B.5.d"]
    lc: ["8f6aea95"]
  strand: S1
- id: center.choose
  concept: center
  facet: core
  level: 3
  type: concept
  name: "Choose the mean or the median to fit the distribution"
  statement: "For a roughly symmetric distribution without outliers the mean and median are close and the mean is a good summary of a typical value; for a strongly skewed distribution or one with outliers the median better describes a typical value."
  assess: "Prices in thousands of dollars of the 7 houses on a street: 200, 210, 215, 220, 225, 230, 900. The mean is about 314 and the median is 220. Which better describes the price of a typical house on this street, and why?"
  sources:
    ccss: ["6.SP.B.5.d"]
    lc: ["8f6aea95"]
  strand: S1
- id: variability.choose
  concept: variability
  facet: core
  level: 3
  type: concept
  name: "Choose the IQR or the MAD to fit the distribution"
  statement: "For a strongly skewed distribution or one with outliers the IQR, reported with the median, describes variability better, because extreme values inflate the MAD; for a roughly symmetric distribution without outliers the MAD, reported with the mean, is a good summary."
  assess: "Commute times for 30 workers are strongly skewed right, with three commutes much longer than the rest. Should you report the IQR or the MAD as the measure of variability? Why?"
  sources:
    ccss: ["6.SP.B.5.d"]
    lc: ["5b18f52e"]
  strand: S1
- id: variability.mad.interpret
  concept: variability
  facet: mad
  level: 2
  type: concept
  name: "Interpret the mean absolute deviation"
  statement: "The MAD of a data set is the typical distance of its values from the mean, in the units of the data: a small MAD means the values lie close to the mean and a larger MAD means they lie farther from it."
  assess: "Class A's reading times have mean 30 minutes and MAD 2 minutes. Class B's have mean 30 minutes and MAD 9 minutes. What do the two MADs tell you about the reading times in each class?"
  sources:
    ccss: ["7.SP.B.3"]
    lc: ["a6f3f96d"]
  strand: S1
- id: sampling.population-sample.meaning
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: "Population and sample"
  statement: "The population is the whole group a statistical question is about; a sample is the part of the population from which data are actually collected, in order to learn about the population."
  assess: "To find out how many hours the 900 students at a school sleep on a school night, Mia asks 50 of them. What is the population? What is the sample?"
  sources:
    ccss: ["7.SP.A.1"]
    lc: []
  strand: S1
- id: sampling.representative
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: "A generalization from a sample needs a representative sample"
  statement: "A conclusion about a population drawn from a sample is valid only if the sample is representative, meaning that for the characteristic studied the sample is like the population."
  assess: "To find out how much the students at a school like soccer, Ben surveys the members of the school soccer team. Can he use his results to describe all the students at the school? Why or why not?"
  sources:
    ccss: ["7.SP.A.1"]
    lc: ["3b3c207c"]
  strand: S1
- id: sampling.random.meaning
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: "A random sample gives every member the same chance"
  statement: "A random sample is chosen so that every member of the population has the same chance of being selected."
  assess: "Which of these ways of choosing 30 students give every student at the school the same chance of being chosen? (a) the first 30 students to arrive in the morning; (b) 30 names drawn from a bag holding one slip for every student; (c) 30 volunteers; (d) the 30 students in the art club."
  sources:
    ccss: ["7.SP.A.1"]
    lc: []
  strand: S1
- id: sampling.random.representative
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: "Random sampling tends to produce representative samples"
  statement: "Because no part of the population is favored, random sampling tends to produce representative samples and so supports valid conclusions about the population, although any single random sample can still differ from the population by chance."
  assess: "Kai says a random sample of 30 students is guaranteed to match the whole school exactly. Lia says random sampling only tends to give a sample like the school. Who is right, and why does choosing at random help?"
  sources:
    ccss: ["7.SP.A.1"]
    lc: ["f26b664c"]
  strand: S1
- id: sampling.variability.meaning
  concept: sampling
  facet: core
  level: 2
  type: concept
  name: "Sample statistics estimate population statistics and vary from sample to sample"
  statement: "A statistic computed from a sample, such as a sample mean or a sample proportion, estimates the matching population statistic but is usually not equal to it, and different samples of the same size usually give different values."
  assess: "The mean height of all 600 students in a school is 152 cm. Ana's random sample of 20 students has mean height 150 cm and Tom's random sample of 20 students has mean height 155 cm. Did either of them make a mistake? Explain."
  sources:
    ccss: ["7.SP.A.2"]
    lc: ["78dd8689"]
  strand: S1
- id: sampling.variability.simulate.numerical
  concept: sampling
  facet: core
  level: 2
  type: procedure
  name: "Gauge the error of a sample mean from several samples"
  statement: "Draw several random samples (or simulated samples) of the same size from the same population of numerical data, compute the mean of each, and use how far the sample means spread to judge how far an estimate from one sample might be from the population mean."
  procedure:
  - "Draw several random samples of the same size from the population, or simulate them."
  - "Compute the mean of each sample."
  - "Note the least and greatest sample means and how far apart they are."
  - "Use that spread to say about how far one sample mean might be from the population mean."
  assess: "Lin drew 4 random samples of 10 words each from a book. The sample mean word lengths were 4.1, 4.8, 4.4, and 4.7 letters. About how far off might an estimate of the book's mean word length from one sample of 10 words be?"
  sources:
    ccss: ["7.SP.A.2"]
    lc: ["8cf753cf", "67bdbbc4"]
  strand: S1
- id: sampling.variability.simulate.categorical
  concept: sampling
  facet: core
  level: 2
  type: procedure
  name: "Gauge the error of a sample proportion from several samples"
  statement: "Draw several random samples (or simulated samples) of the same size from the same population of categorical data, find the proportion in the category of interest in each, and use how far the sample proportions spread to judge how far an estimate from one sample might be from the population proportion."
  procedure:
  - "Draw several random samples of the same size from the population, or simulate them."
  - "In each sample, find the fraction of members in the category of interest."
  - "Note the least and greatest sample proportions and how far apart they are."
  - "Use that spread to say about how far one sample proportion might be from the population proportion."
  assess: "Four random samples of 20 voters each were asked whether they will vote for Candidate A. The numbers saying yes were 11, 13, 9, and 12. About how far off might an estimate of Candidate A's share of all voters from one sample of 20 be?"
  sources:
    ccss: ["7.SP.A.2"]
    lc: ["6f445725", "67bdbbc4"]
  strand: S1
- id: inference.estimate.population-mean
  concept: inference
  facet: estimate
  level: 3
  type: application
  name: "Estimate a population mean from a random sample"
  statement: "When the data come from a random sample, the sample mean is used as an estimate of the unknown mean of the population."
  assess: "A random sample of 5 words from a book has word lengths 3, 5, 4, 6, and 7 letters. Estimate the mean word length of all the words in the book."
  sources:
    ccss: ["7.SP.A.2"]
    lc: ["c5ae0dd5"]
  strand: S1
- id: inference.estimate.population-proportion
  concept: inference
  facet: estimate
  level: 3
  type: application
  name: "Estimate a population proportion from a random sample"
  statement: "When categorical data come from a random sample, the fraction of the sample in a category is used as an estimate of the unknown fraction of the population in that category."
  assess: "In a random sample of 50 students at a school, 30 said they would vote for Maria and 20 said they would vote for Leo. Estimate the fraction of all the students at the school who would vote for Maria."
  sources:
    ccss: ["7.SP.A.2"]
    lc: ["c5ae0dd5"]
  strand: S1
- id: distribution.compare.overlap
  concept: distribution
  facet: core
  level: 2
  type: concept
  name: "Judge the visual overlap of two distributions with similar variability"
  statement: "For two numerical distributions with similar variability shown on the same scale, the less their plots overlap, the larger the difference between their centers is compared with their spread; distributions that barely overlap are clearly separated."
  assess: "Four dot plots share one scale and have about the same spread. Plot A runs from 150 to 170 and plot B from 152 to 172. Plot C runs from 150 to 170 and plot D from 175 to 195. Which pair of plots overlaps more? In which pair are the two groups clearly separated?"
  sources:
    ccss: ["7.SP.B.3"]
    lc: ["5f434177"]
  strand: S1
- id: distribution.compare.center-difference-in-variability
  concept: distribution
  facet: core
  level: 3
  type: procedure
  name: "Express the difference between two centers as a multiple of a measure of variability"
  statement: "For two numerical distributions with similar variability, the difference between their centers is measured in units of that variability by dividing the difference by the common measure of variability (such as the MAD)."
  procedure:
  - "Subtract the smaller center from the larger center."
  - "Divide the difference by the common measure of variability."
  - "Report the result as the number of measures of variability that separate the centers."
  assess: "The mean height of the basketball team is 190 cm and the mean height of the soccer team is 180 cm. The MAD of each team's heights is 5 cm. The difference between the means is how many MADs?"
  sources:
    ccss: ["7.SP.B.3"]
    lc: ["5f41fba8"]
  strand: S1
- id: inference.compare.two-populations
  concept: inference
  facet: comparison
  level: 3
  type: application
  name: "Compare two populations informally from random samples"
  statement: "Given the centers and measures of variability of random samples of numerical data from two populations, decide informally whether the values in one population are generally greater than in the other, judging the difference between the centers against the variability rather than against zero."
  assess: "Random samples of 30 words from two books give these word lengths: Book A has mean 6.5 letters and MAD 1 letter; Book B has mean 4 letters and MAD 1 letter. Are the words in Book A generally longer than the words in Book B? Explain using the means and MADs."
  sources:
    ccss: ["7.SP.B.4"]
    lc: ["60a6523a"]
  strand: S1
- id: probability.likelihood.zero-to-one
  concept: probability
  facet: likelihood
  level: 2
  type: concept
  name: "A probability is a number from 0 to 1"
  statement: "The probability of a chance event is a number from 0 to 1 that expresses how likely the event is: 0 for an impossible event, 1 for a certain event, and larger numbers for more likely events."
  assess: "Which of these numbers could be the probability of an event: 0.7, 4/3, 0, -0.2, 1, 1/5?"
  sources:
    ccss: ["7.SP.C.5"]
    lc: ["96be5b29"]
  strand: S1
- id: probability.likelihood.interpret
  concept: probability
  facet: likelihood
  level: 2
  type: concept
  name: "Interpret a probability as unlikely, neither, or likely"
  statement: "A probability near 0 describes an unlikely event, a probability around 1/2 an event that is neither unlikely nor likely, and a probability near 1 a likely event; of two events, the one with the larger probability is the more likely."
  assess: "The probability of rain tomorrow is 0.9, the probability of snow is 0.05, and the probability a tossed coin lands heads is 1/2. Describe each event as unlikely, neither unlikely nor likely, or likely. Which of the three is most likely?"
  sources:
    ccss: ["7.SP.C.5"]
    lc: ["f9c7d91a"]
  strand: S1
- id: probability.relative-frequency.estimate
  concept: probability
  facet: relative-frequency
  level: 2
  type: procedure
  name: "Estimate a probability by the relative frequency over many trials"
  statement: "The probability of a chance event is approximated by its relative frequency after many trials of the chance process: the number of trials in which the event occurred divided by the number of trials."
  procedure:
  - "Repeat the chance process many times and record whether the event occurs in each trial."
  - "Count the trials in which the event occurred."
  - "Divide that count by the number of trials."
  assess: "A thumbtack was tossed 200 times and landed point up 120 times. Estimate the probability that the thumbtack lands point up."
  sources:
    ccss: ["7.SP.C.6"]
    lc: []
  strand: S1
- id: probability.relative-frequency.more-trials
  concept: probability
  facet: relative-frequency
  level: 2
  type: concept
  name: "More trials give a more reliable probability estimate"
  statement: "As the number of trials of a chance process grows, the relative frequency of an event tends to get closer to its probability; with few trials it can be far from the probability."
  assess: "Ana tossed a paper cup 10 times and Ben tossed the same cup 500 times, each to estimate the probability that it lands on its side. Their estimates differ. Whose estimate is more likely to be close to the actual probability, and why?"
  sources:
    ccss: ["7.SP.C.6"]
    lc: ["5069fa38"]
  strand: S1
- id: probability.relative-frequency.predict-count
  concept: probability
  facet: relative-frequency
  level: 3
  type: procedure
  name: "Predict about how often an event will occur from its probability"
  statement: "If an event has probability p, then in n trials it is expected to occur about p x n times, and the actual number will usually be close to p x n but not exactly equal to it."
  assess: "The probability of rolling a 3 or a 6 on a number cube is 1/3. In 600 rolls, about how many times would you expect a 3 or a 6? Would you expect exactly that many?"
  sources:
    ccss: ["7.SP.C.6"]
    lc: ["0abcb12c"]
  strand: S1
- id: probability.model.uniform.develop
  concept: probability
  facet: equally-likely
  level: 2
  type: concept
  name: "Develop a uniform probability model"
  statement: "When the outcomes of a chance process are equally likely, a uniform probability model lists all n possible outcomes and assigns each one the probability 1/n."
  assess: "Spinner 1 has 5 equal sections labeled A, B, C, D, E. List the outcomes of one spin and give the probability of each. Spinner 2 has 3 sections, one of which is half of the circle. Would a uniform model fit spinner 2? Why or why not?"
  sources:
    ccss: ["7.SP.C.7.a"]
    lc: ["7752d0b0"]
  strand: S1
- id: probability.model.uniform.event
  concept: probability
  facet: equally-likely
  level: 3
  type: procedure
  name: "Find the probability of an event in a uniform model"
  statement: "In a uniform probability model, the probability of an event is the number of outcomes in the event divided by the total number of outcomes."
  procedure:
  - "Count the total number of equally likely outcomes."
  - "Count the outcomes that make up the event."
  - "Divide the number of outcomes in the event by the total number of outcomes."
  assess: "A student is selected at random from a class of 12 girls and 13 boys. What is the probability that a girl is selected?"
  sources:
    ccss: ["7.SP.C.7.a"]
    lc: ["f578a7d0"]
  strand: S1
- id: probability.model.from-frequencies
  concept: probability
  facet: relative-frequency
  level: 2
  type: procedure
  name: "Develop a probability model from observed frequencies"
  statement: "A probability model, which need not be uniform, is developed from data on a chance process by assigning each outcome its observed relative frequency; comparing these values shows whether the outcomes appear equally likely."
  procedure:
  - "Record how many times each outcome occurred in many trials."
  - "Divide each count by the total number of trials to get each outcome's relative frequency."
  - "Assign each outcome its relative frequency as its approximate probability."
  - "Compare the probabilities to judge whether the outcomes appear equally likely."
  assess: "A paper cup was tossed 100 times. It landed on its side 70 times, open end up 20 times, and open end down 10 times. Give an approximate probability for each outcome. Do the three outcomes appear equally likely?"
  sources:
    ccss: ["7.SP.C.7.b"]
    lc: ["ea0959ab"]
  strand: S1
- id: probability.model.nonuniform.event
  concept: probability
  facet: model
  level: 3
  type: procedure
  name: "Find the probability of an event in a model whose outcomes are not equally likely"
  statement: "When a probability model gives outcomes different probabilities, the probability of an event is the sum of the probabilities of the outcomes that make it up, not the number of those outcomes divided by the number of outcomes."
  procedure:
  - "List the outcomes that make up the event."
  - "Read the probability of each of those outcomes from the model."
  - "Add those probabilities."
  assess: "A spinner's model gives P(red) = 0.5, P(blue) = 0.3, and P(green) = 0.2. What is the probability that the spinner lands on red or green?"
  sources:
    ccss: ["7.SP.C.7.b"]
    lc: ["25cdf64d"]
  strand: S1
- id: probability.sample-space.list
  concept: probability
  facet: equally-likely
  level: 2
  type: representation
  name: "Represent the sample space of a compound event with an organized list"
  statement: "The sample space of a compound event is the set of all possible combinations of outcomes of its stages; an organized list records every combination once by fixing the outcome of the first stage and running through all outcomes of the later stages before changing it."
  assess: "A spinner with equal sections labeled 1, 2, and 3 is spun twice. Make an organized list of all possible outcomes."
  sources:
    ccss: ["7.SP.C.8.b"]
    lc: ["2ee8400d"]
  strand: S1
- id: probability.sample-space.table
  concept: probability
  facet: equally-likely
  level: 2
  type: representation
  name: "Represent the sample space of a two-stage compound event with a table"
  statement: "For a compound event with two stages, a table whose rows are the outcomes of the first stage and whose columns are the outcomes of the second stage has one cell for each outcome in the sample space."
  assess: "A coin is tossed and a number cube is rolled. Make a table that shows every possible outcome."
  sources:
    ccss: ["7.SP.C.8.b"]
    lc: ["8eb843cd", "2ee8400d"]
  strand: S1
- id: probability.sample-space.tree
  concept: probability
  facet: equally-likely
  level: 2
  type: representation
  name: "Represent the sample space of a compound event with a tree diagram"
  statement: "A tree diagram for a compound event branches once for each outcome of the first stage and then, from the end of every branch, once for each outcome of the next stage; each path from the start to the end of a last branch is one outcome in the sample space."
  assess: "A coin is tossed three times. Draw a tree diagram that shows every possible outcome."
  sources:
    ccss: ["7.SP.C.8.b"]
    lc: ["2ee8400d"]
  strand: S1
- id: probability.compound.event-outcomes
  concept: probability
  facet: equally-likely
  level: 2
  type: procedure
  name: "Identify the outcomes that make up a compound event"
  statement: "For a compound event described in everyday language, the outcomes that make it up are exactly the outcomes in the sample space for which the description is true."
  procedure:
  - "Write or read the full sample space."
  - "Check each outcome against the description of the event."
  - "List the outcomes for which the description is true."
  assess: "Two number cubes are rolled. The sample space is the 36 ordered pairs (first cube, second cube), shown in a 6-by-6 table. List all the outcomes that make up the event 'at least one cube shows a 6'."
  sources:
    ccss: ["7.SP.C.8.b"]
    lc: ["e7cdb75c"]
  strand: S1
- id: probability.compound.fraction-of-outcomes
  concept: probability
  facet: equally-likely
  level: 3
  type: concept
  name: "The probability of a compound event as a fraction of the sample space"
  statement: "When the outcomes in the sample space of a compound event are equally likely, the probability of the event is the number of outcomes in which it occurs divided by the number of outcomes in the sample space, just as for a simple event."
  assess: "Two fair coins are tossed. The sample space is HH, HT, TH, TT. Sam says the probability of exactly one head is 1/3, because the result can be 0 heads, 1 head, or 2 heads. What is the probability of exactly one head, and what is wrong with Sam's reasoning?"
  sources:
    ccss: ["7.SP.C.8.a"]
    lc: ["d4d78b01"]
  strand: S1
- id: probability.simulation.design
  concept: probability
  facet: relative-frequency
  level: 2
  type: procedure
  name: "Design a simulation for a compound event"
  statement: "A simulation for a compound event uses a random device whose outcomes have the same probabilities as each stage of the real process, and states what one trial is and how to tell from a trial whether the event occurred."
  procedure:
  - "Choose a random device, such as random digits, a spinner, or a number cube, and assign its outcomes so that each stage's outcomes have the right probabilities."
  - "Define one trial as the sequence of draws that plays out the whole compound process once."
  - "State the rule that decides from a trial's draws whether the event occurred."
  assess: "40% of blood donors have type A blood. Design a simulation with random digits 0 to 9 for finding donors one at a time until one has type A blood. Say which digits stand for type A, what one trial is, and how to tell whether a trial needed at least 4 donors."
  sources:
    ccss: ["7.SP.C.8.c"]
    lc: ["eefa37d0"]
  strand: S1
- id: probability.simulation.use
  concept: probability
  facet: relative-frequency
  level: 2
  type: procedure
  name: "Estimate the probability of a compound event from simulation results"
  statement: "Given the results of a simulation and its rule for when the compound event occurs, decide for each trial whether the event occurred and estimate the probability as the fraction of trials in which it did."
  procedure:
  - "For each trial, apply the rule to decide whether the compound event occurred."
  - "Count the trials in which the event occurred."
  - "Divide that count by the number of trials."
  assess: "In a simulation, digits 0 to 3 stand for a donor with type A blood and digits 4 to 9 for a donor without; each trial reads digits until the first 0 to 3. Ten trials gave: 2, 71, 9550, 861, 0, 47943, 3, 52, 6681, 91. Estimate the probability that at least 4 donors are needed to find one with type A blood."
  sources:
    ccss: ["7.SP.C.8.c"]
    lc: ["88b14085"]
  strand: S1
- id: data.scatter-plot.make
  concept: data
  facet: scatter-plot
  level: 2
  type: representation
  name: "Make a scatter plot of bivariate measurement data"
  statement: "A scatter plot shows data on two quantities measured on the same individuals by plotting, for each individual, the point whose coordinates are its two values, one variable on each axis, without connecting the points."
  procedure:
  - "Choose which variable goes on the horizontal axis and which on the vertical axis."
  - "Scale each axis to cover the range of that variable's values."
  - "For each individual, plot the point (first value, second value)."
  assess: "Make a scatter plot of hours studied (x) and test score (y) for six students: (1, 60), (2, 65), (3, 70), (4, 72), (5, 80), (6, 85)."
  sources:
    ccss: ["8.SP.A.1"]
    lc: ["cb4fa2a9"]
  strand: S1
- id: association.numerical.direction
  concept: association
  facet: numerical
  level: 2
  type: concept
  name: "Positive, negative, and no association in a scatter plot"
  statement: "Two quantities have a positive association when larger values of one tend to go with larger values of the other, a negative association when larger values of one tend to go with smaller values of the other, and no association when there is no such tendency; a tendency allows individual exceptions."
  assess: "In a scatter plot of hours of practice (x) and free throws missed (y) for 20 players, the points fall from the upper left to the lower right, though a few players who practiced more missed more than some who practiced less. Is the association positive, negative, or none? What does it say about practice and missed free throws?"
  sources:
    ccss: ["8.SP.A.1"]
    lc: ["bfb3223b", "f333277a"]
  strand: S1
- id: association.numerical.form
  concept: association
  facet: numerical
  level: 2
  type: concept
  name: "Linear and nonlinear association"
  statement: "An association shown in a scatter plot is linear when the points lie roughly along a straight line and nonlinear when they follow a curve."
  assess: "Data set A: (1, 3), (2, 5), (3, 6), (4, 9), (5, 11). Data set B: (0, 9), (1, 4), (2, 1), (3, 0), (4, 1), (5, 4), (6, 9). Plot each. Which shows a linear association and which a nonlinear association?"
  sources:
    ccss: ["8.SP.A.1"]
    lc: ["bfb3223b"]
  strand: S1
- id: association.numerical.strength
  concept: association
  facet: numerical
  level: 2
  type: concept
  name: "Strong and weak linear association"
  statement: "A linear association is strong when the points lie close to a line and weak when they are widely scattered about it; strength is separate from direction."
  assess: "Two scatter plots both show a positive linear association. In plot A every point is within 1 unit of a line through the data; in plot B many points are 10 or more units from any line through the data. Which shows the stronger association?"
  sources:
    ccss: ["8.SP.A.1"]
    lc: ["bfb3223b"]
  strand: S1
- id: association.numerical.clusters-outliers
  concept: association
  facet: numerical
  level: 2
  type: concept
  name: "Clusters and outliers in a scatter plot"
  statement: "In a scatter plot, a cluster is a group of points lying close together and separated from the other points by a gap, and an outlier is a point lying far from the overall pattern of the others."
  assess: "A scatter plot shows the points (1, 2), (2, 3), (3, 4), (4, 5), (8, 9), (9, 10), (10, 11), and (5, 15). Name the clusters and the outlier."
  sources:
    ccss: ["8.SP.A.1"]
    lc: ["bfb3223b"]
  strand: S1
- id: linear-function.fitted-line.meaning
  concept: linear-function
  facet: fitted-line
  level: 2
  type: concept
  name: "A straight line can model bivariate data with a linear association"
  statement: "When a scatter plot shows a linear association, a straight line can model the relationship between the two quantities by summarizing their trend; the data points need not lie on the line."
  assess: "A scatter plot of arm span against height for 25 students shows a strong positive linear association, but no straight line passes through all the points. Tom says this means a straight line cannot be used to model the data. Is he right? Explain."
  sources:
    ccss: ["8.SP.A.2"]
    lc: ["1d2c0019"]
  strand: S1
- id: linear-function.fitted-line.fit
  concept: linear-function
  facet: fitted-line
  level: 2
  type: procedure
  name: "Informally fit a straight line to a scatter plot"
  statement: "For a scatter plot that suggests a linear association, draw a straight line that follows the trend of the points, with the points as close to the line as possible and roughly as many above it as below it along its length."
  procedure:
  - "Judge the direction of the trend from the points."
  - "Place a straight edge along the trend so that the points are as close to it as possible."
  - "Adjust it until roughly as many points lie above it as below it, at both ends and in the middle."
  - "Draw the line across the range of the data."
  assess: "Plot the points (1, 3), (2, 4), (3, 6), (4, 6), (5, 8), (6, 9) and draw a straight line that fits the data."
  sources:
    ccss: ["8.SP.A.2"]
    lc: ["bf455cde"]
  strand: S1
- id: linear-function.fitted-line.assess-fit
  concept: linear-function
  facet: fitted-line
  level: 2
  type: concept
  name: "Judge the fit of a line by the closeness of the points to it"
  statement: "A line fits a data set well when the data points lie close to it, with no long run of points all on one side; the farther the points lie from the line, the worse the fit."
  assess: "Two lines are drawn on the same scatter plot. Line A passes above all but one of the points, some by as much as 4 units. Line B passes through the middle of the points, with about half above and half below, each within 1 unit of it. Which line fits the data better? Explain using the distances of the points from the lines."
  sources:
    ccss: ["8.SP.A.2"]
    lc: ["04223c78"]
  strand: S1
- id: linear-function.fitted-line.slope.interpret
  concept: linear-function
  facet: fitted-line
  level: 3
  type: concept
  name: "Interpret the slope of a line fitted to data"
  statement: "The slope of a line fitted to bivariate data is the predicted change in the second quantity for each increase of one unit in the first, in units of the second per unit of the first; it describes the trend of the data, not the exact change for every individual."
  assess: "A line fitted to data on hours of sunlight per day (x) and mature plant height in cm (y) is y = 1.5x + 10. What does the slope 1.5 mean in this context?"
  sources:
    ccss: ["8.SP.A.3"]
    lc: ["68c64407"]
  strand: S1
- id: linear-function.fitted-line.intercept.interpret
  concept: linear-function
  facet: fitted-line
  level: 3
  type: concept
  name: "Interpret the intercept of a line fitted to data"
  statement: "The vertical intercept of a line fitted to bivariate data is the value of the second quantity that the model predicts when the first quantity is 0; the prediction may be meaningless when 0 lies far outside the data."
  assess: "A line fitted to data on hours of sunlight per day (x) and mature plant height in cm (y) is y = 1.5x + 10. What does the intercept 10 mean in this context?"
  sources:
    ccss: ["8.SP.A.3"]
    lc: ["5b2c45c0"]
  strand: S1
- id: linear-function.fitted-line.predict
  concept: linear-function
  facet: fitted-line
  level: 3
  type: application
  name: "Predict a value from the equation of a line fitted to data"
  statement: "Problems that give the equation of a line fitted to bivariate data and a value of the first quantity, and ask for the value of the second quantity that the model predicts; the answer is a prediction from the trend, not an exact value for any individual."
  assess: "A line fitted to data on hours of sunlight per day (x) and mature plant height in cm (y) is y = 1.5x + 10. Predict the mature height of a plant that gets 6 hours of sunlight a day."
  sources:
    ccss: ["8.SP.A.3"]
    lc: ["31ebd1b1"]
  strand: S1
- id: linear-function.fitted-line.solve-for-input
  concept: linear-function
  facet: fitted-line
  level: 3
  type: application
  name: "Find the input a fitted line associates with a given output"
  statement: "Problems that give the equation of a line fitted to bivariate data and a value of the second quantity, and ask for the value of the first quantity that the model associates with it, found by solving the equation for the first quantity."
  assess: "A line fitted to data on hours of sunlight per day (x) and mature plant height in cm (y) is y = 1.5x + 10. According to the model, about how many hours of sunlight a day go with a mature height of 25 cm?"
  sources:
    ccss: ["8.SP.A.3"]
    lc: ["31ebd1b1"]
  strand: S1
- id: table.two-way.construct
  concept: table
  facet: two-way
  level: 2
  type: representation
  name: "Construct a two-way table from data on two categorical variables"
  statement: "A two-way table summarizes data on two categorical variables collected from the same subjects: the categories of one variable label the rows, the categories of the other label the columns, each cell holds the number of subjects in both its row category and its column category, and the row totals, column totals, and grand total are written at the margins."
  procedure:
  - "Label one row for each category of the first variable and one column for each category of the second variable."
  - "For each subject, add one to the cell for that subject's pair of categories."
  - "Add across each row and down each column to write the row and column totals, and add all the cells for the grand total."
  assess: "Ten students answered two questions, 'Do you have a curfew?' and 'Do you have chores?'. Their answers (curfew, chores) were: (yes, yes), (yes, yes), (yes, no), (no, yes), (no, no), (yes, yes), (no, no), (no, yes), (yes, yes), (no, no). Make a two-way table of the counts with row and column totals."
  sources:
    ccss: ["8.SP.A.4"]
    lc: ["412a2d72"]
  strand: S1
- id: table.two-way.interpret
  concept: table
  facet: two-way
  level: 2
  type: concept
  name: "What the cells and totals of a two-way table count"
  statement: "In a two-way table of two categorical variables, a cell counts the subjects that are in both its row category and its column category, a row or column total counts the subjects in that one category whatever their other category, and the grand total counts all the subjects."
  assess: "A two-way table has rows 'curfew: yes' and 'curfew: no' and columns 'chores: yes' and 'chores: no'. Row 'curfew: yes' reads 16, 4, total 20. Row 'curfew: no' reads 6, 14, total 20. The column totals are 22 and 18, and the grand total is 40. What does the 4 mean? What does the column total 22 mean?"
  sources:
    ccss: ["8.SP.A.4"]
    lc: ["bf631804"]
  strand: S1
- id: table.two-way.relative-frequency
  concept: table
  facet: two-way
  level: 3
  type: procedure
  name: "Find row or column relative frequencies in a two-way table"
  statement: "A row relative frequency is a cell count divided by the total of its row, and a column relative frequency is a cell count divided by the total of its column; the row relative frequencies in any one row add to 1, as do the column relative frequencies in any one column."
  procedure:
  - "Choose whether to compare rows or columns."
  - "For rows, divide each cell count by the total of its row; for columns, divide each cell count by the total of its column."
  - "Write each result as a fraction, decimal, or percent."
  assess: "A two-way table has rows 'curfew: yes' (16 with chores, 4 without, total 20) and 'curfew: no' (6 with chores, 14 without, total 20). Find the row relative frequencies for the row 'curfew: yes'."
  sources:
    ccss: ["8.SP.A.4"]
    lc: ["13103f2c"]
  strand: S1
- id: association.categorical.meaning
  concept: association
  facet: categorical
  level: 2
  type: concept
  name: "Association between two categorical variables"
  statement: "Two categorical variables are associated when the relative frequencies of the categories of one variable differ from one category of the other variable to the next; when the row (or column) relative frequencies are about the same in every row (or column), the data show no association, however the raw counts differ."
  assess: "Table A: of 40 students with a curfew, 30 have chores (75%); of 20 students without a curfew, 15 have chores (75%). Table B: of 20 students with a curfew, 16 have chores (80%); of 20 students without a curfew, 6 have chores (30%). Which table shows an association between having a curfew and having chores? Explain."
  sources:
    ccss: ["8.SP.A.4"]
    lc: ["49eb9d6a"]
  strand: S1
- id: association.categorical.describe
  concept: association
  facet: categorical
  level: 3
  type: application
  name: "Use relative frequencies in a two-way table to describe an association"
  statement: "Problems that give a two-way table of counts for two categorical variables and ask whether the data suggest an association, answered by comparing row (or column) relative frequencies and describing the association, if any, in context."
  assess: "Of 30 students with a curfew, 24 have chores and 6 do not. Of 10 students without a curfew, 3 have chores and 7 do not. Is there evidence that students who have a curfew also tend to have chores? Support your answer with relative frequencies."
  sources:
    ccss: ["8.SP.A.4"]
    lc: ["13103f2c"]
  strand: S1
