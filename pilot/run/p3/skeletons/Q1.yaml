- id: division.standard-algorithm.long-division
  concept: division
  facet: base-ten
  level: 3
  type: procedure
  name: "Divide multi-digit whole numbers with the standard algorithm"
  statement: "Divide a multi-digit whole number by a whole number of one or more digits (not greater than the dividend) with the standard long-division algorithm, working from the greatest place of the dividend, to get the whole-number quotient and remainder."
  procedure:
    - "Take the fewest leading digits of the dividend that form a number at least as large as the divisor; this is the current number."
    - "Find the greatest digit q (0 to 9) with q x divisor at most the current number, and write q in the quotient above the last digit used."
    - "Subtract q x divisor from the current number."
    - "If digits of the dividend remain, bring down the next one to the right of the difference to form the new current number, and return to step 2."
    - "When no digits remain, the last difference is the remainder."
  assess: "Use the standard algorithm to divide 9,374 by 26. Give the quotient and the remainder."
  sources: {ccss: ["6.NS.B.2"], lc: ["019a93e7", "fa745fbb"]}
  strand: Q1
- id: decimal.addition.algorithm
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: procedure
  name: "Add multi-digit decimals with the standard algorithm"
  statement: "Add decimals by writing them in columns with the decimal points aligned, so that digits of the same place value share a column, and adding as with whole numbers, regrouping across the decimal point when needed."
  procedure:
    - "Write the numbers in a column with their decimal points lined up (a whole number has its decimal point after the ones digit), writing zeros in empty places on the right if helpful."
    - "Add each column from right to left, regrouping 10 of a place as 1 of the next place to the left."
    - "Place the decimal point in the sum directly below the aligned decimal points."
  assess: "Use the standard algorithm: 27.6 + 4.385."
  sources: {ccss: ["6.NS.B.3"], lc: ["d04b3e78"]}
  strand: Q1
- id: decimal.subtraction.algorithm
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: procedure
  name: "Subtract multi-digit decimals with the standard algorithm"
  statement: "Subtract decimals by writing them in columns with the decimal points aligned, writing zeros so both numbers have the same number of decimal places, and subtracting as with whole numbers, decomposing across the decimal point when needed."
  procedure:
    - "Write the greater number above the smaller with the decimal points lined up (a whole number has its decimal point after the ones digit)."
    - "Write zeros in empty places on the right so both numbers have the same number of decimal places."
    - "Subtract each column from right to left, decomposing 1 of the next place to the left into 10 of this place when a digit is too small."
    - "Place the decimal point in the difference directly below the aligned decimal points."
  assess: "Use the standard algorithm: 15 - 3.72."
  sources: {ccss: ["6.NS.B.3"], lc: ["a58918aa"]}
  strand: Q1
- id: decimal.multiplication.algorithm
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: procedure
  name: "Multiply multi-digit decimals with the standard algorithm"
  statement: "Multiply two decimals by multiplying them as whole numbers, ignoring the decimal points, and then placing the decimal point so that the product has as many decimal places as the two factors have together."
  procedure:
    - "Multiply the factors as whole numbers with the standard algorithm, ignoring the decimal points."
    - "Count the digits to the right of the decimal point in both factors together."
    - "From the right end of the whole-number product, count that many places to the left and place the decimal point there, writing zeros on the left if the product has too few digits."
  assess: "Use the standard algorithm: 3.06 x 0.24."
  sources: {ccss: ["6.NS.B.3"], lc: ["e14eddf0"]}
  strand: Q1
- id: decimal.division.by-whole.algorithm
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: procedure
  name: "Divide a decimal by a whole number with the standard algorithm"
  statement: "Divide a decimal by a whole number with long division, placing the decimal point of the quotient directly above the decimal point of the dividend and writing zeros after the last digit of the dividend to keep dividing."
  procedure:
    - "Set up long division with the decimal dividend and the whole-number divisor."
    - "Place the decimal point in the quotient directly above the decimal point of the dividend."
    - "Divide as with whole numbers, bringing down one digit at a time."
    - "If the digits of the dividend run out and the difference is not 0, write a 0 after the last digit of the dividend and keep dividing, until the difference is 0 or the quotient has the required number of places."
  assess: "Use the standard algorithm: 9.3 divided by 4."
  sources: {ccss: ["6.NS.B.3"], lc: ["0c3f03b8"]}
  strand: Q1
- id: decimal.division.by-decimal.algorithm
  concept: decimal
  facet: decimal-fraction
  level: 3
  type: procedure
  name: "Divide by a decimal with the standard algorithm"
  statement: "Divide a whole number or a decimal by a decimal by first multiplying the divisor and the dividend by the same power of 10, which makes the divisor a whole number and leaves the quotient unchanged, and then dividing by that whole number with long division."
  procedure:
    - "Count the decimal places k in the divisor."
    - "Multiply the divisor and the dividend by 10^k by moving each decimal point k places to the right, writing zeros in the dividend if needed."
    - "Divide the new dividend by the new whole-number divisor with long division, placing the decimal point of the quotient above the new decimal point of the dividend."
  assess: "Use the standard algorithm: 7.38 divided by 0.6."
  sources: {ccss: ["6.NS.B.3"], lc: ["95700724", "3b40f296"]}
  strand: Q1
- id: factors.common-factor.meaning
  concept: factors
  facet: core
  level: 3
  type: concept
  name: "A common factor of two whole numbers"
  statement: "A common factor of two whole numbers is a whole number that is a factor of each of them."
  assess: "Which of 2, 3, 4, and 6 are common factors of 12 and 18?"
  sources: {ccss: ["6.NS.B.4"], lc: ["9bf54462"]}
  strand: Q1
- id: factors.gcf.find
  concept: factors
  facet: core
  level: 3
  type: procedure
  name: "Find the greatest common factor of two whole numbers"
  statement: "The greatest common factor of two whole numbers up to 100 is the largest of their common factors; find it by listing the factors of each number and choosing the largest number on both lists."
  procedure:
    - "List all factors of the first number from its factor pairs."
    - "List all factors of the second number the same way."
    - "Choose the largest number that appears on both lists."
  assess: "Find the greatest common factor of 36 and 48."
  sources: {ccss: ["6.NS.B.4"], lc: ["9bf54462"]}
  strand: Q1
- id: factors.common-multiple.meaning
  concept: factors
  facet: core
  level: 3
  type: concept
  name: "A common multiple of two whole numbers"
  statement: "A common multiple of two whole numbers is a whole number that is a multiple of each of them."
  assess: "Which of 16, 18, 24, and 48 are common multiples of 6 and 8?"
  sources: {ccss: ["6.NS.B.4"], lc: ["926bf4b0"]}
  strand: Q1
- id: factors.lcm.find
  concept: factors
  facet: core
  level: 3
  type: procedure
  name: "Find the least common multiple of two whole numbers"
  statement: "The least common multiple of two nonzero whole numbers up to 12 is the smallest nonzero common multiple; find it by listing the multiples of the greater number in order until one is also a multiple of the smaller number."
  procedure:
    - "List the multiples of the greater number in order: 1 times it, 2 times it, 3 times it, and so on."
    - "For each one, decide whether it is a multiple of the smaller number."
    - "The first one that is a multiple of the smaller number is the least common multiple."
  assess: "Find the least common multiple of 6 and 8."
  sources: {ccss: ["6.NS.B.4"], lc: ["926bf4b0"]}
  strand: Q1
- id: multiplication.distributive.factor-common
  concept: multiplication
  facet: core
  level: 3
  type: procedure
  name: "Write a sum of two whole numbers as a common factor times a sum"
  statement: "Use the distributive property to rewrite a sum a + b of two whole numbers whose greatest common factor g is greater than 1 as g x (c + d), where a = g x c and b = g x d, so that c and d have no common factor greater than 1."
  procedure:
    - "Find the greatest common factor g of a and b."
    - "Find c and d with a = g x c and b = g x d."
    - "Write a + b = g x c + g x d = g x (c + d)."
  assess: "Write 36 + 8 as a whole number times a sum of two whole numbers that have no common factor greater than 1."
  sources: {ccss: ["6.NS.B.4"], lc: ["c587f727"]}
  strand: Q1
- id: division.nonunit-fraction-by-whole
  concept: division
  facet: partitive
  level: 3
  type: procedure
  name: "Divide a fraction by a whole number"
  statement: "Divide a fraction a/b by a whole number n greater than 0 by multiplying the denominator by n: (a/b) divided by n = a/(b x n)."
  procedure:
    - "Keep the numerator a."
    - "Multiply the denominator b by n."
    - "Write a/(b x n) as the quotient."
  assess: "Compute (3/4) divided by 2."
  sources: {ccss: ["6.NS.A.1"], lc: []}
  strand: Q1
- id: fraction.reciprocal
  concept: fraction
  facet: operator
  level: 3
  type: concept
  name: "The reciprocal of a fraction"
  statement: "The reciprocal of a nonzero fraction a/b is b/a, the number whose product with a/b is 1."
  assess: "Which pairs are reciprocals: 2/3 and 3/2; 2/3 and 1/3; 5 and 1/5; 1/4 and 4/1?"
  sources: {ccss: ["6.NS.A.1"], lc: []}
  strand: Q1
- id: division.equal-scaling.quotient-unchanged
  concept: division
  facet: measurement
  level: 3
  type: concept
  name: "Scaling dividend and divisor by the same number leaves the quotient unchanged"
  statement: "Multiplying the dividend and the divisor by the same nonzero number does not change the quotient: a divided by b = (a x k) divided by (b x k)."
  assess: "Without dividing, decide which of these are equal to 7.38 divided by 0.6: 73.8 divided by 6; 738 divided by 6; 738 divided by 60."
  sources: {ccss: ["6.NS.B.3"], lc: []}
  strand: Q1
- id: rational-number.signed.meaning
  concept: rational-number
  facet: core
  level: 2
  type: concept
  name: "Positive and negative numbers describe opposite directions from 0"
  statement: "Positive and negative numbers are used together for quantities measured in opposite directions from a reference value of 0: amounts in one direction are positive and amounts in the opposite direction are negative."
  assess: "Which pairs could be written as +40 and -40: a deposit of 40 dollars and a withdrawal of 40 dollars; 40 m above sea level and 40 m below sea level; 40 apples and 40 oranges? Explain."
  sources: {ccss: ["6.NS.C.5"], lc: ["f57f8f6c"]}
  strand: Q1
- id: rational-number.signed.represent-context
  concept: rational-number
  facet: core
  level: 2
  type: representation
  name: "Write a signed number for a quantity in context"
  statement: "Write a positive or negative number for a quantity described in a real-world context, choosing the sign by the direction of the quantity from 0."
  assess: "Write a number for each: a temperature 8 degrees below zero; a deposit of 25 dollars; a depth of 150 m below sea level."
  sources: {ccss: ["6.NS.C.5"], lc: ["8119c47d"]}
  strand: Q1
- id: rational-number.zero.meaning-in-context
  concept: rational-number
  facet: core
  level: 2
  type: concept
  name: "The meaning of 0 in a signed-number context"
  statement: "In a context described with positive and negative numbers, 0 stands for the reference value from which both directions are measured, such as sea level, a balance of no money, or the freezing point of water on the Celsius scale."
  assess: "Heights are written relative to sea level, as +200 m for a hilltop and -30 m for a valley floor. What does an elevation of 0 m mean in this situation?"
  sources: {ccss: ["6.NS.C.5"], lc: ["f38825db"]}
  strand: Q1
- id: rational-number.integer.number-line
  concept: rational-number
  facet: core
  level: 2
  type: representation
  name: "Locate integers on a horizontal or vertical number line"
  statement: "The negative integers are marked at unit steps from 0 on the opposite side from the positive integers: to the left of 0 on a horizontal number line and below 0 on a vertical one."
  procedure:
    - "Find 0 and the unit length on the number line."
    - "For a positive integer n, mark the point n units from 0 to the right (horizontal) or up (vertical)."
    - "For a negative integer -n, mark the point n units from 0 to the left (horizontal) or down (vertical)."
  assess: "On a vertical number line marked only with 0 and 1, mark -3 and 2."
  sources: {ccss: ["6.NS.C.6.c"], lc: ["36d0fda5"]}
  strand: Q1
- id: rational-number.fraction-decimal.number-line
  concept: rational-number
  facet: core
  level: 2
  type: representation
  name: "Locate negative fractions and decimals on a number line"
  statement: "A negative fraction or decimal -a is located the same distance from 0 as a, on the negative side of 0 (left on a horizontal number line, below on a vertical one)."
  procedure:
    - "Find where the positive number a would be by locating the fraction or decimal a on the positive side."
    - "Measure the distance from 0 to a."
    - "Mark the point at that same distance from 0 on the negative side and label it -a."
  assess: "On a horizontal number line labeled with the integers from -3 to 3, mark -2.5 and -3/4."
  sources: {ccss: ["6.NS.C.6.c"], lc: ["36d0fda5"]}
  strand: Q1
- id: rational-number.opposite.number-line
  concept: rational-number
  facet: core
  level: 2
  type: concept
  name: "Opposites lie on opposite sides of 0 at the same distance"
  statement: "A number and its opposite, such as 5 and -5, lie on opposite sides of 0 on the number line, at the same distance from 0."
  assess: "Which pairs are opposites: 5 and -5; 3 and -4; -2 and -6? Use a number line to explain."
  sources: {ccss: ["6.NS.C.6.a"], lc: ["22156372"]}
  strand: Q1
- id: rational-number.opposite.of-zero
  concept: rational-number
  facet: core
  level: 2
  type: concept
  name: "0 is its own opposite"
  statement: "The opposite of 0 is 0, since 0 is at distance 0 from itself and lies on neither side of 0."
  assess: "What is the opposite of 0? Use the number line to explain."
  sources: {ccss: ["6.NS.C.6.a"], lc: ["4c975388"]}
  strand: Q1
- id: rational-number.opposite.of-opposite
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "The opposite of the opposite of a number is the number"
  statement: "For every number a, the opposite of the opposite of a is a itself: -(-a) = a."
  assess: "What number is -(-7)? If a = -3, what number is -(-a)?"
  sources: {ccss: ["6.NS.C.6.a"], lc: ["a40a923f"]}
  strand: Q1
- id: coordinate-plane.quadrants.signs
  concept: coordinate-plane
  facet: location
  level: 3
  type: concept
  name: "The signs of the coordinates tell the quadrant"
  statement: "With the quadrants numbered I to IV counterclockwise from the upper right, a point whose coordinates have signs (+, +) is in quadrant I, (-, +) in quadrant II, (-, -) in quadrant III, and (+, -) in quadrant IV; a point with a coordinate of 0 lies on an axis."
  assess: "Without plotting, name the quadrant or axis for each point: (-4, 7), (3, -2), (-1, -5), (0, 6)."
  sources: {ccss: ["6.NS.C.6.b"], lc: ["ef1f09b2"]}
  strand: Q1
- id: coordinate-plane.reflection.signs
  concept: coordinate-plane
  facet: location
  level: 3
  type: concept
  name: "Points that differ only in sign are mirror images across the axes"
  statement: "The points (a, b) and (a, -b) are mirror images across the x-axis, (a, b) and (-a, b) are mirror images across the y-axis, and (a, b) and (-a, -b) are related by a flip across one axis followed by a flip across the other."
  assess: "Point P is (5, -2). Without plotting, which point is its mirror image across the y-axis: (-5, -2), (5, 2), or (-5, 2)?"
  sources: {ccss: ["6.NS.C.6.b"], lc: ["8e0a9454"]}
  strand: Q1
- id: coordinate-plane.four-quadrants.plot
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Plot a point with integer coordinates in any quadrant"
  statement: "Plot the point (a, b) with integer coordinates by moving from the origin along the x-axis to a, right if a is positive and left if negative, and then parallel to the y-axis to b, up if b is positive and down if negative."
  procedure:
    - "Start at the origin."
    - "Move |a| units along the x-axis: right if a is positive, left if a is negative."
    - "From there, move |b| units parallel to the y-axis: up if b is positive, down if b is negative."
    - "Mark the point and label it."
  assess: "Plot A(-3, 4), B(2, -5), and C(-1, -2) on a coordinate grid."
  sources: {ccss: ["6.NS.C.6.c"], lc: ["58c3fbf4"]}
  strand: Q1
- id: coordinate-plane.four-quadrants.read
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Read the integer coordinates of a point in any quadrant"
  statement: "Find the integer coordinates of a plotted point in any quadrant: the first coordinate is its signed horizontal position, negative to the left of the y-axis, and the second is its signed vertical position, negative below the x-axis."
  procedure:
    - "From the point, go straight up or down to the x-axis and read the number there; it is negative if the point is left of the y-axis."
    - "From the point, go straight left or right to the y-axis and read the number there; it is negative if the point is below the x-axis."
    - "Write the two numbers as an ordered pair (first, second)."
  assess: "Write the ordered pair for each of the four labeled points on this grid, one in each quadrant."
  sources: {ccss: ["6.NS.C.6.c"], lc: ["58c3fbf4"]}
  strand: Q1
- id: coordinate-plane.four-quadrants.fraction-decimal.plot
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Plot a point with fraction or decimal coordinates in any quadrant"
  statement: "Plot a point in any quadrant whose coordinates are positive or negative fractions or decimals, locating each coordinate on its axis as on a number line."
  assess: "On a grid with lines one unit apart, plot (-2.5, 1.5) and (3/4, -2)."
  sources: {ccss: ["6.NS.C.6.c"], lc: ["58c3fbf4"]}
  strand: Q1
- id: coordinate-plane.four-quadrants.fraction-decimal.read
  concept: coordinate-plane
  facet: location
  level: 2
  type: procedure
  name: "Read fraction or decimal coordinates of a point in any quadrant"
  statement: "Find the coordinates of a plotted point in any quadrant when they are positive or negative fractions or decimals, reading each from the scale of its axis."
  assess: "On a grid whose lines are marked every 0.5 unit, point Q is plotted in quadrant III. Write its coordinates."
  sources: {ccss: ["6.NS.C.6.c"], lc: ["58c3fbf4"]}
  strand: Q1
- id: rational-number.order.number-line
  concept: rational-number
  facet: core
  level: 2
  type: concept
  name: "An inequality as relative position on the number line"
  statement: "For two numbers a and b, a > b says that a is located to the right of b on a number line oriented from left to right, and a < b says that a is located to the left of b."
  assess: "Ana says that -3 > -7 means -3 is to the left of -7 on a number line oriented from left to right. Is she right? Explain using the positions of the two points."
  sources: {ccss: ["6.NS.C.7.a"], lc: ["e3f2391f"]}
  strand: Q1
- id: rational-number.compare.integers
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Decide which of two integers is greater"
  statement: "Decide which of two integers is greater without a number line: a positive integer is greater than 0, 0 is greater than a negative integer, and of two negative integers the one closer to 0 is greater."
  procedure:
    - "If the integers have different signs, or one is 0, the order is negative < 0 < positive."
    - "If both are positive, compare them as whole numbers."
    - "If both are negative, compare their opposites; the negative integer whose opposite is smaller is the greater."
  assess: "Which is greater in each pair: -14 or -9; -6 or 0?"
  sources: {ccss: ["6.NS.C.7"], lc: []}
  strand: Q1
- id: rational-number.compare.rationals
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Decide which of two signed fractions or decimals is greater"
  statement: "Decide which of two rational numbers given as fractions or decimals is greater without a number line: negative < 0 < positive, and of two negative numbers the one closer to 0, whose opposite is smaller, is greater."
  procedure:
    - "If the numbers have different signs, or one is 0, the order is negative < 0 < positive."
    - "If both are positive, compare them as fractions or decimals."
    - "If both are negative, compare their opposites as fractions or decimals; the negative number whose opposite is smaller is the greater."
  assess: "Which is greater in each pair: -4.5 or -4.05; -2/3 or -3/4?"
  sources: {ccss: ["6.NS.C.7"], lc: []}
  strand: Q1
- id: rational-number.order.context.write
  concept: rational-number
  facet: core
  level: 2
  type: representation
  name: "Write an inequality comparing two signed quantities in context"
  statement: "Write an inequality with > or < between two signed numbers that stand for quantities in a real-world context, such as -3 degrees C > -7 degrees C to record that -3 degrees C is warmer."
  assess: "One town is at an elevation of -12 m and another at -5 m. Write an inequality with these two numbers that says the second town is higher."
  sources: {ccss: ["6.NS.C.7.b"], lc: ["0a31d080"]}
  strand: Q1
- id: rational-number.order.context.explain
  concept: rational-number
  facet: core
  level: 2
  type: justification
  name: "Explain an inequality between signed quantities in context"
  statement: "Explain why an inequality between two signed quantities is true by saying what it means for the quantities in their context, such as warmer, higher, or owing less."
  assess: "Two account balances are -20 dollars and -5 dollars. Explain, in terms of money owed, why -20 < -5."
  sources: {ccss: ["6.NS.C.7.b"], lc: ["4afb8365"]}
  strand: Q1
- id: absolute-value.distance.integer
  concept: absolute-value
  facet: distance
  level: 2
  type: concept
  name: "Absolute value of an integer as its distance from 0"
  statement: "The absolute value of an integer a, written |a|, is the distance from 0 to a on the number line."
  assess: "Use a number line to find |-6|, |6| and |0|."
  sources: {ccss: ["6.NS.C.7.c"], lc: ["ac5763c9"]}
  strand: Q1
- id: absolute-value.distance.rational
  concept: absolute-value
  facet: distance
  level: 2
  type: concept
  name: "Absolute value of a fraction or decimal as its distance from 0"
  statement: "The absolute value of a rational number a given as a fraction or decimal, written |a|, is the distance from 0 to a on the number line."
  assess: "Use a number line to find |-2.5| and |-3/4|."
  sources: {ccss: ["6.NS.C.7.c"], lc: ["62c8cf40"]}
  strand: Q1
- id: absolute-value.magnitude.context
  concept: absolute-value
  facet: magnitude
  level: 2
  type: concept
  name: "Absolute value as the size of a signed quantity in context"
  statement: "For a quantity in a real-world context written as a signed number, its absolute value is the size of the quantity without its direction, such as the amount of a debt or a depth below sea level."
  assess: "An account balance is -30 dollars. What does |-30| = 30 tell you about the account?"
  sources: {ccss: ["6.NS.C.7.c"], lc: ["8ef052eb"]}
  strand: Q1
- id: absolute-value.vs-order
  concept: absolute-value
  facet: distance
  level: 3
  type: concept
  name: "Comparing absolute values is not comparing numbers"
  statement: "A comparison of absolute values is a different statement from a comparison of the numbers: of two negative numbers, the one with the greater absolute value is the lesser number."
  assess: "True or false: -8 < -3. True or false: |-8| < |-3|. Explain why the two answers differ."
  sources: {ccss: ["6.NS.C.7.d"], lc: ["f1a27da7", "20e0f0fc"]}
  strand: Q1
- id: absolute-value.vs-order.context
  concept: absolute-value
  facet: magnitude
  level: 2
  type: application
  name: "Tell order statements from size statements about signed quantities in context"
  statement: "A real-world problem states the order of a negative quantity, such as an account balance less than -30 dollars, and asks what it says about the quantity's size, here a debt greater than 30 dollars."
  assess: "Maya's account balance is less than -30 dollars. Is her debt more than or less than 30 dollars? Explain."
  sources: {ccss: ["6.NS.C.7.d"], lc: ["ea4abac5"]}
  strand: Q1
- id: coordinate-plane.application.real-world.four-quadrants
  concept: coordinate-plane
  facet: location
  level: 2
  type: application
  name: "Locate places on a map grid with signed coordinates"
  statement: "A real-world problem gives places on a map grid as ordered pairs of either sign, with the origin at a landmark and east and north positive; plot them and say where one place is relative to the landmark or to another place."
  assess: "On a town map, the school is at the origin, east and north are positive, and each unit is one block. The library is at (-3, 2) and the park is at (4, -1). Plot both, and say which of them is southeast of the school."
  sources: {ccss: ["6.NS.C.8"], lc: ["181f01a6"]}
  strand: Q1
- id: rational-number.opposites.combine-to-zero.context
  concept: rational-number
  facet: change
  level: 2
  type: concept
  name: "Opposite quantities combine to make 0"
  statement: "In a real-world situation, a quantity combined with an opposite quantity of the same size gives 0, such as a gain of 6 points followed by a loss of 6 points."
  assess: "Which situation ends with a total change of 0: (a) a deposit of 20 dollars, then a withdrawal of 20 dollars; (b) a deposit of 20 dollars, then another deposit of 20 dollars; (c) a rise of 5 degrees, then a fall of 3 degrees?"
  sources: {ccss: ["7.NS.A.1.a"], lc: ["b9271b94"]}
  strand: Q1
- id: factors.common-multiple.product
  concept: factors
  facet: core
  level: 3
  type: concept
  name: "The product of two whole numbers is a common multiple"
  statement: "For nonzero whole numbers a and b, the product a x b is a common multiple of a and b, though it need not be the least one."
  assess: "Without listing multiples, give a common multiple of 7 and 9, and explain how you know it is a multiple of each."
  sources: {ccss: ["6.NS.B.4"], lc: []}
  strand: Q1
- id: rational-number.addition.number-line
  concept: rational-number
  facet: change
  level: 2
  type: concept
  name: "p + q as a move of |q| from p on the number line"
  statement: "p + q is the number located a distance |q| from p on the number line, in the positive direction if q is positive and in the negative direction if q is negative."
  assess: "Without computing, describe where -2 + 5 and -2 + (-5) are on a number line: from which point do you start, which way do you move, and how far?"
  sources: {ccss: ["7.NS.A.1.b"], lc: ["bffbcffa"]}
  strand: Q1
- id: rational-number.additive-inverse
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "A number and its opposite are additive inverses"
  statement: "For every number a, a + (-a) = 0; a number and its opposite are additive inverses."
  assess: "Which pairs are additive inverses: 4.5 and -4.5; -3/4 and 4/3; -7 and 7; 2 and 1/2?"
  sources: {ccss: ["7.NS.A.1.b"], lc: ["67ca75ab"]}
  strand: Q1
- id: rational-number.additive-inverse.explain
  concept: rational-number
  facet: change
  level: 2
  type: justification
  name: "Show on a number line that a number plus its opposite is 0"
  statement: "On a number line, starting at a and moving |a| in the direction of -a, back toward 0, lands exactly on 0, so a + (-a) = 0."
  assess: "Use a number line to show why 3.5 + (-3.5) = 0."
  sources: {ccss: ["7.NS.A.1.b"], lc: ["67ca75ab"]}
  strand: Q1
- id: rational-number.addition.context.describe
  concept: rational-number
  facet: change
  level: 2
  type: representation
  name: "Describe a real-world situation for a sum of signed numbers"
  statement: "Describe a real-world situation that a given sum of rational numbers represents, giving each addend a meaning in the situation."
  assess: "Describe a real-world situation that the sum -12 + 4.5 could represent."
  sources: {ccss: ["7.NS.A.1.b"], lc: ["f1f74202"]}
  strand: Q1
- id: rational-number.addition.integers
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Add two integers"
  statement: "Add two integers by the sign rules: with the same sign, add the absolute values and keep the sign; with opposite signs, subtract the smaller absolute value from the larger and take the sign of the addend with the larger absolute value."
  procedure:
    - "If one addend is 0, the sum is the other addend."
    - "If the addends have the same sign, add their absolute values and give the sum that sign."
    - "If they have opposite signs, subtract the smaller absolute value from the larger and give the result the sign of the addend with the larger absolute value; if the absolute values are equal, the sum is 0."
  assess: "Compute -9 + 4, -6 + (-8), and 7 + (-7)."
  sources: {ccss: ["7.NS.A.1"], lc: []}
  strand: Q1
- id: rational-number.addition.rationals
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Add two signed fractions or decimals"
  statement: "Add two rational numbers given as signed fractions or decimals by the sign rules for addition, computing the sum or difference of their absolute values as fractions or decimals."
  procedure:
    - "If one addend is 0, the sum is the other addend."
    - "If the addends have the same sign, add their absolute values as fractions or decimals and give the sum that sign."
    - "If they have opposite signs, subtract the smaller absolute value from the larger as fractions or decimals and give the result the sign of the addend with the larger absolute value; if the absolute values are equal, the sum is 0."
  assess: "Compute -2.4 + 0.75 and -1/2 + (-1/3)."
  sources: {ccss: ["7.NS.A.1", "7.NS.A.3"], lc: ["2f8040bb"]}
  strand: Q1
- id: rational-number.subtraction.add-inverse
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "Subtracting a number is adding its opposite"
  statement: "For all rational numbers p and q, p - q = p + (-q)."
  assess: "Which expressions equal 5 - (-8): 5 + 8; 5 + (-8); -5 + 8? Which equal -3 - 7: -3 + (-7); -3 + 7?"
  sources: {ccss: ["7.NS.A.1.c"], lc: ["ee49316b"]}
  strand: Q1
- id: rational-number.subtraction.integers
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Subtract two integers"
  statement: "Subtract one integer from another by rewriting the subtraction as adding the opposite and adding the two integers."
  procedure:
    - "Rewrite p - q as p + (-q)."
    - "Add p and -q by the sign rules for adding integers."
  assess: "Compute 3 - 8, -5 - (-9), and -4 - 6."
  sources: {ccss: ["7.NS.A.1"], lc: []}
  strand: Q1
- id: rational-number.subtraction.rationals
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Subtract two signed fractions or decimals"
  statement: "Subtract one rational number given as a signed fraction or decimal from another by rewriting the subtraction as adding the opposite and adding the two numbers."
  procedure:
    - "Rewrite p - q as p + (-q)."
    - "Add p and -q by the sign rules for adding signed fractions or decimals."
  assess: "Compute -1.2 - 3.5 and 1/4 - (-2/3)."
  sources: {ccss: ["7.NS.A.1", "7.NS.A.3"], lc: ["1781e56e"]}
  strand: Q1
- id: absolute-value.distance.between-numbers
  concept: absolute-value
  facet: distance
  level: 3
  type: concept
  name: "The distance between two numbers is the absolute value of their difference"
  statement: "The distance between two rational numbers p and q on the number line is |p - q|, which equals |q - p|."
  assess: "Which expressions give the distance between -6 and 2 on the number line: |-6 - 2|; |-6 + 2|; |2 - (-6)|; -6 - 2?"
  sources: {ccss: ["7.NS.A.1.c"], lc: ["5bb0a92d"]}
  strand: Q1
- id: absolute-value.distance.between-numbers.explain
  concept: absolute-value
  facet: distance
  level: 2
  type: justification
  name: "Show on a number line that distance is the absolute value of the difference"
  statement: "For a specific pair of rational numbers, a number line shows that the distance between them equals the absolute value of their difference, taken in either order."
  assess: "Use a number line to show that the distance between -3 and 5 equals |5 - (-3)| and also |-3 - 5|."
  sources: {ccss: ["7.NS.A.1.c"], lc: ["5bb0a92d"]}
  strand: Q1
- id: absolute-value.distance.application
  concept: absolute-value
  facet: distance
  level: 3
  type: application
  name: "Solve real-world problems about how far apart two signed values are"
  statement: "A real-world problem gives two signed values of the same kind, such as two elevations, temperatures or balances, and asks how far apart they are, answered by the absolute value of their difference."
  assess: "A plane flies at 850 m above sea level and a submarine is at -125 m. How far apart vertically are they?"
  sources: {ccss: ["7.NS.A.1.c"], lc: ["34863269"]}
  strand: Q1
- id: rational-number.addition.properties-strategy
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Add signed numbers by reordering and regrouping"
  statement: "Add several rational numbers by using the commutative and associative properties of addition to reorder and regroup them so that opposites, or addends with an easy sum, are combined first."
  procedure:
    - "Look for addends that are opposites or whose sum is easy, such as a whole number."
    - "Use the commutative and associative properties to move those addends next to each other and group them."
    - "Add each group, then add the results."
  assess: "Compute -3.7 + 8 + 3.7 by first reordering and grouping the addends. Show the rewritten sum."
  sources: {ccss: ["7.NS.A.1.d"], lc: ["685131ac", "ce4afd4b"]}
  strand: Q1
- id: rational-number.subtraction.properties-strategy
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Subtract signed numbers by rewriting as addition and regrouping"
  statement: "Compute an expression that subtracts rational numbers by rewriting each subtraction as adding the opposite, then reordering and regrouping the addends with the commutative and associative properties of addition."
  procedure:
    - "Rewrite each p - q as p + (-q)."
    - "Use the commutative and associative properties to move opposites, or addends with an easy sum, next to each other and group them."
    - "Add each group, then add the results."
  assess: "Compute -4.5 - 7 - (-4.5) by rewriting the subtractions as additions and regrouping. Show the rewritten sum."
  sources: {ccss: ["7.NS.A.1.d"], lc: ["7aa5ed91", "ce4afd4b"]}
  strand: Q1
- id: rational-number.application.addition
  concept: rational-number
  facet: change
  level: 3
  type: application
  name: "Solve real-world problems that add a signed change to a signed value"
  statement: "A real-world problem gives a signed starting value and a signed change, such as an elevation and a rise or fall, and asks for the result, found by adding the two signed numbers."
  assess: "A submarine is at -45.5 m. It rises 18.25 m. What is its new elevation?"
  sources: {ccss: ["7.NS.A.3"], lc: ["1bff6614"]}
  strand: Q1
- id: rational-number.application.subtraction
  concept: rational-number
  facet: change
  level: 3
  type: application
  name: "Solve real-world problems that find the signed change between two values"
  statement: "A real-world problem gives two signed values of the same kind, such as two temperatures or elevations, and asks for the change from the first to the second, found by subtracting the first from the second."
  assess: "At noon the temperature was 4.5 degrees C. At midnight it was -7.25 degrees C. What was the change in temperature from noon to midnight?"
  sources: {ccss: ["7.NS.A.3"], lc: ["39612eaf"]}
  strand: Q1
- id: rational-number.multiplication.sign-rule
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "The sign rule for multiplying signed numbers"
  statement: "The product of two nonzero rational numbers is positive when they have the same sign and negative when they have opposite signs, and its absolute value is the product of their absolute values."
  assess: "Without computing the values, give the sign of each product: (-3.1) x 4.7; (-2/5) x (-8); 0.5 x 12."
  sources: {ccss: ["7.NS.A.2.a"], lc: ["056c6b51"]}
  strand: Q1
- id: rational-number.multiplication.sign-rule.explain
  concept: rational-number
  facet: core
  level: 4
  type: justification
  name: "Explain with the distributive property why (-1) x (-1) = 1"
  statement: "If multiplication of signed numbers keeps the distributive property, then 0 = (-1) x (1 + (-1)) = (-1) x 1 + (-1) x (-1) = -1 + (-1) x (-1), so (-1) x (-1) must be the additive inverse of -1, which is 1."
  assess: "Use 0 = (-1) x (1 + (-1)) and the distributive property to explain why (-1) x (-1) must equal 1."
  sources: {ccss: ["7.NS.A.2.a"], lc: ["056c6b51"]}
  strand: Q1
- id: rational-number.multiplication.integers
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Multiply two integers"
  statement: "Multiply two integers by multiplying their absolute values and giving the product the sign from the sign rule."
  procedure:
    - "If either factor is 0, the product is 0."
    - "Multiply the absolute values of the factors."
    - "Make the product positive if the factors have the same sign and negative if they have opposite signs."
  assess: "Compute -6 x 7, -4 x (-9), and 0 x (-3)."
  sources: {ccss: ["7.NS.A.2"], lc: []}
  strand: Q1
- id: rational-number.multiplication.rationals
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Multiply two signed fractions or decimals"
  statement: "Multiply two rational numbers given as signed fractions or decimals by multiplying their absolute values as fractions or decimals and giving the product the sign from the sign rule."
  procedure:
    - "If either factor is 0, the product is 0."
    - "Multiply the absolute values of the factors as fractions or decimals."
    - "Make the product positive if the factors have the same sign and negative if they have opposite signs."
  assess: "Compute -0.6 x 2.5 and (-3/4) x (-2/9)."
  sources: {ccss: ["7.NS.A.2", "7.NS.A.3"], lc: ["8c3bf1a0"]}
  strand: Q1
- id: rational-number.multiplication.context.describe
  concept: rational-number
  facet: change
  level: 2
  type: representation
  name: "Describe a real-world situation for a product of signed numbers"
  statement: "Describe a real-world situation that a given product of rational numbers represents, giving each factor a meaning in the situation."
  assess: "Describe a real-world situation that the product 4 x (-2.5) could represent."
  sources: {ccss: ["7.NS.A.2.a"], lc: ["be26c574"]}
  strand: Q1
- id: rational-number.integer-quotient
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "A quotient of integers is a rational number"
  statement: "For integers p and q with q not 0, p divided by q is the rational number p/q, even when q does not divide p evenly."
  assess: "Write (-7) divided by 2 as a fraction. Which of these quotients is a rational number and which is undefined: 0 divided by (-3); 4 divided by 0?"
  sources: {ccss: ["7.NS.A.2.b"], lc: ["17876f9a"]}
  strand: Q1
- id: rational-number.division.sign-rule
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "The sign rule for dividing signed numbers"
  statement: "The quotient of two nonzero rational numbers is positive when they have the same sign and negative when they have opposite signs, and its absolute value is the quotient of their absolute values."
  assess: "Without computing the values, give the sign of each quotient: (-48) divided by 6; (-2.4) divided by (-0.8); (5/6) divided by (-3)."
  sources: {ccss: ["7.NS.A.2.b"], lc: ["9dd24851"]}
  strand: Q1
- id: rational-number.negative-fraction.sign-placement
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "Where the negative sign of a fraction can go"
  statement: "For integers p and q with q not 0, -(p/q) = (-p)/q = p/(-q)."
  assess: "Which of these equal -(3/4): (-3)/4; 3/(-4); (-3)/(-4)?"
  sources: {ccss: ["7.NS.A.2.b"], lc: ["9dd24851"]}
  strand: Q1
- id: rational-number.division.integers
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Divide an integer by an integer that divides it evenly"
  statement: "Divide an integer by a nonzero integer that divides it evenly by dividing their absolute values and giving the quotient the sign from the sign rule."
  procedure:
    - "If the dividend is 0, the quotient is 0."
    - "Divide the absolute value of the dividend by the absolute value of the divisor."
    - "Make the quotient positive if the two numbers have the same sign and negative if they have opposite signs."
  assess: "Compute -42 divided by 6, -36 divided by (-4), and 0 divided by (-5)."
  sources: {ccss: ["7.NS.A.2"], lc: []}
  strand: Q1
- id: rational-number.division.rationals
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Divide signed fractions or decimals"
  statement: "Divide a rational number by a nonzero rational number, given as signed fractions or decimals, by dividing their absolute values as fractions or decimals and giving the quotient the sign from the sign rule."
  procedure:
    - "If the dividend is 0, the quotient is 0."
    - "Divide the absolute value of the dividend by the absolute value of the divisor as fractions or decimals."
    - "Make the quotient positive if the two numbers have the same sign and negative if they have opposite signs."
  assess: "Compute -1.8 divided by 0.3 and (-2/3) divided by (-4/5)."
  sources: {ccss: ["7.NS.A.2", "7.NS.A.3"], lc: ["d69891ac"]}
  strand: Q1
- id: rational-number.division.context.describe
  concept: rational-number
  facet: change
  level: 2
  type: representation
  name: "Describe a real-world situation for a quotient of signed numbers"
  statement: "Describe a real-world situation that a given quotient of rational numbers represents, giving the dividend and the divisor a meaning in the situation."
  assess: "Describe a real-world situation that the quotient (-7.5) divided by 3 could represent."
  sources: {ccss: ["7.NS.A.2.b"], lc: ["177feacf"]}
  strand: Q1
- id: rational-number.multiplication.properties-strategy
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Multiply signed numbers by reordering, regrouping or distributing"
  statement: "Multiply rational numbers by using the commutative and associative properties to reorder and regroup factors, or the distributive property to split a factor into a sum, so that the products are easy."
  procedure:
    - "Look for factors whose product is easy, such as -4 and 25, or a factor that splits into a sum with easy products."
    - "Use the commutative and associative properties to group those factors, or the distributive property to split the factor and multiply each part."
    - "Compute each group or part, then combine the results."
  assess: "Compute -4 x 2.7 x (-25) by first reordering and grouping the factors. Show the rewritten product."
  sources: {ccss: ["7.NS.A.2.c"], lc: ["54a463dd"]}
  strand: Q1
- id: rational-number.division.properties-strategy
  concept: rational-number
  facet: core
  level: 3
  type: procedure
  name: "Divide signed numbers by rewriting as multiplication and regrouping"
  statement: "Compute an expression that divides rational numbers by rewriting each division as multiplying by the reciprocal of the divisor, then reordering and regrouping the factors with the commutative and associative properties."
  procedure:
    - "Rewrite each p divided by q, with q not 0, as p x (1/q), using the reciprocal of q."
    - "Use the commutative and associative properties to group factors whose product is easy."
    - "Multiply each group, then multiply the results."
  assess: "Compute [(-18) divided by (2/3)] x (1/9) by rewriting the division as a multiplication and regrouping. Show the rewritten product."
  sources: {ccss: ["7.NS.A.2.c"], lc: ["c48c1cff"]}
  strand: Q1
- id: rational-number.application.multiplication
  concept: rational-number
  facet: change
  level: 3
  type: application
  name: "Solve real-world problems that multiply a signed change per unit"
  statement: "A real-world problem gives a constant signed change per unit, such as per day or per hour, and a number of units, and asks for the total change, found by multiplying."
  assess: "A stock's price changed by -1.25 dollars each day for 4 days. What was the total change in price?"
  sources: {ccss: ["7.NS.A.3"], lc: ["29a9858d"]}
  strand: Q1
- id: rational-number.application.division
  concept: rational-number
  facet: change
  level: 3
  type: application
  name: "Solve real-world problems that share a signed change equally"
  statement: "A real-world problem gives a total signed change spread equally over a number of steps or units and asks for the change per step, found by dividing."
  assess: "A diver descended from the surface to -22.5 m in 5 equal stages. What was the change in elevation for each stage?"
  sources: {ccss: ["7.NS.A.3"], lc: ["d28fda5e"]}
  strand: Q1
- id: rational-number.fraction-to-decimal.long-division
  concept: rational-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: "Convert a fraction to a decimal with long division"
  statement: "Write a fraction a/b of whole numbers as a decimal by dividing a by b with long division, writing zeros after the decimal point of a, until a remainder of 0 ends the decimal or a remainder recurs, after which the digits repeat."
  procedure:
    - "Write a with a decimal point and zeros after it, and set up a divided by b."
    - "Divide with long division, placing the decimal point of the quotient above that of a."
    - "If a remainder is 0, stop: the decimal terminates."
    - "If a remainder appears that has appeared before, stop: the quotient digits from where that remainder first appeared repeat forever; record the repeating block."
  assess: "Use long division to write 5/12 as a decimal."
  sources: {ccss: ["7.NS.A.2.d"], lc: ["2ab6ac49"]}
  strand: Q1
- id: rational-number.decimal-expansion.terminate-or-repeat
  concept: rational-number
  facet: decimal-expansion
  level: 3
  type: concept
  name: "The decimal form of a rational number terminates or eventually repeats"
  statement: "The decimal form of a rational number either terminates, ending in 0s, or eventually repeats one block of digits forever."
  assess: "Which of these could be the decimal form of a fraction: 0.375; 0.41666... with the 6 repeating forever; 0.1010010001... with one more 0 before each 1?"
  sources: {ccss: ["7.NS.A.2.d"], lc: ["0bd082cc"]}
  strand: Q1
- id: rational-number.fraction-to-decimal.application
  concept: rational-number
  facet: decimal-expansion
  level: 3
  type: application
  name: "Compare a fractional quantity with a decimal one by long division"
  statement: "A real-world problem gives one quantity as a fraction and another of the same kind as a decimal and asks which is greater; convert the fraction to a decimal by long division and compare."
  assess: "Runner A ran 5/8 mile and runner B ran 0.6 mile. Use long division to write 5/8 as a decimal, and say who ran farther."
  sources: {ccss: ["7.NS.A.2.d"], lc: ["ffd9dc15"]}
  strand: Q1
- id: rational-number.definition
  concept: rational-number
  facet: core
  level: 3
  type: concept
  name: "A rational number is a quotient of integers"
  statement: "A rational number is a number that can be written as p/q for some integers p and q with q not 0."
  assess: "Show that -1.25, 3 1/2 and 6 are rational numbers by writing each as a quotient of two integers."
  sources: {ccss: ["8.NS.A.1"], lc: ["1de87160"]}
  strand: Q1
- id: rational-number.decimal-expansion.terminate-or-repeat.explain
  concept: rational-number
  facet: decimal-expansion
  level: 4
  type: justification
  name: "Explain why the decimal of a fraction terminates or repeats"
  statement: "In the long division of a whole number a by a positive whole number b, every remainder is one of 0, 1, ..., b - 1, and once the digits of a are used up each step depends only on the remainder; so within b such steps either a remainder is 0 and the decimal terminates, or a remainder recurs and from then on the digits repeat."
  assess: "When you divide 1 by 7 with long division, explain why some remainder must recur within 7 steps after the decimal point, and why the digits of the quotient repeat from then on."
  sources: {ccss: ["8.NS.A.1"], lc: ["796584cf"]}
  strand: Q1
- id: rational-number.repeating-decimal.to-fraction
  concept: rational-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: "Write an eventually repeating decimal as a quotient of integers"
  statement: "Write an eventually repeating decimal x as a quotient of integers by subtracting x from 10^k x, where k is the number of digits in the repeating block, so that the repeating parts cancel, and solving for x."
  procedure:
    - "Let x be the decimal and k the number of digits in its repeating block."
    - "Write 10^k x by moving the decimal point of x k places to the right."
    - "Subtract x from 10^k x; the repeating parts cancel, leaving (10^k - 1) x = d, where d is a terminating decimal."
    - "Write x = d/(10^k - 1), and multiply the numerator and denominator by a power of 10 if needed so both are integers."
  assess: "Write 0.8333..., with the 3 repeating, as a quotient of two integers."
  sources: {ccss: ["8.NS.A.1"], lc: ["7608d2f3"]}
  strand: Q1
- id: real-number.decimal-expansion
  concept: real-number
  facet: decimal-expansion
  level: 2
  type: concept
  name: "Every number has a decimal expansion"
  statement: "Every number on the number line has a decimal expansion, possibly never ending, whose digits record which tenth, then which hundredth, and so on, the number lies in."
  assess: "A point P on the number line lies between 0.7 and 0.8, and between 0.73 and 0.74. What are the first two digits after the decimal point in the decimal expansion of P?"
  sources: {ccss: ["8.NS.A.1"], lc: ["ab61aaed"]}
  strand: Q1
- id: real-number.irrational.definition
  concept: real-number
  facet: core
  level: 3
  type: concept
  name: "An irrational number is a number that is not rational"
  statement: "A number that cannot be written as p/q with integers p and q and q not 0 is called irrational."
  assess: "Which of these are irrational: 0.25, which equals 1/4; sqrt(2), which cannot be written as a quotient of integers; -7; 0.333..., which equals 1/3?"
  sources: {ccss: ["8.NS.A.1"], lc: ["a622aa0e"]}
  strand: Q1
- id: real-number.irrational.identify
  concept: real-number
  facet: core
  level: 3
  type: procedure
  name: "Classify a number as rational or irrational"
  statement: "Classify a number given in one of these forms: integers, fractions of integers, terminating decimals, eventually repeating decimals and square roots of perfect squares are rational; square roots of whole numbers that are not perfect squares, pi, and decimals that neither terminate nor repeat are irrational."
  procedure:
    - "If the number is an integer, a fraction of integers, or a terminating or eventually repeating decimal, it is rational."
    - "If it is the square root of a whole number, it is rational when that whole number is a perfect square and irrational otherwise."
    - "If it is pi, or a decimal that neither terminates nor repeats, it is irrational."
  assess: "Classify each as rational or irrational: sqrt(16); sqrt(15); 0.121212... with 12 repeating; 0.1211211121111... with one more 1 each time; pi; -4/9."
  sources: {ccss: ["8.NS.A.1"], lc: ["a622aa0e"]}
  strand: Q1
- id: real-number.approximate.truncate
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: "Bound a number between truncations of its decimal expansion"
  statement: "If t is the decimal expansion of a positive number x cut off after n decimal places, then t <= x <= t + 1/10^n, which bounds x between two decimals with n places."
  procedure:
    - "Cut off the decimal expansion of x after n decimal places to get t."
    - "Add 1 in the last place kept to get t + 1/10^n."
    - "State that x lies between t and t + 1/10^n."
  assess: "pi = 3.14159... Between which two consecutive hundredths does pi lie?"
  sources: {ccss: ["8.NS.A.2"], lc: ["bac2efb6"]}
  strand: Q1
- id: real-number.approximate.square-root
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: "Find decimal bounds for a square root by squaring"
  statement: "Find decimals with a given number of places between which sqrt(n) lies, for a whole number n that is not a perfect square, by squaring trial values: first consecutive whole numbers, then consecutive tenths, then consecutive hundredths."
  procedure:
    - "Find the whole number a with a^2 < n < (a + 1)^2."
    - "Square a + 0.1, a + 0.2, and so on, until a square first exceeds n; sqrt(n) lies between that value and the one before it."
    - "Repeat inside that interval with steps of 0.01, and so on, for each further decimal place."
  assess: "Without a calculator, show that sqrt(5) is between 2 and 3, and then between 2.2 and 2.3."
  sources: {ccss: ["8.NS.A.2"], lc: ["bac2efb6", "e96d5914"]}
  strand: Q1
- id: real-number.number-line.approximate
  concept: real-number
  facet: core
  level: 2
  type: representation
  name: "Locate an irrational number approximately on a number line"
  statement: "Mark an irrational number approximately on a number line by placing it between the two decimals that bound it."
  assess: "sqrt(7) is between 2.6 and 2.7. Mark sqrt(7) approximately on a number line marked from 2 to 3 in tenths."
  sources: {ccss: ["8.NS.A.2"], lc: ["e96d5914"]}
  strand: Q1
- id: real-number.compare.approximation
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: "Compare irrational numbers with decimal bounds"
  statement: "Compare two numbers, at least one irrational, by bounding each between decimals with more and more places until the two bounding intervals do not overlap; the number in the higher interval is greater."
  procedure:
    - "Bound each number between two consecutive tenths."
    - "If the two intervals overlap, bound each between consecutive hundredths, and so on, until they do not overlap."
    - "The number whose interval lies to the right is the greater."
  assess: "Which is greater, sqrt(10) or pi? Use decimal bounds for each to decide."
  sources: {ccss: ["8.NS.A.2"], lc: []}
  strand: Q1
- id: real-number.expression.estimate
  concept: real-number
  facet: decimal-expansion
  level: 3
  type: procedure
  name: "Estimate an expression in an irrational number from decimal bounds"
  statement: "Estimate the value of an expression in a positive irrational number, such as pi^2, that increases as the number increases, by evaluating it at a lower and an upper decimal bound of the number; its value lies between the two results."
  procedure:
    - "Bound the irrational number between two decimals."
    - "Evaluate the expression at the lower bound and at the upper bound."
    - "State that the value of the expression lies between the two results."
  assess: "Use 3.1 < pi < 3.2 to find two numbers that pi^2 lies between."
  sources: {ccss: ["8.NS.A.2"], lc: []}
  strand: Q1
