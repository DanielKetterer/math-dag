new_concepts:
  - {concept: transformation, facet: geometric, reason: "Translations, reflections, rotations, and dilations as motions or mappings of the plane defined by distances, directions, and angles (8.G.A.1-4); spatial.motion is the informal L1 turn-and-flip, not these definitions."}
  - {concept: transformation, facet: coordinate, reason: "The same transformations as rules on ordered pairs, such as (x, y) -> (x + a, y + b) or (x, y) -> (-y, x) (8.G.A.3); a different meaning from the geometric one, so a different facet."}
  - {concept: congruence, facet: rigid-motion, reason: "Congruence defined as a sequence of translations, reflections, and rotations taking one figure onto another (8.G.A.2)."}
  - {concept: similarity, facet: transformation, reason: "Similarity defined as a sequence of rigid motions and dilations (8.G.A.4); also used for the angle-angle criterion nodes."}
  - {concept: similarity, facet: proportional-sides, reason: "Similar triangles read as triangles whose corresponding sides are proportional, the meaning the reserved id geometry.similar-triangles and slope.constant-on-line.explain use."}
  - {concept: pythagorean-theorem, facet: area, reason: "The theorem as a relation among areas of the squares built on the sides; the meaning the rearrangement proof uses."}
  - {concept: pythagorean-theorem, facet: length, reason: "The theorem as the equation a^2 + b^2 = c^2 in side lengths; the meaning used to compute unknown sides and distances."}
