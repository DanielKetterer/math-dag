# ---- fractions, number line ----
- id: fraction.subtraction.comparison
  concept: fraction
  facet: part-whole
  level: 2
  type: concept
  name: Subtracting fractions as comparing parts of the same whole
  statement: "Subtracting one fraction from another also tells how much more the first amount is than the second: the difference is the part that would have to be joined to the smaller amount to make the larger, where both fractions refer to the same whole."
  assess: "Using one bar as the whole, show how much more 5/6 is than 2/6, and say what the difference counts."
  sources: {ccss: ["4.NF.B.3.d"], lc: []}
  strand: F1
- id: number.halfway-between
  concept: number-line
  facet: core
  level: 2
  type: concept
  name: The number halfway between two numbers
  statement: "The number halfway between two numbers is the point of the number line at the same distance from both: the smaller number plus half of the distance from it to the larger."
  assess: "What number is halfway between 40 and 50? Between 200 and 300? Between 4 and 6?"
  sources: {ccss: ["3.NBT.A.1"], lc: []}
  strand: F1

