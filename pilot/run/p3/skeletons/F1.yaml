# ---- pairs, tables and graphs ----
- id: coordinate.ordered-pair.notation
  concept: coordinate-plane
  facet: location
  level: 2
  type: representation
  name: Ordered pair notation
  statement: "An ordered pair (a, b) writes two numbers in parentheses, separated by a comma, in a fixed order, first a and then b; (a, b) and (b, a) are different pairs unless a = b."
  assess: "Write the ordered pair whose first number is 3 and whose second number is 7. Is (3, 7) the same pair as (7, 3)?"
