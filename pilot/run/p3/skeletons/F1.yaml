- id: addition.multi-digit
  concept: addition
  facet: operation
  level: 3
  type: procedure
  name: Add multi-digit whole numbers
  statement: "Find the sum of multi-digit whole numbers, with sums up to 1,000,000, accurately and without objects, by any reliable method; place-value strategies and the standard algorithm both meet it."
  assess: "Find 4,827 + 3,596 and 26,054 + 8,968. Use any method."
  sources: {ccss: ["4.NBT.B.4"], lc: []}
  strand: F1
- id: division.by-two-digit
  concept: division
  facet: base-ten
  level: 3
  type: procedure
  name: Divide by a two-digit number, no remainder
  statement: "Find the whole-number quotient of a dividend of up to four digits by a two-digit divisor that divides it exactly, by any reliable method; partial quotients, an area model with numbers, and the standard algorithm all meet it."
  assess: "Find 7,452 divided by 36 and 96 divided by 12. Use any method."
  sources: {ccss: ["5.NBT.B.6"], lc: []}
  strand: F1
- id: division.by-two-digit.remainder
  concept: division
  facet: base-ten
  level: 3
  type: procedure
  name: Divide by a two-digit number with a remainder
  statement: "Find the whole-number quotient and the remainder of a dividend of up to four digits by a two-digit divisor, with the remainder less than the divisor, by any reliable method."
  assess: "Find the quotient and remainder of 200 divided by 60, and of 1,000 divided by 24. Use any method."
  sources: {ccss: ["5.NBT.B.6"], lc: []}
  strand: F1
- id: division.remainder.meaning
  concept: division
  facet: measurement
  level: 2
  type: concept
  name: A remainder is what is left after making as many whole groups as possible
  statement: "When a whole number of objects is put into as many groups of a given size as possible, the objects left over are the remainder; the remainder is always less than the group size, since otherwise one more group could be made."
  assess: "17 cubes are put into towers of 5 cubes. How many full towers are made, and how many cubes are left over? Could 6 cubes be left over? Why or why not?"
  sources: {ccss: ["4.NBT.B.6"], lc: []}
  strand: F1
- id: division.successive-division
  concept: division
  facet: unknown-factor
  level: 3
  type: concept
  name: Dividing by a and then by b is dividing by a x b
  statement: "For nonzero whole numbers a and b, dividing a number by a and then dividing the result by b gives the same quotient as dividing the number by a x b."
  assess: "Maya divides 720 by 8 and then divides that answer by 10. Without computing, what single division gives the same answer?"
  sources: {ccss: ["5.NBT.A.2"], lc: []}
  strand: F1

