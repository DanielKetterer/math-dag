# ---- shapes ----
- id: shapes.square-corner
  concept: shapes
  facet: properties
  level: 1
  type: concept
  name: A square corner
  statement: "A square corner is a corner of a shape that the corner of a sheet of paper or an index card fits exactly, with no gap on either side; whether a corner is square is checked by fitting such a corner into it."
  assess: "Test each corner of this four-sided shape with the corner of an index card. Which of its corners are square corners?"
  sources: {ccss: ["3.G.A.1"], lc: []}
  strand: F2
- id: shapes.name.prototype.rectangle-hexagon
  concept: shapes
  facet: core
  level: 1
  type: representation
  name: Name typical rectangles and hexagons
  statement: "Say the names rectangle and hexagon for typical examples of those shapes shown in their usual orientation."
  assess: "Show, one at a time, a rectangle resting on a long side and a regular hexagon resting on a side. 'What shape is this?' Credit the correct name for each."
  sources: {ccss: ["K.G.A.2"], lc: []}
  strand: F2
- id: shapes.rectangle.opposite-sides-equal
  concept: shapes
  facet: properties
  level: 2
  type: concept
  name: Opposite sides of a rectangle are equal
  statement: "In every rectangle each pair of opposite sides has the same length, so a rectangle has two sides of one length and two sides of another, or four equal sides when it is a square."
  assess: "A rectangle has one side 7 cm long and the side next to it 3 cm long. How long are the other two sides?"
  sources: {ccss: ["4.MD.A.3"], lc: []}
  strand: F2
- id: parallel.perpendicular-to-same-line
  concept: parallel
  facet: core
  level: 3
  type: concept
  name: Two lines perpendicular to the same line are parallel
  statement: "Two lines in a plane that are each perpendicular to the same line are parallel to each other."
  assess: "In this plane, lines p and q are each drawn perpendicular to line r. Are p and q parallel? How do you know without extending them?"
  sources: {ccss: ["5.G.B.4"], lc: []}
  strand: F2

# ---- attributes and units ----
- id: area.attribute
  concept: area
  facet: attribute
  level: 1
  type: concept
  name: Area is the amount of flat surface a figure covers
  statement: "The area of a flat figure is the amount of surface it covers, an attribute different from its length: a long thin strip can cover less surface than a short wide square."
  assess: "A long thin ribbon and a square sheet of paper lie on a table; the ribbon is longer. Which covers more of the table? Is the longer figure always the one that covers more?"
  sources: {ccss: ["3.MD.C.5"], lc: []}
  strand: F2
- id: volume.space-occupied
  concept: volume
  facet: attribute
  level: 1
  type: concept
  name: Volume is the amount of space a solid takes up
  statement: "The volume of a solid is the amount of space it takes up, an attribute different from its height: a short wide box can take up more space than a tall thin one."
  assess: "Which takes up more space, a basketball or a tennis ball? Can a taller object take up less space than a shorter one? Give an example."
  sources: {ccss: ["5.MD.C.3"], lc: []}
  strand: F2
- id: measurement.liquid-volume.liter-unit
  concept: measurement
  facet: liquid-volume
  level: 2
  type: concept
  name: The liter as a unit of liquid volume
  statement: "A liter is a standard unit of liquid volume, the amount of liquid that fills a 1-liter container; a liquid volume in liters is the number of times it fills that container."
  assess: "The water in this jug fills a 1-liter bottle exactly 3 times. How many liters of water are in the jug?"
  sources: {ccss: ["3.MD.A.2"], lc: []}
  strand: F2
- id: measurement.mass.gram-kilogram-unit
  concept: measurement
  facet: mass
  level: 2
  type: concept
  name: The gram and the kilogram as units of mass
  statement: "The gram and the kilogram are standard units of mass, a kilogram being much heavier than a gram; the mass of an object in grams or kilograms is the number of those unit masses that balance it on a pan balance."
  assess: "A bag of rice balances 2 one-kilogram masses on a pan balance. What is the mass of the bag? Is 1 gram heavier or lighter than 1 kilogram?"
  sources: {ccss: ["3.MD.A.2"], lc: []}
  strand: F2
- id: measurement.weight.ounces-pounds.measure
  concept: measurement
  facet: weight
  level: 2
  type: procedure
  name: Measure weight in ounces or pounds with a scale
  statement: "The weight of an object in ounces or pounds is read from a scale marked in that unit, reported as the number with the unit."
  assess: "A scale marked in ounces shows its pointer at 12. How much does the bag of beans on it weigh?"
  sources: {ccss: ["4.MD.A.1"], lc: []}
  strand: F2
- id: measurement.length.whole-plus-fraction
  concept: measurement
  facet: length
  level: 2
  type: representation
  name: A length of whole units plus a fraction of a unit
  statement: "A length of a whole number of units and a fraction of a unit more, such as 2 1/4 inches, is the point on a ruler or number line that fraction of the way from that whole-number mark to the next; it is written as the whole number followed by the fraction and read two and one fourth."
  assess: "On this inch ruler marked in fourths, mark 2 1/4 inches and 3 3/4 inches."
  sources: {ccss: ["3.MD.B.4"], lc: []}
  strand: F2
