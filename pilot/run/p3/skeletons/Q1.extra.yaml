new_concepts:
  - {concept: absolute-value, facet: distance, reason: "Absolute value as distance from 0 on the number line, and the distance between two numbers as |p - q| (6.NS.C.7.c-d, 7.NS.A.1.c); no existing concept holds it."}
  - {concept: absolute-value, facet: magnitude, reason: "Absolute value as the size of a signed quantity in context (a debt, a depth), a second meaning named separately in 6.NS.C.7.c-d."}
  - {concept: rational-number, facet: decimal-expansion, reason: "Decimal forms of rational numbers: long-division conversion, terminate-or-repeat, repeating decimal to fraction (7.NS.A.2.d, 8.NS.A.1)."}
  - {concept: real-number, facet: core, reason: "Irrational numbers and classifying numbers as rational or irrational (8.NS.A.1); rational-number does not cover numbers that are not rational."}
  - {concept: real-number, facet: decimal-expansion, reason: "Every number has a decimal expansion; rational approximations of irrational numbers by truncation or by squaring (8.NS.A.1-2)."}
retires:
  - {id: coordinate-plane.four-quadrants, replaced_by: [coordinate-plane.four-quadrants.plot, coordinate-plane.four-quadrants.read, coordinate-plane.four-quadrants.fraction-decimal.plot, coordinate-plane.four-quadrants.fraction-decimal.read], note: "The old id joined plotting and reading, and integer and fraction or decimal coordinates. Re-point an edge to .plot when the node graphs points with integer coordinates (most 6.EE, 6.G, 7.RP and 8.F uses), to .read when it reads coordinates off a graph, and to the .fraction-decimal variants only when its points have non-integer coordinates."}
  - {id: decimal.division.algorithm, replaced_by: [decimal.division.by-whole.algorithm, decimal.division.by-decimal.algorithm], note: "Re-point to decimal.division.by-decimal.algorithm when the divisor is a decimal (the general case; its last step uses the by-whole algorithm); re-point to decimal.division.by-whole.algorithm when only a whole-number divisor occurs, as in a unit price or mean of decimal data."}
  - {id: multiples.common-multiple, replaced_by: [factors.common-multiple.meaning, factors.common-multiple.product, factors.lcm.find], note: "References from common-denominator steps (adding, subtracting or comparing fractions with unlike denominators) need a common multiple, not the least one: re-point them as two routes, one to factors.common-multiple.product (use b x d) and one to factors.lcm.find. A reference that only needs to recognize a common multiple goes to factors.common-multiple.meaning."}
  - {id: rational-numbers.operations, replaced_by: [rational-number.addition.integers, rational-number.addition.rationals, rational-number.subtraction.integers, rational-number.subtraction.rationals, rational-number.multiplication.integers, rational-number.multiplication.rationals, rational-number.division.integers, rational-number.division.rationals], note: "Re-point each old edge to the operation(s) the citing node's test actually uses, and to the .integers variant when its numbers are all integers, the .rationals variant when signed fractions or decimals occur. Each .rationals node depends on its .integers sibling for the sign rule."}
covered_by: []
dropped: []
notes: "Reserved ids written as nodes: division.standard-algorithm.long-division, decimal.addition.algorithm, decimal.subtraction.algorithm, decimal.multiplication.algorithm, division.nonunit-fraction-by-whole, fraction.reciprocal (the last two are 6.NS.A.1 skills with no input component, so their lc lists are empty). Nodes written from standard text with no input component (lc []): division.equal-scaling.quotient-unchanged (the principle the divide-by-a-decimal algorithm rests on), factors.common-multiple.product (needed by the multiples.common-multiple retirement), rational-number.compare.integers and .compare.rationals (6.NS.C.7 ordering), the four .integers operation procedures, real-number.compare.approximation and real-number.expression.estimate (8.NS.A.2 text: compare irrationals, estimate pi^2). Range-rule splits: signed operations, comparison and absolute value are each split into integer and fraction-or-decimal nodes because the fraction or decimal version also needs fraction or decimal arithmetic; the 7.NS.A.3 'mathematical problems' components are cited on the .rationals procedures. The four 7.NS.A.3 real-world application nodes are split by operation and name the problem class (start plus change, change between two values, change per unit times units, total change shared equally); their statements do not name number types and their tests use decimals; a reviewer may want integer-only siblings. Merges I was unsure of: fa745fbb (dividend of at least 4 digits) into the long-division node; 95700724 (whole number divided by a decimal) and 3b40f296 into decimal.division.by-decimal.algorithm, since the same steps apply; f1a27da7 and 20e0f0fc into absolute-value.vs-order. Components cited twice because they carry two skills: 9bf54462 (common factor, GCF), 926bf4b0 (common multiple, LCM), 58c3fbf4 (plot and read, integer and fraction-decimal), 36d0fda5 (integer and fraction-decimal number line), 67ca75ab (additive inverse and its number-line justification), 5bb0a92d (distance rule and its justification), 056c6b51 (sign rule and its distributive justification), 9dd24851 (division sign rule and -(p/q) = (-p)/q = p/(-q)), ce4afd4b (addition and subtraction strategies), a622aa0e (irrational definition and classification), bac2efb6 and e96d5914 (truncation, square-root bounds, number line). Informal before formal: coordinate-plane.distance.same-coordinate uses the add-or-subtract-absolute-values rule, not |p - q|, which arrives with absolute-value.distance.between-numbers. Overlap to watch: rational-number.signed.represent-context (positions and values such as below zero or a deposit) versus the written rational-number.negative-as-decrease (a decrease as a change); kept separate. Ids owned elsewhere that these nodes will need: coordinate.ordered-pair.notation (F) for the plot and read nodes; equations.one-step (E1) for rational-number.repeating-decimal.to-fraction (solving 9x = 7.5); square roots and perfect squares (8.EE.A.2, another strand) for real-number.irrational.identify and real-number.approximate.square-root; the written division.by-zero.undefined for rational-number.integer-quotient. coordinate-plane.four-quadrants.fraction-decimal.plot and .read have no procedure list; their steps are those of the integer .plot and .read nodes, reading each coordinate on its axis scale. The 6.NS.C.8 mathematical application is narrowed to the missing-vertex class; polygons drawn from coordinates belong to 6.G.A.3."
