id: fraction.equivalent.multiply-principle.explain
concept: fraction
facet: part-whole
level: 4
type: justification
name: Explain why a/b = (n x a)/(n x b)
statement: 'Splitting each of the b parts into n equal parts multiplies the number of parts by n and the
  number of chosen parts by n, while the amount covered does not change; so (n x a)/(n x b) is the same
  amount as a/b, for every n.

  '
assess: Use a visual fraction model to explain why 2/3 = (4 x 2)/(4 x 3), and say why the same argument
  works for any n.
