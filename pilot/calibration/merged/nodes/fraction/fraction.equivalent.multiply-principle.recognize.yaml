id: fraction.equivalent.multiply-principle.recognize
concept: fraction
facet: measure
level: 3
type: procedure
name: Recognize equivalent fractions with a/b = (n x a)/(n x b)
statement: Decide whether two fractions are equivalent by checking whether one is obtained from the other
  by multiplying numerator and denominator by the same whole number.
procedure:
- Find whether the larger denominator is a whole-number multiple n of the smaller one.
- Check whether the corresponding numerator is the same multiple n.
- Conclude equivalent if both use the same n.
assess: Is 4/10 equivalent to 2/5? Is 6/8 equivalent to 3/5?
