id: fraction.compare.record-symbols
concept: fraction
facet: measure
level: 2
type: representation
name: Record fraction comparisons with >, =, <
statement: The result of comparing two fractions is written with the symbols >, =, or <.
assess: Write >, =, or < between 4/6 and 2/6.
sources:
  ccss:
  - 3.NF.A.3.d
  learning_components:
  - 2013ca22
requires:
- clause: standard
  all_of:
  - node: comparing.whole-numbers.symbols
    relation: representational
    points_to: statement
    why: The symbols >, =, < and their left-to-right reading are carried over from recording whole-number
      comparisons.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
  - node: fraction.compare.reasoning-size
    relation: definitional
    points_to: statement
    why: The statement records the result of comparing two fractions, so a fraction comparison must first
      be made.
    evidence:
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: disputed
  - node: fraction.compare.same-denominator
    relation: procedural
    points_to: assess
    why: The test item 4/6 versus 2/6 is decided by the same-denominator comparison before the symbol
      is written.
    scope: task
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    status: disputed
status: proposed
