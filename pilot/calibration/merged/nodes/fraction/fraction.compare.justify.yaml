id: fraction.compare.justify
concept: fraction
facet: part-whole
level: 2
type: justification
name: Justify a fraction comparison
statement: 'A comparison of fractions with the same numerator or the same denominator is justified by
  a model or an argument about part size and number of parts.

  '
assess: Use a drawing to show why 2/3 > 2/5.
sources:
  ccss:
  - 3.NF.A.3.d
  learning_components:
  - b77a918b
requires:
- clause: standard
  all_of:
  - node: fraction.compare.same-numerator
    relation: justificatory
    points_to: statement
    why: Justifying a same-numerator comparison such as 2/3 > 2/5 uses the argument that equal counts
      of larger parts give more.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
  - node: fraction.compare.same-denominator
    relation: justificatory
    points_to: statement
    why: Justifying a same-denominator comparison uses the argument that more parts of the same size give
      more.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
  - node: fraction.compare.same-whole
    relation: justificatory
    points_to: statement
    why: A justifying model is valid only if both fractions are drawn on wholes of the same size, which
      is the same-whole condition.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
  - node: fraction.non-unit.part-whole
    relation: representational
    points_to: statement
    why: The model in the justification draws each fraction as a shaded parts of a whole partitioned into
      b equal parts.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
  - node: partitioning.equal-shares.area
    relation: procedural
    points_to: assess
    why: The assessment drawing requires partitioning two same-size wholes into thirds and fifths to show
      2/3 > 2/5.
    scope: task
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    status: disputed
status: proposed
