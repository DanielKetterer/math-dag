id: fraction.application.compare-in-context
concept: fraction
facet: part-whole
level: 2
type: application
name: Compare fractions in a story about shares
statement: 'A story problem gives two fractional shares of same-size wholes; the learner decides which
  share is larger and explains why.

  '
assess: Ana ate 2/6 of a pizza and Ben ate 2/8 of a pizza the same size. Who ate more? Explain.
sources:
  ccss:
  - 3.NF.A.3.d
  learning_components: []
requires:
- clause: standard
  all_of:
  - node: fraction.compare.reasoning-size
    relation: procedural
    points_to: statement
    why: Deciding which fractional share in the story is larger uses reasoning about part size and number
      of parts.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
  - node: fraction.compare.justify
    relation: justificatory
    points_to: statement
    why: The learner must explain why one share is larger, which is justifying the comparison by part
      size and number of parts.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
  - node: fraction.compare.same-whole
    relation: justificatory
    points_to: statement
    why: The story's stipulation of same-size wholes, such as pizzas of the same size, is what makes the
      comparison of shares valid.
    evidence:
    - kind: content
      source: pass-A
    - kind: content
      source: pass-B
    - kind: content
      source: pass-C
    status: proposed
status: proposed
